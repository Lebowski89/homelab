---

################################
# CLEAN UP
################################

- name: Check if compose file exists
  ansible.builtin.stat:
    path: "{{ infisical_path }}/infisical-compose.yml"
  register: infisical_existing_compose_yaml
  tags: 
    - infisical_recreate
    - infisical_remove

- name: Infisical compose down
  when: infisical_existing_compose_yaml.stat.exists
  community.docker.docker_compose_v2:
    project_src: "{{ infisical_path }}"
    project_name: infisical
    files: infisical-compose.yml
    state: absent
  tags:
    - infisical_recreate
    - infisical_remove

- name: Remove compose file
  ansible.builtin.file:
    path: "{{ infisical_path }}/infisical-compose.yml"
    state: absent
  tags:
    - infisical_recreate
    - infisical_remove

################################
# DIRECTORIES
################################

- name: Create directories
  ansible.builtin.file:
    path: "{{ _infisical_dir.path }}"
    state: directory
    owner: "{{ _infisical_dir.owner }}"
    group: "{{ _infisical_dir.group }}"
    mode: "{{ _infisical_dir.mode }}"
  loop:
    - path: "{{ infisical_path }}"
      owner: "{{ puid }}"
      group: "{{ pgid }}"
      mode: "0755"
    - path: "{{ infisical_postgres_path }}"
      owner: "999"
      group: "999"
      mode: "0700"
    - path: "{{ infisical_redis_path }}"
      owner: "{{ puid }}"
      group: "{{ pgid }}"
      mode: "0755"
  loop_control:
    loop_var: _infisical_dir
  tags:
    - infisical_bootstrap
    - infisical_deploy
    - infisical_recreate

################################
# CONFIG
################################

- name: Template env file
  ansible.builtin.template:
    src: '{{ role_path }}/templates/infisical.env.j2'
    dest: '{{ infisical_path }}/.env'
    force: true
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0664"
  no_log: true
  tags:
    - infisical_bootstrap
    - infisical_deploy
    - infisical_recreate

################################
# SECRETS
################################

- name: Create Infisical secret files
  ansible.builtin.copy:
    dest: "{{ infisical_path }}/{{ _infisical_secrets_files.key }}"
    content: "{{ _infisical_secrets_files.value }}\n"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ infisical_secret_files | dict2items }}"
  loop_control:
    loop_var: _infisical_secrets_files
  no_log: true
  tags:
    - infisical_bootstrap
    - infisical_deploy
    - infisical_recreate

################################
# DEPLOY
################################

- name: Import Infisical compose file
  ansible.builtin.template:
    src: '{{ role_path }}/templates/infisical-compose.yml.j2'
    dest: "{{ infisical_path }}/infisical-compose.yml"
    force: true
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0664"
  tags:
    - infisical_deploy
    - infisical_recreate

- name: Infisical compose stack up
  community.docker.docker_compose_v2:
    project_src: "{{ infisical_path }}"
    files: infisical-compose.yml
    state: present
  tags:
    - infisical_deploy
    - infisical_recreate
