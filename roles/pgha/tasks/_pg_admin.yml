---

- name: Query Patroni cluster state from first PGHA node
  ansible.builtin.uri:
    url: "http://{{ hostvars[groups['pgha'][0]].local_ip }}:{{ pgha_patroni_restapi_port }}/cluster"
    method: GET
    return_content: true
    status_code: 200
  register: pgha_patroni_cluster_state
  run_once: true
  delegate_to: mgt

- name: Determine Patroni leader member
  ansible.builtin.set_fact:
    pgha_patroni_leader_member: >-
      {{
        (pgha_patroni_cluster_state.json.members
         | selectattr('role', 'equalto', 'leader')
         | list
         | first)
      }}
  run_once: true
  delegate_to: mgt

- name: Assert Patroni leader was found
  ansible.builtin.assert:
    that:
      - pgha_patroni_leader_member is defined
      - pgha_patroni_leader_member.name is defined
      - pgha_patroni_leader_member.host is defined
    fail_msg: "Could not determine Patroni leader from REST API."
  run_once: true
  delegate_to: mgt

- name: Build Patroni admin role flags
  ansible.builtin.set_fact:
    pgha_patroni_admin_role_flags: >-
      {{
        []
        + (['LOGIN'] if pgha_patroni_admin_role_login else [])
        + (['CREATEDB'] if pgha_patroni_admin_role_createdb else [])
        + (['CREATEROLE'] if pgha_patroni_admin_role_createrole else [])
      }}
  run_once: true
  delegate_to: mgt

- name: Ensure dedicated Patroni admin role exists on leader
  community.postgresql.postgresql_user:
    login_host: "{{ pgha_patroni_leader_member.host }}"
    login_port: "{{ pgha_patroni_postgres_port }}"
    login_user: "{{ pgha_patroni_superuser_name }}"
    login_password: "{{ pgha_patroni_superuser_pass }}"
    name: "{{ pgha_patroni_admin_role_name }}"
    password: "{{ pgha_patroni_admin_role_pass }}"
    role_attr_flags: "{{ pgha_patroni_admin_role_flags | join(',') }}"
    state: present
  run_once: true
  delegate_to: mgt
  no_log: true
