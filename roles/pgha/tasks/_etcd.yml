---

- name: Assert etcd vars are defined
  ansible.builtin.assert:
    that:
      - pgha_etcd_node_name is defined
      - pgha_etcd_node_name | length > 0
      - local_ip is defined
      - local_ip | length > 0
      - pgha_etcd_initial_cluster is defined
      - pgha_etcd_initial_cluster | length > 0
    fail_msg: "Required etcd variables are missing."

- name: Ensure etcd config directory exists
  ansible.builtin.file:
    path: "{{ pgha_etcd_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Ensure etcd data directory exists
  ansible.builtin.file:
    path: "{{ pgha_etcd_data_dir }}"
    state: directory
    owner: etcd
    group: etcd
    mode: "0700"

- name: Template etcd config
  ansible.builtin.template:
    src: etcd.conf.yml.j2
    dest: "{{ pgha_etcd_config_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart etcd

- name: Enable and start etcd
  ansible.builtin.systemd_service:
    name: etcd
    state: started
    enabled: true

- name: Wait for etcd client port
  ansible.builtin.wait_for:
    host: "{{ local_ip }}"
    port: "{{ pgha_etcd_client_port }}"
    timeout: 60
