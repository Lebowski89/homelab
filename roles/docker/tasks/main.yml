---

- name: Install Docker
  when: inventory_hostname in groups['docker_install']
  ansible.builtin.include_tasks:
    file: _install.yml
    apply:
      tags:
        - docker
        - docker_install
  tags:
    - docker
    - docker_install

- name: Configure Docker Swarm
  when: inventory_hostname in groups['swarm']
  ansible.builtin.include_tasks:
    file: _swarm.yml
    apply:
      tags:
        - docker
        - docker_swarm
  tags:
    - docker
    - docker_swarm
    - docker_swarm_init
    - docker_swarm_join
    - docker_swarm_network
    - docker_swarm_labels

- name: Docker Prune
  ansible.builtin.include_tasks:
    file: _prune.yml
    apply:
      tags:
        - docker_prune
  tags:
    - docker_prune
    - docker_prune_dangling
    - docker_prune_unused
    - docker_prune_volumes
