---

- name: Ensure python and apt prerequisites are installed
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - python3-apt
      - python3-debian
      - ca-certificates
      - software-properties-common
      - apt-utils
    state: present
    update_cache: true
  environment: "{{ ubuntu_apt_env_vars }}"

- name: Install common packages
  ansible.builtin.apt:
    name:
      - nano
      - zip
      - unzip
      - p7zip-full
      - curl
      - wget
      - tree
      - lsof
      - git
      - pwgen
      - rsync
      - logrotate
      - htop
      - iotop
      - nload
      - ufw
      - ncdu
      - mc
      - dnsutils
      - screen
      - tmux
      - apache2-utils
      - jq
      - moreutils
      - vnstat
      - pciutils
      - ethtool
      - man-db
      - unrar-free
    state: present
  environment: "{{ ubuntu_apt_env_vars }}"

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: full
    update_cache: true
    autoremove: false
    autoclean: false
  environment: "{{ ubuntu_apt_env_vars }}"

- name: Remove unnecessary packages
  ansible.builtin.apt:
    autoremove: true
    autoclean: true
