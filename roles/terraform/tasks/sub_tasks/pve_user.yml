---

- name: Assert required Terraform Proxmox user vars are defined
  ansible.builtin.assert:
    that:
      - terraform_primary_manager is defined
      - terraform_pve_host is defined
      - hostvars[terraform_pve_host].terraform_api_user is defined
      - hostvars[terraform_pve_host].terraform_api_token_name is defined
      - hostvars[terraform_pve_host].proxmox_api_bootstrap_user is defined
      - hostvars[terraform_pve_host].proxmox_api_bootstrap_password is defined
    fail_msg: "Required Terraform Proxmox user vars are missing."

- name: Manage Proxmox Terraform API objects
  delegate_to: "{{ terraform_primary_manager }}"
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ hostvars[terraform_pve_host].ansible_host }}"
      api_user: "{{ hostvars[terraform_pve_host].proxmox_api_bootstrap_user }}"
      api_password: "{{ hostvars[terraform_pve_host].proxmox_api_bootstrap_password }}"
      validate_certs: false
  block:
    - name: Ensure Terraform Proxmox role exists
      community.proxmox.proxmox_role:
        roleid: terraform
        privs:
          - Datastore.Allocate
          - Datastore.AllocateSpace
          - Datastore.AllocateTemplate
          - Datastore.Audit
          - Pool.Allocate
          - Pool.Audit
          - Sys.Audit
          - Sys.Console
          - Sys.Modify
          - VM.Allocate
          - VM.Audit
          - VM.Clone
          - VM.Config.CDROM
          - VM.Config.Cloudinit
          - VM.Config.CPU
          - VM.Config.Disk
          - VM.Config.HWType
          - VM.Config.Memory
          - VM.Config.Network
          - VM.Config.Options
          - VM.Migrate
          - VM.PowerMgmt
          - SDN.Use
        state: present

    - name: Ensure Terraform Proxmox user exists
      community.proxmox.proxmox_user:
        userid: "{{ hostvars[terraform_pve_host].terraform_api_user }}"
        state: present
        enable: true
        comment: "Terraform automation user"

    - name: Ensure Terraform role is assigned at root path
      community.proxmox.proxmox_access_acl:
        path: /
        roleid: terraform
        type: user
        ugid: "{{ hostvars[terraform_pve_host].terraform_api_user }}"
        propagate: true
        state: present

- name: List existing Terraform API tokens
  ansible.builtin.command:
    cmd: >-
      pveum user token list
      {{ hostvars[terraform_pve_host].terraform_api_user }}
      --output-format json
  register: terraform_pve_token_list
  changed_when: false
  become: true

- name: Determine whether Terraform API token needs to be created
  ansible.builtin.set_fact:
    terraform_pve_token_missing: >-
      {{
        (
          terraform_pve_token_list.stdout | from_json
          | selectattr('tokenid', 'equalto', hostvars[terraform_pve_host].terraform_api_token_name)
          | list
          | length
        ) == 0
      }}

- name: Create Terraform API token if missing
  when: terraform_pve_token_missing
  ansible.builtin.command:
    cmd: >-
      pveum user token add
      {{ hostvars[terraform_pve_host].terraform_api_user }}
      {{ hostvars[terraform_pve_host].terraform_api_token_name }}
      --privsep=0
      --output-format json
  register: terraform_pve_token_create
  become: true
  changed_when: terraform_pve_token_create.rc == 0

- name: Show Terraform API token secret once when created
  when: terraform_pve_token_missing
  ansible.builtin.debug:
    msg: >-
      Save this token secret now:
      {{ (terraform_pve_token_create.stdout | from_json).value }}

- name: Pause so operator can copy token
  when: terraform_pve_token_missing
  ansible.builtin.pause:
    prompt: "Copy the Terraform API token now, then press Enter to continue."
