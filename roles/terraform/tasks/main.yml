---

- name: Install Terraform on supported hosts
  when: inventory_hostname in groups['terraform_install']
  ansible.builtin.include_tasks:
    file: sub_tasks/install.yml
    apply:
      tags:
        - terraform
        - terraform_install
  tags:
    - terraform
    - terraform_install

- name: Configure Proxmox Terraform API access
  when: inventory_hostname in groups['terraform_pve_user']
  ansible.builtin.include_tasks:
    file: sub_tasks/pve_user.yml
    apply:
      tags:
        - terraform
        - terraform_pve_user
  tags:
    - terraform
    - terraform_pve_user
