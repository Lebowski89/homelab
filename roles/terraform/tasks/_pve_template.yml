---

- name: Check whether Proxmox template VM already exists
  ansible.builtin.command:
    cmd: "qm status {{ terraform_pve_template_vmid }}"
  register: terraform_template_status
  changed_when: false
  failed_when: false

- name: Prepare Proxmox template
  when: terraform_template_status.rc != 0
  block:
    - name: Download Ubuntu cloud image
      ansible.builtin.get_url:
        url: "{{ terraform_pve_template_image_url }}"
        dest: "{{ terraform_pve_template_image_path }}"
        mode: "0644"

    - name: Create base VM for cloud-init template
      ansible.builtin.command:
        cmd: >-
          qm create {{ terraform_pve_template_vmid }}
          --name {{ terraform_pve_template_name }}
          --memory 2048
          --cores 2
          --net0 virtio,bridge={{ terraform_pve_template_bridge }}
          --scsihw virtio-scsi-single
      changed_when: true

    - name: Import cloud image disk into Proxmox storage
      ansible.builtin.command:
        cmd: >-
          qm set {{ terraform_pve_template_vmid }}
          --scsi0 {{ terraform_pve_template_storage }}:0,import-from={{ terraform_pve_template_image_path }}
      changed_when: true

    - name: Add cloud-init drive
      ansible.builtin.command:
        cmd: >-
          qm set {{ terraform_pve_template_vmid }}
          --ide2 {{ terraform_pve_template_storage }}:cloudinit
      changed_when: true

    - name: Set boot disk
      ansible.builtin.command:
        cmd: >-
          qm set {{ terraform_pve_template_vmid }}
          --boot order=scsi0
      changed_when: true

    - name: Enable serial console
      ansible.builtin.command:
        cmd: >-
          qm set {{ terraform_pve_template_vmid }}
          --serial0 socket --vga serial0
      changed_when: true

    - name: Convert VM to template
      ansible.builtin.command:
        cmd: "qm template {{ terraform_pve_template_vmid }}"
      changed_when: true
