---

- name: Ensure source host exists
  ansible.builtin.assert:
    that:
      - (infisical_source_host | default('localhost')) in hostvars
    fail_msg: "infisical_source_host not found in hostvars"

# Mode A: Flatten distribution (requires repeating secrets_map)
- name: Ensure secrets_map is defined (flatten mode)
  when: (infisical_flatten | default(true)) | bool
  ansible.builtin.assert:
    that:
      - secrets_map is defined
      - secrets_map | length > 0
    fail_msg: "secrets_map must be defined and non-empty for flatten distribution"

- name: Distribute flattened vars from source host
  when:
    - (infisical_flatten | default(true)) | bool
    - inventory_hostname != (infisical_source_host | default('localhost'))
  ansible.builtin.set_fact:
    "{{ infisical_secret_item.var }}": "{{ hostvars[infisical_source_host | default('localhost')][infisical_secret_item.var] }}"
  loop: "{{ secrets_map }}"
  loop_control:
    loop_var: infisical_secret_item

# Mode B: Dict distribution (no secrets_map repetition)
- name: Distribute dict from source host
  when:
    - not (infisical_flatten | default(true)) | bool
    - inventory_hostname != (infisical_source_host | default('localhost'))
  ansible.builtin.set_fact:
    "{{ infisical_out_var | default('infisical_secrets') }}": "{{ hostvars[infisical_source_host | default('localhost')][infisical_out_var | default('infisical_secrets')] }}"