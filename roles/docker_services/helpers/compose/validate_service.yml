---

# helpers/compose/validate_service.yml

############################################
# VALIDATE (SVC PREP) - directories/templates/infisical
# Optional: only runs if universal svc var is in scope
############################################

- name: Validate | svc is defined (optional)
  when: svc is defined
  ansible.builtin.assert:
    that:
      - svc is mapping
    fail_msg: "svc must be a mapping when provided to validate_service.yml"

# ----------------------------
# svc.deploy.host (optional)
# ----------------------------
- name: Validate | svc.deploy.host (optional)
  when:
    - svc is defined
    - svc.deploy is defined
    - svc.deploy is mapping
    - svc.deploy.host is defined
  ansible.builtin.assert:
    that:
      - svc.deploy.host is string
      - (svc.deploy.host | trim | length) > 0
    fail_msg: "svc.deploy.host must be a non-empty string when provided."

# ----------------------------
# svc.directories (optional)
# ----------------------------
- name: Validate | svc.directories shape (optional)
  when:
    - svc is defined
    - svc.directories is defined
  ansible.builtin.assert:
    that:
      - svc.directories is sequence
      - svc.directories is not string
    fail_msg: "svc.directories must be a list of directory specs."

- name: Validate | svc.directories entries (optional)
  when:
    - svc is defined
    - svc.directories is defined
    - (svc.directories | length > 0)
  ansible.builtin.assert:
    that:
      - (svc.directories | select('mapping') | list | length) == (svc.directories | length)
      - (svc.directories | map(attribute='path') | select('defined') | list | length) == (svc.directories | length)
      - (svc.directories | map(attribute='path') | map('string') | map('trim') | reject('equalto','') | list | length) == (svc.directories | length)
    fail_msg: >-
      svc.directories must be a list of dicts and each entry must contain a non-empty 'path'.

- name: Validate | svc.directories mode formatting (optional)
  when:
    - svc is defined
    - svc.directories is defined
    - (svc.directories | length > 0)
  ansible.builtin.assert:
    that:
      - >
        (
          svc.directories
          | selectattr('mode','defined')
          | map(attribute='mode')
          | map('string')
          | map('trim')
          | map('regex_search', '^[0-7]{3,4}$')
          | reject('equalto', None)
          | list
          | length
        )
        ==
        (svc.directories | selectattr('mode','defined') | list | length)
    fail_msg: "If provided, directories[].mode must look like '755' or '0755'."

# ----------------------------
# svc.templates (optional)
# ----------------------------
- name: Validate | svc.templates shape (optional)
  when:
    - svc is defined
    - svc.templates is defined
  ansible.builtin.assert:
    that:
      - svc.templates is sequence
      - svc.templates is not string
    fail_msg: "svc.templates must be a list of template specs."

- name: Validate | svc.templates entries (optional)
  when:
    - svc is defined
    - svc.templates is defined
    - (svc.templates | length > 0)
  ansible.builtin.assert:
    that:
      - (svc.templates | select('mapping') | list | length) == (svc.templates | length)
      - (svc.templates | map(attribute='src') | select('defined') | list | length) == (svc.templates | length)
      - (svc.templates | map(attribute='dest') | select('defined') | list | length) == (svc.templates | length)
      - (svc.templates | map(attribute='src') | map('string') | map('trim') | reject('equalto','') | list | length) == (svc.templates | length)
      - (svc.templates | map(attribute='dest') | map('string') | map('trim') | reject('equalto','') | list | length) == (svc.templates | length)
    fail_msg: >-
      svc.templates must be a list of dicts and each entry must contain non-empty 'src' and 'dest'.

- name: Validate | svc.templates mode formatting (optional)
  when:
    - svc is defined
    - svc.templates is defined
    - (svc.templates | length > 0)
  ansible.builtin.assert:
    that:
      - >
        (
          svc.templates
          | selectattr('mode','defined')
          | map(attribute='mode')
          | map('string')
          | map('trim')
          | map('regex_search', '^[0-7]{3,4}$')
          | reject('equalto', None)
          | list
          | length
        )
        ==
        (svc.templates | selectattr('mode','defined') | list | length)
    fail_msg: "If provided, templates[].mode must look like '664' or '0664'."

- name: Validate | svc.templates force is boolean-ish (optional)
  when:
    - svc is defined
    - svc.templates is defined
    - (svc.templates | length > 0)
  ansible.builtin.assert:
    that:
      - >
        (
          svc.templates
          | selectattr('force','defined')
          | map(attribute='force')
          | map('bool')
          | list
          | length
        )
        ==
        (svc.templates | selectattr('force','defined') | list | length)
    fail_msg: "If provided, templates[].force must be a boolean."

# ----------------------------
# svc.infisical (optional)
# ----------------------------
- name: Validate | svc.infisical shape (optional)
  when:
    - svc is defined
    - svc.infisical is defined
  ansible.builtin.assert:
    that:
      - svc.infisical is mapping
    fail_msg: "svc.infisical must be a mapping."

- name: Validate | svc.infisical.secrets_map (optional)
  when:
    - svc is defined
    - svc.infisical is defined
    - svc.infisical.secrets_map is defined
  ansible.builtin.assert:
    that:
      - svc.infisical.secrets_map is sequence
      - svc.infisical.secrets_map is not string
      - (svc.infisical.secrets_map | select('mapping') | list | length) == (svc.infisical.secrets_map | length)
      - (svc.infisical.secrets_map | map(attribute='var')  | select('defined') | list | length) == (svc.infisical.secrets_map | length)
      - (svc.infisical.secrets_map | map(attribute='path') | select('defined') | list | length) == (svc.infisical.secrets_map | length)
      - (svc.infisical.secrets_map | map(attribute='name') | select('defined') | list | length) == (svc.infisical.secrets_map | length)
    fail_msg: "svc.infisical.secrets_map must be a list of dicts each containing var/path/name."

- name: Validate | svc.infisical.fail_on_empty is boolean-ish (optional)
  when:
    - svc is defined
    - svc.infisical is defined
    - svc.infisical.fail_on_empty is defined
  ansible.builtin.assert:
    that:
      - (svc.infisical.fail_on_empty | bool) is not none
    fail_msg: "svc.infisical.fail_on_empty must be boolean-ish."

############################################
# VALIDATE (COMPOSE SERVICE)
############################################

- name: Set current service vars
  ansible.builtin.set_fact:
    _svc_name: "{{ _svc_name | default(_svc_item.key, true) }}"
    _svc: "{{ _svc | default(_svc_item.value, true) | default({}, true) }}"
    _stack_type: "{{ _svc_deploy_type | default(stack_deploy_type, true) | default('swarm', true) | string | trim }}"

- name: Validate stack type value
  ansible.builtin.assert:
    that:
      - _stack_type in ['swarm', 'container']
    fail_msg: "Service '{{ _svc_name }}' has invalid deploy type '{{ _stack_type }}' (expected swarm|container)."

################################
# REQUIRED BASE KEYS
################################
- name: Basic required keys
  ansible.builtin.assert:
    that:
      - _svc is mapping
      - _svc.image is defined
      - (_svc.image | string | trim | length) > 0
    fail_msg: "Service '{{ _svc_name }}' must define a non-empty image."

################################
# LOGGING (optional but validated if present)
################################
- name: Validate logging (if present)
  when: _svc.logging is defined
  ansible.builtin.assert:
    that:
      - _svc.logging is mapping
      - _svc.logging.driver is defined
      - (_svc.logging.driver | string | trim | length) > 0
      - (_svc.logging.options is not defined) or (_svc.logging.options is mapping)
    fail_msg: "Service '{{ _svc_name }}' logging must be a dict with driver (non-empty) and optional options (dict)."

################################
# NETWORKS
################################
- name: Mutually exclusive network_mode vs networks (if both present)
  ansible.builtin.assert:
    that:
      - not ((_svc.network_mode is defined) and (_svc.networks is defined))
    fail_msg: "Service '{{ _svc_name }}' has both network_mode and networks; pick one."

################################
# TYPE CHECKS - OPTIONAL FIELDS
################################
- name: Type checks - optional fields
  ansible.builtin.assert:
    that:
      - (_svc.container_name is not defined) or (_svc.container_name is string)
      - (_svc.network_mode is not defined) or (_svc.network_mode is string)
      - (_svc.networks is not defined) or (_svc.networks is sequence and _svc.networks is not string)
      - (_svc.command is not defined) or (_svc.command is string) or (_svc.command is sequence and _svc.command is not string)
      - (_svc.environment is not defined) or (_svc.environment is mapping)
      - (_svc.labels is not defined) or (_svc.labels is mapping)
      - (_svc.ports is not defined) or (_svc.ports is sequence and _svc.ports is not string)
      - (_svc.volumes is not defined) or (_svc.volumes is sequence and _svc.volumes is not string)
      - (_svc.devices is not defined) or (_svc.devices is sequence and _svc.devices is not string)
      - (_svc.cap_add is not defined) or (_svc.cap_add is sequence and _svc.cap_add is not string)
      - (_svc.cap_drop is not defined) or (_svc.cap_drop is sequence and _svc.cap_drop is not string)
      - (_svc.user is not defined) or (_svc.user is string)
      - (_svc.shm_size is not defined) or (_svc.shm_size is string)
      - (_svc.depends_on is not defined) or (_svc.depends_on is sequence and _svc.depends_on is not string)
      - (_svc.security_opt is not defined) or (_svc.security_opt is sequence and _svc.security_opt is not string)
      - (_svc.secrets is not defined) or (_svc.secrets is string) or (_svc.secrets is sequence and _svc.secrets is not string)
    fail_msg: "Service '{{ _svc_name }}' has invalid types in one or more optional fields."

################################
# COMMAND (string OR list)
################################
- name: Validate command (if present)
  when: _svc.command is defined
  block:
    - name: Validate command string form
      when: _svc.command is string
      ansible.builtin.assert:
        that:
          - (_svc.command | trim | length) > 0
        fail_msg: "Service '{{ _svc_name }}' command (string) must be non-empty."

    - name: Validate command list form
      when: _svc.command is sequence and _svc.command is not string
      ansible.builtin.assert:
        that:
          - (_svc.command | length) > 0
          - (_svc.command | map('string') | map('trim') | reject('equalto', '') | list | length) == (_svc.command | length)
        fail_msg: "Service '{{ _svc_name }}' command (list) must contain non-empty strings."

################################
# DEPENDS_ON (compose-only)
################################
- name: Validate depends_on is only used for container stacks
  when: _svc.depends_on is defined
  ansible.builtin.assert:
    that:
      - _stack_type == 'container'
    fail_msg: "Service '{{ _svc_name }}' depends_on is compose-only (deploy.type must be 'container')."

- name: Validate depends_on entries (if present)
  when: _svc.depends_on is defined
  ansible.builtin.assert:
    that:
      - (_svc.depends_on | map('string') | map('trim') | reject('equalto','') | list | length) == (_svc.depends_on | length)
    fail_msg: "Service '{{ _svc_name }}' depends_on must be a list of non-empty strings."

################################
# SECURITY_OPT (compose-only)
################################
- name: Validate security_opt is only used for container stacks
  when: _svc.security_opt is defined
  ansible.builtin.assert:
    that:
      - _stack_type == 'container'
    fail_msg: "Service '{{ _svc_name }}' security_opt is compose-only (deploy.type must be 'container')."

- name: Validate security_opt entries (if present)
  when: _svc.security_opt is defined
  ansible.builtin.assert:
    that:
      - (_svc.security_opt | map('string') | map('trim') | reject('equalto','') | list | length) == (_svc.security_opt | length)
    fail_msg: "Service '{{ _svc_name }}' security_opt must be a list of non-empty strings."

################################
# PORTS
################################
- name: Validate ports items are dicts
  when: _svc.ports is defined
  ansible.builtin.assert:
    that:
      - (_svc.ports | select('mapping') | list | length) == (_svc.ports | length)
    fail_msg: "Service '{{ _svc_name }}' ports must be a list of dicts."

- name: Validate each port dict has required keys
  when: _svc.ports is defined and (_svc.ports | length > 0)
  ansible.builtin.assert:
    that:
      - (_svc.ports | map(attribute='target') | select('defined') | list | length) == (_svc.ports | length)
      - (_svc.ports | map(attribute='published') | select('defined') | list | length) == (_svc.ports | length)
    fail_msg: "Service '{{ _svc_name }}' ports entries must include target and published."

- name: Validate port values are valid
  when: _svc.ports is defined and (_svc.ports | length > 0)
  block:
    - name: Validate target/published are valid port numbers
      ansible.builtin.assert:
        that:
          - >
            (_svc.ports | map(attribute='target') | map('int') | select('>=', 1) | select('<=', 65535) | list | length)
            == (_svc.ports | length)
          - >
            (_svc.ports | map(attribute='published') | map('int') | select('>=', 1) | select('<=', 65535) | list | length)
            == (_svc.ports | length)
        fail_msg: "Service '{{ _svc_name }}' ports target/published must be integers between 1 and 65535."

    - name: Validate protocol is tcp/udp when present
      when: (_svc.ports | selectattr('protocol', 'defined') | list | length) > 0
      ansible.builtin.assert:
        that:
          - >
            (
              _svc.ports
              | selectattr('protocol', 'defined')
              | map(attribute='protocol')
              | map('string')
              | map('lower')
              | select('in', ['tcp', 'udp'])
              | list
              | length
            ) == (_svc.ports | selectattr('protocol', 'defined') | list | length)
        fail_msg: "Service '{{ _svc_name }}' ports protocol must be 'tcp' or 'udp' when set."

    - name: Validate mode is ingress/host when present
      when: (_svc.ports | selectattr('mode', 'defined') | list | length) > 0
      ansible.builtin.assert:
        that:
          - >
            (
              _svc.ports
              | selectattr('mode', 'defined')
              | map(attribute='mode')
              | map('string')
              | map('lower')
              | select('in', ['ingress', 'host'])
              | list
              | length
            ) == (_svc.ports | selectattr('mode', 'defined') | list | length)
        fail_msg: "Service '{{ _svc_name }}' ports mode must be 'ingress' or 'host' when set."

################################
# VOLUMES (bind | volume | tmpfs)
################################
- name: Validate volumes items are dicts
  when: _svc.volumes is defined
  ansible.builtin.assert:
    that:
      - (_svc.volumes | select('mapping') | list | length) == (_svc.volumes | length)
    fail_msg: "Service '{{ _svc_name }}' volumes must be a list of dicts."

- name: Validate volume dict shapes
  when: _svc.volumes is defined and (_svc.volumes | length > 0)
  block:
    - name: All volumes must have a type
      ansible.builtin.assert:
        that:
          - (_svc.volumes | map(attribute='type') | select('defined') | list | length) == (_svc.volumes | length)
        fail_msg: "Service '{{ _svc_name }}' volumes entries must include type."

    - name: Volumes.type must be bind, volume, or tmpfs
      ansible.builtin.assert:
        that:
          - >
            (
              _svc.volumes
              | map(attribute='type')
              | map('string')
              | map('lower')
              | reject('in', ['bind', 'volume', 'tmpfs'])
              | list
              | length
            ) == 0
        fail_msg: "Service '{{ _svc_name }}' volumes.type must be 'bind', 'volume', or 'tmpfs'."

    - name: Validate bind/volume mounts have source/target
      ansible.builtin.assert:
        that:
          - >
            (
              _svc.volumes
              | selectattr('type','in',['bind','volume'])
              | selectattr('source','defined')
              | selectattr('target','defined')
              | list
              | length
            )
            ==
            (_svc.volumes | selectattr('type','in',['bind','volume']) | list | length)
        fail_msg: "Service '{{ _svc_name }}' bind/volume mounts must have source and target."

    - name: Validate tmpfs mounts have target; tmpfs.size optional int>=0
      ansible.builtin.assert:
        that:
          - >
            (
              _svc.volumes
              | selectattr('type','equalto','tmpfs')
              | selectattr('target','defined')
              | list
              | length
            )
            ==
            (_svc.volumes | selectattr('type','equalto','tmpfs') | list | length)
          - >
            (
              _svc.volumes
              | selectattr('type','equalto','tmpfs')
              | selectattr('tmpfs','defined')
              | selectattr('tmpfs','mapping')
              | selectattr('tmpfs.size','defined')
              | map(attribute='tmpfs')
              | map(attribute='size')
              | map('int')
              | select('>=', 0)
              | list
              | length
            )
            ==
            (
              _svc.volumes
              | selectattr('type','equalto','tmpfs')
              | selectattr('tmpfs','defined')
              | selectattr('tmpfs','mapping')
              | selectattr('tmpfs.size','defined')
              | list
              | length
            )
        fail_msg: "Service '{{ _svc_name }}' tmpfs volumes must have target; and if tmpfs.size is set it must be int >= 0."

################################
# DEVICES / CAPS
################################
- name: Validate devices is list of non-empty strings (if present)
  when: _svc.devices is defined
  ansible.builtin.assert:
    that:
      - (_svc.devices | map('string') | map('trim') | reject('equalto', '') | list | length) == (_svc.devices | length)
    fail_msg: "Service '{{ _svc_name }}' devices must be a list of non-empty strings."

- name: Validate cap_add / cap_drop are lists of non-empty strings (if present)
  when: _svc.cap_add is defined or _svc.cap_drop is defined
  ansible.builtin.assert:
    that:
      - (_svc.cap_add is not defined) or ((_svc.cap_add | map('string') | map('trim') | reject('equalto','') | list | length) == (_svc.cap_add | length))
      - (_svc.cap_drop is not defined) or ((_svc.cap_drop | map('string') | map('trim') | reject('equalto','') | list | length) == (_svc.cap_drop | length))
    fail_msg: "Service '{{ _svc_name }}' cap_add/cap_drop must be lists of non-empty strings."

################################
# SECRETS (string OR list-of-strings OR list-of-dicts)
################################
- name: Validate secrets (if present)
  when: _svc.secrets is defined
  block:
    - name: secrets string form
      when: _svc.secrets is string
      ansible.builtin.assert:
        that:
          - (_svc.secrets | trim | length) > 0
        fail_msg: "Service '{{ _svc_name }}' secrets (string) must be non-empty."

    - name: secrets list form (strings OR dicts)
      when: _svc.secrets is sequence and _svc.secrets is not string
      block:
        - name: secrets list must be non-empty
          ansible.builtin.assert:
            that:
              - (_svc.secrets | length) > 0
            fail_msg: "Service '{{ _svc_name }}' secrets (list) must not be empty."

        - name: Validate secrets list items are strings or dicts
          ansible.builtin.assert:
            that:
              - (_svc.secrets | select('string') | list | length) + (_svc.secrets | select('mapping') | list | length) == (_svc.secrets | length)
            fail_msg: "Service '{{ _svc_name }}' secrets entries must be strings or dicts."

        - name: Validate secret strings are non-empty
          when: (_svc.secrets | select('string') | list | length) > 0
          ansible.builtin.assert:
            that:
              - (_svc.secrets | select('string') | map('trim') | reject('equalto','') | list | length) == (_svc.secrets | select('string') | list | length)
            fail_msg: "Service '{{ _svc_name }}' secrets string entries must be non-empty."

        - name: Validate secret dicts have source and target
          when: (_svc.secrets | select('mapping') | list | length) > 0
          ansible.builtin.assert:
            that:
              - (_svc.secrets | select('mapping') | map(attribute='source') | select('defined') | list | length) == (_svc.secrets | select('mapping') | list | length)
              - (_svc.secrets | select('mapping') | map(attribute='target') | select('defined') | list | length) == (_svc.secrets | select('mapping') | list | length)
            fail_msg: "Service '{{ _svc_name }}' secrets dict entries must include source and target."

################################
# HEALTHCHECK (only requires test)
################################
- name: Validate healthcheck keys (if present)
  when: _svc.healthcheck is defined
  ansible.builtin.assert:
    that:
      - _svc.healthcheck is mapping
      - _svc.healthcheck.test is defined
      - >
        (
          (_svc.healthcheck.test is sequence and _svc.healthcheck.test is not string and (_svc.healthcheck.test | length > 0))
          or
          (_svc.healthcheck.test is string and (_svc.healthcheck.test | trim | length > 0))
        )
    fail_msg: "Service '{{ _svc_name }}' healthcheck must include a non-empty test (string or list)."

################################
# DEPLOY (container vs swarm)
################################
- name: Ensure deploy is not present for container stacks
  when: _stack_type == 'container'
  ansible.builtin.assert:
    that:
      - _svc.deploy is not defined
    fail_msg: "Service '{{ _svc_name }}' has deploy configured, but deploy.type=container."

- name: Validate deploy when swarm
  when: _stack_type == 'swarm' and _svc.deploy is defined
  block:
    - name: deploy must be a dict
      ansible.builtin.assert:
        that:
          - _svc.deploy is mapping
        fail_msg: "Service '{{ _svc_name }}' deploy must be a dict."

    - name: placement constraints type (if present)
      when: _svc.deploy.placement is defined and _svc.deploy.placement.constraints is defined
      ansible.builtin.assert:
        that:
          - _svc.deploy.placement.constraints is sequence
          - _svc.deploy.placement.constraints is not string
        fail_msg: "Service '{{ _svc_name }}' deploy.placement.constraints must be a list."

    - name: restart_policy type (if present)
      when: _svc.deploy.restart_policy is defined
      ansible.builtin.assert:
        that:
          - _svc.deploy.restart_policy is mapping
        fail_msg: "Service '{{ _svc_name }}' deploy.restart_policy must be a dict."

    - name: update_config type (if present)
      when: _svc.deploy.update_config is defined
      ansible.builtin.assert:
        that:
          - _svc.deploy.update_config is mapping
        fail_msg: "Service '{{ _svc_name }}' deploy.update_config must be a dict."

    - name: rollback_config type (if present)
      when: _svc.deploy.rollback_config is defined
      ansible.builtin.assert:
        that:
          - _svc.deploy.rollback_config is mapping
        fail_msg: "Service '{{ _svc_name }}' deploy.rollback_config must be a dict."

    - name: resources type (if present)
      when: _svc.deploy.resources is defined
      ansible.builtin.assert:
        that:
          - _svc.deploy.resources is mapping
        fail_msg: "Service '{{ _svc_name }}' deploy.resources must be a dict."
