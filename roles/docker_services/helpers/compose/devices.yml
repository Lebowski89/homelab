---

- name: Ensure docker_services_service_name is set
  ansible.builtin.assert:
    that:
      - docker_services_service_name is defined
      - docker_services_service_name | string | trim | length > 0
    fail_msg: "docker_services_service_name must be set before calling this helper"

- name: Ensure devices_action is valid
  ansible.builtin.assert:
    that:
      - devices_action | default('append') in ['append', 'replace', 'append_unique']
    fail_msg: "devices_action must be 'append', 'replace', or 'append_unique'"

# Accept either:
# - device_list: [" /dev/dri:/dev/dri ", ...]
# - device: "/dev/dri:/dev/dri"
- name: Normalize devices input
  ansible.builtin.set_fact:
    _devices_new: >-
      {{
        (
          device_list
          if (device_list is defined)
          else
          ([device] if device is defined else [])
        )
        | default([], true)
        | list
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | list
      }}

- name: Add devices for service (append/replace/append_unique)
  ansible.builtin.set_fact:
    docker_services_compose_services: >-
      {{
        (docker_services_compose_services | default({}))
        | combine({
            docker_services_service_name: (
              ((docker_services_compose_services | default({})).get(docker_services_service_name, {}))
              | combine({
                  'devices': (
                    _devices_new
                    if (devices_action | default('append')) == 'replace'
                    else
                    (
                      (
                        ((docker_services_compose_services | default({})).get(docker_services_service_name, {}).get('devices', []))
                        | default([], true)
                        | list
                      )
                      +
                      (
                        _devices_new
                        if (devices_action | default('append')) == 'append'
                        else
                        (
                          _devices_new
                          | reject(
                              'in',
                              (
                                (docker_services_compose_services | default({}))
                                .get(docker_services_service_name, {})
                                .get('devices', [])
                                | default([], true)
                                | list
                              )
                            )
                          | list
                        )
                      )
                    )
                  )
                }, recursive=true)
            )
          }, recursive=true)
      }}
