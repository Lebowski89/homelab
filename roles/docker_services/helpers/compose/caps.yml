---

- name: Ensure service_name is set
  ansible.builtin.assert:
    that:
      - service_name is defined
      - service_name | string | trim | length > 0
    fail_msg: "service_name must be set before calling this helper"

# caps_target: cap_add | cap_drop
- name: Ensure caps_target is valid
  ansible.builtin.assert:
    that:
      - caps_target is defined
      - caps_target | string | trim in ['cap_add', 'cap_drop']
    fail_msg: "caps_target must be 'cap_add' or 'cap_drop'"

- name: Ensure caps_action is valid
  ansible.builtin.assert:
    that:
      - caps_action | default('append') in ['append', 'replace', 'append_unique']
    fail_msg: "caps_action must be 'append', 'replace', or 'append_unique'"

# Accept either:
# - caps_list: ["NET_ADMIN", ...]
# - cap: "NET_ADMIN"
- name: Normalize caps input
  ansible.builtin.set_fact:
    _caps_new: >-
      {{
        (
          caps_list
          if (caps_list is defined)
          else
          ([cap] if cap is defined else [])
        )
        | default([], true)
        | list
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | list
      }}

- name: Add caps for service (append/replace/append_unique)
  ansible.builtin.set_fact:
    compose_services: >-
      {{
        (compose_services | default({}))
        | combine({
            service_name: (
              ((compose_services | default({})).get(service_name, {}))
              | combine({
                  (caps_target | string | trim): (
                    _caps_new
                    if (caps_action | default('append')) == 'replace'
                    else
                    (
                      (
                        ((compose_services | default({})).get(service_name, {}).get((caps_target | string | trim), []))
                        | default([], true)
                        | list
                      )
                      +
                      (
                        _caps_new
                        if (caps_action | default('append')) == 'append'
                        else
                        (
                          _caps_new
                          | reject('in', ((compose_services | default({})).get(service_name, {}).get((caps_target | string | trim), []) | default([], true) | list))
                          | list
                        )
                      )
                    )
                  )
                }, recursive=true)
            )
          }, recursive=true)
      }}
