---

- name: Ensure stack_name is provided
  ansible.builtin.assert:
    that:
      - stack_name is defined
      - stack_name is string
      - (stack_name | trim | length) > 0
    fail_msg: "stack_name must be provided (non-empty string) when calling stack_networks.yml"

- name: Ensure stack_network_names is provided (list or mapping)
  ansible.builtin.assert:
    that:
      - stack_network_names is defined
      - stack_network_names is not none
      - (stack_network_names is mapping) or (stack_network_names is sequence and stack_network_names is not string)
    fail_msg: "stack_network_names must be a mapping of network defs or a list of network names."

- name: Normalize stack networks input into a mapping
  ansible.builtin.set_fact:
    _stack_networks_new: >-
      {%- if stack_network_names is mapping -%}
      {{ stack_network_names }}
      {%- else -%}
      {%- set out = {} -%}
      {%- for n in (stack_network_names | map('string') | map('trim') | reject('equalto','') | list) -%}
      {%- set _ = out.update({ n: {'external': true} }) -%}
      {%- endfor -%}
      {{ out }}
      {%- endif -%}

- name: Default external=true for any network defs that omit it
  when: _stack_networks_new is mapping and (_stack_networks_new | length > 0)
  ansible.builtin.set_fact:
    _stack_networks_new: >-
      {%- set out = {} -%}
      {%- for k, v in (_stack_networks_new | default({}) | dictsort) -%}
      {%- set vv = (v if (v is mapping) else {}) -%}
      {%- if vv.external is not defined -%}
      {%- set vv = vv | combine({'external': true}, recursive=true) -%}
      {%- endif -%}
      {%- set _ = out.update({k: vv}) -%}
      {%- endfor -%}
      {{ out }}

# IMPORTANT: store stack networks centrally on localhost so deploy/render can always access them
- name: Merge into compose_stacks[stack_name].networks (centralized on localhost)
  ansible.builtin.set_fact:
    compose_stacks: >-
      {%- set st = (hostvars['localhost'].compose_stacks | default({})) -%}
      {%- set existing_stack = st.get(stack_name, {}) -%}
      {%- set existing_nets = existing_stack.get('networks', {}) | default({}, true) -%}
      {%- set merged_stack = existing_stack | combine({'networks': (existing_nets | combine(_stack_networks_new, recursive=true))}, recursive=true) -%}
      {{ st | combine({ stack_name: merged_stack }, recursive=true) }}
  delegate_to: localhost
  delegate_facts: true
  run_once: true