---

- name: Ensure service_name is set
  ansible.builtin.assert:
    that:
      - service_name is defined
      - service_name | string | trim | length > 0
    fail_msg: "service_name must be set before calling this helper"

- name: Ensure volumes_action is valid
  ansible.builtin.assert:
    that:
      - volumes_action | default('append') in ['append', 'replace', 'append_unique']
    fail_msg: "volumes_action must be 'append', 'replace', or 'append_unique'"

# Accept:
#   - volumes: mapping of named entries OR list of entries
#   - volumes_list: list of entries
#   - legacy single entry via paths_* vars
- name: Build raw volume entries (mapping OR list OR legacy single)
  ansible.builtin.set_fact:
    _volumes_new_raw: >-
      {{
        (
          (volumes.values() | list) if (volumes is defined and volumes is mapping)
          else (volumes | list) if (volumes is defined)
          else (volumes_list | default([], true) | list) if (volumes_list is defined)
          else
          [
            {
              'type': (paths_type | default('bind', true) | string | trim),
              'source': (paths_host | default('', true) | string),
              'target': (paths_container | default('', true) | string),
              'read_only': (paths_read_only | default(false)) | bool
            }
          ]
        )
      }}

- name: Validate raw volume entries are dicts
  ansible.builtin.assert:
    that:
      - (_volumes_new_raw | select('mapping') | list | length) == (_volumes_new_raw | length)
    fail_msg: "volumes must be a list (or mapping) of dicts."

- name: Reset working volumes list (prevent cross-service bleed)
  ansible.builtin.set_fact:
    _volumes_new: []

# Canonicalise:
# - type defaults to bind
# - bind/volume: require source+target; read_only defaults false
# - tmpfs: require target; tmpfs.size if present -> int
- name: Canonicalise new volume entries
  ansible.builtin.set_fact:
    _volumes_new: "{{ _volumes_new | default([]) + [ _canon ] }}"
  vars:
    _t: "{{ (v.type | default('bind', true) | string | trim) }}"
    _src: "{{ (v.source | default('', true) | string | trim) }}"
    _tgt: "{{ (v.target | default('', true) | string | trim) }}"
    _ro: "{{ (v.read_only | default(false)) | bool }}"
    _tmpfs_base: >-
      {{
        (v.tmpfs | default({}, true))
        if (v.tmpfs is defined and v.tmpfs is mapping)
        else {}
      }}
    _tmpfs_norm: >-
      {{
        (_tmpfs_base | combine({'size': (_tmpfs_base.size | int)}))
        if (_tmpfs_base is mapping and _tmpfs_base.size is defined)
        else _tmpfs_base
      }}
    _canon: >-
      {%- if _t == 'tmpfs' -%}
      {{
        {
          'type': 'tmpfs',
          'target': _tgt,
          'tmpfs': _tmpfs_norm
        }
      }}
      {%- else -%}
      {{
        {
          'type': _t,
          'source': _src,
          'target': _tgt,
          'read_only': _ro
        }
      }}
      {%- endif -%}
  loop: "{{ _volumes_new_raw }}"
  loop_control:
    loop_var: v

- name: Validate canonical volume entries
  ansible.builtin.assert:
    that:
      - _t in ['bind', 'volume', 'tmpfs']
      - (_t != 'tmpfs') or (_tgt | length > 0)
      - (_t == 'tmpfs') or (_src | length > 0)
      - (_t == 'tmpfs') or (_tgt | length > 0)
      - (_t != 'tmpfs') or (_tmpfs_ok)
    fail_msg: >-
      Invalid volume entry for service '{{ service_name }}':
      type='{{ _t }}', source='{{ _src }}', target='{{ _tgt }}', tmpfs='{{ vcanon.tmpfs | default(omit) }}'
  vars:
    _t: "{{ vcanon.type | default('bind', true) | string | trim }}"
    _src: "{{ vcanon.source | default('', true) | string | trim }}"
    _tgt: "{{ vcanon.target | default('', true) | string | trim }}"
    _tmpfs_ok: >-
      {{
        (vcanon.tmpfs is not defined)
        or (
          (vcanon.tmpfs is mapping)
          and (
            (vcanon.tmpfs.size is not defined)
            or ((vcanon.tmpfs.size | int) >= 0)
          )
        )
      }}
  loop: "{{ _volumes_new }}"
  loop_control:
    loop_var: vcanon

- name: Capture existing volumes list
  ansible.builtin.set_fact:
    _volumes_existing: >-
      {{
        ((compose_services | default({})).get(service_name, {}).get('volumes', []))
        | default([], true)
        | list
      }}

- name: Compute merged volumes list (append/replace/append_unique)
  ansible.builtin.set_fact:
    _volumes_merged: >-
      {%- set action = (volumes_action | default('append')) -%}
      {%- if action == 'replace' -%}
      {{ _volumes_new }}
      {%- elif action == 'append' -%}
      {{ _volumes_existing + _volumes_new }}
      {%- else -%}
      {%- set seen = {} -%}
      {%- set out = [] -%}

      {%- for v in _volumes_existing -%}
      {%- set t = (v.type | default('bind', true) | string | trim) -%}
      {%- if t in ['bind','volume'] -%}
      {%- set k = t ~ ':' ~ (v.source | default('') | string) ~ '->' ~ (v.target | default('') | string) -%}
      {%- elif t == 'tmpfs' -%}
      {%- set k = 'tmpfs:' ~ (v.target | default('') | string) -%}
      {%- else -%}
      {%- set k = t ~ ':' ~ (v.target | default('') | string) -%}
      {%- endif -%}
      {%- if k not in seen -%}
      {%- set _ = seen.update({k: true}) -%}
      {%- set _ = out.append(v) -%}
      {%- endif -%}
      {%- endfor -%}

      {%- for v in _volumes_new -%}
      {%- set t = (v.type | default('bind', true) | string | trim) -%}
      {%- if t in ['bind','volume'] -%}
      {%- set k = t ~ ':' ~ (v.source | default('') | string) ~ '->' ~ (v.target | default('') | string) -%}
      {%- elif t == 'tmpfs' -%}
      {%- set k = 'tmpfs:' ~ (v.target | default('') | string) -%}
      {%- else -%}
      {%- set k = t ~ ':' ~ (v.target | default('') | string) -%}
      {%- endif -%}
      {%- if k not in seen -%}
      {%- set _ = seen.update({k: true}) -%}
      {%- set _ = out.append(v) -%}
      {%- endif -%}
      {%- endfor -%}

      {{ out }}
      {%- endif -%}

- name: Attach volumes to service
  ansible.builtin.set_fact:
    compose_services: >-
      {{
        (compose_services | default({}))
        | combine({
            service_name: (
              ((compose_services | default({})).get(service_name, {}))
              | combine({ 'volumes': _volumes_merged }, recursive=true)
            )
          }, recursive=true)
      }}