---

################################
# CREDS (SELF-CONTAINED VIA INFISICAL)
################################

# Optional knobs (set in group_vars/all if you want):
# postgres_infisical_path: "/Postgres"
# postgres_infisical_user_name: "USER"
# postgres_infisical_pass_name: "PASS"

- name: Postgres | Ensure creds exist (fetch from Infisical if missing)
  when: inventory_hostname == "localhost"
  block:
    - name: Postgres | Detect if creds are missing
      ansible.builtin.set_fact:
        _pg_creds_missing: >-
          {{
            (postgres_user | default('') | string | trim | length == 0)
            or
            (postgres_pass | default('') | string | trim | length == 0)
          }}

    - name: Postgres | Fetch postgres_user/postgres_pass from Infisical (only if missing)
      when: _pg_creds_missing | bool
      ansible.builtin.include_tasks: "{{ role_path }}/helpers/prep/infisical.yml"
      vars:
        infisical_fail_on_empty: true
        infisical_flatten: true
        secrets_map:
          - var: postgres_user
            path: "{{ postgres_infisical_path | default('/Postgres') }}"
            name: "{{ postgres_infisical_user_name | default('USER') }}"
          - var: postgres_pass
            path: "{{ postgres_infisical_path | default('/Postgres') }}"
            name: "{{ postgres_infisical_pass_name | default('PASS') }}"

    - name: Postgres | Assert creds are now present
      ansible.builtin.assert:
        that:
          - (postgres_user | default('') | string | trim | length) > 0
          - (postgres_pass | default('') | string | trim | length) > 0
        fail_msg: "postgres_user/postgres_pass are still empty on localhost after Infisical fetch."

################################
# DOCKER SECRET
################################

- name: Prepare Postgres docker secret
  when: inventory_hostname == "localhost"
  community.docker.docker_secret:
    name: postgres_pass_secret
    data: "{{ postgres_pass }}"
    state: present

################################
# DATABASE
################################

- name: Normalize postgres database list from docker_services_svc schema
  when:
    - inventory_hostname == "localhost"
    - docker_services_svc.postgres is defined
    - (docker_services_svc.postgres.enable | default(false)) | bool
  ansible.builtin.set_fact:
    _postgres_databases: >-
      {{
        (docker_services_svc.postgres.databases | list)
        if (
          docker_services_svc.postgres.databases is defined
          and docker_services_svc.postgres.databases is sequence
          and docker_services_svc.postgres.databases is not string
        )
        else
        ([ (docker_services_svc.postgres.databases | string | trim) ]
          if (docker_services_svc.postgres.databases is defined and (docker_services_svc.postgres.databases | string | trim | length > 0))
          else
          [])
      }}

- name: Ping for existing database(s)
  when:
    - inventory_hostname == "localhost"
    - (_postgres_databases | default([]) | length) > 0
  community.postgresql.postgresql_ping:
    login_host: 192.168.80.45
    login_user: "{{ postgres_user }}"
    login_password: "{{ postgres_pass }}"
    login_port: 5433
    login_db: "{{ postgres_db_item }}"
  loop: "{{ _postgres_databases }}"
  loop_control:
    loop_var: postgres_db_item
  register: postgres_ping_results

- name: Create postgres database(s) if missing
  when:
    - inventory_hostname == "localhost"
    - postgres_ping_results is defined
    - postgres_ping_result is defined
    - not (postgres_ping_result.is_available | default(false))
  community.postgresql.postgresql_db:
    login_host: 192.168.80.45
    login_user: "{{ postgres_user }}"
    login_password: "{{ postgres_pass }}"
    login_port: 5433
    name: "{{ postgres_ping_result.postgres_db_item }}"
    state: present
  loop: "{{ postgres_ping_results.results | default([]) }}"
  loop_control:
    loop_var: postgres_ping_result
    label: "{{ postgres_ping_result.postgres_db_item }}"
