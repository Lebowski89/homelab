---

- name: Ensure copies is provided
  ansible.builtin.assert:
    that:
      - copies is defined
      - copies is sequence
      - copies is not string
    fail_msg: "copies must be a list of copy definitions."

# Default docker_services_deploy_host to mgt if not provided (safe for swarm managers)
- name: Normalize deploy host
  ansible.builtin.set_fact:
    _deploy_host: "{{ docker_services_deploy_host | default(docker_swarm_primary_manager, true) | string | trim }}"

- name: Validate each copy copy_prep has src/dest
  ansible.builtin.assert:
    that:
      - copy_prep is mapping
      - copy_prep.src is defined
      - (copy_prep.src | string | trim | length > 0)
      - copy_prep.dest is defined
      - (copy_prep.dest | string | trim | length > 0)
    fail_msg: "Each copies[] entry must be a dict with non-empty src and dest."
  loop: "{{ copies }}"
  loop_control:
    loop_var: copy_prep
    label: "{{ (copy_prep.dest | default('')) }}"

- name: Copy files (role-relative src)
  ansible.builtin.copy:
    src: "{{ role_path }}/{{ copy_prep.src | string | trim }}"
    dest: "{{ copy_prep.dest | string | trim }}"
    force: "{{ copy_prep.force | default(false) | bool }}"
    owner: "{{ copy_prep.owner | default(default_owner, true) }}"
    group: "{{ copy_prep.group | default(default_group, true) }}"
    mode: "{{ copy_prep.mode | default(omit) }}"
  delegate_to: "{{ _deploy_host }}"
  loop: "{{ copies }}"
  loop_control:
    loop_var: copy_prep
    label: "{{ copy_prep.dest | string | trim }}"

- name: Wait for copied files (optional)
  when: (copy_prep.wait | default(false)) | bool
  ansible.builtin.wait_for:
    path: "{{ copy_prep.dest | string | trim }}"
    state: present
    timeout: "{{ copy_prep.wait_timeout | default(30) | int }}"
  delegate_to: "{{ _deploy_host }}"
  loop: "{{ copies }}"
  loop_control:
    loop_var: copy_prep
    label: "{{ copy_prep.dest | string | trim }}"
