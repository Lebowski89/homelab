---

- name: Ensure paths is a list
  ansible.builtin.assert:
    that:
      - paths is defined
      - paths is sequence
      - paths is not string
    fail_msg: "paths must be a list of path specs."

- name: Ensure docker_services_deploy_host is set
  ansible.builtin.set_fact:
    _deploy_host: "{{ docker_services_deploy_host | default(docker_services_primary_manager, true) | string | trim }}"

- name: Validate each path spec
  ansible.builtin.assert:
    that:
      - path_item.path is defined
      - (path_item.path | string | trim | length) > 0
      - (path_item.state | default('directory', true)) in
        ['absent', 'directory', 'file', 'hard', 'link', 'touch']
      - >
        (
          (path_item.state | default('directory', true)) not in ['hard', 'link']
        ) or (
          path_item.src is defined and (path_item.src | string | trim | length) > 0
        )
      - >
        (
          (path_item.state | default('directory', true)) == 'absent'
        ) or (
          path_item.mode is defined
          or default_mode is defined
        )
    fail_msg: >-
      Invalid path spec: path={{ path_item.path | default('MISSING') }},
      state={{ path_item.state | default('directory') }}.
      For state != absent, mode must be set on the item or via default_mode.
  loop: "{{ paths }}"
  loop_control:
    loop_var: path_item
    label: "{{ path_item.path | default('MISSING') }}"

- name: Apply filesystem state on deploy host
  ansible.builtin.file:
    path: "{{ path_item.path }}"
    state: "{{ path_item.state | default('directory', true) }}"
    src: "{{ path_item.src | default(omit, true) }}"
    owner: "{{ path_item.owner | default(default_owner) }}"
    group: "{{ path_item.group | default(default_group) }}"
    mode: "{{ path_item.mode | default(default_mode) }}"
    force: "{{ path_item.force | default(false, true) }}"
  loop: "{{ paths }}"
  loop_control:
    loop_var: path_item
    label: "{{ path_item.path }} [{{ path_item.state | default('directory') }}]"
  delegate_to: "{{ _deploy_host }}"
