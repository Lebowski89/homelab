---

- name: Ensure templates is a list
  ansible.builtin.assert:
    that:
      - templates is defined
      - templates is sequence
      - templates is not string
    fail_msg: "templates must be a list of template specs."

- name: Ensure deploy_host is set
  ansible.builtin.set_fact:
    _deploy_host: "{{ deploy_host | default('localhost', true) | string | trim }}"

- name: Render templates on deploy host
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ temp_prep.src }}"
    dest: "{{ temp_prep.dest }}"
    owner: "{{ temp_prep.owner | default(default_owner, true) }}"
    group: "{{ temp_prep.group | default(default_group, true) }}"
    mode: "{{ temp_prep.mode | default('0664', true) }}"
    force: "{{ temp_prep.force | default(true) | bool }}"
  loop: "{{ templates }}"
  loop_control:
    loop_var: temp_prep
    label: "{{ temp_prep.dest }}"
  delegate_to: "{{ _deploy_host }}"