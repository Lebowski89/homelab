---

# helpers/prep/swarm_configs.yml
# Creates/updates/removes Docker Swarm "configs" (docker config objects)

# Example: Inline
# pg_ha_proxy:
#   name: "pg-ha"
#   stack: ha-proxy
#   image: "haproxy:3.3-alpine"
#
#   swarm_configs:
#     - name: "pgha_haproxy_cfg"
#       data: |
#         global
#           log stdout format raw local0
#         defaults
#           mode tcp
#           timeout connect 5s
#           timeout client  30s
#           timeout server  30s
#         frontend pg
#           bind :5433
#           default_backend pg_back
#         backend pg_back
#           balance roundrobin
#           server pg1 postgres1:5432 check
#           server pg2 postgres2:5432 check

# Example: File or Template
#   pg_ha_proxy:
#     swarm_configs:
#       - name: "pgha_haproxy_cfg"
#         src: "files/pgha/haproxy.cfg"          # raw file
#         # OR:
#         src: "templates/pgha/haproxy.cfg.j2" # template

# helpers/prep/swarm_configs.yml
# Create/update Docker Swarm configs from service vars (runs on a swarm manager).

- name: Swarm configs | Ensure swarm_configs is a list
  ansible.builtin.assert:
    that:
      - swarm_configs is defined
      - swarm_configs is sequence
      - swarm_configs is not string
    fail_msg: "swarm_configs must be a list of config specs."

- name: Swarm configs | Resolve deploy host (swarm manager)
  ansible.builtin.set_fact:
    _swarm_cfg_host: "{{ docker_services_deploy_host | default('localhost', true) | string | trim }}"

- name: Swarm configs | Validate each config spec
  ansible.builtin.assert:
    that:
      - cfg.name is defined
      - (cfg.name | string | trim | length) > 0
      - (cfg.state | default('present', true)) in ['present', 'absent']
      - >
        (cfg.state | default('present', true)) == 'absent'
        or (
          (cfg.data is defined and (cfg.data | string | length) > 0)
          or
          (cfg.src is defined and (cfg.src | string | trim | length) > 0)
        )
    fail_msg: >-
      Invalid config spec: name={{ cfg.name | default('MISSING') }},
      state={{ cfg.state | default('present') }}.
      For present, set either data or src.
  loop: "{{ swarm_configs }}"
  loop_control:
    loop_var: cfg
    label: "{{ cfg.name | default('MISSING') }}"

# ----------------------------
# OPTION A: recreate deterministically
# (configs are immutable; easiest is remove+create)
# ----------------------------

- name: Swarm configs | Remove config (Option A)
  community.docker.docker_config:
    name: "{{ cfg.name | string | trim }}"
    state: absent
  loop: "{{ swarm_configs }}"
  loop_control:
    loop_var: cfg
    label: "{{ cfg.name }} [absent]"
  when: (cfg.state | default('present', true)) == 'present'
  delegate_to: "{{ _swarm_cfg_host }}"

- name: Swarm configs | Create config (Option A)
  community.docker.docker_config:
    name: "{{ cfg.name | string | trim }}"
    state: present
    data: "{{ (
              (
                (cfg.data | string)
                if (cfg.data is defined)
                else
                (
                  lookup('template', cfg.src)
                  if ((cfg.data_is_template | default(false)) | bool) or ((cfg.src | string).endswith('.j2'))
                  else lookup('file', cfg.src)
                )
              )
              | regex_replace('\r\n', '\n')
              | regex_replace('\\s+\\Z', '')
              | regex_replace('\\\\n\\Z', '')
            ) ~ '\n' }}"
    labels: "{{ cfg.labels | default(omit, true) }}"
  loop: "{{ swarm_configs }}"
  loop_control:
    loop_var: cfg
    label: "{{ cfg.name }} [present]"
  when: (cfg.state | default('present', true)) == 'present'
  delegate_to: "{{ _swarm_cfg_host }}"
