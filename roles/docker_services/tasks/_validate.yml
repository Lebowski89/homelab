---

- name: Ensure service_cfg is provided
  ansible.builtin.assert:
    that:
      - service_cfg is defined
      - service_cfg is mapping
    fail_msg: "docker_services role requires service_cfg (mapping) to be passed from the playbook."

- name: Validate target exists when targets are defined
  ansible.builtin.assert:
    that:
      - service_cfg.targets is not defined
        or (service_target | default('swarm')) in service_cfg.targets
    fail_msg: "Service '{{ role_prefix }}' has targets, but target '{{ service_target | default('swarm') }}' is not defined."
