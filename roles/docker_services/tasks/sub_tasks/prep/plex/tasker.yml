---

################################
# PLEX PREP
################################

- name: Plex prep | Set plex host
  ansible.builtin.set_fact:
    docker_services_plex_host: "plex"
  run_once: true

################################
# DOCKER VOLUME
################################

- name: Plex prep | Create media volume (NFS)
  community.docker.docker_volume:
    volume_name: "media_nfs"
    state: present
    recreate: options-changed
    driver: local
    driver_options:
      type: nfs
      o: addr=192.168.80.20,rw,nfsvers=4.2
      device: ":/mnt/user/data/media"
  run_once: true
  delegate_to: "{{ docker_swarm_primary_manager }}"

################################
# PLEX TOKEN
################################

- name: Plex prep | Include Plex token tasks
  ansible.builtin.include_tasks:
    file: token.yml
    apply:
      delegate_to: "{{ docker_swarm_primary_manager }}"
      run_once: true
  run_once: true

################################
# PLEX PREFERENCES
################################

- name: Plex prep | Include Plex preferences.xml tasks
  ansible.builtin.include_tasks:
    file: pref.yml
    apply:
      delegate_to: "{{ docker_services_plex_host }}"
      run_once: true
  run_once: true

################################
# PLEX CLAIM SERVER
################################

- name: Plex prep | Include Plex claim tasks
  ansible.builtin.include_tasks:
    file: claim.yml
    apply:
      delegate_to: "{{ docker_services_plex_host }}"
      run_once: true
  run_once: true
