---

################################
# AUTHELIA PREP (LOCALHOST ONCE)
################################

- name: Authelia prep | Generate argon2 + secrets (once)
  when: inventory_hostname == "localhost"
  run_once: true
  block:

    # 1) Argon2 digest (NOT a docker secret)
    - name: Authelia prep | Generate argon2 digest (users_database)
      ansible.builtin.include_tasks: keys.yml
      vars:
        authelia_job: "UserDB Password"
        authelia_fact_name: "authelia_argon2_password"
        authelia_key: "{{ hostvars['localhost'].authelia_argon2_password | default('') }}"
        authelia_key_secret: ""
        authelia_key_command: "authelia crypto hash generate argon2 --password {{ authelia_pass | quote }}"
        authelia_key_echo: "Digest"

    # 2) Session secret
    - name: Authelia prep | Ensure session key secret
      ansible.builtin.include_tasks: keys.yml
      vars:
        authelia_job: "Session Key"
        authelia_fact_name: "authelia_session_key"
        authelia_key: "{{ hostvars['localhost'].authelia_session_key | default('') }}"
        authelia_key_secret: "authelia_session_key_secret"
        authelia_key_command: "authelia crypto rand --length 64 --charset alphanumeric"
        authelia_key_echo: "Random Value"

    # 3) Storage key (Infisical preferred)
    - name: Authelia prep | Ensure storage key secret
      ansible.builtin.include_tasks: keys.yml
      vars:
        authelia_job: "Storage Key"
        authelia_fact_name: "authelia_storage_key"
        authelia_key: "{{ hostvars['localhost'].authelia_storage_key | default('') }}"
        authelia_key_secret: "authelia_storage_key_secret"
        authelia_key_command: "authelia crypto rand --length 64 --charset alphanumeric"
        authelia_key_echo: "Random Value"

    - name: Authelia prep | IMPORTANT | Persist storage key in Infisical
      when:
        - (_authelia_generated_this_run | default(false)) | bool
        - (hostvars['localhost'].authelia_storage_key | default('') | string | trim | length) > 0
        - (svc.infisical is not defined)
          or (svc.infisical.secrets_map is not defined)
          or (
              svc.infisical.secrets_map
              | selectattr('var', 'equalto', 'authelia_storage_key')
              | list
              | length == 0
            )
      ansible.builtin.debug:
        msg: >-
          Authelia STORAGE KEY was generated locally.
          You MUST store this value in Infisical at:
            Path: /Authelia
            Name: STORAGE_KEY
          Value:
          {{ hostvars['localhost'].authelia_storage_key }}

    # 4) JWT reset secret
    - name: Authelia prep | Ensure JWT reset key secret
      ansible.builtin.include_tasks: keys.yml
      vars:
        authelia_job: "JWT Key"
        authelia_fact_name: "authelia_jwt_reset_key"
        authelia_key: "{{ hostvars['localhost'].authelia_jwt_reset_key | default('') }}"
        authelia_key_secret: "authelia_jwt_key_secret"
        authelia_key_command: "authelia crypto rand --length 64 --charset alphanumeric"
        authelia_key_echo: "Random Value"