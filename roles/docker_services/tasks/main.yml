---

- name: Init (validate + normalize)
  ansible.builtin.include_tasks:
    file: _init.yml
    apply:
      tags: [deploy, update, remove, recreate, bootstrap]
  tags: [deploy, update, remove, recreate, bootstrap]

- name: Run prep phase
  ansible.builtin.include_tasks: _prep.yml
  tags: [deploy, update, remove, recreate, bootstrap]

- name: Build compose definition
  ansible.builtin.include_tasks:
    file: _compose.yml
    apply:
      tags: [deploy, update, recreate]
  tags: [deploy, update, recreate]

- name: Run centralized deploy (once)
  ansible.builtin.include_tasks:
    file: _deploy.yml
    apply:
      tags: [deploy, update, recreate]
  tags: [deploy, update, recreate]
