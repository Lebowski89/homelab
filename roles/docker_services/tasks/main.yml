---

################################
# INIT
################################

- name: Init (validate + normalize)
  ansible.builtin.include_tasks:
    file: init/tasker.yml
    apply:
      tags: [deploy, update, remove, recreate, bootstrap]
  tags: [deploy, update, remove, recreate, bootstrap]

################################
# PREP
################################

- name: Prep | cleanup tasks
  ansible.builtin.include_tasks: prep/00_cleanup/tasker.yml
  tags: [remove, recreate]

- name: Prep | Pre-template tasks
  ansible.builtin.include_tasks: prep/01_pre_filesystem/tasker.yml
  tags: [deploy, update, recreate, bootstrap]

- name: Prep | filesystem tasks
  ansible.builtin.include_tasks: prep/02_filesystem/tasker.yml
  tags: [deploy, update, recreate]

- name: Prep | Relevant services tasks
  ansible.builtin.include_tasks: prep/03_post_filesystem/tasker.yml
  tags: [deploy, update, recreate, bootstrap]

################################
# COMPOSE
################################

- name: Compose | Init tasks
  ansible.builtin.include_tasks:
    file: compose/00_init.yml
    apply:
      tags: [deploy, update, recreate]
  tags: [deploy, update, recreate]

- name: Compose | Service Base tasks
  ansible.builtin.include_tasks:
    file: compose/01_base/tasker.yml
    apply:
      tags: [deploy, update, recreate]
  tags: [deploy, update, recreate]

- name: Compose | Runtime tasks
  ansible.builtin.include_tasks:
    file: compose/02_runtime/tasker.yml
    apply:
      tags: [deploy, update, recreate]
  tags: [deploy, update, recreate]

- name: Compose | Input-Output tasks
  ansible.builtin.include_tasks:
    file: compose/03_io/tasker.yml
    apply:
      tags: [deploy, update, recreate]
  tags: [deploy, update, recreate]

- name: Compose | Metadata tasks
  ansible.builtin.include_tasks:
    file: compose/04_metadata/tasker.yml
    apply:
      tags: [deploy, update, recreate]
  tags: [deploy, update, recreate]

################################
# DEPLOY
################################

- name: Run centralized deploy (once)
  ansible.builtin.include_tasks:
    file: deploy/tasker.yml
    apply:
      tags: [deploy, update, recreate]
  tags: [deploy, update, recreate]
