---

################################
# PLEX PREP
################################

- name: Plex prep | Assert docker_services_plex_host is valid
  ansible.builtin.assert:
    that:
      - docker_services_plex_host is defined
      - docker_services_plex_host | string | trim | length > 0
      - docker_services_plex_host in hostvars
    fail_msg: "docker_services_plex_host must be defined in group_vars, be non-empty, and match an inventory host."
  run_once: true

################################
# DOCKER VOLUME
################################

- name: Plex prep | Create media volume (NFS)
  community.docker.docker_volume:
    volume_name: "media_nfs"
    state: present
    recreate: options-changed
    driver: local
    driver_options:
      type: nfs
      o: addr=192.168.80.20,rw,nfsvers=4.2
      device: ":/mnt/user/data/media"
  run_once: true
  delegate_to: "{{ docker_services_primary_manager }}"

################################
# PLEX TOKEN
################################

- name: Plex prep | Include Plex token tasks
  ansible.builtin.include_tasks:
    file: _token.yml
    apply:
      delegate_to: "{{ docker_services_primary_manager }}"
      run_once: true
  run_once: true

################################
# PLEX PREFERENCES
################################

- name: Plex prep | Include Plex preferences.xml tasks
  ansible.builtin.include_tasks:
    file: _pref.yml
    apply:
      delegate_to: "{{ docker_services_plex_host }}"
      run_once: true
  run_once: true

################################
# PLEX CLAIM SERVER
################################

- name: Plex prep | Include Plex claim tasks
  ansible.builtin.include_tasks:
    file: _claim.yml
    apply:
      delegate_to: "{{ docker_services_plex_host }}"
      run_once: true
  run_once: true
