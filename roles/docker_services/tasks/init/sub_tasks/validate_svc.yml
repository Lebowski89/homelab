---

- name: Validate | docker_services_svc is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc is defined
      - docker_services_svc is mapping
    fail_msg: "docker_services_svc must be defined as a mapping before calling validate_svc.yml"

################################
# BASIC FIELDS
################################

- name: Validate | docker_services_svc.name
  when: docker_services_svc.name is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.name is string
      - (docker_services_svc.name | string | trim | length) > 0
    fail_msg: "docker_services_svc.name must be a non-empty string when provided."

- name: Validate | docker_services_svc.image (required)
  ansible.builtin.assert:
    that:
      - docker_services_svc.image is defined
      - docker_services_svc.image is string
      - (docker_services_svc.image | string | trim | length) > 0
    fail_msg: "docker_services_svc.image must be defined as a non-empty string."

- name: Validate | docker_services_svc.user
  when: docker_services_svc.user is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.user is string
      - (docker_services_svc.user | string | trim | length) > 0
    fail_msg: "docker_services_svc.user must be a non-empty string when provided."

- name: Validate | docker_services_svc.command shape
  when: docker_services_svc.command is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.command is string
        or (docker_services_svc.command is sequence and docker_services_svc.command is not string)
    fail_msg: "docker_services_svc.command must be a non-empty string or a list of non-empty strings."

- name: Validate | docker_services_svc.command string form
  when:
    - docker_services_svc.command is defined
    - docker_services_svc.command is string
  ansible.builtin.assert:
    that:
      - (docker_services_svc.command | trim | length) > 0
    fail_msg: "docker_services_svc.command string form must be non-empty."

- name: Validate | docker_services_svc.command list form
  when:
    - docker_services_svc.command is defined
    - docker_services_svc.command is sequence
    - docker_services_svc.command is not string
  ansible.builtin.assert:
    that:
      - (docker_services_svc.command | length) > 0
      - >-
        (docker_services_svc.command | map('string') | map('trim') |
        reject('equalto','') | list | length)
        == (docker_services_svc.command | length)
    fail_msg: "docker_services_svc.command list form must contain only non-empty strings."

- name: Validate | docker_services_svc.env_file shape
  when: docker_services_svc.env_file is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.env_file is string
        or (docker_services_svc.env_file is sequence and docker_services_svc.env_file is not string)
    fail_msg: "docker_services_svc.env_file must be a string or a list of strings."

- name: Validate | docker_services_svc.env_file string form
  when:
    - docker_services_svc.env_file is defined
    - docker_services_svc.env_file is string
  ansible.builtin.assert:
    that:
      - (docker_services_svc.env_file | trim | length) > 0
    fail_msg: "docker_services_svc.env_file string form must be non-empty."

- name: Validate | docker_services_svc.env_file list form
  when:
    - docker_services_svc.env_file is defined
    - docker_services_svc.env_file is sequence
    - docker_services_svc.env_file is not string
  ansible.builtin.assert:
    that:
      - (docker_services_svc.env_file | length) > 0
      - >-
        (docker_services_svc.env_file | map('string') | map('trim') |
        reject('equalto','') | list | length)
        == (docker_services_svc.env_file | length)
    fail_msg: "docker_services_svc.env_file list form must contain only non-empty strings."

- name: Validate | docker_services_svc.devices shape
  when: docker_services_svc.devices is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.devices is sequence
      - docker_services_svc.devices is not string
      - >-
        (docker_services_svc.devices | map('string') | map('trim') |
        reject('equalto','') | list | length)
        == (docker_services_svc.devices | length)
    fail_msg: "docker_services_svc.devices must be a list of non-empty strings."

- name: Validate | docker_services_svc.cap_add shape
  when: docker_services_svc.cap_add is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.cap_add is sequence
      - docker_services_svc.cap_add is not string
      - >-
        (docker_services_svc.cap_add | map('string') | map('trim') |
        reject('equalto','') | list | length)
        == (docker_services_svc.cap_add | length)
    fail_msg: "docker_services_svc.cap_add must be a list of non-empty strings."

- name: Validate | docker_services_svc.cap_drop shape
  when: docker_services_svc.cap_drop is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.cap_drop is sequence
      - docker_services_svc.cap_drop is not string
      - >-
        (docker_services_svc.cap_drop | map('string') | map('trim') |
        reject('equalto','') | list | length)
        == (docker_services_svc.cap_drop | length)
    fail_msg: "docker_services_svc.cap_drop must be a list of non-empty strings."

- name: Validate | docker_services_svc.sysctls shape
  when: docker_services_svc.sysctls is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.sysctls is mapping
    fail_msg: "docker_services_svc.sysctls must be a mapping when provided."

################################
# DEPLOY
################################

- name: Validate | docker_services_svc.deploy shape
  when: docker_services_svc.deploy is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.deploy is mapping
    fail_msg: "docker_services_svc.deploy must be a mapping when provided."

- name: Validate | docker_services_svc.deploy.type
  when:
    - docker_services_svc.deploy is defined
    - docker_services_svc.deploy is mapping
    - docker_services_svc.deploy.type is defined
  ansible.builtin.assert:
    that:
      - (docker_services_svc.deploy.type | string | trim) in ['swarm', 'container']
    fail_msg: "docker_services_svc.deploy.type must be 'swarm' or 'container' when provided."

- name: Validate | docker_services_svc.deploy.mode
  when:
    - docker_services_svc.deploy is defined
    - docker_services_svc.deploy is mapping
    - docker_services_svc.deploy.mode is defined
  ansible.builtin.assert:
    that:
      - (docker_services_svc.deploy.mode | string | trim) in ['replicated', 'global']
    fail_msg: "docker_services_svc.deploy.mode must be 'replicated' or 'global' when provided."

- name: Validate | docker_services_svc.deploy.replicas
  when:
    - docker_services_svc.deploy is defined
    - docker_services_svc.deploy is mapping
    - docker_services_svc.deploy.replicas is defined
  ansible.builtin.assert:
    that:
      - (docker_services_svc.deploy.replicas | int) >= 0
    fail_msg: "docker_services_svc.deploy.replicas must be an integer >= 0 when provided."

- name: Validate | docker_services_svc.deploy.host
  when:
    - docker_services_svc.deploy is defined
    - docker_services_svc.deploy is mapping
    - docker_services_svc.deploy.host is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.deploy.host is string
      - (docker_services_svc.deploy.host | string | trim | length) > 0
    fail_msg: "docker_services_svc.deploy.host must be a non-empty string when provided."

- name: Validate | docker_services_svc.deploy.constraints
  when:
    - docker_services_svc.deploy is defined
    - docker_services_svc.deploy is mapping
    - docker_services_svc.deploy.constraints is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.deploy.constraints is string
        or (docker_services_svc.deploy.constraints is sequence and docker_services_svc.deploy.constraints is not string)
    fail_msg: "docker_services_svc.deploy.constraints must be a string or a list of strings."

################################
# TARGETS
################################

- name: Validate | docker_services_svc.targets shape
  when: docker_services_svc.targets is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.targets is mapping
    fail_msg: "docker_services_svc.targets must be a mapping when provided."

- name: Validate | docker_services_svc.targets entries are mappings
  when:
    - docker_services_svc.targets is defined
    - (docker_services_svc.targets | length > 0)
  ansible.builtin.assert:
    that:
      - (docker_services_svc.targets.values() | select('mapping') | list | length)
        == (docker_services_svc.targets | length)
    fail_msg: "docker_services_svc.targets entries must be mappings."

################################
# NAMED NETWORKS / VOLUMES
################################

- name: Validate | docker_services_svc.named_networks
  when: docker_services_svc.named_networks is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.named_networks is mapping
    fail_msg: "docker_services_svc.named_networks must be a mapping when provided."

- name: Validate | docker_services_svc.named_volumes
  when: docker_services_svc.named_volumes is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.named_volumes is mapping
    fail_msg: "docker_services_svc.named_volumes must be a mapping when provided."

################################
# PATHS
################################

- name: Validate | docker_services_svc.paths shape
  when: docker_services_svc.paths is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.paths is sequence
      - docker_services_svc.paths is not string
    fail_msg: "docker_services_svc.paths must be a list of path specs."

- name: Validate | docker_services_svc.paths entries
  when: docker_services_svc.paths is defined and (docker_services_svc.paths | length > 0)
  ansible.builtin.assert:
    that:
      - (docker_services_svc.paths | select('mapping') | list | length) == (docker_services_svc.paths | length)
      - (docker_services_svc.paths | map(attribute='path') | select('defined') | list | length) == (docker_services_svc.paths | length)
      - >-
        (docker_services_svc.paths | map(attribute='path') | map('string') | map('trim') |
        reject('equalto','') | list | length)
        == (docker_services_svc.paths | length)
    fail_msg: "docker_services_svc.paths must be a list of dicts and each entry must contain a non-empty 'path'."

- name: Validate | docker_services_svc.paths mode formatting
  when: docker_services_svc.paths is defined and (docker_services_svc.paths | length > 0)
  ansible.builtin.assert:
    that:
      - >
        (
          docker_services_svc.paths
          | selectattr('mode','defined')
          | map(attribute='mode')
          | map('string')
          | map('trim')
          | map('regex_search', '^[0-7]{3,4}$')
          | reject('equalto', None)
          | list
          | length
        )
        ==
        (docker_services_svc.paths | selectattr('mode','defined') | list | length)
    fail_msg: "If provided, paths[].mode must look like '755' or '0755'."

################################
# TEMPLATES
################################

- name: Validate | docker_services_svc.templates shape
  when: docker_services_svc.templates is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.templates is sequence
      - docker_services_svc.templates is not string
    fail_msg: "docker_services_svc.templates must be a list of template specs."

- name: Validate | docker_services_svc.templates entries
  when: docker_services_svc.templates is defined and (docker_services_svc.templates | length > 0)
  ansible.builtin.assert:
    that:
      - (docker_services_svc.templates | select('mapping') | list | length) == (docker_services_svc.templates | length)
      - >-
        (docker_services_svc.templates | map(attribute='src') | select('defined') | list | length)
        == (docker_services_svc.templates | length)
      - >-
        (docker_services_svc.templates | map(attribute='dest') | select('defined') | list | length)
        == (docker_services_svc.templates | length)
      - >-
        (docker_services_svc.templates | map(attribute='src') | map('string') | map('trim') |
        reject('equalto','') | list | length)
        == (docker_services_svc.templates | length)
      - >-
        (docker_services_svc.templates | map(attribute='dest') | map('string') | map('trim') |
        reject('equalto','') | list | length)
        == (docker_services_svc.templates | length)
    fail_msg: "docker_services_svc.templates must be a list of dicts and each entry must contain non-empty 'src' and 'dest'."

- name: Validate | docker_services_svc.templates mode formatting
  when: docker_services_svc.templates is defined and (docker_services_svc.templates | length > 0)
  ansible.builtin.assert:
    that:
      - >
        (
          docker_services_svc.templates
          | selectattr('mode','defined')
          | map(attribute='mode')
          | map('string')
          | map('trim')
          | map('regex_search', '^[0-7]{3,4}$')
          | reject('equalto', None)
          | list
          | length
        )
        ==
        (docker_services_svc.templates | selectattr('mode','defined') | list | length)
    fail_msg: "If provided, templates[].mode must look like '664' or '0664'."

################################
# COPIES
################################

- name: Validate | docker_services_svc.copies shape
  when: docker_services_svc.copies is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.copies is sequence
      - docker_services_svc.copies is not string
    fail_msg: "docker_services_svc.copies must be a list of copy specs."

- name: Validate | docker_services_svc.copies entries
  when: docker_services_svc.copies is defined and (docker_services_svc.copies | length > 0)
  ansible.builtin.assert:
    that:
      - (docker_services_svc.copies | select('mapping') | list | length) == (docker_services_svc.copies | length)
      - (docker_services_svc.copies | map(attribute='src') | select('defined') | list | length) == (docker_services_svc.copies | length)
      - (docker_services_svc.copies | map(attribute='dest') | select('defined') | list | length) == (docker_services_svc.copies | length)
      - >-
        (docker_services_svc.copies | map(attribute='src') | map('string') | map('trim') |
        reject('equalto','') | list | length)
        == (docker_services_svc.copies | length)
      - >-
        (docker_services_svc.copies | map(attribute='dest') | map('string') | map('trim') |
        reject('equalto','') | list | length)
        == (docker_services_svc.copies | length)
    fail_msg: "docker_services_svc.copies must be a list of dicts and each entry must contain non-empty 'src' and 'dest'."

################################
# INFISICAL
################################

- name: Validate | docker_services_svc.infisical shape
  when: docker_services_svc.infisical is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.infisical is mapping
    fail_msg: "docker_services_svc.infisical must be a mapping."

- name: Validate | docker_services_svc.infisical.secrets_map
  when: docker_services_svc.infisical is defined and docker_services_svc.infisical.secrets_map is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.infisical.secrets_map is sequence
      - docker_services_svc.infisical.secrets_map is not string
      - >-
        (docker_services_svc.infisical.secrets_map | select('mapping') | list | length)
        == (docker_services_svc.infisical.secrets_map | length)
      - >-
        (docker_services_svc.infisical.secrets_map | map(attribute='var') | select('defined') | list | length)
        == (docker_services_svc.infisical.secrets_map | length)
      - >-
        (docker_services_svc.infisical.secrets_map | map(attribute='path') | select('defined') | list | length)
        == (docker_services_svc.infisical.secrets_map | length)
      - >-
        (docker_services_svc.infisical.secrets_map | map(attribute='name') | select('defined') | list | length)
        == (docker_services_svc.infisical.secrets_map | length)
    fail_msg: "docker_services_svc.infisical.secrets_map must be a list of dicts each containing var/path/name."

################################
# POSTGRES
################################

- name: Validate | docker_services_svc.postgres shape
  when: docker_services_svc.postgres is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.postgres is mapping
    fail_msg: "docker_services_svc.postgres must be a mapping when provided."

- name: Validate | docker_services_svc.postgres.databases
  when:
    - docker_services_svc.postgres is defined
    - docker_services_svc.postgres is mapping
    - docker_services_svc.postgres.databases is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.postgres.databases is string
        or (docker_services_svc.postgres.databases is sequence and docker_services_svc.postgres.databases is not string)
    fail_msg: "docker_services_svc.postgres.databases must be a string or a list of strings."

################################
# HEALTHCHECK
################################

- name: Validate | docker_services_svc.healthcheck shape
  when: docker_services_svc.healthcheck is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.healthcheck is mapping
      - docker_services_svc.healthcheck.test is defined
      - >
        (
          (
            docker_services_svc.healthcheck.test is sequence
            and docker_services_svc.healthcheck.test is not string
            and (docker_services_svc.healthcheck.test | length > 0)
          )
          or
          (
            docker_services_svc.healthcheck.test is string
            and (docker_services_svc.healthcheck.test | trim | length > 0)
          )
        )
    fail_msg: "docker_services_svc.healthcheck must be a mapping with a non-empty test (string or list)."

################################
# SECRETS
################################

- name: Validate | docker_services_svc.secrets shape
  when: docker_services_svc.secrets is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.secrets is string
        or (docker_services_svc.secrets is sequence and docker_services_svc.secrets is not string)
    fail_msg: "docker_services_svc.secrets must be a string or a list."

- name: Validate | docker_services_svc.secrets string form
  when:
    - docker_services_svc.secrets is defined
    - docker_services_svc.secrets is string
  ansible.builtin.assert:
    that:
      - (docker_services_svc.secrets | trim | length) > 0
    fail_msg: "docker_services_svc.secrets string form must be non-empty."

- name: Validate | docker_services_svc.secrets list form is non-empty
  when:
    - docker_services_svc.secrets is defined
    - docker_services_svc.secrets is sequence
    - docker_services_svc.secrets is not string
  ansible.builtin.assert:
    that:
      - (docker_services_svc.secrets | length) > 0
    fail_msg: "docker_services_svc.secrets list form must not be empty."

- name: Validate | docker_services_svc.secrets list items are strings or dicts
  when:
    - docker_services_svc.secrets is defined
    - docker_services_svc.secrets is sequence
    - docker_services_svc.secrets is not string
  ansible.builtin.assert:
    that:
      - >-
        (docker_services_svc.secrets | select('string') | list | length)
        +
        (docker_services_svc.secrets | select('mapping') | list | length)
        ==
        (docker_services_svc.secrets | length)
    fail_msg: "docker_services_svc.secrets list entries must be strings or dicts."

- name: Validate | docker_services_svc.secrets string items are non-empty
  when:
    - docker_services_svc.secrets is defined
    - docker_services_svc.secrets is sequence
    - docker_services_svc.secrets is not string
    - (docker_services_svc.secrets | select('string') | list | length) > 0
  ansible.builtin.assert:
    that:
      - >-
        (docker_services_svc.secrets | select('string') | map('trim') |
        reject('equalto','') | list | length)
        ==
        (docker_services_svc.secrets | select('string') | list | length)
    fail_msg: "docker_services_svc.secrets string entries must be non-empty."

- name: Validate | docker_services_svc.secrets dict items have source and target
  when:
    - docker_services_svc.secrets is defined
    - docker_services_svc.secrets is sequence
    - docker_services_svc.secrets is not string
    - (docker_services_svc.secrets | select('mapping') | list | length) > 0
  ansible.builtin.assert:
    that:
      - >-
        (docker_services_svc.secrets | select('mapping') | map(attribute='source') |
        select('defined') | list | length)
        ==
        (docker_services_svc.secrets | select('mapping') | list | length)
      - >-
        (docker_services_svc.secrets | select('mapping') | map(attribute='target') |
        select('defined') | list | length)
        ==
        (docker_services_svc.secrets | select('mapping') | list | length)
    fail_msg: "docker_services_svc.secrets dict entries must include source and target."

################################
# PORTS
################################

- name: Validate | docker_services_svc.ports shape
  when: docker_services_svc.ports is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.ports is mapping
        or (docker_services_svc.ports is sequence and docker_services_svc.ports is not string)
    fail_msg: "docker_services_svc.ports must be a mapping (named ports) or a list of port dicts."

- name: Validate | Normalize ports items
  when: docker_services_svc.ports is defined
  ansible.builtin.set_fact:
    docker_services_validate_ports_items: >-
      {{
        (docker_services_svc.ports.values() | list)
        if (docker_services_svc.ports is mapping)
        else (docker_services_svc.ports | list)
      }}

- name: Validate | docker_services_svc.ports entries
  when: docker_services_svc.ports is defined
  ansible.builtin.assert:
    that:
      - (docker_services_validate_ports_items | select('mapping') | list | length) == (docker_services_validate_ports_items | length)
      - >-
        (docker_services_validate_ports_items | map(attribute='published') | select('defined') | list | length)
        == (docker_services_validate_ports_items | length)
      - >-
        (docker_services_validate_ports_items | map(attribute='target') | select('defined') | list | length)
        == (docker_services_validate_ports_items | length)
    fail_msg: "docker_services_svc.ports entries must be dicts and include 'published' and 'target'."

################################
# VOLUMES
################################

- name: Validate | docker_services_svc.volumes shape
  when: docker_services_svc.volumes is defined
  ansible.builtin.assert:
    that:
      - docker_services_svc.volumes is mapping
        or (docker_services_svc.volumes is sequence and docker_services_svc.volumes is not string)
    fail_msg: "docker_services_svc.volumes must be a mapping (named volumes) or a list of volume dicts."

- name: Validate | Normalize volume items
  when: docker_services_svc.volumes is defined
  ansible.builtin.set_fact:
    docker_services_validate_volume_items: >-
      {{
        (docker_services_svc.volumes.values() | list)
        if (docker_services_svc.volumes is mapping)
        else (docker_services_svc.volumes | list)
      }}

- name: Validate | docker_services_svc.volumes entries basic
  when: docker_services_svc.volumes is defined
  ansible.builtin.assert:
    that:
      - (docker_services_validate_volume_items | select('mapping') | list | length) == (docker_services_validate_volume_items | length)
    fail_msg: "docker_services_svc.volumes entries must be dicts."

- name: Validate | docker_services_svc.volumes required keys by type
  when: docker_services_svc.volumes is defined
  ansible.builtin.assert:
    that:
      - _validate_volume_type in ['bind', 'volume', 'tmpfs']
      - (_validate_volume_type == 'tmpfs') or (_validate_volume_source | length > 0)
      - (_validate_volume_target | length > 0)
    fail_msg: >-
      Invalid volume entry for service '{{ docker_services_svc.name | default('unknown', true) }}':
      type='{{ _validate_volume_type }}', source='{{ _validate_volume_source }}',
      target='{{ _validate_volume_target }}'
  vars:
    _validate_volume_type: "{{ validate_volume_item.type | default('bind', true) | string | trim }}"
    _validate_volume_source: "{{ validate_volume_item.source | default('', true) | string | trim }}"
    _validate_volume_target: "{{ validate_volume_item.target | default('', true) | string | trim }}"
  loop: "{{ docker_services_validate_volume_items }}"
  loop_control:
    loop_var: validate_volume_item
