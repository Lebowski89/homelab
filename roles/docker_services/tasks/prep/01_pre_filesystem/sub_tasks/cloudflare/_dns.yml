---

- name: Cloudflare DNS | Normalize inputs
  ansible.builtin.set_fact:
    docker_services_cf_record: "{{ cloudflare_record | default('@', true) | string | trim }}"
    docker_services_cf_type: "{{ cloudflare_record_type | default('A', true) | string | trim }}"
    docker_services_cf_value: "{{ cloudflare_record_value | string | trim }}"
    docker_services_cf_proxy: "{{ (cloudflare_proxy | default(false, true)) | bool }}"
    docker_services_cf_solo: "{{ (cloudflare_solo | default(true, true)) | bool }}"

- name: Cloudflare DNS | Add or update record
  community.general.cloudflare_dns:
    api_token: "{{ cloudflare_api }}"
    zone: "{{ cloudflare_zone }}"
    state: present
    solo: "{{ docker_services_cf_solo }}"
    proxied: "{{ docker_services_cf_proxy }}"
    type: "{{ docker_services_cf_type }}"
    value: "{{ docker_services_cf_value }}"
    record: "{{ docker_services_cf_record }}"
  register: docker_services_cf_result

- name: Cloudflare DNS | Display status
  when: docker_services_cf_result is succeeded
  ansible.builtin.debug:
    msg: >-
      DNS {{ docker_services_cf_type }} record for
      "{{
        (docker_services_cf_record in ['@', cloudflare_zone])
        | ternary(cloudflare_zone, docker_services_cf_record ~ '.' ~ cloudflare_zone)
      }}"
      set to "{{ docker_services_cf_value }}". Proxy: {{ docker_services_cf_proxy }}
