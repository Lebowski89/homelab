---

- name: EnvResolve | Determine fail-on-empty behavior
  ansible.builtin.set_fact:
    docker_services_env_fail_on_empty: >-
      {{ (docker_services_svc.infisical.fail_on_empty | default(true)) | bool }}
  when: docker_services_svc.infisical is defined

- name: EnvResolve | Initialize resolved environment + placeholder key list
  when:
    - docker_services_svc.environment is defined
    - (docker_services_svc.environment | length) > 0
  ansible.builtin.set_fact:
    docker_services_env_resolved: {}
    docker_services_env_placeholder_keys: []

- name: EnvResolve | Resolve placeholders into docker_services_env_resolved
  when:
    - docker_services_svc.environment is defined
    - (docker_services_svc.environment | length) > 0
  ansible.builtin.set_fact:
    docker_services_env_resolved: "{{ docker_services_env_resolved | combine({env_kv.key: _resolved_val}) }}"
    docker_services_env_placeholder_keys: >-
      {{
        docker_services_env_placeholder_keys +
        ([_placeholder_key] if _is_placeholder else [])
      }}
  vars:
    _raw_val: "{{ env_kv.value }}"
    _is_placeholder: "{{ (_raw_val is string) and (_raw_val is match('^__INFISICAL__:.+$')) }}"
    _placeholder_key: "{{ env_kv.key }}"
    _varname: "{{ (_raw_val | regex_replace('^__INFISICAL__:(.+)$', '\\1')) if _is_placeholder else '' }}"
    _local_var_val: "{{ lookup('ansible.builtin.vars', _varname, default='') if _is_placeholder else '' }}"
    _local_var_exists: >-
      {{
        _is_placeholder and
        ((query('ansible.builtin.varnames', '^' ~ (_varname | regex_escape) ~ '$') | length) > 0)
      }}
    _has_value: >-
      {{
        _is_placeholder and
        (_varname in hostvars[docker_services_primary_manager]) and
        ((hostvars[docker_services_primary_manager][_varname] | string | length) > 0)
      }}
    _resolved_val: >-
      {{
        (
          _local_var_val
          if (_local_var_exists and ((_local_var_val | string | length) > 0))
          else (
            hostvars[docker_services_primary_manager][_varname]
            if _has_value
            else _raw_val
          )
        )
      }}
  loop: "{{ docker_services_svc.environment | dict2items }}"
  loop_control:
    loop_var: env_kv
    label: "{{ env_kv.key }}"

- name: EnvResolve | Replace docker_services_svc.environment with resolved values
  when: docker_services_env_resolved is defined
  ansible.builtin.set_fact:
    docker_services_svc: "{{ docker_services_svc | combine({'environment': docker_services_env_resolved}, recursive=true) }}"

- name: EnvResolve | Fail if any placeholders remain (means resolver didn't run)
  when:
    - (docker_services_env_fail_on_empty | default(true)) | bool
    - docker_services_svc.environment is defined
    - (docker_services_svc.environment | dict2items
       | selectattr('value','string')
       | selectattr('value','match','^__INFISICAL__:.+$')
       | list
       | length) > 0
  ansible.builtin.fail:
    msg: >-
      Unresolved Infisical placeholders in docker_services_svc.environment for service '{{ docker_services_service_name }}':
      {{
        docker_services_svc.environment
        | dict2items
        | selectattr('value','string')
        | selectattr('value','match','^__INFISICAL__:.+$')
        | map(attribute='key')
        | list
      }}

- name: EnvResolve | Fail if any placeholder-resolved env key is empty
  when:
    - (docker_services_env_fail_on_empty | default(true)) | bool
    - (docker_services_env_placeholder_keys | default([]) | length) > 0
  ansible.builtin.assert:
    that:
      - (docker_services_svc.environment[env_key] | default('') | string | trim | length) > 0
    fail_msg: "Empty environment values after Infisical resolution for service '{{ docker_services_service_name }}': {{ env_key }}"
  loop: "{{ docker_services_env_placeholder_keys }}"
  loop_control:
    loop_var: env_key
    label: "{{ env_key }}"
