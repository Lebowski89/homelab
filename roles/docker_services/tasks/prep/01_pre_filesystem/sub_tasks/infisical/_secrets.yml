---

- name: Secrets | Reset working list (prevent cross-service bleed)
  ansible.builtin.set_fact:
    docker_services_docker_secret_items: []

- name: Secrets | Resolve deploy host
  ansible.builtin.set_fact:
    docker_services_secrets_deploy_host: >-
      {{
        (docker_services_svc.deploy.host | default(docker_services_deploy_host_effective, true) | default(docker_services_primary_manager, true))
        | string | trim
      }}

- name: Secrets | Resolve effective secrets host (swarm -> mgt, else deploy host)
  ansible.builtin.set_fact:
    docker_services_secrets_host_effective: >-
      {{
        docker_services_primary_manager
        if (docker_services_stack_deploy_type | default('swarm', true)) == 'swarm'
        else docker_services_secrets_deploy_host
      }}

- name: Ensure docker_services_svc.infisical.secrets_map exists
  ansible.builtin.assert:
    that:
      - docker_services_svc is defined
      - docker_services_svc is mapping
      - docker_services_svc.infisical is defined
      - docker_services_svc.infisical is mapping
      - docker_services_svc.infisical.secrets_map is defined
      - docker_services_svc.infisical.secrets_map is sequence
      - docker_services_svc.infisical.secrets_map is not string
    fail_msg: "helpers/prep/secrets.yml requires docker_services_svc.infisical.secrets_map (list)."

- name: Secrets | Build desired secret items from secrets_map (opt-in via docker_secret)
  ansible.builtin.set_fact:
    docker_services_docker_secret_items: >-
      {%- set out = [] -%}
      {%- for m in (docker_services_svc.infisical.secrets_map | default([])) -%}
      {%- if
            (m is mapping)
            and (m.var is defined)
            and ((m.var | string | trim) | length > 0)
            and (m.docker_secret is defined)
            and ((m.docker_secret | string | trim) | length > 0)
      -%}
      {%- set secret_value = (hostvars[docker_services_primary_manager][m.var] | default('', true) | string) -%}
      {%- set _ = out.append({
            'name': (m.docker_secret | string | trim),
            'var': (m.var | string | trim),
            'value': secret_value
          }) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Secrets | Dedupe by name (keep first), keep empties for visibility
  ansible.builtin.set_fact:
    docker_services_docker_secret_items: >-
      {%- set seen = {} -%}
      {%- set out = [] -%}
      {%- for s in (docker_services_docker_secret_items | default([])) -%}
      {%- set n = (s.name | string | trim) -%}
      {%- if (n | length > 0) and (n not in seen) -%}
      {%- set _ = seen.update({n: true}) -%}
      {%- set _ = out.append(s) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Secrets | Warn about empty secret values (if any)
  when: (docker_services_docker_secret_items | selectattr('value', 'equalto', '') | list | length) > 0
  ansible.builtin.debug:
    msg: >-
      Empty Docker secrets for service '{{ docker_services_svc.name | default("unknown") }}' (opt-in via docker_secret):
      {{ docker_services_docker_secret_items | selectattr('value','equalto','') | map(attribute='name') | list }}

- name: Create Docker secrets (swarm)
  when:
    - (docker_services_stack_deploy_type | default('container', true)) == 'swarm'
    - (docker_services_docker_secret_items | length) > 0
    - (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length) > 0
  community.docker.docker_secret:
    name: "{{ prep_sec.name }}"
    data: "{{ prep_sec.value }}"
    state: present
  loop: "{{ docker_services_docker_secret_items | selectattr('value','ne','') | list }}"
  loop_control:
    loop_var: prep_sec
    label: "{{ prep_sec.name }}"
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Ensure secrets directory exists on deploy host (compose/container)
  when:
    - (docker_services_stack_deploy_type | default('container', true)) != 'swarm'
    - (docker_services_docker_secret_items | length) > 0
    - (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length) > 0
  ansible.builtin.file:
    path: "/opt/stacks/{{ docker_services_stack_name }}/secrets"
    state: directory
    mode: "0700"
    owner: "{{ hostvars[docker_services_secrets_host_effective].puid | default('1000') }}"
    group: "{{ hostvars[docker_services_secrets_host_effective].pgid | default('1000') }}"
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Remove secret path if it exists but is a directory (compose/container pre-clean)
  when:
    - (docker_services_stack_deploy_type | default('container', true)) != 'swarm'
    - (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length) > 0
  ansible.builtin.file:
    path: "/opt/stacks/{{ docker_services_stack_name }}/secrets/{{ prep_sec.name }}"
    state: absent
  loop: "{{ docker_services_docker_secret_items | selectattr('value','ne','') | list }}"
  loop_control:
    loop_var: prep_sec
    label: "{{ prep_sec.name }}"
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Write secret files on deploy host (compose/container)
  when:
    - (docker_services_stack_deploy_type | default('container', true)) != 'swarm'
    - (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length) > 0
  ansible.builtin.copy:
    dest: "/opt/stacks/{{ docker_services_stack_name }}/secrets/{{ prep_sec.name }}"
    content: "{{ prep_sec.value }}"
    mode: "0600"
    owner: "{{ hostvars[docker_services_secrets_host_effective].puid | default('1000') }}"
    group: "{{ hostvars[docker_services_secrets_host_effective].pgid | default('1000') }}"
    force: true
  loop: "{{ docker_services_docker_secret_items | selectattr('value','ne','') | list }}"
  loop_control:
    loop_var: prep_sec
    label: "{{ prep_sec.name }}"
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Verify secret paths exist and are files (compose/container)
  when:
    - (docker_services_stack_deploy_type | default('container', true)) != 'swarm'
    - (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length) > 0
  ansible.builtin.stat:
    path: "/opt/stacks/{{ docker_services_stack_name }}/secrets/{{ prep_sec.name }}"
  loop: "{{ docker_services_docker_secret_items | selectattr('value','ne','') | list }}"
  loop_control:
    loop_var: prep_sec
    label: "{{ prep_sec.name }}"
  register: _secret_files_verify
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Fail if any secret path is not a file (compose/container)
  when:
    - (docker_services_stack_deploy_type | default('container', true)) != 'swarm'
    - (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length) > 0
  ansible.builtin.assert:
    that:
      - _secret_files_verify.results[sec_idx].stat.exists | default(false)
      - not (_secret_files_verify.results[sec_idx].stat.isdir | default(false))
    fail_msg: >-
      Secret path is not a file on deploy host '{{ docker_services_secrets_host_effective }}':
      /opt/stacks/{{ docker_services_stack_name }}/secrets/{{ (docker_services_docker_secret_items | selectattr('value','ne','') | list)[sec_idx].name }}
      This usually means Docker created it as a directory before secrets were written.
  loop: "{{ range(0, (docker_services_docker_secret_items | selectattr('value','ne','') | list | length)) | list }}"
  loop_control:
    loop_var: sec_idx
    label: "{{ (docker_services_docker_secret_items | selectattr('value','ne','') | list)[sec_idx].name }}"
