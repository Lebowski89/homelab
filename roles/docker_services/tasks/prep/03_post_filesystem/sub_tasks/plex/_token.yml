---

################################
# TOKEN (RUNS ON SWARM MANAGER)
################################

- name: Token | Set derived vars
  ansible.builtin.set_fact:
    docker_services_plex_token_host: >-
      {{ docker_services_primary_manager | string | trim }}
    docker_services_plex_token_ini_file: /opt/plex/plex.ini
  run_once: true

- name: Token | Assert token host is valid
  ansible.builtin.assert:
    that:
      - docker_services_plex_token_host | length > 0
      - docker_services_plex_token_host in hostvars
    fail_msg: "Derived Plex token host is invalid."
  run_once: true

- name: Token | Check if plex.ini exists
  ansible.builtin.stat:
    path: "{{ docker_services_plex_token_ini_file }}"
  register: docker_services_plex_ini
  delegate_to: "{{ docker_services_plex_token_host }}"
  run_once: true

- name: Token | Read plex.ini content
  when: docker_services_plex_ini.stat.exists
  ansible.builtin.slurp:
    src: "{{ docker_services_plex_token_ini_file }}"
  register: docker_services_plex_ini_raw
  delegate_to: "{{ docker_services_plex_token_host }}"
  run_once: true

- name: Token | Set client identifier fact
  when: docker_services_plex_ini.stat.exists
  delegate_to: "{{ docker_services_plex_token_host }}"
  run_once: true
  block:
    - name: Token | Extract client_identifier
      ansible.builtin.set_fact:
        docker_services_plex_client_identifier: >-
          {{
            (
              docker_services_plex_ini_raw.content
              | b64decode
              | regex_search('(?m)^client_identifier=(.+)$', '\\1')
              | default([])
              | first
              | default('')
              | string
              | trim
            )
          }}
        docker_services_plex_client_identifier_missing: >-
          {{
            (
              (
                docker_services_plex_ini_raw.content
                | b64decode
                | regex_search('(?m)^client_identifier=(.+)$', '\\1')
                | default([])
                | first
                | default('')
                | string
                | trim
              ) == ''
            )
          }}
      delegate_facts: true
  rescue:
    - name: Token | Set identifier to empty string
      ansible.builtin.set_fact:
        docker_services_plex_client_identifier: ""
        docker_services_plex_client_identifier_missing: true
      delegate_facts: true

- name: Token | Generate new identifier
  when: >-
    (not docker_services_plex_ini.stat.exists)
    or
    (hostvars[docker_services_plex_token_host].docker_services_plex_client_identifier_missing | default(false))
  ansible.builtin.set_fact:
    docker_services_plex_client_identifier: >-
      {{
        'plex' +
        (lookup('password', '/dev/null', chars=['ascii_lowercase', 'digits'], length=8))
      }}
  delegate_to: "{{ docker_services_plex_token_host }}"
  delegate_facts: true
  run_once: true

- name: Token | Set token variable if previously saved
  when:
    - docker_services_plex_ini.stat.exists
    - not (hostvars[docker_services_plex_token_host].docker_services_plex_client_identifier_missing | default(false))
  ansible.builtin.set_fact:
    docker_services_plex_auth_token: >-
      {{
        (
          docker_services_plex_ini_raw.content
          | b64decode
          | regex_search('(?m)^token=(.+)$', '\\1')
          | default([])
          | first
          | default('')
          | string
          | trim
        )
      }}
  delegate_to: "{{ docker_services_plex_token_host }}"
  delegate_facts: true
  run_once: true

- name: Token | Set docker_services_plex_no_token status
  ansible.builtin.set_fact:
    docker_services_plex_no_token: >-
      {{
        (not docker_services_plex_ini.stat.exists)
        or (hostvars[docker_services_plex_token_host].docker_services_plex_client_identifier_missing | default(false))
        or ((hostvars[docker_services_plex_token_host].docker_services_plex_auth_token | default('') | string | trim) == '')
      }}
  delegate_to: "{{ docker_services_plex_token_host }}"
  delegate_facts: true
  run_once: true

- name: Token | Check if token is valid
  when:
    - docker_services_plex_ini.stat.exists
    - not (hostvars[docker_services_plex_token_host].docker_services_plex_client_identifier_missing | default(false))
    - (hostvars[docker_services_plex_token_host].docker_services_plex_auth_token | default('') | string | length) > 0
  ansible.builtin.uri:
    url: "https://plex.tv/api/v2/user"
    method: GET
    return_content: true
    headers:
      Accept: "application/json"
      X-Plex-Token: "{{ hostvars[docker_services_plex_token_host].docker_services_plex_auth_token }}"
      X-Plex-Version: "1.0.0"
      X-Plex-Product: "plex"
      X-Plex-Client-Identifier: "{{ hostvars[docker_services_plex_token_host].docker_services_plex_client_identifier }}"
      X-Plex-Platform: "linux"
      X-Plex-Platform-Version: "1.0.0"
      X-Plex-Device: "Debian {{ hostvars[docker_services_plex_token_host].ansible_distribution_version }} - {{ hostvars[docker_services_plex_token_host].ansible_kernel }}"
      X-Plex-Device-Name: "Media Server"
    status_code: [200, 401]
  register: docker_services_plex_token
  delegate_to: "{{ docker_services_plex_token_host }}"
  run_once: true

- name: Token | Generate new token
  when:
    - (hostvars[docker_services_plex_token_host].docker_services_plex_no_token | default(true)) | bool
      or ((docker_services_plex_token is defined) and (docker_services_plex_token.status | default(0) | int) == 401)
  delegate_to: "{{ docker_services_plex_token_host }}"
  run_once: true
  block:
    - name: Token | Generate PIN
      ansible.builtin.uri:
        url: "https://plex.tv/api/v2/pins"
        method: POST
        return_content: true
        body:
          strong: "true"
        body_format: form-urlencoded
        headers:
          Accept: "application/json"
          X-Plex-Version: "1.0.0"
          X-Plex-Product: "plex"
          X-Plex-Client-Identifier: "{{ hostvars[docker_services_plex_token_host].docker_services_plex_client_identifier }}"
          X-Plex-Platform: "linux"
          X-Plex-Platform-Version: "1.0.0"
          X-Plex-Device: "Debian {{ ansible_distribution_version }} - {{ ansible_kernel }}"
          X-Plex-Device-Name: "Media Server"
        status_code: 201
      register: docker_services_plex_pin

    - name: Token | Login prompt
      ansible.builtin.pause:
        prompt: >-
          {% set plex_auth_url =
            'https://app.plex.tv/auth#?clientID=' ~ docker_services_plex_pin.json.clientIdentifier
            ~ '&code=' ~ docker_services_plex_pin.json.code
            ~ '&context%5Bdevice%5D%5Bproduct%5D=' ~ docker_services_plex_pin.json.product
          %}
          Please open
          {{ plex_auth_url }}
          and login. Hit enter after having logged in

    - name: Token | Check PIN
      ansible.builtin.uri:
        url: "https://plex.tv/api/v2/pins/{{ docker_services_plex_pin.json.id }}"
        method: GET
        return_content: true
        headers:
          Accept: "application/json"
          X-Plex-Client-Identifier: "{{ hostvars[docker_services_plex_token_host].docker_services_plex_client_identifier }}"
        status_code: 200
      register: docker_services_plex_token_new

    - name: Token | Set docker_services_plex_auth_token variable
      ansible.builtin.set_fact:
        docker_services_plex_auth_token: "{{ docker_services_plex_token_new.json.authToken | regex_replace('\n', '') }}"
      delegate_facts: true

    - name: Token | Check if new token is valid
      ansible.builtin.uri:
        url: "https://plex.tv/api/v2/user"
        method: GET
        return_content: true
        headers:
          Accept: "application/json"
          X-Plex-Token: "{{ hostvars[docker_services_plex_token_host].docker_services_plex_auth_token }}"
          X-Plex-Version: "1.0.0"
          X-Plex-Product: "plex"
          X-Plex-Client-Identifier: "{{ hostvars[docker_services_plex_token_host].docker_services_plex_client_identifier }}"
          X-Plex-Platform: "linux"
          X-Plex-Platform-Version: "1.0.0"
          X-Plex-Device: "Debian {{ ansible_distribution_version }} - {{ ansible_kernel }}"
          X-Plex-Device-Name: "Media Server"
        status_code: [200, 401]
      register: docker_services_plex_new_token

    - name: Token | Fail if new token is invalid
      when: (docker_services_plex_new_token.status | int) == 401
      ansible.builtin.fail:
        msg: "Something went wrong with the creation of the new token"

    - name: Token | Add Client Identifier to plex.ini
      community.general.ini_file:
        path: "{{ docker_services_plex_token_ini_file }}"
        section: "plex"
        option: "client_identifier"
        value: "{{ hostvars[docker_services_plex_token_host].docker_services_plex_client_identifier }}"
        create: true
        owner: "{{ hostvars[docker_services_plex_token_host].docker_host_puid | default('1000') }}"
        group: "{{ hostvars[docker_services_plex_token_host].docker_host_pgid | default('1000') }}"
        mode: "0664"

    - name: Token | Add Token to plex.ini
      community.general.ini_file:
        path: "{{ docker_services_plex_token_ini_file }}"
        section: "plex"
        option: "token"
        value: "{{ hostvars[docker_services_plex_token_host].docker_services_plex_auth_token }}"
        create: true
        owner: "{{ hostvars[docker_services_plex_token_host].docker_host_puid | default('1000') }}"
        group: "{{ hostvars[docker_services_plex_token_host].docker_host_pgid | default('1000') }}"
        mode: "0664"

- name: Token | Assert auth token is set
  ansible.builtin.assert:
    that:
      - (hostvars[docker_services_plex_token_host].docker_services_plex_auth_token | default('') | string | length) > 0
    fail_msg: "Plex auth token is empty after token preparation."
  run_once: true
