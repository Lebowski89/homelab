---

- name: Install postgres packages
  ansible.builtin.include_tasks:
    file: _apt.yml
    apply:
      tags:
        - postgres
        - postgres_apt
  tags:
    - postgres
    - postgres_apt

- name: Configure etcd
  ansible.builtin.include_tasks:
    file: _etcd.yml
    apply:
      tags:
        - postgres
        - postgres_etcd
  tags:
    - postgres
    - postgres_etcd

- name: Configure Patroni
  ansible.builtin.include_tasks:
    file: _patroni.yml
    apply:
      tags:
        - postgres
        - postgres_patroni
  tags:
    - postgres
    - postgres_patroni

- name: Ensure dedicated PostgreSQL admin role exists
  ansible.builtin.include_tasks:
    file: _pg_admin.yml
    apply:
      tags:
        - postgres
        - postgres_admin
  tags:
    - postgres
    - postgres_admin
