################################
# QUI
################################
  qui:
    name: "qui"
    image: "ghcr.io/hotio/qui:latest"
    named_networks:
      overlay:
        external: true
    healthcheck:
      test:
        - "CMD"
        - "wget"
        - "--spider"
        - "-q"
        - "http://127.0.0.1:7476/"
    environment:
      TZ: "{{ timezone }}"
      PUID: "1000"
      PGID: "{{ pgid }}"
      UMASK: "022"
      QUI__METRICS_ENABLED: "true"
      QUI__METRICS_HOST: "0.0.0.0"
      QUI__METRICS_PORT: "9074"
    ports:
      web:
        published: 7476
        target: 7476
        protocol: tcp
        mode: ingress
      metrics:
        published: 9074
        target: 9074
        protocol: tcp
        mode: ingress
    directories:
      - path: "/opt/qui"
        owner: "{{ puid }}"
        group: "{{ pgid }}"
        mode: "0755"
    volumes:
      config:
        type: bind
        source: "/opt/qui"
        target: "/config"
        read_only: false
    traefik:
      enable: true
      api_rule: ""
    deploy:
      type: "swarm"
      mode: "replicated"
      replicas: "1"
      host: "localhost"
      constraints: "node.labels.ansible_host == localhost"

################################
# UNPACKERR
################################
  unpackerr:
    name: "unpackerr"
    image: "ghcr.io/hotio/unpackerr:latest"
    named_networks:
      overlay:
        external: true
    healthcheck:
      test:
        - "CMD-SHELL" 
        - "test -d /config && test -r /config && test -w /config && (tmp=/config/.healthcheck.$$.tmp && : > \"$tmp\" && rm -f \"$tmp\")"
    environment:
      TZ: "{{ timezone }}"
      PUID: "{{ puid }}"
      PGID: "{{ pgid }}"
      UMASK: "022"
      UN_INTERVAL: "2m"
      UN_START_DELAY: "1m"
      UN_RETRY_DELAY: "5m"
      UN_MAX_RETRIES: "3"
      UN_PARALLEL: "1"
      UN_FILE_MODE: "0644"
      UN_DIR_MODE: "0755"
      UN_DEBUG: "false"
      UN_QUIET: "false"
      UN_ERROR_STDERR: "false"
      UN_ACTIVITY: "false"
      UN_LOG_QUEUES: "1m"
      UN_WEBSERVER_METRICS: "true"
      UN_WEBSERVER_LISTEN_ADDR: "0.0.0.0:5656"
      UN_WEBSERVER_URLBASE: "/"
      UN_WEBSERVER_UPSTREAMS: "{{ docker_network_subnet | default('') }}"
    infisical:
      fail_on_empty: true
      secrets_map:
        - { var: unpackerr_notifiarr_webhook,   path: "/Unpackerr",   name: "NOTIFIARR_WEBHOOK" }
        - { var: lidarr_api,                    path: "/Lidarr",      name: "API" }
        - { var: radarr_api,                    path: "/Radarr",      name: "API" }
        - { var: radarr_4k_api,                 path: "/Radarr-4K",   name: "API" }
        - { var: sonarr_api,                    path: "/Sonarr",      name: "API" }
        - { var: sonarr_4k_api,                 path: "/Sonarr-4K",   name: "API" }
        - { var: whisparr_api,                  path: "/Whisparr",    name: "API" }
    directories:
      - path: "/opt/unpackerr"
        owner: "{{ puid }}"
        group: "{{ pgid }}"
        mode: "0755"
    templates:
      - src: "configs/unpackerr.conf.j2"
        dest: "/opt/unpackerr/unpackerr.conf"
        owner: "{{ puid }}"
        group: "{{ pgid }}"
        mode: "0664"
        force: true
    volumes:
      config:
        type: bind
        source: "/opt/unpackerr"
        target: "/config"
        read_only: false
      media:
        type: bind
        source: "/mnt/unionfs"
        target: "/mnt"
        read_only: false
    extractions:
      downloads_path: "/mnt/torrents/completed"
      protocols: "torrent"
      timeout: "60s"
      delete_delay: "10m"
      delete_orig: "true"
    deploy:
      type: "swarm"
      mode: "replicated"
      replicas: "1"
      host: "localhost"
      constraints:
        - "node.labels.ansible_host == localhost"