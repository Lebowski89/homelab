################################
# QBITTORRENT
################################
  qbittorrent:
    image: "ghcr.io/hotio/qbittorrent:latest"
    named_networks:
      overlay:
        external: true
    traefik:
      enable: true
      api_rule: "PathPrefix(`/api`) || PathPrefix(`/command`) || PathPrefix(`/query`) || PathPrefix(`/login`) || PathPrefix(`/sync`)"
    targets:
      swarm:
        name: "qbittorrent"
        healthcheck:
          test:
            - "CMD"
            - "wget"
            - "--spider"
            - "-q"
            - "http://127.0.0.1:8090/"
        environment:
          PUID: '{{ puid }}'
          PGID: '{{ pgid }}'
          TZ: '{{ timezone }}'
          WEBUI_PORTS: "8090/tcp,8090/udp"
          VPN_ENABLED: "true"
          VPN_CONF: "wg0"
          VPN_PROVIDER: "proton"
          VPN_LAN_NETWORK: "192.168.80.0/24"
          VPN_LAN_LEAK_ENABLED: "false"
          VPN_AUTO_PORT_FORWARD: "true"
          VPN_FIREWALL_TYPE: "auto"
        ports:
          web:
            published: 8090
            target: 8090
            protocol: tcp
            mode: ingress
        directories:
          - path: "/opt/qbittorrent"
            owner: "{{ puid }}"
            group: "{{ pgid }}"
            mode: "0755"
          - path: "/opt/qbittorrent/config"
            owner: "{{ puid }}"
            group: "{{ pgid }}"
            mode: "0755"
          - path: "/opt/qbittorrent/wireguard"
            owner: "{{ puid }}"
            group: "{{ pgid }}"
            mode: "0755"
        volumes:
          config:
            type: bind
            source: "/opt/qbittorrent"
            target: "/config"
            read_only: false
          media:
            type: bind
            source: "/mnt/unionfs/torrents"
            target: "/mnt/torrents"
            read_only: false
        deploy:
          type: "swarm"
          mode: "replicated"
          replicas: "1"
          host: "localhost"
          constraints: "node.labels.ansible_host == localhost"
      unraid:
        name: "qbittorrent-unraid"
        healthcheck:
          test:
            - "CMD"
            - "wget"
            - "--spider"
            - "-q"
            - "http://127.0.0.1:8091/"
        environment:
          PUID: "{{ hostvars['unraid']['puid'] }}"
          PGID: "{{ hostvars['unraid']['pgid'] }}"
          TZ: '{{ timezone }}'
          WEBUI_PORTS: "8091/tcp,8091/udp"
          VPN_ENABLED: "true"
          VPN_CONF: "wg0"
          VPN_PROVIDER: "proton"
          VPN_LAN_NETWORK: "192.168.80.0/24"
          VPN_LAN_LEAK_ENABLED: "false"
          VPN_AUTO_PORT_FORWARD: "true"
          VPN_FIREWALL_TYPE: "auto"
        ports:
          web:
            published: 8091
            target: 8091
            protocol: tcp
            mode: ingress
        directories:
          - path: "/mnt/user/appdata/qbittorrent"
            owner: "{{ hostvars['unraid']['puid'] }}"
            group: "{{ hostvars['unraid']['pgid'] }}"
            mode: "0755"
          - path: "/mnt/user/appdata/qbittorrent/config"
            owner: "{{ hostvars['unraid']['puid'] }}"
            group: "{{ hostvars['unraid']['pgid'] }}"
            mode: "0755"
          - path: "/mnt/user/appdata/qbittorrent/wireguard"
            owner: "{{ hostvars['unraid']['puid'] }}"
            group: "{{ hostvars['unraid']['pgid'] }}"
            mode: "0755"
        volumes:
          config:
            type: bind
            source: "/mnt/user/appdata/qbittorrent"
            target: "/config"
            read_only: false
          media:
            type: bind
            source: "/mnt/user/data/seeds"
            target: "/data/seeds"
            read_only: false
        deploy:
          type: "swarm"
          mode: "replicated"
          replicas: "1"
          host: "unraid"
          constraints: "node.labels.ansible_host == unraid"



