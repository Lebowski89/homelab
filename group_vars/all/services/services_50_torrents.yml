################################
# QBIT-MANAGE
################################
  qbit_manage:
    image: "ghcr.io/stuffanthings/qbit_manage:latest"
    named_networks:
      overlay:
        external: true
    healthcheck:
      test:
        - "CMD-SHELL"
        - "test -d /config && test -r /config && test -w /config && (tmp=/config/.healthcheck.$$.tmp && : > \"$tmp\" && rm -f \"$tmp\")"
    targets:
      swarm:
        name: "qbit-manage"
        environment:
          TZ: "{{ timezone }}"
          PUID: "{{ puid }}"
          PGID: "{{ pgid }}"
          UMASK: "022"
          QBT_WEB_SERVER: "true"
          QBT_PORT: "8080"
          QBT_RUN: "true"
          QBT_SCHEDULE: "1440"
          QBT_CONFIG_DIR: "/config"
          QBT_RECHECK: "true"
          QBT_CAT_UPDATE: "true"
          QBT_TAG_UPDATE: "true"
          QBT_REM_UNREGISTERED: "true"
          QBT_REM_ORPHANED: "true"
          QBT_TAG_TRACKER_ERROR: "true"
          QBT_TAG_NOHARDLINKS: "true"
          QBT_SHARE_LIMITS: "true"
          QBT_SKIP_CLEANUP: "false"
          QBT_DRY_RUN: "false"
          QBT_STARTUP_DELAY: "0"
          QBT_SKIP_QB_VERSION_CHECK: "false"
          QBT_DEBUG: "false"
          QBT_TRACE: "false"
          QBT_LOG_LEVEL: "INFO"
          QBT_LOG_SIZE: "10"
          QBT_LOG_COUNT: "5"
          QBT_DIVIDER: "="
          QBT_WIDTH: "100"
        ports:
          web:
            published: 9080
            target: 8080
            protocol: tcp
            mode: ingress
        directories:
          - path: "/opt/qbit-manage"
            owner: "{{ puid }}"
            group: "{{ pgid }}"
            mode: "0755"
        volumes:
          config:
            type: bind
            source: "/opt/qbit-manage"
            target: "/config"
            read_only: false
          media:
            type: bind
            source: "/mnt/unionfs/torrents"
            target: "/mnt/torrents"
            read_only: false
        deploy:
          type: "swarm"
          mode: "replicated"
          replicas: "1"
          host: "localhost"
          constraints: "node.labels.ansible_host == localhost"
      unraid:
        name: "qbit-manage-unraid"
        environment:
          TZ: "{{ timezone }}"
          PUID: "{{ hostvars['unraid']['puid'] }}"
          PGID: "{{ hostvars['unraid']['pgid'] }}"
          UMASK: "022"
          QBT_WEB_SERVER: "true"
          QBT_PORT: "8080"
          QBT_RUN: "true"
          QBT_SCHEDULE: "1440"
          QBT_CONFIG_DIR: "/config"
          QBT_RECHECK: "true"
          QBT_CAT_UPDATE: "true"
          QBT_TAG_UPDATE: "true"
          QBT_REM_UNREGISTERED: "true"
          QBT_REM_ORPHANED: "true"
          QBT_TAG_TRACKER_ERROR: "true"
          QBT_TAG_NOHARDLINKS: "true"
          QBT_SHARE_LIMITS: "true"
          QBT_SKIP_CLEANUP: "false"
          QBT_DRY_RUN: "false"
          QBT_STARTUP_DELAY: "0"
          QBT_SKIP_QB_VERSION_CHECK: "false"
          QBT_DEBUG: "false"
          QBT_TRACE: "false"
          QBT_LOG_LEVEL: "INFO"
          QBT_LOG_SIZE: "10"
          QBT_LOG_COUNT: "5"
          QBT_DIVIDER: "="
          QBT_WIDTH: "100"
        ports:
          web:
            published: 9082
            target: 8080
            protocol: tcp
            mode: ingress
        directories:
          - path: "/mnt/user/appdata/qbit-manage"
            owner: "{{ hostvars['unraid']['puid'] }}"
            group: "{{ hostvars['unraid']['pgid'] }}"
            mode: "0755"
        volumes:
          config:
            type: bind
            source: "/mnt/user/appdata/qbit-manage"
            target: "/config"
            read_only: false
          media:
            type: bind
            source: "/mnt/user/data/seeds"
            target: "/data/seeds"
            read_only: false
        deploy:
          type: "swarm"
          mode: "replicated"
          replicas: "1"
          host: "unraid"
          constraints: "node.labels.ansible_host == unraid"



