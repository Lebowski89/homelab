---

nzbhydra2:
  name: nzbhydra2
  stack: usenet
  image: ghcr.io/hotio/nzbhydra2:release-8.4.1
  named_networks:
    overlay:
      external: true
  healthcheck:
    test:
      - "CMD"
      - "wget"
      - "--spider"
      - "-q"
      - "http://127.0.0.1:5076/actuator/health/ping"
  environment:
    TZ: "{{ timezone }}"
    PUID: "99"
    PGID: "100"
    UMASK: "022"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: nzbhydra2_user
        path: "/NZBHydra2"
        name: USER
      - var: nzbhydra2_pass
        path: "/NZBHydra2"
        name: PASS
      - var: nzbhydra2_api
        path: "/NZBHydra2"
        name: API
      - var: althub_user
        path: "/NZBHydra2"
        name: ALTHUB_USER
      - var: althub_api
        path: "/NZBHydra2"
        name: ALTHUB_API
      - var: geek_user
        path: "/NZBHydra2"
        name: GEEK_USER
      - var: geek_api
        path: "/NZBHydra2"
        name: GEEK_API
      - var: slug_user
        path: "/NZBHydra2"
        name: SLUG_USER
      - var: slug_api
        path: "/NZBHydra2"
        name: SLUG_API
      - var: sabnzbd_api
        path: "/SABnzbd"
        name: API
  paths:
    - path: /mnt/user/appdata/nzbhydra2
      state: directory
      owner: 99
      group: 100
      mode: "0755"
  volumes:
    config:
      type: bind
      source: /mnt/user/appdata/nzbhydra2
      target: /config
      read_only: false
  traefik:
    enable: true
    port: 5076
    sso: authelia
    internal_api: true
    internal_api_rules:
      - "PathPrefix(`/api`)"
      - "PathPrefix(`/getnzb`)"
      - "PathPrefix(`/gettorrent`)"
      - "PathPrefix(`/rss`)"
      - "PathPrefix(`/torznab/api`)"
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: unraid
    constraints:
      - node.labels.ansible_host == unraid
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
