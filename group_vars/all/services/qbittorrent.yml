---

qbittorrent:
  image: ghcr.io/hotio/qbittorrent:release-5.1.4
  stack: qbittorrent
  named_networks:
    overlay:
      external: true
  cap_add:
    - NET_ADMIN
  devices:
    - "/dev/net/tun:/dev/net/tun"
  sysctls:
    net.ipv4.conf.all.src_valid_mark: "1"
    net.ipv6.conf.all.disable_ipv6: "1"
  environment:
    PUID: "99"
    PGID: "100"
    TZ: "{{ timezone }}"
    FILE__VPN_PIA_USER: /run/secrets/qbittorrent_pia_user_secret
    FILE__VPN_PIA_PASS: /run/secrets/qbittorrent_pia_pass_secret
  secrets:
    - qbittorrent_pia_user_secret
    - qbittorrent_pia_pass_secret
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: unraid
    constraints:
      - node.labels.ansible_host == unraid
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
  targets:
    downloads:
      name: qbittorrent
      hostname: qbittorrent.internal
      healthcheck:
        test:
          - "CMD"
          - "wget"
          - "--spider"
          - "-q"
          - "http://127.0.0.1:8090/"
      env_file:
        - /opt/stacks/qbittorrent.env
      infisical:
        fail_on_empty: true
        secrets_map:
          - var: qbittorrent_user
            path: "/qBittorrent"
            name: USER
          - var: qbittorrent_pass
            path: "/qBittorrent"
            name: PASS
          - var: qbittorrent_pia_user
            path: "/PIA"
            name: USER
            docker_secret: qbittorrent_pia_user_secret
          - var: qbittorrent_pia_pass
            path: "/PIA"
            name: PASS
            docker_secret: qbittorrent_pia_pass_secret
      paths:
        - path: /mnt/user/appdata/qbittorrent
          state: directory
          owner: 99
          group: 100
          mode: "0755"
        - path: /mnt/user/appdata/qbittorrent/config
          state: directory
          owner: 99
          group: 100
          mode: "0755"
        - path: /mnt/user/appdata/qbittorrent/wireguard
          state: directory
          owner: 99
          group: 100
          mode: "0755"
        - path: /mnt/user/data/torrents
          state: directory
          owner: 99
          group: 100
          mode: "0755"
        - path: /mnt/user/data/torrents/completed
          state: directory
          owner: 99
          group: 100
          mode: "0755"
        - path: /mnt/user/data/torrents/incoming
          state: directory
          owner: 99
          group: 100
          mode: "0755"
        - path: /mnt/user/data/torrents/watched
          state: directory
          owner: 99
          group: 100
          mode: "0755"
      templates:
        - src: configs/qbittorrent/qBittorrent.conf.j2
          dest: /mnt/user/appdata/qbittorrent/config/qBittorrent.conf
          owner: 99
          group: 100
          mode: "0664"
          force: true
      swarm_env_templates:
        - src: configs/qbittorrent/qBittorrent.env.j2
          dest: /opt/stacks/qbittorrent.env
          owner: 1000
          group: 1000
          mode: "0600"
          force: true
      volumes:
        config:
          type: bind
          source: /mnt/user/appdata/qbittorrent
          target: /config
          read_only: false
        media:
          type: bind
          source: /mnt/user/data/torrents
          target: /data/torrents
          read_only: false
      traefik:
        enable: true
        port: 8090
        sso: authelia
        internal_api: true
        internal_api_rules:
          - "PathPrefix(`/api`)"
          - "PathPrefix(`/command`)"
          - "PathPrefix(`/query`)"
          - "PathPrefix(`/login`)"
          - "PathPrefix(`/sync`)"
      cloudflare:
        enable: true
    seeds:
      name: qbittorrent-xs
      hostname: qbittorrent-xs.internal
      healthcheck:
        test:
          - "CMD"
          - "wget"
          - "--spider"
          - "-q"
          - "http://127.0.0.1:8091/"
      env_file:
        - /opt/stacks/qbittorrent-xs.env
      infisical:
        fail_on_empty: true
        secrets_map:
          - var: qbittorrent_xs_user
            path: "/qBittorrent-XS"
            name: USER
          - var: qbittorrent_xs_pass
            path: "/qBittorrent-XS"
            name: PASS
          - var: qbittorrent_pia_user
            path: "/PIA"
            name: USER
            docker_secret: qbittorrent_pia_user_secret
          - var: qbittorrent_pia_pass
            path: "/PIA"
            name: PASS
            docker_secret: qbittorrent_pia_pass_secret
      paths:
        - path: /mnt/user/appdata/qbittorrent-xs
          state: directory
          owner: 99
          group: 100
          mode: "0755"
        - path: /mnt/user/appdata/qbittorrent-xs/config
          state: directory
          owner: 99
          group: 100
          mode: "0755"
        - path: /mnt/user/appdata/qbittorrent-xs/wireguard
          state: directory
          owner: 99
          group: 100
          mode: "0755"
        - path: /mnt/user/data/seeds
          state: directory
          owner: 99
          group: 100
          mode: "0755"
        - path: /mnt/user/data/seeds/completed
          state: directory
          owner: 99
          group: 100
          mode: "0755"
        - path: /mnt/user/data/seeds/incoming
          state: directory
          owner: 99
          group: 100
          mode: "0755"
        - path: /mnt/user/data/seeds/watched
          state: directory
          owner: 99
          group: 100
          mode: "0755"
      templates:
        - src: configs/qbittorrent/qBittorrent-xs.conf.j2
          dest: /mnt/user/appdata/qbittorrent-xs/config/qBittorrent.conf
          owner: 99
          group: 100
          mode: "0664"
          force: true
      swarm_env_templates:
        - src: configs/qbittorrent/qBittorrent-xs.env.j2
          dest: /opt/stacks/qbittorrent-xs.env
          owner: 1000
          group: 1000
          mode: "0600"
          force: true
      volumes:
        config:
          type: bind
          source: /mnt/user/appdata/qbittorrent-xs
          target: /config
          read_only: false
        media:
          type: bind
          source: /mnt/user/data/seeds
          target: /data/seeds
          read_only: false
      traefik:
        enable: true
        port: 8091
        sso: authelia
        internal_api: true
        internal_api_rules:
          - "PathPrefix(`/api`)"
          - "PathPrefix(`/command`)"
          - "PathPrefix(`/query`)"
          - "PathPrefix(`/login`)"
          - "PathPrefix(`/sync`)"
      cloudflare:
        enable: true
