---

spilo:
  name: spilo
  stack: spilo
  container_name: spilo
  image: ghcr.io/zalando/spilo-17:4.0-p3
  network_mode: host
  pid: host
  cap_add:
    - SYS_NICE
    - IPC_LOCK
  security_opt:
    - "apparmor:unconfined"
  infisical:
    fail_on_empty: true
    secrets_map:
      - { var: spilo_superuser_pass, path: "/Spilo", name: "SUPERUSER_PASS" }
      - { var: spilo_replication_pass, path: "/Spilo", name: "REPLICATION_PASS" }
  paths:
    - path: /opt/spilo/data
      state: directory
      owner: 1000
      group: 1000
      mode: 0755
  volumes:
    data:
      type: bind
      source: /opt/spilo/data
      target: /home/postgres/pgroot
      read_only: false
  targets:
    pg01:
      environment:
        SCOPE: "pg-cluster"
        ETCD_HOSTS: '"192.168.80.92:2379","192.168.80.93:2379","192.168.80.94:2379"'
        SPILO_CONFIGURATION: >-
          {{
            {
              "restapi": {
              "listen": "0.0.0.0:8008",
              "connect_address": "192.168.80.92:8008"
              },
              "postgresql": {
              "listen": "0.0.0.0:5433",
              "connect_address": "192.168.80.92:5433"
              }
            } | to_json
          }}
        APIPORT: "8008"
        spilo_NAME: "pg01"
        RESTAPI_CONNECT_ADDRESS: "192.168.80.92:8008"
        PGPORT: "5433"
        PGROOT: "/home/postgres/pgroot"
        PGDATA: "/home/postgres/pgroot/pgdata"
        ALLOW_NOSSL: "true"
        # Users / Passwords
        PGUSER_SUPERUSER: "postgres"
        PGPASSWORD_SUPERUSER: "{{ spilo_superuser_pass | default('__INFISICAL__:spilo_superuser_pass', true) }}"
        PGUSER_STANDBY: "replicator"
        PGPASSWORD_STANDBY: "{{ spilo_replication_pass | default('__INFISICAL__:spilo_replication_pass', true) }}"
        # Optional: don’t create the extra admin user
        USE_ADMIN: "false"
      deploy:
        type: container
        host: pg01
    pg02:
      environment:
        SCOPE: "pg-cluster"
        ETCD_HOSTS: '"192.168.80.92:2379","192.168.80.93:2379","192.168.80.94:2379"'
        SPILO_CONFIGURATION: >-
          {{
            {
              "restapi": {
              "listen": "0.0.0.0:8008",
              "connect_address": "192.168.80.93:8008"
              },
              "postgresql": {
              "listen": "0.0.0.0:5433",
              "connect_address": "192.168.80.93:5433"
              }
            } | to_json
          }}
        APIPORT: "8008"
        spilo_NAME: "pg02"
        RESTAPI_CONNECT_ADDRESS: "192.168.80.93:8008"
        PGPORT: "5433"
        PGROOT: "/home/postgres/pgroot"
        PGDATA: "/home/postgres/pgroot/pgdata"
        ALLOW_NOSSL: "true"
        STANDBY_HOST: "192.168.80.92"
        STANDBY_PORT: "5433"
        # Users / Passwords
        PGUSER_SUPERUSER: "postgres"
        PGPASSWORD_SUPERUSER: "{{ spilo_superuser_pass | default('__INFISICAL__:spilo_superuser_pass', true) }}"
        PGUSER_STANDBY: "replicator"
        PGPASSWORD_STANDBY: "{{ spilo_replication_pass | default('__INFISICAL__:spilo_replication_pass', true) }}"
        # Optional: don’t create the extra admin user
        USE_ADMIN: "false"
      deploy:
        type: container
        host: pg02
    pg03:
      environment:
        SCOPE: "pg-cluster"
        ETCD_HOSTS: '"192.168.80.92:2379","192.168.80.93:2379","192.168.80.94:2379"'
        SPILO_CONFIGURATION: >-
          {{
            {
              "restapi": {
              "listen": "0.0.0.0:8008",
              "connect_address": "192.168.80.94:8008"
              },
              "postgresql": {
              "listen": "0.0.0.0:5433",
              "connect_address": "192.168.80.94:5433"
              }
            } | to_json
          }}
        APIPORT: "8008"
        spilo_NAME: "pg03"
        RESTAPI_CONNECT_ADDRESS: "192.168.80.94:8008"
        PGPORT: "5433"
        PGROOT: "/home/postgres/pgroot"
        PGDATA: "/home/postgres/pgroot/pgdata"
        ALLOW_NOSSL: "true"
        STANDBY_HOST: "192.168.80.92"
        STANDBY_PORT: "5433"
        # Users / Passwords
        PGUSER_SUPERUSER: "postgres"
        PGPASSWORD_SUPERUSER: "{{ spilo_superuser_pass | default('__INFISICAL__:spilo_superuser_pass', true) }}"
        PGUSER_STANDBY: "replicator"
        PGPASSWORD_STANDBY: "{{ spilo_replication_pass | default('__INFISICAL__:spilo_replication_pass', true) }}"
        # Optional: don’t create the extra admin user
        USE_ADMIN: "false"
      deploy:
        type: container
        host: pg03
