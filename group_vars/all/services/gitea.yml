---

gitea:
  name: gitea
  stack: gitea
  image: docker.gitea.com/gitea:1.25.4
  named_networks:
    overlay:
      external: true
  healthcheck:
    test:
      - "CMD"
      - "wget"
      - "--spider"
      - "-q"
      - "http://127.0.0.1:3000/api/healthz"
  environment:
    TZ: "{{ timezone }}"
    USER_UID: "1000"
    USER_GID: "1000"
    UMASK: "022"
  env_file:
    - /opt/gitea/.env
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: postgres_user
        path: "/Postgres"
        name: USER
      - var: postgres_pass
        path: "/Postgres"
        name: PASS
  paths:
    - path: /opt/gitea
      state: directory
      owner: 1000
      group: 1000
      mode: 0755
  templates:
    - src: configs/core/gitea.env.j2
      dest: /opt/gitea/.env
      owner: 1000
      group: 1000
      mode: 0664
      force: true
  volumes:
    config:
      type: bind
      source: /opt/gitea
      target: /data
      read_only: false
  postgres:
    enable: true
    databases:
      - gitea
  traefik:
    enable: true
    port: 3000
    sso: authelia
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: localhost
    constraints: node.labels.ansible_host == localhost
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
