---

bazarr:
  name: bazarr
  stack: bazarr
  image: ghcr.io/hotio/bazarr:release-v1.5.6
  named_networks:
    overlay:
      external: true
  healthcheck:
    test:
      - "CMD"
      - "curl"
      - "--fail"
      - "http://localhost:6767"
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[docker_services_unraid_host].docker_host_puid | string }}"
    PGID: "{{ hostvars[docker_services_unraid_host].docker_host_pgid | string }}"
    UMASK: "022"
    WEBUI_PORTS: "6767/tcp,6767/udp"
    TP_SCHEME: "http"
    TP_DOMAIN: "192.168.80.48:8089"
    TP_HOTIO: "true"
    TP_THEME: "hotline"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: bazarr_api
        path: "/Bazarr"
        name: API
      - var: opensubtitlescom_user
        path: "/Bazarr"
        name: OPENSUBSCOM_USER
      - var: opensubtitlescom_pass
        path: "/Bazarr"
        name: OPENSUBSCOM_PASS
      - var: radarr_api
        path: "/Radarr"
        name: API
      - var: sonarr_api
        path: "/Sonarr"
        name: API
      - var: postgres_user
        path: "/Postgres"
        name: USER
      - var: postgres_pass
        path: "/Postgres"
        name: PASS
  paths:
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/bazarr"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/bazarr/config"
      state: directory
      mode: "0755"
  copies:
    - src: files/themepark/98-themepark-bazarr
      dest: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/bazarr/98-themepark-bazarr"
      mode: "0755"
      force: false
      wait: true
      wait_timeout: 30
  volumes:
    config:
      type: bind
      source: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/bazarr"
      target: /config
      read_only: false
    media:
      type: bind
      source: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}"
      target: /data
      read_only: false
    themepark:
      type: bind
      source: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/bazarr/98-themepark-bazarr"
      target: /etc/cont-init.d/98-themepark
      read_only: false
  traefik:
    enable: true
    port: 6767
    sso: authelia
    internal_api: true
    internal_api_rules:
      - "PathPrefix(`/api`)"
  cloudflare:
    enable: true
  themepark:
    app: bazarr
    theme: hotline
  postgres:
    enable: true
    databases:
      - bazarr
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: "{{ docker_services_unraid_host }}"
    constraints:
      - node.labels.docker_services_host == docker_services_unraid_host
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
