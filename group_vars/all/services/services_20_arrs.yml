      - postgres_pass_secret
    paths:
      - path: "/mnt/user/appdata/prowlarr"
        state: directory
        owner: "99"
        group: "100"
        mode: "0755"
    copies:
      - src: "files/themepark/98-themepark-prowlarr"
        dest: "/mnt/user/appdata/prowlarr/98-themepark-prowlarr"
        owner: "99"
        group: "100"
        mode: "0755"
        force: false
        wait: true
        wait_timeout: 30
    volumes:
      config:
        type: bind
        source: "/mnt/user/appdata/prowlarr"
        target: "/config"
        read_only: false
      media:
        type: bind
        source: "/mnt/user/data"
        target: "/data"
        read_only: false
      themepark:
        type: bind
        source: "/mnt/user/appdata/prowlarr/98-themepark-prowlarr"
        target: "/etc/cont-init.d/98-themepark"
        read_only: false
    traefik:
      enable: true
      port: 9696
      sso: authelia
      internal_api: true
      internal_api_rules:
        - "PathRegexp(`^/[0-9]+/api`)"
        - "PathRegexp(`^/[0-9]+/download`)"
        - "PathPrefix(`/api`)"
        - "PathPrefix(`/ping`)"
    themepark:
      app: prowlarr
      theme: hotline
    postgres:
      enable: true
      databases:
        - "prowlarr-main"
        - "prowlarr-log"
      clean_sqlite: true
    deploy:
      type: "swarm"
      mode: "replicated"
      replicas: 1
      host: "unraid"
      constraints:
        - "node.labels.ansible_host == unraid"
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 2m

