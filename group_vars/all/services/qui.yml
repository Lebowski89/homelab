---

qui:
  name: qui
  stack: qui
  image: ghcr.io/autobrr/qui:pr-1530
  named_networks:
    overlay:
      external: true
  healthcheck:
    test:
      - "CMD"
      - "wget"
      - "--spider"
      - "-q"
      - "http://127.0.0.1:7476/"
  environment:
    TZ: "{{ timezone }}"
    PUID: "99"
    PGID: "100"
    UMASK: "022"
  env_file:
    - /opt/stacks/qui.env
  paths:
    - path: /mnt/user/appdata/qui
      state: directory
      owner: 100
      group: 99
      mode: "0755"
  swarm_env_templates:
    - src: configs/qui.env.j2
      dest: /opt/stacks/qui.env
      owner: 1000
      group: 1000
      mode: "0600"
      force: true
  volumes:
    config:
      type: bind
      source: /mnt/user/appdata/qui
      target: /config
      read_only: false
    media:
      type: bind
      source: /mnt/user/data
      target: /data
      read_only: false
  traefik:
    enable: true
    port: 7476
    sso: authelia
  cloudflare:
    enable: true
  postgres:
    enable: true
    databases:
      - qui
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: unraid
    constraints: node.labels.ansible_host == unraid
