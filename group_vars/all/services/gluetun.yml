---

gluetun:
  name: gluetun
  stack: gluetun
  container_name: gluetun
  image: qmcgaw/gluetun:v3.41.1
  named_networks:
    overlay:
      external: true
  cap_add:
    - NET_ADMIN
  devices:
    - "/dev/net/tun:/dev/net/tun"
  environment:
    TZ: "{{ timezone }}"
    PUID: "99"
    PGID: "100"
    UMASK: "022"
    FIREWALL_OUTBOUND_SUBNETS: "192.168.80.0/24"
    UPDATER_PERIOD: "24h"
    BLOCK_MALICIOUS: "off"
    VPN_SERVICE_PROVIDER: "protonvpn"
    VPN_TYPE: "wireguard"
    WIREGUARD_ADDRESSES: "{{ gluetun_wg_addresses | default('__INFISICAL__:gluetun_wg_addresses', true) }}"
    WIREGUARD_PRIVATE_KEY: "{{ gluetun_wg_private_key | default('__INFISICAL__:gluetun_wg_private_key', true) }}"
    SERVER_COUNTRIES: "Netherlands,Germany,Poland,Switzerland"
    PORT_FORWARD_ONLY: "on"
    VPN_PORT_FORWARDING: "on"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: gluetun_wg_addresses
        path: "/Gluetun"
        name: WG_ADDRESSES
      - var: gluetun_wg_private_key
        path: "/Gluetun"
        name: WG_PRIVATE_KEY
  ports:
    web:
      published: 6881
      target: 6881
      protocol: tcp
      mode: ingress
    jd2_web:
      published: 5800
      target: 5800
      protocol: tcp
      mode: ingress
    librewolf_web:
      published: 3008
      target: 3000
      protocol: tcp
      mode: ingress
    librewolf_web_secure:
      published: 3009
      target: 3001
      protocol: tcp
      mode: ingress
  paths:
    - path: /mnt/user/appdata/gluetun
      state: directory
      owner: 99
      group: 100
      mode: "0755"
    - path: /mnt/user/data/media/gluetun
      state: directory
      owner: 99
      group: 100
      mode: "0755"
  volumes:
    config:
      type: bind
      source: /mnt/user/appdata/gluetun
      target: /gluetun
      read_only: false
  deploy:
    type: container
    host: unraid
