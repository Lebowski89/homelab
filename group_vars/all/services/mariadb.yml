---

mariadb:
  name: mariadb
  stack: mariadb
  image: mariadb:12
  named_networks:
    overlay:
      external: true
  user: "1000:1000"
  environment:
    TZ: "{{ timezone }}"
    MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_pass_secret
    MARIADB_USER: "mariadb"
    MARIADB_PASSWORD_FILE: /run/secrets/mariadb_pass_secret
    MARIADB_DATABASE: "default"
    MARIADB_AUTO_UPGRADE: "1"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: mariadb_pass
        path: "/MariaDB"
        name: PASS
        docker_secret: mariadb_pass_secret
  secrets:
    - mariadb_pass_secret
  paths:
    - path: /opt/mariadb
      state: directory
      owner: 1000
      group: 1000
      mode: "0755"
  volumes:
    config:
      type: bind
      source: /opt/mariadb
      target: /var/lib/mysql
      read_only: false
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: localhost
    constraints:
      - node.labels.ansible_host == localhost
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
