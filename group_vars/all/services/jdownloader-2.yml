---

jdownloader2:
  name: jdownloader-2
  stack: gluetun
  container_name: jdownloader-2
  image: jlesage/jdownloader-2:v26.03.1
  depends_on:
    - gluetun
  network_mode: "service:gluetun"
  environment:
    USER_ID: "{{ hostvars[docker_services_unraid_host].docker_host_puid }}"
    GROUP_ID: "{{ hostvars[docker_services_unraid_host].docker_host_pgid }}"
  paths:
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/jdownloader-2"
      state: directory
      mode: "0755"
  volumes:
    config:
      type: bind
      source: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/jdownloader-2"
      target: /config
      read_only: false
    downloads:
      type: bind
      source: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}/media/jdownloader-2"
      target: /downloads
      read_only: false
  deploy:
    type: container
    host: "{{ docker_services_unraid_host }}"
