---

jdownloader2:
  name: jdownloader-2
  stack: gluetun
  container_name: jdownloader-2
  image: jlesage/jdownloader-2:v26.03.1
  depends_on:
    - gluetun
  network_mode: "service:gluetun"
  environment:
    USER_ID: "99"
    GROUP_ID: "100"
  paths:
    - path: "{{ hostvars['unraid'].docker_host_appdata_root }}/jdownloader-2"
      state: directory
      mode: "0755"
  volumes:
    config:
      type: bind
      source: "{{ hostvars['unraid'].docker_host_appdata_root }}/jdownloader-2"
      target: /config
      read_only: false
    downloads:
      type: bind
      source: "{{ hostvars['unraid'].docker_host_data_root }}/media/jdownloader-2"
      target: /downloads
      read_only: false
  deploy:
    type: container
    host: unraid
