---

autopulse_ui:
  name: autopulse-ui
  stack: autopulse
  image: danonline/autopulse:ui@sha256:1d17cc6e6faedcb312db075b200b7acfdbc62d6f749bcc173719d491526b13e3
  named_networks:
    overlay:
      external: true
  traefik:
    enable: true
    port: 2880
    sso: authelia
  cloudflare:
    enable: true
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: unraid
    constraints:
      - node.labels.ansible_host == unraid
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
