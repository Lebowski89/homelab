---

autobrr:
  name: autobrr
  stack: autobrr
  image: ghcr.io/autobrr/autobrr:v1.75.1
  named_networks:
    overlay:
      external: true
  healthcheck:
    test:
      - "CMD-SHELL"
      - "wget -qO- http://localhost:7474/ || exit 1"
  user: "1000:1000"
  environment:
    TZ: "{{ timezone }}"
    AUTOBRR__HOST: "0.0.0.0"
    AUTOBRR__PORT: "7474"
    AUTOBRR__LOG_LEVEL: "DEBUG"
    AUTOBRR__CHECK_FOR_UPDATES: "true"
    AUTOBRR__SESSION_SECRET: "{{ autobrr_session | default('__INFISICAL__:autobrr_session', true) }}"
    AUTOBRR__DATABASE_TYPE: "postgres"
    AUTOBRR__POSTGRES_HOST: "haproxy"
    AUTOBRR__POSTGRES_PORT: "5433"
    AUTOBRR__POSTGRES_DATABASE: "autobrr"
    AUTOBRR__POSTGRES_USER: "{{ postgres_user | default('__INFISICAL__:postgres_user', true) }}"
    AUTOBRR__POSTGRES_PASS: "{{ postgres_pass | default('__INFISICAL__:postgres_pass', true) }}"
    AUTOBRR__POSTGRES_SSLMODE: "disable"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: autobrr_session
        path: "/AutoBrr"
        name: SESSION_SECRET
      - var: postgres_user
        path: "/Postgres"
        name: USER
      - var: postgres_pass
        path: "/Postgres"
        name: PASS
  paths:
    - path: "{{ hostvars['mgt'].docker_host_appdata_root }}/autobrr"
      state: directory
      mode: "0755"
  volumes:
    config:
      type: bind
      source: "{{ hostvars['mgt'].docker_host_appdata_root }}/autobrr"
      target: /config
      read_only: false
  postgres:
    enable: true
    databases:
      - autobrr
  traefik:
    enable: true
    port: 7474
    sso: authelia
    internal_api: true
    internal_api_rules:
      - "PathPrefix(`/api`)"
  cloudflare:
    enable: true
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: mgt
    constraints:
      - node.labels.ansible_host == mgt
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
