---

cross_seed:
  name: cross-seed
  stack: cross-seed
  image: ghcr.io/cross-seed/cross-seed:master@sha256:2c90d10b8f7e46f6ad71fb5b2af3621e9e31fcca50b283af4a0d3daad0061f4e
  named_networks:
    overlay:
      external: true
  healthcheck:
    test:
      - "CMD"
      - "wget"
      - "--spider"
      - "-q"
      - "http://127.0.0.1:2468/api/ping"
  user: "{{ hostvars[docker_services_unraid_host].docker_host_puid | string }}:{{ hostvars[docker_services_unraid_host].docker_host_pgid | string }}"
  environment:
    TZ: "{{ timezone }}"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: cross_seed_api
        path: "/Cross-Seed"
        name: API
      - var: cross_seed_notifiarr_webhook
        path: "/Cross-Seed"
        name: NOTIFIARR_WEBHOOK
      - var: qbittorrent_xs_user
        path: "/qBittorrent-XS"
        name: USER
      - var: qbittorrent_xs_pass
        path: "/qBittorrent-XS"
        name: PASS
      - var: prowlarr_api
        path: "/Prowlarr"
        name: API
      - var: radarr_api
        path: "/Radarr"
        name: API
      - var: radarr_4k_api
        path: "/Radarr-4K"
        name: API
      - var: sonarr_api
        path: "/Sonarr"
        name: API
      - var: sonarr_4k_api
        path: "/Sonarr-4K"
        name: API
  paths:
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/cross-seed"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}/seeds"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}/seeds/links"
      state: directory
      mode: "0755"
  templates:
    - src: configs/cross_seed_config.j2
      dest: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/cross-seed/config.js"
      mode: "0664"
      force: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/cross-seed"
      target: /config
      read_only: false
    media:
      type: bind
      source: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}"
      target: /data
      read_only: false
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: "{{ docker_services_unraid_host }}"
    constraints:
      - node.labels.docker_services_host == docker_services_unraid_host
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
