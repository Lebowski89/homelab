---

kometa:
  name: kometa
  stack: kometa
  image: kometateam/kometa:v2.3.0
  named_networks:
    overlay:
      external: true
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars['plex'].docker_host_puid | string }}"
    PGID: "{{ hostvars['plex'].docker_host_pgid | string }}"
    UMASK: "022"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: mdblist_api
        path: "/Kometa"
        name: MDBLIST_API
      - var: tmdb_api
        path: "/Kometa"
        name: TMDB_API
      - var: trakt_id
        path: "/Kometa"
        name: TRAKT_ID
      - var: trakt_secret
        path: "/Kometa"
        name: TRAKT_SECRET
      - var: radarr_api
        path: "/Radarr"
        name: API
      - var: sonarr_api
        path: "/Sonarr"
        name: API
      - var: tautulli_api
        path: "/Tautulli"
        name: API
      - var: plex_token
        path: "/Plex"
        name: TOKEN
  paths:
    - path: "{{ hostvars['plex'].docker_host_appdata_root }}/kometa"
      state: directory
      mode: "0755"
  templates:
    - src: configs/kometa.yml.j2
      dest: "{{ hostvars['plex'].docker_host_appdata_root }}/kometa/config.yml"
      mode: "0664"
      force: false
  volumes:
    config:
      type: bind
      source: "{{ hostvars['plex'].docker_host_appdata_root }}/kometa"
      target: /config
      read_only: false
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: plex
    constraints:
      - node.labels.ansible_host == plex
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
