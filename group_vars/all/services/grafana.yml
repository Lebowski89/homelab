---

grafana:
  name: grafana
  image: grafana/grafana-oss:main-ubuntu
  named_networks:
    overlay:
      external: true
  healthcheck:
    test:
      - "CMD"
      - "wget"
      - "--spider"
      - "-q"
      - "http://127.0.0.1:3000/api/health"
  user: "0"
  environment:
    TZ: "{{ timezone }}"
    PUID: "1000"
    PGID: "1000"
    UMASK: "022"
    GF_SECURITY_ADMIN_USER__FILE: /run/secrets/grafana_admin_user_secret
    GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_pass_secret
    GF_PLUGINS_PREINSTALL: "marcusolsson-hourly-heatmap-panel"
    GF_DATE_FORMATS_FULL_DATE: "MMM Do, YYYY - hh:mm:ss a"
    GF_DATE_FORMATS_INTERVAL_SECOND: "hh:mm:ss a"
    GF_DATE_FORMATS_INTERVAL_MINUTE: "hh:mm a"
    GF_DATE_FORMATS_INTERVAL_HOUR: "MMM DD hh:mm a"
    GF_DATE_FORMATS_INTERVAL_DAY: "MMM DD"
    GF_DATE_FORMATS_INTERVAL_MONTH: "YYYY-MM"
    GF_DATE_FORMATS_INTERVAL_YEAR: "YYY"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: grafana_user
        path: "/Grafana"
        name: USER
      - var: grafana_pass
        path: "/Grafana"
        name: PASS
  secrets:
    - grafana_admin_user_secret
    - grafana_admin_pass_secret
  paths:
    - path: /opt/grafana
      state: directory
      owner: 1000
      group: 1000
      mode: "0755"
  volumes:
    config:
      type: bind
      source: /opt/grafana
      target: /var/lib/grafana
      read_only: false
  traefik:
    enable: true
    port: 3000
    sso: authelia
  cloudflare:
    enable: true
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: localhost
    constraints:
      - node.labels.ansible_host == localhost
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
