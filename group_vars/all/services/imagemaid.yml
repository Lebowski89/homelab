---

imagemaid:
  name: imagemaid
  stack: imagemaid
  image: kometateam/imagemaid:v1.1.1
  named_networks:
    overlay:
      external: true
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars['plex'].docker_host_puid | string }}"
    PGID: "{{ hostvars['plex'].docker_host_pgid | string }}"
    UMASK: "022"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: plex_token
        path: "/Plex"
        name: TOKEN
  paths:
    - path: "{{ hostvars['plex'].docker_host_appdata_root }}/imagemaid"
      state: directory
      mode: "0755"
  templates:
    - src: configs/imagemaid.j2
      dest: "{{ hostvars['plex'].docker_host_appdata_root }}/imagemaid/.env"
      mode: "0664"
      force: false
  volumes:
    config:
      type: bind
      source: "{{ hostvars['plex'].docker_host_appdata_root }}/imagemaid"
      target: /config
      read_only: false
    media:
      type: bind
      source: "{{ hostvars['plex'].docker_host_appdata_root }}/plex/Library/Application Support/Plex Media Server"
      target: /plex
      read_only: false
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: plex
    constraints:
      - node.labels.ansible_host == plex
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
