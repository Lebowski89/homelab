---

imagemaid:
  name: imagemaid
  stack: plex
  image: kometateam/imagemaid:v1.1.1
  named_networks:
    overlay:
      external: true
  environment:
    TZ: "{{ timezone }}"
    PUID: "1000"
    PGID: "1000"
    UMASK: "022"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: plex_token
        path: "/Plex"
        name: TOKEN
  paths:
    - path: /opt/imagemaid
      state: directory
      owner: 1000
      group: 1000
      mode: "0755"
  templates:
    - src: configs/imagemaid.j2
      dest: /opt/imagemaid/.env
      owner: 1000
      group: 1000
      mode: "0664"
      force: false
  volumes:
    config:
      type: bind
      source: /opt/imagemaid
      target: /config
      read_only: false
    media:
      type: bind
      source: /opt/plex/Library/Application Support/Plex Media Server
      target: /plex
      read_only: false
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: plex
    constraints:
      - node.labels.ansible_host == plex
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
