---

themepark:
  name: theme-park
  stack: themepark
  image: ghcr.io/themepark-dev/theme.park:1.22.0
  named_networks:
    overlay:
      external: true
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars['mgt'].docker_host_puid | string }}"
    PGID: "{{ hostvars['mgt'].docker_host_pgid | string }}"
    UMASK: "022"
  ports:
    web:
      published: 8089
      target: 80
      mode: host
  paths:
    - path: "{{ hostvars['mgt'].docker_host_appdata_root }}/theme-park"
      state: directory
      mode: "0755"
  volumes:
    config:
      type: bind
      source: "{{ hostvars['mgt'].docker_host_appdata_root }}/theme-park"
      target: /config
      read_only: false
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: mgt
    constraints:
      - node.labels.ansible_host == mgt
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
