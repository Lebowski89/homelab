---

services_110_pgha:

################################
# ETCD
################################
  etcd:
    name: etcd
    stack: pg-etcd
    container_name: etcd
    image: quay.io/coreos/etcd:v3.5.27
    network_mode: host
    paths:
      - path: /opt/etcd
        state: directory
        owner: 1000
        group: 1000
        mode: 0755
      - path: /opt/etcd/data
        state: directory
        owner: 1000
        group: 1000
        mode: 0755
    volumes:
      data:
        type: bind
        source: /opt/etcd/data
        target: /var/lib/etcd
        read_only: false
    user: 1000:1000
    targets:
      pg01:
        environment:
          ETCD_NAME: "pg01"
          ETCD_DATA_DIR: "/var/lib/etcd"
          ETCD_LISTEN_CLIENT_URLS: "http://192.168.80.92:2379,http://127.0.0.1:2379"
          ETCD_ADVERTISE_CLIENT_URLS: "http://192.168.80.92:2379"
          ETCD_LISTEN_PEER_URLS: "http://192.168.80.92:2380"
          ETCD_INITIAL_ADVERTISE_PEER_URLS: "http://192.168.80.92:2380"
          ETCD_INITIAL_CLUSTER: "pg01=http://192.168.80.92:2380,pg02=http://192.168.80.93:2380,pg03=http://192.168.80.94:2380"
          ETCD_INITIAL_CLUSTER_STATE: "new"
          ETCD_INITIAL_CLUSTER_TOKEN: "pg-ha-1"
          ETCD_ENABLE_V2: "true"
        deploy:
          type: container
          host: pg01
      pg02:
        environment:
          ETCD_NAME: "pg02"
          ETCD_DATA_DIR: "/var/lib/etcd"
          ETCD_LISTEN_CLIENT_URLS: "http://192.168.80.93:2379,http://127.0.0.1:2379"
          ETCD_ADVERTISE_CLIENT_URLS: "http://192.168.80.93:2379"
          ETCD_LISTEN_PEER_URLS: "http://192.168.80.93:2380"
          ETCD_INITIAL_ADVERTISE_PEER_URLS: "http://192.168.80.93:2380"
          ETCD_INITIAL_CLUSTER: "pg01=http://192.168.80.92:2380,pg02=http://192.168.80.93:2380,pg03=http://192.168.80.94:2380"
          ETCD_INITIAL_CLUSTER_STATE: "new"
          ETCD_INITIAL_CLUSTER_TOKEN: "pg-ha-1"
          ETCD_ENABLE_V2: "true"
        deploy:
          type: container
          host: pg02
      pg03:
        environment:
          ETCD_NAME: "pg03"
          ETCD_DATA_DIR: "/var/lib/etcd"
          ETCD_LISTEN_CLIENT_URLS: "http://192.168.80.94:2379,http://127.0.0.1:2379"
          ETCD_ADVERTISE_CLIENT_URLS: "http://192.168.80.94:2379"
          ETCD_LISTEN_PEER_URLS: "http://192.168.80.94:2380"
          ETCD_INITIAL_ADVERTISE_PEER_URLS: "http://192.168.80.94:2380"
          ETCD_INITIAL_CLUSTER: "pg01=http://192.168.80.92:2380,pg02=http://192.168.80.93:2380,pg03=http://192.168.80.94:2380"
          ETCD_INITIAL_CLUSTER_STATE: "new"
          ETCD_INITIAL_CLUSTER_TOKEN: "pg-ha-1"
          ETCD_ENABLE_V2: "true"
        deploy:
          type: container
          host: pg03

################################
# PATRONI
################################
  patroni:
    name: patroni
    stack: pg-patroni
    container_name: patroni
    image: ghcr.io/zalando/spilo-17:4.0-p3
    network_mode: host
    pid: host
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    security_opt:
      - "apparmor:unconfined"
    infisical:
      fail_on_empty: true
      secrets_map:
        - { var: patroni_superuser_pass, path: "/Spilo", name: "SUPERUSER_PASS" }
        - { var: patroni_replication_pass, path: "/Spilo", name: "REPLICATION_PASS" }
    paths:
      - path: /opt/patroni/data
        state: directory
        owner: 1000
        group: 1000
        mode: 0755
    volumes:
      data:
        type: bind
        source: /opt/patroni/data
        target: /home/postgres/pgroot
        read_only: false
    targets:
      pg01:
        environment:
          SCOPE: "pg-cluster"
          ETCD_HOSTS: '"192.168.80.92:2379","192.168.80.93:2379","192.168.80.94:2379"'
          SPILO_CONFIGURATION: >-
            {{
              {
                "restapi": {
                "listen": "0.0.0.0:8008",
                "connect_address": "192.168.80.92:8008"
                },
                "postgresql": {
                "listen": "0.0.0.0:5433",
                "connect_address": "192.168.80.92:5433"
                }
              } | to_json
            }}
          APIPORT: "8008"
          PATRONI_NAME: "pg01"
          RESTAPI_CONNECT_ADDRESS: "192.168.80.92:8008"
          PGPORT: "5433"
          PGROOT: "/home/postgres/pgroot"
          PGDATA: "/home/postgres/pgroot/pgdata"
          ALLOW_NOSSL: "true"
          # Users / Passwords
          PGUSER_SUPERUSER: "postgres"
          PGPASSWORD_SUPERUSER: "{{ patroni_superuser_pass | default('__INFISICAL__:patroni_superuser_pass', true) }}"
          PGUSER_STANDBY: "replicator"
          PGPASSWORD_STANDBY: "{{ patroni_replication_pass | default('__INFISICAL__:patroni_replication_pass', true) }}"
          # Optional: don’t create the extra admin user
          USE_ADMIN: "false"
        deploy:
          type: container
          host: pg01
      pg02:
        environment:
          SCOPE: "pg-cluster"
          ETCD_HOSTS: '"192.168.80.92:2379","192.168.80.93:2379","192.168.80.94:2379"'
          SPILO_CONFIGURATION: >-
            {{
              {
                "restapi": {
                "listen": "0.0.0.0:8008",
                "connect_address": "192.168.80.93:8008"
                },
                "postgresql": {
                "listen": "0.0.0.0:5433",
                "connect_address": "192.168.80.93:5433"
                }
              } | to_json
            }}
          APIPORT: "8008"
          PATRONI_NAME: "pg02"
          RESTAPI_CONNECT_ADDRESS: "192.168.80.93:8008"
          PGPORT: "5433"
          PGROOT: "/home/postgres/pgroot"
          PGDATA: "/home/postgres/pgroot/pgdata"
          ALLOW_NOSSL: "true"
          STANDBY_HOST: "192.168.80.92"
          STANDBY_PORT: "5433"
          # Users / Passwords
          PGUSER_SUPERUSER: "postgres"
          PGPASSWORD_SUPERUSER: "{{ patroni_superuser_pass | default('__INFISICAL__:patroni_superuser_pass', true) }}"
          PGUSER_STANDBY: "replicator"
          PGPASSWORD_STANDBY: "{{ patroni_replication_pass | default('__INFISICAL__:patroni_replication_pass', true) }}"
          # Optional: don’t create the extra admin user
          USE_ADMIN: "false"
        deploy:
          type: container
          host: pg02
      pg03:
        environment:
          SCOPE: "pg-cluster"
          ETCD_HOSTS: '"192.168.80.92:2379","192.168.80.93:2379","192.168.80.94:2379"'
          SPILO_CONFIGURATION: >-
            {{
              {
                "restapi": {
                "listen": "0.0.0.0:8008",
                "connect_address": "192.168.80.94:8008"
                },
                "postgresql": {
                "listen": "0.0.0.0:5433",
                "connect_address": "192.168.80.94:5433"
                }
              } | to_json
            }}
          APIPORT: "8008"
          PATRONI_NAME: "pg03"
          RESTAPI_CONNECT_ADDRESS: "192.168.80.94:8008"
          PGPORT: "5433"
          PGROOT: "/home/postgres/pgroot"
          PGDATA: "/home/postgres/pgroot/pgdata"
          ALLOW_NOSSL: "true"
          STANDBY_HOST: "192.168.80.92"
          STANDBY_PORT: "5433"
          # Users / Passwords
          PGUSER_SUPERUSER: "postgres"
          PGPASSWORD_SUPERUSER: "{{ patroni_superuser_pass | default('__INFISICAL__:patroni_superuser_pass', true) }}"
          PGUSER_STANDBY: "replicator"
          PGPASSWORD_STANDBY: "{{ patroni_replication_pass | default('__INFISICAL__:patroni_replication_pass', true) }}"
          # Optional: don’t create the extra admin user
          USE_ADMIN: "false"
        deploy:
          type: container
          host: pg03

################################
# HA-PROXY
################################
  pg_ha_proxy:
    name: pg-ha
    stack: ha-proxy
    image: haproxy:3.1-alpine
    named_networks:
      overlay:
        external: true
    swarm_configs:
      - name: pgha_haproxy_cfg
        src: files/pgha/haproxy.cfg
        data_is_template: false
    configs:
      - source: pgha_haproxy_cfg
        target: /usr/local/etc/haproxy/haproxy.cfg
        mode: 0444
    ports:
      postgres:
        published: 5433
        target: 5433
        protocol: tcp
        mode: host
    deploy:
      type: swarm
      mode: global
      host: localhost
      constraints:
        - node.labels.pgha_proxy == true
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 2m