---

scraparr:
  name: scraparr
  stack: scraparr
  image: ghcr.io/thecfu/scraparr:latest
  named_networks:
    overlay:
      external: true
  environment:
    TZ: "{{ timezone }}"
    PUID: "1000"
    PGID: "1000"
    UMASK: "022"
  paths:
    - path: /mnt/user/appdata/scraparr
      state: directory
      owner: 1000
      group: 1000
      mode: "0755"
  templates:
    - src: configs/scraparr-config.yaml.j2
      dest: /opt/scraparr/config.yaml
      owner: 1000
      group: 1000
      mode: "0664"
      force: true
  volumes:
    config:
      type: bind
      source: /opt/scraparr/config.yaml
      target: /scraparr/config/config.yaml
      read_only: false
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: localhost
    constraints:
      - node.labels.ansible_host == localhost
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
