---

gotify:
  name: gotify
  stack: gotify
  image: gotify/server:2.9.1
  named_networks:
    overlay:
      external: true
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ puid }}"
    PGID: "{{ pgid }}"
  env_file:
    - /opt/gotify/.env
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: postgres_user
        path: "/Postgres"
        name: USER
      - var: postgres_pass
        path: "/Postgres"
        name: PASS
  paths:
    - path: /opt/gotify
      state: directory
      owner: 1000
      group: 1000
      mode: "0755"
    - path: /opt/gotify/images
      state: directory
      owner: 1000
      group: 1000
      mode: "0755"
    - path: /opt/gotify/plugins
      state: directory
      owner: 1000
      group: 1000
      mode: "0755"
  templates:
    - src: configs/gotify.env.j2
      dest: /opt/gotify/.env
      owner: 1000
      group: 1000
      mode: "0664"
      force: true
  volumes:
    config:
      type: bind
      source: /opt/gotify
      target: /app/data
      read_only: false
  postgres:
    enable: true
    databases:
      - gotify
  traefik:
    enable: true
    port: 80
  cloudflare:
    enable: true
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: mgt
    constraints: node.labels.ansible_host == mgt
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
