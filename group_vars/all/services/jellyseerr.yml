---

jellyseerr:
  name: jellyseerr
  stack: media
  image: fallenbagel/jellyseerr:2.7.3
  named_networks:
    overlay:
      external: true
  healthcheck:
    test:
      - "CMD"
      - "wget"
      - "--spider"
      - "-q"
      - "http://127.0.0.1:5055/api/v1/status"
  environment8:
    TZ: "{{ timezone }}"
    PUID: "1000"
    PGID: "1000"
    UMASK: "022"
    PORT: "5055"
    DB_TYPE: "postgres"
    DB_HOST: "spilo"
    DB_PORT: "5433"
    DB_USER: "{{ postgres_user | default('__INFISICAL__:postgres_user', true) }}"
    DB_PASS: "{{ postgres_pass | default('__INFISICAL__:postgres_pass', true) }}"
    DB_NAME: "jellyseerr"
    DB_LOG_QUERIES: "false"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: postgres_user
        path: "/Postgres"
        name: USER
      - var: postgres_pass
        path: "/Postgres"
        name: PASS
      - var: jellyseerr_api
        path: "/Jellyseerr"
        name: API
      - var: jellyseerr_notifiarr_webhook
        path: "/Jellyseerr"
        name: NOTIFIARR_WEBHOOK
      - var: jellyseerr_notifiarr_payload
        path: "/Jellyseerr"
        name: WEBHOOK_PAYLOAD
      - var: tautulli_api
        path: "/Tautulli"
        name: API
      - var: radarr_api
        path: "/Radarr"
        name: API
      - var: radarr_4k_api
        path: "/Radarr-4K"
        name: API
      - var: sonarr_api
        path: "/Sonarr"
        name: API
      - var: sonarr_4k_api
        path: "/Sonarr-4K"
        name: API
      - var: smtp_email
        path: "/Porkbun"
        name: SMTP_EMAIL
      - var: smtp_host
        path: "/Porkbun"
        name: SMTP_HOST
      - var: smtp_password
        path: "/Porkbun"
        name: SMTP_PASS
      - var: smtp_port
        path: "/Porkbun"
        name: SMTP_PORT
      - var: smtp_sender
        path: "/Porkbun"
        name: SMTP_SENDER
      - var: smtp_username
        path: "/Porkbun"
        name: SMTP_USER
  paths:
    - path: /opt/jellyseerr
      state: directory
      owner: 1000
      group: 1000
      mode: "0755"
  templates:
    - src: configs/jellyseerr.json.j2
      dest: /opt/jellyseerr/settings.json
      owner: 1000
      group: 1000
      mode: "0664"
      force: true
  volumes:
    config:
      type: bind
      source: /opt/jellyseerr
      target: /app/config
      read_only: false
  postgres:
    enable: true
    databases:
      - jellyseerr
  traefik:
    enable: true
    port: 5055
    sso: authelia
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: localhost
    constraints:
      - node.labels.ansible_host == localhost
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
