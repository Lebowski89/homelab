---

librewolf:
  name: librewolf
  stack: gluetun
  container_name: librewolf
  image: lscr.io/linuxserver/librewolf:149.0-1-ls137
  security_opt:
    - "seccomp:unconfined"
  depends_on:
    - gluetun
  network_mode: "service:gluetun"
  environment:
    PUID: "{{ hostvars[docker_services_unraid_host].docker_host_puid }}"
    PGID: "{{ hostvars[docker_services_unraid_host].docker_host_pgid }}"
    LIBREWOLF_CLI: "{{ hostvars[docker_services_unraid_host].local_ip }}:3075"
  paths:
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/librewolf"
      state: directory
      mode: "0755"
  volumes:
    config:
      type: bind
      source: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/librewolf"
      target: /config
      read_only: false
    downloads:
      type: bind
      source: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}/media/gluetun"
      target: /downloads
      read_only: false
  shm_size: 1gb
  deploy:
    type: container
    host: "{{ docker_services_unraid_host }}"
