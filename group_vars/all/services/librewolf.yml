---

librewolf:
  name: librewolf
  stack: gluetun
  container_name: librewolf
  image: lscr.io/linuxserver/librewolf:148.0-1-ls133
  security_opt:
    - "seccomp:unconfined"
  depends_on:
    - gluetun
  network_mode: "service:gluetun"
  environment:
    PUID: "{{ hostvars[docker_services_unraid_host].docker_host_puid | string }}"
    PGID: "{{ hostvars[docker_services_unraid_host].docker_host_pgid | string }}"
    LIBREWOLF_CLI: "http://192.168.80.20:3075"
  paths:
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/librewolf"
      state: directory
      mode: "0755"
  volumes:
    config:
      type: bind
      source: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/librewolf"
      target: /config
      read_only: false
    downloads:
      type: bind
      source: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}/media/gluetun"
      target: /downloads
      read_only: false
  shm_size: 1gb
  deploy:
    type: container
    host: "{{ docker_services_unraid_host }}"
