---

recyclarr:
  name: recyclarr
  stack: recyclarr
  image: ghcr.io/recyclarr/recyclarr:8.5.1
  named_networks:
    overlay:
      external: true
  user: 99:100
  environment:
    TZ: "{{ timezone }}"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: radarr_api
        path: "/Radarr"
        name: API
      - var: radarr_4k_api
        path: "/Radarr-4K"
        name: API
      - var: sonarr_api
        path: "/Sonarr"
        name: API
      - var: sonarr_4k_api
        path: "/Sonarr-4K"
        name: API
  paths:
    - path: "{{ hostvars['unraid'].docker_host_appdata_root }}/recyclarr"
      state: directory
      mode: "0755"
    - path: "{{ hostvars['unraid'].docker_host_appdata_root }}/recyclarr/configs"
      state: directory
      mode: "0755"
    - path: "{{ hostvars['unraid'].docker_host_appdata_root }}/recyclarr/includes"
      state: directory
      mode: "0755"
  templates:
    - src: configs/recyclarr/secrets.yml.j2
      dest: "{{ hostvars['unraid'].docker_host_appdata_root }}/recyclarr/secrets.yml"
      mode: "0664"
      force: true
    - src: configs/recyclarr/config_radarr.yml.j2
      dest: "{{ hostvars['unraid'].docker_host_appdata_root }}/recyclarr/configs/radarr.yml"
      mode: "0664"
      force: true
    - src: configs/recyclarr/config_sonarr.yml.j2
      dest: "{{ hostvars['unraid'].docker_host_appdata_root }}/recyclarr/configs/sonarr.yml"
      mode: "0664"
      force: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars['unraid'].docker_host_appdata_root }}/recyclarr"
      target: /config
      read_only: false
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: unraid
    constraints:
      - node.labels.ansible_host == unraid
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
