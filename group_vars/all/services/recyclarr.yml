---

recyclarr:
  name: recyclarr
  stack: arrs
  image: ghcr.io/recyclarr/recyclarr:8.1.0
  named_networks:
    overlay:
      external: true
  user: 99:100
  environment:
    TZ: "{{ timezone }}"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: radarr_api
        path: "/Radarr"
        name: API
      - var: radarr_4k_api
        path: "/Radarr-4K"
        name: API
      - var: sonarr_api
        path: "/Sonarr"
        name: API
      - var: sonarr_4k_api
        path: "/Sonarr-4K"
        name: API
  paths:
    - path: /mnt/user/appdata/recyclarr
      state: directory
      owner: 99
      group: 100
      mode: 0755
    - path: /mnt/user/appdata/recyclarr/configs
      state: directory
      owner: 99
      group: 100
      mode: 0755
    - path: /mnt/user/appdata/recyclarr/includes
      state: directory
      owner: 99
      group: 100
      mode: 0755
  templates:
    - src: configs/arrs/recyclarr/secrets.yml.j2
      dest: /mnt/user/appdata/recyclarr/secrets.yml
      owner: 99
      group: 100
      mode: 0664
      force: true
    - src: configs/arrs/recyclarr/config_radarr.yml.j2
      dest: /mnt/user/appdata/recyclarr/configs/radarr.yml
      owner: 99
      group: 100
      mode: 0664
      force: true
    - src: configs/arrs/recyclarr/config_radarr-4k.yml.j2
      dest: /mnt/user/appdata/recyclarr/configs/radarr-4k.yml
      owner: 99
      group: 100
      mode: 0664
      force: true
    - src: configs/arrs/recyclarr/config_sonarr.yml.j2
      dest: /mnt/user/appdata/recyclarr/configs/sonarr.yml
      owner: 99
      group: 100
      mode: 0664
      force: true
    - src: configs/arrs/recyclarr/config_sonarr-4k.yml.j2
      dest: /mnt/user/appdata/recyclarr/configs/sonarr-4k.yml
      owner: 99
      group: 100
      mode: 0664
      force: true
  volumes:
    config:
      type: bind
      source: /mnt/user/appdata/recyclarr
      target: /config
      read_only: false
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: unraid
    constraints:
      - node.labels.ansible_host == unraid
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
