# Use for workstation/system bootstrap with an explicit -i static inventory.
# Normal managed-host operations use ansible.cfg and NetBox instead.
[defaults]
roles_path = roles:test
collections_path = ./collections:~/.ansible/collections:~/.local/share/homelab/collections
host_key_checking = True
# Keep automatic per-host host_vars, but do not load group_vars files (notably
# application-wide group_vars/all/vault). Inline static inventory vars still work.
precedence = all_inventory,groups_inventory

[inventory]
enable_plugins = host_list,yaml,ini
