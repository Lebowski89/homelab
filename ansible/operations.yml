---

# Every manual workflow requires its explicit tag; all/default selects none.
- name: Manage mgt private endpoint policy independently of applications
  hosts: '{{ services_controller_inventory_group }}'
  vars_files:
    - group_vars/all/services.yml
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Run the scoped mgt-firewall operation
      ansible.builtin.include_tasks:
        file: operations/mgt-firewall.yml
        apply:
          tags:
            - mgt_firewall_install
            - mgt_firewall_observe
            - mgt_firewall_check
            - mgt_firewall_remove
      tags:
        - never
        - mgt_firewall_install
        - mgt_firewall_observe
        - mgt_firewall_check
        - mgt_firewall_remove
  pre_tasks:
    - name: Operations | Reject completed Swarm-only migration workflows
      ansible.builtin.assert:
        that:
          - ansible_run_tags | intersect(['loki_alertmanager_route', 'prometheus_alertmanager_routes', 'prometheus_haproxy_scrape',
            'prometheus_scraparr_scrape']) | length == 0
        fail_msg: Completed Swarm-only workflows are archived. Update canonical service configuration through the selected runtime;
          do not replay old migration tags.
      tags:
        - always
- name: Manage the temporary worker backend firewall independently of applications
  hosts: '{{ services_storage_inventory_group }}:{{ services_plex_host }}'
  vars_files:
    - group_vars/all/services.yml
  gather_facts: false
  become: true
  any_errors_fatal: true
  tasks:
    - name: Run the scoped worker-backend-firewall operation
      ansible.builtin.include_tasks:
        file: operations/worker-backend-firewall.yml
        apply:
          tags:
            - worker_backend_firewall_install
            - worker_backend_firewall_check
            - worker_backend_firewall_remove
      tags:
        - never
        - worker_backend_firewall_install
        - worker_backend_firewall_check
        - worker_backend_firewall_remove
- name: Collect HAProxy caller metadata and prepare unverified policy inputs
  hosts: '{{ services_controller_inventory_group }}'
  gather_facts: false
  become: true
  any_errors_fatal: true
  vars_files:
    - group_vars/all/services.yml
  vars:
    haproxy_preflight_recovery_hosts: []
    haproxy_preflight_running_rootless_accounts:
      - podman-forgejo
    haproxy_preflight_window_seconds: 0
    haproxy_preflight_sample_interval: 1
    haproxy_preflight_names:
      infisical: infisical-infisical-1
  tasks:
    - name: Run the scoped haproxy-firewall-preflight operation
      ansible.builtin.include_tasks:
        file: operations/haproxy-firewall-preflight.yml
        apply:
          tags:
            - haproxy_preflight
      tags:
        - never
        - haproxy_preflight
- name: Permit the observed Podman SIGTERM to its pasta network helper
  hosts: '{{ services_controller_inventory_group }}'
  vars_files:
    - group_vars/all/services.yml
  gather_facts: false
  become: true
  tasks:
    - name: Run only the reviewed pasta signal prerequisite
      ansible.builtin.include_tasks:
        file: operations/podman-pasta-signal.yml
        apply:
          tags:
            - podman_pasta_signal
      tags:
        - never
        - podman_pasta_signal
