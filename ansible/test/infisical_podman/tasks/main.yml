---

################################
# CLEAN UP
################################

- name: Infisical Podman | Report recreate/remove actions in check mode
  ansible.builtin.debug:
    msg: >-
      Infisical Podman cleanup would stop quadlet services, remove quadlet files,
      and reload systemd during a real run.
  when: ansible_check_mode
  tags:
    - infisical_podman_recreate
    - infisical_podman_remove

- name: Infisical Podman | Stop Infisical quadlet services
  ansible.builtin.systemd_service:
    name: "{{ _infisical_podman_unit }}"
    state: stopped
    enabled: false
  failed_when: false
  loop:
    - "{{ infisical_podman_name }}.service"
    - "{{ infisical_podman_redis_name }}.service"
  loop_control:
    loop_var: _infisical_podman_unit
  when: not ansible_check_mode
  tags:
    - infisical_podman_recreate
    - infisical_podman_remove

- name: Infisical Podman | Remove Infisical quadlet files
  ansible.builtin.file:
    path: "/etc/containers/systemd/{{ _infisical_podman_quadlet }}"
    state: absent
  loop:
    - "{{ infisical_podman_name }}.container"
    - "{{ infisical_podman_redis_name }}.container"
    - "{{ infisical_podman_network }}.network"
  loop_control:
    loop_var: _infisical_podman_quadlet
  when: not ansible_check_mode
  tags:
    - infisical_podman_recreate
    - infisical_podman_remove

- name: Reload systemd after quadlet removal
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode
  tags:
    - infisical_podman_recreate
    - infisical_podman_remove

################################
# DIRECTORIES
################################

- name: Infisical Podman | Create Infisical quadlet directories
  ansible.builtin.file:
    path: "{{ _infisical_podman_dir.path }}"
    state: directory
    owner: "{{ _infisical_podman_dir.owner }}"
    group: "{{ _infisical_podman_dir.group }}"
    mode: "{{ _infisical_podman_dir.mode }}"
  loop:
    - path: "{{ infisical_podman_base_path }}"
      owner: "root"
      group: "root"
      mode: "0750"
    - path: "{{ infisical_podman_redis_path }}"
      owner: "{{ infisical_podman_redis_puid }}"
      group: "{{ infisical_podman_redis_pgid }}"
      mode: "0755"
    - path: /etc/containers/systemd
      owner: root
      group: root
      mode: "0755"
  loop_control:
    loop_var: _infisical_podman_dir
  tags:
    - infisical_podman_bootstrap
    - infisical_podman_deploy
    - infisical_podman_recreate

################################
# CONFIG
################################

- name: Infisical Podman | Template Infisical Podman env file
  ansible.builtin.template:
    src: "{{ role_path }}/templates/infisical.env.j2"
    dest: "{{ infisical_podman_base_path }}/.env"
    force: true
    owner: root
    group: root
    mode: "0600"
  no_log: true
  tags:
    - infisical_podman_bootstrap
    - infisical_podman_deploy
    - infisical_podman_recreate

################################
# TRAEFIK
################################

- name: Infisical Podman | Render Traefik dynamic file
  when: infisical_podman_traefik_enable | bool
  ansible.builtin.template:
    src: traefik_dynamic_file.j2
    dest: "{{ infisical_podman_traefik_dynamic_dir }}/{{ infisical_podman_name }}-dynamic.yml"
    owner: "{{ infisical_podman_traefik_dynamic_owner }}"
    group: "{{ infisical_podman_traefik_dynamic_group }}"
    mode: "0644"
    force: true
  tags:
    - infisical_podman_deploy
    - infisical_podman_recreate

################################
# DEPLOY
################################

- name: Infisical Podman | Template Infisical Podman quadlets
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ _infisical_podman_template.src }}"
    dest: "/etc/containers/systemd/{{ _infisical_podman_template.dest }}"
    force: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: "infisical.network.j2"
      dest: "{{ infisical_podman_network }}.network"
    - src: "redis.container.j2"
      dest: "{{ infisical_podman_redis_name }}.container"
    - src: "infisical.container.j2"
      dest: "{{ infisical_podman_name }}.container"
  loop_control:
    loop_var: _infisical_podman_template
  tags:
    - infisical_podman_deploy
    - infisical_podman_recreate

- name: Infisical Podman | Reload systemd for quadlet generator
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: not ansible_check_mode
  tags:
    - infisical_podman_deploy
    - infisical_podman_recreate

- name: Infisical Podman | Report quadlet services would be started
  ansible.builtin.debug:
    msg: >-
      Infisical Podman quadlet services would be enabled and started during a real run.
  when: ansible_check_mode
  tags:
    - infisical_podman_deploy
    - infisical_podman_recreate

- name: Infisical Podman | Start Infisical quadlet services
  ansible.builtin.systemd_service:
    name: "{{ _infisical_podman_service }}"
    state: started
    enabled: true
  loop:
    - "{{ infisical_podman_redis_name }}.service"
    - "{{ infisical_podman_name }}.service"
  loop_control:
    loop_var: _infisical_podman_service
  when: not ansible_check_mode
  tags:
    - infisical_podman_deploy
    - infisical_podman_recreate
