---

infisical_podman_name: infisical
infisical_podman_image: docker.io/infisical/infisical:v0.159.9
infisical_podman_port: 8066
infisical_podman_path: "/opt/{{ infisical_podman_name }}"
infisical_podman_enc_key: "{{ infisical_enc_key }}"
infisical_podman_jwt_key: "{{ infisical_jwt_key }}"

infisical_podman_network: infisical

infisical_podman_postgres_name: infisical-postgres
infisical_podman_postgres_image: docker.io/library/postgres:18.3
infisical_podman_postgres_uid: 999
infisical_podman_postgres_gid: 999
infisical_podman_postgres_port: 5432
infisical_podman_postgres_path: "{{ infisical_podman_path }}/postgres"
infisical_podman_postgres_user: "{{ infisical_postgres_user }}"
infisical_podman_postgres_pass: "{{ infisical_postgres_pass }}"
infisical_podman_expose_postgres: true

infisical_podman_redis_name: infisical-redis
infisical_podman_redis_image: docker.io/library/redis:8.6-alpine
infisical_podman_redis_uid: 999
infisical_podman_redis_gid: 999
infisical_podman_redis_port: 6390
infisical_podman_redis_path: "{{ infisical_podman_path }}/redis"
infisical_podman_redis_key: "{{ infisical_redis_key }}"
infisical_podman_expose_redis: true

infisical_podman_smtp_email: "{{ infisical_smtp_email }}"
infisical_podman_smtp_host: "{{ infisical_smtp_host }}"
infisical_podman_smtp_port: "{{ infisical_smtp_port }}"
infisical_podman_smtp_user: "{{ infisical_smtp_user }}"
infisical_podman_smtp_pass: "{{ infisical_smtp_pass }}"
infisical_podman_smtp_sender: "{{ infisical_smtp_sender }}"

infisical_podman_domain: ""
infisical_podman_backend_host: "{{ hostvars[docker_services_primary_manager].local_ip }}"
