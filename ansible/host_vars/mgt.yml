---

docker_manage_user: true
docker_user: "mgt"

docker_swarm_node_labels:
  role: manager
  ansible_host: mgt
  docker_services_host: docker_services_primary_manager
  haproxy: "true"
  dns: technitium

podman_install_enable: true

# Managed-host interpreter for application preparation and PostgreSQL hooks.
# This is independent of the workstation's own Ansible virtualenv.
ansible_python_interpreter: /opt/ansible/ansible-venv/bin/python
