---

# Emergency OOM safety net; ordinary PostgreSQL capacity still comes from RAM.
# vm.swappiness=10 is persisted by the Ubuntu role's shared sysctl settings.
ubuntu_postgres_emergency_swap_enabled: true
ubuntu_postgres_emergency_swap_path: /swapfile
ubuntu_postgres_emergency_swap_size_mb: 2048

# Required sensitive variables are defined in:
# ansible/group_vars/all/vault.yml
#
# For the expected structure, see:
# ansible/group_vars/all/vault.yml.sample

ubuntu_apt_package_profiles_postgres:
  - network
  - postgres

postgres_etcd_node_name: "{{ inventory_hostname }}"
postgres_patroni_node_name: "{{ inventory_hostname }}"

postgres_etcd_initial_cluster: >-
  {%- for host in groups['tags_postgres'] | default([]) | sort -%}
  {{ host }}=http://{{ hostvars[host].local_ip }}:2380{{ ',' if not loop.last else '' }}{%- endfor -%}

postgres_patroni_etcd_hosts: >-
  {{
    groups['tags_postgres']
    | default([])
    | sort
    | map('extract', hostvars, 'local_ip')
    | map('regex_replace', '$', ':2379')
    | list
  }}

postgres_patroni_superuser_name: postgres
postgres_patroni_replication_name: replicator

postgres_monitor_role_name: postgres_monitor
postgres_monitor_database: postgres

postgres_patroni_pg_hba_extra: []

# The role default remains opt-in; PostgreSQL inventory hosts explicitly schedule
# the leader-gated logical backup job.
postgres_backup_manage_timer: true
