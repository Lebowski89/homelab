---

# Required sensitive variables are defined in:
# ansible/group_vars/all/vault.yml
#
# For the expected structure, see:
# ansible/group_vars/all/vault.yml.sample

postgres_etcd_node_name: "{{ inventory_hostname }}"
postgres_patroni_node_name: "{{ inventory_hostname }}"

postgres_etcd_initial_cluster: >-
  pg95=http://192.168.80.95:2380,
  pg96=http://192.168.80.96:2380,
  pg97=http://192.168.80.97:2380

postgres_patroni_etcd_hosts:
  - 192.168.80.95:2379
  - 192.168.80.96:2379
  - 192.168.80.97:2379

postgres_patroni_superuser_name: postgres
postgres_patroni_replication_name: replicator

postgres_patroni_pg_hba_extra:
  - "host postgres uptime_kuma_monitor {{ hostvars[docker_services_primary_manager].local_ip }}/32 scram-sha-256"
