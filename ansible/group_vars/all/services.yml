# Transitional fallback preserves mgt until the new NetBox tag is applied.
# Workstation eligibility never participates in this singleton lookup.
services_controller_inventory_group: >-
  {{ 'tags_service_controller' if 'tags_service_controller' in groups else 'tags_ansible_manager' }}
services_storage_inventory_group: device_roles_storage
services_plex_host: plex
services_log_root: /var/log/skynet
podman_shared_network_name: mgt-services
