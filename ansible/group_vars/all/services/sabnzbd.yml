---

sabnzbd:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: docker
  tags: [usenet, sabnzbd]
  name: sabnzbd
  stack: sabnzbd
  ################################
  # IMAGE/PROCESS
  ################################
  image: ghcr.io/hotio/sabnzbd:release-v5.1.3
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[services_storage_host].container_host_puid }}"
    PGID: "{{ hostvars[services_storage_host].container_host_pgid }}"
    UMASK: "022"
    WEBUI_PORTS: "8080/tcp,8080/udp"
  infisical:
    secrets_map:
      - var: sabnzbd_user
        path: "/SABnzbd"
        name: USER
      - var: sabnzbd_pass
        path: "/SABnzbd"
        name: PASS
      - var: sabnzbd_api
        path: "/SABnzbd"
        name: API
      - var: sabnzbd_nzb
        path: "/SABnzbd"
        name: NZB
      - var: frugal_user
        path: "/SABnzbd"
        name: FRUGAL_USER
      - var: frugal_pass
        path: "/SABnzbd"
        name: FRUGAL_PASS
      - var: eweka_user
        path: "/SABnzbd"
        name: EWEKA_USER
      - var: eweka_pass
        path: "/SABnzbd"
        name: EWEKA_PASS
      - var: easynews_user
        path: "/SABnzbd"
        name: EASYNEWS_USER
      - var: easynews_pass
        path: "/SABnzbd"
        name: EASYNEWS_PASS
  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    overlay:
      external: true
  ################################
  # FILESYSTEM
  ################################
  ports:
    web_backend:
      published: 22613
      target: 8080
      mode: host
  ################################
  # FILESYSTEM
  ################################
  paths:
    - path: "{{ hostvars[services_storage_host].container_host_appdata_root }}/sabnzbd"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_storage_host].container_host_data_root }}/usenet"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_storage_host].container_host_data_root }}/usenet/watch"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_storage_host].container_host_data_root }}/usenet/.nzb"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_storage_host].container_host_data_root }}/usenet/incomplete"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_storage_host].container_host_data_root }}/usenet/complete"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_storage_host].container_host_data_root }}/usenet/complete/lidarr"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_storage_host].container_host_data_root }}/usenet/complete/radarr"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_storage_host].container_host_data_root }}/usenet/complete/radarr-4k"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_storage_host].container_host_data_root }}/usenet/complete/sonarr"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_storage_host].container_host_data_root }}/usenet/complete/sonarr-4k"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_storage_host].container_host_data_root }}/usenet/complete/sportarr"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_storage_host].container_host_data_root }}/usenet/complete/whisparr"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_storage_host].container_host_data_root }}/usenet/complete/nzbhydra"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_storage_host].container_host_appdata_root }}/sabnzbd/sabnzbd.ini.bak"
      state: absent
  templates:
    - src: configs/sabnzbd.ini.j2
      dest: "{{ hostvars[services_storage_host].container_host_appdata_root }}/sabnzbd/sabnzbd.ini"
      mode: "0664"
      force: true
      no_log: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_storage_host].container_host_appdata_root }}/sabnzbd"
      target: /config
      read_only: false
    downloads:
      type: bind
      source: "{{ hostvars[services_storage_host].container_host_data_root }}/usenet"
      target: /data/usenet
      read_only: false
  ################################
  # INTEGRATIONS
  ################################
  traefik:
    enable: true
    exposure: private
    port: 22613
  ################################
  # RUNTIME/LIFECYCLE
  ################################
    backend_mode: host
    backend_host_inventory: "{{ services_storage_host }}"
  operational_requirements:
    acl: [worker_backends]

  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: standard
    hosts: "{{ services_storage_host }}"
