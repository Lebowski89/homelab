---

sabnzbd:
  name: sabnzbd
  stack: sabnzbd
  image: ghcr.io/hotio/sabnzbd:release-v5.0.3
  named_networks:
    overlay:
      external: true
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[docker_services_unraid_host].docker_host_puid }}"
    PGID: "{{ hostvars[docker_services_unraid_host].docker_host_pgid }}"
    UMASK: "022"
    WEBUI_PORTS: "8080/tcp,8080/udp"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: sabnzbd_user
        path: "/SABnzbd"
        name: USER
      - var: sabnzbd_pass
        path: "/SABnzbd"
        name: PASS
      - var: sabnzbd_api
        path: "/SABnzbd"
        name: API
      - var: sabnzbd_nzb
        path: "/SABnzbd"
        name: NZB
      - var: frugal_user
        path: "/SABnzbd"
        name: FRUGAL_USER
      - var: frugal_pass
        path: "/SABnzbd"
        name: FRUGAL_PASS
      - var: eweka_user
        path: "/SABnzbd"
        name: EWEKA_USER
      - var: eweka_pass
        path: "/SABnzbd"
        name: EWEKA_PASS
      - var: easynews_user
        path: "/SABnzbd"
        name: EASYNEWS_USER
      - var: easynews_pass
        path: "/SABnzbd"
        name: EASYNEWS_PASS
  paths:
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/sabnzbd"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}/usenet"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}/usenet/watch"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}/usenet/.nzb"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}/usenet/incomplete"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}/usenet/complete"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}/usenet/complete/lidarr"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}/usenet/complete/radarr"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}/usenet/complete/radarr-4k"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}/usenet/complete/sonarr"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}/usenet/complete/sonarr-4k"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}/usenet/complete/sportarr"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}/usenet/complete/whisparr"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}/usenet/complete/nzbhydra"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/sabnzbd/sabnzbd.ini.bak"
      state: absent
  copies:
    - src: files/themepark/98-themepark-sabnzbd
      dest: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/sabnzbd/98-themepark-sabnzbd"
      mode: "0755"
      force: false
      wait: true
      wait_timeout: 30
  templates:
    - src: configs/sabnzbd.ini.j2
      dest: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/sabnzbd/sabnzbd.ini"
      mode: "0664"
      force: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/sabnzbd"
      target: /config
      read_only: false
    downloads:
      type: bind
      source: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}/usenet"
      target: /data/usenet
      read_only: false
    themepark:
      type: bind
      source: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/sabnzbd/98-themepark-sabnzbd"
      target: /etc/cont-init.d/98-themepark
      read_only: false
  traefik:
    enable: true
    exposure: private
    port: 8080
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: "{{ docker_services_unraid_host }}"
    constraints:
      - node.labels.docker_services_host == docker_services_unraid_host
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
