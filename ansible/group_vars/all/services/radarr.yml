---

radarr:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: docker
  tags: [arrs, pgsql, radarr]
  ################################
  # IMAGE/PROCESS
  ################################
  image: ghcr.io/hotio/radarr:release-6.2.1.10461
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[services_storage_host].container_host_puid }}"
    PGID: "{{ hostvars[services_storage_host].container_host_pgid }}"
    UMASK: "022"
    RADARR__SERVER__PORT: "7878"
    RADARR__AUTH__METHOD: "External"
    RADARR__POSTGRES__HOST: "haproxy"
    RADARR__POSTGRES__PORT: "5432"
    FILE__RADARR__POSTGRES__USER: /run/secrets/postgres_user_secret
    FILE__RADARR__POSTGRES__PASSWORD: /run/secrets/postgres_pass_secret
    TP_SCHEME: "http"
    TP_DOMAIN: "{{ hostvars[services_controller_host].local_ip }}:8089"
    TP_HOTIO: "true"
    TP_THEME: "hotline"
  infisical:
    secrets_map:
      - var: cloudflare_zone
        path: /Cloudflare
        name: ZONE
      - var: postgres_user
        path: "/Postgres"
        name: USER
        secret:
          name: postgres_user_secret
      - var: postgres_pass
        path: "/Postgres"
        name: PASS
        secret:
          name: postgres_pass_secret
  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    overlay:
      external: true
  ################################
  # FILESYSTEM
  ################################
  volumes:
    media:
      type: bind
      source: "{{ hostvars[services_storage_host].container_host_data_root }}"
      target: /data
      read_only: false
  ################################
  # INTEGRATIONS
  ################################
  traefik:
    enable: true
    exposure: private
    port: 7878
  themepark:
    app: radarr
    theme: hotline
  ################################
  # RUNTIME/LIFECYCLE
  ################################
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: standard
    host: "{{ services_storage_host }}"
    constraints:
      - node.labels.docker_services_host == docker_services_unraid_host
  ################################
  # TARGETS (INSTANCES)
  ################################
  targets:
    ################################
    # RADARR 1080p SERVICE
    ################################
    radarr:
      ################################
      # IDENTITY
      ################################
      tags: [radarr-1080p]
      name: radarr
      stack: radarr
      ################################
      # ENVIRONMENT/SECRETS
      ################################
      environment:
        RADARR__APP__INSTANCENAME: "Radarr"
        FILE__RADARR__AUTH__APIKEY: /run/secrets/radarr_api_secret
        RADARR__POSTGRES__MAINDB: "radarr-main"
        RADARR__POSTGRES__LOGDB: "radarr-log"
      infisical:
        secrets_map:
          - var: radarr_api
            path: "/Radarr"
            name: API
            secret:
              name: radarr_api_secret
      ################################
      # FILESYSTEM
      ################################
      paths:
        - path: "{{ hostvars[services_storage_host].container_host_appdata_root }}/radarr"
          state: directory
          mode: "0755"
        - path: "{{ hostvars[services_storage_host].container_host_data_root }}/media/movies"
          state: directory
          mode: "0755"
      copies:
        - src: files/themepark/98-themepark-radarr
          dest: "{{ hostvars[services_storage_host].container_host_appdata_root }}/radarr/98-themepark-radarr"
          mode: "0755"
          force: false
          wait: true
          wait_timeout: 30
      volumes:
        config:
          type: bind
          source: "{{ hostvars[services_storage_host].container_host_appdata_root }}/radarr"
          target: /config
          read_only: false
        themepark:
          type: bind
          source: "{{ hostvars[services_storage_host].container_host_appdata_root }}/radarr/98-themepark-radarr"
          target: /etc/cont-init.d/98-themepark
          read_only: false
      ################################
      # HEALTH
      ################################
      healthcheck:
        test:
          - "CMD-SHELL"
          - "touch /data/media/movies/.healthcheck && rm -f /data/media/movies/.healthcheck || exit 1"
      ################################
      # INTEGRATIONS
      ################################
      postgres:
        enable: true
        databases:
          - radarr-main
          - radarr-log
    ################################
    # RADARR 2160p SERVICE
    ################################
    radarr_4k:
      ################################
      # IDENTITY
      ################################
      tags: [radarr-4k]
      name: radarr-4k
      stack: radarr-4k
      ################################
      # ENVIRONMENT/SECRETS
      ################################
      environment:
        RADARR__APP__INSTANCENAME: "Radarr-4K"
        FILE__RADARR__AUTH__APIKEY: /run/secrets/radarr_4k_api_secret
        RADARR__POSTGRES__MAINDB: "radarr-4k-main"
        RADARR__POSTGRES__LOGDB: "radarr-4k-log"
      infisical:
        secrets_map:
          - var: radarr_4k_api
            path: "/Radarr-4K"
            name: API
            secret:
              name: radarr_4k_api_secret
      ################################
      # FILESYSTEM
      ################################
      paths:
        - path: "{{ hostvars[services_storage_host].container_host_appdata_root }}/radarr-4k"
          state: directory
          mode: "0755"
        - path: "{{ hostvars[services_storage_host].container_host_data_root }}/media/movies-4k"
          state: directory
          mode: "0755"
      copies:
        - src: files/themepark/98-themepark-radarr
          dest: "{{ hostvars[services_storage_host].container_host_appdata_root }}/radarr-4k/98-themepark-radarr"
          mode: "0755"
          force: false
          wait: true
          wait_timeout: 30
      volumes:
        config:
          type: bind
          source: "{{ hostvars[services_storage_host].container_host_appdata_root }}/radarr-4k"
          target: /config
          read_only: false
        themepark:
          type: bind
          source: "{{ hostvars[services_storage_host].container_host_appdata_root }}/radarr-4k/98-themepark-radarr"
          target: /etc/cont-init.d/98-themepark
          read_only: false
      ################################
      # HEALTH
      ################################
      healthcheck:
        test:
          - "CMD-SHELL"
          - "touch /data/media/movies-4k/.healthcheck && rm -f /data/media/movies-4k/.healthcheck || exit 1"
      ################################
      # INTEGRATIONS
      ################################
      postgres:
        enable: true
        databases:
          - radarr-4k-main
          - radarr-4k-log
