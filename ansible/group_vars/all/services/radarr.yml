---

radarr:
  enabled: true
  tags: [arrs, pgsql, radarr]
  image: ghcr.io/hotio/radarr:release-6.2.1.10461
  named_networks:
    overlay:
      external: true
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[docker_services_unraid_host].docker_host_puid }}"
    PGID: "{{ hostvars[docker_services_unraid_host].docker_host_pgid }}"
    UMASK: "022"
    RADARR__SERVER__PORT: "7878"
    RADARR__AUTH__METHOD: "External"
    RADARR__POSTGRES__HOST: "haproxy"
    RADARR__POSTGRES__PORT: "5432"
    FILE__RADARR__POSTGRES__USER: /run/secrets/postgres_user_secret
    FILE__RADARR__POSTGRES__PASSWORD: /run/secrets/postgres_pass_secret
    TP_SCHEME: "http"
    TP_DOMAIN: "{{ hostvars[docker_services_primary_manager].local_ip }}:8089"
    TP_HOTIO: "true"
    TP_THEME: "hotline"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: postgres_user
        path: "/Postgres"
        name: USER
        docker_secret: postgres_user_secret
      - var: postgres_pass
        path: "/Postgres"
        name: PASS
        docker_secret: postgres_pass_secret
  secrets:
    - postgres_user_secret
    - postgres_pass_secret
  volumes:
    media:
      type: bind
      source: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}"
      target: /data
      read_only: false
  traefik:
    enable: true
    exposure: private
    port: 7878
  themepark:
    app: radarr
    theme: hotline
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: standard
    host: "{{ docker_services_unraid_host }}"
    constraints:
      - node.labels.docker_services_host == docker_services_unraid_host
  targets:

    ################################
    # RADARR 1080p SERVICE
    ################################
    radarr:
      name: radarr
      tags: [radarr-1080p]
      stack: radarr
      healthcheck:
        test:
          - "CMD-SHELL"
          - "touch /data/media/movies/.healthcheck && rm -f /data/media/movies/.healthcheck || exit 1"
      environment:
        RADARR__APP__INSTANCENAME: "Radarr"
        FILE__RADARR__AUTH__APIKEY: /run/secrets/radarr_api_secret
        RADARR__POSTGRES__MAINDB: "radarr-main"
        RADARR__POSTGRES__LOGDB: "radarr-log"
      infisical:
        secrets_map:
          - var: radarr_api
            path: "/Radarr"
            name: API
            docker_secret: radarr_api_secret
      secrets:
        - radarr_api_secret
      paths:
        - path: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/radarr"
          state: directory
          mode: "0755"
        - path: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}/media/movies"
          state: directory
          mode: "0755"
      copies:
        - src: files/themepark/98-themepark-radarr
          dest: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/radarr/98-themepark-radarr"
          mode: "0755"
          force: false
          wait: true
          wait_timeout: 30
      volumes:
        config:
          type: bind
          source: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/radarr"
          target: /config
          read_only: false
        themepark:
          type: bind
          source: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/radarr/98-themepark-radarr"
          target: /etc/cont-init.d/98-themepark
          read_only: false
      postgres:
        enable: true
        databases:
          - radarr-main
          - radarr-log

    ################################
    # RADARR 2160p SERVICE
    ################################
    radarr_4k:
      name: radarr-4k
      tags: [radarr-4k]
      stack: radarr-4k
      healthcheck:
        test:
          - "CMD-SHELL"
          - "touch /data/media/movies-4k/.healthcheck && rm -f /data/media/movies-4k/.healthcheck || exit 1"
      environment:
        RADARR__APP__INSTANCENAME: "Radarr-4K"
        FILE__RADARR__AUTH__APIKEY: /run/secrets/radarr_4k_api_secret
        RADARR__POSTGRES__MAINDB: "radarr-4k-main"
        RADARR__POSTGRES__LOGDB: "radarr-4k-log"
      infisical:
        secrets_map:
          - var: radarr_4k_api
            path: "/Radarr-4K"
            name: API
            docker_secret: radarr_4k_api_secret
      secrets:
        - radarr_4k_api_secret
      paths:
        - path: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/radarr-4k"
          state: directory
          mode: "0755"
        - path: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}/media/movies-4k"
          state: directory
          mode: "0755"
      copies:
        - src: files/themepark/98-themepark-radarr
          dest: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/radarr-4k/98-themepark-radarr"
          mode: "0755"
          force: false
          wait: true
          wait_timeout: 30
      volumes:
        config:
          type: bind
          source: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/radarr-4k"
          target: /config
          read_only: false
        themepark:
          type: bind
          source: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/radarr-4k/98-themepark-radarr"
          target: /etc/cont-init.d/98-themepark
          read_only: false
      postgres:
        enable: true
        databases:
          - radarr-4k-main
          - radarr-4k-log
