---

wallos:
  enabled: true
  runtime: docker
  tags: [media, wallos]
  name: wallos
  stack: wallos

  image: bellamy/wallos:latest

  environment:
    TZ: "{{ timezone }}"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: cloudflare_zone
        path: /Cloudflare
        name: ZONE

  named_networks:
    overlay:
      external: true

  paths:
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/wallos"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/wallos/db"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/wallos/logos"
      state: directory
      mode: "0755"
  volumes:
    db:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/wallos/db"
      target: /var/www/html/db
      read_only: false
    logos:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/wallos/logos"
      target: /var/www/html/images/uploads/logos
      read_only: false

  traefik:
    enable: true
    exposure: private
    port: 80

  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: standard
    host: "{{ services_controller_host }}"
    constraints:
      - node.labels.docker_services_host == services_controller_host
