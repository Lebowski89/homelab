---

wallos:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: podman
  tags:
    - media
    - wallos
  name: wallos
  ################################
  # IMAGE/PROCESS
  ################################
  image: "docker.io/bellamy/wallos:4.9.6@sha256:3b2cdc843b4b1920220ce26a5804208eab8c236c60d4c777c6223c181f837be1"
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  user: "0:0"
  environment:
    TZ: "{{ timezone }}"
  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    wallos:
      driver: bridge
      external: false
  ports:
    backend:
      exposure: private
      callers: [traefik]
      host_ip: "{{ local_ip }}"
      published: 18083
      target: 80
      protocol: tcp
  ################################
  # FILESYSTEM
  ################################
  paths:
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/wallos"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/wallos/db"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/wallos/logos"
      state: directory
      mode: "0755"
  volumes:
    db:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/wallos/db"
      target: /var/www/html/db
      read_only: false
    logos:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/wallos/logos"
      target: /var/www/html/images/uploads/logos
      read_only: false
  ################################
  # INTEGRATIONS
  ################################
  no_new_privileges: false
  traefik:
    enable: true
    exposure: private
    port: 18083
  ################################
  # RUNTIME/LIFECYCLE
  ################################
    backend_mode: host
    backend_host_inventory: "{{ services_controller_host }}"
  operational_requirements:
    acl: [mgt_backends]
    ownership_transition: true

  deploy:
    type: container
    host: "{{ services_controller_host }}"
    execution:
      mode: rootless
      host_user: podman-wallos
      userns:
        mode: keep-id
        uid: "82"
        gid: "82"
  systemd:
    restart: always
    restart_sec: 15s
    timeout_start_sec: 300s
    after:
      - network-online.target
