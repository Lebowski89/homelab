---

alloy:
  name: alloy
  stack: alloy
  image: grafana/alloy:v1.16.0
  named_networks:
    overlay:
      external: true
  command:
    - "run"
    - "--server.http.listen-addr=0.0.0.0:12345"
    - "--storage.path=/etc/alloy/data"
    - "/etc/alloy/config.alloy"
  environment:
    TZ: "{{ timezone }}"
  user: "0"
  paths:
    - path: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/alloy"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/alloy/data"
      state: directory
      mode: "0755"
  swarm_configs:
    - name: alloy_config
      src: files/alloy_config.alloy
      data_is_template: false
  configs:
    - source: alloy_config
      target: /etc/alloy/config.alloy
      mode: "0644"
  volumes:
    data:
      type: bind
      source: /opt/alloy/data
      target: /etc/alloy/data
      read_only: false
    docker_sock:
      type: bind
      source: /var/run/docker.sock
      target: /var/run/docker.sock
      read_only: true
    docker_container:
      type: bind
      source: /var/lib/docker/containers
      target: /var/lib/docker/containers
      read_only: true
  traefik:
    enable: true
    exposure: private
    port: 12345
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: "{{ docker_services_primary_manager }}"
    constraints:
      - node.labels.docker_services_host == docker_services_primary_manager
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
