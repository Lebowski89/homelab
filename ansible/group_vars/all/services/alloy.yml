---

alloy:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: docker
  tags: [monitoring, alloy]
  name: alloy
  ################################
  # IMAGE/PROCESS
  ################################
  image: "docker.io/grafana/alloy:v1.21.1"
  user: "0:0"
  command:
    - "run"
    - "--server.http.listen-addr=0.0.0.0:12345"
    - "--storage.path=/etc/alloy/data"
    - "/etc/alloy/config.alloy"
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    TZ: "{{ timezone }}"
  targets:
    workers:
      tags:
        - docker-workers
        - alloy-workers
      stack: alloy
      environment:
        ALLOY_HOST: "{{ '{{.Node.Hostname}}' }}"
      swarm_configs:
        - name: alloy_config
          src: alloy_config.alloy.j2
          data_is_template: true
      configs:
        - source: alloy_config
          target: /etc/alloy/config.alloy
          mode: "0644"
  ################################
  # CONNECTIVITY
  ################################
      named_networks:
        overlay:
          external: true
  ################################
  # FILESYSTEM
  ################################
      named_volumes:
        state:
          external: false
          name: alloy-state
          driver: local
      volumes:
        data:
          type: volume
          source: state
          target: /etc/alloy/data
          read_only: false
        docker_sock:
          type: bind
          source: /var/run/docker.sock
          target: /var/run/docker.sock
          read_only: true
        host_rootfs:
          type: bind
          source: /
          target: /host/rootfs
          read_only: true
        host_proc:
          type: bind
          source: /proc
          target: /host/proc
          read_only: true
        host_sys:
          type: bind
          source: /sys
          target: /host/sys
          read_only: true
        docker_lib:
          type: bind
          source: /var/lib/docker
          target: /var/lib/docker
          read_only: true
  ################################
  # INTEGRATIONS
  ################################
      traefik:
        enable: false
      operational_requirements:
        acl: [worker_backends]

      deploy:
        type: swarm
        mode: global
        profile: careful
        host:
          - "{{ services_storage_host }}"
          - "{{ services_plex_host }}"
        constraints:
          - node.platform.os == linux
          - "node.labels.ansible_host != {{ services_controller_host }}"
    mgt:
      runtime: podman
      tags:
        - mgt-collector
      name: alloy-mgt
      image: "docker.io/grafana/alloy:v1.21.1@sha256:4039c971193053a84e53dd9ed3e7d4561c069256b024631cd3498a353ed7ece8"
      environment:
        ALLOY_HOST: "{{ inventory_hostname }}"
      named_networks:
        shared:
          external: true
          name: "{{ podman_shared_network_name }}"
      ports:
        backend:
          host_ip: "{{ local_ip }}"
          published: 22345
          target: 12345
          protocol: tcp
      paths:
        - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/alloy"
          state: directory
          owner: "0"
          group: "0"
          mode: "0755"
        - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/alloy/data"
          state: directory
          owner: "0"
          group: "0"
          mode: "0755"
        - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/alloy/config"
          state: directory
          owner: "0"
          group: "0"
          mode: "0755"
        # runc cannot create a nested mountpoint inside the read-only config bind.
        - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/alloy/config/data"
          state: directory
          owner: "0"
          group: "0"
          mode: "0755"
      templates:
        - src: configs/alloy-mgt.alloy.j2
          dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/alloy/config/config.alloy"
          owner: "0"
          group: "0"
          mode: "0644"
          force: true
      volumes:
        data:
          type: bind
          source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/alloy/data"
          target: /etc/alloy/data
          read_only: false
        host_rootfs:
          type: bind
          source: /
          target: /host/rootfs
          read_only: true
        host_proc:
          type: bind
          source: /proc
          target: /host/proc
          read_only: true
        host_sys:
          type: bind
          source: /sys
          target: /host/sys
          read_only: true
        config:
          type: bind
          source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/alloy/config"
          target: /etc/alloy
          read_only: true
      no_new_privileges: false
      traefik:
        enable: true
        exposure: private
        subdomain: alloy
        port: 22345
        backend_mode: host
        backend_host_inventory: "{{ services_controller_host }}"
      ################################
      # RUNTIME/LIFECYCLE
      ################################
      operational_requirements:
        acl: [mgt_backends]

      deploy:
        type: container
        host: "{{ services_controller_host }}"
      systemd:
        requires:
          - "{{ podman_shared_network_name }}-network.service"
        restart: always
        restart_sec: 15s
        timeout_start_sec: 300s
