---

gotify:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: podman
  tags:
    - monitoring
    - pgsql
    - gotify
  name: gotify
  ################################
  # IMAGE/PROCESS
  ################################
  image: "docker.io/gotify/server:3.1.1@sha256:44fc5bbd1c0618878e33073d38c2c13126b48f245c3fe12236b1da48eb203b86"
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  user: "0:0"
  environment:
    TZ: "{{ timezone }}"
  env_file:
    - "{{ hostvars[services_controller_host].container_host_appdata_root }}/gotify/.env"
  infisical:
    secrets_map:
      - var: postgres_user
        path: "/Postgres"
        name: USER
      - var: postgres_pass
        path: "/Postgres"
        name: PASS
  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    gotify:
      driver: bridge
      external: false
  ports:
    backend:
      host_ip: "{{ local_ip }}"
      published: 18081
      target: 80
      protocol: tcp
  ################################
  # FILESYSTEM
  ################################
  paths:
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/gotify"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/gotify/images"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/gotify/plugins"
      state: directory
      mode: "0755"
  templates:
    - src: configs/gotify.env.j2
      no_log: true
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/gotify/.env"
      mode: "0600"
      force: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/gotify"
      target: /app/data
      read_only: false
  ################################
  # INTEGRATIONS
  ################################
  no_new_privileges: false
  traefik:
    enable: true
    exposure: private
    port: 18081
    backend_mode: host
    backend_host_inventory: "{{ services_controller_host }}"
  postgres:
    enable: true
    databases:
      - gotify
  ################################
  # RUNTIME/LIFECYCLE
  ################################
  operational_requirements:
    acl: [mgt_backends]
    ownership_transition: true

  deploy:
    type: container
    host: "{{ services_controller_host }}"
    execution:
      mode: rootless
      host_user: podman-gotify
      userns:
        mode: keep-id
        uid: "0"
        gid: "0"
  systemd:
    restart: always
    restart_sec: 15s
    timeout_start_sec: 300s
    after:
      - network-online.target
