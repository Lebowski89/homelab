---

mariadb:
  enabled: false
  runtime: docker
  tags: [mariadb]
  name: mariadb
  stack: mariadb

  image: mariadb:12
  user: >-
    {{ hostvars[services_controller_host].container_host_puid }}:{{ hostvars[services_controller_host].container_host_pgid }}

  environment:
    TZ: "{{ timezone }}"
    MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_pass_secret
    MARIADB_USER: "mariadb"
    MARIADB_PASSWORD_FILE: /run/secrets/mariadb_pass_secret
    MARIADB_DATABASE: "default"
    MARIADB_AUTO_UPGRADE: "1"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: mariadb_pass
        path: "/MariaDB"
        name: PASS
        secret:
          name: mariadb_pass_secret

  named_networks:
    overlay:
      external: true

  paths:
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/mariadb"
      state: directory
      mode: "0755"
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/mariadb"
      target: /var/lib/mysql
      read_only: false

  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: careful
    host: "{{ services_controller_host }}"
    constraints:
      - node.labels.docker_services_host == docker_services_primary_manager
