---

haproxy:
  name: haproxy
  stack: haproxy
  image: haproxy:3.3-alpine
  named_networks:
    overlay:
      external: true
  swarm_configs:
    - name: haproxy_cfg
      src: templates/configs/haproxy.cfg.j2
      data_is_template: true
  configs:
    - source: haproxy_cfg
      target: /usr/local/etc/haproxy/haproxy.cfg
      mode: "0444"
  ports:
    postgres:
      published: 5432
      target: 5432
      mode: host
  settings:
    haproxy_maxconn: 4096
    haproxy_timeout_connect: 5s
    haproxy_timeout_client: 4h
    haproxy_timeout_server: 4h
    haproxy_timeout_check: 5s
    haproxy_retries: 3
  deploy:
    type: swarm
    mode: global
    host: "{{ docker_services_primary_manager }}"
    constraints:
      - node.labels.haproxy == true
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
