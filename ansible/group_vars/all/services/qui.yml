---

qui:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: docker
  tags: [torrents, pgsql, qui]
  ################################
  # IMAGE/PROCESS
  ################################
  image: ghcr.io/autobrr/qui:v1.29.0
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[services_storage_host].container_host_puid }}"
    PGID: "{{ hostvars[services_storage_host].container_host_pgid }}"
    UMASK: "022"
  infisical:
    secrets_map:
      - var: postgres_user
        path: /Postgres
        name: USER
      - var: postgres_pass
        path: /Postgres
        name: PASS
  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    overlay:
      external: true
  ################################
  # FILESYSTEM
  ################################
  volumes:
    media:
      type: bind
      source: "{{ hostvars[services_storage_host].container_host_data_root }}"
      target: /data
      read_only: false
  ################################
  # INTEGRATIONS
  ################################
  traefik:
    enable: true
    exposure: private
    port: 7476
  postgres:
    enable: true
  ################################
  # RUNTIME/LIFECYCLE
  ################################
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: standard
    host: "{{ services_storage_host }}"
    constraints:
      - node.labels.docker_services_host == docker_services_unraid_host
  ################################
  # TARGETS (INSTANCES)
  ################################
  targets:
    alpha:
      ################################
      # IDENTITY
      ################################
      tags: [qui-alpha]
      name: qui-alpha
      stack: qui-alpha
      ################################
      # IMAGE/PROCESS
      ################################
      hostname: qui-alpha.internal
      ################################
      # ENVIRONMENT/SECRETS
      ################################
      env_file:
        - /opt/stacks/qui-alpha.env
      swarm_env_templates:
        - src: configs/qui.env.j2
          no_log: true
          dest: /opt/stacks/qui-alpha.env
          mode: "0600"
          force: true
      ################################
      # FILESYSTEM
      ################################
      paths:
        - path: "{{ hostvars[services_storage_host].container_host_appdata_root }}/qui-alpha"
          state: directory
          mode: "0755"
      volumes:
        config:
          type: bind
          source: "{{ hostvars[services_storage_host].container_host_appdata_root }}/qui-alpha"
          target: /config
          read_only: false
      ################################
      # INTEGRATIONS
      ################################
      postgres:
        databases:
          - qui-alpha
    bravo:
      ################################
      # IDENTITY
      ################################
      tags: [qui-bravo]
      name: qui-bravo
      stack: qui-bravo
      ################################
      # IMAGE/PROCESS
      ################################
      hostname: qui-bravo.internal
      ################################
      # ENVIRONMENT/SECRETS
      ################################
      env_file:
        - /opt/stacks/qui-bravo.env
      swarm_env_templates:
        - src: configs/qui.env.j2
          no_log: true
          dest: /opt/stacks/qui-bravo.env
          mode: "0600"
          force: true
      ################################
      # FILESYSTEM
      ################################
      paths:
        - path: "{{ hostvars[services_storage_host].container_host_appdata_root }}/qui-bravo"
          state: directory
          mode: "0755"
      volumes:
        config:
          type: bind
          source: "{{ hostvars[services_storage_host].container_host_appdata_root }}/qui-bravo"
          target: /config
          read_only: false
      ################################
      # INTEGRATIONS
      ################################
      postgres:
        databases:
          - qui-bravo
