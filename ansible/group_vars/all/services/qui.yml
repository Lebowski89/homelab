---

qui:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: docker
  tags: [torrents, pgsql, qui]
  name: qui
  stack: qui
  ################################
  # IMAGE/PROCESS
  ################################
  image: ghcr.io/autobrr/qui:v1.25.0
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[services_storage_host].container_host_puid }}"
    PGID: "{{ hostvars[services_storage_host].container_host_pgid }}"
    UMASK: "022"
  env_file:
    - /opt/stacks/qui.env
  infisical:
    secrets_map:
      - var: postgres_user
        path: /Postgres
        name: USER
      - var: postgres_pass
        path: /Postgres
        name: PASS
  swarm_env_templates:
    - src: configs/qui.env.j2
      no_log: true
      dest: /opt/stacks/qui.env
      mode: "0600"
      force: true
  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    overlay:
      external: true
  ################################
  # FILESYSTEM
  ################################
  paths:
    - path: "{{ hostvars[services_storage_host].container_host_appdata_root }}/qui"
      state: directory
      mode: "0755"
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_storage_host].container_host_appdata_root }}/qui"
      target: /config
      read_only: false
    media:
      type: bind
      source: "{{ hostvars[services_storage_host].container_host_data_root }}"
      target: /data
      read_only: false
  ################################
  # INTEGRATIONS
  ################################
  traefik:
    enable: true
    exposure: private
    port: 7476
  postgres:
    enable: true
    databases:
      - qui
  ################################
  # RUNTIME/LIFECYCLE
  ################################
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: standard
    host: "{{ services_storage_host }}"
    constraints:
      - node.labels.docker_services_host == docker_services_unraid_host
