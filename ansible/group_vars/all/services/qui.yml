---

qui:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: docker
  tags: [torrents, pgsql, qui]
  name: qui
  stack: qui

  ################################
  # IMAGE/PROCESS
  ################################
  image: ghcr.io/autobrr/qui:v1.33.1
  hostname: qui.internal

  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[services_storage_host].container_host_puid }}"
    PGID: "{{ hostvars[services_storage_host].container_host_pgid }}"
    UMASK: "022"
  env_file:
    - /opt/stacks/qui.env
  infisical:
    secrets_map:
      - var: postgres_user
        path: /Postgres
        name: USER
      - var: postgres_pass
        path: /Postgres
        name: PASS
  swarm_env_templates:
    - src: configs/qui.env.j2
      no_log: true
      dest: /opt/stacks/qui.env
      mode: "0600"
      force: true

  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    overlay:
      external: true
  ports:
    web_backend:
      exposure: private
      callers: [traefik]
      published: 22608
      target: 7476
      mode: host

  ################################
  # FILESYSTEM
  ################################
  paths:
    - path: "{{ hostvars[services_storage_host].container_host_appdata_root }}/qui"
      state: directory
      mode: "0755"
  volumes:
    media:
      type: bind
      source: "{{ hostvars[services_storage_host].container_host_data_root }}"
      target: /data
      read_only: false
    config:
      type: bind
      source: "{{ hostvars[services_storage_host].container_host_appdata_root }}/qui"
      target: /config
      read_only: false

  ################################
  # INTEGRATIONS
  ################################
  traefik:
    enable: true
    exposure: private
    port: 22608
    backend_mode: host
    backend_host_inventory: "{{ services_storage_host }}"
  postgres:
    enable: true
    databases:
      - qui-alpha

  ################################
  # RUNTIME/LIFECYCLE
  ################################
  operational_requirements:
    acl: [worker_backends]
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: standard
    hosts: "{{ services_storage_host }}"
