---

qui:
  name: qui
  stack: qui
  image: ghcr.io/autobrr/qui:v1.18.0
  named_networks:
    overlay:
      external: true
  healthcheck:
    test:
      - "CMD"
      - "wget"
      - "--spider"
      - "-q"
      - "http://127.0.0.1:7476/"
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[docker_services_unraid_host].docker_host_puid }}"
    PGID: "{{ hostvars[docker_services_unraid_host].docker_host_pgid }}"
    UMASK: "022"
  env_file:
    - /opt/stacks/qui.env
  paths:
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/qui"
      state: directory
      mode: "0755"
  swarm_env_templates:
    - src: configs/qui.env.j2
      dest: /opt/stacks/qui.env
      mode: "0600"
      force: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/qui"
      target: /config
      read_only: false
    media:
      type: bind
      source: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}"
      target: /data
      read_only: false
  traefik:
    enable: true
    exposure: private
    port: 7476
  postgres:
    enable: true
    databases:
      - qui
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: "{{ docker_services_unraid_host }}"
    constraints:
      - node.labels.docker_services_host == docker_services_unraid_host
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
