---

qui:
  enabled: true
  runtime: docker
  tags: [torrents, pgsql, qui]
  name: qui
  stack: qui

  image: ghcr.io/autobrr/qui:v1.20.0

  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[services_storage_host].container_host_puid }}"
    PGID: "{{ hostvars[services_storage_host].container_host_pgid }}"
    UMASK: "022"
  env_file:
    - /opt/stacks/qui.env
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: cloudflare_zone
        path: /Cloudflare
        name: ZONE
      - var: postgres_user
        path: /Postgres
        name: USER
      - var: postgres_pass
        path: /Postgres
        name: PASS
  swarm_env_templates:
    - src: configs/qui.env.j2
      no_log: true
      dest: /opt/stacks/qui.env
      mode: "0600"
      force: true

  named_networks:
    overlay:
      external: true

  paths:
    - path: "{{ hostvars[services_storage_host].container_host_appdata_root }}/qui"
      state: directory
      mode: "0755"
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_storage_host].container_host_appdata_root }}/qui"
      target: /config
      read_only: false
    media:
      type: bind
      source: "{{ hostvars[services_storage_host].container_host_data_root }}"
      target: /data
      read_only: false

  traefik:
    enable: true
    exposure: private
    port: 7476
  postgres:
    enable: true
    databases:
      - qui

  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: standard
    host: "{{ services_storage_host }}"
    constraints:
      - node.labels.docker_services_host == docker_services_unraid_host
