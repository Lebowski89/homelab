---

homepage:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: podman
  tags: [monitoring, homepage]
  name: homepage
  ################################
  # IMAGE/PROCESS
  ################################
  image: ghcr.io/gethomepage/homepage:v2.0.0
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[services_controller_host].container_host_puid }}"
    PGID: "{{ hostvars[services_controller_host].container_host_pgid }}"
    UMASK: "022"
    HOMEPAGE_ALLOWED_HOSTS:
      value_template: "homepage.int.${cloudflare_zone}:8443"
  infisical:
    secrets_map:
      - var: autobrr_api
        path: "/AutoBrr"
        name: API
      - var: bazarr_api
        path: "/Bazarr"
        name: API
      - var: cloudflare_zone
        path: "/Cloudflare"
        name: ZONE
      - var: grafana_user
        path: "/Grafana"
        name: USER
      - var: grafana_pass
        path: "/Grafana"
        name: PASS
      - var: seerr_api
        path: "/Seerr"
        name: API
      - var: lidarr_api
        path: "/Lidarr"
        name: API
      - var: ombi_api
        path: "/Ombi"
        name: API
      - var: plex_token
        path: "/Plex"
        name: TOKEN
      - var: portainer_token
        path: "/Portainer"
        name: HOMEPAGE_TOKEN
      - var: prowlarr_api
        path: "/Prowlarr"
        name: API
      - var: qui_downloads_token
        path: "/HomePage"
        name: QUI_DOWNLOADS_TOKEN
      - var: qui_seeds_token
        path: "/HomePage"
        name: QUI_SEEDS_TOKEN
      - var: radarr_api
        path: "/Radarr"
        name: API
      - var: radarr_4k_api
        path: "/Radarr-4K"
        name: API
      - var: sabnzbd_api
        path: "/SABnzbd"
        name: API
      - var: sonarr_api
        path: "/Sonarr"
        name: API
      - var: sonarr_4k_api
        path: "/Sonarr-4K"
        name: API
      - var: stash_api
        path: "/Stash"
        name: API
      - var: tautulli_api
        path: "/Tautulli"
        name: API
      - var: technitium_token
        path: "/HomePage"
        name: TECHNITIUM_TOKEN
      - var: unifi_user
        path: "/Unifi"
        name: USER
      - var: unifi_pass
        path: "/Unifi"
        name: PASS
  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    homepage:
      driver: bridge
      external: false
  ports:
    - host_ip: "{{ local_ip }}"
      published: 13000
      target: 3000
      protocol: tcp
  ################################
  # FILESYSTEM
  ################################
  paths:
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/homepage"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/homepage/images"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/homepage/.env"
      state: absent
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/homepage/docker.yaml"
      state: absent
  copies:
    - src: files/earth-rise-2.jpg
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/homepage/images/earth-rise-2.jpg"
      mode: "0755"
      force: false
      wait: true
      wait_timeout: 30
  templates:
    - src: configs/homepage/services.yaml.j2
      no_log: true
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/homepage/services.yaml"
      mode: "0664"
      force: true
    - src: configs/homepage/settings.yaml.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/homepage/settings.yaml"
      mode: "0664"
      force: true
      no_log: true
    - src: configs/homepage/bookmarks.yaml.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/homepage/bookmarks.yaml"
      mode: "0664"
      force: true
    - src: configs/homepage/widgets.yaml.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/homepage/widgets.yaml"
      mode: "0664"
      force: true
    - src: configs/homepage/custom.css.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/homepage/custom.css"
      mode: "0664"
      force: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/homepage"
      target: /app/config
      read_only: false
    images:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/homepage/images"
      target: /app/public/images
      read_only: true
  ################################
  # INTEGRATIONS
  ################################
  traefik:
    enable: true
    exposure: private
    port: 13000
    backend_mode: host
    backend_host_inventory: "{{ services_controller_host }}"
  ################################
  # RUNTIME/LIFECYCLE
  ################################
  deploy:
    type: container
    host: "{{ services_controller_host }}"
    execution:
      mode: rootless
      host_user: podman-homepage
      userns:
        mode: keep-id
        uid: "{{ hostvars[services_controller_host].container_host_puid }}"
        gid: "{{ hostvars[services_controller_host].container_host_pgid }}"
  systemd:
    after: [network-online.target]
    restart: on-failure
    restart_sec: 10s
