---

portainer:
  enabled: true
  runtime: docker
  tags: [monitoring, portainer]
  stack: portainer

  infisical:
    fail_on_empty: true
    secrets_map:
      - var: cloudflare_zone
        path: /Cloudflare
        name: ZONE

  named_networks:
    overlay:
      external: true

  deploy:
    type: swarm
    profile: careful

  targets:

    ################################
    # PORTAINER-AGENT SERVICE
    ################################
    agent:
      name: agent

      image: portainer/agent:2.43.0-linux-amd64-alpine

      volumes:
        docker_volumes:
          type: bind
          source: /var/lib/docker/volumes
          target: /var/lib/docker/volumes
        docker_sock:
          type: bind
          source: /var/run/docker.sock
          target: /var/run/docker.sock

      deploy:
        mode: global
        constraints:
          - node.platform.os == linux

    ################################
    # PORTAINER SERVICE
    ################################
    main:
      name: portainer

      image: portainer/portainer-ce:2.43.0-linux-amd64-alpine
      command:
        - "-H tcp://tasks.agent:9001 --tlsskipverify"

      environment:
        TZ: "{{ timezone }}"
        PUID: "{{ hostvars[services_controller_host].container_host_puid }}"
        PGID: "{{ hostvars[services_controller_host].container_host_pgid }}"
        UMASK: "022"

      paths:
        - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/portainer"
          state: directory
          mode: "0755"
      volumes:
        config:
          type: bind
          source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/portainer"
          target: /data
          read_only: false
        docker_sock:
          type: bind
          source: /var/run/docker.sock
          target: /var/run/docker.sock
          read_only: true

      traefik:
        enable: true
        exposure: private
        port: 9000

      deploy:
        mode: replicated
        replicas: 1
        host: "{{ services_controller_host }}"
        constraints:
          - node.labels.docker_services_host == docker_services_primary_manager
