---

traefik:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: podman
  tags:
    - proxy
    - traefik
  name: traefik
  ################################
  # IMAGE/PROCESS
  ################################
  image: "docker.io/library/traefik:v3.7.13@sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0"
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  user: "0:0"
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[services_controller_host].container_host_puid }}"
    PGID: "{{ hostvars[services_controller_host].container_host_pgid }}"
    UMASK: "022"
    CF_DNS_API_TOKEN_FILE: /run/secrets/cloudflare_api_secret
  infisical:
    secrets_map:
      - var: cloudflare_api
        path: "/Cloudflare"
        name: API
        secret:
          name: cloudflare_api_secret
  ################################
  # CONNECTIVITY
  ################################
  network_mode: pasta
  ports:
    web_secure_private:
      published: "{{ services_private_https_port }}"
      target: "{{ services_private_https_port }}"
  ################################
  # FILESYSTEM
  ################################
    metrics:
      host_ip: "{{ local_ip }}"
      published: 18084
      target: 8082
      protocol: tcp
  paths:
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/traefik"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/traefik/dynamic"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/traefik/acme.json"
      state: touch
      mode: "0600"
      access_time: preserve
      modification_time: preserve
    - path: "{{ services_log_root }}"
      state: directory
      owner: "0"
      group: "0"
      mode: "0755"
    - path: "{{ services_log_root }}/traefik"
      state: directory
      mode: "0755"
  templates:
    - src: configs/proxy/traefik/config.yml.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/traefik/traefik.yml"
      mode: "0664"
      force: true
    - src: configs/proxy/traefik/middlewares.yml.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/traefik/dynamic/middlewares.yml"
      mode: "0664"
      force: true
      restart: false
    - src: configs/proxy/authelia/middleware.yml.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/traefik/dynamic/authelia-middleware.yml"
      mode: "0664"
      restart: false
    - src: configs/proxy/authelia/router.yml.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/traefik/dynamic/authelia-router.yml"
      mode: "0664"
      force: true
      restart: false
    - src: configs/proxy/traefik/dashboard.yml.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/traefik/dynamic/traefik-dashboard.yml"
      mode: "0664"
      force: true
      restart: false
    - src: configs/proxy/traefik/logrotate.j2
      dest: /etc/logrotate.d/skynet-traefik
      owner: "0"
      group: "0"
      mode: "0644"
      force: true
    - src: configs/proxy/traefik/reopen-logs.sh.j2
      dest: /usr/local/sbin/skynet-traefik-reopen-logs
      owner: "0"
      group: "0"
      mode: "0755"
      force: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/traefik"
      target: /etc/traefik
      read_only: false
    logs:
      type: bind
      source: "{{ services_log_root }}/traefik"
      target: /etc/traefik/logs
      read_only: false
  ################################
  # HEALTH
  ################################
  no_new_privileges: false
  healthcheck:
    test:
      - "CMD"
      - "wget"
      - "--spider"
      - "-q"
      - "http://127.0.0.1:8081/ping"
  ################################
  # RUNTIME/LIFECYCLE
  ################################
    interval: 1m
    timeout: 15s
    retries: 3
    start_period: 30s
  operational_requirements:
    acl: [mgt_backends]
    ownership_transition: true

  deploy:
    type: container
    host: "{{ services_controller_host }}"
    execution:
      mode: rootless
      host_user: podman-traefik
      userns:
        mode: keep-id
        uid: "0"
        gid: "0"
  systemd:
    restart: always
    restart_sec: 15s
    timeout_start_sec: 300s
    after:
      - network-online.target
