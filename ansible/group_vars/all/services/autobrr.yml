---

autobrr:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: podman
  tags:
    - media
    - pgsql
    - autobrr
  name: autobrr
  ################################
  # IMAGE/PROCESS
  ################################
  image: ghcr.io/autobrr/autobrr:v1.89.0@sha256:03644017858c2e54fdc3138c2a13ae8ea8b142d1b9f2ac92e7a2c005b3f3958d
  user: >-
    {{ hostvars[services_controller_host].container_host_puid }}:{{ hostvars[services_controller_host].container_host_pgid }}
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    TZ: "{{ timezone }}"
    AUTOBRR__HOST: "0.0.0.0"
    AUTOBRR__PORT: "7474"
    AUTOBRR__LOG_LEVEL: "DEBUG"
    AUTOBRR__CHECK_FOR_UPDATES: "true"
    AUTOBRR__SESSION_SECRET:
      value_from:
        infisical: autobrr_session
    AUTOBRR__DATABASE_TYPE: "postgres"
    AUTOBRR__POSTGRES_HOST: "haproxy.{{ services_internal_zone }}"
    AUTOBRR__POSTGRES_PORT: "5432"
    AUTOBRR__POSTGRES_DATABASE: "autobrr"
    AUTOBRR__POSTGRES_USER:
      value_from:
        infisical: postgres_user
    AUTOBRR__POSTGRES_PASS:
      value_from:
        infisical: postgres_pass
    AUTOBRR__POSTGRES_SSLMODE: "disable"
  infisical:
    secrets_map:
      - var: autobrr_session
        path: "/AutoBrr"
        name: SESSION_SECRET
      - var: postgres_user
        path: "/Postgres"
        name: USER
      - var: postgres_pass
        path: "/Postgres"
        name: PASS
  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    autobrr:
      driver: bridge
      external: false
  ports:
    backend:
      host_ip: "{{ local_ip }}"
      published: 17474
      target: 7474
      protocol: tcp
  ################################
  # FILESYSTEM
  ################################
  paths:
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/autobrr"
      state: directory
      mode: "0755"
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/autobrr"
      target: /config
      read_only: false
  ################################
  # INTEGRATIONS
  ################################
  no_new_privileges: false
  traefik:
    enable: true
    exposure: private
    port: 17474
    backend_mode: host
    backend_host_inventory: "{{ services_controller_host }}"
  postgres:
    enable: true
    databases:
      - autobrr
  ################################
  # RUNTIME/LIFECYCLE
  ################################
  operational_requirements:
    acl: [mgt_backends]
    ownership_transition: true

  deploy:
    type: container
    hosts: "{{ services_controller_host }}"
    execution:
      mode: rootless
      host_user: podman-autobrr
      userns:
        mode: keep-id
        uid: "{{ hostvars[services_controller_host].container_host_puid }}"
        gid: "{{ hostvars[services_controller_host].container_host_pgid }}"
  systemd:
    restart: always
    restart_sec: 15s
    timeout_start_sec: 300s
    after:
      - network-online.target
