---

bazarr:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: docker
  tags: [arrs, pgsql, bazarr]
  name: bazarr
  stack: bazarr
  ################################
  # IMAGE/PROCESS
  ################################
  image: ghcr.io/hotio/bazarr:release-v1.6.2
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[services_storage_host].container_host_puid }}"
    PGID: "{{ hostvars[services_storage_host].container_host_pgid }}"
    UMASK: "022"
    WEBUI_PORTS: "6767/tcp,6767/udp"
  infisical:
    secrets_map:
      - var: bazarr_api
        path: "/Bazarr"
        name: API
      - var: opensubtitlescom_user
        path: "/Bazarr"
        name: OPENSUBSCOM_USER
      - var: opensubtitlescom_pass
        path: "/Bazarr"
        name: OPENSUBSCOM_PASS
      - var: radarr_api
        path: "/Radarr"
        name: API
      - var: sonarr_api
        path: "/Sonarr"
        name: API
      - var: postgres_user
        path: "/Postgres"
        name: USER
      - var: postgres_pass
        path: "/Postgres"
        name: PASS
  application_prepare:
    handler: bazarr
  prep:
    postgres:
      host: "haproxy"
      port: "5432"
  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    overlay:
      external: true
  ################################
  # FILESYSTEM
  ################################
  ports:
    web_backend:
      published: 22601
      target: 6767
      mode: host
  ################################
  # FILESYSTEM
  ################################
  paths:
    - path: "{{ hostvars[services_storage_host].container_host_appdata_root }}/bazarr"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_storage_host].container_host_appdata_root }}/bazarr/config"
      state: directory
      mode: "0755"
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_storage_host].container_host_appdata_root }}/bazarr"
      target: /config
      read_only: false
    media:
      type: bind
      source: "{{ hostvars[services_storage_host].container_host_data_root }}"
      target: /data
      read_only: false
  ################################
  # INTEGRATIONS
  ################################
  traefik:
    enable: true
    exposure: private
    port: 22601
    backend_mode: host
    backend_host_inventory: "{{ services_storage_host }}"
  themepark:
    app: bazarr
    theme: hotline
  postgres:
    enable: true
    databases:
      - bazarr
  ################################
  # RUNTIME/LIFECYCLE
  ################################
  operational_requirements:
    acl: [worker_backends]

  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: standard
    hosts: "{{ services_storage_host }}"
