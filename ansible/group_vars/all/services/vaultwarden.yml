---

vaultwarden:
  enabled: true
  runtime: docker
  tags: [utilities, pgsql, vaultwarden]
  name: vaultwarden
  stack: vaultwarden

  image: vaultwarden/server:1.36.0
  user: >-
    {{ hostvars[services_controller_host].container_host_puid }}:{{ hostvars[services_controller_host].container_host_pgid }}

  environment:
    TZ: "{{ timezone }}"
    ADMIN_TOKEN_FILE: /run/secrets/vaultwarden_admin_secret
  env_file:
    - "{{ hostvars[services_controller_host].container_host_appdata_root }}/vaultwarden/.env"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: cloudflare_zone
        path: /Cloudflare
        name: ZONE
      - var: postgres_user
        path: "/Postgres"
        name: USER
      - var: postgres_pass
        path: "/Postgres"
        name: PASS
      - var: smtp_email
        path: "/Porkbun"
        name: SMTP_EMAIL
      - var: smtp_host
        path: "/Porkbun"
        name: SMTP_HOST
      - var: smtp_password
        path: "/Porkbun"
        name: SMTP_PASS
      - var: smtp_port
        path: "/Porkbun"
        name: SMTP_PORT
      - var: smtp_sender
        path: "/Porkbun"
        name: SMTP_SENDER
      - var: smtp_username
        path: "/Porkbun"
        name: SMTP_USER

  paths_vault:
    vault_dir: "{{ hostvars[services_controller_host].container_host_appdata_root }}/vaultwarden"
    vault_token_file: >-
      {{ hostvars[services_controller_host].container_host_appdata_root }}/vaultwarden/token.txt
    vault_pass_file: >-
      {{ hostvars[services_controller_host].container_host_appdata_root }}/vaultwarden/password.txt
    vault_secret_name: vaultwarden_admin_secret
  application_prepare:
    handler: vaultwarden

  named_networks:
    overlay:
      external: true

  paths:
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/vaultwarden"
      state: directory
      mode: "0755"
  templates:
    - src: configs/vaultwarden.env.j2
      no_log: true
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/vaultwarden/.env"
      mode: "0664"
      force: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/vaultwarden"
      target: /data
      read_only: false

  traefik:
    enable: true
    port: 80
    sso: authelia
  postgres:
    enable: true
    databases:
      - vaultwarden

  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: careful
    host: "{{ services_controller_host }}"
    constraints:
      - node.labels.docker_services_host == docker_services_primary_manager
