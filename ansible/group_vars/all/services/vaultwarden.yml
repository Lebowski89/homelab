---

vaultwarden:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: podman
  tags:
    - utilities
    - pgsql
    - vaultwarden
  name: vaultwarden
  ################################
  # IMAGE/PROCESS
  ################################
  image: "docker.io/vaultwarden/server:1.37.4@sha256:efb3cde962015fcc036b2ea625242248611943b27212ebf4392841fb30fad055"
  user: >-
    {{ hostvars[services_controller_host].container_host_puid }}:{{ hostvars[services_controller_host].container_host_pgid }}
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    TZ: "{{ timezone }}"
    ROCKET_PORT: "8080"
    ADMIN_TOKEN_FILE: /run/secrets/vaultwarden_admin_secret
  env_file:
    - "{{ hostvars[services_controller_host].container_host_appdata_root }}/vaultwarden/.env"
  infisical:
    secrets_map:
      - var: postgres_user
        path: "/Postgres"
        name: USER
      - var: postgres_pass
        path: "/Postgres"
        name: PASS
      - var: smtp_email
        path: "/Porkbun"
        name: SMTP_EMAIL
      - var: smtp_host
        path: "/Porkbun"
        name: SMTP_HOST
      - var: smtp_password
        path: "/Porkbun"
        name: SMTP_PASS
      - var: smtp_port
        path: "/Porkbun"
        name: SMTP_PORT
      - var: smtp_sender
        path: "/Porkbun"
        name: SMTP_SENDER
      - var: smtp_username
        path: "/Porkbun"
        name: SMTP_USER
  paths_vault:
    vault_dir: "{{ hostvars[services_controller_host].container_host_appdata_root }}/vaultwarden"
    vault_token_file: >-
      {{ hostvars[services_controller_host].container_host_appdata_root }}/vaultwarden/token.txt
    vault_pass_file: >-
      {{ hostvars[services_controller_host].container_host_appdata_root }}/vaultwarden/password.txt
    vault_secret_name: vaultwarden_admin_secret
  application_prepare:
    handler: vaultwarden
  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    vaultwarden:
      driver: bridge
      external: false
  ports:
    backend:
      host_ip: "{{ local_ip }}"
      published: 18082
      target: 8080
      protocol: tcp
  ################################
  # FILESYSTEM
  ################################
  paths:
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/vaultwarden"
      state: directory
      mode: "0755"
  templates:
    - src: configs/vaultwarden.env.j2
      no_log: true
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/vaultwarden/.env"
      mode: "0600"
      force: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/vaultwarden"
      target: /data
      read_only: false
  ################################
  # INTEGRATIONS
  ################################
  no_new_privileges: false
  traefik:
    enable: true
    exposure: private
    port: 18082
    sso: authelia
    backend_mode: host
    backend_host_inventory: "{{ services_controller_host }}"
  postgres:
    enable: true
    databases:
      - vaultwarden
  ################################
  # RUNTIME/LIFECYCLE
  ################################
  operational_requirements:
    acl: [mgt_backends]
    ownership_transition: true

  deploy:
    type: container
    hosts: "{{ services_controller_host }}"
    execution:
      mode: rootless
      host_user: podman-vaultwarden
      userns:
        mode: keep-id
        uid: "{{ hostvars[services_controller_host].container_host_puid }}"
        gid: "{{ hostvars[services_controller_host].container_host_pgid }}"
  systemd:
    restart: always
    restart_sec: 15s
    timeout_start_sec: 300s
    after:
      - network-online.target
