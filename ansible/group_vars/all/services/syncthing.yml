---

syncthing:
  enabled: true
  runtime: docker
  tags: [utilities, syncthing]
  name: syncthing
  stack: syncthing

  image: lscr.io/linuxserver/syncthing:v2.1.1-ls221

  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[services_storage_host].container_host_puid }}"
    PGID: "{{ hostvars[services_storage_host].container_host_pgid }}"
    UMASK: "022"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: cloudflare_zone
        path: /Cloudflare
        name: ZONE

  named_networks:
    overlay:
      external: true
  ports:
    listening_tcp:
      published: 22000
      target: 22000
      mode: host
    listening_udp:
      published: 22000
      target: 22000
      protocol: udp
      mode: host
    discovery:
      published: 21027
      target: 21027
      protocol: udp
      mode: host

  paths:
    - path: "{{ hostvars[services_storage_host].container_host_appdata_root }}/syncthing"
      state: directory
      mode: "0755"
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_storage_host].container_host_appdata_root }}/syncthing"
      target: /config
      read_only: false
    media:
      type: bind
      source: "{{ hostvars[services_storage_host].container_host_data_root }}"
      target: /data
      read_only: false

  traefik:
    enable: true
    exposure: private
    port: 8384

  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: standard
    host: "{{ services_storage_host }}"
    constraints:
      - node.labels.docker_services_host == services_storage_host
