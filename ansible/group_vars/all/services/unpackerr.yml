---

unpackerr:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: docker
  tags: [torrents, unpackerr]
  name: unpackerr
  stack: unpackerr
  ################################
  # IMAGE/PROCESS
  ################################
  image: ghcr.io/unpackerr/unpackerr:1.0.0@sha256:21c6bfa4f4c86ab2dd0232da0dfb3ed4c5d929e42e09894e7b4d2154d0c144f6
  user: "{{ hostvars[services_storage_host].container_host_puid }}:{{ hostvars[services_storage_host].container_host_pgid }}"
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    TZ: "{{ timezone }}"
  infisical:
    secrets_map:
      - var: unpackerr_notifiarr_webhook
        path: "/Unpackerr"
        name: NOTIFIARR_WEBHOOK
        secret:
          name: unpackerr_webhook_secret
          uid: "{{ hostvars[services_storage_host].container_host_puid }}"
          gid: "{{ hostvars[services_storage_host].container_host_pgid }}"
          mode: "0400"
      - var: lidarr_api
        path: "/Lidarr"
        name: API
        secret:
          name: lidarr_api_secret
          uid: "{{ hostvars[services_storage_host].container_host_puid }}"
          gid: "{{ hostvars[services_storage_host].container_host_pgid }}"
          mode: "0400"
      - var: radarr_api
        path: "/Radarr"
        name: API
        secret:
          name: radarr_api_secret
          uid: "{{ hostvars[services_storage_host].container_host_puid }}"
          gid: "{{ hostvars[services_storage_host].container_host_pgid }}"
          mode: "0400"
      - var: radarr_4k_api
        path: "/Radarr-4K"
        name: API
        secret:
          name: radarr_4k_api_secret
          uid: "{{ hostvars[services_storage_host].container_host_puid }}"
          gid: "{{ hostvars[services_storage_host].container_host_pgid }}"
          mode: "0400"
      - var: sonarr_api
        path: "/Sonarr"
        name: API
        secret:
          name: sonarr_api_secret
          uid: "{{ hostvars[services_storage_host].container_host_puid }}"
          gid: "{{ hostvars[services_storage_host].container_host_pgid }}"
          mode: "0400"
      - var: sonarr_4k_api
        path: "/Sonarr-4K"
        name: API
        secret:
          name: sonarr_4k_api_secret
          uid: "{{ hostvars[services_storage_host].container_host_puid }}"
          gid: "{{ hostvars[services_storage_host].container_host_pgid }}"
          mode: "0400"
      - var: whisparr_api
        path: "/Whisparr"
        name: API
        secret:
          name: whisparr_api_secret
          uid: "{{ hostvars[services_storage_host].container_host_puid }}"
          gid: "{{ hostvars[services_storage_host].container_host_pgid }}"
          mode: "0400"
  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    overlay:
      external: true
  ports:
    web_backend:
      exposure: private
      callers: [traefik]
      published: 22624
      target: 5656
      mode: host
  ################################
  # FILESYSTEM
  ################################
  paths:
    - path: "{{ hostvars[services_storage_host].container_host_appdata_root }}/unpackerr"
      state: directory
      owner: "{{ hostvars[services_storage_host].container_host_puid }}"
      group: "{{ hostvars[services_storage_host].container_host_pgid }}"
      mode: "0750"
  templates:
    - src: configs/unpackerr.conf.j2
      dest: "{{ hostvars[services_storage_host].container_host_appdata_root }}/unpackerr/unpackerr.conf"
      owner: "{{ hostvars[services_storage_host].container_host_puid }}"
      group: "{{ hostvars[services_storage_host].container_host_pgid }}"
      mode: "0600"
      force: false
      no_log: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_storage_host].container_host_appdata_root }}/unpackerr"
      target: /config
      read_only: false
    media:
      type: bind
      source: "{{ hostvars[services_storage_host].container_host_data_root }}"
      target: /data
      read_only: false
  ################################
  # INTEGRATIONS
  ################################
  traefik:
    enable: true
    exposure: private
    port: 22624
    backend_mode: host
    backend_host_inventory: "{{ services_storage_host }}"
  ################################
  # RUNTIME/LIFECYCLE
  ################################
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: standard
    hosts: "{{ services_storage_host }}"
