---

imagemaid:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: docker
  tags: [plex, imagemaid]
  name: imagemaid
  stack: imagemaid
  ################################
  # IMAGE/PROCESS
  ################################
  image: kometateam/imagemaid:v1.2.0
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[services_plex_host].container_host_puid }}"
    PGID: "{{ hostvars[services_plex_host].container_host_pgid }}"
    UMASK: "022"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: plex_token
        path: "/Plex"
        name: TOKEN
  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    overlay:
      external: true
  ################################
  # FILESYSTEM
  ################################
  paths:
    - path: "{{ hostvars[services_plex_host].container_host_appdata_root }}/imagemaid"
      state: directory
      mode: "0755"
  templates:
    - src: configs/imagemaid.j2
      no_log: true
      dest: "{{ hostvars[services_plex_host].container_host_appdata_root }}/imagemaid/.env"
      mode: "0664"
      force: false
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_plex_host].container_host_appdata_root }}/imagemaid"
      target: /config
      read_only: false
    media:
      type: bind
      source: "{{ hostvars[services_plex_host].container_host_appdata_root }}/plex/Library/Application Support/Plex Media Server"
      target: /plex
      read_only: false
  ################################
  # RUNTIME/LIFECYCLE
  ################################
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: standard
    host: "{{ services_plex_host }}"
    constraints:
      - node.labels.docker_services_host == docker_services_plex_host
