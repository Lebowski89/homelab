---

nzbhydra2:
  enabled: true
  tags: [usenet, nzbhydra2]
  name: nzbhydra2
  stack: nzbhydra2
  image: ghcr.io/hotio/nzbhydra2:release-v8.8.4
  named_networks:
    overlay:
      external: true
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[docker_services_unraid_host].docker_host_puid }}"
    PGID: "{{ hostvars[docker_services_unraid_host].docker_host_pgid }}"
    UMASK: "022"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: nzbhydra2_user
        path: "/NZBHydra2"
        name: USER
      - var: nzbhydra2_pass
        path: "/NZBHydra2"
        name: PASS
      - var: nzbhydra2_api
        path: "/NZBHydra2"
        name: API
      - var: althub_user
        path: "/NZBHydra2"
        name: ALTHUB_USER
      - var: althub_api
        path: "/NZBHydra2"
        name: ALTHUB_API
      - var: althub_vip_expiration
        path: "/NZBHydra2"
        name: ALTHUB_VIP_EXPIRY
      - var: geek_user
        path: "/NZBHydra2"
        name: GEEK_USER
      - var: geek_api
        path: "/NZBHydra2"
        name: GEEK_API
      - var: geek_vip_expiration
        path: "/NZBHydra2"
        name: GEEK_VIP_EXPIRY
      - var: slug_user
        path: "/NZBHydra2"
        name: SLUG_USER
      - var: slug_api
        path: "/NZBHydra2"
        name: SLUG_API
      - var: slug_vip_expiration
        path: "/NZBHydra2"
        name: SLUG_VIP_EXPIRY
      - var: sabnzbd_api
        path: "/SABnzbd"
        name: API
  paths:
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/nzbhydra2"
      state: directory
      mode: "0755"
  volumes:
    config:
      type: bind
      source: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/nzbhydra2"
      target: /config
      read_only: false
  traefik:
    enable: true
    exposure: private
    port: 5076
  prep:
  ## used in tasks/sub_tasks/prep/nzbhydra2.yml
    sabnzbd:
      url: "http://sabnzbd:8080"
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: standard
    host: "{{ docker_services_unraid_host }}"
    constraints:
      - node.labels.docker_services_host == docker_services_unraid_host
