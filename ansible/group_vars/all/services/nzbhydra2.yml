---

nzbhydra2:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: docker
  tags: [usenet, nzbhydra2]
  name: nzbhydra2
  stack: nzbhydra2
  ################################
  # IMAGE/PROCESS
  ################################
  image: ghcr.io/hotio/nzbhydra2:release-v8.9.0
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[services_storage_host].container_host_puid }}"
    PGID: "{{ hostvars[services_storage_host].container_host_pgid }}"
    UMASK: "022"
  infisical:
    secrets_map:
      - var: nzbhydra2_user
        path: "/NZBHydra2"
        name: USER
      - var: nzbhydra2_pass
        path: "/NZBHydra2"
        name: PASS
      - var: nzbhydra2_api
        path: "/NZBHydra2"
        name: API
      - var: althub_user
        path: "/NZBHydra2"
        name: ALTHUB_USER
      - var: althub_api
        path: "/NZBHydra2"
        name: ALTHUB_API
      - var: althub_vip_expiration
        path: "/NZBHydra2"
        name: ALTHUB_VIP_EXPIRY
      - var: geek_user
        path: "/NZBHydra2"
        name: GEEK_USER
      - var: geek_api
        path: "/NZBHydra2"
        name: GEEK_API
      - var: geek_vip_expiration
        path: "/NZBHydra2"
        name: GEEK_VIP_EXPIRY
      - var: slug_user
        path: "/NZBHydra2"
        name: SLUG_USER
      - var: slug_api
        path: "/NZBHydra2"
        name: SLUG_API
      - var: slug_vip_expiration
        path: "/NZBHydra2"
        name: SLUG_VIP_EXPIRY
      - var: sabnzbd_api
        path: "/SABnzbd"
        name: API
  application_prepare:
    handler: nzbhydra2
  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    overlay:
      external: true
  ################################
  # FILESYSTEM
  ################################
  paths:
    - path: "{{ hostvars[services_storage_host].container_host_appdata_root }}/nzbhydra2"
      state: directory
      mode: "0755"
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_storage_host].container_host_appdata_root }}/nzbhydra2"
      target: /config
      read_only: false
  ################################
  # INTEGRATIONS
  ################################
  traefik:
    enable: true
    exposure: private
    port: 5076
  ################################
  # RUNTIME/LIFECYCLE
  ################################
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: standard
    host: "{{ services_storage_host }}"
    constraints:
      - node.labels.docker_services_host == docker_services_unraid_host
