---

loki:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: podman
  tags:
    - monitoring
    - loki
  name: loki
  ################################
  # IMAGE/PROCESS
  ################################
  image: "docker.io/grafana/loki:3.7.8@sha256:1107dd5274e0ada47e42472b7a7e71f3b2a2fe878878108f3e2f9e51528f0193"
  user: >-
    {{ hostvars[services_controller_host].container_host_puid }}:{{ hostvars[services_controller_host].container_host_pgid }}
  command:
    - "-config.file=/etc/loki/loki-config.yaml"
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    TZ: "{{ timezone }}"
  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    loki:
      driver: bridge
      external: false
  ports:
    receiver:
      host_ip: "{{ local_ip }}"
      published: 3100
      target: 3100
      protocol: tcp
  ################################
  # FILESYSTEM
  ################################
    backend:
      host_ip: "{{ local_ip }}"
      published: 3100
      target: 3100
      protocol: tcp
  paths:
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/loki"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/loki/data"
      state: directory
      mode: "0755"
  templates:
    - src: configs/loki-config.yaml.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/loki/loki-config.yaml"
      mode: "0644"
      force: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/loki"
      target: /etc/loki
      read_only: true
    data:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/loki/data"
      target: /loki
      read_only: false
  ################################
  # INTEGRATIONS
  ################################
  no_new_privileges: false
  traefik:
    enable: true
    exposure: private
    port: 3100
  ################################
  # RUNTIME/LIFECYCLE
  ################################
    backend_mode: host
    backend_host_inventory: "{{ services_controller_host }}"
  operational_requirements:
    acl: [mgt_receivers, mgt_backends]
    ownership_transition: true

  deploy:
    type: container
    host: "{{ services_controller_host }}"
    execution:
      mode: rootless
      host_user: podman-loki
      userns:
        mode: keep-id
        uid: "{{ hostvars[services_controller_host].container_host_puid }}"
        gid: "{{ hostvars[services_controller_host].container_host_pgid }}"
  systemd:
    restart: always
    restart_sec: 15s
    timeout_start_sec: 300s
    after:
      - network-online.target
