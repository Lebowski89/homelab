---

loki:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: docker
  tags: [monitoring, loki]
  name: loki
  stack: loki
  ################################
  # IMAGE/PROCESS
  ################################
  image: grafana/loki:3.7.7
  user: >-
    {{ hostvars[services_controller_host].container_host_puid }}:{{ hostvars[services_controller_host].container_host_pgid }}
  command:
    - "-config.file=/etc/loki/loki-config.yaml"
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    TZ: "{{ timezone }}"
  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    overlay:
      external: true
  ################################
  # FILESYSTEM
  ################################
  paths:
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/loki"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/loki/data"
      state: directory
      mode: "0755"
  templates:
    - src: configs/loki-config.yaml.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/loki/loki-config.yaml"
      mode: "0644"
      force: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/loki"
      target: /etc/loki
      read_only: true
    data:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/loki/data"
      target: /loki
      read_only: false
  ################################
  # RUNTIME/LIFECYCLE
  ################################
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: careful
    host: "{{ services_controller_host }}"
    constraints:
      - node.labels.docker_services_host == docker_services_primary_manager
