---

plex:
  name: plex
  stack: plex
  image: lscr.io/linuxserver/plex:1.43.1
  named_networks:
    overlay:
      external: true
  devices:
    - /dev/dri:/dev/dri
  environment:
    PUID: "{{ hostvars[docker_services_plex_host].docker_host_puid | string }}"
    PGID: "{{ hostvars[docker_services_plex_host].docker_host_pgid | string }}"
    TZ: "{{ timezone }}"
    VERSION: "docker"
    PLEX_CLAIM: "{{ plex_claim_code | default(omit) }}"
    ADVERTISE_IP: "http://192.168.80.59:32400/"
    TP_SCHEME: "http"
    DOCKER_MODS: "ghcr.io/themepark-dev/theme.park:plex"
    TP_DOMAIN: "{{ hostvars[docker_services_primary_manager].local_ip }}:8089"
    TP_THEME: "hotline"
  ports:
    web:
      published: 32400
      target: 32400
      mode: host
    dlna_udp:
      published: 1900
      target: 1900
      protocol: udp
      mode: host
    dlna_tcp:
      published: 32469
      target: 32469
      mode: host
    avahi:
      published: 5353
      target: 5353
      protocol: udp
      mode: host
    roku:
      published: 8324
      target: 8324
      mode: host
    gdm_10:
      published: 32410
      target: 32410
      protocol: udp
      mode: host
    gdm_12:
      published: 32412
      target: 32412
      protocol: udp
      mode: host
    gdm_13:
      published: 32413
      target: 32413
      protocol: udp
      mode: host
    gdm_14:
      published: 32414
      target: 32414
      protocol: udp
      mode: host
  paths:
    - path: "{{ hostvars[docker_services_plex_host].docker_host_appdata_root }}/plex"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_plex_host].docker_host_appdata_root }}/plex/Library"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_plex_host].docker_host_appdata_root }}/plex/Library/Application Support"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_plex_host].docker_host_appdata_root }}/plex/Library/Application Support/Plex Media Server"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_plex_host].docker_host_appdata_root }}/plex/Library/Application Support/Plex Media Server/Plug-ins"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_plex_host].docker_host_appdata_root }}/plex/Library/Logs"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_plex_host].docker_host_appdata_root }}/plex/Library/Logs/Plex Media Server"
      state: directory
      mode: "0755"
  named_volumes:
    media_nfs:
      external: true
      # optional extras later:
      # name: "media_nfs"
      # driver: "local"
      # driver_opts: { ... }
  volumes:
    config:
      type: bind
      source: "{{ hostvars[docker_services_plex_host].docker_host_appdata_root }}/plex"
      target: /config
      read_only: false
    transcode:
      type: bind
      source: /dev/shm
      target: /transcode
      read_only: false
    media:
      type: volume
      source: media_nfs
      target: /data/media
      read_only: false
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: "{{ docker_services_plex_host }}"
    constraints:
      - node.labels.docker_services_host == docker_services_plex_host
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
