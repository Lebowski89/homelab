---

netbox:
  stack: netbox
  named_networks:
    overlay:
      external: true
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: "{{ docker_services_primary_manager }}"
    constraints:
      - node.labels.docker_services_host == docker_services_primary_manager
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
  targets:
    main:
      name: netbox
      image: netboxcommunity/netbox:v4.5-4.0.2
      user: "netbox:root"
      healthcheck:
        test:
          - "CMD-SHELL"
          - "curl -f http://localhost:8080/login/ || exit 1"
        interval: 30s
        timeout: 5s
        retries: 5
        start_period: 180s
      environment:
        TZ: "{{ timezone }}"
        TIME_ZONE: "{{ timezone }}"
        SKIP_SUPERUSER: "false"
      env_file:
        - "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/netbox/.env"
      infisical:
        fail_on_empty: true
        secrets_map:
          - var: postgres_user
            path: "/Postgres"
            name: USER
          - var: postgres_pass
            path: "/Postgres"
            name: PASS
            docker_secret: netbox_db_password_secret
          - var: cloudflare_zone
            path: "/Cloudflare"
            name: ZONE
          - var: netbox_secret_key
            path: "/NetBox"
            name: SECRET_KEY
            docker_secret: netbox_secret_key_secret
          - var: netbox_api_token_pepper_1
            path: "/NetBox"
            name: API_TOKEN_PEPPER_1
            docker_secret: netbox_api_token_pepper_1_secret
          - var: netbox_redis_pass
            path: "/NetBox"
            name: REDIS_PASS
            docker_secret: netbox_redis_password_secret
          - var: netbox_redis_cache_pass
            path: "/NetBox"
            name: REDIS_CACHE_PASS
            docker_secret: netbox_redis_cache_password_secret
          - var: netbox_superuser_password
            path: "/NetBox"
            name: SUPERUSER_PASSWORD
            docker_secret: netbox_superuser_password_secret
          - var: netbox_superuser_api_token
            path: "/NetBox"
            name: SUPERUSER_API_TOKEN
            docker_secret: netbox_superuser_api_token_secret
      secrets:
        - source: netbox_db_password_secret
          target: db_password
        - source: netbox_secret_key_secret
          target: secret_key
        - source: netbox_api_token_pepper_1_secret
          target: api_token_pepper_1
        - source: netbox_redis_password_secret
          target: redis_password
        - source: netbox_redis_cache_password_secret
          target: redis_cache_password
        - source: netbox_superuser_password_secret
          target: superuser_password
        - source: netbox_superuser_api_token_secret
          target: superuser_api_token
      paths:
        - path: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/netbox/media"
          state: directory
          mode: "0755"
        - path: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/netbox/reports"
          state: directory
          mode: "0755"
        - path: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/netbox/scripts"
          state: directory
          mode: "0755"
      templates:
        - src: configs/netbox.env.j2
          dest: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/netbox/.env"
          mode: "0664"
          force: true
      volumes:
        media:
          type: bind
          source: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/netbox/media"
          target: /opt/netbox/netbox/media
          read_only: false
        reports:
          type: bind
          source: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/netbox/reports"
          target: /opt/netbox/netbox/reports
          read_only: false
        scripts:
          type: bind
          source: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/netbox/scripts"
          target: /opt/netbox/netbox/scripts
          read_only: false
      postgres:
        enable: true
        databases:
          - netbox
      traefik:
        enable: true
        exposure: private
        port: 8080
        headers_middleware: "netbox-headers@file"
    worker:
      name: netbox-worker
      image: netboxcommunity/netbox:v4.5-4.0.2
      user: "netbox:root"
      healthcheck:
        test:
          - "CMD-SHELL"
          - "ps aux | grep -v grep | grep -q rqworker || exit 1"
        interval: 30s
        timeout: 5s
        retries: 5
        start_period: 90s
      command:
        - /opt/netbox/venv/bin/python
        - /opt/netbox/netbox/manage.py
        - rqworker
      environment:
        TZ: "{{ timezone }}"
        TIME_ZONE: "{{ timezone }}"
        SKIP_SUPERUSER: "true"
      env_file:
        - "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/netbox/.env"
      infisical:
        fail_on_empty: true
        secrets_map:
          - var: postgres_pass
            path: "/Postgres"
            name: PASS
            docker_secret: netbox_db_password_secret
          - var: cloudflare_zone
            path: "/Cloudflare"
            name: ZONE
          - var: netbox_secret_key
            path: "/NetBox"
            name: SECRET_KEY
            docker_secret: netbox_secret_key_secret
          - var: netbox_api_token_pepper_1
            path: "/NetBox"
            name: API_TOKEN_PEPPER_1
            docker_secret: netbox_api_token_pepper_1_secret
          - var: netbox_redis_pass
            path: "/NetBox"
            name: REDIS_PASS
            docker_secret: netbox_redis_password_secret
          - var: netbox_redis_cache_pass
            path: "/NetBox"
            name: REDIS_CACHE_PASS
            docker_secret: netbox_redis_cache_password_secret
      secrets:
        - source: netbox_db_password_secret
          target: db_password
        - source: netbox_secret_key_secret
          target: secret_key
        - source: netbox_api_token_pepper_1_secret
          target: api_token_pepper_1
        - source: netbox_redis_password_secret
          target: redis_password
        - source: netbox_redis_cache_password_secret
          target: redis_cache_password
      volumes:
        media:
          type: bind
          source: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/netbox/media"
          target: /opt/netbox/netbox/media
          read_only: false
        reports:
          type: bind
          source: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/netbox/reports"
          target: /opt/netbox/netbox/reports
          read_only: false
        scripts:
          type: bind
          source: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/netbox/scripts"
          target: /opt/netbox/netbox/scripts
          read_only: false
    redis:
      name: netbox-redis
      image: valkey/valkey:9.1-alpine
      healthcheck:
        test:
          - "CMD-SHELL"
          - 'valkey-cli --pass "$$(cat /run/secrets/netbox_redis_password_secret)" ping | grep -q PONG'
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s
      command:
        - sh -c 'valkey-server --appendonly yes --requirepass "$$(cat /run/secrets/netbox_redis_password_secret)"'
      environment:
        TZ: "{{ timezone }}"
        PUID: "{{ hostvars[docker_services_primary_manager].docker_host_puid }}"
        PGID: "{{ hostvars[docker_services_primary_manager].docker_host_pgid }}"
      infisical:
        fail_on_empty: true
        secrets_map:
          - var: netbox_redis_pass
            path: "/NetBox"
            name: REDIS_PASS
            docker_secret: netbox_redis_password_secret
      secrets:
        - netbox_redis_password_secret
      paths:
        - path: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/netbox/redis"
          state: directory
          mode: "0755"
      volumes:
        data:
          type: bind
          source: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/netbox/redis"
          target: /data
          read_only: false
    redis_cache:
      name: netbox-redis-cache
      image: valkey/valkey:9.1-alpine
      healthcheck:
        test:
          - "CMD-SHELL"
          - 'valkey-cli --pass "$$(cat /run/secrets/netbox_redis_cache_password_secret)" ping | grep -q PONG'
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s
      command:
        - sh -c 'valkey-server --requirepass "$$(cat /run/secrets/netbox_redis_cache_password_secret)"'
      environment:
        TZ: "{{ timezone }}"
        PUID: "{{ hostvars[docker_services_primary_manager].docker_host_puid }}"
        PGID: "{{ hostvars[docker_services_primary_manager].docker_host_pgid }}"
      infisical:
        fail_on_empty: true
        secrets_map:
          - var: netbox_redis_cache_pass
            path: "/NetBox"
            name: REDIS_CACHE_PASS
            docker_secret: netbox_redis_cache_password_secret
      secrets:
        - netbox_redis_cache_password_secret
      paths:
        - path: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/netbox/redis-cache"
          state: directory
          mode: "0755"
      volumes:
        data:
          type: bind
          source: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/netbox/redis-cache"
          target: /data
          read_only: false
