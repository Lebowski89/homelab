---

alertmanager:
  enabled: true
  tags: [monitoring, alertmanager]
  name: alertmanager
  stack: alertmanager
  image: prom/alertmanager:v0.33.1
  named_networks:
    overlay:
      external: true
  command:
    - "--config.file=/etc/alertmanager/alertmanager.yml"
    - "--storage.path=/alertmanager"
  user: >-
    {{ hostvars[docker_services_primary_manager].docker_host_puid }}:{{ hostvars[docker_services_primary_manager].docker_host_pgid }}
  environment:
    TZ: "{{ timezone }}"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: smtp_email
        path: "/Porkbun"
        name: SMTP_EMAIL
      - var: smtp_host
        path: "/Porkbun"
        name: SMTP_HOST
      - var: smtp_password
        path: "/Porkbun"
        name: SMTP_PASS
        docker_secret: alertmanager_smtp_password_secret
      - var: smtp_port
        path: "/Porkbun"
        name: SMTP_PORT
      - var: smtp_username
        path: "/Porkbun"
        name: SMTP_USER
  secrets:
    - alertmanager_smtp_password_secret
  paths:
    - path: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/alertmanager"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/alertmanager/data"
      state: directory
      mode: "0755"
  templates:
    - src: configs/alertmanager.yml.j2
      dest: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/alertmanager/alertmanager.yml"
      mode: "0644"
      force: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/alertmanager"
      target: /etc/alertmanager
      read_only: true
    data:
      type: bind
      source: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/alertmanager/data"
      target: /alertmanager
      read_only: false
  traefik:
    enable: true
    exposure: private
    port: 9093
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: careful
    host: "{{ docker_services_primary_manager }}"
    constraints:
      - node.labels.docker_services_host == docker_services_primary_manager
