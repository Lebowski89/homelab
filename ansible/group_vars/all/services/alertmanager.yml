---

alertmanager:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: podman
  tags:
    - monitoring
    - alertmanager
  name: alertmanager
  ################################
  # IMAGE/PROCESS
  ################################
  image: "docker.io/prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a"
  user: >-
    {{ hostvars[services_controller_host].container_host_puid }}:{{ hostvars[services_controller_host].container_host_pgid }}
  command:
    - "--config.file=/etc/alertmanager/alertmanager.yml"
    - "--storage.path=/alertmanager"
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    TZ: "{{ timezone }}"
  infisical:
    secrets_map:
      - var: smtp_email
        path: "/Porkbun"
        name: SMTP_EMAIL
      - var: smtp_host
        path: "/Porkbun"
        name: SMTP_HOST
      - var: smtp_password
        path: "/Porkbun"
        name: SMTP_PASS
        secret:
          name: alertmanager_smtp_password_secret
      - var: smtp_port
        path: "/Porkbun"
        name: SMTP_PORT
      - var: smtp_username
        path: "/Porkbun"
        name: SMTP_USER
      - var: gotify_alertmanager_token
        path: "/Gotify"
        name: ALERTMANAGER_TOKEN
        secret:
          name: alertmanager_gotify_token_secret
  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    alertmanager:
      driver: bridge
      external: false
  ports:
    backend:
      host_ip: "{{ local_ip }}"
      published: 19093
      target: 9093
      protocol: tcp
  ################################
  # FILESYSTEM
  ################################
  paths:
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/alertmanager"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/alertmanager/data"
      state: directory
      mode: "0755"
  templates:
    - src: configs/alertmanager.yml.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/alertmanager/alertmanager.yml"
      mode: "0600"
      force: true
      no_log: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/alertmanager"
      target: /etc/alertmanager
      read_only: true
    data:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/alertmanager/data"
      target: /alertmanager
      read_only: false
  ################################
  # INTEGRATIONS
  ################################
  no_new_privileges: false
  traefik:
    enable: true
    exposure: private
    port: 19093
    backend_mode: host
    backend_host_inventory: "{{ services_controller_host }}"
  ################################
  # RUNTIME/LIFECYCLE
  ################################
  operational_requirements:
    acl: [mgt_backends]
    ownership_transition: true

  deploy:
    type: container
    host: "{{ services_controller_host }}"
    execution:
      mode: rootless
      host_user: podman-alertmanager
      userns:
        mode: keep-id
        uid: "{{ hostvars[services_controller_host].container_host_puid }}"
        gid: "{{ hostvars[services_controller_host].container_host_pgid }}"
  systemd:
    restart: always
    restart_sec: 15s
    timeout_start_sec: 300s
    after:
      - network-online.target
