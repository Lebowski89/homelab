---

gitea:
  enabled: true
  tags: [utilities, pgsql, gitea]
  name: gitea
  stack: gitea
  image: gitea/gitea:1.26.4
  named_networks:
    overlay:
      external: true
  environment:
    TZ: "{{ timezone }}"
    USER_UID: "{{ hostvars[docker_services_primary_manager].docker_host_puid }}"
    USER_GID: "{{ hostvars[docker_services_primary_manager].docker_host_pgid }}"
    UMASK: "022"
  env_file:
    - "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/gitea/.env"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: postgres_user
        path: "/Postgres"
        name: USER
      - var: postgres_pass
        path: "/Postgres"
        name: PASS
  paths:
    - path: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/gitea"
      state: directory
      mode: "0755"
  templates:
    - src: configs/gitea.env.j2
      dest: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/gitea/.env"
      mode: "0664"
      force: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/gitea"
      target: /data
      read_only: false
  postgres:
    enable: true
    databases:
      - gitea
  traefik:
    enable: true
    exposure: private
    port: 3000
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: careful
    host: "{{ docker_services_primary_manager }}"
    constraints:
      - node.labels.docker_services_host == docker_services_primary_manager
