---

seerr:
  enabled: true
  tags: [apps, media, pgsql, seerr]
  name: seerr
  stack: seerr
  image: ghcr.io/hotio/seerr:release-v3.2.0
  named_networks:
    overlay:
      external: true
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[docker_services_primary_manager].docker_host_puid }}"
    PGID: "{{ hostvars[docker_services_primary_manager].docker_host_pgid }}"
    UMASK: "022"
  env_file:
    - "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/seerr/.env"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: postgres_user
        path: "/Postgres"
        name: USER
      - var: postgres_pass
        path: "/Postgres"
        name: PASS
  paths:
    - path: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/seerr"
      state: directory
      mode: "0755"
  templates:
    - src: configs/seerr.env.j2
      dest: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/seerr/.env"
      mode: "0664"
      force: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/seerr"
      target: /app/config
      read_only: false
  postgres:
    enable: true
    databases:
      - seerr
  traefik:
    enable: true
    exposure: private
    port: 5055
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: "{{ docker_services_primary_manager }}"
    constraints:
      - node.labels.docker_services_host == docker_services_primary_manager
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
