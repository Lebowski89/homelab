---

seerr:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: podman
  tags:
    - media
    - pgsql
    - seerr
  name: seerr
  ################################
  # IMAGE/PROCESS
  ################################
  image: ghcr.io/hotio/seerr:release-v3.5.1@sha256:536d85ec1b4e3bb1fb00259d9a3e91f29779a5c5b9cd905f1c21c6583362f4f0
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  user: "0:0"
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[services_controller_host].container_host_puid }}"
    PGID: "{{ hostvars[services_controller_host].container_host_pgid }}"
    UMASK: "022"
  env_file:
    - "{{ hostvars[services_controller_host].container_host_appdata_root }}/seerr/.env"
  infisical:
    secrets_map:
      - var: postgres_user
        path: "/Postgres"
        name: USER
      - var: postgres_pass
        path: "/Postgres"
        name: PASS
  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    seerr:
      driver: bridge
      external: false
  ports:
    backend:
      host_ip: "{{ local_ip }}"
      published: 15055
      target: 5055
      protocol: tcp
  ################################
  # FILESYSTEM
  ################################
  paths:
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/seerr"
      state: directory
      mode: "0755"
  templates:
    - src: configs/seerr.env.j2
      no_log: true
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/seerr/.env"
      mode: "0600"
      force: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/seerr"
      target: /app/config
      read_only: false
  ################################
  # INTEGRATIONS
  ################################
  no_new_privileges: false
  traefik:
    enable: true
    exposure: private
    port: 15055
    backend_mode: host
    backend_host_inventory: "{{ services_controller_host }}"
  postgres:
    enable: true
    databases:
      - seerr
  ################################
  # RUNTIME/LIFECYCLE
  ################################
  operational_requirements:
    acl: [mgt_backends]
    ownership_transition: true

  deploy:
    type: container
    hosts: "{{ services_controller_host }}"
    execution:
      mode: rootless
      host_user: podman-seerr
      userns:
        mode: keep-id
        uid: "{{ hostvars[services_controller_host].container_host_puid }}"
        gid: "{{ hostvars[services_controller_host].container_host_pgid }}"
  systemd:
    restart: always
    restart_sec: 15s
    timeout_start_sec: 300s
    after:
      - network-online.target
