---

seerr:
  enabled: true
  runtime: docker
  tags: [media, pgsql, seerr]
  name: seerr
  stack: seerr

  image: ghcr.io/hotio/seerr:release-v3.3.0

  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[services_controller_host].container_host_puid }}"
    PGID: "{{ hostvars[services_controller_host].container_host_pgid }}"
    UMASK: "022"
  env_file:
    - "{{ hostvars[services_controller_host].container_host_appdata_root }}/seerr/.env"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: cloudflare_zone
        path: /Cloudflare
        name: ZONE
      - var: postgres_user
        path: "/Postgres"
        name: USER
      - var: postgres_pass
        path: "/Postgres"
        name: PASS

  named_networks:
    overlay:
      external: true

  paths:
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/seerr"
      state: directory
      mode: "0755"
  templates:
    - src: configs/seerr.env.j2
      no_log: true
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/seerr/.env"
      mode: "0664"
      force: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/seerr"
      target: /app/config
      read_only: false

  traefik:
    enable: true
    exposure: private
    port: 5055
  postgres:
    enable: true
    databases:
      - seerr

  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: standard
    host: "{{ services_controller_host }}"
    constraints:
      - node.labels.docker_services_host == services_controller_host
