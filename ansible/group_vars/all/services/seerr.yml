---

seerr:
  name: seerr
  stack: seerr
  image: ghcr.io/hotio/seerr:release-v3.2.0
  named_networks:
    overlay:
      external: true
  healthcheck:
    test:
      - "CMD"
      - "wget"
      - "--spider"
      - "-q"
      - "http://127.0.0.1:5055/api/v1/status"
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[docker_services_primary_manager].docker_host_puid }}"
    PGID: "{{ hostvars[docker_services_primary_manager].docker_host_pgid }}"
    UMASK: "022"
    PORT: "5055"
    DB_TYPE: "postgres"
    DB_HOST: "haproxy"
    DB_PORT: "5433"
    DB_USER: "{{ postgres_user | default('__INFISICAL__:postgres_user', true) }}"
    DB_PASS: "{{ postgres_pass | default('__INFISICAL__:postgres_pass', true) }}"
    DB_NAME: "seerr"
    DB_LOG_QUERIES: "false"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: postgres_user
        path: "/Postgres"
        name: USER
      - var: postgres_pass
        path: "/Postgres"
        name: PASS
      - var: seerr_api
        path: "/Seerr"
        name: API
      - var: seerr_client_id
        path: "/Seerr"
        name: CLIENT_ID
      - var: seerr_vapid_private
        path: "/Seerr"
        name: VAPID_PRIVATE
      - var: seerr_vapid_public
        path: "/Seerr"
        name: VAPID_PUBLIC
      - var: seerr_notifiarr_webhook
        path: "/Seerr"
        name: NOTIFIARR_WEBHOOK
      - var: seerr_notifiarr_payload
        path: "/Seerr"
        name: WEBHOOK_PAYLOAD
      - var: tautulli_api
        path: "/Tautulli"
        name: API
      - var: radarr_api
        path: "/Radarr"
        name: API
      - var: radarr_4k_api
        path: "/Radarr-4K"
        name: API
      - var: sonarr_api
        path: "/Sonarr"
        name: API
      - var: sonarr_4k_api
        path: "/Sonarr-4K"
        name: API
      - var: smtp_email
        path: "/Porkbun"
        name: SMTP_EMAIL
      - var: smtp_host
        path: "/Porkbun"
        name: SMTP_HOST
      - var: smtp_password
        path: "/Porkbun"
        name: SMTP_PASS
      - var: smtp_port
        path: "/Porkbun"
        name: SMTP_PORT
      - var: smtp_sender
        path: "/Porkbun"
        name: SMTP_SENDER
      - var: smtp_username
        path: "/Porkbun"
        name: SMTP_USER
  paths:
    - path: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/seerr"
      state: directory
      mode: "0755"
  templates:
    - src: configs/seerr.json.j2
      dest: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/seerr/settings.json"
      mode: "0664"
      force: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/seerr"
      target: /app/config
      read_only: false
  postgres:
    enable: true
    databases:
      - seerr
  traefik:
    enable: true
    port: 5055
    sso: authelia
  cloudflare:
    enable: true
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: "{{ docker_services_primary_manager }}"
    constraints:
      - node.labels.docker_services_host == docker_services_primary_manager
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
