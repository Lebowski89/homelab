---

grafana:
  enabled: true
  tags: [monitoring, grafana]
  name: grafana
  stack: grafana
  image: grafana/grafana:13.0.3-ubuntu
  named_networks:
    overlay:
      external: true
  user: "0"
  environment:
    TZ: "{{ timezone }}"
    GF_SECURITY_ADMIN_USER__FILE: /run/secrets/grafana_admin_user_secret
    GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_pass_secret
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: grafana_user
        path: "/Grafana"
        name: USER
      - var: grafana_pass
        path: "/Grafana"
        name: PASS
  secrets:
    - grafana_admin_user_secret
    - grafana_admin_pass_secret
  paths:
    - path: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/grafana"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/grafana/provisioning/datasources"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/grafana/provisioning/dashboards"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/grafana/dashboards"
      state: directory
      mode: "0755"
  templates:
    - src: configs/grafana/provisioning/datasources/prometheus.yml.j2
      dest: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/grafana/provisioning/datasources/prometheus.yml"
      mode: "0644"
      force: true
    - src: configs/grafana/provisioning/dashboards/dashboards.yml.j2
      dest: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/grafana/provisioning/dashboards/dashboards.yml"
      mode: "0644"
      force: true
    - src: configs/grafana/dashboards/authelia-community-dashboard.json.j2
      dest: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/grafana/dashboards/authelia-community-dashboard.json"
      mode: "0644"
      force: true
    - src: configs/grafana/dashboards/haproxy-postgres-overview.json.j2
      dest: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/grafana/dashboards/haproxy-postgres-overview.json"
      mode: "0644"
      force: true
    - src: configs/grafana/dashboards/traefik-official-standalone-dashboard.json.j2
      dest: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/grafana/dashboards/traefik-official-standalone-dashboard.json"
      mode: "0644"
      force: true
  volumes:
    data:
      type: bind
      source: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/grafana"
      target: /var/lib/grafana
      read_only: false
    provisioning:
      type: bind
      source: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/grafana/provisioning"
      target: /etc/grafana/provisioning
      read_only: true
    dashboards:
      type: bind
      source: "{{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/grafana/dashboards"
      target: /var/lib/grafana/dashboards
      read_only: true
  traefik:
    enable: true
    exposure: private
    port: 3000
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: careful
    host: "{{ docker_services_primary_manager }}"
    constraints:
      - node.labels.docker_services_host == docker_services_primary_manager
