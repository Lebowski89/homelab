---

n8n:
  enabled: true
  runtime: podman
  tags: [automation, pgsql, n8n]
  description: Isolated n8n automation VM service managed by system Podman Quadlets.

  container:
    host: n8n
    name: n8n
    description: n8n workflow automation on dedicated VM
    image: docker.io/n8nio/n8n:2.31.4
    uid: "1000"
    gid: "1000"
    ports:
      - host_ip: "{{ local_ip }}"
        host: 5678
        container: 5678
        protocol: tcp
    mounts:
      - source: /opt/n8n
        target: /home/node/.n8n
        read_only: false
    cap_drop: [all]
    no_new_privileges: true
    healthcheck:
      command: >-
        node -e "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    systemd:
      after: [network-online.target]
      restart: on-failure
      restart_sec: 15s

  network:
    name: n8n
    driver: bridge
    delete_on_stop: true

  host_paths:
    - path: /opt/n8n
      owner: "1000"
      group: "1000"
      mode: "0750"

  env:
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: "{{ hostvars[docker_services_primary_manager].local_ip }}"
    DB_POSTGRESDB_PORT: "5432"
    DB_POSTGRESDB_DATABASE: n8n
    DB_POSTGRESDB_USER_FILE: /run/secrets/postgres_user_secret
    DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/postgres_pass_secret
    N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key_secret
    TZ: Australia/Melbourne
    GENERIC_TIMEZONE: Australia/Melbourne
    N8N_HOST: "n8n.{{ internal_zone }}"
    N8N_PROTOCOL: https
    N8N_PORT: "5678"
    N8N_EDITOR_BASE_URL: "https://n8n.{{ internal_zone }}:8443/"
    WEBHOOK_URL: "https://n8n.{{ internal_zone }}:8443/"
    N8N_PROXY_HOPS: "1"
    N8N_SECURE_COOKIE: "true"
    N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_PERSONALIZATION_ENABLED: "false"
    N8N_METRICS: "true"
    EXECUTIONS_DATA_PRUNE: "true"
    EXECUTIONS_DATA_MAX_AGE: "336"
    NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.readWriteFile"]'

  secrets:
    - name: postgres_user_secret
      infisical_path: /Postgres
      infisical_key: USER
      target: /run/secrets/postgres_user_secret
      uid: "1000"
      gid: "1000"
      mode: "0400"
      immutable: true
      replace: false
    - name: postgres_pass_secret
      infisical_path: /Postgres
      infisical_key: PASS
      target: /run/secrets/postgres_pass_secret
      uid: "1000"
      gid: "1000"
      mode: "0400"
      immutable: false
      replace: true
    - name: n8n_encryption_key_secret
      infisical_path: /N8N
      infisical_key: ENCRYPTION_KEY
      target: /run/secrets/n8n_encryption_key_secret
      uid: "1000"
      gid: "1000"
      mode: "0400"
      immutable: true
      replace: false

  postgres:
    enable: true
    databases:
      - n8n

  traefik:
    enable: true
    exposure: private
    port: 5678
    backend_mode: host
    backend_host_inventory: n8n
