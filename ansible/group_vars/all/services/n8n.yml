---

n8n:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: podman
  tags: [automation, pgsql, n8n]
  ################################
  # IMAGE/PROCESS
  ################################
  image: docker.io/n8nio/n8n:2.35.3
  user: "1000:1000"
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: "{{ hostvars[services_controller_host].local_ip }}"
    DB_POSTGRESDB_PORT: "5432"
    DB_POSTGRESDB_DATABASE: n8n
    DB_POSTGRESDB_USER_FILE: /run/secrets/postgres_user_secret
    DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/postgres_pass_secret
    N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key_secret
    TZ: Australia/Melbourne
    GENERIC_TIMEZONE: Australia/Melbourne
    N8N_HOST:
      value_template: "n8n.int.${cloudflare_zone}"
    N8N_PROTOCOL: https
    N8N_PORT: "5678"
    N8N_EDITOR_BASE_URL:
      value_template: "https://n8n.int.${cloudflare_zone}:8443/"
    WEBHOOK_URL:
      value_template: "https://n8n.int.${cloudflare_zone}:8443/"
    N8N_PROXY_HOPS: "1"
    N8N_SECURE_COOKIE: "true"
    N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_PERSONALIZATION_ENABLED: "false"
    N8N_METRICS: "true"
    EXECUTIONS_DATA_PRUNE: "true"
    EXECUTIONS_DATA_MAX_AGE: "336"
    NODES_EXCLUDE: '["n8n-nodes-base.executeCommand","n8n-nodes-base.readWriteFile"]'
  infisical:
    secrets_map:
      - var: cloudflare_zone
        path: /Cloudflare
        name: ZONE
        check_mode_value: check-mode.invalid
      - var: postgres_user
        path: /Postgres
        name: USER
        secret:
          name: postgres_user_secret
          target: /run/secrets/postgres_user_secret
          uid: "1000"
          gid: "1000"
          mode: "0400"
      - var: postgres_pass
        path: /Postgres
        name: PASS
        secret:
          name: postgres_pass_secret
          target: /run/secrets/postgres_pass_secret
          uid: "1000"
          gid: "1000"
          mode: "0400"
          update_policy: reconcile
      - var: n8n_encryption_key
        path: /N8N
        name: ENCRYPTION_KEY
        secret:
          name: n8n_encryption_key_secret
          target: /run/secrets/n8n_encryption_key_secret
          uid: "1000"
          gid: "1000"
          mode: "0400"
  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    n8n:
      driver: bridge
      external: false
  ports:
    - host_ip: "{{ local_ip }}"
      published: 5678
      target: 5678
      protocol: tcp
  ################################
  # FILESYSTEM
  ################################
  paths:
    - path: /opt/n8n
      owner: "1000"
      group: "1000"
      mode: "0750"
  volumes:
    data:
      type: bind
      source: /opt/n8n
      target: /home/node/.n8n
      read_only: false
  ################################
  # DEVICES/SECURITY
  ################################
  cap_add: []
  cap_drop: [all]
  no_new_privileges: true
  ################################
  # HEALTH
  ################################
  healthcheck:
    test:
      - CMD-SHELL
      - >-
        node -e "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
    interval: 30s
    timeout: 10s
    retries: 5
    start_period: 90s
  ################################
  # INTEGRATIONS
  ################################
  traefik:
    enable: true
    exposure: private
    port: 5678
    backend_mode: host
    backend_host_inventory: n8n
  postgres:
    enable: true
    databases:
      - n8n
    port: 5432
    user_var: postgres_user
    password_var: postgres_pass
  ################################
  # RUNTIME/LIFECYCLE
  ################################
  deploy:
    type: container
    host: n8n
  systemd:
    after: [network-online.target]
    restart: on-failure
    restart_sec: 15s
