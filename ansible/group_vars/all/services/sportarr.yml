---

sportarr:
  enabled: true
  tags: [arrs, sportarr]
  name: sportarr
  stack: sportarr
  image: sportarr/sportarr:4.0.1011.1091
  named_networks:
    overlay:
      external: true
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[docker_services_unraid_host].docker_host_puid }}"
    PGID: "{{ hostvars[docker_services_unraid_host].docker_host_pgid }}"
    UMASK: "022"
  paths:
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/sportarr"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/sportarr/config"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}/media/sport"
      state: directory
      mode: "0755"
  volumes:
    config:
      type: bind
      source: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/sportarr/config"
      target: /config
      read_only: false
    media:
      type: bind
      source: "{{ hostvars[docker_services_unraid_host].docker_host_data_root }}"
      target: /data
      read_only: false
  traefik:
    enable: true
    exposure: private
    port: 1867
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: standard
    host: "{{ docker_services_unraid_host }}"
    constraints:
      - node.labels.docker_services_host == docker_services_unraid_host
