---

opencloud:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: docker
  tags: [opencloud]
  name: opencloud
  stack: opencloud
  ################################
  # IMAGE/PROCESS
  ################################
  image: opencloudeu/opencloud-rolling:7.3.0
  user: "1000:1000"
  entrypoint:
    - /bin/sh
  command:
    - -c
    - "test -f /etc/opencloud/opencloud.yaml || opencloud init; exec opencloud server"
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    TZ: "{{ timezone }}"
  env_file:
    - /opt/stacks/opencloud.env
  infisical:
    secrets_map:
      - var: opencloud_admin_pass
        path: "/OpenCloud"
        name: IDM_ADMIN_PASS
      - var: cloudflare_zone
        path: "/Cloudflare"
        name: ZONE
      - var: smtp_host
        path: "/Porkbun"
        name: SMTP_HOST
      - var: smtp_password
        path: "/Porkbun"
        name: SMTP_PASS
      - var: smtp_port
        path: "/Porkbun"
        name: SMTP_PORT
      - var: smtp_sender
        path: "/Porkbun"
        name: SMTP_SENDER
      - var: smtp_username
        path: "/Porkbun"
        name: SMTP_USER
  swarm_env_templates:
    - src: configs/opencloud/opencloud.env.j2
      no_log: true
      dest: /opt/stacks/opencloud.env
      mode: "0600"
      force: true
  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    overlay:
      external: true
  ################################
  # FILESYSTEM
  ################################
  paths:
    - path: "{{ hostvars[services_storage_host].container_host_appdata_root }}/opencloud"
      state: directory
      owner: "1000"
      group: "1000"
      mode: "0751"
    - path: "{{ hostvars[services_storage_host].container_host_appdata_root }}/opencloud/config"
      state: directory
      owner: "1000"
      group: "1000"
      mode: "0751"
    - path: "{{ hostvars[services_storage_host].container_host_appdata_root }}/opencloud/apps"
      state: directory
      owner: "1000"
      group: "1000"
      mode: "0751"
    - path: /mnt/user/opencloud/data
      state: directory
      owner: "1000"
      group: "1000"
      mode: "0751"
  templates:
    - src: configs/opencloud/csp.yaml.j2
      dest: "{{ hostvars[services_storage_host].container_host_appdata_root }}/opencloud/config/csp.yaml"
      owner: "1000"
      group: "1000"
      mode: "0664"
      force: true
    - src: configs/opencloud/banned-password-list.txt.j2
      dest: "{{ hostvars[services_storage_host].container_host_appdata_root }}/opencloud/config/banned-password-list.txt"
      owner: "1000"
      group: "1000"
      mode: "0664"
      force: true
  volumes:
    opencloud_config:
      type: bind
      source: "{{ hostvars[services_storage_host].container_host_appdata_root }}/opencloud/config"
      target: /etc/opencloud
      read_only: false
    opencloud_data:
      type: bind
      source: /mnt/user/opencloud/data
      target: /var/lib/opencloud
      read_only: false
    opencloud_apps:
      type: bind
      source: "{{ hostvars[services_storage_host].container_host_appdata_root }}/opencloud/apps"
      target: /var/lib/opencloud/web/assets/apps
      read_only: false
  ################################
  # INTEGRATIONS
  ################################
  traefik:
    enable: true
    port: 9200
  ################################
  # RUNTIME/LIFECYCLE
  ################################
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: careful
    host: "{{ services_storage_host }}"
    constraints:
      - node.labels.docker_services_host == docker_services_unraid_host
