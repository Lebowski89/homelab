---

recyclarr:
  enabled: true
  tags: [arrs, recyclarr]
  name: recyclarr
  stack: recyclarr
  image: ghcr.io/recyclarr/recyclarr:8.6.0
  named_networks:
    overlay:
      external: true
  user: >-
    {{ hostvars[docker_services_unraid_host].docker_host_puid }}:{{ hostvars[docker_services_unraid_host].docker_host_pgid }}
  environment:
    TZ: "{{ timezone }}"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: radarr_api
        path: "/Radarr"
        name: API
      - var: radarr_4k_api
        path: "/Radarr-4K"
        name: API
      - var: sonarr_api
        path: "/Sonarr"
        name: API
      - var: sonarr_4k_api
        path: "/Sonarr-4K"
        name: API
  paths:
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/recyclarr"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/recyclarr/configs"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/recyclarr/includes"
      state: directory
      mode: "0755"
  templates:
    - src: configs/recyclarr/secrets.yml.j2
      dest: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/recyclarr/secrets.yml"
      mode: "0664"
      force: true
    - src: configs/recyclarr/config_radarr.yml.j2
      dest: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/recyclarr/configs/radarr.yml"
      mode: "0664"
      force: true
    - src: configs/recyclarr/config_sonarr.yml.j2
      dest: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/recyclarr/configs/sonarr.yml"
      mode: "0664"
      force: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[docker_services_unraid_host].docker_host_appdata_root }}/recyclarr"
      target: /config
      read_only: false
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: "{{ docker_services_unraid_host }}"
    constraints:
      - node.labels.docker_services_host == docker_services_unraid_host
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
