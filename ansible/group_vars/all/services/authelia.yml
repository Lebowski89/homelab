---

authelia:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: podman
  tags:
    - proxy
    - pgsql
    - authelia
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[services_controller_host].container_host_puid }}"
    PGID: "{{ hostvars[services_controller_host].container_host_pgid }}"
    UMASK: "022"
  named_networks: {}
  ################################
  # RUNTIME/LIFECYCLE
  ################################
  deploy:
    type: container
    host: "{{ services_controller_host }}"
  ################################
  # TARGETS (INSTANCES)
  ################################
  targets:
    ################################
    # AUTHELIA-REDIS SERVICE
    ################################
    redis:
      ################################
      # IDENTITY
      ################################
      tags:
      name: authelia-redis
      ################################
      # IMAGE/PROCESS
      ################################
      image: "docker.io/valkey/valkey:9.2-alpine@sha256:cdcb7b1c7b6f1c9cb9442c71ac6275e78184657448407b2c1fdde7ee8024f4fb"
      user: "0:0"
      command:
        - sh
        - -c
        - >-
          umask 077; printf 'requirepass "%s"\n' "$(sed 's/[\\"]/\\&/g' /run/secrets/authelia_redis_secret)" > /tmp/skynet-valkey.conf;
          exec valkey-server
          /tmp/skynet-valkey.conf
      infisical:
        secrets_map:
          - var: authelia_redis_key
            path: "/Authelia"
            name: REDIS_KEY
            secret:
              name: authelia_redis_secret
  ################################
  # CONNECTIVITY
  ################################
      named_networks:
        authelia-redis:
          driver: bridge
          external: false
      ports:
        cache:
          host_ip: "{{ local_ip }}"
          published: 16379
          target: 6379
          protocol: tcp
      paths:
        - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/authelia/redis"
          state: directory
          mode: "0755"
      volumes:
        config:
          type: bind
          source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/authelia/redis"
          target: /data
          read_only: false
    ################################
    # AUTHELIA SERVICE
    ################################
      tmpfs:
        - /tmp:mode=1777
      no_new_privileges: false
      healthcheck:
        test:
          - CMD-SHELL
          - REDISCLI_AUTH="$(cat /run/secrets/authelia_redis_secret)" valkey-cli ping | grep -q PONG
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 30s
      notify_healthy: true
      operational_requirements:
        acl: [mgt_backends]
        ownership_transition: true

      deploy:
        type: container
        host: "{{ services_controller_host }}"
        execution:
          mode: rootless
          host_user: podman-authelia-redis
          userns:
            mode: keep-id
            uid: "0"
            gid: "0"
      systemd:
        after:
          - network-online.target
        restart: always
        restart_sec: 15s
        timeout_start_sec: 300s
    main:
      ################################
      # IDENTITY
      ################################
      tags:
      name: authelia
      ################################
      # IMAGE/PROCESS
      ################################
      image: "docker.io/authelia/authelia:4.39.28@sha256:bd97cff4fcbf715b5ff1f9ae286afbe6033afce385302520b0368122d43a6f54"
      ################################
      # ENVIRONMENT/SECRETS
      ################################
      user: "0:0"
      environment:
        AUTHELIA_SESSION_SECRET_FILE: /run/secrets/authelia_session_key_secret
        AUTHELIA_SESSION_REDIS_PASSWORD_FILE: /run/secrets/authelia_redis_secret
        AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/authelia_storage_key_secret
        AUTHELIA_STORAGE_POSTGRES_PASSWORD_FILE: /run/secrets/postgres_pass_secret
        AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /run/secrets/authelia_jwt_key_secret
        AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE: /run/secrets/authelia_oidc_hmac_secret
      env_file:
        - "{{ hostvars[services_controller_host].container_host_appdata_root }}/authelia/.env"
      infisical:
        secrets_map:
          - var: authelia_redis_key
            path: /Authelia
            name: REDIS_KEY
            secret:
              name: authelia_redis_secret
              uid: "{{ hostvars[services_controller_host].container_host_puid }}"
              gid: "{{ hostvars[services_controller_host].container_host_pgid }}"
          - var: postgres_user
            path: "/Postgres"
            name: USER
          - var: postgres_pass
            path: "/Postgres"
            name: PASS
            secret:
              name: postgres_pass_secret
              uid: "{{ hostvars[services_controller_host].container_host_puid }}"
              gid: "{{ hostvars[services_controller_host].container_host_pgid }}"
          - var: authelia_user
            path: "/Authelia"
            name: USER
          - var: authelia_pass
            path: "/Authelia"
            name: PASS
          - var: authelia_display_name
            path: "/Authelia"
            name: DISPLAY_NAME
          - var: authelia_storage_key
            path: "/Authelia"
            name: STORAGE_KEY
            secret:
              name: authelia_storage_key_secret
              uid: "{{ hostvars[services_controller_host].container_host_puid }}"
              gid: "{{ hostvars[services_controller_host].container_host_pgid }}"
          - var: authelia_oidc_hmac_secret
            path: "/Authelia"
            name: OIDC_HMAC_SECRET
            secret:
              name: authelia_oidc_hmac_secret
              uid: "{{ hostvars[services_controller_host].container_host_puid }}"
              gid: "{{ hostvars[services_controller_host].container_host_pgid }}"
          - var: authelia_oidc_jwks_rsa_private_key
            path: "/Authelia"
            name: OIDC_JWKS_RSA_PRIVATE_KEY
          - var: grafana_oidc_client_secret_digest
            path: "/Authelia"
            name: GRAFANA_OIDC_CLIENT_SECRET_DIGEST
          - var: smtp_email
            path: "/Porkbun"
            name: SMTP_EMAIL
          - var: smtp_host
            path: "/Porkbun"
            name: SMTP_HOST
          - var: smtp_password
            path: "/Porkbun"
            name: SMTP_PASS
          - var: smtp_port
            path: "/Porkbun"
            name: SMTP_PORT
          - var: smtp_sender
            path: "/Porkbun"
            name: SMTP_SENDER
          - var: smtp_username
            path: "/Porkbun"
            name: SMTP_USER
      secrets:
        - authelia_session_key_secret
        - authelia_jwt_key_secret
      application_prepare:
        handler: authelia
        preserve_users_database: true
      ################################
      # FILESYSTEM
      ################################
      named_networks:
        authelia:
          driver: bridge
          external: false
      ports:
        backend:
          host_ip: "{{ local_ip }}"
          published: 19091
          target: 9091
          protocol: tcp
        metrics:
          host_ip: "{{ local_ip }}"
          published: 19959
          target: 9959
          protocol: tcp
      ################################
      # FILESYSTEM
      ################################
      paths:
        - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/authelia"
          state: directory
          mode: "0755"
      templates:
        - src: configs/proxy/authelia/config.yml.j2
          dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/authelia/configuration.yml"
          mode: "0600"
          force: true
          no_log: true
        - src: configs/proxy/authelia/authelia.env.j2
          dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/authelia/.env"
          mode: "0600"
          force: true
          no_log: true
      volumes:
        config:
          type: bind
          source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/authelia"
          target: /config
          read_only: false
      ################################
      # INTEGRATIONS
      ################################
      no_new_privileges: false
      postgres:
        enable: true
        databases:
          - authelia
      operational_requirements:
        acl: [mgt_backends]
        ownership_transition: true

      deploy:
        type: container
        host: "{{ services_controller_host }}"
        execution:
          mode: rootless
          host_user: podman-authelia
          userns:
            mode: keep-id
            uid: "{{ hostvars[services_controller_host].container_host_puid }}"
            gid: "{{ hostvars[services_controller_host].container_host_pgid }}"
      systemd:
        after:
          - network-online.target
        restart: always
        restart_sec: 15s
        timeout_start_sec: 300s
