---

adminer:
  enabled: true
  tags: [utilities, adminer]
  name: adminer
  stack: adminer
  image: adminer:5.4.2
  named_networks:
    overlay:
      external: true
  traefik:
    enable: true
    exposure: private
    port: 8080
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: standard
    host: "{{ docker_services_primary_manager }}"
    constraints:
      - node.labels.docker_services_host == docker_services_primary_manager
