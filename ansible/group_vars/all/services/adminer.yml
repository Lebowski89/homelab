---

adminer:
  enabled: true
  tags: [apps, utilities, adminer]
  name: adminer
  stack: adminer
  image: adminer:5.4.2
  named_networks:
    overlay:
      external: true
  traefik:
    enable: true
    exposure: private
    port: 8080
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: "{{ docker_services_primary_manager }}"
    constraints:
      - node.labels.docker_services_host == docker_services_primary_manager
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m
