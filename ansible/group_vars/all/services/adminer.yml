---

adminer:
  enabled: true
  runtime: docker
  tags: [utilities, adminer]
  name: adminer
  stack: adminer

  image: adminer:5.4.2

  infisical:
    fail_on_empty: true
    secrets_map:
      - var: cloudflare_zone
        path: /Cloudflare
        name: ZONE

  named_networks:
    overlay:
      external: true

  traefik:
    enable: true
    exposure: private
    port: 8080

  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: standard
    host: "{{ services_controller_host }}"
    constraints:
      - node.labels.docker_services_host == docker_services_primary_manager
