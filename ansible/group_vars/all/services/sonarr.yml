---

sonarr:
  enabled: true
  runtime: docker
  tags: [arrs, pgsql, sonarr]

  image: ghcr.io/hotio/sonarr:release-4.0.18.2971

  environment:
    TZ: "{{ timezone }}"
    UMASK: "022"
    PUID: "{{ hostvars[services_storage_host].container_host_puid }}"
    PGID: "{{ hostvars[services_storage_host].container_host_pgid }}"
    SONARR__SERVER__PORT: "8989"
    SONARR__AUTH__METHOD: "External"
    SONARR__POSTGRES__HOST: "haproxy"
    SONARR__POSTGRES__PORT: "5432"
    FILE__SONARR__POSTGRES__USER: /run/secrets/postgres_user_secret
    FILE__SONARR__POSTGRES__PASSWORD: /run/secrets/postgres_pass_secret
    TP_SCHEME: "http"
    TP_DOMAIN: "{{ hostvars[services_controller_host].local_ip }}:8089"
    TP_HOTIO: "true"
    TP_THEME: "hotline"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: cloudflare_zone
        path: /Cloudflare
        name: ZONE
      - var: postgres_user
        path: "/Postgres"
        name: USER
        secret:
          name: postgres_user_secret
      - var: postgres_pass
        path: "/Postgres"
        name: PASS
        secret:
          name: postgres_pass_secret

  named_networks:
    overlay:
      external: true

  volumes:
    media:
      type: bind
      source: "{{ hostvars[services_storage_host].container_host_data_root }}"
      target: /data
      read_only: false

  traefik:
    enable: true
    exposure: private
    port: 8989
  themepark:
    app: sonarr
    theme: hotline

  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    host: "{{ services_storage_host }}"
    constraints:
      - node.labels.docker_services_host == docker_services_unraid_host
    restart_policy:
      condition: on-failure
      delay: 10s
      max_attempts: 5
      window: 2m

  targets:

    ################################
    # SONARR 720/1080p SERVICE
    ################################
    sonarr:
      tags: [sonarr-1080p]
      name: sonarr
      stack: sonarr

      environment:
        SONARR__APP__INSTANCENAME: "Sonarr"
        FILE__SONARR__AUTH__APIKEY: /run/secrets/sonarr_api_secret
        SONARR__POSTGRES__MAINDB: "sonarr-main"
        SONARR__POSTGRES__LOGDB: "sonarr-log"
      infisical:
        secrets_map:
          - var: sonarr_api
            path: "/Sonarr"
            name: API
            secret:
              name: sonarr_api_secret

      paths:
        - path: "{{ hostvars[services_storage_host].container_host_appdata_root }}/sonarr"
          state: directory
          mode: "0755"
        - path: "{{ hostvars[services_storage_host].container_host_data_root }}/media/tv"
          state: directory
          mode: "0755"
      copies:
        - src: files/themepark/98-themepark-sonarr
          dest: "{{ hostvars[services_storage_host].container_host_appdata_root }}/sonarr/98-themepark-sonarr"
          mode: "0755"
          force: false
          wait: true
          wait_timeout: 30
      volumes:
        config:
          type: bind
          source: "{{ hostvars[services_storage_host].container_host_appdata_root }}/sonarr"
          target: /config
          read_only: false
        themepark:
          type: bind
          source: "{{ hostvars[services_storage_host].container_host_appdata_root }}/sonarr/98-themepark-sonarr"
          target: /etc/cont-init.d/98-themepark
          read_only: false

      healthcheck:
        test:
          - "CMD-SHELL"
          - "touch /data/media/tv/.healthcheck && rm -f /data/media/tv/.healthcheck || exit 1"

      postgres:
        enable: true
        databases:
          - sonarr-main
          - sonarr-log

    ################################
    # SONARR 2160p SERVICE
    ################################
    sonarr_4k:
      tags: [sonarr-4k]
      name: sonarr-4k
      stack: sonarr-4k

      environment:
        SONARR__APP__INSTANCENAME: "Sonarr-4K"
        FILE__SONARR__AUTH__APIKEY: /run/secrets/sonarr_4k_api_secret
        SONARR__POSTGRES__MAINDB: "sonarr-4k-main"
        SONARR__POSTGRES__LOGDB: "sonarr-4k-log"
      infisical:
        secrets_map:
          - var: sonarr_4k_api
            path: "/Sonarr-4K"
            name: API
            secret:
              name: sonarr_4k_api_secret

      paths:
        - path: "{{ hostvars[services_storage_host].container_host_appdata_root }}/sonarr-4k"
          state: directory
          mode: "0755"
        - path: "{{ hostvars[services_storage_host].container_host_data_root }}/media/tv-4k"
          state: directory
          mode: "0755"
      copies:
        - src: files/themepark/98-themepark-sonarr
          dest: "{{ hostvars[services_storage_host].container_host_appdata_root }}/sonarr-4k/98-themepark-sonarr"
          mode: "0755"
          force: false
          wait: true
          wait_timeout: 30
      volumes:
        config:
          type: bind
          source: "{{ hostvars[services_storage_host].container_host_appdata_root }}/sonarr-4k"
          target: /config
          read_only: false
        themepark:
          type: bind
          source: "{{ hostvars[services_storage_host].container_host_appdata_root }}/sonarr-4k/98-themepark-sonarr"
          target: /etc/cont-init.d/98-themepark
          read_only: false

      healthcheck:
        test:
          - "CMD-SHELL"
          - "touch /data/media/tv-4k/.healthcheck && rm -f /data/media/tv-4k/.healthcheck || exit 1"

      postgres:
        enable: true
        databases:
          - sonarr-4k-main
          - sonarr-4k-log
