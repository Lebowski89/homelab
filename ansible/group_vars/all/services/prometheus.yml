---

prometheus:
  enabled: true
  runtime: docker
  tags: [monitoring, prometheus]
  name: prometheus
  stack: prometheus

  image: prom/prometheus:v3.13.1
  user: >-
    {{ hostvars[services_controller_host].container_host_puid }}:{{ hostvars[services_controller_host].container_host_pgid }}
  command:
    - "--config.file=/etc/prometheus/prometheus.yml"
    - "--storage.tsdb.path=/prometheus"
    - "--web.enable-remote-write-receiver"

  environment:
    TZ: "{{ timezone }}"
  infisical:
    fail_on_empty: true
    secrets_map:
      - var: cloudflare_zone
        path: /Cloudflare
        name: ZONE

  named_networks:
    overlay:
      external: true

  paths:
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus/data"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus/rules"
      state: directory
      mode: "0755"
  templates:
    - src: configs/prometheus/prometheus.yml.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus/prometheus.yml"
      mode: "0644"
      force: true
    - src: configs/prometheus/rules/infrastructure.yml.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus/rules/infrastructure.yml"
      mode: "0644"
      force: true
    - src: configs/prometheus/rules/applications.yml.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus/rules/applications.yml"
      mode: "0644"
      force: true
    - src: configs/prometheus/rules/node-exporter.yml.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus/rules/node-exporter.yml"
      mode: "0644"
      force: true
    - src: configs/prometheus/rules/dns.yml.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus/rules/dns.yml"
      mode: "0644"
      force: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus"
      target: /etc/prometheus
      read_only: true
    data:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus/data"
      target: /prometheus
      read_only: false

  traefik:
    enable: true
    exposure: private
    port: 9090

  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: careful
    host: "{{ services_controller_host }}"
    constraints:
      - node.labels.docker_services_host == services_controller_host
