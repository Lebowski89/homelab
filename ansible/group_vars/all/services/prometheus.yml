---

prometheus:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: podman
  tags:
    - monitoring
    - prometheus
  name: prometheus
  ################################
  # IMAGE/PROCESS
  ################################
  image: "docker.io/prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e"
  user: >-
    {{ hostvars[services_controller_host].container_host_puid }}:{{ hostvars[services_controller_host].container_host_pgid }}
  command:
    - "--config.file=/etc/prometheus/prometheus.yml"
    - "--storage.tsdb.path=/prometheus"
    - "--web.enable-remote-write-receiver"
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    TZ: "{{ timezone }}"
  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    prometheus:
      driver: bridge
      external: false
  ports:
    receiver:
      host_ip: "{{ local_ip }}"
      published: 19090
      target: 9090
      protocol: tcp
  ################################
  # FILESYSTEM
  ################################
    backend:
      host_ip: "{{ local_ip }}"
      published: 19090
      target: 9090
      protocol: tcp
  paths:
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus/data"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus/rules"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus/file_sd"
      state: directory
      mode: "0755"
  templates:
    - src: configs/prometheus/prometheus.yml.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus/prometheus.yml"
      mode: "0644"
      force: true
    - src: configs/prometheus/file_sd/blackbox-http.json.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus/file_sd/blackbox-http.json"
      mode: "0644"
      force: true
    - src: configs/prometheus/file_sd/blackbox-icmp.json.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus/file_sd/blackbox-icmp.json"
      mode: "0644"
      force: true
    - src: configs/prometheus/file_sd/blackbox-tcp.json.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus/file_sd/blackbox-tcp.json"
      mode: "0644"
      force: true
    - src: configs/prometheus/file_sd/postgres.json.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus/file_sd/postgres.json"
      mode: "0644"
      force: true
    - src: configs/prometheus/file_sd/patroni.json.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus/file_sd/patroni.json"
      mode: "0644"
      force: true
    - src: configs/prometheus/rules/infrastructure.yml.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus/rules/infrastructure.yml"
      mode: "0644"
      force: true
    - src: configs/prometheus/rules/applications.yml.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus/rules/applications.yml"
      mode: "0644"
      force: true
    - src: configs/prometheus/rules/node-exporter.yml.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus/rules/node-exporter.yml"
      mode: "0644"
      force: true
    - src: configs/prometheus/rules/dns.yml.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus/rules/dns.yml"
      mode: "0644"
      force: true
    - src: configs/prometheus/rules/availability.yml.j2
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus/rules/availability.yml"
      mode: "0644"
      force: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus"
      target: /etc/prometheus
      read_only: true
    data:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/prometheus/data"
      target: /prometheus
      read_only: false
  ################################
  # INTEGRATIONS
  ################################
  no_new_privileges: false
  traefik:
    enable: true
    exposure: private
    port: 19090
  ################################
  # RUNTIME/LIFECYCLE
  ################################
    backend_mode: host
    backend_host_inventory: "{{ services_controller_host }}"
  operational_requirements:
    acl: [mgt_receivers, mgt_backends]
    ownership_transition: true

  deploy:
    type: container
    host: "{{ services_controller_host }}"
    execution:
      mode: rootless
      host_user: podman-prometheus
      userns:
        mode: keep-id
        uid: "{{ hostvars[services_controller_host].container_host_puid }}"
        gid: "{{ hostvars[services_controller_host].container_host_pgid }}"
  systemd:
    restart: always
    restart_sec: 15s
    timeout_start_sec: 300s
    after:
      - network-online.target
