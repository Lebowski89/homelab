---

qbittorrent:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: docker
  tags: [torrents, qbittorrent]
  name: qbittorrent
  stack: qbittorrent

  ################################
  # IMAGE/PROCESS
  ################################
  image: ghcr.io/hotio/qbittorrent:release-v5.2.4
  hostname: qbittorrent.internal

  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    PUID: "{{ hostvars[services_storage_host].container_host_puid }}"
    PGID: "{{ hostvars[services_storage_host].container_host_pgid }}"
    TZ: "{{ timezone }}"
    FILE__VPN_PIA_USER: /run/secrets/qbittorrent_pia_user_secret
    FILE__VPN_PIA_PASS: /run/secrets/qbittorrent_pia_pass_secret
  env_file:
    - /opt/stacks/qbittorrent.env
  infisical:
    secrets_map:
      - var: qbittorrent_pia_user
        path: "/PIA"
        name: USER
        secret:
          name: qbittorrent_pia_user_secret
      - var: qbittorrent_pia_pass
        path: "/PIA"
        name: PASS
        secret:
          name: qbittorrent_pia_pass_secret
      - var: qbittorrent_user
        path: "/qBittorrent"
        name: USER
      - var: qbittorrent_pass
        path: "/qBittorrent"
        name: PASS
      - var: qbittorrent_api
        path: "/qBittorrent"
        name: API
  swarm_env_templates:
    - src: configs/qbittorrent/qBittorrent.env.j2
      dest: /opt/stacks/qbittorrent.env
      owner: "{{ hostvars[services_storage_host].container_host_puid }}"
      group: "{{ hostvars[services_storage_host].container_host_pgid }}"
      mode: "0600"
      force: true

  ################################
  # APPLICATION PREPARATION
  ################################
  application_prepare:
    handler: qbittorrent

  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    overlay:
      external: true
  ports:
    web_backend:
      exposure: private
      callers: [traefik]
      published: 22606
      target: 8090
      mode: host

  ################################
  # FILESYSTEM
  ################################
  paths:
    - path: "{{ hostvars[services_storage_host].container_host_data_root }}/torrents"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_storage_host].container_host_appdata_root }}/qbittorrent"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_storage_host].container_host_appdata_root }}/qbittorrent/config"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_storage_host].container_host_appdata_root }}/qbittorrent/wireguard"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_storage_host].container_host_data_root }}/torrents/completed"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_storage_host].container_host_data_root }}/torrents/incoming"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_storage_host].container_host_data_root }}/torrents/watched"
      state: directory
      mode: "0755"
  templates:
    - src: configs/qbittorrent/qBittorrent.conf.j2
      dest: "{{ hostvars[services_storage_host].container_host_appdata_root }}/qbittorrent/config/qBittorrent.conf"
      mode: "0664"
      force: true
      no_log: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_storage_host].container_host_appdata_root }}/qbittorrent"
      target: /config
      read_only: false
    media:
      type: bind
      source: "{{ hostvars[services_storage_host].container_host_data_root }}/torrents"
      target: /data/torrents
      read_only: false

  ################################
  # DEVICES/SECURITY
  ################################
  devices:
    - "/dev/net/tun:/dev/net/tun"
  cap_add:
    - NET_ADMIN
  sysctls:
    net.ipv4.conf.all.src_valid_mark: "1"
    net.ipv6.conf.all.disable_ipv6: "1"

  ################################
  # HEALTH
  ################################
  healthcheck:
    test:
      - "CMD"
      - "wget"
      - "--spider"
      - "-q"
      - "http://127.0.0.1:8090/"

  ################################
  # INTEGRATIONS
  ################################
  traefik:
    enable: true
    exposure: private
    port: 22606
    backend_mode: host
    backend_host_inventory: "{{ services_storage_host }}"

  ################################
  # RUNTIME/LIFECYCLE
  ################################
  operational_requirements:
    acl: [worker_backends]
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: standard
    hosts: "{{ services_storage_host }}"
