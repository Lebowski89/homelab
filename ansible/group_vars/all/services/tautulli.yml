---

tautulli:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: docker
  tags: [plex, tautulli]
  name: tautulli
  stack: tautulli
  ################################
  # IMAGE/PROCESS
  ################################
  image: ghcr.io/hotio/tautulli:release-v2.18.2
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[services_plex_host].container_host_puid }}"
    PGID: "{{ hostvars[services_plex_host].container_host_pgid }}"
    UMASK: "022"
    WEBUI_PORTS: "8181/tcp,8181/udp"
  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    overlay:
      external: true
  ################################
  # FILESYSTEM
  ################################
  ports:
    web_backend:
      published: 22619
      target: 8181
      mode: host
  ################################
  # FILESYSTEM
  ################################
  paths:
    - path: "{{ hostvars[services_plex_host].container_host_appdata_root }}/tautulli"
      state: directory
      mode: "0755"
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_plex_host].container_host_appdata_root }}/tautulli"
      target: /config
      read_only: false
  ################################
  # INTEGRATIONS
  ################################
  traefik:
    enable: true
    exposure: private
    port: 22619
    backend_mode: host
    backend_host_inventory: "{{ services_plex_host }}"
  themepark:
    app: tautulli
    theme: hotpink
  ################################
  # RUNTIME/LIFECYCLE
  ################################
  operational_requirements:
    acl: [worker_backends]

  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: standard
    hosts: "{{ services_plex_host }}"
    constraints:
      - node.labels.docker_services_host == docker_services_plex_host
