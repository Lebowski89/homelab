---

znc:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: podman
  tags:
    - media
    - znc
  name: znc
  ################################
  # IMAGE/PROCESS
  ################################
  image: lscr.io/linuxserver/znc:znc-1.10.3-ls189@sha256:ff2c194144b53a2d981ca21eba5158ade449b43c7a23d0f3a6b9de7734cdb2d8
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  user: "0:0"
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[services_controller_host].container_host_puid }}"
    PGID: "{{ hostvars[services_controller_host].container_host_pgid }}"
    UMASK: "022"
  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    znc:
      driver: bridge
      external: false
  ports:
    backend:
      host_ip: "{{ local_ip }}"
      published: 16501
      target: 6501
      protocol: tcp
    irc:
      host_ip: "{{ local_ip }}"
      published: 16502
      target: 6502
      protocol: tcp
  ################################
  # FILESYSTEM
  ################################
  paths:
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/znc"
      state: directory
      mode: "0755"
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/znc"
      target: /config
      read_only: false
  ################################
  # INTEGRATIONS
  ################################
  no_new_privileges: false
  traefik:
    enable: true
    exposure: private
    port: 16501
  ################################
  # RUNTIME/LIFECYCLE
  ################################
    backend_mode: host
    backend_host_inventory: "{{ services_controller_host }}"
  operational_requirements:
    acl: [mgt_backends]
    ownership_transition: true

  deploy:
    type: container
    hosts: "{{ services_controller_host }}"
    execution:
      mode: rootless
      host_user: podman-znc
      userns:
        mode: keep-id
        uid: "{{ hostvars[services_controller_host].container_host_puid }}"
        gid: "{{ hostvars[services_controller_host].container_host_pgid }}"
  systemd:
    restart: always
    restart_sec: 15s
    timeout_start_sec: 300s
    after:
      - network-online.target
