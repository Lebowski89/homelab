---

ombi:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: docker
  tags: [media, pgsql, ombi]
  name: ombi
  stack: ombi
  ################################
  # IMAGE/PROCESS
  ################################
  image: lscr.io/linuxserver/ombi:v4.53.10-ls265
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    TZ: "{{ timezone }}"
    PUID: "{{ hostvars[services_controller_host].container_host_puid }}"
    PGID: "{{ hostvars[services_controller_host].container_host_pgid }}"
    UMASK: "022"
  infisical:
    secrets_map:
      - var: postgres_user
        path: "/Postgres"
        name: USER
        secret:
          name: postgres_user_secret
      - var: postgres_pass
        path: "/Postgres"
        name: PASS
        secret:
          name: postgres_pass_secret
  ################################
  # CONNECTIVITY
  ################################
  named_networks:
    overlay:
      external: true
  ################################
  # FILESYSTEM
  ################################
  paths:
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/ombi"
      state: directory
      mode: "0755"
    - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/ombi/config"
      state: directory
      mode: "0755"
  templates:
    - src: configs/ombi.json.j2
      no_log: true
      dest: "{{ hostvars[services_controller_host].container_host_appdata_root }}/ombi/config/database.json"
      mode: "0664"
      force: true
  volumes:
    config:
      type: bind
      source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/ombi/config"
      target: /config
      read_only: false
  ################################
  # INTEGRATIONS
  ################################
  traefik:
    enable: true
    exposure: private
    port: 3579
  postgres:
    enable: true
    databases:
      - Ombi
  ################################
  # RUNTIME/LIFECYCLE
  ################################
  deploy:
    type: swarm
    mode: replicated
    replicas: 1
    profile: standard
    host: "{{ services_controller_host }}"
    constraints:
      - node.labels.docker_services_host == docker_services_primary_manager
