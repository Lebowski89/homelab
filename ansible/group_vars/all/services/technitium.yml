---

technitium:
  ################################
  # IDENTITY
  ################################
  enabled: true
  runtime: docker
  tags: [dns]
  ################################
  # IMAGE/PROCESS
  ################################
  image: "docker.io/technitium/dns-server:15.6.2"
  ################################
  # ENVIRONMENT/SECRETS
  ################################
  environment:
    TZ: "{{ timezone }}"
    UMASK: "022"
    DNS_SERVER_ADMIN_PASSWORD_FILE: /run/secrets/technitium_admin_secret
  infisical:
    secrets_map:
      - var: technitium_admin_pass
        path: "/Technitium"
        name: ADMIN_PASS
        secret:
          name: technitium_admin_secret
  ################################
  # CONNECTIVITY
  ################################
  ################################
  # TARGETS (INSTANCES)
  ################################
  targets:
    ################################
    # TECHNITIUM PRIMARY SERVICE
    ################################
    technitium_primary:
      ################################
      # IDENTITY
      ################################
      runtime: podman
      tags: [technitium-primary, dns-primary]
      name: technitium-primary
      ################################
      # IMAGE/PROCESS
      ################################
      image: "docker.io/technitium/dns-server:15.6.2@sha256:eb48ac5c135f4ab936b536f74f853d53e15ab39ef37fdbc9598a089b90d9f245"
      ################################
      # ENVIRONMENT/SECRETS
      ################################
      environment:
        PUID: "{{ hostvars[services_controller_host].container_host_puid }}"
        PGID: "{{ hostvars[services_controller_host].container_host_pgid }}"
      ################################
      # FILESYSTEM
      ################################
      network_mode: host
      paths:
        - path: "{{ hostvars[services_controller_host].container_host_appdata_root }}/technitium"
          state: directory
          owner: null
          group: null
          mode: "0755"
      volumes:
        config:
          type: bind
          source: "{{ hostvars[services_controller_host].container_host_appdata_root }}/technitium"
          target: /etc/dns
          read_only: false
      ################################
      # RUNTIME/LIFECYCLE
      ################################
      cap_add: [NET_RAW]
      no_new_privileges: false
      deploy:
        type: container
        host: "{{ services_controller_host }}"
      systemd:
        restart: always
        restart_sec: 15s
    ################################
    # TECHNITIUM SECONDARY SERVICE
    ################################
    technitium_secondary:
      ################################
      # IDENTITY
      ################################
      tags: [technitium-secondary, dns-secondary]
      name: technitium-secondary
      stack: technitium-secondary
      ################################
      # ENVIRONMENT/SECRETS
      ################################
      environment:
        PUID: "{{ hostvars[services_plex_host].container_host_puid }}"
        PGID: "{{ hostvars[services_plex_host].container_host_pgid }}"
      ################################
      # FILESYSTEM
      ################################
      named_networks:
        outside:
          external: true
          name: host
  ################################
  # RUNTIME/LIFECYCLE
  ################################
      paths:
        - path: "{{ hostvars[services_plex_host].container_host_appdata_root }}/technitium"
          state: directory
          mode: "0755"
      volumes:
        config:
          type: bind
          source: "{{ hostvars[services_plex_host].container_host_appdata_root }}/technitium"
          target: /etc/dns
          read_only: false
      ################################
      # RUNTIME/LIFECYCLE
      ################################
      deploy:
        type: swarm
        mode: replicated
        replicas: 1
        profile: careful
        host: "{{ services_plex_host }}"
        constraints:
          - "node.hostname == {{ services_plex_host }}"
    native:
      runtime: native
      tags:
        - technitium-native
        - technitium_native
      native:
        application: technitium
        config:
          install_script_url: https://download.technitium.com/dns/install.sh
          install_script_path: /tmp/technitium-dns-install.sh
          service_name: dns
          web_port: 5380
          dns_port: 53
          config_dir: /etc/dns
          install_marker: /opt/technitium/dns/DnsServerApp.dll
          resolved_dns_servers:
            - 192.168.80.53
            - 192.168.80.54
          disable_resolved_stub: true
        update_policy: present
      deploy:
        group: tags_technitium_native
