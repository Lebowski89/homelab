[defaults]

stdout_callback = default
callback_result_format = yaml
callback_format_pretty = true

# Where Ansible looks for collections
collections_path = ./collections:~/.ansible/collections

# Where Ansible looks for roles
roles_path = roles:test

# Keep imported catalog tasks usable from external recovery/test playbooks.
action_plugins = action_plugins

# Other useful defaults
inventory = netbox.yml

# Skynet sets a user-owned log path. Direct Ansible calls may set ANSIBLE_LOG_PATH.
