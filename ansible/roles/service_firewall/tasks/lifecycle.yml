---

- name: Service firewall | Reconcile new caller identities before waiting for application health
  when:
    - service_firewall_adapter_plan.managed | default(false)
    - service_firewall_lifecycle_phase == 'finish'
    - not ansible_check_mode
  service_firewall_lifecycle:
    plan: "{{ service_firewall_adapter_plan }}"
    phase: activate
    inventory_host: "{{ service_firewall_host }}"
  delegate_to: "{{ service_firewall_host }}"
  loop: "{{ service_firewall_adapter_plan.hosts | default([]) }}"
  loop_control:
    loop_var: service_firewall_host

- name: Service firewall | Apply this service's scoped protection transaction
  when:
    - service_firewall_adapter_plan.managed | default(false)
    - not ansible_check_mode
  service_firewall_lifecycle:
    plan: "{{ service_firewall_adapter_plan }}"
    phase: "{{ service_firewall_lifecycle_phase }}"
    inventory_host: "{{ service_firewall_host }}"
  delegate_to: "{{ service_firewall_host }}"
  loop: "{{ service_firewall_adapter_plan.hosts | default([]) }}"
  loop_control:
    loop_var: service_firewall_host
  register: service_firewall_transaction
  until: service_firewall_transaction is succeeded
  retries: "{{ 30 if service_firewall_lifecycle_phase in ['finish', 'remove'] else 0 }}"
  delay: 2

- name: Service firewall | Verify declared callers against the running publication
  when:
    - service_firewall_adapter_plan.managed | default(false)
    - service_firewall_lifecycle_phase == 'finish'
    - service_firewall_adapter_plan.endpoints | length > 0
    - not ansible_check_mode
  ansible.builtin.include_tasks:
    file: lifecycle_probes.yml
    apply:
      tags: [deploy, update, recreate, bootstrap]
  tags: [deploy, update, recreate, bootstrap]
