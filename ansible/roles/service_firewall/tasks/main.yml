---

- name: Service firewall | Reject an unsupported profile or operation before any inspection or mutation
  ansible.builtin.assert:
    that:
      - service_firewall_profile in ['mgt', 'workers']
      - service_firewall_operation in ['install', 'check', 'observe', 'remove']
      - service_firewall_profile != 'workers' or service_firewall_operation != 'observe'
      - >-
        ansible_run_tags | intersect(['mgt_firewall_install', 'mgt_firewall_check', 'mgt_firewall_observe',
        'mgt_firewall_remove', 'worker_backend_firewall_install', 'worker_backend_firewall_check',
        'worker_backend_firewall_remove']) | difference([
        ('mgt_firewall_' if service_firewall_profile == 'mgt' else 'worker_backend_firewall_') ~ service_firewall_operation]) | length == 0
    fail_msg: Select one firewall profile and one supported operation. Observe resolves mgt caller identities only.

- name: Service firewall | Snapshot the explicit operation before binding legacy profile inputs
  ansible.builtin.set_fact:
    service_firewall_selected_operation: "{{ service_firewall_operation }}"

- name: Service firewall | Dispatch only the selected profile
  ansible.builtin.include_tasks:
    file: "{{ service_firewall_profile }}/main.yml"
    apply:
      tags: "{{ ansible_run_tags }}"
  vars:
    mgt_firewall_operation: "{{ service_firewall_selected_operation }}"
    worker_backend_firewall_operation: "{{ service_firewall_selected_operation }}"
