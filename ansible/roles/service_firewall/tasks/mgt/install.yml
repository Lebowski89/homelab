---

- name: Service firewall | Mgt | Validate platform for retained direct installation imports
  ansible.builtin.include_tasks:
    file: ../platform.yml
    apply:
      tags: "{{ ansible_run_tags }}"
  vars:
    service_firewall_profile: mgt

- name: Service firewall | Mgt | Verify callers and test both rule families before writes # noqa var-naming[no-role-prefix]
  ansible.builtin.command:
    argv: ["{{ ansible_facts.python.executable }}", -c, "{{ mgt_firewall_helper_source }}", validate, --stdin]
    expand_argument_vars: false
    stdin: "{{ mgt_firewall_policy | to_json }}"
  register: mgt_firewall_preflight
  changed_when: false

- name: Service firewall | Mgt | Save the verified service-manager dependencies # noqa var-naming[no-role-prefix]
  ansible.builtin.set_fact:
    mgt_firewall_policy: "{{ mgt_firewall_policy | combine({'guard_units': (mgt_firewall_preflight.stdout | from_json).guard_units}) }}"

- name: Service firewall | Mgt | Extend and reconcile the current policy under its writer lock
  service_firewall_lifecycle:
    phase: install
    profile: mgt
    policy: "{{ mgt_firewall_policy }}"
    inventory_host: "{{ services_controller_host }}"
