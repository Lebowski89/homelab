---

- name: Service firewall | Mgt | Inspect caller identities without changing confirmations # noqa var-naming[no-role-prefix]
  ansible.builtin.command:
    argv: [/usr/bin/python3, -c, "{{ mgt_firewall_helper_source }}", observe, --stdin]
    stdin: "{{ mgt_firewall_policy | to_json }}"
    expand_argument_vars: false
  register: mgt_firewall_observation
  changed_when: false

- name: Service firewall | Mgt | Report available identities and unresolved callers
  ansible.builtin.debug:
    msg: "{{ mgt_firewall_observation.stdout | from_json }}"
