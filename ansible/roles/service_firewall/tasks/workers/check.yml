---

- name: Service firewall | Workers | Read installed policy without changing it # noqa var-naming[no-role-prefix]
  ansible.builtin.slurp:
    src: "{{ worker_backend_firewall_root }}/policy.json"
  register: worker_backend_firewall_installed

- name: Service firewall | Workers | Compare installed policy to effective inventory and service plan
  ansible.builtin.assert:
    that:
      - worker_backend_firewall_current.schema == worker_backend_firewall_policy.schema
      - worker_backend_firewall_current.backend == worker_backend_firewall_policy.backend
      - worker_backend_firewall_current.inventory_host == worker_backend_firewall_policy.inventory_host
      - worker_backend_firewall_current.inventory_address == worker_backend_firewall_policy.inventory_address
      - worker_backend_firewall_current.sources | sort == worker_backend_firewall_policy.sources | sort
      - worker_backend_firewall_current.sources_verified is sameas true
      - worker_backend_firewall_policy.ports | difference(worker_backend_firewall_current.ports) | length == 0
    fail_msg: The declared worker protection is missing or differs from current inventory/source inputs; audit does not update it.
  vars:
    worker_backend_firewall_current: "{{ worker_backend_firewall_installed.content | b64decode | from_json }}"

- name: Service firewall | Workers | Audit IPv4 and IPv6 firewall rules without changing them # noqa var-naming[no-role-prefix]
  ansible.builtin.command:
    argv:
      - "{{ worker_backend_firewall_python }}"
      - "{{ worker_backend_firewall_root }}/policy.py"
      - check
      - --config
      - "{{ worker_backend_firewall_root }}/policy.json"
  changed_when: false
  register: worker_backend_firewall_audit

- name: Service firewall | Workers | Require the Unraid rule-reconciliation process to be running
  ansible.builtin.assert:
    that:
      - (worker_backend_firewall_audit.stdout | from_json).watch_running
  when: worker_backend_firewall_unraid.stat.exists

- name: Service firewall | Workers | Check the Plex rule-reconciliation timer
  ansible.builtin.command:
    argv: [systemctl, "{{ worker_backend_firewall_status }}", skynet-worker-backend-firewall.timer]
  loop: [is-enabled, is-active]
  loop_control:
    loop_var: worker_backend_firewall_status
  changed_when: false
  when: not worker_backend_firewall_unraid.stat.exists
