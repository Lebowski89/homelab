---

################################
# INSTALL / CLUSTER TASKS
################################

- name: Install postgres packages
  when: "'tags_postgres' in group_names"
  ansible.builtin.include_tasks:
    file: sub_tasks/install/apt.yml
    apply:
      tags:
        - postgres
        - postgres_apt
  tags:
    - postgres
    - postgres_apt

- name: Configure etcd
  when: "'tags_postgres' in group_names"
  ansible.builtin.include_tasks:
    file: sub_tasks/install/etcd.yml
  tags:
    - postgres
    - postgres_etcd
    - postgres_etcd_reset

- name: Configure Patroni
  when: "'tags_postgres' in group_names"
  ansible.builtin.include_tasks:
    file: sub_tasks/install/patroni.yml
  tags:
    - postgres
    - postgres_patroni
    - postgres_patroni_reset

- name: Ensure dedicated PostgreSQL admin role exists
  when:
    - inventory_hostname == services_controller_host
    - ansible_run_tags is not defined
      or 'all' in ansible_run_tags
      or 'postgres_admin' in ansible_run_tags
      or 'postgres_admin_uptime_kuma' in ansible_run_tags
  ansible.builtin.include_tasks:
    file: sub_tasks/admin/pg_admin.yml
    apply:
      tags:
        - postgres_admin
        - postgres_admin_uptime_kuma
  tags:
    - postgres_admin
    - postgres_admin_uptime_kuma

################################
# ADMIN TASKS
################################

- name: Ensure dedicated PostgreSQL Uptime Kuma role exists
  when:
    - inventory_hostname == services_controller_host
    - ansible_run_tags is not defined
      or 'all' in ansible_run_tags
      or 'postgres_admin_uptime_kuma' in ansible_run_tags
  ansible.builtin.include_tasks:
    file: sub_tasks/admin/pg_uptime_kuma.yml
    apply:
      tags: postgres_admin_uptime_kuma
  tags: postgres_admin_uptime_kuma

- name: Configure PostgreSQL logical backups
  when:
    - "'tags_postgres' in group_names"
  ansible.builtin.include_tasks:
    file: sub_tasks/backup_setup.yml
    apply:
      tags:
        - postgres
        - postgres_backup
        - postgres_backup_setup
        - postgres_backup_run
  tags:
    - postgres
    - postgres_backup
    - postgres_backup_setup
    - postgres_backup_run

- name: Run PostgreSQL logical backup manually
  when:
    - inventory_hostname == services_controller_host
    - not ansible_check_mode
    - >-
      ansible_run_tags | default([])
      | intersect(['postgres_backup', 'postgres_backup_run'])
      | length > 0
  ansible.builtin.include_tasks:
    file: sub_tasks/backup.yml
    apply:
      tags:
        - postgres_backup
        - postgres_backup_run
  tags:
    - postgres_backup
    - postgres_backup_run

- name: Report PostgreSQL logical backup manual check-mode plan
  when:
    - inventory_hostname == services_controller_host
    - ansible_check_mode
    - >-
      ansible_run_tags | default([])
      | intersect(['postgres_backup', 'postgres_backup_run'])
      | length > 0
  ansible.builtin.debug:
    msg: >-
      Check mode: would discover the current Patroni leader and invoke the
      installed leader-gated PostgreSQL logical backup runner.
  tags:
    - postgres_backup
    - postgres_backup_run

- name: Configure PostgreSQL remote logical backups
  when: "'tags_postgres' in group_names"
  ansible.builtin.include_tasks:
    file: sub_tasks/backup_remote_setup.yml
    apply:
      tags:
        - postgres
        - postgres_backup_remote_setup
        - postgres_backup_remote_init
        - postgres_backup_remote_run
        - postgres_backup_remote_maintenance
        - postgres_backup_restore_validation_setup
        - postgres_backup_restore_validation_run
  tags:
    - postgres
    - postgres_backup_remote_setup
    - postgres_backup_remote_init
    - postgres_backup_remote_run
    - postgres_backup_remote_maintenance
    - postgres_backup_restore_validation_setup
    - postgres_backup_restore_validation_run

- name: Initialize PostgreSQL remote backup repository explicitly
  when:
    - "'tags_postgres' in group_names"
    - inventory_hostname == postgres_backup_remote_maintenance_host
    - not ansible_check_mode
    - "'postgres_backup_remote_init' in (ansible_run_tags | default([]))"
  ansible.builtin.include_tasks:
    file: sub_tasks/backup_remote_action.yml
    apply:
      tags:
        - postgres_backup_remote_init
  vars:
    postgres_backup_remote_action: init
  tags:
    - postgres_backup_remote_init

- name: Run PostgreSQL remote backup uploader manually
  when:
    - "'tags_postgres' in group_names"
    - not ansible_check_mode
    - "'postgres_backup_remote_run' in (ansible_run_tags | default([]))"
  ansible.builtin.include_tasks:
    file: sub_tasks/backup_remote_action.yml
    apply:
      tags:
        - postgres_backup_remote_run
  vars:
    postgres_backup_remote_action: upload
  tags:
    - postgres_backup_remote_run

- name: Run PostgreSQL remote backup maintenance manually
  when:
    - "'tags_postgres' in group_names"
    - inventory_hostname == postgres_backup_remote_maintenance_host
    - not ansible_check_mode
    - "'postgres_backup_remote_maintenance' in (ansible_run_tags | default([]))"
  ansible.builtin.include_tasks:
    file: sub_tasks/backup_remote_action.yml
    apply:
      tags:
        - postgres_backup_remote_maintenance
  vars:
    postgres_backup_remote_action: maintenance
  tags:
    - postgres_backup_remote_maintenance

- name: Report PostgreSQL remote backup init check-mode plan
  when:
    - "'tags_postgres' in group_names"
    - inventory_hostname == postgres_backup_remote_maintenance_host
    - ansible_check_mode
    - "'postgres_backup_remote_init' in (ansible_run_tags | default([]))"
  ansible.builtin.debug:
    msg: Check mode - would initialize the configured PostgreSQL Restic repository.
  tags:
    - postgres_backup_remote_init

- name: Report PostgreSQL remote backup upload check-mode plan
  when:
    - "'tags_postgres' in group_names"
    - ansible_check_mode
    - "'postgres_backup_remote_run' in (ansible_run_tags | default([]))"
  ansible.builtin.debug:
    msg: >-
      Check mode - would upload eligible completed PostgreSQL logical backups
      to the configured Restic repository.
  tags:
    - postgres_backup_remote_run

- name: Report PostgreSQL remote backup maintenance check-mode plan
  when:
    - "'tags_postgres' in group_names"
    - inventory_hostname == postgres_backup_remote_maintenance_host
    - ansible_check_mode
    - "'postgres_backup_remote_maintenance' in (ansible_run_tags | default([]))"
  ansible.builtin.debug:
    msg: >-
      Check mode - would apply scoped PostgreSQL Restic retention and prune
      unreferenced repository data.
  tags:
    - postgres_backup_remote_maintenance

- name: Configure PostgreSQL backup restore validation
  when: "'tags_postgres' in group_names"
  ansible.builtin.include_tasks:
    file: sub_tasks/backup_restore_validation_setup.yml
    apply:
      tags:
        - postgres
        - postgres_backup_restore_validation_setup
        - postgres_backup_restore_validation_run
  tags:
    - postgres
    - postgres_backup_restore_validation_setup
    - postgres_backup_restore_validation_run

- name: Run PostgreSQL backup restore validation manually
  when:
    - "'tags_postgres' in group_names"
    - inventory_hostname == postgres_backup_restore_validation_host
    - not ansible_check_mode
    - "'postgres_backup_restore_validation_run' in (ansible_run_tags | default([]))"
  ansible.builtin.include_tasks:
    file: sub_tasks/backup_restore_validation_action.yml
    apply:
      tags:
        - postgres_backup_restore_validation_run
  tags:
    - postgres_backup_restore_validation_run

- name: Report PostgreSQL backup restore validation check-mode plan
  when:
    - "'tags_postgres' in group_names"
    - inventory_hostname == postgres_backup_restore_validation_host
    - ansible_check_mode
    - "'postgres_backup_restore_validation_run' in (ansible_run_tags | default([]))"
  ansible.builtin.debug:
    msg: >-
      Check mode: would select a recent PostgreSQL Restic snapshot and validate
      every database dump in an isolated temporary PostgreSQL cluster.
  tags:
    - postgres_backup_restore_validation_run

- name: Restore PostgreSQL single database from pg_dump backup
  when:
    - inventory_hostname == services_controller_host
    - "'postgres_restore' in ansible_run_tags"
  ansible.builtin.include_tasks:
    file: sub_tasks/restore.yml
    apply:
      tags: postgres_restore
  tags: postgres_restore

- name: Reset PostgreSQL/Patroni node destructively
  when:
    - "'tags_postgres' in group_names"
    - "'postgres_admin_nuke_node' in ansible_run_tags"
  ansible.builtin.include_tasks:
    file: sub_tasks/admin/reset_node.yml
    apply:
      tags: postgres_admin_nuke_node
  tags: postgres_admin_nuke_node

- name: Fix database ownership and privileges
  when:
    - inventory_hostname == services_controller_host
    - "'postgres_admin_fix_owner' in ansible_run_tags"
  ansible.builtin.include_tasks:
    file: sub_tasks/admin/fix_owner.yml
    apply:
      tags: postgres_admin_fix_owner
  tags: postgres_admin_fix_owner

- name: Update Patroni dynamic pg_hba in DCS
  when:
    - "'tags_postgres' in group_names"
    - "'postgres_admin_update_pg_hba' in ansible_run_tags"
  ansible.builtin.include_tasks:
    file: sub_tasks/admin/pg_hba.yml
    apply:
      tags: postgres_admin_update_pg_hba
  tags: postgres_admin_update_pg_hba
