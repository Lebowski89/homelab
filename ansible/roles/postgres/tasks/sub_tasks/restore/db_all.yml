---

- name: Restore all DBs | Assert restore was explicitly requested
  ansible.builtin.assert:
    that:
      - postgres_restore_all_dbs_dir | string | trim | length > 0
    fail_msg: >-
      All-database restore requires the following variable to be set:
        postgres_restore_all_dbs_dir: "/path/to/dump_dir"

- name: Restore all DBs | Query Patroni cluster state from first postgres node
  ansible.builtin.uri:
    url: "http://{{ hostvars[groups['postgres'][0]].local_ip }}:{{ postgres_patroni_restapi_port }}/cluster"
    method: GET
    return_content: true
    status_code: 200
  register: postgres_patroni_cluster_state
  run_once: true
  delegate_to: "{{ docker_services_primary_manager }}"
  retries: 12
  delay: 5
  until: >-
    (
      postgres_patroni_cluster_state.json.members
      | default([])
      | selectattr('role', 'equalto', 'leader')
      | list
      | length
    ) > 0

- name: Restore all DBs | Extract Patroni leader candidates
  ansible.builtin.set_fact:
    postgres_patroni_leader_candidates: >-
      {{
        postgres_patroni_cluster_state.json.members
        | default([])
        | selectattr('role', 'equalto', 'leader')
        | list
      }}
  run_once: true
  delegate_to: "{{ docker_services_primary_manager }}"

- name: Restore all DBs | Determine Patroni leader member
  ansible.builtin.set_fact:
    postgres_patroni_leader_member: "{{ postgres_patroni_leader_candidates[0] }}"
  run_once: true
  delegate_to: "{{ docker_services_primary_manager }}"

- name: Restore all DBs | Check restore directory exists on leader
  ansible.builtin.stat:
    path: "{{ postgres_restore_all_dbs_dir }}"
  register: postgres_restore_all_dbs_dir_stat
  run_once: true
  delegate_to: "{{ postgres_patroni_leader_member.name }}"

- name: Restore all DBs | Assert restore directory exists
  ansible.builtin.assert:
    that:
      - postgres_restore_all_dbs_dir_stat.stat.exists
      - postgres_restore_all_dbs_dir_stat.stat.isdir
    fail_msg: "Restore directory not found on leader: {{ postgres_restore_all_dbs_dir }}"
  run_once: true
  delegate_to: "{{ docker_services_primary_manager }}"

- name: Restore all DBs | Find dump files
  ansible.builtin.find:
    paths: "{{ postgres_restore_all_dbs_dir }}"
    patterns: "*.dump"
    file_type: file
  register: postgres_restore_all_dbs_find
  run_once: true
  delegate_to: "{{ postgres_patroni_leader_member.name }}"

- name: Restore all DBs | Assert dump files were found
  ansible.builtin.assert:
    that:
      - (postgres_restore_all_dbs_find.files | default([]) | length) > 0
    fail_msg: "No .dump files found in {{ postgres_restore_all_dbs_dir }}"
  run_once: true
  delegate_to: "{{ docker_services_primary_manager }}"

- name: Restore all DBs | Build restore database/file map
  ansible.builtin.set_fact:
    postgres_restore_all_dbs_map: >-
      {{
        postgres_restore_all_dbs_find.files
        | map(attribute='path')
        | map('basename')
        | map('regex_replace', '\.dump$', '')
        | zip(postgres_restore_all_dbs_find.files | map(attribute='path'))
        | map('list')
        | list
      }}
  run_once: true
  delegate_to: "{{ docker_services_primary_manager }}"

- name: Restore all DBs | Drop and recreate databases if requested
  ansible.builtin.shell: |
    set -euo pipefail
    export PGPASSWORD='{{ postgres_patroni_superuser_pass }}'
    psql \
      -h 127.0.0.1 \
      -p {{ postgres_patroni_postgres_port }} \
      -U {{ postgres_patroni_superuser_name }} \
      -d postgres \
      -v ON_ERROR_STOP=1 <<SQL
    SELECT pg_terminate_backend(pid)
    FROM pg_stat_activity
    WHERE datname = '{{ item[0] }}'
      AND pid <> pg_backend_pid();
    DROP DATABASE IF EXISTS "{{ item[0] }}";
    CREATE DATABASE "{{ item[0] }}";
    SQL
  args:
    executable: /bin/bash
  when: postgres_restore_all_dbs_drop_existing | bool
  loop: "{{ postgres_restore_all_dbs_map }}"
  run_once: true
  delegate_to: "{{ postgres_patroni_leader_member.name }}"
  no_log: true

- name: Restore all DBs | Ensure databases exist when not dropping
  community.postgresql.postgresql_db:
    login_host: "127.0.0.1"
    login_port: "{{ postgres_patroni_postgres_port }}"
    login_user: "{{ postgres_patroni_superuser_name }}"
    login_password: "{{ postgres_patroni_superuser_pass }}"
    name: "{{ item[0] }}"
    state: present
  when: not (postgres_restore_all_dbs_drop_existing | bool)
  loop: "{{ postgres_restore_all_dbs_map }}"
  run_once: true
  delegate_to: "{{ postgres_patroni_leader_member.name }}"
  no_log: true

- name: Restore all DBs | Restore each database
  ansible.builtin.shell: |
    set -euo pipefail
    export PGPASSWORD='{{ postgres_patroni_superuser_pass }}'
    pg_restore \
      -h 127.0.0.1 \
      -p {{ postgres_patroni_postgres_port }} \
      -U {{ postgres_patroni_superuser_name }} \
      -d '{{ item[0] }}' \
      --clean \
      --if-exists \
      '{{ item[1] }}'
  args:
    executable: /bin/bash
  loop: "{{ postgres_restore_all_dbs_map }}"
  run_once: true
  delegate_to: "{{ postgres_patroni_leader_member.name }}"
  no_log: true

- name: Restore all DBs | Show result
  ansible.builtin.debug:
    msg:
      leader: "{{ postgres_patroni_leader_member.name }}"
      restore_dir: "{{ postgres_restore_all_dbs_dir }}"
      databases: "{{ postgres_restore_all_dbs_map | map('first') | list }}"
  run_once: true
  delegate_to: "{{ docker_services_primary_manager }}"
