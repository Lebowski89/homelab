---

- name: PostgreSQL | Validate platform for a direct etcd task import
  when: postgres_platform is not defined
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/tasks/platform.yml"
    apply:
      tags: "{{ ansible_run_tags }}"
  tags: [always]

- name: Assert etcd vars are defined
  ansible.builtin.assert:
    that:
      - postgres_etcd_node_name is defined
      - postgres_etcd_node_name | string | trim | length > 0
      - local_ip is defined
      - local_ip | string | trim | length > 0
      - postgres_etcd_initial_cluster is defined
      - postgres_etcd_initial_cluster | string | trim | length > 0
    fail_msg: "Required etcd variables are missing."
  tags:
    - postgres
    - postgres_etcd

- name: PostgreSQL | Validate existing paths before etcd configuration
  ansible.builtin.import_tasks: "{{ role_path }}/tasks/sub_tasks/install/preflight.yml"
  tags: [postgres, postgres_etcd]

- name: PostgreSQL | Explain deferred etcd configuration in check mode
  when: ansible_check_mode
  ansible.builtin.debug:
    msg: >-
      Would configure {{ postgres_platform.etcd_config }} and data at {{ postgres_etcd_data_dir }}.
      Account-dependent filesystem work, service lifecycle and endpoint verification are deferred.
  tags: [postgres, postgres_etcd]

- name: Stop etcd before optional reset
  when:
    - not ansible_check_mode
    - "'postgres_etcd_reset' in (ansible_run_tags | default([]))"
  ansible.builtin.systemd_service:
    name: etcd
    state: stopped
  failed_when: false
  tags:
    - never
    - postgres_etcd_reset

- name: Remove etcd data directory for reset
  when:
    - not ansible_check_mode
    - "'postgres_etcd_reset' in (ansible_run_tags | default([]))"
  ansible.builtin.file:
    path: "{{ postgres_etcd_data_dir }}"
    state: absent
  tags:
    - never
    - postgres_etcd_reset

- name: Report etcd reset check-mode plan
  when:
    - ansible_check_mode
    - "'postgres_etcd_reset' in (ansible_run_tags | default([]))"
  ansible.builtin.debug:
    msg: Check mode - would stop etcd and remove its data directory for reset.
  changed_when: false
  tags:
    - never
    - postgres_etcd_reset

- name: Ensure etcd data directory exists
  when: not ansible_check_mode
  ansible.builtin.file:
    path: "{{ postgres_etcd_data_dir }}"
    state: directory
    owner: etcd
    group: etcd
    mode: "0700"
    setype: _default
  tags:
    - postgres
    - postgres_etcd

- name: Template etcd defaults
  when: not ansible_check_mode
  ansible.builtin.template:
    src: etcd.default.j2
    dest: "{{ postgres_platform.etcd_config }}"
    owner: root
    group: root
    mode: "0644"
    force: true
    setype: _default
  notify: Restart etcd
  tags:
    - postgres
    - postgres_etcd

- name: Enable and start etcd
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    name: etcd
    state: started
    enabled: true
  tags:
    - postgres
    - postgres_etcd

- name: Wait for etcd client port
  when: not ansible_check_mode
  ansible.builtin.wait_for:
    host: "{{ local_ip }}"
    port: "{{ postgres_etcd_client_port }}"
    timeout: 60
  tags:
    - postgres
    - postgres_etcd
