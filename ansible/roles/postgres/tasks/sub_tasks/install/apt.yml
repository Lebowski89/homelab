---

- name: Ensure PostgreSQL common prerequisites are installed
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
      - gnupg
      - lsb-release
    state: present
    update_cache: true

- name: Ensure PGDG keyring directory exists
  ansible.builtin.file:
    path: /usr/share/postgresql-common/pgdg
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download PGDG repository signing key
  ansible.builtin.get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
    owner: root
    group: root
    mode: "0644"

- name: Add PGDG repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc]
      https://apt.postgresql.org/pub/repos/apt
      {{ ansible_distribution_release }}-pgdg main
    filename: pgdg
    state: present
    update_cache: true

- name: Install PostgreSQL common packages first
  ansible.builtin.apt:
    name:
      - postgresql-common
      - postgresql-client-common
    state: present

- name: Disable automatic Debian PostgreSQL cluster creation
  ansible.builtin.lineinfile:
    path: /etc/postgresql-common/createcluster.conf
    regexp: '^#?\s*create_main_cluster\s*='
    line: 'create_main_cluster = false'

- name: Set default PostgreSQL start_conf to manual
  ansible.builtin.lineinfile:
    path: /etc/postgresql-common/createcluster.conf
    regexp: '^#?\s*start_conf\s*='
    line: 'start_conf = manual'

- name: Install PostgreSQL Patroni, and etcd packages
  ansible.builtin.apt:
    name:
      - "postgresql-{{ postgres_version }}"
      - "postgresql-client-{{ postgres_version }}"
      - "postgresql-contrib-{{ postgres_version }}"
      - patroni
      - python3-psycopg2
      - python3-etcd
      - etcd-server
      - etcd-client
    state: present
