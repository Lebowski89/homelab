---

- name: Logical backup run | Query Patroni cluster state
  # checkov:skip=CKV2_ANSIBLE_1:Internal homelab service endpoint over trusted management network
  ansible.builtin.uri:
    url: "http://{{ hostvars[groups['tags_postgres'][0]].local_ip }}:{{ postgres_patroni_restapi_port }}/cluster"
    method: GET
    return_content: true
    status_code: 200
  register: postgres_backup_patroni_cluster_state
  run_once: true
  delegate_to: "{{ services_controller_host }}"
  retries: 12
  delay: 5
  until: >-
    (
      postgres_backup_patroni_cluster_state.json.members
      | default([])
      | selectattr('role', 'equalto', 'leader')
      | list
      | length
    ) > 0

- name: Logical backup run | Select current Patroni leader
  ansible.builtin.set_fact:
    postgres_backup_patroni_leader: >-
      {{
        (
          postgres_backup_patroni_cluster_state.json.members
          | default([])
          | selectattr('role', 'equalto', 'leader')
          | list
          | first
        ).name
      }}
  run_once: true
  delegate_to: "{{ services_controller_host }}"

- name: Logical backup run | Validate leader inventory mapping
  ansible.builtin.assert:
    that:
      - postgres_backup_patroni_leader in groups['tags_postgres']
    fail_msg: >-
      Patroni reported leader {{ postgres_backup_patroni_leader }}, but that
      member is not an inventory host in tags_postgres.
  run_once: true
  delegate_to: "{{ services_controller_host }}"

- name: Logical backup run | Invoke installed leader-gated runner
  become: true
  become_user: postgres
  ansible.builtin.command:
    argv:
      - "{{ postgres_backup_script_path }}"
  register: postgres_backup_manual_result
  changed_when: "'POSTGRES_BACKUP_RESULT=' in postgres_backup_manual_result.stdout"
  run_once: true
  delegate_to: "{{ postgres_backup_patroni_leader }}"

- name: Logical backup run | Report status and location
  ansible.builtin.debug:
    msg:
      leader: "{{ postgres_backup_patroni_leader }}"
      result: >-
        {{
          postgres_backup_manual_result.stdout_lines
          | select('match', '^POSTGRES_BACKUP_RESULT=')
          | list
          | last
        }}
  run_once: true
  delegate_to: "{{ services_controller_host }}"
