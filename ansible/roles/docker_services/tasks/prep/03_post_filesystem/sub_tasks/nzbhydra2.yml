---

################################
# NZBHYDRA2 PREP
################################

- name: NZBHydra2 prep | Set filesystem host
  no_log: true
  ansible.builtin.set_fact:
    docker_services_nzbhydra2_fs_host: "{{ docker_services_fs_hosts_effective | first }}"
  run_once: true

- name: NZBHydra2 prep | Set derived vars
  no_log: true
  ansible.builtin.set_fact:
    docker_services_nzbhydra2_config_dir: >-
      {{ hostvars[docker_services_nzbhydra2_fs_host].docker_host_appdata_root }}/nzbhydra2
    docker_services_nzbhydra2_config_path: >-
      {{ hostvars[docker_services_nzbhydra2_fs_host].docker_host_appdata_root }}/nzbhydra2/nzbhydra.yml
    docker_services_nzbhydra2_image: "{{ docker_services_svc.image }}"
    docker_services_nzbhydra2_timezone: "{{ timezone }}"

    docker_services_nzbhydra2_puid: >-
      {{
        (
          (docker_services_svc.environment | default({})).PUID
          | default(
              hostvars[docker_services_nzbhydra2_fs_host].docker_host_puid
              | default('1000')
            )
        )
        | string
      }}
    docker_services_nzbhydra2_pgid: >-
      {{
        (
          (docker_services_svc.environment | default({})).PGID
          | default(
              hostvars[docker_services_nzbhydra2_fs_host].docker_host_pgid
              | default('1000')
            )
        )
        | string
      }}
    docker_services_nzbhydra2_umask: >-
      {{
        (
          (docker_services_svc.environment | default({})).UMASK
          | default('027')
        )
        | string
      }}

    docker_services_nzbhydra2_user: "{{ nzbhydra2_user | default('') }}"
    docker_services_nzbhydra2_pass: "{{ nzbhydra2_pass | default('') }}"
    docker_services_nzbhydra2_api: "{{ nzbhydra2_api | default('') }}"

    docker_services_nzbhydra2_althub_user: "{{ althub_user | default('') }}"
    docker_services_nzbhydra2_althub_api: "{{ althub_api | default('') }}"
    docker_services_nzbhydra2_althub_vip_exp: "{{ althub_vip_expiration | default('') }}"
    docker_services_nzbhydra2_geek_user: "{{ geek_user | default('') }}"
    docker_services_nzbhydra2_geek_api: "{{ geek_api | default('') }}"
    docker_services_nzbhydra2_geek_vip_exp: "{{ geek_vip_expiration | default('') }}"
    docker_services_nzbhydra2_slug_user: "{{ slug_user | default('') }}"
    docker_services_nzbhydra2_slug_api: "{{ slug_api | default('') }}"
    docker_services_nzbhydra2_slug_vip_exp: "{{ slug_vip_expiration | default('') }}"

    docker_services_nzbhydra2_sabnzbd_url: "{{ docker_services_svc.prep.sabnzbd.url | default('http://sabnzbd:8080') }}"
    docker_services_nzbhydra2_sabnzbd_api: "{{ sabnzbd_api | default('') }}"
  run_once: true

- name: NZBHydra2 prep | Assert required secrets are present
  no_log: true
  ansible.builtin.assert:
    that:
      - docker_services_nzbhydra2_user | string | trim | length > 0
      - docker_services_nzbhydra2_pass | string | trim | length > 0
      - docker_services_nzbhydra2_api | string | trim | length > 0
      - docker_services_nzbhydra2_sabnzbd_api | string | trim | length > 0
    fail_msg: >-
      Required NZBHydra2 credentials are missing. Ensure nzbhydra2_user,
      nzbhydra2_pass, nzbhydra2_api, and sabnzbd_api are populated before prep runs.
  run_once: true

- name: NZBHydra2 prep | Assert altHUB secrets are complete when used
  no_log: true
  ansible.builtin.assert:
    that:
      - >-
        (
          (docker_services_nzbhydra2_althub_user | string | trim == '')
          and
          (docker_services_nzbhydra2_althub_api | string | trim == '')
        )
        or
        (
          docker_services_nzbhydra2_althub_user | string | trim | length > 0
          and docker_services_nzbhydra2_althub_api | string | trim | length > 0
        )
    fail_msg: "altHUB must be either fully configured (user + api) or omitted entirely."
  run_once: true

- name: NZBHydra2 prep | Assert NZBGeek secrets are complete when used
  no_log: true
  ansible.builtin.assert:
    that:
      - >-
        (
          (docker_services_nzbhydra2_geek_user | string | trim == '')
          and
          (docker_services_nzbhydra2_geek_api | string | trim == '')
        )
        or
        (
          docker_services_nzbhydra2_geek_user | string | trim | length > 0
          and docker_services_nzbhydra2_geek_api | string | trim | length > 0
        )
    fail_msg: "NZBGeek must be either fully configured (user + api) or omitted entirely."
  run_once: true

- name: NZBHydra2 prep | Assert Drunken Slug secrets are complete when used
  no_log: true
  ansible.builtin.assert:
    that:
      - >-
        (
          (docker_services_nzbhydra2_slug_user | string | trim == '')
          and
          (docker_services_nzbhydra2_slug_api | string | trim == '')
        )
        or
        (
          docker_services_nzbhydra2_slug_user | string | trim | length > 0
          and docker_services_nzbhydra2_slug_api | string | trim | length > 0
        )
    fail_msg: "Drunken Slug must be either fully configured (user + api) or omitted entirely."
  run_once: true

################################
# CONFIG (CREATE IF MISSING)
################################

- name: NZBHydra2 prep | Ensure config dir exists
  ansible.builtin.file:
    path: "{{ docker_services_nzbhydra2_config_dir }}"
    state: directory
    owner: "{{ docker_services_nzbhydra2_puid }}"
    group: "{{ docker_services_nzbhydra2_pgid }}"
    mode: "0755"
  delegate_to: "{{ docker_services_nzbhydra2_fs_host }}"
  run_once: true

- name: NZBHydra2 prep | Check config exists
  ansible.builtin.stat:
    path: "{{ docker_services_nzbhydra2_config_path }}"
  register: docker_services_nzbhydra2_stat
  delegate_to: "{{ docker_services_nzbhydra2_fs_host }}"
  run_once: true

- name: NZBHydra2 prep | Generate nzbhydra.yml (temp container)
  when: not docker_services_nzbhydra2_stat.stat.exists
  run_once: true
  block:
    - name: NZBHydra2 prep | Start temp container to generate config
      community.docker.docker_container:
        name: nzbhydra2-config
        image: "{{ docker_services_nzbhydra2_image }}"
        pull: true
        state: started
        container_default_behavior: compatibility
        detach: true
        env:
          PUID: "{{ docker_services_nzbhydra2_puid }}"
          PGID: "{{ docker_services_nzbhydra2_pgid }}"
          TZ: "{{ docker_services_nzbhydra2_timezone }}"
          UMASK: "{{ docker_services_nzbhydra2_umask }}"
        volumes:
          - "{{ docker_services_nzbhydra2_config_dir }}:/config"
        restart_policy: "no"
      delegate_to: "{{ docker_services_nzbhydra2_fs_host }}"

    - name: NZBHydra2 prep | Wait for config to appear
      ansible.builtin.wait_for:
        path: "{{ docker_services_nzbhydra2_config_path }}"
        state: present
        timeout: 180
      delegate_to: "{{ docker_services_nzbhydra2_fs_host }}"

    - name: NZBHydra2 prep | Wait for config file size to stabilize
      ansible.builtin.shell: |
        set -euo pipefail
        prev_size=-1
        stable_count=0

        for _ in $(seq 1 12); do
          if [ -f "{{ docker_services_nzbhydra2_config_path }}" ]; then
            curr_size="$(stat -c %s "{{ docker_services_nzbhydra2_config_path }}")"
            if [ "$curr_size" -gt 0 ] && [ "$curr_size" -eq "$prev_size" ]; then
              stable_count=$((stable_count + 1))
              if [ "$stable_count" -ge 2 ]; then
                exit 0
              fi
            else
              stable_count=0
            fi
            prev_size="$curr_size"
          fi
          sleep 5
        done

        echo "Config file did not stabilize in time: {{ docker_services_nzbhydra2_config_path }}" >&2
        exit 1
      args:
        executable: /bin/bash
      delegate_to: "{{ docker_services_nzbhydra2_fs_host }}"
      changed_when: false

  always:
    - name: NZBHydra2 prep | Remove temp config container
      community.docker.docker_container:
        container_default_behavior: compatibility
        name: nzbhydra2-config
        state: absent
        stop_timeout: 10
      register: docker_services_nzbhydra2_remove_tmp
      retries: 5
      delay: 5
      until: docker_services_nzbhydra2_remove_tmp is succeeded
      delegate_to: "{{ docker_services_nzbhydra2_fs_host }}"

################################
# CONFIG (FACTS)
################################

- name: NZBHydra2 prep | Build config facts
  no_log: true
  ansible.builtin.set_fact:
    docker_services_nzbhydra2_expected_indexer_count: >-
      {{
        [
          (docker_services_nzbhydra2_althub_user | string | trim | length > 0),
          (docker_services_nzbhydra2_geek_user | string | trim | length > 0),
          (docker_services_nzbhydra2_slug_user | string | trim | length > 0)
        ]
        | select('equalto', true)
        | list
        | length
      }}

    docker_services_nzbhydra2_indexers: >-
      {%- set out = [] -%}

      {%- if docker_services_nzbhydra2_althub_user | string | trim | length > 0 -%}
      {%- set _ = out.append({
            'allCapsChecked': true,
            'backend': 'NEWZNAB',
            'state': 'ENABLED',
            'name': 'altHUB',
            'host': 'https://api.althub.co.za',
            'username': docker_services_nzbhydra2_althub_user,
            'apiKey': docker_services_nzbhydra2_althub_api,
            'searchModuleType': 'NEWZNAB',
            'categories': [],
            'vipExpirationDate': docker_services_nzbhydra2_althub_vip_exp
          }) -%}
      {%- endif -%}

      {%- if docker_services_nzbhydra2_geek_user | string | trim | length > 0 -%}
      {%- set _ = out.append({
            'allCapsChecked': true,
            'backend': 'NEWZNAB',
            'state': 'ENABLED',
            'name': 'NZBGeek',
            'host': 'https://api.nzbgeek.info',
            'username': docker_services_nzbhydra2_geek_user,
            'apiKey': docker_services_nzbhydra2_geek_api,
            'searchModuleType': 'NEWZNAB',
            'categories': [],
            'vipExpirationDate': docker_services_nzbhydra2_geek_vip_exp
          }) -%}
      {%- endif -%}

      {%- if docker_services_nzbhydra2_slug_user | string | trim | length > 0 -%}
      {%- set _ = out.append({
            'allCapsChecked': true,
            'backend': 'NZEDB',
            'state': 'ENABLED',
            'name': 'Drunken Slug',
            'host': 'https://api.drunkenslug.com',
            'username': docker_services_nzbhydra2_slug_user,
            'apiKey': docker_services_nzbhydra2_slug_api,
            'searchModuleType': 'NEWZNAB',
            'categories': [],
            'vipExpirationDate': docker_services_nzbhydra2_slug_vip_exp
          }) -%}
      {%- endif -%}

      {{ out }}

    docker_services_nzbhydra2_downloaders:
      - apiKey: "{{ docker_services_nzbhydra2_sabnzbd_api }}"
        downloadType: NZB
        enabled: true
        name: SABnzbd
        nzbAddingType: UPLOAD
        downloaderType: SABNZBD
        url: "{{ docker_services_nzbhydra2_sabnzbd_url }}"
  run_once: true

################################
# CONFIG (YEDIT)
################################

- name: NZBHydra2 prep | Set auth user
  no_log: true
  yedit:
    src: "{{ docker_services_nzbhydra2_config_path }}"
    key: auth.users
    value:
      - username: "{{ docker_services_nzbhydra2_user }}"
        password: "{noop}{{ docker_services_nzbhydra2_pass }}"
    state: present
  delegate_to: "{{ docker_services_nzbhydra2_fs_host }}"
  run_once: true

- name: NZBHydra2 prep | Set API key
  no_log: true
  yedit:
    src: "{{ docker_services_nzbhydra2_config_path }}"
    key: main.apiKey
    value: "{{ docker_services_nzbhydra2_api }}"
    state: present
  delegate_to: "{{ docker_services_nzbhydra2_fs_host }}"
  run_once: true

- name: NZBHydra2 prep | Replace downloaders list
  no_log: true
  run_once: true
  delegate_to: "{{ docker_services_nzbhydra2_fs_host }}"
  block:
    - name: NZBHydra2 prep | Remove existing downloaders
      yedit:
        src: "{{ docker_services_nzbhydra2_config_path }}"
        key: downloading.downloaders
        state: absent

    - name: NZBHydra2 prep | Write managed downloaders
      yedit:
        src: "{{ docker_services_nzbhydra2_config_path }}"
        key: downloading.downloaders
        value: "{{ docker_services_nzbhydra2_downloaders }}"
        state: present

- name: NZBHydra2 prep | Replace indexers list
  no_log: true
  run_once: true
  delegate_to: "{{ docker_services_nzbhydra2_fs_host }}"
  block:
    - name: NZBHydra2 prep | Remove existing indexers
      yedit:
        src: "{{ docker_services_nzbhydra2_config_path }}"
        key: indexers
        state: absent

    - name: NZBHydra2 prep | Write managed indexers
      yedit:
        src: "{{ docker_services_nzbhydra2_config_path }}"
        key: indexers
        value: "{{ docker_services_nzbhydra2_indexers }}"
        state: present

################################
# PERMS
################################

- name: NZBHydra2 prep | Ensure config file permissions are restricted
  ansible.builtin.file:
    path: "{{ docker_services_nzbhydra2_config_path }}"
    owner: "{{ docker_services_nzbhydra2_puid }}"
    group: "{{ docker_services_nzbhydra2_pgid }}"
    mode: "0640"
    state: file
  delegate_to: "{{ docker_services_nzbhydra2_fs_host }}"
  run_once: true

################################
# ASSERTS (NO SILENT NO-OP)
################################

- name: NZBHydra2 prep | Slurp config
  no_log: true
  ansible.builtin.slurp:
    src: "{{ docker_services_nzbhydra2_config_path }}"
  register: docker_services_nzbhydra2_cfg_raw
  delegate_to: "{{ docker_services_nzbhydra2_fs_host }}"
  run_once: true
  changed_when: false

- name: NZBHydra2 prep | Parse config YAML
  no_log: true
  ansible.builtin.set_fact:
    docker_services_nzbhydra2_cfg: "{{ (docker_services_nzbhydra2_cfg_raw.content | b64decode) | from_yaml }}"
  run_once: true
  changed_when: false

- name: NZBHydra2 prep | Assert API key set
  no_log: true
  ansible.builtin.assert:
    that:
      - docker_services_nzbhydra2_cfg is mapping
      - (docker_services_nzbhydra2_api | string | trim | length) > 0
      - (docker_services_nzbhydra2_cfg.main.apiKey | default('') | string | trim | length) > 0
      - (docker_services_nzbhydra2_cfg.main.apiKey | string | trim) == (docker_services_nzbhydra2_api | string | trim)
    fail_msg: "nzbhydra2_api was not written correctly to main.apiKey in {{ docker_services_nzbhydra2_config_path }}"
  run_once: true

- name: NZBHydra2 prep | Assert SABnzbd downloader is set
  no_log: true
  ansible.builtin.assert:
    that:
      - docker_services_nzbhydra2_cfg is mapping
      - docker_services_nzbhydra2_cfg.downloading is defined
      - docker_services_nzbhydra2_cfg.downloading.downloaders is defined
      - (docker_services_nzbhydra2_cfg.downloading.downloaders | default([])) is sequence
      - (docker_services_nzbhydra2_cfg.downloading.downloaders | length) > 0
      - (docker_services_nzbhydra2_sabnzbd_url | string | trim | length) > 0
      - (docker_services_nzbhydra2_sabnzbd_api | string | trim | length) > 0
      - >-
        (
          docker_services_nzbhydra2_cfg.downloading.downloaders
          | selectattr('url', 'defined')
          | selectattr('apiKey', 'defined')
          | selectattr('url', 'equalto', docker_services_nzbhydra2_sabnzbd_url)
          | selectattr('apiKey', 'equalto', docker_services_nzbhydra2_sabnzbd_api)
          | list
          | length
        ) > 0
    fail_msg: >-
      SABnzbd downloader was not written correctly to
      {{ docker_services_nzbhydra2_config_path }}.
      Expected a downloader entry with url={{ docker_services_nzbhydra2_sabnzbd_url }}
      and the configured API key.
  run_once: true

- name: NZBHydra2 prep | Assert configured indexers were written
  no_log: true
  ansible.builtin.assert:
    that:
      - (docker_services_nzbhydra2_cfg.indexers | default([])) is sequence
      - (docker_services_nzbhydra2_cfg.indexers | length) == docker_services_nzbhydra2_expected_indexer_count
    fail_msg: >-
      Expected {{ docker_services_nzbhydra2_expected_indexer_count }} configured indexers
      in {{ docker_services_nzbhydra2_config_path }}, got
      {{ (docker_services_nzbhydra2_cfg.indexers | default([])) | length }}
  run_once: true
