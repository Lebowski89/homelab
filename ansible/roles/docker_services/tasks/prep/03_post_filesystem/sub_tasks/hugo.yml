---

################################
# HUGO PREP
################################

- name: Hugo prep | Set derived vars
  ansible.builtin.set_fact:
    docker_services_hugo_fs_host: "{{ docker_services_fs_hosts_effective | first }}"
    docker_services_hugo_root_path: >-
      {{ docker_services_svc.paths_blog.root_path }}
    docker_services_hugo_site_path: >-
      {{ docker_services_svc.paths_blog.site_path }}
    docker_services_hugo_theme_path: >-
      {{ docker_services_svc.paths_blog.theme_path }}
    docker_services_hugo_image: "{{ docker_services_svc.image }}"
    docker_services_hugo_github_user: "{{ github_username | default('') }}"
    docker_services_hugo_github_email: "{{ github_email | default('') }}"
  run_once: true

- name: Hugo prep | Assert GitHub identity is set
  ansible.builtin.assert:
    that:
      - docker_services_hugo_github_user | length > 0
      - docker_services_hugo_github_email | length > 0
    fail_msg: >-
      github_username and github_email must be defined for Hugo git setup.
  run_once: true

################################
# SITE (CREATE IF MISSING)
################################

- name: Hugo prep | Check if site exists
  ansible.builtin.stat:
    path: "{{ docker_services_hugo_site_path }}"
  register: docker_services_hugo_site_stat
  delegate_to: "{{ docker_services_hugo_fs_host }}"
  run_once: true

- name: Hugo prep | Generate new Hugo site
  when: not docker_services_hugo_site_stat.stat.exists
  run_once: true
  delegate_to: "{{ docker_services_hugo_fs_host }}"
  block:
    - name: Hugo prep | Run hugo new site
      community.docker.docker_container:
        name: hugo-new-site
        image: "{{ docker_services_hugo_image }}"
        pull: true
        state: started
        container_default_behavior: compatibility
        detach: false
        command: "hugo new site blog"
        volumes:
          - "{{ docker_services_hugo_root_path }}:/src"
        cleanup: true

################################
# GIT (INIT / THEME / REMOTE)
################################

- name: Hugo prep | Check if repo already initialized
  ansible.builtin.stat:
    path: "{{ docker_services_hugo_site_path }}/.git"
  register: docker_services_hugo_git_stat
  delegate_to: "{{ docker_services_hugo_fs_host }}"
  run_once: true

- name: Hugo prep | Init git repo
  when: not docker_services_hugo_git_stat.stat.exists
  ansible.builtin.command:
    cmd: "git init"
    chdir: "{{ docker_services_hugo_site_path }}"
    creates: "{{ docker_services_hugo_site_path }}/.git/config"
  delegate_to: "{{ docker_services_hugo_fs_host }}"
  run_once: true
  changed_when: true
  # noqa: command-instead-of-module

- name: Hugo prep | Set repo git user.name
  community.general.git_config:
    scope: local
    repo: "{{ docker_services_hugo_site_path }}"
    name: user.name
    value: "{{ docker_services_hugo_github_user }}"
  delegate_to: "{{ docker_services_hugo_fs_host }}"
  run_once: true

- name: Hugo prep | Set repo git user.email
  community.general.git_config:
    scope: local
    repo: "{{ docker_services_hugo_site_path }}"
    name: user.email
    value: "{{ docker_services_hugo_github_email }}"
  delegate_to: "{{ docker_services_hugo_fs_host }}"
  run_once: true

- name: Hugo prep | Check if theme submodule exists
  ansible.builtin.stat:
    path: "{{ docker_services_hugo_theme_path }}"
  register: docker_services_hugo_theme_stat
  delegate_to: "{{ docker_services_hugo_fs_host }}"
  run_once: true

- name: Hugo prep | Add Terminal theme submodule
  when: not docker_services_hugo_theme_stat.stat.exists
  ansible.builtin.command:
    cmd: "git submodule add -f https://github.com/panr/hugo-theme-terminal.git themes/terminal"
    chdir: "{{ docker_services_hugo_site_path }}"
    creates: "{{ docker_services_hugo_site_path }}/.gitmodules"
  delegate_to: "{{ docker_services_hugo_fs_host }}"
  run_once: true
  changed_when: true
  # noqa: command-instead-of-module

- name: Hugo prep | Ensure origin remote is set
  community.general.git_config:
    scope: local
    repo: "{{ docker_services_hugo_site_path }}"
    name: remote.origin.url
    value: "git@github.com:{{ docker_services_hugo_github_user }}/blog.git"
  delegate_to: "{{ docker_services_hugo_fs_host }}"
  run_once: true

- name: Hugo prep | Check if repo has any commits
  ansible.builtin.command:
    cmd: "git rev-parse --verify HEAD"
    chdir: "{{ docker_services_hugo_site_path }}"
  register: docker_services_hugo_has_commit
  delegate_to: "{{ docker_services_hugo_fs_host }}"
  run_once: true
  changed_when: false
  failed_when: false
  # noqa: command-instead-of-module

- name: Hugo prep | Initial commit + push
  when: docker_services_hugo_has_commit.rc != 0
  delegate_to: "{{ docker_services_hugo_fs_host }}"
  run_once: true
  block:
    - name: Hugo prep | git add
      ansible.builtin.command:
        cmd: "git add ."
        chdir: "{{ docker_services_hugo_site_path }}"
      changed_when: true
      # noqa: command-instead-of-module

    - name: Hugo prep | git commit
      ansible.builtin.command:
        cmd: "git commit -m 'Initial commit'"
        chdir: "{{ docker_services_hugo_site_path }}"
      changed_when: true
      # noqa: command-instead-of-module

    - name: Hugo prep | Ensure main branch
      ansible.builtin.command:
        cmd: "git branch -M main"
        chdir: "{{ docker_services_hugo_site_path }}"
      changed_when: true
      # noqa: command-instead-of-module

    - name: Hugo prep | git push
      when: (hugo_push | default(false)) | bool
      ansible.builtin.command:
        cmd: "git push -u origin main"
        chdir: "{{ docker_services_hugo_site_path }}"
      changed_when: true
      # noqa: command-instead-of-module
