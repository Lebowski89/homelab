---

################################
# INIT
################################

- name: Init | Include tasks
  ansible.builtin.include_tasks:
    file: _init.yml
    apply:
      tags: [deploy, update, remove, recreate, bootstrap]
  tags: [deploy, update, remove, recreate, bootstrap]

################################
# PREP
################################

- name: Prep | Include tasks
  ansible.builtin.include_tasks: _prep.yml
  tags: [remove, deploy, update, recreate, bootstrap]

################################
# COMPOSE
################################

- name: Compose | Include tasks
  ansible.builtin.include_tasks:
    file: _compose.yml
    apply:
      tags: [deploy, update, recreate]
  tags: [deploy, update, recreate]

################################
# DEPLOY
################################

- name: Deploy | Include tasks
  ansible.builtin.include_tasks:
    file: _deploy.yml
    apply:
      tags: [deploy, update, recreate]
  tags: [deploy, update, recreate]
