---

- name: Configs | Ensure docker_services_service_name is set
  ansible.builtin.assert:
    that:
      - docker_services_service_name is defined
      - docker_services_service_name | string | trim | length > 0
    fail_msg: "docker_services_service_name must be set before the configs sub-tasks"

- name: Configs | Ensure configs_list is a list
  ansible.builtin.assert:
    that:
      - configs_list is defined
      - configs_list is sequence
      - configs_list is not string
      - configs_list | length > 0
    fail_msg: "configs_list must be a non-empty list of config mount specs."

- name: Configs | Resolve effective config sources
  ansible.builtin.set_fact:
    docker_services_configs_list_effective: >-
      {%- set out = [] -%}
      {%- for cfg in configs_list -%}
      {%- set cfg_source = cfg.source | default('') | string | trim -%}
      {%- set cfg_source_effective =
            (
              docker_services_swarm_configs_effective[cfg_source].effective_name
              if (
                docker_services_swarm_configs_effective is defined
                and cfg_source in docker_services_swarm_configs_effective
                and (docker_services_swarm_configs_effective[cfg_source].state | default('present')) == 'present'
              )
              else cfg_source
            )
      -%}
      {%- set cfg_effective = cfg | combine({'source': cfg_source_effective}, recursive=true) -%}
      {%- set _ = out.append(cfg_effective) -%}
      {%- endfor -%}
      {{ out }}

- name: Configs | Attach configs to service (replace)
  ansible.builtin.set_fact:
    docker_services_compose_services: >-
      {{
        (docker_services_compose_services | default({}))
        | combine({
            docker_services_service_name: (
              (docker_services_compose_services | default({})).get(docker_services_service_name, {})
              | combine({
                  'configs': docker_services_configs_list_effective
                }, recursive=true)
            )
          }, recursive=true)
      }}
