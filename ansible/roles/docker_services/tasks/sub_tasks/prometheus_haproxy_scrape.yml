---

- name: Prometheus scrape | Resolve canonical configuration path and HAProxy target
  ansible.builtin.set_fact:
    docker_services_prometheus_scrape_file: >-
      {{ (docker_services_prometheus_catalog.prometheus.templates |
          selectattr('src', 'equalto', 'configs/prometheus/prometheus.yml.j2') | first).dest }}
    docker_services_prometheus_scrape_job: >-
      {{ (lookup('ansible.builtin.template',
                 playbook_dir ~ '/roles/service_common/templates/configs/prometheus/haproxy-scrape.yml.j2') | from_yaml)[0] }}
    docker_services_prometheus_scrape_pattern: '(?ms)^  - job_name: (?:"haproxy"|haproxy)\n.*?(?=^  - job_name:|\Z)'
  vars:
    # The live scope below must prove this current Docker runtime; the catalogue
    # continues to declare the future Podman deployment independently.
    service_common_service:
      runtime: docker

- name: Prometheus scrape | Validate the target against the mgt HAProxy publication
  ansible.builtin.assert:
    that:
      - docker_services_haproxy_catalog.haproxy.targets.mgt.ports.metrics.published == 18405
      - docker_services_haproxy_catalog.haproxy.targets.mgt.ports.metrics.target == 8405
      - docker_services_prometheus_scrape_job.job_name == 'haproxy'
      - docker_services_prometheus_scrape_job.static_configs[0].targets == [local_ip ~ ':18405']
      - docker_services_prometheus_scrape_job.static_configs[1].targets == ['haproxy:8405']

- name: Prometheus scrape | Resolve exactly the running Swarm caller
  ansible.builtin.command:
    argv: [docker, --host, 'unix:///var/run/docker.sock', ps, --no-trunc, --filter,
           'label=com.docker.swarm.service.name=prometheus_prometheus', --format, '{{ "{{.ID}}" }}']
  register: docker_services_prometheus_scrape_ids
  changed_when: false
  check_mode: false

- name: Prometheus scrape | Reject absent or ambiguous live callers
  ansible.builtin.assert:
    that:
      - docker_services_prometheus_scrape_ids.stdout_lines | length == 1
      - docker_services_prometheus_scrape_ids.stdout is match('^[a-f0-9]{64}$')
    fail_msg: Exactly one current prometheus_prometheus Swarm container is required; no runtime migration is performed.

- name: Prometheus scrape | Project the exact caller and configuration mount without environments
  ansible.builtin.command:
    argv:
      - docker
      - --host
      - unix:///var/run/docker.sock
      - inspect
      - --format
      - >-
        {{ '{{ $managed := false }}{{ range .Config.Cmd }}{{ if eq . "--config.file=/etc/prometheus/prometheus.yml" }}{{ $managed = true }}{{ end }}{{ end }}{"id":{{json .Id}},"pid":{{.State.Pid}},"running":{{json .State.Running}},"managed_config":{{json $managed}},"service":{{json (index .Config.Labels "com.docker.swarm.service.name")}},"mounts":{{json .Mounts}}}' }}
      - "{{ docker_services_prometheus_scrape_ids.stdout }}"
  register: docker_services_prometheus_scrape_inspect
  changed_when: false
  check_mode: false

- name: Prometheus scrape | Require the inventory-owned configuration bind
  ansible.builtin.assert:
    that:
      - docker_services_prometheus_scrape_container.id == docker_services_prometheus_scrape_ids.stdout
      - docker_services_prometheus_scrape_container.running is sameas true
      - docker_services_prometheus_scrape_container.pid is integer
      - docker_services_prometheus_scrape_container.pid > 0
      - docker_services_prometheus_scrape_container.managed_config is sameas true
      - docker_services_prometheus_scrape_container.service == 'prometheus_prometheus'
      - docker_services_prometheus_scrape_mounts | length == 1
      - docker_services_prometheus_scrape_mounts[0].Type == 'bind'
      - docker_services_prometheus_scrape_mounts[0].Source == docker_services_prometheus_scrape_file | dirname
      - docker_services_prometheus_scrape_mounts[0].RW is sameas false
    fail_msg: The current Swarm caller must mount the declared configuration directory read-only; stop on any mismatch.
  vars:
    docker_services_prometheus_scrape_container: "{{ docker_services_prometheus_scrape_inspect.stdout | from_json }}"
    docker_services_prometheus_scrape_mounts: >-
      {{ docker_services_prometheus_scrape_container.mounts | selectattr('Destination', 'equalto', '/etc/prometheus') | list }}

- name: Prometheus scrape | Inspect existing configuration ownership
  ansible.builtin.stat:
    path: "{{ docker_services_prometheus_scrape_file }}"
    follow: false
  register: docker_services_prometheus_scrape_stat

- name: Prometheus scrape | Require the existing regular managed file
  ansible.builtin.assert:
    that:
      - docker_services_prometheus_scrape_stat.stat.isreg | default(false)
      - not docker_services_prometheus_scrape_stat.stat.islnk | default(false)
    fail_msg: The existing managed Prometheus configuration must be a regular file; do not create or repair it here.

- name: Prometheus scrape | Read the managed configuration privately
  ansible.builtin.slurp:
    src: "{{ docker_services_prometheus_scrape_file }}"
  register: docker_services_prometheus_scrape_source
  no_log: true
  diff: false

- name: Prometheus scrape | Resolve only the existing HAProxy job
  ansible.builtin.set_fact:
    docker_services_prometheus_scrape_current: >-
      {{ ((docker_services_prometheus_scrape_source.content | b64decode | from_yaml).scrape_configs |
          selectattr('job_name', 'equalto', 'haproxy') | list) }}
  no_log: true
  diff: false

- name: Prometheus scrape | Reject ambiguous or custom target relabelling before writes
  ansible.builtin.assert:
    that:
      - docker_services_prometheus_scrape_current | length == 1
      - (docker_services_prometheus_scrape_source.content | b64decode |
         regex_findall(docker_services_prometheus_scrape_pattern)) | length == 1
      - docker_services_prometheus_scrape_current[0].metrics_path | default('/metrics') == '/metrics'
      - docker_services_prometheus_scrape_current[0].scheme | default('http') == 'http'
      - docker_services_prometheus_scrape_current[0].relabel_configs | default([]) | length == 0
      - '''haproxy:8405'' in (docker_services_prometheus_scrape_current[0].static_configs | map(attribute=''targets'') | flatten)'
    fail_msg: One managed HAProxy job with the working Swarm target and no target relabelling is required.
  no_log: true
  diff: false

- name: Prometheus scrape | Append only the canonical mgt target and retain every existing job option
  ansible.builtin.set_fact:
    docker_services_prometheus_scrape_desired: >-
      {{ docker_services_prometheus_scrape_current[0] | combine({'static_configs':
         docker_services_prometheus_scrape_current[0].static_configs +
         ([docker_services_prometheus_scrape_job.static_configs[0]] if
          docker_services_prometheus_scrape_job.static_configs[0].targets[0] not in
          (docker_services_prometheus_scrape_current[0].static_configs | map(attribute='targets') | flatten) else [])}) }}
  no_log: true
  diff: false

- name: Prometheus scrape | Require the exact default instance label for the mgt target
  ansible.builtin.assert:
    that:
      - docker_services_prometheus_scrape_mgt | length == 1
      - docker_services_prometheus_scrape_mgt[0].labels.instance | default(local_ip ~ ':18405') == local_ip ~ ':18405'
      - docker_services_prometheus_scrape_mgt[0].labels.job | default('haproxy') == 'haproxy'
    fail_msg: The mgt target must have exactly the required instance and job labels.
  vars:
    docker_services_prometheus_scrape_mgt: >-
      {{ docker_services_prometheus_scrape_desired.static_configs |
         selectattr('targets', 'contains', local_ip ~ ':18405') | list }}
  no_log: true
  diff: false

- name: Prometheus scrape | Build a candidate changing only the HAProxy job block
  ansible.builtin.set_fact:
    docker_services_prometheus_scrape_candidate: >-
      {{ docker_services_prometheus_scrape_source.content | b64decode |
         regex_replace(docker_services_prometheus_scrape_pattern,
                       ([docker_services_prometheus_scrape_desired] | to_nice_yaml(indent=2, sort_keys=false) | indent(2, true)) ~ '\n') }}
  no_log: true
  diff: false

- name: Prometheus scrape | Show the configuration-only plan
  ansible.builtin.debug:
    msg: >-
      Preserve haproxy:8405 and add {{ local_ip }}:18405 under job=haproxy using
      {{ docker_services_prometheus_scrape_file }}. Validate with the current container's promtool,
      preserve ownership/mode, and reload only that exact Prometheus container with SIGHUP.

- name: Prometheus scrape | Resolve the read-only live configuration query
  ansible.builtin.set_fact:
    docker_services_prometheus_scrape_query:
      - nsenter
      - --target
      - "{{ (docker_services_prometheus_scrape_inspect.stdout | from_json).pid | string }}"
      - --net
      - /usr/bin/python3
      - -c
      - >-
        import json, urllib.request;
        opener=urllib.request.build_opener(urllib.request.ProxyHandler({}));
        response=json.load(opener.open('http://127.0.0.1:9090/api/v1/status/config', timeout=5));
        assert response['status']=='success';
        print(response['data']['yaml'])

- name: Prometheus scrape | Reset this invocation's recovery state
  ansible.builtin.set_fact:
    docker_services_prometheus_scrape_applied: {}
    docker_services_prometheus_scrape_recovery_failed: false
    docker_services_prometheus_scrape_temporary: {}

- name: Prometheus scrape | Validate apply and reload without replacement
  when: not ansible_check_mode
  block:
    - name: Prometheus scrape | Inspect loaded configuration without exposing it
      ansible.builtin.command:
        argv: "{{ docker_services_prometheus_scrape_query }}"
      register: docker_services_prometheus_scrape_loaded
      changed_when: false
      no_log: true
      diff: false

    - name: Prometheus scrape | Create an exact temporary candidate in the existing configuration mount
      ansible.builtin.tempfile:
        state: file
        path: "{{ docker_services_prometheus_scrape_file | dirname }}"
        prefix: .skynet-haproxy-scrape-
        suffix: .yml
      register: docker_services_prometheus_scrape_temporary

    - name: Prometheus scrape | Populate the private candidate for the current promtool
      ansible.builtin.copy:
        content: "{{ docker_services_prometheus_scrape_candidate }}"
        dest: "{{ docker_services_prometheus_scrape_temporary.path }}"
        owner: "{{ docker_services_prometheus_scrape_stat.stat.uid }}"
        group: "{{ docker_services_prometheus_scrape_stat.stat.gid }}"
        mode: "{{ docker_services_prometheus_scrape_stat.stat.mode }}"
      no_log: true
      diff: false

    - name: Prometheus scrape | Validate using the existing image without pulls or new containers
      ansible.builtin.command:
        argv: [docker, --host, 'unix:///var/run/docker.sock', exec, '{{ docker_services_prometheus_scrape_ids.stdout }}',
               /bin/promtool, check, config, '/etc/prometheus/{{ docker_services_prometheus_scrape_temporary.path | basename }}']
      changed_when: false
      no_log: true
      diff: false

    - name: Prometheus scrape | Reject a concurrent configuration edit
      ansible.builtin.stat:
        path: "{{ docker_services_prometheus_scrape_file }}"
      register: docker_services_prometheus_scrape_before_write

    - name: Prometheus scrape | Require the original file before applying
      ansible.builtin.assert:
        that:
          - docker_services_prometheus_scrape_source.content | b64decode | hash('sha1') == docker_services_prometheus_scrape_stat.stat.checksum
          - docker_services_prometheus_scrape_before_write.stat.isreg | default(false)
          - not docker_services_prometheus_scrape_before_write.stat.islnk | default(false)
          - docker_services_prometheus_scrape_before_write.stat.dev == docker_services_prometheus_scrape_stat.stat.dev
          - docker_services_prometheus_scrape_before_write.stat.inode == docker_services_prometheus_scrape_stat.stat.inode
          - docker_services_prometheus_scrape_before_write.stat.checksum == docker_services_prometheus_scrape_stat.stat.checksum
          - docker_services_prometheus_scrape_before_write.stat.uid == docker_services_prometheus_scrape_stat.stat.uid
          - docker_services_prometheus_scrape_before_write.stat.gid == docker_services_prometheus_scrape_stat.stat.gid
          - docker_services_prometheus_scrape_before_write.stat.mode == docker_services_prometheus_scrape_stat.stat.mode

    - name: Prometheus scrape | Verify original runtime identity before applying
      ansible.builtin.import_tasks: prometheus_haproxy_identity.yml

    - name: Prometheus scrape | Apply only the validated configuration and save its backup
      ansible.builtin.copy:
        content: "{{ docker_services_prometheus_scrape_candidate }}"
        dest: "{{ docker_services_prometheus_scrape_file }}"
        owner: "{{ docker_services_prometheus_scrape_stat.stat.uid }}"
        group: "{{ docker_services_prometheus_scrape_stat.stat.gid }}"
        mode: "{{ docker_services_prometheus_scrape_stat.stat.mode }}"
        backup: true
      register: docker_services_prometheus_scrape_applied
      no_log: true
      diff: false

    - name: Prometheus scrape | Report the scoped configuration backup
      ansible.builtin.debug:
        msg: "Configuration backup: {{ docker_services_prometheus_scrape_applied.backup_file | default('unchanged file') }}"

    - name: Prometheus scrape | Record the file written by this invocation
      ansible.builtin.stat:
        path: "{{ docker_services_prometheus_scrape_file }}"
        follow: false
        checksum_algorithm: sha256
      register: docker_services_prometheus_scrape_written

    - name: Prometheus scrape | Require the written candidate before reloading
      ansible.builtin.assert:
        that:
          - docker_services_prometheus_scrape_written.stat.isreg | default(false)
          - not docker_services_prometheus_scrape_written.stat.islnk | default(false)
          - docker_services_prometheus_scrape_written.stat.checksum == docker_services_prometheus_scrape_candidate | hash('sha256')
          - docker_services_prometheus_scrape_written.stat.uid == docker_services_prometheus_scrape_stat.stat.uid
          - docker_services_prometheus_scrape_written.stat.gid == docker_services_prometheus_scrape_stat.stat.gid
          - docker_services_prometheus_scrape_written.stat.mode == docker_services_prometheus_scrape_stat.stat.mode

    - name: Prometheus scrape | Verify original runtime identity before reload
      ansible.builtin.import_tasks: prometheus_haproxy_identity.yml

    # A direct task failure enters this block's rescue; flush_handlers does not.
    - name: Prometheus scrape | Reload only the verified original container
      when: >-
        docker_services_prometheus_scrape_applied.changed or
        local_ip ~ ':18405' not in
        ((docker_services_prometheus_scrape_loaded.stdout | from_yaml).scrape_configs |
         selectattr('job_name', 'equalto', 'haproxy') | map(attribute='static_configs') |
         flatten | map(attribute='targets') | flatten)
      ansible.builtin.command:
        argv: [docker, --host, 'unix:///var/run/docker.sock', kill, --signal, HUP, '{{ docker_services_prometheus_scrape_ids.stdout }}']
      changed_when: true

    - name: Prometheus scrape | Require both targets in the freshly loaded configuration
      ansible.builtin.command:
        argv: "{{ docker_services_prometheus_scrape_query }}"
      register: docker_services_prometheus_scrape_reloaded
      changed_when: false
      until: >-
        docker_services_prometheus_scrape_reloaded.rc == 0 and
        local_ip ~ ':18405' in
        ((docker_services_prometheus_scrape_reloaded.stdout | from_yaml).scrape_configs |
         selectattr('job_name', 'equalto', 'haproxy') | map(attribute='static_configs') |
         flatten | map(attribute='targets') | flatten) and
        'haproxy:8405' in
        ((docker_services_prometheus_scrape_reloaded.stdout | from_yaml).scrape_configs |
         selectattr('job_name', 'equalto', 'haproxy') | map(attribute='static_configs') |
         flatten | map(attribute='targets') | flatten)
      retries: 5
      delay: 1
      no_log: true
      diff: false

    - name: Prometheus scrape | Verify original runtime identity after loaded configuration
      ansible.builtin.import_tasks: prometheus_haproxy_identity.yml

  rescue:
    - name: Prometheus scrape | Save the original failed task without configuration values
      ansible.builtin.set_fact:
        docker_services_prometheus_scrape_failure_task: "{{ ansible_failed_task.name }}"
      no_log: true
      diff: false

    # Recovery must remain inside rescue; a failed handler cannot be rescued here.
    - name: Prometheus scrape | Recover only this invocation's configuration change
      when: docker_services_prometheus_scrape_applied.changed | default(false)  # noqa: no-handler
      block:
        - name: Prometheus scrape | Verify original runtime identity before recovery
          ansible.builtin.import_tasks: prometheus_haproxy_identity.yml

        - name: Prometheus scrape | Restore the verified baseline unless a concurrent edit intervened
          ansible.builtin.command:
            argv: [/usr/bin/python3, -c, "{{ lookup('ansible.builtin.file', playbook_dir ~ '/roles/docker_services/files/prometheus_scrape_restore.py') }}"]
            stdin: >-
              {{ {'path': docker_services_prometheus_scrape_file,
                  'backup': docker_services_prometheus_scrape_applied.backup_file,
                  'baseline_sha256': (docker_services_prometheus_scrape_source.content | b64decode | hash('sha256')),
                  'candidate_sha256': (docker_services_prometheus_scrape_candidate | hash('sha256')),
                  'uid': docker_services_prometheus_scrape_stat.stat.uid,
                  'gid': docker_services_prometheus_scrape_stat.stat.gid,
                  'mode': docker_services_prometheus_scrape_stat.stat.mode,
                  'dev': docker_services_prometheus_scrape_written.stat.dev,
                  'inode': docker_services_prometheus_scrape_written.stat.inode,
                  'mtime': docker_services_prometheus_scrape_written.stat.mtime} | to_json }}
            expand_argument_vars: false
          register: docker_services_prometheus_scrape_restored
          changed_when: (docker_services_prometheus_scrape_restored.stdout | from_json).changed
          no_log: true
          diff: false

        - name: Prometheus scrape | Verify original runtime identity before recovery reload
          ansible.builtin.import_tasks: prometheus_haproxy_identity.yml

        - name: Prometheus scrape | Reload the verified original container with its baseline
          ansible.builtin.command:
            argv: [docker, --host, 'unix:///var/run/docker.sock', kill, --signal, HUP, '{{ docker_services_prometheus_scrape_ids.stdout }}']
          changed_when: true

        - name: Prometheus scrape | Verify the original loaded baseline after recovery
          ansible.builtin.command:
            argv: "{{ docker_services_prometheus_scrape_query }}"
          register: docker_services_prometheus_scrape_recovered
          changed_when: false
          until: >-
            docker_services_prometheus_scrape_recovered.rc == 0 and
            (docker_services_prometheus_scrape_recovered.stdout | from_yaml) ==
            (docker_services_prometheus_scrape_loaded.stdout | from_yaml)
          retries: 5
          delay: 1
          no_log: true
          diff: false

        - name: Prometheus scrape | Verify original runtime identity after recovery
          ansible.builtin.import_tasks: prometheus_haproxy_identity.yml
      rescue:
        - name: Prometheus scrape | Record failed recovery without hiding the original failure
          ansible.builtin.set_fact:
            docker_services_prometheus_scrape_recovery_failed: true

        - name: Prometheus scrape | Report retained recovery material
          ansible.builtin.debug:
            msg: >-
              Recovery failed or was unsafe at {{ ansible_failed_task.name }}.
              Retained baseline {{ docker_services_prometheus_scrape_applied.backup_file | default('unavailable') }}
              and candidate {{ docker_services_prometheus_scrape_temporary.path | default('unavailable') }}.
              Do not overwrite concurrent edits or signal a replacement container.
              Inspect the original failure and these private files before scoped recovery.

    - name: Prometheus scrape | Return failure after scoped recovery
      ansible.builtin.fail:
        msg: >-
          Scrape update failed at {{ docker_services_prometheus_scrape_failure_task }}.
          Invocation changed the file: {{ docker_services_prometheus_scrape_applied.changed | default(false) }}.
          Recovery failed or was unsafe: {{ docker_services_prometheus_scrape_recovery_failed }}.
          Baseline backup: {{ docker_services_prometheus_scrape_applied.backup_file | default('no file change') }}.
          See the original failure above; no replacement runtime was signalled.

  always:
    - name: Prometheus scrape | Remove only this invocation's temporary candidate
      when:
        - docker_services_prometheus_scrape_temporary.path is defined
        - not docker_services_prometheus_scrape_recovery_failed
      ansible.builtin.file:
        path: "{{ docker_services_prometheus_scrape_temporary.path }}"
        state: absent
