---

- name: Deploy stack | Validate stack settings
  ansible.builtin.assert:
    that:
      - docker_services_deploy_stack_name is defined
      - docker_services_deploy_stack_name | string | trim | length > 0
      - docker_services_deploy_stack_type is defined
      - (docker_services_deploy_stack_type | string | trim) in ['swarm', 'container']
      - docker_services_compose_services is mapping
      - docker_services_stack_networks is mapping
      - docker_services_stack_volumes is mapping
    fail_msg: "Invalid deploy inputs for stack={{ docker_services_deploy_stack_name | default('UNSET') }}"

- name: Deploy stack | Choose deploy host
  ansible.builtin.set_fact:
    docker_services_deploy_stack_host_effective: >-
      {{
        docker_services_primary_manager
        if (docker_services_deploy_stack_type | string | trim) == 'swarm'
        else (docker_services_deploy_stack_host | default(docker_services_primary_manager, true) | string | trim)
      }}

- name: Deploy stack | Prepare the protected stack configuration
  block:
    - name: Deploy stack | Ensure stack directory exists
      ansible.builtin.file:
        path: /opt/stacks
        state: directory
        owner: "{{ hostvars[docker_services_deploy_stack_host_effective].container_host_puid | default('1000') }}"
        group: "{{ hostvars[docker_services_deploy_stack_host_effective].container_host_pgid | default('1000') }}"
        mode: "0700"
      delegate_to: "{{ docker_services_deploy_stack_host_effective }}"

    - name: Deploy stack | Render stack file
      no_log: true
      diff: false
      ansible.builtin.template:
        src: "{{ playbook_dir }}/roles/docker_services/templates/compose.yml.j2"
        dest: >-
          {{
            '/opt/stacks/' ~ docker_services_deploy_stack_name ~
            ( '-stack.yml' if (docker_services_deploy_stack_type | string | trim) == 'swarm' else '-compose.yml' )
          }}
        owner: "{{ hostvars[docker_services_deploy_stack_host_effective].container_host_puid | default('1000') }}"
        group: "{{ hostvars[docker_services_deploy_stack_host_effective].container_host_pgid | default('1000') }}"
        mode: "0600"
        force: true
      vars:
        deploy_stack_type: "{{ docker_services_deploy_stack_type }}"
        stack_networks: "{{ docker_services_stack_networks }}"
        stack_volumes: "{{ docker_services_stack_volumes }}"
      delegate_to: "{{ docker_services_deploy_stack_host_effective }}"

  rescue:
    - name: Deploy stack | Release only preparation reservations with protection retained
      tags: [always]
      ansible.builtin.include_role:
        name: service_firewall
        tasks_from: lifecycle
        apply:
          tags: [deploy, update, recreate]
          ignore_errors: true
      vars:
        service_firewall_adapter_plan: "{{ docker_services_firewall_entry.value }}"
        service_firewall_lifecycle_phase: cancel
      loop: "{{ (_stack_def.firewall_plans | default({})) | dict2items }}"
      loop_control:
        loop_var: docker_services_firewall_entry

    - name: Deploy stack | Report configuration preparation failure
      tags: [always]
      ansible.builtin.fail:
        msg: Stack configuration preparation failed before deployment. Existing writers, data and staged protection were retained; see the original failure above.

- name: Deploy stack | Deploy and verify protected services
  block:
    - name: Deploy stack | Deploy Swarm stack
      when: (docker_services_deploy_stack_type | string | trim) == 'swarm'
      community.docker.docker_stack:
        state: present
        name: "{{ docker_services_deploy_stack_name }}"
        compose:
          - "/opt/stacks/{{ docker_services_deploy_stack_name }}-stack.yml"
      delegate_to: "{{ docker_services_deploy_stack_host_effective }}"

    - name: Deploy stack | Deploy Compose project
      when: (docker_services_deploy_stack_type | string | trim) != 'swarm'
      community.docker.docker_compose_v2:
        project_src: /opt/stacks
        project_name: "{{ docker_services_deploy_stack_name }}"
        files: "{{ docker_services_deploy_stack_name }}-compose.yml"
        state: present
      delegate_to: "{{ docker_services_deploy_stack_host_effective }}"

    - name: Deploy stack | Verify current Swarm publications and placement
      when: docker_services_deploy_stack_type == 'swarm'
      service_operational_check:
        phase: runtime
        metadata: "{{ docker_services_firewall_entry.value.metadata }}"
      delegate_to: "{{ docker_services_deploy_stack_host_effective }}"
      loop: "{{ (_stack_def.firewall_plans | default({})) | dict2items }}"
      loop_control:
        loop_var: docker_services_firewall_entry
      register: docker_services_publication_status
      until: docker_services_publication_status.managed | default(false)
      retries: 30
      delay: 2

    - name: Deploy stack | Reconcile protection after each service starts
      ansible.builtin.include_role:
        name: service_firewall
        tasks_from: lifecycle
        apply:
          tags: [deploy, update, recreate]
      vars:
        service_firewall_adapter_plan: "{{ docker_services_firewall_entry.value }}"
        service_firewall_lifecycle_phase: finish
      loop: "{{ (_stack_def.firewall_plans | default({})) | dict2items }}"
      loop_control:
        loop_var: docker_services_firewall_entry
      tags: [deploy, update, recreate]
  rescue:
    - name: Deploy stack | Save the original deployment failure
      tags: [always]
      ansible.builtin.set_fact:
        docker_services_lifecycle_failure:
          task: "{{ ansible_failed_task.name }}"
          rc: "{{ ansible_failed_result.rc | default(1) }}"
      no_log: true
      diff: false

    - name: Deploy stack | Stop only the selected protected Swarm service after failure
      tags: [always]
      when: docker_services_deploy_stack_type == 'swarm'
      ansible.builtin.command:
        argv:
          - docker
          - --host
          - unix:///var/run/docker.sock
          - service
          - scale
          - "{{ docker_services_firewall_entry.value.runtime.binding.selector }}=0"
      delegate_to: "{{ docker_services_deploy_stack_host_effective }}"
      loop: "{{ (_stack_def.firewall_plans | default({})) | dict2items }}"
      loop_control:
        loop_var: docker_services_firewall_entry
      register: docker_services_lifecycle_swarm_stop
      failed_when: false
      changed_when: docker_services_lifecycle_swarm_stop.rc == 0

    - name: Deploy stack | Stop only the selected protected Compose service after failure
      tags: [always]
      when: docker_services_deploy_stack_type == 'container'
      community.docker.docker_compose_v2:
        project_src: /opt/stacks
        project_name: "{{ docker_services_deploy_stack_name }}"
        files: "{{ docker_services_deploy_stack_name }}-compose.yml"
        services: ["{{ docker_services_firewall_entry.value.runtime.service }}"]
        state: stopped
      delegate_to: "{{ docker_services_deploy_stack_host_effective }}"
      loop: "{{ (_stack_def.firewall_plans | default({})) | dict2items }}"
      loop_control:
        loop_var: docker_services_firewall_entry
      register: docker_services_lifecycle_compose_stop
      ignore_errors: true

    - name: Deploy stack | Retain protection and release only stopped operations
      tags: [always]
      ansible.builtin.include_role:
        name: service_firewall
        tasks_from: lifecycle
        apply:
          tags: [deploy, update, recreate]
          ignore_errors: true
      vars:
        service_firewall_adapter_plan: "{{ docker_services_firewall_entry.value }}"
        service_firewall_lifecycle_phase: abort
      loop: "{{ (_stack_def.firewall_plans | default({})) | dict2items }}"
      loop_control:
        loop_var: docker_services_firewall_entry

    - name: Deploy stack | Report the original failure without restoring an old policy
      tags: [always]
      ansible.builtin.fail:
        msg: >-
          Stack {{ docker_services_deploy_stack_name }} failed. Scoped replacement stops were attempted;
          inspect their results above. Staged protection, data and unrelated services were retained.
          Original failure: {{ docker_services_lifecycle_failure.task }} (status {{ docker_services_lifecycle_failure.rc }}), as reported above.
