---

- name: Initialize | Accept legacy role variable names
  ansible.builtin.set_fact:
    docker_services_service_cfg: "{{ docker_services_service_cfg | default(service_cfg, true) }}"
    docker_services_service_target: "{{ docker_services_service_target | default(service_target, true) }}"
    docker_services_role_prefix: "{{ docker_services_role_prefix | default(role_prefix, true) }}"
    docker_services_service_cfg_found: "{{ docker_services_service_cfg_found | default(service_cfg_found, true) }}"
  tags: [remove, drift]

- name: Initialize | Validate service configuration input
  ansible.builtin.assert:
    that:
      - docker_services_service_cfg is defined
      - docker_services_service_cfg is mapping
      - docker_services_service_cfg.targets is not defined
    fail_msg: >-
      docker_services requires a catalog-resolved docker_services_service_cfg mapping
      without a targets key.
  tags: [remove, drift]

- name: Initialize | Load service configuration
  ansible.builtin.set_fact:
    docker_services_svc: "{{ docker_services_service_cfg }}"
  tags: [remove, drift]

- name: Initialize | Validate shared service context
  no_log: true
  diff: false
  ansible.builtin.assert:
    that:
      - docker_services_common_context is defined
      - docker_services_common_context is mapping
      - docker_services_common_context.runtime == 'docker'
      - docker_services_common_context.dispatch_host == inventory_hostname
      - docker_services_common_context.controller_host in hostvars
      - docker_services_common_context.service_name == docker_services_role_prefix
      - docker_services_common_context.lookup_values is mapping
      - docker_services_common_context.resolved_environment is mapping
      - docker_services_common_context.secret_declarations is sequence
    fail_msg: "docker_services requires the current dispatch host's validated common service context."
  tags: [deploy, update, remove, recreate, bootstrap, drift]

- name: Initialize | Reset per-service state
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    docker_services_common_values: {}
    docker_services_secret_declarations: []
    docker_services_resolved_environment: {}
    docker_services_controller_host: ""
    docker_services_application_template_vars: {}
    docker_services_application_secret_values: {}
    docker_services_application_secret_declarations: []
    docker_services_application_bootstrap_requests: {}
  tags: [deploy, update, remove, recreate, bootstrap, drift]

- name: Initialize | Load shared service context
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    docker_services_common_values: "{{ docker_services_common_context.lookup_values }}"
    docker_services_secret_declarations: "{{ docker_services_common_context.secret_declarations }}"
    docker_services_resolved_environment: "{{ docker_services_common_context.resolved_environment }}"
    docker_services_controller_host: "{{ docker_services_common_context.controller_host }}"
  tags: [deploy, update, remove, recreate, bootstrap, drift]

- name: Initialize | Validate Docker secret attachments
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    docker_services_secret_attachments_validated: >-
      {{
        docker_services_svc.secrets
        | default([])
        | docker_services_secret_attachments(
            docker_services_secret_declarations,
            (docker_services_svc.deploy | default({})).type | default('swarm', true)
          )
      }}
  tags: [deploy, update, recreate, bootstrap]

- name: Initialize | Add resolved environment to service
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    docker_services_svc: >-
      {{ docker_services_svc | combine({'environment': docker_services_resolved_environment}, recursive=false) }}
  tags: [deploy, update, remove, recreate, bootstrap, drift]

- name: Initialize | Decide whether service schema validation is needed
  ansible.builtin.set_fact:
    docker_services_validate_enabled: >-
      {{
        docker_services_validate
        | default(
            (
              ansible_check_mode
              or ('bootstrap' in (ansible_run_tags | default([])))
            ),
            true
          )
        | bool
      }}
  tags: [remove, drift]

- name: Initialize | Validate service schema
  when: docker_services_validate_enabled | bool
  ansible.builtin.include_tasks: sub_tasks/validate/service.yml

- name: Initialize | Set service name, deploy type, deploy host, and action
  ansible.builtin.set_fact:
    docker_services_service_name: >-
      {{ docker_services_svc.name | default(docker_services_role_prefix, true) | string | trim }}
    docker_services_stack_deploy_type: >-
      {{ docker_services_svc.deploy.type | default('swarm', true) | string | trim }}
    docker_services_deploy_host: "{{ docker_services_svc.deploy.host | default(docker_services_primary_manager, true) }}"
    docker_services_common_action: >-
      {{
        'remove' if 'remove' in (ansible_run_tags | default([])) else
        ('recreate' if 'recreate' in (ansible_run_tags | default([])) else
        ('update' if 'update' in (ansible_run_tags | default([])) else
        ('drift' if 'drift' in (ansible_run_tags | default([])) else
        ('bootstrap' if 'bootstrap' in (ansible_run_tags | default([])) else 'deploy'))))
      }}
  tags: [remove, drift]

- name: Initialize | Set stack name
  ansible.builtin.set_fact:
    docker_services_stack_name: >-
      {{ docker_services_svc.stack | default(docker_services_service_name, true) | string | trim }}
  tags: [remove, drift]

- name: Initialize | Choose deploy host
  ansible.builtin.set_fact:
    docker_services_deploy_host_effective: >-
      {{
        docker_services_primary_manager
        if (docker_services_stack_deploy_type | string | trim) == 'swarm'
        else (docker_services_deploy_host | default(docker_services_primary_manager, true) | string | trim)
      }}
  tags: [remove, drift]

- name: Initialize | Choose stack key
  ansible.builtin.set_fact:
    docker_services_stack_name_effective: >-
      {{
        docker_services_stack_name
        if (docker_services_stack_deploy_type | string | trim) == 'swarm'
        else (docker_services_stack_name ~ '-' ~ docker_services_deploy_host_effective)
      }}
  tags: [remove, drift]

- name: Initialize | Choose filesystem hosts
  ansible.builtin.set_fact:
    docker_services_fs_hosts_effective: >-
      {{
        docker_services_deploy_host
        if (docker_services_deploy_host is sequence and docker_services_deploy_host is not string)
        else [ (docker_services_deploy_host | default(docker_services_primary_manager, true) | string | trim) ]
      }}
  tags: [remove, drift]

- name: Initialize | Expand filesystem host group
  when:
    - docker_services_fs_hosts_effective | length == 1
    - docker_services_fs_hosts_effective[0] in groups
  ansible.builtin.set_fact:
    docker_services_fs_hosts_effective: "{{ groups[docker_services_fs_hosts_effective[0]] | list }}"
  tags: [remove, drift]

- name: Initialize | Remove duplicate filesystem hosts
  ansible.builtin.set_fact:
    docker_services_fs_hosts_effective: "{{ docker_services_fs_hosts_effective | unique | list }}"
  tags: [remove, drift]

- name: Initialize | Validate filesystem hosts
  ansible.builtin.assert:
    that:
      - docker_services_fs_host is string
      - docker_services_fs_host | trim | length > 0
      - docker_services_fs_host in hostvars
      - docker_services_fs_host in ansible_play_hosts_all
    fail_msg: >-
      Docker service filesystem hosts must be non-empty hosts in the active inventory play.
  loop: "{{ docker_services_fs_hosts_effective }}"
  loop_control:
    loop_var: docker_services_fs_host
    label: "{{ docker_services_fs_host | default('EMPTY') }}"
  tags: [remove, drift]

- name: Initialize | Reset container host defaults
  ansible.builtin.set_fact:
    docker_services_common_host_defaults: {}
  tags: [remove, drift]

- name: Initialize | Build container host defaults
  ansible.builtin.set_fact:
    docker_services_common_host_defaults: >-
      {{
        docker_services_common_host_defaults
        | combine({
            docker_services_common_target_host:
              hostvars[docker_services_common_target_host].container_host_defaults
              | default(hostvars[docker_services_common_target_host] | container_host_defaults, true)
          })
      }}
  loop: "{{ docker_services_fs_hosts_effective }}"
  loop_control:
    loop_var: docker_services_common_target_host
  tags: [remove, drift]

- name: Initialize | Require one host for standalone Docker
  when: (docker_services_stack_deploy_type | string | trim) != 'swarm'
  ansible.builtin.assert:
    that:
      - docker_services_deploy_host is string
      - (docker_services_deploy_host | string | trim | length) > 0
      - (docker_services_deploy_host | string | trim) not in groups
    fail_msg: >-
      Container deploys require deploy.host to be a single hostname (not a group or list).
      Got: {{ docker_services_deploy_host }}
  tags: [remove, drift]

- name: Initialize | Check whether this host builds Compose
  ansible.builtin.set_fact:
    docker_services_is_deploy_host: "{{ inventory_hostname == docker_services_deploy_host_effective }}"
  tags: [remove]
