---

- name: Containment | Clear this service's proof before observing any nodes
  ansible.builtin.set_fact:
    docker_services_swarm_containment: >-
      {{ docker_services_swarm_containment | combine({docker_services_containment_plan.service: false}) }}

- name: Containment | Quiesce and prove only the selected Swarm service
  block:
    - name: Containment | Capture task nodes and quiesce the immutable service
      docker_services_contain:
        phase: quiesce
        runtime: "{{ docker_services_containment_plan.runtime }}"
        inventory_host: "{{ docker_services_deploy_stack_host_effective }}"
      delegate_to: "{{ docker_services_deploy_stack_host_effective }}"
      register: docker_services_containment_snapshot

    - name: Containment | Observe selected writers through each node's inventory connection
      docker_services_contain:
        phase: observe
        runtime: "{{ docker_services_containment_plan.runtime }}"
        snapshot: "{{ docker_services_containment_snapshot.snapshot }}"
        node: "{{ docker_services_containment_node }}"
        inventory_host: "{{ docker_services_containment_node.host }}"
      delegate_to: "{{ docker_services_containment_node.host }}"
      loop: "{{ docker_services_containment_snapshot.snapshot.nodes }}"
      loop_control:
        loop_var: docker_services_containment_node
      register: docker_services_node_observation
      until: >-
        docker_services_node_observation is failed
        or docker_services_node_observation.unreachable | default(false)
        or (docker_services_node_observation.observation.running | default(['unknown']) | length == 0)
      retries: 30
      delay: 2
      ignore_unreachable: true

    - name: Containment | Recheck manager identity scheduler and node evidence
      docker_services_contain:
        phase: verify
        runtime: "{{ docker_services_containment_plan.runtime }}"
        snapshot: "{{ docker_services_containment_snapshot.snapshot }}"
        observations: "{{ docker_services_node_observation.results | selectattr('observation', 'defined') | map(attribute='observation') | list }}"
        inventory_host: "{{ docker_services_deploy_stack_host_effective }}"
      delegate_to: "{{ docker_services_deploy_stack_host_effective }}"
      register: docker_services_containment_result

    - name: Containment | Bind verified absence to this service only
      ansible.builtin.set_fact:
        docker_services_swarm_containment: >-
          {{ docker_services_swarm_containment | combine({
             docker_services_containment_plan.service: docker_services_containment_result.contained | default(false)
          }) }}
  rescue:
    # The deployment rescue still fails with the original error. This result
    # ensures abort retains protection and a reservation when proof is missing.
    - name: Containment | Report inconclusive evidence without claiming writer absence
      # Only the containment action's sanitized error is projected here.
      no_log: false
      diff: false
      ansible.builtin.debug:
        msg: >-
          Containment is inconclusive for {{ docker_services_containment_plan.runtime.binding.selector }}:
          {{ ansible_failed_result.msg | default('required node or manager evidence unavailable') }}.
          Protection and the selected reservation must remain.
