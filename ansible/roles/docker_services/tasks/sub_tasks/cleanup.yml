---

- name: Cleanup | Choose stack name
  ansible.builtin.set_fact:
    docker_services_cleanup_stack_name: >-
      {{
        docker_services_stack_name_effective
        | default(docker_services_stack_name, true)
        | string
        | trim
      }}

- name: Cleanup | Validate stack name
  ansible.builtin.assert:
    that:
      - docker_services_cleanup_stack_name is defined
      - docker_services_cleanup_stack_name | string | trim | length > 0
    fail_msg: "docker_services_cleanup_stack_name must be set before calling cleanup.yml"

- name: Cleanup | Remove standalone Compose project
  when: (docker_services_stack_deploy_type | default('swarm', true) | string | trim) != 'swarm'
  block:
    - name: Cleanup | Check for existing Compose file
      ansible.builtin.stat:
        path: "/opt/stacks/{{ docker_services_cleanup_stack_name }}-compose.yml"
      register: docker_services_existing_compose_yaml

    - name: Cleanup | Stop and remove Compose project
      when: docker_services_existing_compose_yaml.stat.exists
      community.docker.docker_compose_v2:
        project_src: "/opt/stacks"
        project_name: "{{ docker_services_cleanup_stack_name }}"
        files: "{{ docker_services_cleanup_stack_name }}-compose.yml"
        state: absent

    - name: Cleanup | Remove Compose file
      ansible.builtin.file:
        path: "/opt/stacks/{{ docker_services_cleanup_stack_name }}-compose.yml"
        state: absent

    - name: Cleanup | Remove standalone secret files
      ansible.builtin.file:
        path: "/opt/stacks/{{ docker_services_cleanup_stack_name }}/secrets"
        state: absent

    - name: Cleanup | Remove standalone stack directory
      ansible.builtin.file:
        path: "/opt/stacks/{{ docker_services_cleanup_stack_name }}"
        state: absent
  rescue:
    - name: Cleanup | Report standalone cleanup failure
      ansible.builtin.fail:
        msg: >-
          Failed while cleaning up container stack '{{ docker_services_cleanup_stack_name }}'
          on {{ inventory_hostname }}. Fix the failed task above and rerun.

- name: Cleanup | Remove Swarm stack
  when: (docker_services_stack_deploy_type | default('swarm', true) | string | trim) == 'swarm'
  block:
    - name: Cleanup | Remove Swarm stack from cluster
      community.docker.docker_stack:
        name: "{{ docker_services_cleanup_stack_name }}"
        state: absent
        absent_retries: 30
        absent_retries_interval: 2

    - name: Cleanup | Wait for the selected stack's networks to retire
      community.docker.docker_host_info:
        networks: true
        networks_filters:
          label: 'com.docker.stack.namespace={{ docker_services_cleanup_stack_name }}'
      register: docker_services_retiring_stack_networks
      until:
        - docker_services_retiring_stack_networks is succeeded
        - docker_services_retiring_stack_networks.networks is defined
        - docker_services_retiring_stack_networks.networks | default([]) | length == 0
      retries: 30
      delay: 2

    - name: Cleanup | Remove Swarm stack file
      ansible.builtin.file:
        path: "/opt/stacks/{{ docker_services_cleanup_stack_name }}-stack.yml"
        state: absent
  rescue:
    - name: Cleanup | Report Swarm cleanup failure
      ansible.builtin.fail:
        msg: >-
          Failed while cleaning up swarm stack '{{ docker_services_cleanup_stack_name }}'.
          Fix the failed task above and rerun.
