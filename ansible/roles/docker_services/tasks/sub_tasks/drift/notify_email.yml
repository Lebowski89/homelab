---

################################
# CREDS (VIA INFISICAL)
################################

- name: Drift Notify | Ensure SMTP creds exist
  no_log: true
  diff: false
  when:
    - not ansible_check_mode
    - inventory_hostname == docker_services_primary_manager
    - docker_services_drift_email_enabled | default(false) | bool
    - hostvars[docker_services_primary_manager].docker_services_image_drift is defined
    - (hostvars[docker_services_primary_manager].docker_services_image_drift | length) > 0
  block:
    - name: Drift Notify | Detect if SMTP creds are missing
      ansible.builtin.set_fact:
        docker_services_drift_smtp_creds_missing: >-
          {{
            (docker_services_drift_email_to | default('') | string | trim | length == 0)
            or
            (docker_services_drift_email_host | default('') | string | trim | length == 0)
            or
            (docker_services_drift_email_port | default('') | string | trim | length == 0)
            or
            (docker_services_drift_email_user | default('') | string | trim | length == 0)
            or
            (docker_services_drift_email_pass | default('') | string | trim | length == 0)
            or
            (docker_services_drift_email_sender | default('') | string | trim | length == 0)
          }}

    - name: Drift Notify | Fetch SMTP creds from Infisical
      when: docker_services_drift_smtp_creds_missing | bool
      ansible.builtin.include_tasks: "{{ playbook_dir }}/roles/docker_services/tasks/sub_tasks/prep/infisical/_fetch.yml"
      vars:
        infisical_fail_on_empty: true
        infisical_flatten: true
        secrets_map:
          - var: docker_services_drift_email_to
            path: "{{ docker_services_drift_email_infisical_path | default('/Porkbun') }}"
            name: "{{ docker_services_drift_email_infisical_to_name | default('SMTP_EMAIL') }}"

          - var: docker_services_drift_email_host
            path: "{{ docker_services_drift_email_infisical_path | default('/Porkbun') }}"
            name: "{{ docker_services_drift_email_infisical_host_name | default('SMTP_HOST') }}"

          - var: docker_services_drift_email_pass
            path: "{{ docker_services_drift_email_infisical_path | default('/Porkbun') }}"
            name: "{{ docker_services_drift_email_infisical_pass_name | default('SMTP_PASS') }}"

          - var: docker_services_drift_email_port
            path: "{{ docker_services_drift_email_infisical_path | default('/Porkbun') }}"
            name: "{{ docker_services_drift_email_infisical_port_name | default('SMTP_PORT') }}"

          - var: docker_services_drift_email_sender
            path: "{{ docker_services_drift_email_infisical_path | default('/Porkbun') }}"
            name: "{{ docker_services_drift_email_infisical_sender_name | default('SMTP_SENDER') }}"

          - var: docker_services_drift_email_user
            path: "{{ docker_services_drift_email_infisical_path | default('/Porkbun') }}"
            name: "{{ docker_services_drift_email_infisical_user_name | default('SMTP_USER') }}"

    - name: Drift Notify | Assert SMTP creds are now present
      ansible.builtin.assert:
        that:
          - (docker_services_drift_email_to | default('') | string | trim | length) > 0
          - (docker_services_drift_email_host | default('') | string | trim | length) > 0
          - (docker_services_drift_email_port | default('') | string | trim | length) > 0
          - (docker_services_drift_email_user | default('') | string | trim | length) > 0
          - (docker_services_drift_email_pass | default('') | string | trim | length) > 0
          - (docker_services_drift_email_sender | default('') | string | trim | length) > 0
        fail_msg: >-
          SMTP drift notification creds are still empty after Infisical fetch.
          Expected SMTP_EMAIL, SMTP_HOST, SMTP_PASS, SMTP_PORT, SMTP_SENDER, SMTP_USER
          under {{ docker_services_drift_email_infisical_path | default('/Porkbun') }}.
  rescue:
    - name: Drift Notify | Fail SMTP credential setup with context
      ansible.builtin.fail:
        msg: >-
          Failed while resolving SMTP credentials for image drift notification.
          Fix the failed task above or disable docker_services_drift_email_enabled.

################################
# EMAIL BODY
################################

- name: Drift Notify | Build image drift email body
  when:
    - inventory_hostname == docker_services_primary_manager
    - docker_services_drift_email_enabled | default(false) | bool
    - hostvars[docker_services_primary_manager].docker_services_image_drift is defined
    - (hostvars[docker_services_primary_manager].docker_services_image_drift | length) > 0
  ansible.builtin.set_fact:
    docker_services_image_drift_email_body: |
      Docker image drift detected: {{ hostvars[docker_services_primary_manager].docker_services_image_drift | length }} service(s)

      {% for drift_item in hostvars[docker_services_primary_manager].docker_services_image_drift | sort(attribute='label') %}
      - {{ drift_item.label }}
        stack:   {{ drift_item.stack }}
        service: {{ drift_item.service }}
        desired: {{ drift_item.desired }}
        current: {{ drift_item.current }}

      {% endfor %}
  run_once: true

################################
# SEND
################################

- name: Drift Notify | Send image drift email
  when:
    - inventory_hostname == docker_services_primary_manager
    - docker_services_drift_email_enabled | default(false) | bool
    - docker_services_image_drift_email_body is defined
    - docker_services_drift_email_to | default('') | string | trim | length > 0
    - docker_services_drift_email_host | default('') | string | trim | length > 0
    - docker_services_drift_email_sender | default('') | string | trim | length > 0
  community.general.mail:
    host: "{{ docker_services_drift_email_host }}"
    port: "{{ docker_services_drift_email_port | int }}"
    secure: "{{ docker_services_drift_email_secure | default('starttls') }}"
    timeout: "{{ docker_services_drift_email_timeout | default(20) }}"
    username: "{{ docker_services_drift_email_user }}"
    password: "{{ docker_services_drift_email_pass }}"
    sender: "{{ docker_services_drift_email_sender }}"
    to:
      - "{{ docker_services_drift_email_to }}"
    subject: >-
      {{
        docker_services_drift_email_subject
        | default('Skynet Docker image drift detected', true)
      }}:
      {{ hostvars[docker_services_primary_manager].docker_services_image_drift | length }}
      service(s)
    body: "{{ docker_services_image_drift_email_body }}"
    subtype: plain
    charset: utf-8
    headers:
      - "X-Skynet-Alert=docker-image-drift"
      - "X-Skynet-Host={{ inventory_hostname }}"
  delegate_to: localhost
  run_once: true
  no_log: true
