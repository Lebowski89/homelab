---

################################
# EMAIL BODY
################################

- name: Drift Notify | Build image drift email body
  when:
    - inventory_hostname == docker_services_primary_manager
    - docker_services_drift_email_enabled | default(false) | bool
    - hostvars[docker_services_primary_manager].docker_services_image_drift is defined
    - (hostvars[docker_services_primary_manager].docker_services_image_drift | length) > 0
  ansible.builtin.set_fact:
    docker_services_image_drift_email_body: |
      Docker image drift detected: {{ hostvars[docker_services_primary_manager].docker_services_image_drift | length }} service(s)

      {% for drift_item in hostvars[docker_services_primary_manager].docker_services_image_drift | sort(attribute='label') %}
      - {{ drift_item.label }}
        stack:   {{ drift_item.stack }}
        service: {{ drift_item.service }}
        desired: {{ drift_item.desired }}
        current: {{ drift_item.current }}

      {% endfor %}
  run_once: true

################################
# SEND
################################

- name: Drift Notify | Send image drift email
  when:
    - inventory_hostname == docker_services_primary_manager
    - docker_services_drift_email_enabled | default(false) | bool
    - docker_services_image_drift_email_body is defined
    - docker_services_drift_email_to | default('') | string | trim | length > 0
    - docker_services_drift_email_host | default('') | string | trim | length > 0
    - docker_services_drift_email_sender | default('') | string | trim | length > 0
  community.general.mail:
    host: "{{ docker_services_drift_email_host }}"
    port: "{{ docker_services_drift_email_port | int }}"
    secure: "{{ docker_services_drift_email_secure | default('starttls') }}"
    timeout: "{{ docker_services_drift_email_timeout | default(20) }}"
    username: "{{ docker_services_drift_email_user }}"
    password: "{{ docker_services_drift_email_pass }}"
    sender: "{{ docker_services_drift_email_sender }}"
    to:
      - "{{ docker_services_drift_email_to }}"
    subject: >-
      {{
        docker_services_drift_email_subject
        | default('Skynet Docker image drift detected', true)
      }}:
      {{ hostvars[docker_services_primary_manager].docker_services_image_drift | length }}
      service(s)
    body: "{{ docker_services_image_drift_email_body }}"
    subtype: plain
    charset: utf-8
    headers:
      - "X-Skynet-Alert=docker-image-drift"
      - "X-Skynet-Host={{ inventory_hostname }}"
  delegate_to: localhost
  run_once: true
  no_log: true
