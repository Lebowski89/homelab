---

- name: Docker secrets | Choose deploy host
  ansible.builtin.set_fact:
    docker_services_secrets_deploy_host: "{{ docker_services_deploy_host_effective }}"

- name: Docker secrets | Choose secrets host
  ansible.builtin.set_fact:
    docker_services_secrets_host_effective: >-
      {{
        docker_services_controller_host
        if docker_services_stack_deploy_type == 'swarm'
        else docker_services_secrets_deploy_host
      }}

- name: Docker secrets | Build requested secrets
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    docker_services_docker_secret_items: >-
      {%- set out = [] -%}
      {%- set declarations = docker_services_effective_secret_declarations | default([]) -%}
      {%- set values = docker_services_effective_secret_values | default({}) -%}
      {%- for declaration in declarations -%}
      {%- if declaration.var is defined and (declaration.var | string | trim | length > 0) -%}
      {%- set item = {
            'name': declaration.name,
            'var': declaration.var,
            'value': values[declaration.var] | default('', true) | string,
            'update_policy': declaration.get('update_policy', 'preserve')
          } -%}
      {%- for field in ['uid', 'gid', 'mode'] -%}
      {%- if declaration[field] is defined -%}
      {%- set _ = item.update({field: declaration[field]}) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set _ = out.append(item) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Docker secrets | Reject empty secret values
  no_log: true
  diff: false
  ansible.builtin.assert:
    that:
      - docker_services_docker_secret_items | selectattr('value', 'equalto', '') | list | length == 0
    fail_msg: "A required Docker secret value is empty; runtime secret creation was stopped."

- name: Docker secrets | Inspect existing Swarm secrets
  when:
    - docker_services_stack_deploy_type == 'swarm'
    - docker_services_docker_secret_items | length > 0
  no_log: true
  diff: false
  ansible.builtin.command:
    argv:
      - docker
      - secret
      - inspect
      - "{{ docker_services_inspected_secret.name }}"
  loop: "{{ docker_services_docker_secret_items }}"
  loop_control:
    loop_var: docker_services_inspected_secret
    label: "{{ docker_services_inspected_secret.name }}"
  register: docker_services_inspected_secret_inspections
  changed_when: false
  failed_when: false
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Docker secrets | Read Swarm secret inspection results
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    docker_services_secret_statuses: >-
      {%- set statuses = {} -%}
      {%- for inspection in docker_services_inspected_secret_inspections.results | default([]) -%}
      {%- set status = inspection | docker_services_secret_inspection(inspection.docker_services_inspected_secret) -%}
      {%- set _ = statuses.update({status.name: status}) -%}
      {%- endfor -%}
      {{ statuses }}

- name: Docker secrets | List existing Swarm secrets
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    docker_services_existing_secret_names: >-
      {{
        docker_services_secret_statuses.values()
        | selectattr('exists', 'equalto', true)
        | map(attribute='name')
        | list
      }}

- name: Docker secrets | Protect unmanaged Swarm secrets
  when:
    - not ansible_check_mode
    - docker_services_stack_deploy_type == 'swarm'
    - docker_services_common_action in ['update', 'recreate']
    - docker_services_docker_secret_items | length > 0
  no_log: true
  diff: false
  ansible.builtin.assert:
    that:
      - >-
        not (
          docker_services_secret_statuses[prep_sec.name].exists
          and not docker_services_secret_statuses[prep_sec.name].ansible_managed
          and (prep_sec | docker_services_secret_policy(docker_services_common_action, true)).overwrite
        )
    fail_msg: >-
      Docker Swarm secret {{ prep_sec.name }} is not Ansible-managed and cannot be
      reconciled safely; adopt or rotate it explicitly before retrying.
  loop: "{{ docker_services_docker_secret_items }}"
  loop_control:
    loop_var: prep_sec
    label: "{{ prep_sec.name }}"
