---

- name: Docker secrets | Recheck secret ownership at materialization
  ansible.builtin.include_tasks:
    file: sub_tasks/secrets/inspect.yml
    apply:
      tags: [deploy, update, recreate, bootstrap]
      no_log: true
      diff: false
  tags: [deploy, update, recreate, bootstrap]

- name: Docker secrets | Create required Swarm secrets
  no_log: true
  diff: false
  when:
    - docker_services_stack_deploy_type == 'swarm'
    - (docker_services_docker_secret_items | length) > 0
    - (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length) > 0
    - >-
      (prep_sec | docker_services_secret_policy(
        docker_services_common_action,
        prep_sec.name in (docker_services_existing_secret_names | default([]))
      )).materialize
  community.docker.docker_secret:
    name: "{{ prep_sec.name }}"
    data: "{{ prep_sec.value }}"
    state: present
    force: false
  loop: >-
    {{
      docker_services_docker_secret_items
      | selectattr('value', 'ne', '')
      | list
    }}
  loop_control:
    loop_var: prep_sec
    label: "{{ prep_sec.name }}"
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Docker secrets | Ensure standalone secrets directory exists
  no_log: true
  diff: false
  when:
    - docker_services_stack_deploy_type != 'swarm'
    - (docker_services_docker_secret_items | length) > 0
    - (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length) > 0
  ansible.builtin.file:
    path: "/opt/stacks/{{ docker_services_stack_name_effective }}/secrets"
    state: directory
    mode: "0700"
    owner: "{{ hostvars[docker_services_secrets_host_effective].container_host_puid | default('1000') }}"
    group: "{{ hostvars[docker_services_secrets_host_effective].container_host_pgid | default('1000') }}"
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Docker secrets | Inspect standalone secret paths
  no_log: true
  diff: false
  when:
    - docker_services_stack_deploy_type != 'swarm'
    - (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length) > 0
  ansible.builtin.stat:
    path: "/opt/stacks/{{ docker_services_stack_name_effective }}/secrets/{{ prep_sec.name }}"
    follow: false
  loop: "{{ docker_services_docker_secret_items | selectattr('value', 'ne', '') | list }}"
  loop_control:
    loop_var: prep_sec
    label: "{{ prep_sec.name }}"
  register: docker_services_secret_path_inspections
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Docker secrets | Remove incompatible standalone secret paths
  no_log: true
  diff: false
  when:
    - docker_services_stack_deploy_type != 'swarm'
    - docker_services_secret_path_inspection.stat.exists | default(false)
    - not (docker_services_secret_path_inspection.stat.isreg | default(false))
  ansible.builtin.file:
    path: >-
      /opt/stacks/{{ docker_services_stack_name_effective }}/secrets/{{
        docker_services_secret_path_inspection.prep_sec.name
      }}
    state: absent
  loop: "{{ docker_services_secret_path_inspections.results | default([]) }}"
  loop_control:
    loop_var: docker_services_secret_path_inspection
    label: "{{ docker_services_secret_path_inspection.prep_sec.name }}"
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Docker secrets | Report standalone secret path repair in check mode
  when:
    - ansible_check_mode
    - docker_services_stack_deploy_type != 'swarm'
    - docker_services_secret_path_inspection.stat.exists | default(false)
    - not (docker_services_secret_path_inspection.stat.isreg | default(false))
  no_log: true
  diff: false
  ansible.builtin.debug:
    msg: "Standalone Docker secret path will be repaired as a regular file."
  changed_when: true
  loop: "{{ docker_services_secret_path_inspections.results | default([]) }}"
  loop_control:
    loop_var: docker_services_secret_path_inspection
    label: "{{ docker_services_secret_path_inspection.prep_sec.name }}"

- name: Docker secrets | Write standalone secret files
  no_log: true
  diff: false
  when:
    - docker_services_stack_deploy_type != 'swarm'
    - >-
      not (
        ansible_check_mode
        and (docker_services_secret_path_inspection.stat.exists | default(false))
        and not (docker_services_secret_path_inspection.stat.isreg | default(false))
      )
  ansible.builtin.copy:
    dest: >-
      /opt/stacks/{{ docker_services_stack_name_effective }}/secrets/{{
        docker_services_secret_path_inspection.prep_sec.name
      }}
    content: "{{ docker_services_secret_path_inspection.prep_sec.value }}"
    mode: "{{ docker_services_secret_path_inspection.prep_sec.mode | default('0600') }}"
    owner: >-
      {{
        docker_services_secret_path_inspection.prep_sec.uid
        | default(hostvars[docker_services_secrets_host_effective].container_host_puid | default('1000'))
      }}
    group: >-
      {{
        docker_services_secret_path_inspection.prep_sec.gid
        | default(hostvars[docker_services_secrets_host_effective].container_host_pgid | default('1000'))
      }}
    force: >-
      {{
        (
          docker_services_secret_path_inspection.prep_sec
          | docker_services_secret_policy(docker_services_common_action)
        ).overwrite
      }}
  loop: "{{ docker_services_secret_path_inspections.results | default([]) }}"
  loop_control:
    loop_var: docker_services_secret_path_inspection
    label: "{{ docker_services_secret_path_inspection.prep_sec.name }}"
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Docker secrets | Enforce standalone secret permissions
  no_log: true
  diff: false
  when:
    - docker_services_stack_deploy_type != 'swarm'
    - >-
      not ansible_check_mode
      or (docker_services_secret_path_inspection.stat.isreg | default(false))
  ansible.builtin.file:
    path: >-
      /opt/stacks/{{ docker_services_stack_name_effective }}/secrets/{{
        docker_services_secret_path_inspection.prep_sec.name
      }}
    state: file
    mode: "{{ docker_services_secret_path_inspection.prep_sec.mode | default('0600') }}"
    owner: >-
      {{
        docker_services_secret_path_inspection.prep_sec.uid
        | default(hostvars[docker_services_secrets_host_effective].container_host_puid | default('1000'))
      }}
    group: >-
      {{
        docker_services_secret_path_inspection.prep_sec.gid
        | default(hostvars[docker_services_secrets_host_effective].container_host_pgid | default('1000'))
      }}
  loop: "{{ docker_services_secret_path_inspections.results | default([]) }}"
  loop_control:
    loop_var: docker_services_secret_path_inspection
    label: "{{ docker_services_secret_path_inspection.prep_sec.name }}"
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Docker secrets | Verify standalone secret files
  no_log: true
  diff: false
  when:
    - not ansible_check_mode
    - docker_services_stack_deploy_type != 'swarm'
    - (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length) > 0
  ansible.builtin.stat:
    path: "/opt/stacks/{{ docker_services_stack_name_effective }}/secrets/{{ prep_sec.name }}"
  loop: "{{ docker_services_docker_secret_items | selectattr('value', 'ne', '') | list }}"
  loop_control:
    loop_var: prep_sec
    label: "{{ prep_sec.name }}"
  register: docker_services_secret_files_verify
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Docker secrets | Require valid standalone secret files
  no_log: true
  diff: false
  when:
    - not ansible_check_mode
    - docker_services_stack_deploy_type != 'swarm'
    - (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length) > 0
  ansible.builtin.assert:
    that:
      - docker_services_secret_files_verify.results[sec_idx].stat.exists | default(false)
      - not (docker_services_secret_files_verify.results[sec_idx].stat.isdir | default(false))
    fail_msg: >-
      Secret path is not a file on deploy host '{{ docker_services_secrets_host_effective }}':
      /opt/stacks/{{ docker_services_stack_name_effective }}/secrets/{{
        (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list)[sec_idx].name
      }}
      This usually means Docker created it as a directory before secrets were written.
  loop: "{{ range(0, (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length)) | list }}"
  loop_control:
    loop_var: sec_idx
    label: "{{ (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list)[sec_idx].name }}"
