---

- name: Docker secrets | Choose deploy host
  ansible.builtin.set_fact:
    docker_services_secrets_deploy_host: >-
      {{
        (
          docker_services_svc.deploy.host
          | default(docker_services_deploy_host_effective, true)
          | default(docker_services_controller_host, true)
        )
        | string | trim
      }}

- name: Docker secrets | Choose secrets host
  ansible.builtin.set_fact:
    docker_services_secrets_host_effective: >-
      {{
        docker_services_controller_host
        if docker_services_stack_deploy_type == 'swarm'
        else docker_services_secrets_deploy_host
      }}

- name: Docker secrets | Build requested secrets
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    docker_services_docker_secret_items: >-
      {%- set out = [] -%}
      {%- set declarations = docker_services_effective_secret_declarations | default([]) -%}
      {%- set values = docker_services_effective_secret_values | default({}) -%}
      {%- for declaration in declarations -%}
      {%- if declaration.var is defined and (declaration.var | string | trim | length > 0) -%}
      {%- set item = {
            'name': declaration.name,
            'var': declaration.var,
            'value': values[declaration.var] | default('', true) | string,
            'update_policy': declaration.get('update_policy', 'preserve')
          } -%}
      {%- for field in ['uid', 'gid', 'mode'] -%}
      {%- if declaration[field] is defined -%}
      {%- set _ = item.update({field: declaration[field]}) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set _ = out.append(item) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Docker secrets | Reject empty secret values
  no_log: true
  diff: false
  ansible.builtin.assert:
    that:
      - docker_services_docker_secret_items | selectattr('value', 'equalto', '') | list | length == 0
    fail_msg: "A required Docker secret value is empty; runtime secret creation was stopped."

- name: Docker secrets | Inspect existing Swarm secrets
  when:
    - docker_services_stack_deploy_type == 'swarm'
    - docker_services_docker_secret_items | length > 0
  no_log: true
  diff: false
  ansible.builtin.command:
    argv:
      - docker
      - secret
      - inspect
      - "{{ docker_services_inspected_secret.name }}"
  loop: "{{ docker_services_docker_secret_items }}"
  loop_control:
    loop_var: docker_services_inspected_secret
    label: "{{ docker_services_inspected_secret.name }}"
  register: docker_services_inspected_secret_inspections
  changed_when: false
  failed_when: false
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Docker secrets | Read Swarm secret inspection results
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    docker_services_secret_statuses: >-
      {%- set statuses = {} -%}
      {%- for inspection in docker_services_inspected_secret_inspections.results | default([]) -%}
      {%- set status = inspection | docker_services_secret_inspection(inspection.docker_services_inspected_secret) -%}
      {%- set _ = statuses.update({status.name: status}) -%}
      {%- endfor -%}
      {{ statuses }}

- name: Docker secrets | List existing Swarm secrets
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    docker_services_existing_secret_names: >-
      {{
        docker_services_secret_statuses.values()
        | selectattr('exists', 'equalto', true)
        | map(attribute='name')
        | list
      }}

- name: Docker secrets | Protect unmanaged Swarm secrets
  when:
    - not ansible_check_mode
    - docker_services_stack_deploy_type == 'swarm'
    - docker_services_common_action in ['update', 'recreate']
    - docker_services_docker_secret_items | length > 0
  no_log: true
  diff: false
  ansible.builtin.assert:
    that:
      - >-
        not (
          docker_services_secret_statuses[prep_sec.name].exists
          and not docker_services_secret_statuses[prep_sec.name].ansible_managed
          and (prep_sec | docker_services_secret_policy(docker_services_common_action, true)).overwrite
        )
    fail_msg: >-
      Docker Swarm secret {{ prep_sec.name }} is not Ansible-managed and cannot be
      reconciled safely; adopt or rotate it explicitly before retrying.
  loop: "{{ docker_services_docker_secret_items }}"
  loop_control:
    loop_var: prep_sec
    label: "{{ prep_sec.name }}"

- name: Docker secrets | Create required Swarm secrets
  no_log: true
  diff: false
  when:
    - docker_services_stack_deploy_type == 'swarm'
    - (docker_services_docker_secret_items | length) > 0
    - (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length) > 0
    - >-
      (prep_sec | docker_services_secret_policy(
        docker_services_common_action,
        prep_sec.name in (docker_services_existing_secret_names | default([]))
      )).materialize
  community.docker.docker_secret:
    name: "{{ prep_sec.name }}"
    data: "{{ prep_sec.value }}"
    state: present
    force: false
  loop: >-
    {{
      docker_services_docker_secret_items
      | selectattr('value', 'ne', '')
      | list
    }}
  loop_control:
    loop_var: prep_sec
    label: "{{ prep_sec.name }}"
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Docker secrets | Ensure standalone secrets directory exists
  no_log: true
  diff: false
  when:
    - docker_services_stack_deploy_type != 'swarm'
    - (docker_services_docker_secret_items | length) > 0
    - (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length) > 0
  ansible.builtin.file:
    path: "/opt/stacks/{{ docker_services_stack_name }}/secrets"
    state: directory
    mode: "0700"
    owner: "{{ hostvars[docker_services_secrets_host_effective].container_host_puid | default('1000') }}"
    group: "{{ hostvars[docker_services_secrets_host_effective].container_host_pgid | default('1000') }}"
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Docker secrets | Inspect standalone secret paths
  no_log: true
  diff: false
  when:
    - docker_services_stack_deploy_type != 'swarm'
    - (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length) > 0
  ansible.builtin.stat:
    path: "/opt/stacks/{{ docker_services_stack_name }}/secrets/{{ prep_sec.name }}"
    follow: false
  loop: "{{ docker_services_docker_secret_items | selectattr('value', 'ne', '') | list }}"
  loop_control:
    loop_var: prep_sec
    label: "{{ prep_sec.name }}"
  register: docker_services_secret_path_inspections
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Docker secrets | Remove incompatible standalone secret paths
  no_log: true
  diff: false
  when:
    - docker_services_stack_deploy_type != 'swarm'
    - docker_services_secret_path_inspection.stat.exists | default(false)
    - not (docker_services_secret_path_inspection.stat.isreg | default(false))
  ansible.builtin.file:
    path: >-
      /opt/stacks/{{ docker_services_stack_name }}/secrets/{{
        docker_services_secret_path_inspection.prep_sec.name
      }}
    state: absent
  loop: "{{ docker_services_secret_path_inspections.results | default([]) }}"
  loop_control:
    loop_var: docker_services_secret_path_inspection
    label: "{{ docker_services_secret_path_inspection.prep_sec.name }}"
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Docker secrets | Report standalone secret path repair in check mode
  when:
    - ansible_check_mode
    - docker_services_stack_deploy_type != 'swarm'
    - docker_services_secret_path_inspection.stat.exists | default(false)
    - not (docker_services_secret_path_inspection.stat.isreg | default(false))
  no_log: true
  diff: false
  ansible.builtin.debug:
    msg: "Standalone Docker secret path will be repaired as a regular file."
  changed_when: true
  loop: "{{ docker_services_secret_path_inspections.results | default([]) }}"
  loop_control:
    loop_var: docker_services_secret_path_inspection
    label: "{{ docker_services_secret_path_inspection.prep_sec.name }}"

- name: Docker secrets | Write standalone secret files
  no_log: true
  diff: false
  when:
    - docker_services_stack_deploy_type != 'swarm'
    - >-
      not (
        ansible_check_mode
        and (docker_services_secret_path_inspection.stat.exists | default(false))
        and not (docker_services_secret_path_inspection.stat.isreg | default(false))
      )
  ansible.builtin.copy:
    dest: >-
      /opt/stacks/{{ docker_services_stack_name }}/secrets/{{
        docker_services_secret_path_inspection.prep_sec.name
      }}
    content: "{{ docker_services_secret_path_inspection.prep_sec.value }}"
    mode: "{{ docker_services_secret_path_inspection.prep_sec.mode | default('0600') }}"
    owner: >-
      {{
        docker_services_secret_path_inspection.prep_sec.uid
        | default(hostvars[docker_services_secrets_host_effective].container_host_puid | default('1000'))
      }}
    group: >-
      {{
        docker_services_secret_path_inspection.prep_sec.gid
        | default(hostvars[docker_services_secrets_host_effective].container_host_pgid | default('1000'))
      }}
    force: >-
      {{
        (
          docker_services_secret_path_inspection.prep_sec
          | docker_services_secret_policy(docker_services_common_action)
        ).overwrite
      }}
  loop: "{{ docker_services_secret_path_inspections.results | default([]) }}"
  loop_control:
    loop_var: docker_services_secret_path_inspection
    label: "{{ docker_services_secret_path_inspection.prep_sec.name }}"
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Docker secrets | Enforce standalone secret permissions
  no_log: true
  diff: false
  when:
    - docker_services_stack_deploy_type != 'swarm'
    - >-
      not ansible_check_mode
      or (docker_services_secret_path_inspection.stat.isreg | default(false))
  ansible.builtin.file:
    path: >-
      /opt/stacks/{{ docker_services_stack_name }}/secrets/{{
        docker_services_secret_path_inspection.prep_sec.name
      }}
    state: file
    mode: "{{ docker_services_secret_path_inspection.prep_sec.mode | default('0600') }}"
    owner: >-
      {{
        docker_services_secret_path_inspection.prep_sec.uid
        | default(hostvars[docker_services_secrets_host_effective].container_host_puid | default('1000'))
      }}
    group: >-
      {{
        docker_services_secret_path_inspection.prep_sec.gid
        | default(hostvars[docker_services_secrets_host_effective].container_host_pgid | default('1000'))
      }}
  loop: "{{ docker_services_secret_path_inspections.results | default([]) }}"
  loop_control:
    loop_var: docker_services_secret_path_inspection
    label: "{{ docker_services_secret_path_inspection.prep_sec.name }}"
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Docker secrets | Verify standalone secret files
  no_log: true
  diff: false
  when:
    - not ansible_check_mode
    - docker_services_stack_deploy_type != 'swarm'
    - (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length) > 0
  ansible.builtin.stat:
    path: "/opt/stacks/{{ docker_services_stack_name }}/secrets/{{ prep_sec.name }}"
  loop: "{{ docker_services_docker_secret_items | selectattr('value', 'ne', '') | list }}"
  loop_control:
    loop_var: prep_sec
    label: "{{ prep_sec.name }}"
  register: docker_services_secret_files_verify
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Docker secrets | Require valid standalone secret files
  no_log: true
  diff: false
  when:
    - not ansible_check_mode
    - docker_services_stack_deploy_type != 'swarm'
    - (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length) > 0
  ansible.builtin.assert:
    that:
      - docker_services_secret_files_verify.results[sec_idx].stat.exists | default(false)
      - not (docker_services_secret_files_verify.results[sec_idx].stat.isdir | default(false))
    fail_msg: >-
      Secret path is not a file on deploy host '{{ docker_services_secrets_host_effective }}':
      /opt/stacks/{{ docker_services_stack_name }}/secrets/{{
        (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list)[sec_idx].name
      }}
      This usually means Docker created it as a directory before secrets were written.
  loop: "{{ range(0, (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length)) | list }}"
  loop_control:
    loop_var: sec_idx
    label: "{{ (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list)[sec_idx].name }}"
