---

################################
# PREP (INFISICAL FETCH)
################################

- name: Prep - Infisical Fetch | Reset per-service adapter values
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    docker_services_infisical_values: {}
  tags: [deploy, update, recreate, bootstrap]

- name: Prep - Infisical Fetch | Include tasks
  ansible.builtin.include_tasks:
    file: _fetch.yml
    apply:
      tags: [deploy, update, recreate, bootstrap]
  vars:
    infisical_fail_on_empty: >-
      {{ (docker_services_svc.infisical | default({})).fail_on_empty | default(true) }}
    secrets_map: "{{ (docker_services_svc.infisical | default({})).secrets_map | default([]) }}"
  tags: [deploy, update, recreate, bootstrap]

- name: Prep - Infisical Fetch | Snapshot common per-service outputs
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    docker_services_infisical_values: "{{ service_common_infisical_values }}"
    docker_services_secret_declarations: "{{ service_common_secret_declarations }}"
    docker_services_resolved_environment: "{{ service_common_resolved_environment }}"
  tags: [deploy, update, recreate, bootstrap]

- name: Prep - Infisical Fetch | Attach common resolved environment on every role host
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    docker_services_svc: >-
      {{
        docker_services_svc
        | combine({
            "environment": docker_services_resolved_environment
          }, recursive=false)
      }}
  tags: [deploy, update, recreate, bootstrap]

################################
# PREP (INFISICAL RESOLVER)
################################

- name: Prep - Infisical Resolver | Include tasks on deploy host
  when:
    - not ansible_check_mode
    - inventory_hostname == docker_services_deploy_host_effective
  ansible.builtin.include_tasks:
    file: _resolver.yml
    apply:
      tags: [deploy, update, recreate, bootstrap]
  tags: [deploy, update, recreate, bootstrap]

- name: Prep - Infisical Resolver | Propagate Infisical flattened vars to deploy host
  no_log: true
  diff: false
  when:
    - not ansible_check_mode
    - inventory_hostname == docker_services_primary_manager
    - docker_services_svc.infisical is defined
    - (docker_services_svc.infisical.secrets_map | default([]) | length) > 0
    - (docker_services_deploy_host_effective != docker_services_primary_manager)
    - (infisical_flatten | default(true)) | bool
  ansible.builtin.set_fact:
    "{{ inf_item.var }}": "{{ hostvars[docker_services_primary_manager][inf_item.var] | default('') }}"
  loop: "{{ docker_services_svc.infisical.secrets_map }}"
  loop_control:
    loop_var: inf_item
    label: "{{ inf_item.var }}"
  delegate_to: "{{ docker_services_deploy_host_effective }}"
  delegate_facts: true
  tags: [deploy, update, recreate, bootstrap]

- name: Prep - Infisical Resolver | Propagate Infisical dict to deploy host
  no_log: true
  diff: false
  when:
    - not ansible_check_mode
    - inventory_hostname == docker_services_primary_manager
    - docker_services_svc.infisical is defined
    - (docker_services_svc.infisical.secrets_map | default([]) | length) > 0
    - (docker_services_deploy_host_effective != docker_services_primary_manager)
    - not (infisical_flatten | default(true)) | bool
  ansible.builtin.set_fact:
    "{{ infisical_out_var | default('infisical_secrets') }}": >-
      {{
        hostvars[docker_services_primary_manager][infisical_out_var | default('infisical_secrets')] | default({})
      }}
  delegate_to: "{{ docker_services_deploy_host_effective }}"
  delegate_facts: true
  tags: [deploy, update, recreate, bootstrap]

################################
# PREP (INFISICAL SECRETS)
################################

- name: Prep - Infisical Secrets | Include tasks
  when:
    - not ansible_check_mode
    - docker_services_svc.infisical is defined
    - (docker_services_svc.infisical.secrets_map | default([]) | length) > 0
    - >-
      (docker_services_stack_deploy_type == 'swarm')
      | ternary(
          inventory_hostname == docker_services_primary_manager,
          docker_services_is_deploy_host
        )
  ansible.builtin.include_tasks:
    file: _secrets.yml
    apply:
      tags: [deploy, update, recreate, bootstrap]
  tags: [deploy, update, recreate, bootstrap]
