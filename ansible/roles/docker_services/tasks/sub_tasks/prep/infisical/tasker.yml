---

################################
# PREP (INFISICAL FETCH)
################################

- name: Prep - Infisical Fetch | Include tasks
  when:
    - inventory_hostname == docker_services_primary_manager
    - docker_services_svc.infisical is defined
    - docker_services_svc.infisical.secrets_map is defined
    - (docker_services_svc.infisical.secrets_map | length > 0)
  ansible.builtin.include_tasks:
    file: _fetch.yml
    apply:
      tags: [deploy, update, recreate]
  vars:
    infisical_fail_on_empty: "{{ docker_services_svc.infisical.fail_on_empty | default(true) }}"
    secrets_map: "{{ docker_services_svc.infisical.secrets_map }}"
  tags: [deploy, update, recreate]

################################
# PREP (INFISICAL RESOLVER)
################################

- name: Prep - Infisical Resolver | Include tasks on deploy host
  when:
    - inventory_hostname == docker_services_deploy_host_effective
  ansible.builtin.include_tasks:
    file: _resolver.yml
    apply:
      tags: [deploy, update, recreate]
  tags: [deploy, update, recreate]

- name: Prep - Infisical Resolver | Propagate Infisical flattened vars to deploy host
  when:
    - inventory_hostname == docker_services_primary_manager
    - docker_services_svc.infisical is defined
    - (docker_services_svc.infisical.secrets_map | default([]) | length) > 0
    - (docker_services_deploy_host_effective != docker_services_primary_manager)
    - (infisical_flatten | default(true)) | bool
  ansible.builtin.set_fact:
    "{{ inf_item.var }}": "{{ hostvars[docker_services_primary_manager][inf_item.var] | default('') }}"
  loop: "{{ docker_services_svc.infisical.secrets_map }}"
  loop_control:
    loop_var: inf_item
    label: "{{ inf_item.var }}"
  delegate_to: "{{ docker_services_deploy_host_effective }}"
  delegate_facts: true
  tags: [deploy, update, recreate]

- name: Prep - Infisical Resolver | Propagate Infisical dict to deploy host
  when:
    - inventory_hostname == docker_services_primary_manager
    - docker_services_svc.infisical is defined
    - (docker_services_svc.infisical.secrets_map | default([]) | length) > 0
    - (docker_services_deploy_host_effective != docker_services_primary_manager)
    - not (infisical_flatten | default(true)) | bool
  ansible.builtin.set_fact:
    "{{ infisical_out_var | default('infisical_secrets') }}": >-
      {{
        hostvars[docker_services_primary_manager][infisical_out_var | default('infisical_secrets')] | default({})
      }}
  delegate_to: "{{ docker_services_deploy_host_effective }}"
  delegate_facts: true
  tags: [deploy, update, recreate]

################################
# PREP (INFISICAL SECRETS)
################################

- name: Prep - Infisical Secrets | Include tasks
  when:
    - docker_services_svc.infisical is defined
    - (docker_services_svc.infisical.secrets_map | default([]) | length) > 0
    - >-
      (docker_services_stack_deploy_type == 'swarm')
      | ternary(
          inventory_hostname == docker_services_primary_manager,
          docker_services_is_deploy_host
        )
  ansible.builtin.include_tasks:
    file: _secrets.yml
    apply:
      tags: [deploy, update, recreate]
  tags: [deploy, update, recreate]
