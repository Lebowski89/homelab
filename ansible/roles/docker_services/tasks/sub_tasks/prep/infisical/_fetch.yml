---

- name: Prep - Infisical Fetch | Retrieve values through service common
  no_log: true
  diff: false
  ansible.builtin.include_role:
    name: service_common
    tasks_from: infisical
    apply:
      tags: [deploy, update, recreate, drift]
  vars:
    service_common_infisical_secrets_map: "{{ secrets_map | default([]) }}"
    service_common_infisical_lookup_params: "{{ infisical_lookup_default_params | default({}) }}"
    service_common_infisical_fail_on_empty: "{{ infisical_fail_on_empty | default(true) }}"
  tags: [deploy, update, recreate, drift]

- name: Prep - Infisical Fetch | Recreate flattened compatibility facts
  when:
    - not ansible_check_mode
    - (infisical_flatten | default(true)) | bool
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    "{{ infisical_secret_item.var }}": "{{ service_common_secret_values[infisical_secret_item.var] }}"
  loop: "{{ service_common_infisical_config.secrets_map }}"
  loop_control:
    loop_var: infisical_secret_item
    label: "{{ infisical_secret_item.var }}"
  tags: [deploy, update, recreate, drift]

- name: Prep - Infisical Fetch | Recreate dictionary compatibility fact
  when:
    - not ansible_check_mode
    - not (infisical_flatten | default(true)) | bool
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    "{{ infisical_out_var | default('infisical_secrets') }}": "{{ service_common_secret_values }}"
  tags: [deploy, update, recreate, drift]
