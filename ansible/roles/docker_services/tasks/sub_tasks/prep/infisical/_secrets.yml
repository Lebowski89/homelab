---

- name: Prep - Infisical Secrets | Resolve deploy host
  ansible.builtin.set_fact:
    docker_services_secrets_deploy_host: >-
      {{
        (
          docker_services_svc.deploy.host
          | default(docker_services_deploy_host_effective, true)
          | default(docker_services_primary_manager, true)
        )
        | string | trim
      }}

- name: Prep - Infisical Secrets | Resolve effective secrets host
  ansible.builtin.set_fact:
    docker_services_secrets_host_effective: >-
      {{
        docker_services_primary_manager
        if (docker_services_stack_deploy_type | default('swarm', true)) == 'swarm'
        else docker_services_secrets_deploy_host
      }}

- name: Prep - Infisical Secrets | Build desired secret items from common declarations
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    docker_services_docker_secret_items: >-
      {%- set out = [] -%}
      {%- set declarations = hostvars[docker_services_primary_manager].docker_services_secret_declarations | default([]) -%}
      {%- set values = hostvars[docker_services_primary_manager].docker_services_infisical_values | default({}) -%}
      {%- for declaration in declarations -%}
      {%- if declaration.var is defined and (declaration.var | string | trim | length > 0) -%}
      {%- set item = {
            'name': declaration.name,
            'var': declaration.var,
            'value': values[declaration.var] | default('', true) | string
          } -%}
      {%- for field in ['uid', 'gid', 'mode'] -%}
      {%- if declaration[field] is defined -%}
      {%- set _ = item.update({field: declaration[field]}) -%}
      {%- endif -%}
      {%- endfor -%}
      {%- set _ = out.append(item) -%}
      {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Prep - Infisical Secrets | Validate runtime attachment metadata before materialization
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    docker_services_secret_attachments_validated: >-
      {{
        docker_services_svc.secrets
        | default([])
        | docker_services_secret_attachments(
            hostvars[docker_services_primary_manager].docker_services_secret_declarations | default([]),
            docker_services_stack_deploy_type | default('swarm', true)
          )
      }}

- name: Prep - Infisical Secrets | Reject empty secret values before materialization
  no_log: true
  diff: false
  ansible.builtin.assert:
    that:
      - docker_services_docker_secret_items | selectattr('value', 'equalto', '') | list | length == 0
    fail_msg: "A required Docker secret value is empty; runtime secret creation was stopped."

- name: Prep - Infisical Secrets | Create Docker Swarm secrets
  no_log: true
  diff: false
  when:
    - (docker_services_stack_deploy_type | default('container', true)) == 'swarm'
    - (docker_services_docker_secret_items | length) > 0
    - (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length) > 0
  community.docker.docker_secret:
    name: "{{ prep_sec.name }}"
    data: "{{ prep_sec.value }}"
    state: present
  loop: "{{ docker_services_docker_secret_items | selectattr('value', 'ne', '') | list }}"
  loop_control:
    loop_var: prep_sec
    label: "{{ prep_sec.name }}"
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Prep - Infisical Secrets | Ensure secrets directory exists on deploy host
  no_log: true
  diff: false
  when:
    - (docker_services_stack_deploy_type | default('container', true)) != 'swarm'
    - (docker_services_docker_secret_items | length) > 0
    - (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length) > 0
  ansible.builtin.file:
    path: "/opt/stacks/{{ docker_services_stack_name }}/secrets"
    state: directory
    mode: "0700"
    owner: "{{ hostvars[docker_services_secrets_host_effective].docker_host_puid | default('1000') }}"
    group: "{{ hostvars[docker_services_secrets_host_effective].docker_host_pgid | default('1000') }}"
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Prep - Infisical Secrets | Remove secret path if it exists but is a directory
  no_log: true
  diff: false
  when:
    - (docker_services_stack_deploy_type | default('container', true)) != 'swarm'
    - (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length) > 0
  ansible.builtin.file:
    path: "/opt/stacks/{{ docker_services_stack_name }}/secrets/{{ prep_sec.name }}"
    state: absent
  loop: "{{ docker_services_docker_secret_items | selectattr('value', 'ne', '') | list }}"
  loop_control:
    loop_var: prep_sec
    label: "{{ prep_sec.name }}"
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Prep - Infisical Secrets | Write secret files on deploy host
  no_log: true
  diff: false
  when:
    - (docker_services_stack_deploy_type | default('container', true)) != 'swarm'
    - (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length) > 0
  ansible.builtin.copy:
    dest: "/opt/stacks/{{ docker_services_stack_name }}/secrets/{{ prep_sec.name }}"
    content: "{{ prep_sec.value }}"
    mode: "{{ prep_sec.mode | default('0600') }}"
    owner: >-
      {{
        prep_sec.uid
        | default(hostvars[docker_services_secrets_host_effective].docker_host_puid | default('1000'))
      }}
    group: >-
      {{
        prep_sec.gid
        | default(hostvars[docker_services_secrets_host_effective].docker_host_pgid | default('1000'))
      }}
    force: true
  loop: "{{ docker_services_docker_secret_items | selectattr('value', 'ne', '') | list }}"
  loop_control:
    loop_var: prep_sec
    label: "{{ prep_sec.name }}"
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Prep - Infisical Secrets | Verify secret paths exist and are files
  no_log: true
  diff: false
  when:
    - (docker_services_stack_deploy_type | default('container', true)) != 'swarm'
    - (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length) > 0
  ansible.builtin.stat:
    path: "/opt/stacks/{{ docker_services_stack_name }}/secrets/{{ prep_sec.name }}"
  loop: "{{ docker_services_docker_secret_items | selectattr('value', 'ne', '') | list }}"
  loop_control:
    loop_var: prep_sec
    label: "{{ prep_sec.name }}"
  register: docker_services_secret_files_verify
  delegate_to: "{{ docker_services_secrets_host_effective }}"

- name: Prep - Infisical Secrets | Fail if any secret path is not a file
  no_log: true
  diff: false
  when:
    - (docker_services_stack_deploy_type | default('container', true)) != 'swarm'
    - (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length) > 0
  ansible.builtin.assert:
    that:
      - docker_services_secret_files_verify.results[sec_idx].stat.exists | default(false)
      - not (docker_services_secret_files_verify.results[sec_idx].stat.isdir | default(false))
    fail_msg: >-
      Secret path is not a file on deploy host '{{ docker_services_secrets_host_effective }}':
      /opt/stacks/{{ docker_services_stack_name }}/secrets/{{
        (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list)[sec_idx].name
      }}
      This usually means Docker created it as a directory before secrets were written.
  loop: "{{ range(0, (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list | length)) | list }}"
  loop_control:
    loop_var: sec_idx
    label: "{{ (docker_services_docker_secret_items | selectattr('value', 'ne', '') | list)[sec_idx].name }}"
