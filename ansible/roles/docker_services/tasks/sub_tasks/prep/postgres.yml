---

################################
# CREDS (VIA INFISICAL)
################################

- name: Prep - Postgres | Ensure creds exist
  no_log: true
  diff: false
  when: inventory_hostname == docker_services_primary_manager
  block:
    - name: Prep - Postgres | Detect if creds are missing
      ansible.builtin.set_fact:
        docker_services_pg_creds_missing: >-
          {{
            (postgres_host | default('') | string | trim | length == 0)
            or
            (postgres_port | default('') | string | trim | length == 0)
            or
            (postgres_user | default('') | string | trim | length == 0)
            or
            (postgres_pass | default('') | string | trim | length == 0)
          }}

    - name: Prep - Postgres | Fetch Postgres creds from Infisical
      when: docker_services_pg_creds_missing | bool
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/sub_tasks/prep/infisical/_fetch.yml"
      vars:
        infisical_fail_on_empty: true
        infisical_flatten: true
        infisical_environment: {}
        secrets_map:
          - var: postgres_host
            path: "{{ postgres_infisical_path | default('/Postgres') }}"
            name: "{{ postgres_infisical_host_name | default('HOST') }}"
          - var: postgres_port
            path: "{{ postgres_infisical_path | default('/Postgres') }}"
            name: "{{ postgres_infisical_port_name | default('PORT') }}"
          - var: postgres_user
            path: "{{ postgres_infisical_path | default('/Postgres') }}"
            name: "{{ postgres_infisical_user_name | default('USER') }}"
          - var: postgres_pass
            path: "{{ postgres_infisical_path | default('/Postgres') }}"
            name: "{{ postgres_infisical_pass_name | default('PASS') }}"

    - name: Prep - Postgres | Assert creds are now present
      ansible.builtin.assert:
        that:
          - (postgres_host | default('') | string | trim | length) > 0
          - (postgres_port | default('') | string | trim | length) > 0
          - (postgres_user | default('') | string | trim | length) > 0
          - (postgres_pass | default('') | string | trim | length) > 0
        fail_msg: "postgres_user/postgres_pass are still empty on mgt after Infisical fetch."
  rescue:
    - name: Prep - Postgres | Fail credential resolution with context
      ansible.builtin.fail:
        msg: >-
          Failed while resolving Postgres credentials from variables/Infisical.
          Fix the failed task above and rerun.

################################
# DOCKER SECRET
################################

- name: Prep - Postgres | Prepare docker secret
  no_log: true
  diff: false
  when: inventory_hostname == docker_services_primary_manager
  community.docker.docker_secret:
    name: postgres_pass_secret
    data: "{{ postgres_pass }}"
    state: present

################################
# DATABASE
################################

- name: Prep - Postgres | Normalize postgres database list
  when:
    - inventory_hostname == docker_services_primary_manager
    - docker_services_svc.postgres is defined
    - (docker_services_svc.postgres.enable | default(false)) | bool
  ansible.builtin.set_fact:
    docker_services_postgres_databases: >-
      {{
        (docker_services_svc.postgres.databases | list)
        if (
          docker_services_svc.postgres.databases is defined
          and docker_services_svc.postgres.databases is sequence
          and docker_services_svc.postgres.databases is not string
        )
        else
        ([ (docker_services_svc.postgres.databases | string | trim) ]
          if (docker_services_svc.postgres.databases is defined and (docker_services_svc.postgres.databases | string | trim | length > 0))
          else
          [])
      }}

- name: Prep - Postgres | Ping for existing database(s)
  no_log: true
  when:
    - inventory_hostname == docker_services_primary_manager
    - (docker_services_postgres_databases | default([]) | length) > 0
  community.postgresql.postgresql_ping:
    login_host: "{{ postgres_host }}"
    login_user: "{{ postgres_user }}"
    login_password: "{{ postgres_pass }}"
    login_port: "{{ postgres_port | int }}"
    login_db: "{{ postgres_db_item }}"
  loop: "{{ docker_services_postgres_databases }}"
  loop_control:
    loop_var: postgres_db_item
  register: docker_services_postgres_ping_results

- name: Prep - Postgres | Create database(s) if missing
  no_log: true
  diff: false
  when:
    - inventory_hostname == docker_services_primary_manager
    - docker_services_postgres_ping_results is defined
    - postgres_ping_result is defined
    - not (postgres_ping_result.is_available | default(false))
  community.postgresql.postgresql_db:
    login_host: "{{ postgres_host }}"
    login_user: "{{ postgres_user }}"
    login_password: "{{ postgres_pass }}"
    login_port: "{{ postgres_port | int }}"
    name: "{{ postgres_ping_result.postgres_db_item }}"
    state: present
  loop: "{{ docker_services_postgres_ping_results.results | default([]) }}"
  loop_control:
    loop_var: postgres_ping_result
    label: "{{ postgres_ping_result.postgres_db_item }}"
