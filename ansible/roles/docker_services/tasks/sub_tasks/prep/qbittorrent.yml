---

- name: Prep - qBittorrent | Set derived vars
  ansible.builtin.set_fact:
    docker_services_qbittorrent_fs_host: "{{ docker_services_fs_hosts_effective | first }}"
    docker_services_qbittorrent_is_downloads: >-
      {{
        (docker_services_svc.name | default('') | string | trim) == "qbittorrent"
      }}
    docker_services_qbittorrent_is_seeds: >-
      {{
        (docker_services_svc.name | default('') | string | trim) == "qbittorrent-xs"
      }}
  run_once: true

################################
# DOWNLOADS INSTANCE
################################

- name: Prep - qBittorrent | Assert downloads-instance password is present
  when: docker_services_qbittorrent_is_downloads | bool
  ansible.builtin.assert:
    that:
      - qbittorrent_pass is defined
      - qbittorrent_pass | string | trim | length > 0
    fail_msg: "qbittorrent_pass must be defined and non-empty for qbittorrent."
  run_once: true
  no_log: true

- name: Prep - qBittorrent | Generate downloads-instance pass
  when: docker_services_qbittorrent_is_downloads | bool
  qbittorrent_passwd:
    password: "{{ qbittorrent_pass }}"
  register: docker_services_qbittorrent_pass_pbkdf2_result
  delegate_to: "{{ docker_services_qbittorrent_fs_host }}"
  run_once: true
  no_log: true

- name: Prep - qBittorrent | Store downloads-instance pass hash
  when:
    - docker_services_qbittorrent_is_downloads | bool
    - docker_services_qbittorrent_pass_pbkdf2_result is defined
    - docker_services_qbittorrent_pass_pbkdf2_result.msg is defined
  ansible.builtin.set_fact:
    docker_services_qbittorrent_pass_pbkdf2: "{{ docker_services_qbittorrent_pass_pbkdf2_result.msg }}"
  run_once: true
  no_log: true

- name: Prep - qBittorrent | Assert downloads-instance pass hash was generated
  when: docker_services_qbittorrent_is_downloads | bool
  ansible.builtin.assert:
    that:
      - docker_services_qbittorrent_pass_pbkdf2 is defined
      - docker_services_qbittorrent_pass_pbkdf2 | string | trim | length > 0
    fail_msg: "docker_services_qbittorrent_pass_pbkdf2 was not generated."
  run_once: true
  no_log: true

################################
# SEEDS INSTANCE
################################

- name: Prep - qBittorrent | Assert seeds-instance password is present
  when: docker_services_qbittorrent_is_seeds | bool
  ansible.builtin.assert:
    that:
      - qbittorrent_xs_pass is defined
      - qbittorrent_xs_pass | string | trim | length > 0
    fail_msg: "qbittorrent_xs_pass must be defined and non-empty for qbittorrent-xs."
  run_once: true
  no_log: true

- name: Prep - qBittorrent | Generate seeds-instance pass
  when: docker_services_qbittorrent_is_seeds | bool
  qbittorrent_passwd:
    password: "{{ qbittorrent_xs_pass }}"
  register: docker_services_qbittorrent_xs_pass_pbkdf2_result
  delegate_to: "{{ docker_services_qbittorrent_fs_host }}"
  run_once: true
  no_log: true

- name: Prep - qBittorrent | Store seeds-instance pass hash
  when:
    - docker_services_qbittorrent_is_seeds | bool
    - docker_services_qbittorrent_xs_pass_pbkdf2_result is defined
    - docker_services_qbittorrent_xs_pass_pbkdf2_result.msg is defined
  ansible.builtin.set_fact:
    docker_services_qbittorrent_xs_pass_pbkdf2: "{{ docker_services_qbittorrent_xs_pass_pbkdf2_result.msg }}"
  run_once: true
  no_log: true

- name: Prep - qBittorrent | Assert seeds-instance pass hash was generated
  when: docker_services_qbittorrent_is_seeds | bool
  ansible.builtin.assert:
    that:
      - docker_services_qbittorrent_xs_pass_pbkdf2 is defined
      - docker_services_qbittorrent_xs_pass_pbkdf2 | string | trim | length > 0
    fail_msg: "docker_services_qbittorrent_xs_pass_pbkdf2 was not generated."
  run_once: true
  no_log: true
