---

- name: Prep - Traefik zone | Detect whether a base zone is required and missing
  ansible.builtin.set_fact:
    docker_services_cf_zone_missing: >-
      {{
        docker_services_svc.traefik.zone | default('') | string | trim | length == 0
        and cloudflare_zone | default('') | string | trim | length == 0
      }}

- name: Prep - Traefik zone | Fetch cloudflare_zone from Infisical
  when:
    - docker_services_cf_zone_missing | bool
    - not ansible_check_mode
  ansible.builtin.include_tasks: "{{ role_path }}/tasks/sub_tasks/prep/infisical/_fetch.yml"
  vars:
    infisical_fail_on_empty: true
    infisical_flatten: true
    infisical_environment: {}
    secrets_map:
      - var: cloudflare_zone
        path: /Cloudflare
        name: ZONE

- name: Prep - Traefik zone | Use a non-routable check-mode zone without fetching secrets
  when:
    - docker_services_cf_zone_missing | bool
    - ansible_check_mode
  ansible.builtin.set_fact:
    docker_services_traefik_check_base_zone: check-mode.invalid
  changed_when: false
