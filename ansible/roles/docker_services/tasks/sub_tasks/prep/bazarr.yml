---

- name: Prep - Bazarr | Set derived vars
  ansible.builtin.set_fact:
    docker_services_bazarr_fs_host: "{{ docker_services_fs_hosts_effective | first }}"
    docker_services_bazarr_config_dir: >-
      {{ hostvars[docker_services_fs_hosts_effective | first].docker_host_appdata_root }}/bazarr
    docker_services_bazarr_config_file: >-
      {{ hostvars[docker_services_fs_hosts_effective | first].docker_host_appdata_root }}/bazarr/config/config.yaml
    docker_services_bazarr_image: "{{ docker_services_svc.image }}"
    docker_services_bazarr_timezone: "{{ timezone }}"
    docker_services_bazarr_puid: >-
      {{ hostvars[docker_services_fs_hosts_effective | first].docker_host_puid | default('1000') }}
    docker_services_bazarr_pgid: >-
      {{ hostvars[docker_services_fs_hosts_effective | first].docker_host_pgid | default('1000') }}
    docker_services_bazarr_port: >-
      {{ docker_services_svc.traefik.port | default('6767') | string }}
    docker_services_bazarr_radarr_ip: "{{ docker_services_svc.prep.radarr.host }}"
    docker_services_bazarr_radarr_port: "{{ docker_services_svc.prep.radarr.port }}"
    docker_services_bazarr_sonarr_ip: "{{ docker_services_svc.prep.sonarr.host }}"
    docker_services_bazarr_sonarr_port: "{{ docker_services_svc.prep.sonarr.port }}"
  run_once: true

- name: Prep - Bazarr | Set secret vars
  no_log: true
  ansible.builtin.set_fact:
    docker_services_bazarr_api_key: "{{ bazarr_api | default('') }}"
    docker_services_bazarr_opensubtitlescom_user: "{{ opensubtitlescom_user | default('') }}"
    docker_services_bazarr_opensubtitlescom_pass: "{{ opensubtitlescom_pass | default('') }}"
    docker_services_bazarr_radarr_api_key: "{{ radarr_api | default('') }}"
    docker_services_bazarr_sonarr_api_key: "{{ sonarr_api | default('') }}"
  run_once: true

- name: Prep - Bazarr | Set postgres vars
  when: (docker_services_svc.postgres.enable | default(false)) | bool
  no_log: true
  ansible.builtin.set_fact:
    docker_services_bazarr_pg_db: >-
      {{
        (
          docker_services_svc.postgres.databases | first
        )
        if (
          docker_services_svc.postgres is defined
          and docker_services_svc.postgres.databases is defined
          and docker_services_svc.postgres.databases is sequence
          and docker_services_svc.postgres.databases is not string
          and (docker_services_svc.postgres.databases | length > 0)
        )
        else 'bazarr'
      }}
    docker_services_bazarr_pg_host: "{{ docker_services_svc.prep.postgres.host }}"
    docker_services_bazarr_pg_port: "{{ docker_services_svc.prep.postgres.port }}"
    docker_services_bazarr_pg_user: "{{ postgres_user | default('') }}"
    docker_services_bazarr_pg_pass: "{{ postgres_pass | default('') }}"
  run_once: true

- name: Prep - Bazarr | Assert postgres inputs are complete
  when: (docker_services_svc.postgres.enable | default(false)) | bool
  no_log: true
  ansible.builtin.assert:
    that:
      - docker_services_bazarr_pg_host | string | trim | length > 0
      - docker_services_bazarr_pg_port | string | trim | length > 0
      - docker_services_bazarr_pg_user | string | trim | length > 0
      - docker_services_bazarr_pg_pass | string | trim | length > 0
    fail_msg: "Bazarr postgres settings are incomplete."
  run_once: true

- name: Prep - Bazarr | Ensure config dir exists
  ansible.builtin.file:
    path: "{{ docker_services_bazarr_config_dir }}"
    state: directory
    owner: "{{ docker_services_bazarr_puid }}"
    group: "{{ docker_services_bazarr_pgid }}"
    mode: "0755"
  delegate_to: "{{ docker_services_bazarr_fs_host }}"
  run_once: true

- name: Prep - Bazarr | Check config exists
  ansible.builtin.stat:
    path: "{{ docker_services_bazarr_config_file }}"
  register: docker_services_bazarr_cfg_stat
  delegate_to: "{{ docker_services_bazarr_fs_host }}"
  run_once: true

- name: Prep - Bazarr | Generate Bazarr config (temp container)
  when: not docker_services_bazarr_cfg_stat.stat.exists
  run_once: true
  block:
    - name: Prep - Bazarr | Start temp container to generate config
      community.docker.docker_container:
        name: bazarr-config
        image: "{{ docker_services_bazarr_image }}"
        pull: true
        state: started
        container_default_behavior: compatibility
        detach: true
        env:
          TZ: "{{ docker_services_bazarr_timezone }}"
          PUID: "{{ docker_services_bazarr_puid }}"
          PGID: "{{ docker_services_bazarr_pgid }}"
        volumes:
          - "{{ docker_services_bazarr_config_dir }}:/config"
        restart_policy: "no"
      delegate_to: "{{ docker_services_bazarr_fs_host }}"

    - name: Prep - Bazarr | Wait for config.yaml to appear
      ansible.builtin.wait_for:
        path: "{{ docker_services_bazarr_config_file }}"
        state: present
        timeout: 180
      delegate_to: "{{ docker_services_bazarr_fs_host }}"

    - name: Prep - Bazarr | Give Bazarr time to finish writing config
      ansible.builtin.pause:
        seconds: 10

  always:
    - name: Prep - Bazarr | Remove temp config container
      community.docker.docker_container:
        container_default_behavior: compatibility
        name: bazarr-config
        state: absent
        stop_timeout: 10
      register: docker_services_bazarr_rm_tmp
      retries: 5
      delay: 5
      until: docker_services_bazarr_rm_tmp is succeeded
      delegate_to: "{{ docker_services_bazarr_fs_host }}"

- name: Prep - Bazarr | Configure api setting
  no_log: true
  yedit:
    src: "{{ docker_services_bazarr_config_file }}"
    key: "auth.apikey"
    value: "{{ docker_services_bazarr_api_key }}"
  delegate_to: "{{ docker_services_bazarr_fs_host }}"
  run_once: true

- name: Prep - Bazarr | Configure misc settings
  yedit:
    src: "{{ docker_services_bazarr_config_file }}"
    key: "{{ bazarr_settings_misc.key }}"
    value: "{{ bazarr_settings_misc.value }}"
  loop: "{{ _bazarr_misc_config | dict2items }}"
  loop_control:
    loop_var: bazarr_settings_misc
  vars:
    _bazarr_misc_config:
      analytics.enabled: "false"
      general.port: "{{ docker_services_bazarr_port }}"
  delegate_to: "{{ docker_services_bazarr_fs_host }}"
  run_once: true

- name: Prep - Bazarr | Configure opensubtitlescom settings
  no_log: true
  yedit:
    src: "{{ docker_services_bazarr_config_file }}"
    key: "{{ bazarr_settings_subtitles.key }}"
    value: "{{ bazarr_settings_subtitles.value }}"
  loop: "{{ _bazarr_opensubtitlescom_config | dict2items }}"
  loop_control:
    loop_var: bazarr_settings_subtitles
  vars:
    _bazarr_opensubtitlescom_config:
      opensubtitlescom.username: "{{ docker_services_bazarr_opensubtitlescom_user }}"
      opensubtitlescom.password: "{{ docker_services_bazarr_opensubtitlescom_pass }}"
      opensubtitlescom.use_hash: "true"
  delegate_to: "{{ docker_services_bazarr_fs_host }}"
  run_once: true

- name: Prep - Bazarr | Configure radarr settings
  no_log: true
  yedit:
    src: "{{ docker_services_bazarr_config_file }}"
    key: "{{ bazarr_settings_radarr.key }}"
    value: "{{ bazarr_settings_radarr.value }}"
  loop: "{{ _bazarr_radarr_config | dict2items }}"
  loop_control:
    loop_var: bazarr_settings_radarr
  vars:
    _bazarr_radarr_config:
      general.use_radarr: "true"
      radarr.apikey: "{{ docker_services_bazarr_radarr_api_key }}"
      radarr.ip: "{{ docker_services_bazarr_radarr_ip }}"
      radarr.port: "{{ docker_services_bazarr_radarr_port }}"
      radarr.ssl: "false"
  delegate_to: "{{ docker_services_bazarr_fs_host }}"
  run_once: true

- name: Prep - Bazarr | Configure sonarr settings
  no_log: true
  yedit:
    src: "{{ docker_services_bazarr_config_file }}"
    key: "{{ bazarr_settings_sonarr.key }}"
    value: "{{ bazarr_settings_sonarr.value }}"
  loop: "{{ _bazarr_sonarr_config | dict2items }}"
  loop_control:
    loop_var: bazarr_settings_sonarr
  vars:
    _bazarr_sonarr_config:
      general.use_sonarr: "true"
      sonarr.apikey: "{{ docker_services_bazarr_sonarr_api_key }}"
      sonarr.ip: "{{ docker_services_bazarr_sonarr_ip }}"
      sonarr.port: "{{ docker_services_bazarr_sonarr_port }}"
      sonarr.ssl: "false"
  delegate_to: "{{ docker_services_bazarr_fs_host }}"
  run_once: true

- name: Prep - Bazarr | Configure postgres settings
  no_log: true
  yedit:
    src: "{{ docker_services_bazarr_config_file }}"
    key: "{{ bazarr_settings_postgres.key }}"
    value: "{{ bazarr_settings_postgres.value }}"
  loop: "{{ _bazarr_postgres_config | dict2items }}"
  loop_control:
    loop_var: bazarr_settings_postgres
  vars:
    _bazarr_postgres_config:
      postgresql.database: "{{ docker_services_bazarr_pg_db | default('bazarr') }}"
      postgresql.enabled: "{{ ((docker_services_svc.postgres.enable | default(false)) | bool) | ternary('true', 'false') }}"
      postgresql.host: "{{ docker_services_bazarr_pg_host | default('') }}"
      postgresql.port: "{{ docker_services_bazarr_pg_port | default('') }}"
      postgresql.username: "{{ docker_services_bazarr_pg_user | default('') }}"
      postgresql.password: "{{ docker_services_bazarr_pg_pass | default('') }}"
  delegate_to: "{{ docker_services_bazarr_fs_host }}"
  run_once: true
