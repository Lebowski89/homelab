---

- name: Prometheus routes | Validate the bounded configuration operation
  ansible.builtin.assert:
    that:
      - docker_services_prometheus_routes_kind | default('alertmanager') in ['alertmanager', 'scraparr']

- name: Prometheus routes | Resolve only the canonical file and selected fragments
  ansible.builtin.set_fact:
    docker_services_prometheus_routes_file: '{{ (docker_services_prometheus_catalog.prometheus.templates | selectattr(''src'', ''equalto'',
      ''configs/prometheus/prometheus.yml.j2'') | first).dest }}'
    docker_services_prometheus_routes_discovery: '{{ (lookup(''ansible.builtin.template'', playbook_dir ~ ''/roles/service_common/templates/configs/prometheus/alertmanager-discovery.yml.j2'')
      | from_yaml) if docker_services_prometheus_routes_kind | default(''alertmanager'') == ''alertmanager'' else {} }}'
    docker_services_prometheus_routes_job: '{{ (lookup(''ansible.builtin.template'', playbook_dir ~ ''/roles/service_common/templates/configs/prometheus/'' ~ (docker_services_prometheus_routes_kind | default(''alertmanager'')) ~ ''-scrape.yml.j2'')
      | from_yaml)[0] }}'
- name: Prometheus routes | Resolve exactly the running Swarm caller
  ansible.builtin.command:
    argv:
      - docker
      - --host
      - unix:///var/run/docker.sock
      - ps
      - --no-trunc
      - --filter
      - label=com.docker.swarm.service.name=prometheus_prometheus
      - --format
      - '{{ "{{.ID}}" }}'
  register: docker_services_prometheus_routes_ids
  changed_when: false
  check_mode: false
- name: Prometheus routes | Reject absent or ambiguous live callers
  ansible.builtin.assert:
    that:
      - docker_services_prometheus_routes_ids.stdout_lines | length == 1
      - docker_services_prometheus_routes_ids.stdout is match('^[a-f0-9]{64}$')
    fail_msg: Exactly one current prometheus_prometheus Swarm container is required; no runtime migration is performed.
- name: Prometheus routes | Project the exact caller and configuration mount without environments
  ansible.builtin.command:
    argv:
      - docker
      - --host
      - unix:///var/run/docker.sock
      - inspect
      - --format
      - '{{ ''{{ $managed := false }}{{ range .Config.Cmd }}{{ if eq . "--config.file=/etc/prometheus/prometheus.yml" }}{{ $managed
        = true }}{{ end }}{{ end }}{"id":{{json .Id}},"pid":{{.State.Pid}},"running":{{json .State.Running}},"managed_config":{{json
        $managed}},"service":{{json (index .Config.Labels "com.docker.swarm.service.name")}},"mounts":{{json .Mounts}}}'' }}'
      - '{{ docker_services_prometheus_routes_ids.stdout }}'
  register: docker_services_prometheus_routes_inspect
  changed_when: false
  check_mode: false
- name: Prometheus routes | Require the inventory-owned configuration bind
  ansible.builtin.assert:
    that:
      - docker_services_prometheus_routes_container.id == docker_services_prometheus_routes_ids.stdout
      - docker_services_prometheus_routes_container.running is sameas true
      - docker_services_prometheus_routes_container.pid is integer
      - docker_services_prometheus_routes_container.pid > 0
      - docker_services_prometheus_routes_container.managed_config is sameas true
      - docker_services_prometheus_routes_container.service == 'prometheus_prometheus'
      - docker_services_prometheus_routes_mounts | length == 1
      - docker_services_prometheus_routes_mounts[0].Type == 'bind'
      - docker_services_prometheus_routes_mounts[0].Source == docker_services_prometheus_routes_file | dirname
      - docker_services_prometheus_routes_mounts[0].RW is sameas false
    fail_msg: The current Swarm caller must mount the declared configuration directory read-only; stop on any mismatch.
  vars:
    docker_services_prometheus_routes_container: '{{ docker_services_prometheus_routes_inspect.stdout | from_json }}'
    docker_services_prometheus_routes_mounts: '{{ docker_services_prometheus_routes_container.mounts | selectattr(''Destination'', ''equalto'',
      ''/etc/prometheus'') | list }}'
- name: Prometheus routes | Resolve the exact identity query
  ansible.builtin.set_fact:
    docker_services_prometheus_routes_identity_query:
      - python3
      - -c
      - 'import json,sys; from pathlib import Path;

        p=int(sys.argv[1]); text=Path(f''/proc/{p}/stat'').read_text();

        print(json.dumps({''pid'':p,''birth'':text[text.rindex('')'')+2:].split()[19],

        ''netns'':str(Path(f''/proc/{p}/ns/net'').readlink())}))'
      - '{{ (docker_services_prometheus_routes_inspect.stdout | from_json).pid | string }}'
- name: Prometheus routes | Capture exact PID birth and network namespace
  ansible.builtin.command:
    argv: '{{ docker_services_prometheus_routes_identity_query }}'
  register: docker_services_prometheus_routes_context
  changed_when: false
  check_mode: false
- name: Prometheus routes | Inspect existing configuration ownership
  ansible.builtin.stat:
    path: '{{ docker_services_prometheus_routes_file }}'
    follow: false
  register: docker_services_prometheus_routes_stat
- name: Prometheus routes | Require the existing regular managed file
  ansible.builtin.assert:
    that:
      - docker_services_prometheus_routes_stat.stat.isreg | default(false)
      - not docker_services_prometheus_routes_stat.stat.islnk | default(false)
    fail_msg: The existing managed Prometheus configuration must be a regular file; do not create or repair it here.
- name: Prometheus routes | Read the managed configuration privately
  ansible.builtin.slurp:
    src: '{{ docker_services_prometheus_routes_file }}'
  register: docker_services_prometheus_routes_source
  no_log: true
  diff: false
- name: Prometheus routes | Build only the bounded configuration candidate
  ansible.builtin.set_fact:
    docker_services_prometheus_routes_candidate: '{{ (docker_services_prometheus_routes_source.content | b64decode | docker_services_prometheus_alertmanager_routes(docker_services_prometheus_routes_discovery,
      docker_services_prometheus_routes_job)) if docker_services_prometheus_routes_kind | default(''alertmanager'') == ''alertmanager'' else (docker_services_prometheus_routes_source.content | b64decode | docker_services_prometheus_scraparr_job(docker_services_prometheus_routes_job)) }}'
  no_log: true
  diff: false
- name: Prometheus routes | Show the scoped plan
  ansible.builtin.debug:
    msg: Update only {{ docker_services_prometheus_routes_kind | default('alertmanager') }} routes in {{ docker_services_prometheus_routes_file }}; preserve other jobs and validate with the exact caller's promtool. Reload with SIGHUP; no deployment or replacement.
- name: Prometheus routes | Resolve the read-only live configuration query
  ansible.builtin.set_fact:
    docker_services_prometheus_routes_query:
      - nsenter
      - --target
      - '{{ (docker_services_prometheus_routes_inspect.stdout | from_json).pid | string }}'
      - --net
      - /usr/bin/python3
      - -c
      - import json, urllib.request; opener=urllib.request.build_opener(urllib.request.ProxyHandler({})); response=json.load(opener.open('http://127.0.0.1:9090/api/v1/status/config',
        timeout=5)); assert response['status']=='success'; print(response['data']['yaml'])
- name: Prometheus routes | Validate apply and reload without replacement
  when: not ansible_check_mode
  block:
    - name: Prometheus routes | Inspect loaded configuration without exposing it
      ansible.builtin.command:
        argv: '{{ docker_services_prometheus_routes_query }}'
      register: docker_services_prometheus_routes_loaded
      changed_when: false
      no_log: true
      diff: false
    - name: Prometheus routes | Reject pre-existing file and loaded route drift before writes
      when: docker_services_prometheus_routes_kind | default('alertmanager') == 'alertmanager'
      ansible.builtin.assert:
        that:
          - (docker_services_prometheus_routes_source.content | b64decode | from_yaml).alerting.alertmanagers[0].scheme | default('http')
            == (docker_services_prometheus_routes_loaded.stdout | from_yaml).alerting.alertmanagers[0].scheme | default('http')
          - (docker_services_prometheus_routes_source.content | b64decode | from_yaml).alerting.alertmanagers[0].static_configs[0].targets
            == (docker_services_prometheus_routes_loaded.stdout | from_yaml).alerting.alertmanagers[0].static_configs[0].targets
          - ((docker_services_prometheus_routes_source.content | b64decode | from_yaml).scrape_configs | selectattr('job_name', 'equalto',
            'alertmanager') | first).scheme | default('http') == ((docker_services_prometheus_routes_loaded.stdout | from_yaml).scrape_configs
            | selectattr('job_name', 'equalto', 'alertmanager') | first).scheme | default('http')
          - ((docker_services_prometheus_routes_source.content | b64decode | from_yaml).scrape_configs | selectattr('job_name', 'equalto',
            'alertmanager') | first).static_configs[0].targets == ((docker_services_prometheus_routes_loaded.stdout | from_yaml).scrape_configs
            | selectattr('job_name', 'equalto', 'alertmanager') | first).static_configs[0].targets
        fail_msg: File and loaded Alertmanager routes differ; inspect the existing backup before attempting this transition.
      no_log: true
      diff: false
    - name: Prometheus routes | Reject Scraparr file and loaded job drift before writes
      when: docker_services_prometheus_routes_kind | default('alertmanager') == 'scraparr'
      ansible.builtin.assert:
        that:
          - ((docker_services_prometheus_routes_source.content | b64decode | from_yaml).scrape_configs | selectattr('job_name', 'equalto', 'scraparr') | list) == ((docker_services_prometheus_routes_loaded.stdout | from_yaml).scrape_configs | selectattr('job_name', 'equalto', 'scraparr') | list)
      no_log: true
      diff: false

    - name: Prometheus routes | Create an exact temporary candidate in the existing configuration mount
      ansible.builtin.tempfile:
        state: file
        path: '{{ docker_services_prometheus_routes_file | dirname }}'
        prefix: .skynet-alertmanager-routes-
        suffix: .yml
      register: docker_services_prometheus_routes_temporary
    - name: Prometheus routes | Populate the private candidate for the current promtool
      ansible.builtin.copy:
        content: '{{ docker_services_prometheus_routes_candidate }}'
        dest: '{{ docker_services_prometheus_routes_temporary.path }}'
        owner: '{{ docker_services_prometheus_routes_stat.stat.uid }}'
        group: '{{ docker_services_prometheus_routes_stat.stat.gid }}'
        mode: '{{ docker_services_prometheus_routes_stat.stat.mode }}'
      no_log: true
      diff: false
    - name: Prometheus routes | Validate using the existing image without pulls or new containers
      ansible.builtin.command:
        argv:
          - docker
          - --host
          - unix:///var/run/docker.sock
          - exec
          - '{{ docker_services_prometheus_routes_ids.stdout }}'
          - /bin/promtool
          - check
          - config
          - /etc/prometheus/{{ docker_services_prometheus_routes_temporary.path | basename }}
      changed_when: false
      no_log: true
      diff: false
    - name: Prometheus routes | Reject a concurrent configuration edit
      ansible.builtin.stat:
        path: '{{ docker_services_prometheus_routes_file }}'
      register: docker_services_prometheus_routes_before_write
    - name: Prometheus routes | Require the original file before applying
      ansible.builtin.assert:
        that:
          - docker_services_prometheus_routes_before_write.stat.checksum == docker_services_prometheus_routes_stat.stat.checksum
          - docker_services_prometheus_routes_before_write.stat.uid == docker_services_prometheus_routes_stat.stat.uid
          - docker_services_prometheus_routes_before_write.stat.gid == docker_services_prometheus_routes_stat.stat.gid
          - docker_services_prometheus_routes_before_write.stat.mode == docker_services_prometheus_routes_stat.stat.mode
    - name: Prometheus routes | Re-resolve the caller before applying configuration
      ansible.builtin.command:
        argv:
          - docker
          - --host
          - unix:///var/run/docker.sock
          - ps
          - --no-trunc
          - --filter
          - label=com.docker.swarm.service.name=prometheus_prometheus
          - --format
          - '{{ "{{.ID}}" }}'
      register: docker_services_prometheus_routes_current_ids
      changed_when: false
    - name: Prometheus routes | Reject replacement before applying configuration
      ansible.builtin.assert:
        that:
          - docker_services_prometheus_routes_current_ids.stdout == docker_services_prometheus_routes_ids.stdout
        fail_msg: The selected Swarm Prometheus caller changed; stop without applying or signalling another container.
    - name: Prometheus routes | Recheck the exact caller PID and namespace before writes
      ansible.builtin.command:
        argv:
          - docker
          - --host
          - unix:///var/run/docker.sock
          - container
          - inspect
          - --format
          - '{{ "{{.State.Pid}}" }}'
          - '{{ docker_services_prometheus_routes_ids.stdout }}'
      register: docker_services_prometheus_routes_current_pid
      changed_when: false
    - name: Prometheus routes | Reject changed PID before writes
      ansible.builtin.assert:
        that:
          - docker_services_prometheus_routes_current_pid.stdout | int == (docker_services_prometheus_routes_inspect.stdout | from_json).pid
    - name: Prometheus routes | Recheck PID birth and namespace before writes
      ansible.builtin.command:
        argv: '{{ docker_services_prometheus_routes_identity_query }}'
      register: docker_services_prometheus_routes_before_context
      changed_when: false
      check_mode: false
    - name: Prometheus routes | Reject identity change before writes
      ansible.builtin.assert:
        that:
          - docker_services_prometheus_routes_before_context.stdout == docker_services_prometheus_routes_context.stdout
    - name: Prometheus routes | Apply only the validated configuration and save its backup
      ansible.builtin.copy:
        content: '{{ docker_services_prometheus_routes_candidate }}'
        dest: '{{ docker_services_prometheus_routes_file }}'
        owner: '{{ docker_services_prometheus_routes_stat.stat.uid }}'
        group: '{{ docker_services_prometheus_routes_stat.stat.gid }}'
        mode: '{{ docker_services_prometheus_routes_stat.stat.mode }}'
        backup: true
      register: docker_services_prometheus_routes_applied
      no_log: true
      diff: false
    - name: Prometheus routes | Report the scoped configuration backup
      ansible.builtin.debug:
        msg: 'Configuration backup: {{ docker_services_prometheus_routes_applied.backup_file | default(''unchanged file'') }}'
    - name: Prometheus routes | Reload only the exact current Docker caller
      ansible.builtin.command:
        argv:
          - docker
          - --host
          - unix:///var/run/docker.sock
          - kill
          - --signal
          - HUP
          - '{{ docker_services_prometheus_routes_ids.stdout }}'
      when: '(docker_services_prometheus_routes_applied.changed or not ((docker_services_prometheus_routes_loaded.stdout | from_yaml).alerting.alertmanagers[0].scheme
        | default(''http'') == ''https'' and

        (docker_services_prometheus_routes_loaded.stdout | from_yaml).alerting.alertmanagers[0].static_configs[0].targets == docker_services_prometheus_routes_discovery.alertmanagers[0].static_configs[0].targets
        and

        ((docker_services_prometheus_routes_loaded.stdout | from_yaml).scrape_configs | selectattr(''job_name'', ''equalto'', ''alertmanager'')
        | first).scheme | default(''http'') == ''https'' and

        ((docker_services_prometheus_routes_loaded.stdout | from_yaml).scrape_configs | selectattr(''job_name'', ''equalto'', ''alertmanager'')
        | first).static_configs[0].targets == docker_services_prometheus_routes_job.static_configs[0].targets)) if docker_services_prometheus_routes_kind | default(''alertmanager'') == ''alertmanager'' else (docker_services_prometheus_routes_applied.changed or ((docker_services_prometheus_routes_loaded.stdout | from_yaml).scrape_configs | selectattr(''job_name'', ''equalto'', ''scraparr'') | list) != ((docker_services_prometheus_routes_candidate | from_yaml).scrape_configs | selectattr(''job_name'', ''equalto'', ''scraparr'') | list))'
      changed_when: true
    - name: Prometheus routes | Require fresh HTTPS discovery and successful scraping
      when: docker_services_prometheus_routes_kind | default('alertmanager') == 'alertmanager'
      ansible.builtin.command:
        argv:
          - nsenter
          - --target
          - '{{ (docker_services_prometheus_routes_inspect.stdout | from_json).pid | string }}'
          - --net
          - /usr/bin/python3
          - -c
          - 'import json, urllib.request;

            opener=urllib.request.build_opener(urllib.request.ProxyHandler({}));

            base=''http://127.0.0.1:9090'';

            a=json.load(opener.open(base+''/api/v1/alertmanagers'',timeout=5));

            t=json.load(opener.open(base+''/api/v1/targets?state=active'',timeout=5));

            assert a[''status'']==t[''status'']==''success'';

            print(json.dumps({''delivery'':[r[''url''] for r in a[''data''][''activeAlertmanagers'']],

            ''scrapes'':[{''url'':r[''scrapeUrl''],''health'':r[''health'']} for r in t[''data''][''activeTargets''] if r[''scrapePool'']==''alertmanager'']}))'
      register: docker_services_prometheus_routes_accepted
      changed_when: false
      until: 'docker_services_prometheus_routes_accepted.rc == 0 and (docker_services_prometheus_routes_accepted.stdout | from_json).delivery
        == [''https://'' ~ docker_services_prometheus_routes_job.static_configs[0].targets[0] ~ ''/api/v2/alerts''] and (docker_services_prometheus_routes_accepted.stdout
        | from_json).scrapes == [{''url'': ''https://'' ~ docker_services_prometheus_routes_job.static_configs[0].targets[0] ~ ''/metrics'',
        ''health'': ''up''}]'
      retries: 12
      delay: 5
      no_log: true
      diff: false
    - name: Prometheus routes | Require the freshly loaded Scraparr target and successful scrape
      when: docker_services_prometheus_routes_kind | default('alertmanager') == 'scraparr'
      ansible.builtin.command:
        argv:
          - nsenter
          - --target
          - '{{ (docker_services_prometheus_routes_inspect.stdout | from_json).pid | string }}'
          - --net
          - /usr/bin/python3
          - -c
          - >-
            import json,urllib.request;
            o=urllib.request.build_opener(urllib.request.ProxyHandler({}));
            r=json.load(o.open('http://127.0.0.1:9090/api/v1/targets?state=active',timeout=5));
            assert r['status']=='success';
            print(json.dumps([{'url':t['scrapeUrl'],'health':t['health'],'labels':t['labels']}
            for t in r['data']['activeTargets'] if t['scrapePool']=='scraparr']))
      register: docker_services_prometheus_routes_scraparr_accepted
      changed_when: false
      until: >-
        docker_services_prometheus_routes_scraparr_accepted.rc == 0 and
        (docker_services_prometheus_routes_scraparr_accepted.stdout | from_json) ==
        [{'url':'http://' ~ docker_services_prometheus_routes_job.static_configs[0].targets[0] ~ '/metrics',
          'health':'up','labels':{'job':'scraparr','instance':docker_services_prometheus_routes_job.static_configs[0].targets[0]}}]
      retries: 12
      delay: 5
      no_log: true
      diff: false

    - name: Prometheus routes | Confirm no caller replacement after reload
      ansible.builtin.command:
        argv:
          - docker
          - --host
          - unix:///var/run/docker.sock
          - ps
          - --no-trunc
          - --filter
          - label=com.docker.swarm.service.name=prometheus_prometheus
          - --format
          - '{{ "{{.ID}}" }}'
      register: docker_services_prometheus_routes_final_ids
      changed_when: false
    - name: Prometheus routes | Require the retained caller
      ansible.builtin.assert:
        that:
          - docker_services_prometheus_routes_final_ids.stdout == docker_services_prometheus_routes_ids.stdout
    - name: Prometheus routes | Recheck exact caller after reload
      ansible.builtin.command:
        argv: '{{ docker_services_prometheus_routes_identity_query }}'
      register: docker_services_prometheus_routes_after_context
      changed_when: false
      check_mode: false
    - name: Prometheus routes | Require unchanged birth and namespace
      ansible.builtin.assert:
        that:
          - docker_services_prometheus_routes_after_context.stdout == docker_services_prometheus_routes_context.stdout
  rescue:
    - name: Prometheus routes | Roll back only this invocation after a write
      when: docker_services_prometheus_routes_applied.changed | default(false) # noqa no-handler
    # Immediate failure recovery must run here, before leaving the operation.
      block:
        - name: Prometheus routes | Require the same caller before scoped rollback
          ansible.builtin.command:
            argv:
              - docker
              - --host
              - unix:///var/run/docker.sock
              - ps
              - --no-trunc
              - --filter
              - label=com.docker.swarm.service.name=prometheus_prometheus
              - --format
              - '{{ "{{.ID}}" }}'
          register: docker_services_prometheus_routes_rollback_ids
          changed_when: false
        - name: Prometheus routes | Inspect candidate continuity before rollback
          ansible.builtin.stat:
            path: '{{ docker_services_prometheus_routes_file }}'
          register: docker_services_prometheus_routes_rollback_stat
        - name: Prometheus routes | Reject conflicting writes or caller changes before rollback
          ansible.builtin.assert:
            that:
              - docker_services_prometheus_routes_rollback_ids.stdout == docker_services_prometheus_routes_ids.stdout
              - docker_services_prometheus_routes_rollback_stat.stat.checksum == (docker_services_prometheus_routes_candidate | hash('sha1'))
        - name: Prometheus routes | Recheck exact namespace before rollback
          ansible.builtin.command:
            argv: '{{ docker_services_prometheus_routes_identity_query }}'
          register: docker_services_prometheus_routes_rollback_context
          changed_when: false
          check_mode: false
        - name: Prometheus routes | Reject identity change before rollback
          ansible.builtin.assert:
            that:
              - docker_services_prometheus_routes_rollback_context.stdout == docker_services_prometheus_routes_context.stdout
        - name: Prometheus routes | Restore only the captured configuration
          ansible.builtin.copy:
            content: '{{ docker_services_prometheus_routes_source.content | b64decode }}'
            dest: '{{ docker_services_prometheus_routes_file }}'
            owner: '{{ docker_services_prometheus_routes_stat.stat.uid }}'
            group: '{{ docker_services_prometheus_routes_stat.stat.gid }}'
            mode: '{{ docker_services_prometheus_routes_stat.stat.mode }}'
          no_log: true
          diff: false
        - name: Prometheus routes | Reload only the unchanged caller after rollback
          ansible.builtin.command:
            argv:
              - docker
              - --host
              - unix:///var/run/docker.sock
              - kill
              - --signal
              - HUP
              - '{{ docker_services_prometheus_routes_ids.stdout }}'
          changed_when: true
    - name: Prometheus routes | Preserve failure after scoped rollback
      ansible.builtin.fail:
        msg: Prometheus route transition failed. Any configuration written by this invocation was restored only if caller/file continuity
          passed; inspect the recorded backup and private log. No application migration occurred.
  always:
    - name: Prometheus routes | Remove only this invocation's temporary candidate
      when: docker_services_prometheus_routes_temporary.path is defined
      ansible.builtin.file:
        path: '{{ docker_services_prometheus_routes_temporary.path }}'
        state: absent
