---

- name: Compose - Ports | Ensure docker_services_service_name is set
  ansible.builtin.assert:
    that:
      - docker_services_service_name is defined
      - docker_services_service_name | string | trim | length > 0
    fail_msg: "docker_services_service_name must be set before calling this helper"

- name: Compose - Ports | Capture existing ports list
  ansible.builtin.set_fact:
    docker_services_ports_existing: >-
      {{
        ((docker_services_compose_services | default({})).get(docker_services_service_name, {}).get('ports', []))
        | default([], true)
        | list
      }}

- name: Compose - Ports | Compute merged ports list
  ansible.builtin.set_fact:
    docker_services_ports_merged: >-
      {{
        docker_services_ports_existing
        | docker_services_merge_ports(
            ports | default(none, true),
            ports_list | default(none, true),
            ports_action | default('append', true),
            docker_services_stack_deploy_type | default('swarm', true),
            ports_container | default(none, true),
            ports_host | default(none, true),
            ports_protocol | default('tcp', true),
            ports_mode | default('ingress', true)
          )
      }}

- name: Compose - Ports | Attach ports to service
  ansible.builtin.set_fact:
    docker_services_compose_services: >-
      {{
        (docker_services_compose_services | default({}))
        | combine({
            docker_services_service_name: (
              ((docker_services_compose_services | default({})).get(docker_services_service_name, {}))
              | combine({ 'ports': docker_services_ports_merged }, recursive=true)
            )
          }, recursive=true)
      }}
