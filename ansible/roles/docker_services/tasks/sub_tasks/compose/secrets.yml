---

- name: Compose - Secrets | Ensure docker_services_service_name is set
  ansible.builtin.assert:
    that:
      - docker_services_service_name is defined
      - docker_services_service_name | string | trim | length > 0
    fail_msg: "docker_services_service_name must be set before calling this helper"

- name: Compose - Secrets | Normalize legacy and canonical attachments
  ansible.builtin.set_fact:
    docker_services_secrets_list: >-
      {{
        secrets
        | docker_services_secret_attachments(
            secret_declarations | default([]),
            docker_services_stack_deploy_type | default('swarm', true)
          )
      }}

- name: Compose - Secrets | Attach secrets list to service
  when:
    - (docker_services_stack_deploy_type | default('swarm', true)) == 'swarm'
    - (docker_services_secrets_list | length) > 0
  ansible.builtin.set_fact:
    docker_services_compose_services: >-
      {{
        (docker_services_compose_services | default({}))
        | combine({
            docker_services_service_name: (
              (docker_services_compose_services | default({})).get(docker_services_service_name, {})
              | combine({ 'secrets': docker_services_secrets_list }, recursive=true)
            )
          }, recursive=true)
      }}

- name: Compose - Secrets | Convert secrets to bind-mount volumes
  when: (docker_services_stack_deploy_type | default('swarm', true)) != 'swarm'
  ansible.builtin.set_fact:
    docker_services_secret_mounts: >-
      {{ docker_services_secrets_list | docker_services_secret_mounts(docker_services_stack_name) }}

- name: Compose - Secrets | Attach secret mounts to service volumes
  when:
    - (docker_services_stack_deploy_type | default('swarm', true)) != 'swarm'
    - (docker_services_secret_mounts | length) > 0
  ansible.builtin.set_fact:
    docker_services_compose_services: >-
      {{
        (docker_services_compose_services | default({}))
        | combine({
            docker_services_service_name: (
              (docker_services_compose_services | default({})).get(docker_services_service_name, {})
              | combine({
                  'volumes': (
                    (
                      (docker_services_compose_services | default({}))
                      .get(docker_services_service_name, {})
                      .get('volumes', [])
                      | default([], true)
                      | list
                    )
                    + docker_services_secret_mounts
                  )
                }, recursive=true)
            )
          }, recursive=true)
      }}
