---

- name: Compose - Volumes | Ensure docker_services_service_name is set
  ansible.builtin.assert:
    that:
      - docker_services_service_name is defined
      - docker_services_service_name | string | trim | length > 0
    fail_msg: "docker_services_service_name must be set before calling this helper"

- name: Compose - Volumes | Capture existing volumes list
  ansible.builtin.set_fact:
    docker_services_volumes_existing: >-
      {{
        ((docker_services_compose_services | default({})).get(docker_services_service_name, {}).get('volumes', []))
        | default([], true)
        | list
      }}

- name: Compose - Volumes | Compute merged volumes list
  ansible.builtin.set_fact:
    docker_services_volumes_merged: >-
      {{
        docker_services_volumes_existing
        | docker_services_merge_volumes(
            volumes | default(none, true),
            volumes_list | default(none, true),
            volumes_action | default('append', true),
            paths_type | default('bind', true),
            paths_host | default('', true),
            paths_container | default('', true),
            paths_read_only | default(false, true)
          )
      }}

- name: Compose - Volumes | Attach volumes to service
  ansible.builtin.set_fact:
    docker_services_compose_services: >-
      {{
        (docker_services_compose_services | default({}))
        | combine({
            docker_services_service_name: (
              ((docker_services_compose_services | default({})).get(docker_services_service_name, {}))
              | combine({ 'volumes': docker_services_volumes_merged }, recursive=true)
            )
          }, recursive=true)
      }}
