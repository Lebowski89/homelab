---

- name: Compose - Env | Ensure docker_services_service_name is set
  ansible.builtin.assert:
    that:
      - docker_services_service_name is defined
      - docker_services_service_name | string | trim | length > 0
    fail_msg: "docker_services_service_name must be set before calling this helper"

- name: Compose - Env | Ensure environment_action is valid
  ansible.builtin.assert:
    that:
      - environment_action | default('append') in ['append', 'replace', 'append_unique']
    fail_msg: "environment_action must be 'append', 'replace', or 'append_unique'"

- name: Compose - Env | Normalize environment inputs
  ansible.builtin.set_fact:
    docker_services_env_action: "{{ environment_action | default('append', true) | string | trim }}"
    docker_services_env_new: "{{ environment_vars | default({}, true) }}"
    docker_services_env_existing: >-
      {{
        (docker_services_compose_services | default({}))
        .get(docker_services_service_name, {})
        .get('environment', {})
        | default({}, true)
      }}

- name: Compose - Env | Build final environment dict
  ansible.builtin.set_fact:
    docker_services_env_final: >-
      {{
        docker_services_env_new
        if docker_services_env_action == 'replace'
        else
        (
          (docker_services_env_existing | combine(docker_services_env_new, recursive=true))
          if docker_services_env_action == 'append'
          else
          (docker_services_env_new | combine(docker_services_env_existing, recursive=true))
        )
      }}

- name: Compose - Env | Attach environment to service
  ansible.builtin.set_fact:
    docker_services_compose_services: >-
      {{
        (docker_services_compose_services | default({}))
        | combine({
            docker_services_service_name: (
              ((docker_services_compose_services | default({})).get(docker_services_service_name, {}))
              | combine({ 'environment': docker_services_env_final }, recursive=true)
            )
          }, recursive=true)
      }}
