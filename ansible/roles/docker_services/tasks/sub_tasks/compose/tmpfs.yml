---

- name: Compose - Tmpfs | Ensure tmpfs_action is valid
  ansible.builtin.assert:
    that:
      - tmpfs_action is defined
      - tmpfs_action in ['replace', 'append_unique']
    fail_msg: "tmpfs_action must be 'replace' or 'append_unique'"

- name: Compose - Tmpfs | Normalise tmpfs entries to list
  ansible.builtin.set_fact:
    docker_services_tmpfs_entries: >-
      {%- set ns = namespace(items=[]) -%}
      {%- if tmpfs is string -%}
        {%- set item = tmpfs | string | trim -%}
        {%- if item | length > 0 -%}
          {%- set ns.items = ns.items + [item] -%}
        {%- endif -%}
      {%- elif tmpfs is sequence and tmpfs is not string -%}
        {%- for item in tmpfs -%}
          {%- set val = item | string | trim -%}
          {%- if val | length > 0 -%}
            {%- set ns.items = ns.items + [val] -%}
          {%- endif -%}
        {%- endfor -%}
      {%- elif tmpfs is mapping -%}
        {%- for _, item in tmpfs.items() -%}
          {%- set val = item | string | trim -%}
          {%- if val | length > 0 -%}
            {%- set ns.items = ns.items + [val] -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endif -%}
      {{ ns.items }}

- name: Compose - Tmpfs | Merge tmpfs entries into compose services
  ansible.builtin.set_fact:
    docker_services_compose_services: >-
      {{
        (docker_services_compose_services | default({}))
        | combine({
            docker_services_service_name: (
              ((docker_services_compose_services | default({})).get(docker_services_service_name, {}))
              | combine({
                  'tmpfs': (
                    docker_services_tmpfs_entries
                    if tmpfs_action == 'replace'
                    else (
                      (
                        (
                          ((docker_services_compose_services | default({})).get(docker_services_service_name, {})).get('tmpfs', [])
                        )
                        + docker_services_tmpfs_entries
                      ) | unique
                    )
                  )
                }, recursive=true)
            )
          }, recursive=true)
      }}
