---

- name: Compose - Labels | Ensure docker_services_service_name is set
  ansible.builtin.assert:
    that:
      - docker_services_service_name is defined
      - docker_services_service_name | string | trim | length > 0
    fail_msg: "docker_services_service_name must be set before calling this helper"

- name: Compose - Labels | Capture existing labels
  ansible.builtin.set_fact:
    docker_services_labels_existing: >-
      {{
        (docker_services_compose_services | default({}))
        .get(docker_services_service_name, {})
        .get('labels', {})
        | default({}, true)
      }}

- name: Compose - Labels | Build final labels dict
  ansible.builtin.set_fact:
    docker_services_labels_h_final: >-
      {{
        docker_services_labels_existing
        | docker_services_merge_labels(
            labels_dict | default({}, true),
            labels_action | default('append', true),
            labels_precedence | default('new_wins', true)
          )
      }}

- name: Compose - Labels | Attach labels to service
  ansible.builtin.set_fact:
    docker_services_compose_services: >-
      {{
        (docker_services_compose_services | default({}))
        | combine({
            docker_services_service_name: (
              ((docker_services_compose_services | default({})).get(docker_services_service_name, {}))
              | combine({ 'labels': docker_services_labels_h_final }, recursive=true)
            )
          }, recursive=true)
      }}
