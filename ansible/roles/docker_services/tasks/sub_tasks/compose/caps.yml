---

- name: Compose - Caps | Ensure docker_services_service_name is set
  ansible.builtin.assert:
    that:
      - docker_services_service_name is defined
      - docker_services_service_name | string | trim | length > 0
    fail_msg: "docker_services_service_name must be set before calling this helper"

- name: Compose - Caps | Ensure caps_target is valid
  ansible.builtin.assert:
    that:
      - caps_target is defined
      - caps_target | string | trim in ['cap_add', 'cap_drop']
    fail_msg: "caps_target must be 'cap_add' or 'cap_drop'"

- name: Compose - Caps | Ensure caps_action is valid
  ansible.builtin.assert:
    that:
      - caps_action | default('append') in ['append', 'replace', 'append_unique']
    fail_msg: "caps_action must be 'append', 'replace', or 'append_unique'"

- name: Compose - Caps | Normalize caps input
  ansible.builtin.set_fact:
    docker_services_caps_new: >-
      {{
        (
          caps_list
          if (caps_list is defined)
          else
          ([cap] if cap is defined else [])
        )
        | default([], true)
        | list
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | list
      }}

- name: Compose - Caps | Add caps for service
  ansible.builtin.set_fact:
    docker_services_compose_services: >-
      {{
        (docker_services_compose_services | default({}))
        | combine({
            docker_services_service_name: (
              ((docker_services_compose_services | default({})).get(docker_services_service_name, {}))
              | combine({
                  (caps_target | string | trim): (
                    docker_services_caps_new
                    if (caps_action | default('append')) == 'replace'
                    else
                    (
                      (
                        (
                          (docker_services_compose_services | default({}))
                          .get(docker_services_service_name, {})
                          .get((caps_target | string | trim), [])
                          | default([], true)
                          | list
                        )
                      )
                      +
                      (
                        docker_services_caps_new
                        if (caps_action | default('append')) == 'append'
                        else
                        (
                          docker_services_caps_new
                          | reject(
                              'in',
                              (
                                (docker_services_compose_services | default({}))
                                .get(docker_services_service_name, {})
                                .get((caps_target | string | trim), [])
                                | default([], true)
                                | list
                              )
                            )
                          | list
                        )
                      )
                    )
                  )
                }, recursive=true)
            )
          }, recursive=true)
      }}
