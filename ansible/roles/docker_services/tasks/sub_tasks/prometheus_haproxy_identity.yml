---

- name: Prometheus scrape | Re-resolve the original Swarm service membership
  ansible.builtin.command:
    argv: [docker, --host, 'unix:///var/run/docker.sock', ps, --no-trunc, --filter,
           'label=com.docker.swarm.service.name=prometheus_prometheus', --format, '{{ "{{.ID}}" }}']
  register: docker_services_prometheus_scrape_current_ids
  changed_when: false

- name: Prometheus scrape | Inspect the original container and process again
  ansible.builtin.command:
    argv: "{{ docker_services_prometheus_scrape_inspect.cmd }}"
    expand_argument_vars: false
  register: docker_services_prometheus_scrape_current_identity
  changed_when: false

- name: Prometheus scrape | Require the original running container process and mount
  ansible.builtin.assert:
    that:
      - docker_services_prometheus_scrape_current_ids.stdout == docker_services_prometheus_scrape_ids.stdout
      - docker_services_prometheus_scrape_current_identity.stdout | from_json == docker_services_prometheus_scrape_inspect.stdout | from_json
    fail_msg: The original Swarm container, PID, ownership or mount changed; do not write configuration or signal a replacement.
