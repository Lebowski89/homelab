---

- name: Init | Normalize role interface vars (compat with old names)
  ansible.builtin.set_fact:
    docker_services_service_cfg: "{{ docker_services_service_cfg | default(service_cfg, true) }}"
    docker_services_service_target: "{{ docker_services_service_target | default(service_target, true) }}"
    docker_services_role_prefix: "{{ docker_services_role_prefix | default(role_prefix, true) }}"
    docker_services_service_cfg_found: "{{ docker_services_service_cfg_found | default(service_cfg_found, true) }}"
  tags: [remove, drift]

- name: Init | Ensure docker_services_service_cfg is provided
  ansible.builtin.assert:
    that:
      - docker_services_service_cfg is defined
      - docker_services_service_cfg is mapping
    fail_msg: >-
      docker_services role requires docker_services_service_cfg (mapping) to be passed from the playbook.
  tags: [remove, drift]

- name: Init | Validate target exists when targets are defined
  ansible.builtin.assert:
    that:
      - docker_services_service_cfg.targets is not defined
        or (docker_services_service_target | default('swarm')) in docker_services_service_cfg.targets
    fail_msg: >-
      Service '{{ docker_services_role_prefix | default("docker_services") }}' has targets,
      but target '{{ docker_services_service_target | default("swarm") }}' is not defined.
  tags: [remove, drift]

- name: Init | Derive base and target service config
  ansible.builtin.set_fact:
    docker_services_svc_base: >-
      {{
        docker_services_service_cfg
        | dict2items
        | rejectattr('key', 'equalto', 'targets')
        | list
        | items2dict
      }}
    docker_services_svc_target: >-
      {{
        (
          docker_services_service_cfg.targets[docker_services_service_target | default('swarm')]
          if docker_services_service_cfg.targets is defined
          else {}
        )
      }}
  tags: [remove, drift]

- name: Init | Normalize service config
  ansible.builtin.set_fact:
    docker_services_svc: >-
      {{
        docker_services_svc_base
        | combine(
            docker_services_svc_target,
            recursive=true,
            list_merge='append_rp'
          )
      }}
  tags: [remove, drift]

- name: Init | Preserve target command override
  when: docker_services_svc_target.command is defined
  ansible.builtin.set_fact:
    docker_services_svc: >-
      {{
        docker_services_svc
        | combine(
            {'command': docker_services_svc_target.command},
            recursive=true,
            list_merge='replace'
          )
      }}
  tags: [remove, drift]

- name: Init | Preserve target entrypoint override
  when: docker_services_svc_target.entrypoint is defined
  ansible.builtin.set_fact:
    docker_services_svc: >-
      {{
        docker_services_svc
        | combine(
            {'entrypoint': docker_services_svc_target.entrypoint},
            recursive=true,
            list_merge='replace'
          )
      }}
  tags: [remove, drift]

- name: Init | Preserve target healthcheck.test override
  when:
    - docker_services_svc_target.healthcheck is defined
    - docker_services_svc_target.healthcheck.test is defined
  ansible.builtin.set_fact:
    docker_services_svc: >-
      {{
        docker_services_svc
        | combine(
            {'healthcheck': {'test': docker_services_svc_target.healthcheck.test}},
            recursive=true,
            list_merge='replace'
          )
      }}
  tags: [remove, drift]

- name: Init | Validate normalized service config
  ansible.builtin.include_tasks: sub_tasks/init/validate.yml

- name: Init | Derive common service context
  ansible.builtin.set_fact:
    docker_services_service_name: >-
      {{ docker_services_svc.name | default(docker_services_role_prefix, true) | string | trim }}
    docker_services_stack_deploy_type: >-
      {{ docker_services_svc.deploy.type | default('swarm', true) | string | trim }}
    # NOTE: deploy.host is for prep host(s) only; can be string OR list OR group name
    docker_services_deploy_host: "{{ docker_services_svc.deploy.host | default(docker_services_primary_manager, true) }}"
  tags: [remove, drift]

- name: Init | Derive stack name
  ansible.builtin.set_fact:
    docker_services_stack_name: >-
      {{ docker_services_svc.stack | default(docker_services_service_name, true) | string | trim }}
  tags: [remove, drift]

- name: Init | Derive effective deploy host
  ansible.builtin.set_fact:
    docker_services_deploy_host_effective: >-
      {{
        docker_services_primary_manager
        if (docker_services_stack_deploy_type | string | trim) == 'swarm'
        else (docker_services_deploy_host | default(docker_services_primary_manager, true) | string | trim)
      }}
  tags: [remove, drift]

- name: Init | Derive effective stack key
  ansible.builtin.set_fact:
    docker_services_stack_name_effective: >-
      {{
        docker_services_stack_name
        if (docker_services_stack_deploy_type | string | trim) == 'swarm'
        else (docker_services_stack_name ~ '-' ~ docker_services_deploy_host_effective)
      }}
  tags: [remove, drift]

- name: Init | Derive effective filesystem hosts
  ansible.builtin.set_fact:
    docker_services_fs_hosts_effective: >-
      {{
        docker_services_deploy_host
        if (docker_services_deploy_host is sequence and docker_services_deploy_host is not string)
        else [ (docker_services_deploy_host | default(docker_services_primary_manager, true) | string | trim) ]
      }}

- name: Init | Expand filesystem hosts if a group name was provided
  when:
    - docker_services_fs_hosts_effective | length == 1
    - docker_services_fs_hosts_effective[0] in groups
  ansible.builtin.set_fact:
    docker_services_fs_hosts_effective: "{{ groups[docker_services_fs_hosts_effective[0]] | list }}"

- name: Init | De-dupe filesystem hosts
  ansible.builtin.set_fact:
    docker_services_fs_hosts_effective: "{{ docker_services_fs_hosts_effective | unique | list }}"

- name: Init | Assert container deploy has a single deploy.host
  when: (docker_services_stack_deploy_type | string | trim) != 'swarm'
  ansible.builtin.assert:
    that:
      - docker_services_deploy_host is string
      - (docker_services_deploy_host | string | trim | length) > 0
      - (docker_services_deploy_host | string | trim) not in groups
    fail_msg: >-
      Container deploys require deploy.host to be a single hostname (not a group or list).
      Got: {{ docker_services_deploy_host }}

- name: Init | Determine if this host should build/deploy compose artifacts
  ansible.builtin.set_fact:
    docker_services_is_deploy_host: "{{ inventory_hostname == docker_services_deploy_host_effective }}"
  tags: [remove]
