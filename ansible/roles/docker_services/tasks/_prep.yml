---

################################
# PREP (CLEANUP)
################################

- name: Prep - Cleanup | Derive cleanup flags
  ansible.builtin.set_fact:
    docker_services_cleanup_enable: "{{ (docker_services_svc.cleanup.enable | default(true)) | bool }}"
    docker_services_cleanup_force: "{{ (docker_services_svc.cleanup.force | default(false)) | bool }}"
  tags: [remove, recreate]

- name: Prep - Cleanup | Init cleaned-stacks tracker
  when: docker_services_is_deploy_host
  ansible.builtin.set_fact:
    docker_services_stacks_cleaned: "{{ docker_services_stacks_cleaned | default([]) }}"
  tags: [remove, recreate]

- name: Prep - Cleanup | Determine if stack cleanup should run
  when: docker_services_is_deploy_host
  ansible.builtin.set_fact:
    docker_services_do_stack_cleanup: >-
      {{
        docker_services_cleanup_enable
        and (
          docker_services_cleanup_force
          or (docker_services_stack_name_effective not in docker_services_stacks_cleaned)
        )
      }}
  tags: [remove, recreate]

- name: Prep - Cleanup | Remove existing stack
  when:
    - docker_services_is_deploy_host
    - docker_services_do_stack_cleanup | bool
  ansible.builtin.include_tasks:
    file: sub_tasks/prep/cleanup.yml
    apply:
      tags: [remove, recreate]
  tags: [remove, recreate]

- name: Prep - Cleanup | Mark stack as cleaned
  when:
    - docker_services_is_deploy_host
    - docker_services_do_stack_cleanup | bool
    - (docker_services_stack_name_effective not in docker_services_stacks_cleaned)
  ansible.builtin.set_fact:
    docker_services_stacks_cleaned: "{{ docker_services_stacks_cleaned + [docker_services_stack_name_effective] }}"
  tags: [remove, recreate]

################################
# PREP (INFISICAL)
################################

- name: Prep - Infisical | Include tasker
  ansible.builtin.include_tasks: sub_tasks/prep/infisical/tasker.yml
  tags: [deploy, update, recreate]

################################
# PREP (SWARM CONFIGS)
################################

- name: Prep - Swarm configs | Include tasker
  when:
    - inventory_hostname == docker_services_primary_manager
    - docker_services_svc.swarm_configs is defined
    - (docker_services_svc.swarm_configs | length) > 0
  ansible.builtin.include_tasks:
    file: sub_tasks/prep/swarm_configs/tasker.yml
    apply:
      tags: [deploy, update, recreate]
  vars:
    swarm_configs: "{{ docker_services_svc.swarm_configs }}"
    docker_services_deploy_host: "{{ docker_services_svc.swarm_config_host | default(docker_services_primary_manager, true) }}"
  tags: [deploy, update, recreate]

################################
# PREP (AUTHELIA)
################################

- name: Prep - Authelia | Include bootstrap tasks
  when:
    - inventory_hostname == docker_services_primary_manager
    - (docker_services_svc.name | default('') | string | trim) == "authelia"
  ansible.builtin.include_tasks:
    file: sub_tasks/prep/authelia/tasker.yml
    apply:
      tags: [deploy, bootstrap, recreate]
  run_once: true
  tags: [deploy, bootstrap, recreate]

################################
# PREP (POSTGRES)
################################

- name: Prep - Postgres | Create Postgres database
  when:
    - inventory_hostname == docker_services_primary_manager
    - docker_services_svc.postgres is defined
    - (docker_services_svc.postgres.enable | default(false)) | bool
  ansible.builtin.include_tasks:
    file: sub_tasks/prep/postgres.yml
    apply:
      tags: [deploy, update, recreate]
  tags: [deploy, update, recreate]

################################
# PREP (QBITTORRENT)
################################

- name: Prep - qBittorrent | Include bootstrap tasks
  when:
    - inventory_hostname == docker_services_primary_manager
    - (docker_services_svc.stack | default('') | string | trim) == "qbittorrent"
  ansible.builtin.include_tasks:
    file: sub_tasks/prep/qbittorrent.yml
    apply:
      tags: [deploy, update, recreate]
  tags: [deploy, update, recreate]

################################
# PREP (PATHS)
################################

- name: Prep - Paths | Create filesystem paths
  when:
    - inventory_hostname == docker_services_primary_manager
    - docker_services_svc.paths is defined
    - (docker_services_svc.paths | length > 0)
  ansible.builtin.include_tasks:
    file: sub_tasks/prep/paths.yml
    apply:
      tags: [deploy, update, recreate]
  vars:
    paths: "{{ docker_services_svc.paths }}"
    docker_services_deploy_host: "{{ _fs_target }}"
    default_owner: "{{ hostvars[_fs_target].docker_host_puid | default('1000') }}"
    default_group: "{{ hostvars[_fs_target].docker_host_pgid | default('1000') }}"
    default_mode: "0755"
  loop: "{{ docker_services_fs_hosts_effective }}"
  loop_control:
    loop_var: _fs_target
  tags: [deploy, update, recreate]

