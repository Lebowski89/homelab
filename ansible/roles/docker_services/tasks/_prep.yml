---

################################
# PREP (CLEANUP)
################################

- name: Prep - Cleanup | Derive cleanup flags
  ansible.builtin.set_fact:
    docker_services_cleanup_enable: "{{ (docker_services_svc.cleanup.enable | default(true)) | bool }}"
    docker_services_cleanup_force: "{{ (docker_services_svc.cleanup.force | default(false)) | bool }}"
  tags: [remove, recreate]

- name: Prep - Cleanup | Init cleaned-stacks tracker
  when: docker_services_is_deploy_host
  ansible.builtin.set_fact:
    docker_services_stacks_cleaned: "{{ docker_services_stacks_cleaned | default([]) }}"
  tags: [remove, recreate]

- name: Prep - Cleanup | Determine if stack cleanup should run
  when: docker_services_is_deploy_host
  ansible.builtin.set_fact:
    docker_services_do_stack_cleanup: >-
      {{
        docker_services_cleanup_enable
        and (
          docker_services_cleanup_force
          or (docker_services_stack_name_effective not in docker_services_stacks_cleaned)
        )
      }}
  tags: [remove, recreate]

- name: Prep - Cleanup | Remove existing stack
  when:
    - docker_services_is_deploy_host
    - docker_services_do_stack_cleanup | bool
  ansible.builtin.include_tasks:
    file: sub_tasks/prep/cleanup.yml
    apply:
      tags: [remove, recreate]
  tags: [remove, recreate]

- name: Prep - Cleanup | Mark stack as cleaned
  when:
    - docker_services_is_deploy_host
    - docker_services_do_stack_cleanup | bool
    - (docker_services_stack_name_effective not in docker_services_stacks_cleaned)
  ansible.builtin.set_fact:
    docker_services_stacks_cleaned: "{{ docker_services_stacks_cleaned + [docker_services_stack_name_effective] }}"
  tags: [remove, recreate]

################################
# PREP (INFISICAL)
################################

- name: Prep - Infisical | Include tasker
  ansible.builtin.include_tasks:
    file: sub_tasks/prep/infisical/tasker.yml
    apply:
      tags: [deploy, update, recreate, bootstrap]
  tags: [deploy, update, recreate, bootstrap]

################################
# PREP (SWARM CONFIGS)
################################

- name: Prep - Swarm configs | Include tasker
  when:
    - inventory_hostname == docker_services_primary_manager
    - docker_services_svc.swarm_configs is defined
    - (docker_services_svc.swarm_configs | length) > 0
  ansible.builtin.include_tasks:
    file: sub_tasks/prep/swarm_configs/tasker.yml
    apply:
      tags: [deploy, update, recreate]
  vars:
    swarm_configs: "{{ docker_services_svc.swarm_configs }}"
    docker_services_deploy_host: "{{ docker_services_svc.swarm_config_host | default(docker_services_primary_manager, true) }}"
  tags: [deploy, update, recreate]

################################
# PREP (AUTHELIA)
################################

- name: Prep - Authelia | Include bootstrap tasks
  when:
    - not ansible_check_mode
    - inventory_hostname == docker_services_primary_manager
    - (docker_services_svc.name | default('') | string | trim) == "authelia"
  ansible.builtin.include_tasks:
    file: sub_tasks/prep/authelia/tasker.yml
    apply:
      tags: [deploy, bootstrap, recreate]
  run_once: true
  tags: [deploy, bootstrap, recreate]

################################
# PREP (QBITTORRENT)
################################

- name: Prep - qBittorrent | Include bootstrap tasks
  when:
    - not ansible_check_mode
    - inventory_hostname == docker_services_primary_manager
    - (docker_services_role_prefix | default('') | string | trim) == "qbittorrent"
  ansible.builtin.include_tasks:
    file: sub_tasks/prep/qbittorrent.yml
    apply:
      tags: [deploy, update, recreate]
  tags: [deploy, update, recreate]

################################
# PREP (TRAEFIK ZONE LOOKUP)
################################

- name: Prep - Traefik zone | Resolve Docker compatibility input
  when:
    - inventory_hostname == docker_services_primary_manager
    - docker_services_svc.traefik.enable | default(false) | bool
  ansible.builtin.include_tasks:
    file: sub_tasks/prep/traefik_zone.yml
    apply:
      tags: [deploy, update, recreate, bootstrap]
  tags: [deploy, update, recreate, bootstrap]

################################
# PREP (RUNTIME-NEUTRAL SERVICE STATE)
################################

- name: Prep - Service common | Prepare files and Traefik integration
  when: inventory_hostname == docker_services_primary_manager
  no_log: true
  ansible.builtin.include_role:
    name: service_common
    apply:
      tags: [deploy, update, remove, recreate, bootstrap]
      no_log: true
      diff: false
  vars:
    service_common_name: "{{ docker_services_service_name }}"
    service_common_runtime: docker
    service_common_action: "{{ docker_services_common_action }}"
    service_common_service: "{{ docker_services_svc }}"
    service_common_target_hosts: "{{ docker_services_fs_hosts_effective }}"
    service_common_controller_host: "{{ docker_services_primary_manager }}"
    service_common_infisical_values: "{{ docker_services_infisical_values }}"
    service_common_host_defaults: "{{ docker_services_common_host_defaults }}"
    service_common_template_vars:
      qbittorrent_pass_pbkdf2: "{{ docker_services_qbittorrent_pass_pbkdf2 | default('') }}"
      qbittorrent_xs_pass_pbkdf2: "{{ docker_services_qbittorrent_xs_pass_pbkdf2 | default('') }}"
    service_common_traefik_base_zone: >-
      {{
        (docker_services_infisical_values | default({}))
        .get("cloudflare_zone", "")
        | default(
            hostvars[docker_services_primary_manager].cloudflare_zone
            | default(
                cloudflare_zone
                | default(docker_services_traefik_check_base_zone | default(""))
              ),
            true
          )
      }}
    service_common_traefik_dynamic_dir: >-
      {{ hostvars[docker_services_primary_manager].docker_host_appdata_root }}/traefik/dynamic
    service_common_traefik_owner: "1000"
    service_common_traefik_group: "1000"
  tags: [deploy, update, remove, recreate, bootstrap]

################################
# PREP (SWARM ENV TEMPLATES)
################################

- name: Prep - Swarm Env Templates | Render templates
  when:
    - inventory_hostname == docker_services_primary_manager
    - (docker_services_stack_deploy_type | string | trim) == "swarm"
    - docker_services_svc.swarm_env_templates is defined
    - (docker_services_svc.swarm_env_templates | length > 0)
  ansible.builtin.include_role:
    name: service_common
    tasks_from: templates
    apply:
      tags: [deploy, update, recreate, bootstrap]
  vars:
    service_common_name: "{{ docker_services_service_name }}"
    service_common_templates: "{{ docker_services_svc.swarm_env_templates }}"
    service_common_target_host: "{{ docker_services_primary_manager }}"
    service_common_host_defaults: "{{ docker_services_common_host_defaults }}"
    service_common_default_owner: >-
      {{ hostvars[docker_services_primary_manager].docker_host_puid | default('1000') }}
    service_common_default_group: >-
      {{ hostvars[docker_services_primary_manager].docker_host_pgid | default('1000') }}
    service_common_template_vars:
      qbittorrent_pass_pbkdf2: "{{ docker_services_qbittorrent_pass_pbkdf2 | default('') }}"
      qbittorrent_xs_pass_pbkdf2: "{{ docker_services_qbittorrent_xs_pass_pbkdf2 | default('') }}"
  tags: [deploy, update, recreate, bootstrap]

################################
# PREP (PLEX)
################################

- name: Prep - Plex | Include bootstrap tasks
  when:
    - not ansible_check_mode
    - inventory_hostname == docker_services_primary_manager
    - (docker_services_svc.name | default('') | string | trim) == "plex"
  ansible.builtin.include_tasks:
    file: sub_tasks/prep/plex/tasker.yml
    apply:
      tags: [deploy, bootstrap, recreate]
  run_once: true
  tags: [deploy, bootstrap, recreate]

################################
# PREP (BAZARR)
################################

- name: Prep - Bazarr | Include bootstrap tasks
  when:
    - not ansible_check_mode
    - inventory_hostname == docker_services_primary_manager
    - docker_services_svc.name  | default('') == "bazarr"
  ansible.builtin.include_tasks:
    file: sub_tasks/prep/bazarr.yml
    apply:
      tags: [deploy, update, recreate]
  run_once: true
  tags: [deploy, update, recreate]

################################
# PREP (NZBHYDRA2)
################################

- name: Prep - NZBHydra2 | Include bootstrap tasks
  when:
    - not ansible_check_mode
    - inventory_hostname == docker_services_primary_manager
    - docker_services_svc.name  | default('') == "nzbhydra2"
  ansible.builtin.include_tasks:
    file: sub_tasks/prep/nzbhydra2.yml
    apply:
      tags: [deploy, update, recreate]
  run_once: true
  tags: [deploy, update, recreate]

################################
# PREP (VAULTWARDEN)
################################

- name: Prep - Vaultwarden | Include bootstrap tasks
  when:
    - not ansible_check_mode
    - inventory_hostname == docker_services_primary_manager
    - docker_services_svc.name == "vaultwarden"
  ansible.builtin.include_tasks:
    file: sub_tasks/prep/vaultwarden.yml
    apply:
      tags: [deploy, update, recreate, bootstrap]
  run_once: true
  tags: [deploy, update, recreate, bootstrap]
