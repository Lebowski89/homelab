---

################################
# CLEAN UP
################################

- name: Stop Infisical quadlet services
  ansible.builtin.systemd_service:
    name: "{{ _infisical_unit }}"
    state: stopped
    enabled: false
  failed_when: false
  loop:
    - "{{ infisical_name }}.service"
    - "{{ infisical_postgres_name }}.service"
    - "{{ infisical_redis_name }}.service"
  loop_control:
    loop_var: _infisical_unit
  tags:
    - infisical_recreate
    - infisical_remove

- name: Remove Infisical quadlet files
  ansible.builtin.file:
    path: "/etc/containers/systemd/{{ _infisical_quadlet }}"
    state: absent
  loop:
    - "{{ infisical_name }}.container"
    - "{{ infisical_postgres_name }}.container"
    - "{{ infisical_redis_name }}.container"
    - "{{ infisical_network }}.network"
  loop_control:
    loop_var: _infisical_quadlet
  tags:
    - infisical_recreate
    - infisical_remove

- name: Reload systemd after quadlet removal
  ansible.builtin.systemd_service:
    daemon_reload: true
  tags:
    - infisical_remove

################################
# DIRECTORIES
################################

- name: Create Infisical quadlet directories
  ansible.builtin.file:
    path: "{{ _infisical_dir.path }}"
    state: directory
    owner: "{{ _infisical_dir.owner }}"
    group: "{{ _infisical_dir.group }}"
    mode: "{{ _infisical_dir.mode }}"
  loop:
    - path: "{{ infisical_path }}"
      owner: "{{ puid }}"
      group: "{{ pgid }}"
      mode: "0755"
    - path: "{{ infisical_postgres_path }}"
      owner: "999"
      group: "999"
      mode: "0700"
    - path: "{{ infisical_redis_path }}"
      owner: "999"
      group: "999"
      mode: "0755"
    - path: /etc/containers/systemd
      owner: root
      group: root
      mode: "0755"
  loop_control:
    loop_var: _infisical_dir
  tags:
    - infisical_bootstrap
    - infisical_deploy
    - infisical_recreate

################################
# CONFIG
################################

- name: Template Infisical Podman env file
  ansible.builtin.template:
    src: "{{ role_path }}/templates/infisical.env.j2"
    dest: "{{ infisical_path }}/.env"
    force: true
    owner: "{{ puid }}"
    group: "{{ pgid }}"
    mode: "0600"
  no_log: true
  tags:
    - infisical_bootstrap
    - infisical_deploy
    - infisical_recreate

################################
# DEPLOY
################################

- name: Template Infisical Podman quadlets
  ansible.builtin.template:
    src: "{{ role_path }}/templates/{{ _infisical_template.src }}"
    dest: "/etc/containers/systemd/{{ _infisical_template.dest }}"
    force: true
    owner: root
    group: root
    mode: "0644"
  loop:
    - src: "infisical.network.j2"
      dest: "{{ infisical_network }}.network"
    - src: "postgres.container.j2"
      dest: "{{ infisical_postgres_name }}.container"
    - src: "redis.container.j2"
      dest: "{{ infisical_redis_name }}.container"
    - src: "infisical.container.j2"
      dest: "{{ infisical_name }}.container"
  loop_control:
    loop_var: _infisical_template
  tags:
    - infisical_deploy
    - infisical_recreate

- name: Reload systemd for quadlet generator
  ansible.builtin.systemd_service:
    daemon_reload: true
  tags:
    - infisical_deploy
    - infisical_recreate

- name: Start Infisical quadlet services
  ansible.builtin.systemd_service:
    name: "{{ _infisical_service }}"
    state: started
    enabled: true
  loop:
    - "{{ infisical_postgres_name }}.service"
    - "{{ infisical_redis_name }}.service"
    - "{{ infisical_name }}.service"
  loop_control:
    loop_var: _infisical_service
  tags:
    - infisical_deploy
    - infisical_recreate