---

- name: Assert supported OS
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "Debian"
      - ansible_facts.distribution == "Ubuntu"
    fail_msg: "This role currently supports Ubuntu only."

- name: Ensure apt prerequisites are installed
  ansible.builtin.apt:
    name: "{{ docker_prereq_packages }}"
    state: present
    update_cache: true

- name: Ensure Docker keyring directory exists
  ansible.builtin.file:
    path: "{{ docker_keyring_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_repo_url }}/gpg"
    dest: "{{ docker_keyring_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: "{{ docker_repo_filename }}"
    types: [deb]
    uris: "{{ docker_repo_url }}"
    suites: "{{ ansible_facts.distribution_release }}"
    components: "{{ [docker_repo_channel] }}"
    architectures: "{{ docker_apt_arch.split(',') | map('trim') | list }}"
    signed_by: "{{ docker_keyring_file }}"
    mode: "0644"
    state: present
  register: docker_apt_repository

- name: Remove the previous Docker one-line repository entry
  ansible.builtin.lineinfile:
    path: "/etc/apt/sources.list.d/{{ docker_repo_filename }}.list"
    line: >-
      deb [arch={{ docker_apt_arch }} signed-by={{ docker_keyring_file }}]
      {{ docker_repo_url }}
      {{ ansible_facts.distribution_release }} {{ docker_repo_channel }}
    state: absent
  register: docker_apt_legacy_repository

- name: Refresh APT after Docker repository changes
  when: docker_apt_repository.changed or docker_apt_legacy_repository.changed
  ansible.builtin.apt:
    update_cache: true

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Ensure docker group exists
  when: docker_manage_user
  ansible.builtin.group:
    name: docker
    state: present

- name: Add user to docker group
  when:
    - docker_manage_user
    - docker_user | length > 0
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true
