---

- name: Docker | Validate platform and package conflicts
  ansible.builtin.import_tasks: sub_tasks/install/validate.yml

- name: Docker | Inspect the explicit SELinux transition before installation
  when: docker_selinux_enable
  ansible.builtin.import_tasks: sub_tasks/install/selinux_preflight.yml

- name: Docker | Prepare Rocky 10 bridge kernel support
  when:
    - ansible_facts.distribution == 'Rocky'
    - ansible_facts.distribution_major_version == '10'
  ansible.builtin.import_tasks: sub_tasks/install/rocky_kernel.yml

- name: Docker | Preview installation in check mode
  when: ansible_check_mode
  ansible.builtin.debug:
    msg:
      repository: "{{ docker_repo_url }}"
      suite_or_release: "{{ docker_repo_suite if ansible_facts.pkg_mgr == 'apt' else ansible_facts.distribution_major_version }}"
      prerequisites: "{{ docker_prereq_packages }}"
      packages: "{{ docker_packages }}"
      state: present
      user_group: "{{ docker_user if docker_manage_user else 'No user management requested' }}"
      service: Docker will be enabled and started; installation and service verification are deferred.
      note: Repository and package changes require a normal run; no cache, key or repository is changed in check mode.

- name: Docker | Install APT repository and packages
  when:
    - ansible_facts.pkg_mgr == 'apt'
    - not ansible_check_mode
  ansible.builtin.import_tasks: sub_tasks/install/apt.yml

- name: Docker | Install RPM repository and packages
  when:
    - ansible_facts.pkg_mgr in ['dnf', 'dnf5']
    - not ansible_check_mode
  ansible.builtin.import_tasks: sub_tasks/install/rpm.yml

- name: Docker | Apply the explicit SELinux configuration
  when:
    - docker_selinux_enable
    - not ansible_check_mode
  ansible.builtin.import_tasks: sub_tasks/install/selinux.yml

- name: Docker | Enable and start the daemon
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started

- name: Docker | Verify the requested SELinux capability
  when:
    - docker_selinux_enable
    - not ansible_check_mode
  block:
    - name: Docker SELinux | Verify the local daemon advertises SELinux privately
      ansible.builtin.uri:
        url: http://localhost/info
        unix_socket: /var/run/docker.sock
        use_proxy: false
      register: docker_selinux_verified
      failed_when: >-
        docker_selinux_verified.status | default(0) != 200 or
        'name=selinux' not in (docker_selinux_verified.json.SecurityOptions | default([]))
      no_log: true
      diff: false
  rescue:
    - name: Docker SELinux | Explain unverified daemon confinement
      ansible.builtin.fail:
        msg: >-
          Docker did not advertise SELinux after applying the requested configuration, or the local API was unavailable.
          Inspect docker.service and daemon configuration locally; runtime confinement has not been verified.

- name: Ensure docker group exists
  when:
    - docker_manage_user
    - not ansible_check_mode
  ansible.builtin.group:
    name: docker
    state: present

- name: Add user to docker group
  when:
    - docker_manage_user
    - not ansible_check_mode
    - docker_user | length > 0
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true
