---

- name: Assert supported OS
  ansible.builtin.assert:
    that:
      - ansible_facts.os_family == "Debian"
      - ansible_facts.distribution == "Ubuntu"
    fail_msg: "This role currently supports Ubuntu only."

- name: Ensure apt prerequisites are installed
  ansible.builtin.apt:
    name: "{{ docker_prereq_packages }}"
    state: present
    update_cache: true

- name: Ensure Docker keyring directory exists
  ansible.builtin.file:
    path: "{{ docker_keyring_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_repo_url }}/gpg"
    dest: "{{ docker_keyring_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: "{{ docker_repo_filename }}"
    types: [deb]
    uris: "{{ docker_repo_url }}"
    suites: "{{ ansible_facts.distribution_release }}"
    components: "{{ [docker_repo_channel] }}"
    architectures: "{{ docker_apt_arch.split(',') | map('trim') | list }}"
    signed_by: "{{ docker_keyring_file }}"
    mode: "0644"
    state: present
  register: docker_apt_repository

- name: Find legacy APT source files
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: "*.list"
    file_type: any
  register: docker_apt_legacy_sources

- name: Remove the previous Docker one-line repository entry
  ansible.builtin.lineinfile:
    path: "{{ docker_apt_legacy_source_file }}"
    regexp: >-
      ^\s*{{ docker_apt_legacy_source.split() | map('regex_escape') | join('\s+') }}\s*(?:#.*)?$
    state: absent
  vars:
    # apt_repository reused matching entries in any .list file and retained comments.
    docker_apt_legacy_source: >-
      deb [arch={{ docker_apt_arch }} signed-by={{ docker_keyring_file }}]
      {{ docker_repo_url }}
      {{ ansible_facts.distribution_release }} {{ docker_repo_channel }}
  loop: >-
    {{ ['/etc/apt/sources.list'] +
       (((docker_apt_legacy_sources.files | selectattr('isreg') | list) +
         (docker_apt_legacy_sources.files | selectattr('islnk') | list))
        | map(attribute='path') | list) }}
  loop_control:
    loop_var: docker_apt_legacy_source_file
  register: docker_apt_legacy_repository

- name: Refresh APT after Docker repository changes
  when: docker_apt_repository.changed or docker_apt_legacy_repository.changed
  ansible.builtin.apt:
    update_cache: true

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Ensure docker group exists
  when: docker_manage_user
  ansible.builtin.group:
    name: docker
    state: present

- name: Add user to docker group
  when:
    - docker_manage_user
    - docker_user | length > 0
  ansible.builtin.user:
    name: "{{ docker_user }}"
    groups: docker
    append: true
