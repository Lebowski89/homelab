---

- name: Ensure this host is part of the swarm inventory
  ansible.builtin.set_fact:
    docker_swarm_enabled: "{{ 'tags_swarm' in group_names }}"

- name: End swarm tasks for non-swarm hosts
  ansible.builtin.meta: end_host
  when: not docker_swarm_enabled | bool

- name: Assert primary swarm manager is defined
  ansible.builtin.assert:
    that:
      - docker_swarm_primary_manager is defined
      - docker_swarm_primary_manager in groups['tags_swarm_manager']
    fail_msg: "docker_swarm_primary_manager must be defined and be a member of tags_swarm_manager."

- name: Assert local_ip is defined for swarm node
  ansible.builtin.assert:
    that:
      - local_ip is defined
      - local_ip | length > 0
    fail_msg: "local_ip must be defined for each swarm node."

- name: Initialise swarm on primary manager
  community.docker.docker_swarm:
    state: present
    advertise_addr: "{{ local_ip }}"
  when: inventory_hostname == docker_swarm_primary_manager
  register: docker_swarm_init_result
  tags: docker_swarm_init

- name: Get worker join token from primary manager
  ansible.builtin.command:
    argv:
      - docker
      - swarm
      - join-token
      - -q
      - worker
  delegate_to: "{{ docker_swarm_primary_manager }}"
  run_once: true
  register: docker_swarm_worker_token_cmd
  changed_when: false
  tags: docker_swarm_join

- name: Get manager join token from primary manager
  ansible.builtin.command:
    argv:
      - docker
      - swarm
      - join-token
      - -q
      - manager
  delegate_to: "{{ docker_swarm_primary_manager }}"
  run_once: true
  register: docker_swarm_manager_token_cmd
  changed_when: false
  tags: docker_swarm_join

- name: Store join tokens on primary manager hostvars
  ansible.builtin.set_fact:
    docker_swarm_worker_join_token: "{{ docker_swarm_worker_token_cmd.stdout }}"
    docker_swarm_manager_join_token: "{{ docker_swarm_manager_token_cmd.stdout }}"
  delegate_to: "{{ docker_swarm_primary_manager }}"
  delegate_facts: true
  run_once: true
  tags: docker_swarm_join

- name: Join additional managers to swarm
  community.docker.docker_swarm:
    state: join
    advertise_addr: "{{ local_ip }}"
    remote_addrs:
      - "{{ hostvars[docker_swarm_primary_manager].local_ip }}:2377"
    join_token: "{{ hostvars[docker_swarm_primary_manager].docker_swarm_manager_join_token }}"
  when:
    - "'tags_swarm_manager' in group_names"
    - inventory_hostname != docker_swarm_primary_manager
  tags: docker_swarm_join

- name: Join workers to swarm
  community.docker.docker_swarm:
    state: join
    advertise_addr: "{{ local_ip }}"
    remote_addrs:
      - "{{ hostvars[docker_swarm_primary_manager].local_ip }}:2377"
    join_token: "{{ hostvars[docker_swarm_primary_manager].docker_swarm_worker_join_token }}"
  when: "'tags_swarm_worker' in group_names"
  tags: docker_swarm_join

- name: Conduct overlay network tasks
  delegate_to: "{{ docker_swarm_primary_manager }}"
  delegate_facts: true
  run_once: true
  tags: docker_swarm_network
  block:
    - name: Register overlay network
      community.docker.docker_network_info:
        name: "{{ docker_network }}"
      register: docker_network_result

    - name: Create overlay network
      when: not docker_network_result.exists
      community.docker.docker_network:
        name: "{{ docker_network }}"
        driver: "{{ docker_network_driver }}"
        attachable: true
        ipam_config:
          - subnet: "{{ docker_network_subnet }}"
  rescue:
    - name: Fail overlay network setup with context
      ansible.builtin.fail:
        msg: >-
          Docker Swarm overlay network setup failed for '{{ docker_network }}'
          on {{ docker_swarm_primary_manager }}. Fix the failed task above and rerun.

- name: Apply swarm node labels
  community.docker.docker_node:
    hostname: "{{ docker_swarm_hostname }}"
    labels: "{{ docker_swarm_node_labels }}"
    labels_state: merge
  delegate_to: "{{ docker_swarm_primary_manager }}"
  when:
    - "'tags_swarm' in group_names"
    - docker_swarm_node_labels is defined
    - docker_swarm_node_labels | length > 0
  tags: docker_swarm_labels
