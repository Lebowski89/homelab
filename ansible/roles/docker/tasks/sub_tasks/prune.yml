---

- name: Docker prune | Get root filesystem usage
  ansible.builtin.command: df --output=pcent /
  register: docker_prune_df_root
  changed_when: false

- name: Docker prune | Parse root filesystem usage percent
  ansible.builtin.set_fact:
    docker_prune_root_usage_percent: >-
      {{
        docker_prune_df_root.stdout_lines[-1]
        | regex_replace('[^0-9]', '')
        | int
      }}

- name: Docker prune | End play when usage is below threshold
  ansible.builtin.meta: end_play
  when:
    - docker_prune_root_usage_percent < (docker_prune_threshold_percent | int)

- name: Remove dangling Docker images
  ansible.builtin.command: docker image prune -f
  register: docker_image_prune_result
  changed_when: >-
    'Total reclaimed space:' in docker_image_prune_result.stdout
    and ('0B' not in docker_image_prune_result.stdout)
  tags: docker_prune_dangling

- name: Remove unused Docker images
  ansible.builtin.command: docker image prune -af
  register: docker_image_prune_all_result
  changed_when: >-
    'Total reclaimed space:' in docker_image_prune_all_result.stdout
    and ('0B' not in docker_image_prune_all_result.stdout)
  tags: docker_prune_unused

- name: Remove unused Docker volumes
  ansible.builtin.command: docker volume prune -f
  register: docker_volume_prune_result
  changed_when: >-
    'Total reclaimed space:' in docker_volume_prune_result.stdout
    and ('0B' not in docker_volume_prune_result.stdout)
  tags: docker_prune_volumes

