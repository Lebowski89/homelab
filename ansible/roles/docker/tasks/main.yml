---

- name: Install Docker
  when: "'tags_docker_install' in group_names"
  ansible.builtin.include_tasks:
    file: sub_tasks/install.yml
    apply:
      tags:
        - docker
        - docker_install
  tags:
    - docker
    - docker_install

- name: Configure Docker Swarm
  when: "'tags_swarm' in group_names"
  ansible.builtin.include_tasks:
    file: sub_tasks/swarm.yml
    apply:
      tags:
        - docker
        - docker_swarm
  tags:
    - docker
    - docker_swarm
    - docker_swarm_init
    - docker_swarm_join
    - docker_swarm_network
    - docker_swarm_labels

- name: Docker Prune
  ansible.builtin.include_tasks:
    file: sub_tasks/prune.yml
    apply:
      tags:
        - docker_prune
  tags:
    - docker_prune
    - docker_prune_dangling
    - docker_prune_unused
    - docker_prune_volumes
