---

- name: Docker | Detect externally managed Unraid installation
  when: "'tags_docker_install' in group_names"
  ansible.builtin.stat:
    path: /etc/unraid-version
  register: docker_unraid_installation
  tags: [docker, docker_install]

- name: Docker | Retain Unraid managed installation
  when:
    - "'tags_docker_install' in group_names"
    - docker_unraid_installation.stat.exists
  ansible.builtin.debug:
    msg: Unraid owns Docker installation; package and daemon installation tasks are skipped.
  tags: [docker, docker_install]

- name: Install Docker
  when:
    - "'tags_docker_install' in group_names"
    - not docker_unraid_installation.stat.exists
  ansible.builtin.include_tasks:
    file: sub_tasks/install.yml
    apply:
      tags:
        - docker
        - docker_install
  tags:
    - docker
    - docker_install

- name: Configure Docker Swarm
  when: "'tags_swarm' in group_names"
  ansible.builtin.include_tasks:
    file: sub_tasks/swarm.yml
    apply:
      tags:
        - docker
        - docker_swarm
  tags:
    - docker
    - docker_swarm
    - docker_swarm_init
    - docker_swarm_join
    - docker_swarm_network
    - docker_swarm_labels

- name: Docker Prune Cleanup
  ansible.builtin.include_tasks:
    file: sub_tasks/prune/cleanup.yml
    apply:
      tags:
        - docker_prune
  tags:
    - docker_prune
    - docker_prune_dangling
    - docker_prune_unused
    - docker_prune_volumes

- name: Docker Prune Timer
  ansible.builtin.include_tasks:
    file: sub_tasks/prune/timer.yml
    apply:
      tags:
        - docker_prune_timer
  tags:
    - docker_prune_timer

- name: Docker Prune Unraid User Script
  ansible.builtin.include_tasks:
    file: sub_tasks/prune/unraid_user_script.yml
    apply:
      tags:
        - docker_prune_unraid_user_script
  tags:
    - docker_prune_unraid_user_script
