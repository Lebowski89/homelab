---

infisical_name: infisical
infisical_image: docker.io/infisical/infisical:v0.159.25
infisical_port: 8066
infisical_path: "/opt/{{ infisical_name }}"
infisical_enc_key: ""
infisical_jwt_key: ""

infisical_postgres_name: infisical-postgres
infisical_postgres_image: docker.io/library/postgres:18.3
infisical_postgres_path: "{{ infisical_path }}/postgres"
infisical_postgres_user: ""
infisical_postgres_pass: ""

infisical_redis_name: infisical-redis
infisical_redis_image: docker.io/library/redis:8.6-alpine
infisical_redis_path: "{{ infisical_path }}/redis"
infisical_redis_key: ""

infisical_smtp_email: ""
infisical_smtp_host: ""
infisical_smtp_port: ""
infisical_smtp_user: ""
infisical_smtp_pass: ""
infisical_smtp_sender: ""

infisical_secret_files:
  postgres_user.txt: "{{ infisical_postgres_user }}"
  postgres_pass.txt: "{{ infisical_postgres_pass }}"
  redis_key.txt: "{{ infisical_redis_key }}"

infisical_domain: ""
infisical_backend_host: "{{ hostvars[docker_services_primary_manager].local_ip }}"
