---
- name: Infisical | Validate bootstrap inputs
  ansible.builtin.assert:
    that:
      - local_ip is defined
      - services_internal_zone is string
  tags:
    - infisical_bootstrap
    - infisical_deploy
    - infisical_recreate
    - infisical_remove
- name: Infisical | Select explicit bootstrap operation
  ansible.builtin.set_fact:
    infisical_podman_action: >-
      {{ 'remove' if 'infisical_remove' in ansible_run_tags else ('recreate' if 'infisical_recreate' in ansible_run_tags
      else 'deploy') }}
  tags:
    - infisical_bootstrap
    - infisical_deploy
    - infisical_recreate
    - infisical_remove
- name: Infisical | Validate required Vault inputs before mutation
  when:
    - not ansible_check_mode
    - infisical_podman_action != "remove"
  no_log: true
  diff: false
  ansible.builtin.assert:
    that:
      - infisical_enc_key is string and infisical_enc_key | length > 0
      - infisical_jwt_key is string and infisical_jwt_key | length > 0
      - infisical_postgres_user is string and infisical_postgres_user | length > 0
      - infisical_postgres_pass is string and infisical_postgres_pass | length > 0
      - infisical_redis_password is string and infisical_redis_password | length > 0
    fail_msg: Required bootstrap Vault inputs must be nonempty.
  tags:
    - infisical_bootstrap
    - infisical_deploy
    - infisical_recreate
    - infisical_remove
- name: Infisical | Validate all Quadlet definitions before mutation
  ansible.builtin.include_role:
    name: podman_services
    tasks_from: validate_definitions
    apply:
      tags:
        - infisical_bootstrap
        - infisical_deploy
        - infisical_recreate
        - infisical_remove
      no_log: true
      diff: false
  vars:
    podman_services_bootstrap_definitions: '{{ infisical_podman_services }}'
  no_log: true
  tags:
    - infisical_bootstrap
    - infisical_deploy
    - infisical_recreate
    - infisical_remove
- name: Infisical | Reset this operation's bootstrap prerequisite proofs
  ansible.builtin.set_fact:
    infisical_podman_prerequisite_proofs: {}
  tags: [infisical_bootstrap, infisical_deploy, infisical_recreate, infisical_remove]

- name: Infisical | Enforce every bootstrap requirement before stopping or preparing services
  ansible.builtin.include_tasks:
    file: requirements.yml
    apply:
      tags: [infisical_bootstrap, infisical_deploy, infisical_recreate, infisical_remove]
  loop: "{{ infisical_podman_services }}"
  loop_control:
    loop_var: infisical_podman_requirement
    label: "{{ infisical_podman_requirement.name }}"
  tags: [infisical_bootstrap, infisical_deploy, infisical_recreate, infisical_remove]

- name: Infisical | Stop consumers before providers in their persisted managers
  when:
    - not ansible_check_mode
    - infisical_podman_action == "recreate"
  ansible.builtin.include_role:
    name: podman_services
    tasks_from: stop_bootstrap
    apply:
      tags: &id001
        - infisical_recreate
      no_log: true
      diff: false
  vars:
    podman_services_service_cfg: '{{ infisical_podman_definition }}'
    podman_services_role_prefix: '{{ infisical_podman_definition.name }}'
    podman_services_action_remove: true
    podman_services_common_context:
      requirements_proof: "{{ infisical_podman_prerequisite_proofs[infisical_podman_definition.name] }}"
      runtime: podman
      dispatch_host: '{{ inventory_hostname }}'
      controller_host: '{{ inventory_hostname }}'
      lookup_values: {}
      resolved_environment: {}
      secret_declarations: []
  loop: '{{ infisical_podman_services | reverse | list }}'
  loop_control:
    loop_var: infisical_podman_definition
  no_log: true
  tags: *id001
- name: Infisical | Process bootstrap providers and consumers
  ansible.builtin.include_tasks:
    file: service.yml
    apply:
      tags:
        - infisical_bootstrap
        - infisical_deploy
        - infisical_recreate
        - infisical_remove
      no_log: true
      diff: false
  no_log: true
  loop: >-
    {{ infisical_podman_services | reverse | list if infisical_podman_action == 'remove' else infisical_podman_services
    }}
  loop_control:
    loop_var: infisical_podman_definition
  tags:
    - infisical_bootstrap
    - infisical_deploy
    - infisical_recreate
    - infisical_remove
- name: Infisical | Render Traefik dynamic file
  when:
    - infisical_traefik_enable | bool
    - infisical_podman_action != "remove"
    - not (podman_services_prepare_execution_only | default(false))
  ansible.builtin.template:
    src: traefik_dynamic_file.j2
    dest: '{{ infisical_traefik_dynamic_dir }}/{{ infisical_name }}-dynamic.yml'
    owner: '{{ infisical_traefik_dynamic_owner }}'
    group: '{{ infisical_traefik_dynamic_group }}'
    mode: '0644'
    force: true
  tags:
    - infisical_bootstrap
    - infisical_deploy
    - infisical_recreate
- name: Infisical | Retire Traefik route
  when: infisical_podman_action == "remove"
  ansible.builtin.file:
    path: '{{ infisical_traefik_dynamic_dir }}/{{ infisical_name }}-dynamic.yml'
    state: absent
  tags:
    - infisical_remove
