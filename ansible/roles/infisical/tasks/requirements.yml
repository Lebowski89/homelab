---

- name: Infisical | Check the selected bootstrap runtime and protection before stops
  ansible.builtin.include_role:
    name: service_common
    tasks_from: operational_requirements
    apply:
      tags: [infisical_bootstrap, infisical_deploy, infisical_recreate, infisical_remove]
  vars:
    service_common_service: "{{ infisical_podman_requirement | combine({'runtime': 'podman'}) | service_common_requirements_metadata(infisical_podman_requirement.name) }}"
    service_common_name: "{{ infisical_podman_requirement.name }}"
    service_common_action: "{{ infisical_podman_action }}"
    service_common_execution_only: "{{ podman_services_prepare_execution_only | default(false) }}"
    service_common_preflight_proof: {}

- name: Infisical | Bind the pre-stop proof to its bootstrap service
  ansible.builtin.set_fact:
    infisical_podman_prerequisite_proofs: >-
      {{ infisical_podman_prerequisite_proofs | combine({infisical_podman_requirement.name: service_common_prerequisite_proof}) }}
