---

- name: Podman | Validate platform and package choices
  ansible.builtin.import_tasks: validate.yml
  tags: [podman, podman_install]

- name: Podman | Preview package installation in check mode
  when:
    - ansible_check_mode
    - podman_install_enable
  ansible.builtin.debug:
    msg:
      packages: "{{ podman_packages + podman_install_extra_packages }}"
      state: "{{ podman_state }}"
      note: >-
        Package installation is deferred. Existing runtime capabilities are checked when Podman is present;
        missing-runtime verification is deferred until installation. No repository or cache is changed.
  tags: [podman, podman_install]

- name: Podman | Install distribution packages
  when:
    - podman_install_enable
    - not ansible_check_mode
  ansible.builtin.include_tasks:
    file: "{{ 'apt' if ansible_facts.pkg_mgr == 'apt' else 'rpm' }}.yml"
    apply:
      tags: [podman, podman_install]
  tags: [podman, podman_install]

- name: Podman | Validate installed runtime capabilities
  ansible.builtin.import_tasks: validate_runtime.yml
  tags: [podman, podman_install]
