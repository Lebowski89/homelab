---

- name: Podman temporary preparation | Remove container
  when: not ansible_check_mode
  containers.podman.podman_container:
    name: "{{ service_prepare_temporary_container.name }}"
    state: absent
    delete_time: "10"
  register: service_prepare_temporary_remove
  retries: 5
  delay: 5
  until: service_prepare_temporary_remove is succeeded
  become: true
  become_user: "{{ (service_prepare_context.execution | default({})).host_user | default('root') }}"
  environment: "{{ service_prepare_context.runtime_environment | default({}) }}"
  delegate_to: "{{ service_prepare_temporary_container.host }}"

- name: Podman temporary preparation | Verify container is absent
  when: not ansible_check_mode
  containers.podman.podman_container_info:
    name:
      - "{{ service_prepare_temporary_container.name }}"
  register: service_prepare_temporary_absence
  retries: 5
  delay: 5
  until:
    - service_prepare_temporary_absence is succeeded
    - service_prepare_temporary_absence.containers | default([{}]) | length == 0
  failed_when: >-
    service_prepare_temporary_absence is failed
    or service_prepare_temporary_absence.containers | default([{}]) | length > 0
  changed_when: false
  become: true
  become_user: "{{ (service_prepare_context.execution | default({})).host_user | default('root') }}"
  environment: "{{ service_prepare_context.runtime_environment | default({}) }}"
  delegate_to: "{{ service_prepare_temporary_container.host }}"
