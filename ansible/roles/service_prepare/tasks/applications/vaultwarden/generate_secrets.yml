---

- name: Vaultwarden prepare | Resolve persistent token paths
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    service_prepare_vaultwarden_fs_host: "{{ service_prepare_context.filesystem_hosts | first }}"
    service_prepare_vaultwarden_dir: "{{ service_prepare_context.service.paths_vault.vault_dir }}"
    service_prepare_vaultwarden_token_file: "{{ service_prepare_context.service.paths_vault.vault_token_file }}"
    service_prepare_vaultwarden_pass_file: "{{ service_prepare_context.service.paths_vault.vault_pass_file }}"
    service_prepare_vaultwarden_secret_name: "{{ service_prepare_context.service.paths_vault.vault_secret_name }}"

- name: Vaultwarden prepare | Ensure persistent token directory exists
  become: true
  no_log: true
  diff: false
  ansible.builtin.file:
    path: "{{ service_prepare_vaultwarden_dir }}"
    state: directory
    mode: "0700"
  delegate_to: "{{ service_prepare_vaultwarden_fs_host }}"

- name: Vaultwarden prepare | Check for persistent admin token
  become: true
  no_log: true
  diff: false
  ansible.builtin.stat:
    path: "{{ service_prepare_vaultwarden_token_file }}"
  register: service_prepare_vaultwarden_token_stat
  delegate_to: "{{ service_prepare_vaultwarden_fs_host }}"

- name: Vaultwarden prepare | Read persistent admin token
  when: service_prepare_vaultwarden_token_stat.stat.exists
  become: true
  no_log: true
  diff: false
  ansible.builtin.slurp:
    src: "{{ service_prepare_vaultwarden_token_file }}"
  register: service_prepare_vaultwarden_token_raw
  delegate_to: "{{ service_prepare_vaultwarden_fs_host }}"

- name: Vaultwarden prepare | Generate and persist initial admin token
  when: not service_prepare_vaultwarden_token_stat.stat.exists
  become: true
  no_log: true
  diff: false
  delegate_to: "{{ service_prepare_vaultwarden_fs_host }}"
  block:
    - name: Vaultwarden prepare | Generate random password
      ansible.builtin.command:
        argv: [openssl, rand, -base64, "32"]
      register: service_prepare_vaultwarden_password
      changed_when: false

    - name: Vaultwarden prepare | Persist generated password
      ansible.builtin.copy:
        dest: "{{ service_prepare_vaultwarden_pass_file }}"
        content: "{{ service_prepare_vaultwarden_password.stdout | trim }}\n"
        mode: "0600"

    - name: Vaultwarden prepare | Generate random salt
      ansible.builtin.command:
        argv: [openssl, rand, -base64, "32"]
      register: service_prepare_vaultwarden_salt
      changed_when: false

    - name: Vaultwarden prepare | Generate Argon2 PHC token
      ansible.builtin.command:
        argv:
          - argon2
          - "{{ service_prepare_vaultwarden_salt.stdout | trim }}"
          - -e
          - -id
          - -k
          - "65540"
          - -t
          - "3"
          - -p
          - "4"
        stdin: "{{ service_prepare_vaultwarden_password.stdout | trim }}"
      register: service_prepare_vaultwarden_token_new
      changed_when: false

    - name: Vaultwarden prepare | Persist Argon2 admin token
      ansible.builtin.copy:
        dest: "{{ service_prepare_vaultwarden_token_file }}"
        content: "{{ service_prepare_vaultwarden_token_new.stdout | trim }}\n"
        mode: "0600"

  rescue:
    - name: Vaultwarden prepare | Remove partial generated token files
      ansible.builtin.file:
        path: "{{ service_prepare_vaultwarden_partial_file }}"
        state: absent
      loop:
        - "{{ service_prepare_vaultwarden_pass_file }}"
        - "{{ service_prepare_vaultwarden_token_file }}"
      loop_control:
        loop_var: service_prepare_vaultwarden_partial_file
        label: "{{ service_prepare_vaultwarden_partial_file }}"

    - name: Vaultwarden prepare | Fail token generation safely
      ansible.builtin.fail:
        msg: >-
          Vaultwarden admin token generation failed. Partial generated token files
          were removed; no runtime-native secret was materialized.

- name: Vaultwarden prepare | Resolve persistent admin token value
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    service_prepare_vaultwarden_token: >-
      {{
        (service_prepare_vaultwarden_token_raw.content | b64decode | trim)
        if service_prepare_vaultwarden_token_stat.stat.exists
        else (service_prepare_vaultwarden_token_new.stdout | trim)
      }}

- name: Vaultwarden prepare | Validate persistent admin token format
  no_log: true
  diff: false
  ansible.builtin.assert:
    that:
      - service_prepare_vaultwarden_token is match('^\\$argon2(id|i|d)\\$.*')
    fail_msg: "Vaultwarden persistent admin token is not a valid Argon2 PHC value."

- name: Vaultwarden prepare | Publish generated value and value-free declaration
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    service_prepare_generated_secret_values: >-
      {{
        service_prepare_generated_secret_values
        | combine({'vaultwarden_admin_token': service_prepare_vaultwarden_token})
      }}
    service_prepare_generated_secret_declarations: >-
      {{
        service_prepare_generated_secret_declarations
        + [{
          'var': 'vaultwarden_admin_token',
          'name': service_prepare_vaultwarden_secret_name,
          'target': '/run/secrets/' ~ service_prepare_vaultwarden_secret_name,
          'origins': ['canonical'],
          'update_policy': 'preserve'
        }]
      }}
