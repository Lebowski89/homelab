---

- name: Authelia prepare | Build selected-runtime secret generation request
  when: not ansible_check_mode
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    service_prepare_temporary_container:
      name: >-
        {{
          service_prepare_context.service_name
          | service_prepare_temporary_name(
              service_prepare_context.target | default(''),
              service_prepare_authelia_secret_job.purpose
            )
        }}
      image: "{{ service_prepare_context.service.image }}"
      command: "{{ service_prepare_authelia_secret_job.command }}"
      host: "{{ service_prepare_context.filesystem_hosts | first }}"
      environment: {}
      mounts: []
      detach: false
      capture_output: true

- name: Authelia prepare | Run selected-runtime secret generator
  when: not ansible_check_mode
  no_log: true
  ansible.builtin.include_tasks:
    file: ../../runtimes/temporary_container.yml
    apply:
      tags: [deploy, update, recreate, bootstrap]
      no_log: true
      diff: false
  tags: [deploy, update, recreate, bootstrap]

- name: Authelia prepare | Extract generated secret value
  when: not ansible_check_mode
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    service_prepare_authelia_generated_value: >-
      {{
        service_prepare_temporary_container_output
        | service_prepare_extract_output(service_prepare_authelia_secret_job.output_prefix)
      }}

- name: Authelia prepare | Validate generated secret value
  when: not ansible_check_mode
  no_log: true
  diff: false
  ansible.builtin.assert:
    that:
      - service_prepare_authelia_generated_value | length > 0
    fail_msg: >-
      Authelia temporary generation returned no usable output for the requested value.

- name: Authelia prepare | Publish generated secret value
  when: not ansible_check_mode
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    service_prepare_generated_secret_values: >-
      {{
        service_prepare_generated_secret_values
        | combine({service_prepare_authelia_secret_job.var: service_prepare_authelia_generated_value})
      }}

- name: Authelia prepare | Publish value-free declaration
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    service_prepare_generated_secret_declarations: >-
      {{
        service_prepare_generated_secret_declarations
        + [
          service_prepare_authelia_secret_job.var
          | service_prepare_secret_declaration(service_prepare_authelia_secret_job.name)
        ]
      }}
