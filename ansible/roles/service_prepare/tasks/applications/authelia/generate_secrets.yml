---

- name: Authelia prepare | Generate runtime secret values
  no_log: true
  ansible.builtin.include_tasks:
    file: generate_secret.yml
    apply:
      tags: [deploy, update, recreate, bootstrap]
      no_log: true
      diff: false
  vars:
    service_prepare_authelia_secret_job: "{{ service_prepare_authelia_secret_item }}"
  loop:
    - label: Session key
      purpose: session-key
      var: authelia_session_key
      name: authelia_session_key_secret
      command: authelia crypto rand --length 64 --charset alphanumeric
      output_prefix: "Random Value: "
    - label: JWT reset key
      purpose: jwt-reset-key
      var: authelia_jwt_reset_key
      name: authelia_jwt_key_secret
      command: authelia crypto rand --length 64 --charset alphanumeric
      output_prefix: "Random Value: "
  loop_control:
    loop_var: service_prepare_authelia_secret_item
    label: "{{ service_prepare_authelia_secret_item.label }}"
  tags: [deploy, update, recreate, bootstrap]
