---

- name: Prep - Plex Preferences | Conduct preferences.xml tasks
  delegate_to: "{{ service_prepare_plex_fs_host }}"
  run_once: true
  block:
    - name: Prep - Plex Preferences | Set derived vars
      ansible.builtin.set_fact:
        service_prepare_transcoder_path_fix: false
        service_prepare_plex_server_claimed: false

    - name: Prep - Plex Preferences | Check if Preferences.xml exists
      ansible.builtin.stat:
        path: "{{ service_prepare_plex_preferences_file }}"
      register: service_prepare_preferences_xml

    - name: Prep - Plex Preferences | Read Preferences.xml attributes
      when: service_prepare_preferences_xml.stat.exists
      community.general.xml:
        path: "{{ service_prepare_plex_preferences_file }}"
        xpath: /Preferences
        content: attribute
      register: service_prepare_preferences_xml_resp
      failed_when: false

    - name: Prep - Plex Preferences | Remove Preferences.xml if malformed
      when:
        - service_prepare_preferences_xml.stat.exists
        - service_prepare_preferences_xml_resp is failed
      ansible.builtin.file:
        path: "{{ service_prepare_plex_preferences_file }}"
        state: absent

    - name: Prep - Plex Preferences | Derive flags from Preferences.xml
      when:
        - service_prepare_preferences_xml.stat.exists
        - service_prepare_preferences_xml_resp is succeeded
        - (service_prepare_preferences_xml_resp.matches | default([]) | length) > 0
      ansible.builtin.set_fact:
        service_prepare_transcoder_path_fix: >-
          {{
            (service_prepare_preferences_xml_resp.matches[0].Preferences.TranscoderTempDirectory is defined)
            and (service_prepare_preferences_xml_resp.matches[0].Preferences.TranscoderTempDirectory | trim == "/transcodes")
          }}
        service_prepare_plex_server_claimed: >-
          {{
            (service_prepare_preferences_xml_resp.matches[0].Preferences.PlexOnlineToken is defined)
            and (service_prepare_preferences_xml_resp.matches[0].Preferences.PlexOnlineToken | trim | length > 0)
          }}

    - name: Prep - Plex Preferences | Fix TranscoderTempDirectory
      when:
        - service_prepare_preferences_xml.stat.exists
        - service_prepare_transcoder_path_fix | default(false) | bool
      community.general.xml:
        path: "{{ service_prepare_plex_preferences_file }}"
        xpath: /Preferences
        attribute: TranscoderTempDirectory
        value: "/transcode"
        state: present
  rescue:
    - name: Prep - Plex Preferences | Fail preferences handling with context
      ansible.builtin.fail:
        msg: >-
          Failed while managing Plex Preferences.xml on {{ service_prepare_plex_fs_host }}.
          Review the failed task above before rerunning.
