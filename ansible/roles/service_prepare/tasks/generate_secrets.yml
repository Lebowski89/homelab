---

- name: Application secret generation | Validate retained current-service outputs
  no_log: true
  diff: false
  ansible.builtin.assert:
    that:
      - service_prepare_template_vars is mapping
      - service_prepare_generated_secret_values is mapping
      - service_prepare_generated_secret_declarations is sequence
      - service_prepare_bootstrap_requests is mapping
    fail_msg: "Application preparation outputs were not reset and validated for the current service."
  tags: [deploy, update, recreate, bootstrap]

- name: Application secret generation | Include Authelia generation
  when:
    - service_prepare_handler == 'authelia'
  no_log: true
  ansible.builtin.include_tasks:
    file: applications/authelia/generate_secrets.yml
    apply:
      tags: [deploy, update, recreate, bootstrap]
      no_log: true
      diff: false
  tags: [deploy, update, recreate, bootstrap]

- name: Application secret generation | Include Vaultwarden generation
  when:
    - not ansible_check_mode
    - service_prepare_handler == 'vaultwarden'
  no_log: true
  ansible.builtin.include_tasks:
    file: applications/vaultwarden/generate_secrets.yml
    apply:
      tags: [deploy, update, recreate, bootstrap]
      no_log: true
      diff: false
  tags: [deploy, update, recreate, bootstrap]
