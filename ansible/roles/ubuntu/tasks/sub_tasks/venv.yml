---

- name: Ensure Ansible opt path exists
  ansible.builtin.file:
    path: "{{ ubuntu_ansible_opt_path }}"
    state: directory
    owner: "{{ ubuntu_ansible_owner | default(ansible_user) }}"
    group: "{{ ubuntu_ansible_group | default(ansible_user) }}"
    mode: "0755"

- name: Determine controller Python ABI directory
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - >-
        import sys; print(f"python{sys.version_info.major}.{sys.version_info.minor}")
  register: ubuntu_controller_python_abi
  changed_when: false
  check_mode: false

- name: Check existing Ansible virtualenv interpreter
  ansible.builtin.stat:
    path: "{{ ubuntu_ansible_venv_path }}/bin/python"
  register: ubuntu_ansible_venv_python

- name: Check matching Ansible virtualenv site-packages
  ansible.builtin.stat:
    path: >-
      {{ ubuntu_ansible_venv_path }}/lib/{{ ubuntu_controller_python_abi.stdout | trim }}/site-packages
  register: ubuntu_ansible_venv_site_packages

- name: Probe existing Ansible virtualenv interpreter
  when: ubuntu_ansible_venv_python.stat.exists
  ansible.builtin.command:
    argv:
      - "{{ ubuntu_ansible_venv_path }}/bin/python"
      - -c
      - >-
        import sys; print(f"python{sys.version_info.major}.{sys.version_info.minor}")
  register: ubuntu_ansible_venv_python_probe
  changed_when: false
  failed_when: false
  check_mode: false

- name: Recreate Ansible virtualenv after Python ABI drift
  when:
    - not ansible_check_mode
    - >-
      ({
        'python_exists': ubuntu_ansible_venv_python.stat.exists,
        'site_packages_exists': ubuntu_ansible_venv_site_packages.stat.exists,
        'probe_rc': ubuntu_ansible_venv_python_probe.rc | default(1),
        'probe_abi': ubuntu_ansible_venv_python_probe.stdout | default(''),
        'controller_abi': ubuntu_controller_python_abi.stdout
      } | ubuntu_venv_recovery_action) == 'recreate'
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - --clear
      - "{{ ubuntu_ansible_venv_path }}"
  changed_when: true

- name: Create missing Ansible virtualenv
  when:
    - not ansible_check_mode
    - >-
      ({
        'python_exists': ubuntu_ansible_venv_python.stat.exists,
        'site_packages_exists': ubuntu_ansible_venv_site_packages.stat.exists,
        'probe_rc': ubuntu_ansible_venv_python_probe.rc | default(1),
        'probe_abi': ubuntu_ansible_venv_python_probe.stdout | default(''),
        'controller_abi': ubuntu_controller_python_abi.stdout
      } | ubuntu_venv_recovery_action) == 'create'
  ansible.builtin.command:
    argv:
      - python3
      - -m
      - venv
      - "{{ ubuntu_ansible_venv_path }}"
  changed_when: true

- name: Upgrade pip tooling in virtualenv
  ansible.builtin.pip:
    name:
      - pip==26.2.1
      - setuptools==83.0.0
      - wheel==0.47.0
    state: present
    virtualenv: "{{ ubuntu_ansible_venv_path }}"
