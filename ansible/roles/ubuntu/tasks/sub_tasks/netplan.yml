---

- name: Normalize Netplan address and interface inputs
  ansible.builtin.set_fact:
    ubuntu_netplan_ipv4_address: "{{ local_ip | default('') | string | trim }}"
    ubuntu_netplan_ipv4_gateway: "{{ ubuntu_defaults_netplan_gateway | default('') | string | trim }}"
    ubuntu_netplan_ipv4_pattern: '^(?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(?:[.](?:25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])){3}\Z'
    ubuntu_netplan_requested_interface: "{{ ubuntu_netplan_interface | default('') | string | trim }}"
    ubuntu_netplan_discovered_interface: >-
      {{ ansible_facts.get('default_ipv4', {}).get('interface', '') | string | trim }}

- name: Resolve effective Netplan interface
  ansible.builtin.set_fact:
    ubuntu_netplan_effective_interface: >-
      {{
        ubuntu_netplan_requested_interface
        if ubuntu_netplan_requested_interface | length > 0
        else ubuntu_netplan_discovered_interface
      }}

- name: Assert Netplan inputs are valid
  ansible.builtin.assert:
    that:
      - local_ip is defined
      - ubuntu_netplan_ipv4_address is match(ubuntu_netplan_ipv4_pattern)
      - ubuntu_netplan_ipv4_gateway is match(ubuntu_netplan_ipv4_pattern)
      - ubuntu_netplan_prefix | int >= 1
      - ubuntu_netplan_prefix | int <= 32
      - ubuntu_netplan_effective_interface | length > 0
    fail_msg: >-
      Netplan requires a plain static IPv4 address without CIDR syntax, an IPv4
      gateway, a prefix between 1 and 32, and either ubuntu_netplan_interface
      or a discovered default IPv4 interface.

- name: Disable cloud-init network configuration
  when: ubuntu_netplan_disable_cloud_init_networking | bool
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    owner: root
    group: root
    mode: "0644"
    content: |
      network:
        config: disabled

- name: Remove cloud-init network configuration disablement
  when: not (ubuntu_netplan_disable_cloud_init_networking | bool)
  ansible.builtin.file:
    path: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    state: absent

- name: Find existing Netplan configs
  ansible.builtin.find:
    paths: /etc/netplan
    patterns:
      - "*.yml"
      - "*.yaml"
    file_type: file
  register: ubuntu_netplan_configs

- name: Remove unmanaged Netplan configs
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ ubuntu_netplan_configs.files }}"
  when: item.path != ubuntu_netplan_config_path
  notify:
    - Generate netplan
    - Apply netplan

- name: Render Netplan config
  ansible.builtin.template:
    src: netplan-config.yaml.j2
    dest: "{{ ubuntu_netplan_config_path }}"
    owner: root
    group: root
    mode: "0600"
  notify:
    - Generate netplan
    - Apply netplan

- name: Apply pending Netplan changes
  ansible.builtin.meta: flush_handlers

- name: Refresh network facts after Netplan apply
  when: ubuntu_netplan_verify_address | bool
  ansible.builtin.setup:
    gather_subset:
      - network

- name: Verify expected static IPv4 address is assigned
  when: ubuntu_netplan_verify_address | bool
  ansible.builtin.assert:
    that:
      - ubuntu_netplan_ipv4_address in (ansible_facts.all_ipv4_addresses | default([]))
    fail_msg: >-
      Expected static address {{ ubuntu_netplan_ipv4_address }} is not assigned after applying
      Netplan. Assigned addresses:
      {{ ansible_facts.all_ipv4_addresses | default([]) | join(', ') }}
