---

- name: Configure network-related settings
  when:
    - ansible_facts.default_ipv4 is defined
    - ansible_facts.default_ipv4.type == "ether"
  block:
    - name: Check vnstat config
      ansible.builtin.stat:
        path: /etc/vnstat.conf
      register: ubuntu_vnstat_conf

    - name: Set vnstat default interface
      ansible.builtin.lineinfile:
        path: /etc/vnstat.conf
        regexp: '^(Interface)\s+.*$'
        line: '\1 "{{ ansible_facts.default_ipv4.interface }}"'
        backrefs: true
      when:
        - ubuntu_vnstat_enabled | bool
        - ubuntu_vnstat_conf.stat.exists

    - name: Gather PCI device list
      ansible.builtin.command: lspci
      register: ubuntu_lspci
      changed_when: false

    - name: Install NIC tuning script
      ansible.builtin.template:
        src: nic-tuning.sh.j2
        dest: /usr/local/sbin/nic-tuning.sh
        owner: root
        group: root
        mode: "0755"
      when: ubuntu_nic_tuning_enabled | bool

    - name: Install NIC tuning systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/nic-tuning.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=Apply NIC tuning
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/nic-tuning.sh
          RemainAfterExit=yes

          [Install]
          WantedBy=multi-user.target
      register: ubuntu_nic_tuning_unit
      when: ubuntu_nic_tuning_enabled | bool

    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true
      when:
        - not ansible_check_mode
        - ubuntu_nic_tuning_enabled | bool
        - ubuntu_nic_tuning_unit.changed

    - name: Enable and run NIC tuning service
      ansible.builtin.systemd_service:
        name: nic-tuning.service
        enabled: true
        state: started
      when:
        - not ansible_check_mode
        - ubuntu_nic_tuning_enabled | bool
  rescue:
    - name: Fail network configuration with context
      ansible.builtin.fail:
        msg: >-
          Network-related Ubuntu configuration failed on {{ inventory_hostname }}.
          Fix the failed task above and rerun.
