---

- name: Assert skynet install path is defined
  ansible.builtin.assert:
    that:
      - ubuntu_skynet_install_path is defined
      - ubuntu_skynet_install_path | length > 0
    fail_msg: "ubuntu_skynet_install_path must be defined."

- name: Create directories
  ansible.builtin.file:
    path: "{{ _skynet_dir.path }}"
    state: directory
    owner: "{{ ubuntu_ansible_owner | default(ansible_user) }}"
    group: "{{ ubuntu_ansible_group | default(ansible_user) }}"
    mode: "{{ _skynet_dir.mode }}"
  loop:
    - path: "{{ ubuntu_ansible_opt_path }}"
      mode: "0755"
    - path: "{{ ubuntu_ansible_secrets_path }}"
      mode: "0700"
  loop_control:
    loop_var: _skynet_dir

- name: Check for become password file
  ansible.builtin.stat:
    path: "{{ ubuntu_ansible_become_pass_file }}"
  register: ubuntu_become_pass_file_stat

- name: Fail if become password file is missing
  ansible.builtin.fail:
    msg: >-
      Missing become password file: {{ ubuntu_ansible_become_pass_file }}.
      Create it manually on this ansible manager before using skynet.
  when: not ubuntu_become_pass_file_stat.stat.exists

- name: Check for vault password file
  ansible.builtin.stat:
    path: "{{ ubuntu_ansible_vault_pass_file }}"
  register: ubuntu_vault_pass_file_stat

- name: Fail if vault password file is missing
  ansible.builtin.fail:
    msg: >-
      Missing vault password file: {{ ubuntu_ansible_vault_pass_file }}.
      Create it manually on this ansible manager before using skynet.
  when:
    - "'tags_ansible_manager' in group_names"
    - not ubuntu_vault_pass_file_stat.stat.exists

- name: Install templated skynet wrapper
  ansible.builtin.template:
    src: skynet.j2
    dest: "{{ ubuntu_skynet_install_path }}"
    owner: root
    group: root
    mode: "0755"
  when: ubuntu_skynet_install | bool
