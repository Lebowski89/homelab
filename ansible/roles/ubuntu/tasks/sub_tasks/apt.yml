---

- name: Ensure python and apt prerequisites are installed
  ansible.builtin.apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - python3-apt
      - python3-debian
      - ca-certificates
      - software-properties-common
      - apt-utils
    state: present
    update_cache: true
  environment: "{{ ubuntu_apt_env_vars }}"

- name: Install common packages
  ansible.builtin.apt:
    name:
      - nano
      - zip
      - unzip
      - p7zip-full
      - curl
      - wget
      - tree
      - lsof
      - git
      - argon2
      - pwgen
      - rsync
      - logrotate
      - htop
      - iotop
      - nload
      - ufw
      - ncdu
      - mc
      - dnsutils
      - screen
      - tmux
      - apache2-utils
      - jq
      - moreutils
      - vnstat
      - pciutils
      - ethtool
      - man-db
      - unrar-free
    state: present
  environment: "{{ ubuntu_apt_env_vars }}"

- name: Install qemu-guest-agent on virtual guests
  ansible.builtin.apt:
    name: qemu-guest-agent
    state: present
  environment: "{{ ubuntu_apt_env_vars }}"
  register: ubuntu_qemu_guest_agent_pkg
  when:
    - ansible_virtualization_role | default("") == "guest"
    - ansible_virtualization_type | default("") in ["kvm", "qemu"]

- name: Ensure qemu-guest-agent is enabled and running
  ansible.builtin.systemd:
    name: qemu-guest-agent
    enabled: true
    state: started
  when:
    - not ansible_check_mode
    - ansible_virtualization_role | default("") == "guest"
    - ansible_virtualization_type | default("") in ["kvm", "qemu"]

- name: Upgrade installed packages
  ansible.builtin.apt:
    upgrade: full
    update_cache: true
    autoremove: false
    autoclean: false
  environment: "{{ ubuntu_apt_env_vars }}"

- name: Remove unnecessary packages
  ansible.builtin.apt:
    autoremove: true
    autoclean: true
