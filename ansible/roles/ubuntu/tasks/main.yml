---

- name: Ubuntu | Install common packages
  when: ubuntu_apt_enabled | default(true) | bool
  ansible.builtin.include_tasks:
    file: sub_tasks/apt.yml
    apply:
      tags:
        - ubuntu
        - ubuntu_apt
  tags:
    - ubuntu
    - ubuntu_apt

- name: Ubuntu | Install PostgreSQL backup prerequisites
  when:
    - "'tags_postgres' in group_names"
    - ubuntu_apt_enabled | default(true) | bool
  ansible.builtin.include_tasks:
    file: sub_tasks/postgres_backup_prerequisites.yml
    apply:
      tags:
        - never
        - postgres_backup
        - postgres_backup_setup
        - postgres_backup_run
  tags:
    - never
    - postgres_backup
    - postgres_backup_setup
    - postgres_backup_run

- name: Ubuntu | Manage workstation tooling
  when: "'tags_ansible_manager' in group_names"
  ansible.builtin.include_role:
    name: workstation
    tasks_from: tools
    apply:
      tags: [ubuntu]
  vars:
    workstation_user: "{{ ubuntu_ansible_owner | default(ansible_user) }}"
    workstation_tools_enabled: true
    workstation_repository_path: "{{ ubuntu_ansible_repo_path }}"
    workstation_ansible_tools_path: "{{ ubuntu_ansible_opt_path }}"
    workstation_ansible_venv_path: "{{ ubuntu_ansible_venv_path }}"
    workstation_secrets_path: "{{ ubuntu_ansible_secrets_path }}"
    workstation_become_pass_file: "{{ ubuntu_ansible_become_pass_file }}"
    workstation_vault_pass_file: "{{ ubuntu_ansible_vault_pass_file }}"
    workstation_ansible_collections_path: "{{ ubuntu_ansible_path }}/collections"
    workstation_ansible_log_path: "{{ ubuntu_ansible_opt_path }}/ansible.log"
    workstation_repository_clone: "{{ ubuntu_manage_repo_clone }}"
    workstation_repository_url: "{{ ubuntu_repo_url }}"
    workstation_repository_version: "{{ ubuntu_repo_version }}"
    workstation_skynet_enabled: "{{ ubuntu_skynet_install }}"
    workstation_skynet_install_path: "{{ ubuntu_skynet_install_path }}"
    workstation_skynet_owner: root
    workstation_skynet_group: root
    workstation_skynet_doctor_ping_target: "{{ ubuntu_skynet_doctor_ping_target }}"
  tags: [ubuntu, ubuntu_repo, ubuntu_venv, ubuntu_requirements, ubuntu_skynet]

- name: Ubuntu | Tune sysctl settings
  when: ubuntu_sysctl_enabled | default(true) | bool
  ansible.builtin.include_tasks:
    file: sub_tasks/sysctl.yml
    apply:
      tags:
        - ubuntu
        - ubuntu_sysctl
  tags:
    - ubuntu
    - ubuntu_sysctl

- name: Ubuntu | Configure PostgreSQL emergency swap
  when:
    - "'tags_postgres' in group_names"
    - ubuntu_postgres_emergency_swap_enabled | bool
  ansible.builtin.include_tasks:
    file: sub_tasks/postgres_emergency_swap.yml
    apply:
      tags:
        - ubuntu
        - ubuntu_postgres_swap
  tags:
    - ubuntu
    - ubuntu_postgres_swap

- name: Ubuntu | Set PAM limits
  ansible.builtin.include_tasks:
    file: sub_tasks/pam.yml
    apply:
      tags:
        - ubuntu
        - ubuntu_pam
  tags:
    - ubuntu
    - ubuntu_pam

- name: Ubuntu | Configure network tuning
  ansible.builtin.include_tasks:
    file: sub_tasks/network.yml
    apply:
      tags:
        - ubuntu
        - ubuntu_network
  tags:
    - ubuntu
    - ubuntu_network

- name: Ubuntu | Configure Netplan
  when:
    - ubuntu_netplan_enabled | bool
    - (ansible_facts.virtualization_type | default("")) != "lxc"
  ansible.builtin.include_tasks:
    file: sub_tasks/netplan.yml
    apply:
      tags:
        - ubuntu
        - ubuntu_netplan
  tags:
    - ubuntu
    - ubuntu_netplan
