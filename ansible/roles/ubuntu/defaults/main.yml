---

ubuntu_apt_base_packages:
  - python3
  - python3-apt
  - ca-certificates
  - apt-utils

ubuntu_apt_common_packages:
  - curl
  - wget
  - git
  - jq
  - rsync
  - logrotate
  - nano
  - unzip
  - tree
  - lsof

ubuntu_apt_python_packages:
  - python3-pip
  - python3-venv

ubuntu_apt_build_packages:
  - build-essential
  - python3-dev
  - gcc
  - g++
  - make

ubuntu_apt_admin_packages:
  - zip
  - p7zip-full
  - argon2
  - pwgen
  - htop
  - iotop
  - nload
  - ncdu
  - mc
  - dnsutils
  - screen
  - tmux
  - apache2-utils
  - moreutils
  - man-db
  - unrar-free

ubuntu_apt_network_packages:
  - vnstat
  - pciutils
  - ethtool

ubuntu_apt_firewall_packages:
  - ufw

ubuntu_apt_docker_packages: []
ubuntu_apt_postgres_packages:
  - acl
ubuntu_apt_swarm_packages: []
ubuntu_apt_haproxy_packages: []
ubuntu_apt_opentofu_packages: []

ubuntu_apt_env_vars:
  DEBIAN_FRONTEND: noninteractive
  DEBIAN_PRIORITY: critical

ubuntu_ansible_repo_root: /opt
ubuntu_ansible_repo_dirname: homelab
ubuntu_ansible_repo_path: "{{ ubuntu_ansible_repo_root }}/{{ ubuntu_ansible_repo_dirname }}"
ubuntu_ansible_dirname: ansible
ubuntu_ansible_path: "{{ ubuntu_ansible_repo_path }}/{{ ubuntu_ansible_dirname }}"

ubuntu_manage_repo_clone: true
ubuntu_repo_url: "https://github.com/Lebowski89/homelab.git"
ubuntu_repo_version: "main"

ubuntu_ansible_opt_path: /opt/ansible
ubuntu_ansible_venv_path: "{{ ubuntu_ansible_opt_path }}/ansible-venv"
ubuntu_ansible_secrets_path: "{{ ubuntu_ansible_opt_path }}/.secrets"
ubuntu_ansible_become_pass_file: "{{ ubuntu_ansible_secrets_path }}/.ansible_become_pass"
ubuntu_ansible_vault_pass_file: "{{ ubuntu_ansible_secrets_path }}/.ansible_vault_pass"

ubuntu_skynet_install: true
ubuntu_skynet_install_path: /usr/local/bin/skynet
ubuntu_skynet_doctor_ping_target: tags_skynet

ubuntu_sysctl_file: /etc/sysctl.d/99-ubuntu-tuning.conf

ubuntu_sysctl_settings:
  fs.inotify.max_user_watches: 524288
  net.core.default_qdisc: fq
  net.core.netdev_budget: 50000
  net.core.netdev_max_backlog: 100000
  net.core.rmem_max: 67108864
  net.core.somaxconn: 4096
  net.core.wmem_max: 67108864
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.all.secure_redirects: 0
  net.ipv4.tcp_adv_win_scale: 2
  net.ipv4.tcp_congestion_control: bbr
  net.ipv4.tcp_fin_timeout: 10
  net.ipv4.tcp_max_syn_backlog: 30000
  net.ipv4.tcp_max_tw_buckets: 2000000
  net.ipv4.tcp_mtu_probing: 1
  net.ipv4.tcp_rfc1337: 1
  net.ipv4.tcp_rmem: "4096 87380 33554432"
  net.ipv4.tcp_sack: 1
  net.ipv4.tcp_slow_start_after_idle: 0
  net.ipv4.tcp_tw_reuse: 2
  net.ipv4.tcp_window_scaling: 1
  net.ipv4.tcp_wmem: "4096 87380 33554432"
  net.ipv4.udp_rmem_min: 8192
  net.ipv4.udp_wmem_min: 8192
  net.ipv4.neigh.default.gc_thresh1: 1024
  net.ipv4.neigh.default.gc_thresh2: 2048
  net.ipv4.neigh.default.gc_thresh3: 4096
  vm.dirty_background_ratio: 10
  vm.dirty_ratio: 15
  vm.swappiness: 10

ubuntu_pam_limits:
  - domain: "*"
    limit_type: "-"
    limit_item: nofile
    value: "100000"
  - domain: "*"
    limit_type: soft
    limit_item: memlock
    value: unlimited
  - domain: "*"
    limit_type: hard
    limit_item: memlock
    value: unlimited

ubuntu_netplan_enabled: true
ubuntu_netplan_disable_cloud_init_networking: true
ubuntu_netplan_verify_address: true
ubuntu_netplan_interface: ""

ubuntu_defaults_netplan_config: netplan-config.yaml
ubuntu_netplan_config_path: "/etc/netplan/{{ ubuntu_defaults_netplan_config }}"

ubuntu_defaults_netplan_gateway: >-
  {{
    hostvars[
      (groups['tags_lan_gateway'] | default([]) | sort | first)
    ].local_ip
  }}

ubuntu_defaults_netplan_nameservers: >-
  {{
    groups['tags_dns']
    | default([])
    | map('extract', hostvars)
    | sort(attribute='custom_fields.dns_priority')
    | map(attribute='local_ip')
    | list
  }}

ubuntu_netplan_nameservers: "{{ ubuntu_defaults_netplan_nameservers }}"
ubuntu_netplan_search_domains: []
ubuntu_netplan_prefix: 24

ubuntu_nic_tuning_enabled: true
ubuntu_vnstat_enabled: true
