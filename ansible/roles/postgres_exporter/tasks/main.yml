---

- name: Postgres_Exporter | Validate platform and installation inputs
  ansible.builtin.import_tasks: platform.yml

- name: Postgres_Exporter | Preview installation in check mode
  when: ansible_check_mode
  ansible.builtin.debug:
    msg: >-
      Would install prerequisites and the checksum-pinned {{ postgres_exporter_arch }} exporter,
      prepare its dedicated account, protected configuration and systemd unit, and enable/start the service.
      Credential validation/rendering, downloads, label changes and service lifecycle are deferred.
      Database access and listener readiness have not been verified.

- name: Postgres_Exporter | Install and configure the exporter
  when: not ansible_check_mode
  ansible.builtin.import_tasks: install.yml
