---

################################
# INIT
################################

- name: Podman services | Initialize service
  ansible.builtin.include_tasks:
    file: sub_tasks/init.yml
    apply:
      tags: [deploy, update, remove, recreate, drift, bootstrap]
  tags: [deploy, update, remove, recreate, drift, bootstrap]

################################
# EXECUTION PREPARATION
################################

- name: Podman services | Prepare execution environment
  ansible.builtin.include_tasks:
    file: sub_tasks/execution.yml
    apply:
      tags: [deploy, update, remove, recreate, drift, bootstrap]
  tags: [deploy, update, remove, recreate, drift, bootstrap]

################################
# EXTERNAL NETWORK PREFLIGHT
################################

- name: Podman services | Check configured external network
  when:
    - not ansible_check_mode
    - podman_services_common_action in ['deploy', 'update', 'recreate', 'bootstrap']
    - podman_services_service.network is mapping
    - podman_services_service.network.external | bool
  become: true
  become_user: "{{ podman_services_execution.host_user | default('root') }}"
  environment: "{{ podman_services_runtime_environment }}"
  ansible.builtin.command:
    argv:
      - podman
      - network
      - exists
      - "{{ podman_services_service.network.name }}"
  register: podman_services_external_network_check
  changed_when: false
  failed_when: false
  tags: [deploy, update, recreate, bootstrap]

- name: Podman services | Verify configured external network exists
  when:
    - not ansible_check_mode
    - podman_services_common_action in ['deploy', 'update', 'recreate', 'bootstrap']
    - podman_services_service.network is mapping
    - podman_services_service.network.external | bool
  ansible.builtin.assert:
    that:
      - podman_services_external_network_check.rc == 0
    fail_msg: >-
      External Podman network {{ podman_services_service.network.name }} does not exist
      in this host's Podman network store; create it deliberately before running this service.
  tags: [deploy, update, recreate, bootstrap]

################################
# APPLICATION VALIDATION
################################

- name: Podman services | Build application preparation context
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    podman_services_application_context:
      service_name: "{{ podman_services_service.name }}"
      target: "{{ podman_services_service_target | default('') }}"
      runtime: podman
      operation: "{{ podman_services_common_action }}"
      service: >-
        {{ podman_services_service_cfg | combine({'environment': podman_services_resolved_environment}, recursive=false) }}
      resolved_environment: "{{ podman_services_resolved_environment }}"
      lookup_values: "{{ podman_services_common_values }}"
      secret_declarations: "{{ podman_services_secret_declarations }}"
      controller_host: "{{ podman_services_controller_host }}"
      filesystem_hosts: ["{{ inventory_hostname }}"]
      host_defaults: "{{ podman_services_common_host_defaults }}"
  tags: [deploy, update, remove, recreate, drift, bootstrap]

- name: Podman services | Validate application settings
  no_log: true
  ansible.builtin.include_role:
    name: service_prepare
    tasks_from: validate
    apply:
      tags: [deploy, update, remove, recreate, drift, bootstrap]
      no_log: true
      diff: false
  vars:
    service_prepare_context: "{{ podman_services_application_context }}"
  tags: [deploy, update, remove, recreate, drift, bootstrap]

- name: Podman services | Store validated application outputs
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    podman_services_application_template_vars: "{{ service_prepare_template_vars }}"
    podman_services_application_secret_values: "{{ service_prepare_generated_secret_values }}"
    podman_services_application_secret_declarations: "{{ service_prepare_generated_secret_declarations }}"
    podman_services_application_bootstrap_requests: "{{ service_prepare_bootstrap_requests }}"
  tags: [deploy, update, remove, recreate, drift, bootstrap]

################################
# RUNTIME CLEANUP
################################

- name: Podman services | Check service before recreate
  when:
    - not ansible_check_mode
    - podman_services_state == 'recreate'
    - podman_services_execution.mode == 'rootful'
    - not (podman_services_execution_transition | bool)
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - "{{ podman_services_unit_name }}"
      - --property=LoadState
      - --value
  register: podman_services_recreate_unit_load_state
  changed_when: false
  failed_when: false
  tags: [recreate]

- name: Podman services | Stop service before recreate
  when:
    - not ansible_check_mode
    - podman_services_state == 'recreate'
    - podman_services_execution.mode == 'rootful'
    - not (podman_services_execution_transition | bool)
    - podman_services_recreate_unit_load_state.stdout | trim != 'not-found'
  ansible.builtin.systemd_service:
    name: "{{ podman_services_unit_name }}"
    state: stopped
  tags: [recreate]

################################
# APPLICATION SECRET GENERATION
################################

- name: Podman services | Generate application secrets
  when: podman_services_common_action in ['deploy', 'update', 'recreate', 'bootstrap']
  no_log: true
  ansible.builtin.include_role:
    name: service_prepare
    tasks_from: generate_secrets
    apply:
      tags: [deploy, update, recreate, bootstrap]
      no_log: true
      diff: false
  vars:
    service_prepare_context: "{{ podman_services_application_context }}"
  tags: [deploy, update, recreate, bootstrap]

- name: Podman services | Combine service secret values and definitions
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    podman_services_application_secret_values: "{{ service_prepare_generated_secret_values }}"
    podman_services_application_secret_declarations: >-
      {{ service_prepare_generated_secret_declarations | podman_secret_declarations }}
    podman_services_effective_secret_values: >-
      {{ podman_services_common_values | combine(service_prepare_generated_secret_values) }}
    podman_services_effective_secret_declarations: >-
      {{
        podman_services_secret_declarations
        + (service_prepare_generated_secret_declarations | podman_secret_declarations)
      }}
  tags: [deploy, update, recreate, bootstrap]

- name: Podman services | Validate secret attachments
  no_log: true
  diff: false
  ansible.builtin.assert:
    that:
      - >-
        podman_services_service.secret_attachments
        | difference(podman_services_effective_secret_declarations | map(attribute='name') | list)
        | length == 0
    fail_msg: >-
      A canonical secret attachment has no current-service declaration; Podman
      native-secret materialization was stopped.
  tags: [deploy, update, recreate, bootstrap]

- name: Podman services | Add Podman secret definitions
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    podman_services_service: >-
      {{
        podman_services_service
        | combine({'secrets': podman_services_effective_secret_declarations}, recursive=false)
      }}
  tags: [deploy, update, recreate, bootstrap]

- name: Podman services | Manage Podman secrets
  when:
    - not ansible_check_mode
    - podman_services_common_action in ['deploy', 'update', 'recreate', 'bootstrap']
    - podman_services_effective_secret_declarations | length > 0
  no_log: true
  ansible.builtin.include_tasks:
    file: sub_tasks/secrets/manage.yml
    apply:
      tags: [deploy, update, recreate, bootstrap]
      no_log: true
      diff: false
  tags: [deploy, update, recreate, bootstrap]

################################
# APPLICATION TEMPLATE VALUES
################################

- name: Podman services | Build application template values
  when: podman_services_common_action in ['deploy', 'update', 'recreate', 'bootstrap']
  no_log: true
  ansible.builtin.include_role:
    name: service_prepare
    tasks_from: derive_templates
    apply:
      tags: [deploy, update, recreate, bootstrap]
      no_log: true
      diff: false
  vars:
    service_prepare_context: "{{ podman_services_application_context }}"
  tags: [deploy, update, recreate, bootstrap]

- name: Podman services | Store application template values
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    podman_services_application_template_vars: "{{ service_prepare_template_vars }}"
  tags: [deploy, update, recreate, bootstrap]

################################
# SHARED PREPARATION
################################

- name: Podman services | Prepare service files and directories
  no_log: true
  ansible.builtin.include_role:
    name: service_common
    tasks_from: prepare
    apply:
      tags: [deploy, update, recreate, bootstrap]
      no_log: true
      diff: false
  vars:
    service_common_name: "{{ podman_services_service.name }}"
    service_common_runtime: podman
    service_common_action: "{{ podman_services_common_action }}"
    service_common_service: >-
      {{
        podman_services_service_cfg
        | combine({
            'environment': podman_services_resolved_environment,
            'paths': podman_services_service.host_paths
          }, recursive=false)
      }}
    service_common_target_hosts: ["{{ inventory_hostname }}"]
    service_common_controller_host: "{{ podman_services_controller_host }}"
    service_common_infisical_values: "{{ podman_services_common_values }}"
    service_common_host_defaults: >-
      {{
        {}
        if (
          podman_services_execution.mode == 'rootless'
          and podman_services_service.container.mounts | default([]) | length > 0
        )
        else podman_services_common_host_defaults
      }}
    service_common_default_owner: >-
      {{
        (omit if ansible_check_mode else podman_services_execution.host_user)
        if (
          podman_services_execution.mode == 'rootless'
          and podman_services_service.container.mounts | default([]) | length > 0
        )
        else (
          podman_services_service.container.uid
          | default(podman_services_common_host_defaults[inventory_hostname].get('puid', '1000'))
        )
      }}
    service_common_default_group: >-
      {{
        (omit if ansible_check_mode else podman_services_execution.host_user)
        if (
          podman_services_execution.mode == 'rootless'
          and podman_services_service.container.mounts | default([]) | length > 0
        )
        else (
          podman_services_service.container.gid
          | default(podman_services_common_host_defaults[inventory_hostname].get('pgid', '1000'))
        )
      }}
    service_common_default_mode: "0750"
    service_common_template_vars: "{{ podman_services_application_template_vars }}"
  tags: [deploy, update, recreate, bootstrap]

- name: Podman services | Set rootless bind mount ownership
  when:
    - not ansible_check_mode
    - podman_services_common_action in ['deploy', 'update', 'recreate', 'bootstrap']
    - podman_services_execution.mode == 'rootless'
    - podman_services_service.container.mounts | default([]) | length > 0
  become: true
  ansible.builtin.file:
    path: "{{ podman_services_rootless_bind_source }}"
    state: directory
    owner: "{{ podman_services_execution.host_user }}"
    group: "{{ podman_services_execution.host_user }}"
    recurse: true
  loop: >-
    {{
      podman_services_service.container.mounts
      | map(attribute='source')
      | unique
      | list
    }}
  loop_control:
    loop_var: podman_services_rootless_bind_source
    label: "{{ podman_services_rootless_bind_source }}"
  tags: [deploy, update, recreate, bootstrap]

################################
# APPLICATION CONFIGURATION
################################

- name: Podman services | Configure application
  when: podman_services_common_action in ['deploy', 'update', 'recreate', 'bootstrap']
  no_log: true
  ansible.builtin.include_role:
    name: service_prepare
    tasks_from: configure
    apply:
      tags: [deploy, update, recreate, bootstrap]
      no_log: true
      diff: false
  vars:
    service_prepare_context: "{{ podman_services_application_context }}"
  tags: [deploy, update, recreate, bootstrap]

################################
# PREPARE
################################

- name: Podman services | Write Quadlet files
  no_log: true
  ansible.builtin.include_tasks:
    file: sub_tasks/quadlets.yml
    apply:
      tags: [deploy, update, remove, recreate, drift, bootstrap]
      no_log: true
      diff: false
  tags: [deploy, update, remove, recreate, drift, bootstrap]

################################
# IMAGE
################################

- name: Podman services | Prepare container image
  ansible.builtin.include_tasks:
    file: sub_tasks/image.yml
    apply:
      tags: [deploy, update, recreate, bootstrap]
  tags: [deploy, update, recreate, bootstrap]

################################
# CHANGED NETWORK
################################

- name: Podman services | Check managed network changes
  ansible.builtin.include_tasks:
    file: sub_tasks/network_changes.yml
    apply:
      tags: [update, recreate]
  tags: [update, recreate]

################################
# SERVICE LIFECYCLE
################################

- name: Podman services | Manage service state
  ansible.builtin.include_tasks:
    file: sub_tasks/service_state.yml
    apply:
      tags: [deploy, update, remove, recreate, bootstrap]
  tags: [deploy, update, remove, recreate, bootstrap]

################################
# TRAEFIK
################################

- name: Podman services | Configure Traefik integration
  when: podman_services_service.traefik.enable | default(false) | bool
  no_log: true
  ansible.builtin.include_role:
    name: service_common
    tasks_from: traefik
    apply:
      tags: [deploy, update, recreate, bootstrap]
      no_log: true
      diff: false
  vars:
    service_common_name: "{{ podman_services_service.name }}"
    service_common_runtime: podman
    service_common_action: "{{ podman_services_common_action }}"
    service_common_service: "{{ podman_services_service }}"
    service_common_target_hosts: ["{{ inventory_hostname }}"]
    service_common_controller_host: "{{ podman_services_traefik_delegate }}"
    service_common_traefik_base_zone: "{{ podman_services_common_values.cloudflare_zone }}"
    service_common_traefik_dynamic_dir: "{{ podman_services_traefik_dynamic_dir }}"
    service_common_traefik_owner: "{{ podman_services_traefik_dynamic_owner }}"
    service_common_traefik_group: "{{ podman_services_traefik_dynamic_group }}"
  tags: [deploy, update, recreate, bootstrap]

################################
# REMOVE
################################

- name: Podman services | Remove Podman service
  when: podman_services_common_action == 'remove'
  ansible.builtin.include_tasks:
    file: sub_tasks/remove.yml
    apply:
      tags: [remove]
  tags: [remove]

- name: Podman services | Remove service integrations
  when:
    - podman_services_common_action == 'remove'
    - podman_services_service.traefik.enable | default(false) | bool
  ansible.builtin.include_role:
    name: service_common
    tasks_from: remove_integrations
    apply:
      tags: [remove]
  vars:
    service_common_name: "{{ podman_services_service.name }}"
    service_common_runtime: podman
    service_common_action: "{{ podman_services_common_action }}"
    service_common_service: "{{ podman_services_service }}"
    service_common_target_hosts: ["{{ inventory_hostname }}"]
    service_common_controller_host: "{{ podman_services_traefik_delegate }}"
    service_common_traefik_dynamic_dir: "{{ podman_services_traefik_dynamic_dir }}"
  tags: [remove]

################################
# DRIFT
################################

- name: Podman services | Check image drift
  ansible.builtin.include_tasks:
    file: sub_tasks/image_drift.yml
    apply:
      tags: [drift]
  tags: [drift]

- name: Podman services | Finish service removal
  when: podman_services_common_action == 'remove'
  ansible.builtin.include_tasks:
    file: sub_tasks/finish_remove.yml
    apply:
      tags: [remove]
  tags: [remove]
