---

- name: Init | Validate selected service configuration
  ansible.builtin.assert:
    that:
      - podman_services_service_cfg is defined
      - podman_services_service_cfg is mapping
      - podman_services_service_cfg.targets is not defined
    fail_msg: >-
      podman_services requires a catalog-resolved podman_services_service_cfg mapping
      without a targets key.
  tags: [deploy, update, remove, recreate, drift, bootstrap]

- name: Init | Build Podman service settings
  ansible.builtin.set_fact:
    podman_services_service: "{{ podman_services_service_cfg | podman_service_normalize(podman_services_role_prefix) }}"
  tags: [deploy, update, remove, recreate, drift, bootstrap]

- name: Init | Set systemd service name
  ansible.builtin.set_fact:
    podman_services_unit_name: "{{ podman_services_service.unit_name ~ '.service' }}"
  tags: [deploy, update, remove, recreate, drift, bootstrap]

- name: Init | Reset temporary service state
  ansible.builtin.set_fact:
    podman_services_secret_values: {}
    podman_services_common_values: {}
    podman_services_secret_declarations: []
    podman_services_resolved_environment: {}
    podman_services_secret_results: {}
    podman_services_image_pull: {}
    podman_services_requires_restart: false
    podman_services_common_host_defaults: {}
    podman_services_controller_host: ""
    podman_services_application_template_vars: {}
    podman_services_application_secret_values: {}
    podman_services_application_secret_declarations: []
    podman_services_application_bootstrap_requests: {}
    podman_services_execution: {}
    podman_services_desired_execution: {}
    podman_services_active_execution: {mode: none}
    podman_services_operation_execution: {mode: none}
    podman_services_execution_home: ""
    podman_services_execution_uid: ""
    podman_services_execution_gid: ""
    podman_services_execution_owner: root
    podman_services_execution_group: root
    podman_services_runtime_environment: {}
    podman_services_rootless_pasta_config: {}
    podman_services_rootless_network_conf_dir: ""
    podman_services_rootless_network_conf_path: ""
    podman_services_rootless_host_route_overlaps: []
    podman_services_previous_execution: {mode: none}
    podman_services_execution_transition: false
    podman_services_execution_state: {}
    podman_services_execution_state_path: ""
    podman_services_account_marker: {}
    podman_services_account_marker_path: ""
    podman_services_remove_generated_paths: []
  no_log: true
  diff: false
  tags: [deploy, update, remove, recreate, drift, bootstrap]

- name: Init | Validate shared service context
  no_log: true
  diff: false
  ansible.builtin.assert:
    that:
      - podman_services_common_context is defined
      - podman_services_common_context is mapping
      - podman_services_common_context.runtime == 'podman'
      - podman_services_common_context.dispatch_host == inventory_hostname
      - podman_services_common_context.controller_host in hostvars
      - podman_services_common_context.lookup_values is mapping
      - podman_services_common_context.resolved_environment is mapping
      - podman_services_common_context.secret_declarations is sequence
    fail_msg: "podman_services requires the current dispatch host's validated common service context."
  tags: [deploy, update, remove, recreate, drift, bootstrap]

- name: Init | Store shared service context
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    podman_services_common_values: "{{ podman_services_common_context.lookup_values }}"
    podman_services_secret_declarations: >-
      {{ podman_services_common_context.secret_declarations | podman_secret_declarations }}
    podman_services_resolved_environment: "{{ podman_services_common_context.resolved_environment }}"
    podman_services_controller_host: "{{ podman_services_common_context.controller_host }}"
  tags: [deploy, update, remove, recreate, drift, bootstrap]

- name: Init | Add environment and secret settings
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    podman_services_service: >-
      {{
        podman_services_service
        | combine({
            'env': podman_services_resolved_environment,
            'secrets': podman_services_secret_declarations
          }, recursive=false)
      }}
  tags: [deploy, update, remove, recreate, drift, bootstrap]

- name: Init | Store container host defaults
  ansible.builtin.set_fact:
    podman_services_common_host_defaults: >-
      {{
        {
          inventory_hostname:
            hostvars[inventory_hostname].container_host_defaults
            | default(hostvars[inventory_hostname] | container_host_defaults, true)
        }
      }}
  tags: [deploy, update, remove, recreate, drift, bootstrap]

- name: Init | Verify service is running on selected host
  ansible.builtin.assert:
    that:
      - podman_services_service.container.host | default(inventory_hostname) == inventory_hostname
    fail_msg: >-
      Podman service {{ podman_services_service.name }} is targeted at
      {{ podman_services_service.container.host | default(inventory_hostname) }}, not {{ inventory_hostname }}.
  tags: [deploy, update, remove, recreate, drift, bootstrap]

- name: Init | Set initial execution settings
  ansible.builtin.set_fact:
    podman_services_execution: "{{ podman_services_service.execution }}"
    podman_services_desired_execution: "{{ podman_services_service.execution }}"
    podman_services_execution_home: >-
      {{
        podman_services_rootless_home_root ~ '/' ~ podman_services_service.execution.host_user
        if podman_services_service.execution.mode == 'rootless'
        else '/root'
      }}
    podman_services_execution_owner: >-
      {{ podman_services_service.execution.host_user if podman_services_service.execution.mode == 'rootless' else 'root' }}
    podman_services_execution_group: >-
      {{ podman_services_service.execution.host_user if podman_services_service.execution.mode == 'rootless' else 'root' }}
    podman_services_quadlet_dir: >-
      {{
        podman_services_rootless_home_root ~ '/' ~ podman_services_service.execution.host_user ~ '/.config/containers/systemd'
        if podman_services_service.execution.mode == 'rootless'
        else podman_services_system_quadlet_dir
      }}
    podman_services_runtime_environment: {}
    podman_services_rootless_network_conf_dir: >-
      {{
        podman_services_rootless_home_root ~ '/' ~ podman_services_service.execution.host_user
        ~ '/.config/containers/containers.conf.d'
        if podman_services_service.execution.mode == 'rootless'
        else ''
      }}
    podman_services_rootless_network_conf_path: >-
      {{
        podman_services_rootless_home_root ~ '/' ~ podman_services_service.execution.host_user
        ~ '/.config/containers/containers.conf.d/20-podman-services-network.conf'
        if podman_services_service.execution.mode == 'rootless'
        else ''
      }}
    podman_services_execution_state_path: >-
      {{ podman_services_execution_state_dir ~ '/' ~ podman_services_service.unit_name ~ '.yml' }}
  tags: [deploy, update, remove, recreate, drift, bootstrap]
