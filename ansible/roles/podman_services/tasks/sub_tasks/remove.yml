---

- name: Remove | Check container unit load state for removal
  when:
    - not ansible_check_mode
    - podman_services_state == 'remove'
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - "{{ podman_services_unit_name }}"
      - --property=LoadState
      - --value
  register: podman_services_remove_unit_load_state
  changed_when: false
  failed_when: false
  tags: [remove]

- name: Remove | Stop service for removal without deleting data
  when:
    - not ansible_check_mode
    - podman_services_state == 'remove'
    - podman_services_remove_unit_load_state.stdout | trim != 'not-found'
  ansible.builtin.systemd_service:
    name: "{{ podman_services_unit_name }}"
    state: stopped
  tags: [remove]


- name: Remove | Stop generated network unit for removal
  when:
    - not ansible_check_mode
    - podman_services_state == 'remove'
    - podman_services_service.network is mapping
  ansible.builtin.systemd_service:
    name: "{{ podman_services_service.network.name }}-network.service"
    state: stopped
  register: podman_services_remove_network_stop
  failed_when: >-
    podman_services_remove_network_stop is failed
    and (podman_services_remove_network_stop.msg | default('') is not search('not loaded|Could not find|not found'))
  tags: [remove]

- name: Remove | Check dedicated network still exists for removal
  when:
    - not ansible_check_mode
    - podman_services_state == 'remove'
    - podman_services_service.network is mapping
    - podman_services_service.network.delete_on_stop | default(false) | bool
  ansible.builtin.command:
    argv: [podman, network, exists, "{{ podman_services_service.network.name }}"]
  register: podman_services_remove_network_exists
  changed_when: false
  failed_when: podman_services_remove_network_exists.rc not in [0, 1]
  tags: [remove]

- name: Remove | Remove dedicated network if still present
  when:
    - not ansible_check_mode
    - podman_services_state == 'remove'
    - podman_services_service.network is mapping
    - podman_services_service.network.delete_on_stop | default(false) | bool
    - podman_services_remove_network_exists.rc == 0
  ansible.builtin.command:
    argv: [podman, network, rm, "{{ podman_services_service.network.name }}"]
  changed_when: true
  tags: [remove]

- name: Remove | Remove generated Quadlet and environment files only
  when: podman_services_state == 'remove'
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{
      [
        podman_services_quadlet_dir ~ '/' ~ podman_services_service.unit_name ~ '.container',
        podman_services_quadlet_dir ~ '/' ~ podman_services_service.unit_name ~ '.env'
      ]
      + (
        [podman_services_quadlet_dir ~ '/' ~ podman_services_service.network.name ~ '.network']
        if podman_services_service.network is mapping
        else []
      )
      + (
        podman_services_service.volumes
        | map(attribute='name')
        | map('regex_replace', '^(.*)$', podman_services_quadlet_dir ~ '/\\1.volume')
        | list
      )
    }}
  notify: Podman services | daemon reload
  tags: [remove]
