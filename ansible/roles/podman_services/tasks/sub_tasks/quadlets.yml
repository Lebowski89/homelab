---

- name: Quadlets | Preview rootless Quadlet changes
  when:
    - ansible_check_mode
    - podman_services_state != 'remove'
    - podman_services_execution.mode == 'rootless'
  ansible.builtin.include_tasks:
    file: sub_tasks/check_quadlets.yml
    apply:
      tags: [deploy, update, recreate, bootstrap]
  tags: [deploy, update, recreate, bootstrap]

- name: Quadlets | Ensure Quadlet directory exists
  when:
    - podman_services_state != 'remove'
    - not (ansible_check_mode and podman_services_execution.mode == 'rootless')
  ansible.builtin.file:
    path: "{{ podman_services_quadlet_dir }}"
    state: directory
    owner: "{{ podman_services_execution_owner }}"
    group: "{{ podman_services_execution_group }}"
    mode: "{{ '0700' if podman_services_execution.mode == 'rootless' else '0755' }}"
  tags: [deploy, update, remove, recreate, drift, bootstrap]

- name: Quadlets | Write network Quadlet
  when:
    - podman_services_service.network is mapping
    - not podman_services_service.network.external | bool
    - podman_services_state != 'remove'
    - not (ansible_check_mode and podman_services_execution.mode == 'rootless')
  ansible.builtin.template:
    src: network.network.j2
    dest: "{{ podman_services_quadlet_dir }}/{{ podman_services_service.network.name }}.network"
    owner: "{{ podman_services_execution_owner }}"
    group: "{{ podman_services_execution_group }}"
    mode: "0644"
  vars:
    podman_service: "{{ podman_services_service }}"
  register: podman_services_network_quadlet
  notify: Podman services | daemon reload
  tags: [deploy, update, recreate, bootstrap]

- name: Quadlets | Write volume Quadlets
  when:
    - podman_services_state != 'remove'
    - not (ansible_check_mode and podman_services_execution.mode == 'rootless')
  ansible.builtin.template:
    src: volume.volume.j2
    dest: "{{ podman_services_quadlet_dir }}/{{ volume.name }}.volume"
    owner: "{{ podman_services_execution_owner }}"
    group: "{{ podman_services_execution_group }}"
    mode: "0644"
  loop: "{{ podman_services_service.volumes }}"
  loop_control:
    loop_var: volume
    label: "{{ volume.name }}"
  register: podman_services_volume_quadlets
  notify: Podman services | daemon reload
  tags: [deploy, update, recreate, bootstrap]

- name: Quadlets | Write protected environment file
  no_log: true
  diff: false
  when:
    - not ansible_check_mode
    - podman_services_service.env | length > 0
    - podman_services_state != 'remove'
    - not (ansible_check_mode and podman_services_execution.mode == 'rootless')
  ansible.builtin.template:
    src: env.env.j2
    dest: "{{ podman_services_quadlet_dir }}/{{ podman_services_service.unit_name }}.env"
    owner: "{{ podman_services_execution_owner }}"
    group: "{{ podman_services_execution_group }}"
    mode: "0600"
  vars:
    podman_service: "{{ podman_services_service }}"
  register: podman_services_env_file
  notify: Podman services | daemon reload
  tags: [deploy, update, recreate, bootstrap]

# Retire the old protected file before successful state can omit its ownership.
- name: Quadlets | Retire the managed environment file when no values remain
  when:
    - podman_services_state in ['deploy', 'update', 'recreate', 'bootstrap']
    - podman_services_service.env | length == 0
  tags: [deploy, update, recreate, bootstrap]
  block:
    - name: Quadlets | Inspect the obsolete environment path without following links
      ansible.builtin.stat:
        path: "{{ podman_services_quadlet_dir }}/{{ podman_services_service.unit_name }}.env"
        follow: false
      register: podman_services_retired_environment

    - name: Quadlets | Require scoped ownership before retiring an environment file
      when: podman_services_retired_environment.stat.exists
      ansible.builtin.assert:
        that:
          - podman_services_retired_environment.stat.isreg | default(false)
          - not podman_services_retired_environment.stat.islnk | default(false)
          - podman_services_active_execution.mode == podman_services_execution.mode
          - podman_services_active_execution.quadlet_dir | default(podman_services_quadlet_dir) == podman_services_quadlet_dir
          - >-
            podman_services_execution.mode != 'rootless'
            or podman_services_active_execution.host_user == podman_services_execution.host_user
          - >-
            podman_services_active_execution.version is not defined
            or (podman_services_quadlet_dir ~ '/' ~ podman_services_service.unit_name ~ '.env')
               in (podman_services_active_execution.resources | default({})).generated_files | default([])
          - podman_services_retired_environment.stat.pw_name == podman_services_execution_owner
          - podman_services_retired_environment.stat.gr_name == podman_services_execution_group
          - podman_services_retired_environment.stat.mode == '0600'
        fail_msg: Refusing to retire an environment file without matching execution ownership, protected permissions and saved resource ownership.

    - name: Quadlets | Read the obsolete environment marker privately
      when: podman_services_retired_environment.stat.exists
      ansible.builtin.slurp:
        src: "{{ podman_services_retired_environment.stat.path }}"
      register: podman_services_retired_environment_content
      no_log: true
      diff: false

    - name: Quadlets | Require the generated marker before retiring the environment file
      when: podman_services_retired_environment.stat.exists
      ansible.builtin.assert:
        that:
          - >-
            podman_services_retired_environment_content.content | b64decode
            is match('^# Generated by Ansible\. Do not edit manually\.')
        fail_msg: Refusing to delete an unmarked environment file.
      no_log: true
      diff: false

    - name: Quadlets | Remove only the proved obsolete environment file
      when: podman_services_retired_environment.stat.exists
      ansible.builtin.file:
        path: "{{ podman_services_retired_environment.stat.path }}"
        state: absent
      notify: Podman services | daemon reload
  rescue:
    - name: Quadlets | Stop without forgetting environment ownership
      ansible.builtin.fail:
        msg: >-
          Environment retirement failed; saved execution ownership remains unchanged.
          Repair the reported permission/ownership or managed-file failure, then retry
          this operation or scoped removal. See the original failure above.

- name: Quadlets | Write container Quadlet
  diff: false
  when:
    - podman_services_state != 'remove'
    - not (ansible_check_mode and podman_services_execution.mode == 'rootless')
  ansible.builtin.template:
    src: container.container.j2
    dest: "{{ podman_services_quadlet_dir }}/{{ podman_services_service.unit_name }}.container"
    owner: "{{ podman_services_execution_owner }}"
    group: "{{ podman_services_execution_group }}"
    mode: "0644"
  vars:
    podman_service: "{{ podman_services_service }}"
  register: podman_services_container_quadlet
  notify: Podman services | daemon reload
  tags: [deploy, update, recreate, bootstrap]
