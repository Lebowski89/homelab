---

- name: Network | Report retained managed network definition change
  when:
    - podman_services_state in ['update', 'recreate']
    - podman_services_service.network is mapping
    - not podman_services_service.network.external | bool
    - podman_services_network_quadlet is defined
    - podman_services_network_quadlet is changed
  ansible.builtin.debug:
    msg: >-
      The managed Podman network definition changed, but the existing network
      is retained during update and recreate. Use an explicit remove followed
      by deploy when the network itself must be recreated.
  changed_when: false
  tags: [update, recreate]
