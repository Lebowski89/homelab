---

- name: Network | Stop container before changed dedicated network lifecycle
  when:
    - not ansible_check_mode
    - podman_services_state in ['update', 'recreate']
    - podman_services_service.network is mapping
    - podman_services_network_quadlet is changed
    - podman_services_service.network.delete_on_stop | default(false) | bool
  ansible.builtin.systemd_service:
    name: "{{ podman_services_unit_name }}"
    state: stopped
  tags: [update, recreate]

- name: Network | Stop generated dedicated network after changed lifecycle
  when:
    - not ansible_check_mode
    - podman_services_state in ['update', 'recreate']
    - podman_services_service.network is mapping
    - podman_services_network_quadlet is changed
    - podman_services_service.network.delete_on_stop | default(false) | bool
  ansible.builtin.systemd_service:
    name: "{{ podman_services_service.network.name }}-network.service"
    state: stopped
  register: podman_services_changed_network_stop
  failed_when: >-
    podman_services_changed_network_stop is failed
    and (podman_services_changed_network_stop.msg | default('') is not search('not loaded|Could not find|not found'))
  tags: [update, recreate]

- name: Network | Check changed dedicated network still exists
  when:
    - not ansible_check_mode
    - podman_services_state in ['update', 'recreate']
    - podman_services_service.network is mapping
    - podman_services_network_quadlet is changed
    - podman_services_service.network.delete_on_stop | default(false) | bool
  ansible.builtin.command:
    argv: [podman, network, exists, "{{ podman_services_service.network.name }}"]
  register: podman_services_changed_network_exists
  changed_when: false
  failed_when: podman_services_changed_network_exists.rc not in [0, 1]
  tags: [update, recreate]

- name: Network | Remove changed dedicated network if still present
  when:
    - not ansible_check_mode
    - podman_services_state in ['update', 'recreate']
    - podman_services_service.network is mapping
    - podman_services_network_quadlet is changed
    - podman_services_service.network.delete_on_stop | default(false) | bool
    - podman_services_changed_network_exists.rc == 0
  ansible.builtin.command:
    argv: [podman, network, rm, "{{ podman_services_service.network.name }}"]
  changed_when: true
  tags: [update, recreate]
