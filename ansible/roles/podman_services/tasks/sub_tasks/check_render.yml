---

- name: Check render | Reset in-memory artifact plan
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    podman_services_check_rendered_artifacts: []
  tags: [deploy, update, recreate, bootstrap]

- name: Check render | Render managed network in memory
  when:
    - podman_services_service.network is mapping
    - not podman_services_service.network.external | bool
  no_log: true
  diff: false
  vars:
    podman_service: "{{ podman_services_service }}"
  ansible.builtin.set_fact:
    podman_services_check_rendered_artifacts: >-
      {{
        podman_services_check_rendered_artifacts
        + [{
            'kind': 'network',
            'path': podman_services_quadlet_dir ~ '/' ~ podman_services_service.network.name ~ '.network',
            'content': lookup('ansible.builtin.template', 'network.network.j2')
          }]
      }}
  tags: [deploy, update, recreate, bootstrap]

- name: Check render | Render managed volumes in memory
  no_log: true
  diff: false
  vars:
    volume: "{{ podman_services_check_volume }}"
    podman_service: "{{ podman_services_service }}"
  ansible.builtin.set_fact:
    podman_services_check_rendered_artifacts: >-
      {{
        podman_services_check_rendered_artifacts
        + [{
            'kind': 'volume',
            'path': podman_services_quadlet_dir ~ '/' ~ podman_services_check_volume.name ~ '.volume',
            'content': lookup('ansible.builtin.template', 'volume.volume.j2')
          }]
      }}
  loop: "{{ podman_services_service.volumes }}"
  loop_control:
    loop_var: podman_services_check_volume
    label: "{{ podman_services_check_volume.name }}"
  tags: [deploy, update, recreate, bootstrap]

- name: Check render | Render protected environment in memory
  when: podman_services_service.env | length > 0
  no_log: true
  diff: false
  vars:
    podman_service: "{{ podman_services_service }}"
  ansible.builtin.set_fact:
    podman_services_check_rendered_artifacts: >-
      {{
        podman_services_check_rendered_artifacts
        + [{
            'kind': 'environment',
            'path': podman_services_quadlet_dir ~ '/' ~ podman_services_service.unit_name ~ '.env',
            'content': lookup('ansible.builtin.template', 'env.env.j2')
          }]
      }}
  tags: [deploy, update, recreate, bootstrap]

- name: Check render | Render container in memory
  no_log: true
  diff: false
  vars:
    podman_service: "{{ podman_services_service }}"
  ansible.builtin.set_fact:
    podman_services_check_rendered_artifacts: >-
      {{
        podman_services_check_rendered_artifacts
        + [{
            'kind': 'container',
            'path': podman_services_quadlet_dir ~ '/' ~ podman_services_service.unit_name ~ '.container',
            'content': lookup('ansible.builtin.template', 'container.container.j2')
          }]
      }}
  tags: [deploy, update, recreate, bootstrap]

- name: Check render | Validate in-memory artifact syntax
  no_log: true
  diff: false
  ansible.builtin.assert:
    that:
      - >-
        podman_services_check_artifact.content
        is match('^# Generated by Ansible\. Do not edit manually\.')
      - >-
        podman_services_check_artifact.kind != 'container'
        or (
          podman_services_check_artifact.content is search('(?m)^\[Unit\]$')
          and podman_services_check_artifact.content is search('(?m)^\[Container\]$')
          and podman_services_check_artifact.content is search('(?m)^\[Service\]$')
          and podman_services_check_artifact.content is search('(?m)^\[Install\]$')
        )
      - >-
        podman_services_check_artifact.kind != 'network'
        or podman_services_check_artifact.content is search('(?m)^\[Network\]$')
      - >-
        podman_services_check_artifact.kind != 'volume'
        or podman_services_check_artifact.content is search('(?m)^\[Volume\]$')
      - >-
        podman_services_check_artifact.kind != 'environment'
        or (
          podman_services_check_artifact.content.splitlines()[1:]
          | reject('match', '^[A-Za-z_][A-Za-z0-9_]*=.*$')
          | list | length == 0
        )
    fail_msg: >-
      In-memory {{ podman_services_check_artifact.kind }} rendering failed
      syntax validation for {{ podman_services_service.name }}.
  loop: "{{ podman_services_check_rendered_artifacts }}"
  loop_control:
    loop_var: podman_services_check_artifact
    label: "{{ podman_services_check_artifact.path }}"
  tags: [deploy, update, recreate, bootstrap]

- name: Check render | Inspect live artifact destinations
  ansible.builtin.stat:
    path: "{{ podman_services_check_artifact.path }}"
  loop: "{{ podman_services_check_rendered_artifacts }}"
  loop_control:
    loop_var: podman_services_check_artifact
    label: "{{ podman_services_check_artifact.path }}"
  register: podman_services_check_artifact_stats
  tags: [deploy, update, recreate, bootstrap]

- name: Check render | Read existing live artifacts
  when: podman_services_check_artifact_stat.stat.exists | bool
  no_log: true
  diff: false
  ansible.builtin.slurp:
    path: "{{ podman_services_check_artifact_stat.stat.path }}"
  loop: "{{ podman_services_check_artifact_stats.results }}"
  loop_control:
    loop_var: podman_services_check_artifact_stat
    label: "{{ podman_services_check_artifact_stat.podman_services_check_artifact.path }}"
  register: podman_services_check_existing_artifacts
  tags: [deploy, update, recreate, bootstrap]

- name: Check render | Report planned artifact change
  vars:
    podman_services_check_existing_artifact: >-
      {{
        podman_services_check_existing_artifacts.results
        | selectattr(
            'podman_services_check_artifact_stat.podman_services_check_artifact.path',
            'equalto',
            podman_services_check_artifact.path
          )
        | first
      }}
  when: >-
    podman_services_check_existing_artifact.content is not defined
    or (
      podman_services_check_existing_artifact.content | b64decode
      != podman_services_check_artifact.content
    )
  ansible.builtin.debug:
    msg: >-
      Rootless Podman {{ podman_services_check_artifact.kind }} artifact
      {{ podman_services_check_artifact.path }} would be created or updated.
  loop: "{{ podman_services_check_rendered_artifacts }}"
  loop_control:
    loop_var: podman_services_check_artifact
    label: "{{ podman_services_check_artifact.path }}"
  changed_when: true
  tags: [deploy, update, recreate, bootstrap]
