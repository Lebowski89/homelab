---

- name: Prep | Create or update Podman-native secrets
  no_log: true
  diff: false
  become: true
  become_user: "{{ podman_services_execution.host_user | default('root') }}"
  environment: "{{ podman_services_runtime_environment }}"
  containers.podman.podman_secret:
    name: "{{ podman_services_secret.name }}"
    data: "{{ podman_services_effective_secret_values[podman_services_secret.var] }}"
    state: present
    force: "{{ (podman_services_secret | podman_secret_policy(podman_services_state)).force }}"
    skip_existing: "{{ (podman_services_secret | podman_secret_policy(podman_services_state)).skip_existing }}"
  loop: "{{ podman_services_service.secrets }}"
  loop_control:
    loop_var: podman_services_secret
    label: "{{ podman_services_secret.name }}"
  register: podman_services_secret_results
  tags: [deploy, update, recreate, bootstrap]
