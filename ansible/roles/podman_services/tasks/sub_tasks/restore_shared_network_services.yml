---

- name: Shared network | Restore previously running services
  ansible.builtin.systemd_service:
    name: "{{ podman_services_namespace_dependent.unit_name }}"
    state: started
  loop: "{{ podman_services_active_namespace_dependents }}"
  loop_control:
    loop_var: podman_services_namespace_dependent
    label: "{{ podman_services_namespace_dependent.unit_name }}"

- name: Shared network | Verify restored services
  ansible.builtin.command:
    argv: [systemctl, is-active, "{{ podman_services_namespace_dependent.unit_name }}"]
  loop: "{{ podman_services_active_namespace_dependents }}"
  loop_control:
    loop_var: podman_services_namespace_dependent
    label: "{{ podman_services_namespace_dependent.unit_name }}"
  changed_when: false

- name: Shared network | Clear saved service state
  ansible.builtin.set_fact:
    podman_services_active_namespace_dependents: []
    podman_services_loaded_namespace_dependents: []
    podman_services_namespace_dependents_quiesced: false
