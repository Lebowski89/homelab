---
- name: Netbox | Validate bootstrap inputs
  ansible.builtin.assert:
    that:
      - netbox_domain is string
      - netbox_domain | trim | length > 0
      - local_ip is defined
      - podman_services_prepare_execution_only | default(false) is boolean
  tags:
    - netbox_bootstrap
    - netbox_deploy
    - netbox_recreate
    - netbox_remove
- name: Netbox | Select explicit bootstrap operation
  ansible.builtin.set_fact:
    netbox_podman_action: >-
      {{ 'remove' if 'netbox_remove' in ansible_run_tags else ('recreate' if 'netbox_recreate' in ansible_run_tags else
      'deploy') }}
  tags:
    - netbox_bootstrap
    - netbox_deploy
    - netbox_recreate
    - netbox_remove
- name: Netbox | Validate required Vault inputs before mutation
  when:
    - not ansible_check_mode
    - netbox_podman_action != "remove"
    - not (podman_services_prepare_execution_only | default(false))
  no_log: true
  diff: false
  ansible.builtin.assert:
    that:
      - netbox_podman_input.value is string
      - netbox_podman_input.value | length > 0
    fail_msg: Required bootstrap Vault inputs must be nonempty strings.
  loop: "{{ [] if (podman_services_prepare_execution_only | default(false)) else (netbox_required_docker_secrets | dict2items) }}"
  loop_control:
    loop_var: netbox_podman_input
  tags:
    - netbox_bootstrap
    - netbox_deploy
    - netbox_recreate
    - netbox_remove
- name: Netbox | Validate all Quadlet definitions before mutation
  ansible.builtin.include_role:
    name: podman_services
    tasks_from: validate_definitions
    apply:
      tags:
        - netbox_bootstrap
        - netbox_deploy
        - netbox_recreate
        - netbox_remove
      no_log: true
      diff: false
  vars:
    podman_services_bootstrap_definitions: '{{ netbox_podman_services }}'
  no_log: true
  tags:
    - netbox_bootstrap
    - netbox_deploy
    - netbox_recreate
    - netbox_remove
- name: Netbox | Enforce every bootstrap requirement before stopping or preparing services
  ansible.builtin.include_role:
    name: service_common
    tasks_from: operational_requirements
    apply:
      tags: [netbox_bootstrap, netbox_deploy, netbox_recreate, netbox_remove]
  vars:
    service_common_service: "{{ {'operational_requirements': netbox_podman_requirement[1]} }}"
    service_common_name: "{{ netbox_podman_requirement[0] }}"
    service_common_action: "{{ netbox_podman_action }}"
    service_common_execution_only: "{{ podman_services_prepare_execution_only | default(false) }}"
  tags: [netbox_bootstrap, netbox_deploy, netbox_recreate, netbox_remove]
  loop: >-
    {{ netbox_podman_services | map(attribute='name')
       | zip(netbox_podman_services | map(attribute='operational_requirements', default={})) | list }}
  loop_control:
    loop_var: netbox_podman_requirement
    label: "{{ netbox_podman_requirement[0] }}"

- name: Netbox | Stop consumers before providers in their persisted managers
  when:
    - not ansible_check_mode
    - netbox_podman_action == "recreate"
  ansible.builtin.include_role:
    name: podman_services
    tasks_from: stop_bootstrap
    apply:
      tags: &id001
        - netbox_recreate
      no_log: true
      diff: false
  vars:
    podman_services_service_cfg: '{{ netbox_podman_definition }}'
    podman_services_role_prefix: '{{ netbox_podman_definition.name }}'
    podman_services_action_remove: true
    podman_services_common_context:
      runtime: podman
      dispatch_host: '{{ inventory_hostname }}'
      controller_host: '{{ inventory_hostname }}'
      lookup_values: {}
      resolved_environment: {}
      secret_declarations: []
  loop: '{{ netbox_podman_services | reverse | list }}'
  loop_control:
    loop_var: netbox_podman_definition
  no_log: true
  tags: *id001
- name: Netbox | Process bootstrap providers and consumers
  ansible.builtin.include_tasks:
    file: service.yml
    apply:
      tags:
        - netbox_bootstrap
        - netbox_deploy
        - netbox_recreate
        - netbox_remove
      no_log: true
      diff: false
  no_log: true
  loop: >-
    {{ netbox_podman_services | reverse | list if netbox_podman_action == 'remove' else netbox_podman_services }}
  loop_control:
    loop_var: netbox_podman_definition
  tags:
    - netbox_bootstrap
    - netbox_deploy
    - netbox_recreate
    - netbox_remove
- name: Netbox | Render Traefik dynamic file
  when:
    - netbox_traefik_enable | bool
    - netbox_podman_action != "remove"
    - not (podman_services_prepare_execution_only | default(false))
  ansible.builtin.template:
    src: traefik_dynamic_file.j2
    dest: '{{ netbox_traefik_dynamic_dir }}/{{ netbox_name }}-dynamic.yml'
    owner: '{{ netbox_traefik_dynamic_owner }}'
    group: '{{ netbox_traefik_dynamic_group }}'
    mode: '0644'
    force: true
  tags:
    - netbox_bootstrap
    - netbox_deploy
    - netbox_recreate
- name: Netbox | Retire Traefik route
  when: netbox_podman_action == "remove"
  ansible.builtin.file:
    path: '{{ netbox_traefik_dynamic_dir }}/{{ netbox_name }}-dynamic.yml'
    state: absent
  tags:
    - netbox_remove
