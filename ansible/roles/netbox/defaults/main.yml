---

# Load the existing encrypted bootstrap vars explicitly; do not depend on NetBox inventory.

################################
# VAULT-BACKED SECRETS
################################

netbox_superuser_email: ""
netbox_superuser_password: ""
netbox_postgres_user: ""
netbox_postgres_pass: ""
netbox_redis_password: ""
# Bootstrap exception: NetBox cannot depend on topology provided by its own inventory.
netbox_domain: ""

netbox_required_docker_secrets:
  netbox_superuser_email_secret: "{{ netbox_superuser_email }}"
  netbox_superuser_password_secret: "{{ netbox_superuser_password }}"
  netbox_db_user_secret: "{{ netbox_postgres_user }}"
  netbox_db_password_secret: "{{ netbox_postgres_pass }}"
  netbox_redis_password_secret: "{{ netbox_redis_password }}"

netbox_docker_secrets: "{{ netbox_required_docker_secrets }}"

################################
# NETBOX
################################

netbox_name: netbox
netbox_stack: netbox
netbox_compose_file: netbox-compose.yml
netbox_compose_path: "{{ netbox_base_path }}/{{ netbox_compose_file }}"

netbox_image: lscr.io/linuxserver/netbox:v4.7.3-ls387
netbox_timezone: "{{ timezone | default('Australia/Melbourne') }}"
netbox_puid: "{{ container_host_puid | default('1000') }}"
netbox_pgid: "{{ container_host_pgid | default('1000') }}"
netbox_base_path: "{{ container_host_appdata_root | default('/opt') }}/netbox"

netbox_frontend_fqdn: "{{ netbox_name }}.{{ services_internal_zone }}"
netbox_frontend_address: "https://{{ netbox_frontend_fqdn }}:{{ services_private_https_port }}"
netbox_port: 18000
netbox_backend_address: "http://{{ local_ip }}:{{ netbox_port }}"

netbox_swarm_node_hostname: "{{ inventory_hostname }}"
netbox_docker_network: overlay

netbox_logging:
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

netbox_restart_policy:
  condition: on-failure
  delay: 10s
  max_attempts: 5
  window: 2m

################################
# REDIS / VALKEY
################################

netbox_redis_name: netbox-redis
netbox_redis_image: docker.io/valkey/valkey:9.2-alpine
netbox_redis_puid: "{{ container_host_puid | default('1000') }}"
netbox_redis_pgid: "{{ container_host_pgid | default('1000') }}"
netbox_redis_path: "{{ netbox_base_path }}/redis"

################################
# POSTGRES
################################

netbox_postgres_name: netbox-postgres
netbox_postgres_image: docker.io/library/postgres:18.6
netbox_postgres_puid: "999"
netbox_postgres_pgid: "999"
netbox_postgres_path: "{{ netbox_base_path }}/postgres"
netbox_postgres_db_name: netbox

################################
# TRAEFIK
################################

netbox_traefik_enable: true
netbox_traefik_dynamic_dir: /opt/traefik/dynamic
netbox_traefik_entrypoint: https_private
netbox_traefik_authelia_enable: false
netbox_traefik_headers_middleware: netbox-headers@file
netbox_traefik_middleware_chain: "{{ netbox_name }}-ui-chain"
netbox_traefik_certresolver: dns-cloudflare
netbox_traefik_tls_options: securetls@file
netbox_traefik_dynamic_owner: "1000"
netbox_traefik_dynamic_group: "1000"

# Explicit Vault bootstrap; these definitions never use dynamic catalog or Infisical lookup.
netbox_podman_services:
  - name: '{{ netbox_postgres_name }}'
    runtime: podman
    image: '{{ netbox_postgres_image }}'
    user: "0:0"
    environment:
      TZ: '{{ netbox_timezone }}'
      POSTGRES_DB: '{{ netbox_postgres_db_name }}'
      POSTGRES_USER_FILE: /run/secrets/postgres_user_secret
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_pass_secret
    secrets:
      - netbox_db_user_secret
      - netbox_db_password_secret
    named_networks:
      netbox-postgres:
        driver: bridge
        external: false
    ports:
      database:
        host_ip: "{{ local_ip }}"
        published: "{{ netbox_postgres_backend_port }}"
        target: 5432
        protocol: tcp
    paths:
      - path: '{{ netbox_postgres_path }}'
        state: directory
        mode: '0700'
    volumes:
      data:
        type: bind
        source: '{{ netbox_postgres_path }}'
        target: /var/lib/postgresql
        read_only: false
    no_new_privileges: false
    operational_requirements:
      acl: [bootstrap]
      ownership_transition: true
    deploy:
      type: container
      hosts: '{{ inventory_hostname }}'
      execution:
        mode: rootless
        host_user: podman-netbox-postgres
        userns:
          mode: keep-id
          uid: "999"
          gid: "999"
    systemd:
      restart: always
      restart_sec: 15s
      timeout_start_sec: 600s
      after:
        - network-online.target
    healthcheck:
      test:
        - CMD-SHELL
        - PGUSER="$(cat /run/secrets/postgres_user_secret)" pg_isready -d "$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    notify_healthy: true
  - name: '{{ netbox_redis_name }}'
    runtime: podman
    image: '{{ netbox_redis_image }}'
    user: "0:0"
    environment:
      TZ: '{{ netbox_timezone }}'
      PUID: '{{ netbox_redis_puid }}'
      PGID: '{{ netbox_redis_pgid }}'
    secrets:
      - netbox_redis_password_secret
    named_networks:
      netbox-redis:
        driver: bridge
        external: false
    ports:
      cache:
        host_ip: "{{ local_ip }}"
        published: "{{ netbox_redis_backend_port }}"
        target: 6379
        protocol: tcp
    paths:
      - path: '{{ netbox_redis_path }}'
        state: directory
        mode: '0755'
    volumes:
      data:
        type: bind
        source: '{{ netbox_redis_path }}'
        target: /data
        read_only: false
    no_new_privileges: false
    operational_requirements:
      acl: [bootstrap]
      ownership_transition: true
    deploy:
      type: container
      hosts: '{{ inventory_hostname }}'
      execution:
        mode: rootless
        host_user: podman-netbox-redis
        userns:
          mode: keep-id
          uid: "0"
          gid: "0"
    systemd:
      restart: always
      restart_sec: 15s
      timeout_start_sec: 600s
      after:
        - network-online.target
    command:
      - sh
      - -c
      - >-
        umask 077; printf 'appendonly yes\nrequirepass "%s"\n' "$(sed 's/[\\"]/\\&/g' /run/secrets/netbox_redis_password_secret)"
        > /tmp/skynet-valkey.conf;
        exec valkey-server /tmp/skynet-valkey.conf
    healthcheck:
      test:
        - CMD-SHELL
        - REDISCLI_AUTH="$(cat /run/secrets/netbox_redis_password_secret)" valkey-cli ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    notify_healthy: true
    tmpfs:
      - /tmp:mode=1777
  - name: '{{ netbox_name }}'
    runtime: podman
    image: '{{ netbox_image }}'
    user: "0:0"
    environment:
      TZ: '{{ netbox_timezone }}'
      PUID: '{{ netbox_puid }}'
      PGID: '{{ netbox_pgid }}'
      FILE__SUPERUSER_EMAIL: /run/secrets/netbox_superuser_email_secret
      FILE__SUPERUSER_PASSWORD: /run/secrets/netbox_superuser_password_secret
      ALLOWED_HOST: '{{ netbox_frontend_fqdn }}'
      CSRF_TRUSTED_ORIGINS: "'{{ netbox_frontend_address }}'"
      DB_NAME: '{{ netbox_postgres_db_name }}'
      FILE__DB_USER: /run/secrets/postgres_user_secret
      FILE__DB_PASSWORD: /run/secrets/postgres_pass_secret
      DB_HOST: "{{ local_ip }}"
      DB_PORT: "{{ netbox_postgres_backend_port }}"
      REDIS_HOST: "{{ local_ip }}"
      REDIS_PORT: "{{ netbox_redis_backend_port }}"
      REDIS_USERNAME: ''
      FILE__REDIS_PASSWORD: /run/secrets/netbox_redis_password_secret
      REDIS_DB_TASK: '0'
      REDIS_DB_CACHE: '1'
    secrets:
      - netbox_superuser_email_secret
      - netbox_superuser_password_secret
      - netbox_db_user_secret
      - netbox_db_password_secret
      - netbox_redis_password_secret
    named_networks:
      netbox:
        driver: bridge
        external: false
    paths:
      - path: '{{ netbox_base_path }}'
        state: directory
        mode: '0755'
      - path: '{{ netbox_base_path }}/config'
        state: directory
        mode: '0755'
    volumes:
      config:
        type: bind
        source: '{{ netbox_base_path }}/config'
        target: /config
        read_only: false
    no_new_privileges: false
    operational_requirements:
      acl: [bootstrap]
      ownership_transition: true
    deploy:
      type: container
      hosts: '{{ inventory_hostname }}'
      execution:
        mode: rootless
        host_user: podman-netbox
        userns:
          mode: keep-id
          uid: "{{ netbox_puid }}"
          gid: "{{ netbox_pgid }}"
    systemd:
      restart: always
      restart_sec: 15s
      timeout_start_sec: 600s
      after:
        - network-online.target
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent -H "Host: {{ netbox_frontend_fqdn }}"
          http://127.0.0.1:8000/login/ > /dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    notify_healthy: true
    ports:
      recovery:
        host_ip: '{{ local_ip }}'
        published: '{{ netbox_port }}'
        target: 8000
netbox_podman_secret_targets:
  netbox_db_user_secret: /run/secrets/postgres_user_secret
  netbox_db_password_secret: /run/secrets/postgres_pass_secret
netbox_postgres_backend_port: 15432
netbox_redis_backend_port: 16380
