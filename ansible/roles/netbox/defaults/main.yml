---

# Secret values should be defined in an encrypted group_vars/all/vault.yml file.

################################
# VAULT-BACKED SECRETS
################################

netbox_superuser_email: ""
netbox_superuser_password: ""
netbox_postgres_user: ""
netbox_postgres_pass: ""
netbox_redis_password: ""
# Bootstrap exception: NetBox cannot depend on topology provided by its own inventory.
netbox_domain: ""

netbox_required_docker_secrets:
  netbox_superuser_email_secret: "{{ netbox_superuser_email }}"
  netbox_superuser_password_secret: "{{ netbox_superuser_password }}"
  netbox_db_user_secret: "{{ netbox_postgres_user }}"
  netbox_db_password_secret: "{{ netbox_postgres_pass }}"
  netbox_redis_password_secret: "{{ netbox_redis_password }}"

netbox_docker_secrets: "{{ netbox_required_docker_secrets }}"

################################
# NETBOX
################################

netbox_name: netbox
netbox_stack: netbox
netbox_compose_file: netbox-compose.yml
netbox_compose_path: "{{ netbox_base_path }}/{{ netbox_compose_file }}"

netbox_image: lscr.io/linuxserver/netbox:v4.6.0-ls351
netbox_timezone: "{{ timezone | default('Australia/Melbourne') }}"
netbox_puid: "{{ container_host_puid | default('1000') }}"
netbox_pgid: "{{ container_host_pgid | default('1000') }}"
netbox_base_path: "{{ container_host_appdata_root | default('/opt') }}/netbox"

netbox_frontend_fqdn: "{{ netbox_name }}.int.{{ netbox_domain }}"
netbox_frontend_address: "https://{{ netbox_frontend_fqdn }}:8443"
netbox_backend_address: "http://{{ netbox_name }}:8000"

netbox_swarm_node_hostname: "{{ inventory_hostname }}"
netbox_docker_network: overlay

netbox_logging:
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

netbox_restart_policy:
  condition: on-failure
  delay: 10s
  max_attempts: 5
  window: 2m

################################
# REDIS / VALKEY
################################

netbox_redis_name: netbox-redis
netbox_redis_image: valkey/valkey:9.1-alpine
netbox_redis_puid: "{{ container_host_puid | default('1000') }}"
netbox_redis_pgid: "{{ container_host_pgid | default('1000') }}"
netbox_redis_path: "{{ netbox_base_path }}/redis"

################################
# POSTGRES
################################

netbox_postgres_name: netbox-postgres
netbox_postgres_image: docker.io/library/postgres:18.6
netbox_postgres_puid: "999"
netbox_postgres_pgid: "999"
netbox_postgres_path: "{{ netbox_base_path }}/postgres"
netbox_postgres_db_name: netbox

################################
# TRAEFIK
################################

netbox_traefik_enable: true
netbox_traefik_dynamic_dir: /opt/traefik/dynamic
netbox_traefik_entrypoint: https_private
netbox_traefik_authelia_enable: false
netbox_traefik_crowdsec_enable: false
netbox_traefik_headers_middleware: netbox-headers@file
netbox_traefik_middleware_chain: "{{ netbox_name }}-ui-chain"
netbox_traefik_certresolver: dns-cloudflare
netbox_traefik_tls_options: securetls@file
netbox_traefik_dynamic_owner: "1000"
netbox_traefik_dynamic_group: "1000"
