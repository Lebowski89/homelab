---

- name: Workstation OpenTofu | Ensure apt prerequisites are installed
  ansible.builtin.apt:
    name: "{{ workstation_opentofu_prereq_packages }}"
    state: present
    update_cache: true

- name: Workstation OpenTofu | Ensure OpenTofu keyring directory exists
  ansible.builtin.file:
    path: "{{ workstation_opentofu_keyring_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Workstation OpenTofu | Download OpenTofu package signing key
  ansible.builtin.get_url:
    url: https://get.opentofu.org/opentofu.gpg
    dest: "{{ workstation_opentofu_keyring_file }}"
    owner: root
    group: root
    mode: "0644"

- name: Workstation OpenTofu | Download OpenTofu repository key
  ansible.builtin.get_url:
    url: https://packages.opentofu.org/opentofu/tofu/gpgkey
    dest: "{{ workstation_opentofu_keyring_file_repo }}.asc"
    owner: root
    group: root
    mode: "0644"
  register: workstation_opentofu_repository_key

- name: Workstation OpenTofu | Check dearmored repository key
  ansible.builtin.stat:
    path: "{{ workstation_opentofu_keyring_file_repo }}"
  register: workstation_opentofu_binary_key

- name: Workstation OpenTofu | Dearmor OpenTofu repository key
  when: workstation_opentofu_repository_key.changed or not workstation_opentofu_binary_key.stat.exists
  ansible.builtin.command:
    argv:
      - gpg
      - --batch
      - --yes
      - --dearmor
      - -o
      - "{{ workstation_opentofu_keyring_file_repo }}"
      - "{{ workstation_opentofu_keyring_file_repo }}.asc"
  changed_when: true

- name: Workstation OpenTofu | Keep repository key readable by APT
  ansible.builtin.file:
    path: "{{ workstation_opentofu_keyring_file_repo }}"
    owner: root
    group: root
    mode: "0644"

- name: Workstation OpenTofu | Add OpenTofu apt repository
  ansible.builtin.deb822_repository:
    name: "{{ workstation_opentofu_repo_filename }}"
    types: [deb]
    uris: "{{ workstation_opentofu_source_url }}"
    suites: "{{ workstation_opentofu_source_suite }}"
    components: [main]
    signed_by: "{{ workstation_opentofu_keyring_file }} {{ workstation_opentofu_keyring_file_repo }}"
    mode: "0644"
    state: present
  register: workstation_opentofu_repository

- name: Workstation OpenTofu | Remove the previous one-line repository entry
  ansible.builtin.lineinfile:
    path: "/etc/apt/sources.list.d/{{ workstation_opentofu_repo_filename }}.list"
    line: >-
      deb [signed-by={{ workstation_opentofu_keyring_file }},{{ workstation_opentofu_keyring_file_repo }}]
      {{ workstation_opentofu_source_url }}
      {{ workstation_opentofu_source_suite }} main
    state: absent
  register: workstation_opentofu_legacy_repository

- name: Workstation OpenTofu | Refresh APT after repository changes
  when: workstation_opentofu_repository.changed or workstation_opentofu_legacy_repository.changed
  ansible.builtin.apt:
    update_cache: true

- name: Workstation OpenTofu | Install OpenTofu packages
  ansible.builtin.apt:
    name: "{{ workstation_opentofu_packages }}"
    state: present
