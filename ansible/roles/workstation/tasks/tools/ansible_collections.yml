---

- name: Workstation Ansible | Assert Ansible collections requirements file exists
  ansible.builtin.stat:
    path: "{{ workstation_ansible_path }}/requirements.yml"
  register: workstation_ansible_requirements_yml

- name: Workstation Ansible | Fail if Ansible collections requirements file is missing
  ansible.builtin.fail:
    msg: "Missing requirements.yml at {{ workstation_ansible_path }}/requirements.yml"
  when: not workstation_ansible_requirements_yml.stat.exists

- name: Workstation Ansible | Install Ansible collections from requirements.yml
  ansible.builtin.command:
    argv:
      - "{{ workstation_ansible_venv_path }}/bin/ansible-galaxy"
      - collection
      - install
      - -r
      - "{{ workstation_ansible_path }}/requirements.yml"
      - -p
      - "{{ workstation_ansible_collections_path }}"
  register: workstation_collections_result
  changed_when: "'was installed successfully' in workstation_collections_result.stdout"

- name: Workstation Ansible | Locate existing collections after an unchanged installation
  when: not workstation_collections_result.changed
  ansible.builtin.command:
    argv:
      - "{{ workstation_ansible_venv_path }}/bin/ansible-galaxy"
      - collection
      - list
      - -p
      - "{{ workstation_ansible_collections_path }}"
  register: workstation_collections_installed
  changed_when: false

- name: Workstation Ansible | Explain why collection installation was unchanged
  when: not workstation_collections_result.changed
  ansible.builtin.debug:
    msg: >-
      {{ (workstation_collections_result.stdout_lines | default([]))
         + (workstation_collections_installed.stdout_lines | default([])) }}
