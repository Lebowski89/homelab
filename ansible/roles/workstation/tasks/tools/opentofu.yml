---
- name: Workstation OpenTofu | Validate installation platform
  ansible.builtin.import_tasks: ../platform.yml

- name: Workstation OpenTofu | Report check-mode installation plan
  when: ansible_check_mode
  ansible.builtin.debug:
    msg: >-
      Would install {{ workstation_opentofu_packages }} using the verified OpenTofu
      {{ workstation_platform }} repository; no infrastructure operations.

- name: Workstation OpenTofu | Install platform package and repository
  when: not ansible_check_mode
  ansible.builtin.include_tasks: "{{ workstation_platform }}/opentofu.yml"
