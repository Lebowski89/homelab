---

- name: Workstation Desktop | Install desktop packages
  ansible.builtin.include_tasks: packages.yml
  vars:
    workstation_package_selection: "{{ workstation_desktop_packages }}"

# Omitting mode preserves permissions on existing private directories.
- name: Workstation Desktop | Ensure XDG user directories exist # noqa risky-file-permissions
  become: true
  become_user: "{{ workstation_user }}"
  ansible.builtin.file:
    path: "{{ _workstation_xdg_directory }}"
    state: directory
  loop: "{{ workstation_xdg_directories }}"
  loop_control:
    loop_var: _workstation_xdg_directory
