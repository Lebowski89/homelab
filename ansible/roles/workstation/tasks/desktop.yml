---

- name: Workstation Desktop | Install desktop packages
  when: workstation_desktop_packages | length > 0
  become: true
  ansible.builtin.apt:
    name: "{{ workstation_desktop_packages }}"
    state: present
    update_cache: "{{ workstation_apt_update_cache }}"
    cache_valid_time: 3600

- name: Workstation Desktop | Ensure XDG user directories exist
  become: true
  become_user: "{{ workstation_user }}"
  ansible.builtin.file:
    path: "{{ _workstation_xdg_directory }}"
    state: directory
    mode: "0755"
  loop: "{{ workstation_xdg_directories }}"
  loop_control:
    loop_var: _workstation_xdg_directory
