---
- name: Workstation credentials | Resolve the managed workstation account
  become: false
  ansible.builtin.getent:
    database: passwd
    key: "{{ workstation_user }}"
  register: workstation_credentials_account

- name: Workstation credentials | Require an existing non-root account
  ansible.builtin.assert:
    that:
      - workstation_user is string
      - workstation_user | length > 0
      - workstation_credentials_account.ansible_facts.getent_passwd[workstation_user][1] | int > 0
      - workstation_credentials_account.ansible_facts.getent_passwd[workstation_user][4] is match('^/')

- name: Workstation credentials | Resolve the managed user's home
  ansible.builtin.set_fact:
    workstation_user_home: "{{ workstation_credentials_account.ansible_facts.getent_passwd[workstation_user][4] }}"

- name: Workstation credentials | Inspect destinations and create only missing password files
  block:
    - name: Workstation credentials | Privately confirm missing credentials
      become: true
      become_user: "{{ workstation_user }}"
      workstation_credentials:
        directory: "{{ workstation_secrets_path }}"
        vault_file: "{{ workstation_vault_pass_file }}"
        become_file: "{{ workstation_become_pass_file }}"
        owner: "{{ workstation_user }}"
      no_log: true
      diff: false
      register: workstation_credentials_result
  rescue:
    # The action returns only fixed, value-free diagnostics, never prompted input.
    - name: Workstation credentials | Explain how to complete setup
      ansible.builtin.fail:
        msg: >-
          {{ workstation_credentials_result.msg |
             default('Credential setup did not complete. Run workstation_credentials from an interactive terminal.') }}

- name: Workstation credentials | Report password-file setup plan
  ansible.builtin.debug:
    msg:
      - "Missing password files: {{ workstation_credentials_result.missing }}"
      - "Vault password destination: {{ workstation_vault_pass_file }}"
      - "Managed-host sudo password destination: {{ workstation_become_pass_file }}"
      - "Created password files: {{ workstation_credentials_result.created | default([]) }}"
      - "Existing regular files are preserved. Check mode never prompts or writes credentials."
