---
- name: Workstation VS Code | Validate installation platform
  ansible.builtin.import_tasks: platform.yml

- name: Workstation VS Code | Report check-mode installation plan
  when: ansible_check_mode
  ansible.builtin.debug:
    msg: >-
      Would install Microsoft VS Code using {{ workstation_platform }} packages
      and user extensions {{ workstation_vscode_extensions }}.

- name: Workstation VS Code | Install platform package and repository
  when: not ansible_check_mode
  ansible.builtin.include_tasks: "{{ workstation_platform }}/vscode.yml"

- name: Workstation VS Code | Check for Visual Studio Code command
  ansible.builtin.stat:
    path: /usr/bin/code
  register: workstation_vscode_command

- name: Workstation VS Code | List installed extensions
  when:
    - not ansible_check_mode
    - workstation_vscode_command.stat.exists
  become: true
  become_user: "{{ workstation_user }}"
  ansible.builtin.command:
    argv:
      - code
      - --list-extensions
  register: workstation_vscode_installed_extensions
  changed_when: false
  check_mode: false
  environment:
    HOME: "{{ workstation_user_home }}"

- name: Workstation VS Code | Install configured extensions
  when:
    - not ansible_check_mode
    - workstation_vscode_command.stat.exists
    - >-
      _workstation_vscode_extension | lower not in
      (workstation_vscode_installed_extensions.stdout_lines | default([]) | map('lower') | list)
  become: true
  become_user: "{{ workstation_user }}"
  ansible.builtin.command:
    argv:
      - code
      - --install-extension
      - "{{ _workstation_vscode_extension }}"
  loop: "{{ workstation_vscode_extensions }}"
  loop_control:
    loop_var: _workstation_vscode_extension
  changed_when: true
  environment:
    HOME: "{{ workstation_user_home }}"
