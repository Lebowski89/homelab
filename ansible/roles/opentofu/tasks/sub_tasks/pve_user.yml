---

- name: Assert required OpenTofu Proxmox user vars are defined
  ansible.builtin.assert:
    that:
      - opentofu_primary_manager is defined
      - opentofu_pve_host is defined
      - hostvars[opentofu_pve_host].opentofu_api_user is defined
      - hostvars[opentofu_pve_host].opentofu_api_token_name is defined
      - hostvars[opentofu_pve_host].proxmox_api_bootstrap_user is defined
      - hostvars[opentofu_pve_host].proxmox_api_bootstrap_password is defined
    fail_msg: "Required OpenTofu Proxmox user vars are missing."

- name: Manage Proxmox OpenTofu API objects
  delegate_to: "{{ opentofu_primary_manager }}"
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ hostvars[opentofu_pve_host].ansible_host }}"
      api_user: "{{ hostvars[opentofu_pve_host].proxmox_api_bootstrap_user }}"
      api_password: "{{ hostvars[opentofu_pve_host].proxmox_api_bootstrap_password }}"
      validate_certs: false
  block:
    - name: Ensure OpenTofu Proxmox role exists
      community.proxmox.proxmox_role:
        roleid: "{{ opentofu_api_role }}"
        privs:
          - Datastore.Allocate
          - Datastore.AllocateSpace
          - Datastore.AllocateTemplate
          - Datastore.Audit
          - Mapping.Audit
          - Mapping.Modify
          - Pool.Allocate
          - Pool.Audit
          - Sys.Audit
          - Sys.Console
          - Sys.Modify
          - VM.Allocate
          - VM.Audit
          - VM.Clone
          - VM.Config.CDROM
          - VM.Config.Cloudinit
          - VM.Config.CPU
          - VM.Config.Disk
          - VM.Config.HWType
          - VM.Config.Memory
          - VM.Config.Network
          - VM.Config.Options
          - VM.GuestAgent.Audit
          - VM.GuestAgent.Unrestricted
          - VM.Migrate
          - VM.PowerMgmt
          - SDN.Use
        state: present

    - name: Ensure OpenTofu Proxmox user exists
      community.proxmox.proxmox_user:
        userid: "{{ hostvars[opentofu_pve_host].opentofu_api_user }}"
        state: present
        enable: true
        comment: "OpenTofu automation user"

    - name: Ensure OpenTofu role is assigned at root path
      community.proxmox.proxmox_access_acl:
        path: /
        roleid: "{{ opentofu_api_role }}"
        type: user
        ugid: "{{ hostvars[opentofu_pve_host].opentofu_api_user }}"
        propagate: true
        state: present

  rescue:
    - name: Fail Proxmox OpenTofu API setup with context
      ansible.builtin.fail:
        msg: >-
          Failed while managing Proxmox OpenTofu API objects. Partial state may
          exist in Proxmox, such as the role, user, or ACL assignment. Review the
          failed task above and re-run after fixing the issue.

- name: List existing OpenTofu API tokens
  ansible.builtin.command:
    cmd: >-
      pveum user token list
      {{ hostvars[opentofu_pve_host].opentofu_api_user }}
      --output-format json
  register: opentofu_pve_token_list
  changed_when: false
  failed_when: false
  check_mode: false
  become: true

- name: Determine whether OpenTofu API token needs to be created
  ansible.builtin.set_fact:
    opentofu_pve_token_missing: >-
      {{
        (
          opentofu_pve_token_list.stdout
          | default('[]')
          | from_json
          | selectattr('tokenid', 'equalto', hostvars[opentofu_pve_host].opentofu_api_token_name)
          | list
          | length
        ) == 0
      }}
  when:
    - opentofu_pve_token_list.rc == 0
    - opentofu_pve_token_list.stdout | default("") | trim | length > 0

- name: Initialize OpenTofu API token handoff state
  when:
    - opentofu_pve_token_missing | default(false)
    - not ansible_check_mode
  ansible.builtin.set_fact:
    opentofu_pve_token_handoff_written: false
  changed_when: false

- name: Create and hand off OpenTofu API token transactionally
  when:
    - opentofu_pve_token_missing | default(false)
    - not ansible_check_mode
  block:
    - name: Create root-only temporary token handoff file
      no_log: true
      diff: false
      ansible.builtin.tempfile:
        state: file
        path: /root
        prefix: opentofu-api-token-
      register: opentofu_pve_token_handoff
      become: true

    - name: Create OpenTofu API token if missing
      no_log: true
      diff: false
      ansible.builtin.command:
        cmd: >-
          pveum user token add
          {{ hostvars[opentofu_pve_host].opentofu_api_user }}
          {{ hostvars[opentofu_pve_host].opentofu_api_token_name }}
          --privsep=0
          --output-format json
      register: opentofu_pve_token_create
      become: true
      changed_when: opentofu_pve_token_create.rc == 0

    - name: Write new API token secret to handoff file
      no_log: true
      diff: false
      ansible.builtin.copy:
        dest: "{{ opentofu_pve_token_handoff.path }}"
        content: "{{ (opentofu_pve_token_create.stdout | from_json).value }}\n"
        owner: root
        group: root
        mode: "0600"
      become: true

    - name: Record that the API token secret is recoverable
      ansible.builtin.set_fact:
        opentofu_pve_token_handoff_written: true
      changed_when: false

    - name: Pause so operator can copy token
      ansible.builtin.pause:
        prompt: >-
          The new OpenTofu API token for
          {{ hostvars[opentofu_pve_host].opentofu_api_user }} is stored at
          {{ opentofu_pve_token_handoff.path }} on {{ inventory_hostname }}.
          Retrieve it as root, save it securely, then press Enter to remove the temporary file.

    - name: Remove temporary token handoff file after acknowledgment
      ansible.builtin.file:
        path: "{{ opentofu_pve_token_handoff.path }}"
        state: absent
      become: true

  rescue:
    - name: Roll back API token when secret handoff failed
      when:
        - (opentofu_pve_token_create | default({})).get('rc', 1) == 0
        - not (opentofu_pve_token_handoff_written | default(false))
      no_log: true
      diff: false
      ansible.builtin.command:
        argv:
          - pveum
          - user
          - token
          - delete
          - "{{ hostvars[opentofu_pve_host].opentofu_api_user }}"
          - "{{ hostvars[opentofu_pve_host].opentofu_api_token_name }}"
      register: opentofu_pve_token_rollback
      become: true
      changed_when: opentofu_pve_token_rollback.rc == 0
      failed_when: false

    - name: Remove incomplete token handoff file when recovery is unnecessary
      when:
        - opentofu_pve_token_handoff.path is defined
        - not (opentofu_pve_token_handoff_written | default(false))
        - >-
          not ((opentofu_pve_token_create | default({})).get('rc', 1) == 0)
          or (opentofu_pve_token_rollback | default({})).get('rc', 1) == 0
      no_log: true
      diff: false
      ansible.builtin.file:
        path: "{{ opentofu_pve_token_handoff.path }}"
        state: absent
      become: true

    - name: Report API token handoff failure safely
      ansible.builtin.fail:
        msg: >-
          {% if opentofu_pve_token_handoff_written | default(false) %}
          API token handoff was interrupted after the secret was written. The valid
          token was preserved, and any remaining root-only recovery file is at
          {{ opentofu_pve_token_handoff.path }}.
          {% elif (opentofu_pve_token_create | default({})).get('rc', 1) == 0
             and (opentofu_pve_token_rollback | default({})).get('rc', 1) == 0 %}
          API token handoff failed before the secret became recoverable. The token
          created by this run was removed and the incomplete handoff file was cleaned up.
          {% elif (opentofu_pve_token_create | default({})).get('rc', 1) == 0 %}
          API token handoff failed before the secret became recoverable, and token
          rollback also failed. The token may still exist; any root-only handoff file
          was preserved for recovery. Remove the named token manually before retrying.
          {% else %}
          API token handoff failed before token creation completed. Any empty temporary
          handoff file was cleaned up.
          {% endif %}
