---

- name: Assert required OpenTofu Proxmox user vars are defined
  ansible.builtin.assert:
    that:
      - opentofu_primary_manager is defined
      - opentofu_pve_host is defined
      - hostvars[opentofu_pve_host].opentofu_api_user is defined
      - hostvars[opentofu_pve_host].opentofu_api_token_name is defined
      - hostvars[opentofu_pve_host].proxmox_api_bootstrap_user is defined
      - hostvars[opentofu_pve_host].proxmox_api_bootstrap_password is defined
    fail_msg: "Required OpenTofu Proxmox user vars are missing."

- name: Manage Proxmox OpenTofu API objects
  delegate_to: "{{ opentofu_primary_manager }}"
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ hostvars[opentofu_pve_host].ansible_host }}"
      api_user: "{{ hostvars[opentofu_pve_host].proxmox_api_bootstrap_user }}"
      api_password: "{{ hostvars[opentofu_pve_host].proxmox_api_bootstrap_password }}"
      validate_certs: false
  block:
    - name: Ensure OpenTofu Proxmox role exists
      community.proxmox.proxmox_role:
        roleid: "{{ opentofu_api_role }}"
        privs:
          - Datastore.Allocate
          - Datastore.AllocateSpace
          - Datastore.AllocateTemplate
          - Datastore.Audit
          - Mapping.Audit
          - Mapping.Modify
          - Pool.Allocate
          - Pool.Audit
          - Sys.Audit
          - Sys.Console
          - Sys.Modify
          - VM.Allocate
          - VM.Audit
          - VM.Clone
          - VM.Config.CDROM
          - VM.Config.Cloudinit
          - VM.Config.CPU
          - VM.Config.Disk
          - VM.Config.HWType
          - VM.Config.Memory
          - VM.Config.Network
          - VM.Config.Options
          - VM.GuestAgent.Audit
          - VM.GuestAgent.Unrestricted
          - VM.Migrate
          - VM.PowerMgmt
          - SDN.Use
        state: present

    - name: Ensure OpenTofu Proxmox user exists
      community.proxmox.proxmox_user:
        userid: "{{ hostvars[opentofu_pve_host].opentofu_api_user }}"
        state: present
        enable: true
        comment: "OpenTofu automation user"

    - name: Ensure OpenTofu role is assigned at root path
      community.proxmox.proxmox_access_acl:
        path: /
        roleid: "{{ opentofu_api_role }}"
        type: user
        ugid: "{{ hostvars[opentofu_pve_host].opentofu_api_user }}"
        propagate: true
        state: present

- name: List existing OpenTofu API tokens
  ansible.builtin.command:
    cmd: >-
      pveum user token list
      {{ hostvars[opentofu_pve_host].opentofu_api_user }}
      --output-format json
  register: opentofu_pve_token_list
  changed_when: false
  failed_when: false
  check_mode: false
  become: true

- name: Determine whether OpenTofu API token needs to be created
  ansible.builtin.set_fact:
    opentofu_pve_token_missing: >-
      {{
        (
          opentofu_pve_token_list.stdout
          | default('[]')
          | from_json
          | selectattr('tokenid', 'equalto', hostvars[opentofu_pve_host].opentofu_api_token_name)
          | list
          | length
        ) == 0
      }}
  when:
    - opentofu_pve_token_list.rc == 0
    - opentofu_pve_token_list.stdout | default("") | trim | length > 0

- name: Create OpenTofu API token if missing
  when:
    - opentofu_pve_token_missing | default(false)
    - not ansible_check_mode
  ansible.builtin.command:
    cmd: >-
      pveum user token add
      {{ hostvars[opentofu_pve_host].opentofu_api_user }}
      {{ hostvars[opentofu_pve_host].opentofu_api_token_name }}
      --privsep=0
      --output-format json
  register: opentofu_pve_token_create
  become: true
  changed_when: opentofu_pve_token_create.rc == 0

- name: Show OpenTofu API token secret once when created
  when:
    - opentofu_pve_token_missing | default(false)
    - not ansible_check_mode
  ansible.builtin.debug:
    msg: >-
      Save this token secret now:
      {{ (opentofu_pve_token_create.stdout | from_json).value }}

- name: Pause so operator can copy token
  when:
    - opentofu_pve_token_missing | default(false)
    - not ansible_check_mode
  ansible.builtin.pause:
    prompt: "Copy the OpenTofu API token now, then press Enter to continue."
