---

- name: Alloy native | Preview repository and package installation
  when: ansible_check_mode
  ansible.builtin.debug:
    msg: >-
      Would configure the Grafana {{ 'APT' if ansible_facts.pkg_mgr == 'apt' else 'RPM' }} repository
      and ensure {{ alloy_native_packages }} with state
      {{ 'latest' if native_services_action == 'update' and native_services_entry.config.native.update_policy == 'latest' else 'present' }}.
      Repository, key and package changes are deferred in check mode.

- name: Alloy native | Configure APT installation
  when:
    - not ansible_check_mode
    - ansible_facts.pkg_mgr == 'apt'
  ansible.builtin.import_tasks: alloy/apt.yml

- name: Alloy native | Configure RPM installation
  when:
    - not ansible_check_mode
    - ansible_facts.pkg_mgr in ['dnf', 'dnf5']
  ansible.builtin.import_tasks: alloy/rpm.yml

- name: Alloy native | Read local system accounts
  ansible.builtin.getent:
    database: passwd

- name: Alloy native | Read local system groups
  ansible.builtin.getent:
    database: group

- name: Alloy native | Resolve package service account availability
  ansible.builtin.set_fact:
    alloy_native_service_account_available: >-
      {{
        alloy_native_user in (ansible_facts.getent_passwd | default({}))
        and alloy_native_group in (ansible_facts.getent_group | default({}))
      }}

- name: Alloy native | Require package service account after installation
  when: not ansible_check_mode
  ansible.builtin.assert:
    that:
      - alloy_native_service_account_available
    fail_msg: >-
      The Alloy package did not create the expected {{ alloy_native_user }} user
      and {{ alloy_native_group }} group.

- name: Alloy native | Report account-dependent work deferred in check mode
  when:
    - ansible_check_mode
    - not alloy_native_service_account_available
  ansible.builtin.debug:
    msg: >-
      Alloy account-dependent configuration and service validation are deferred
      because the package-created {{ alloy_native_user }} user or
      {{ alloy_native_group }} group does not exist yet.
  changed_when: false

- name: Alloy native | Resolve available journal reader groups
  ansible.builtin.set_fact:
    alloy_native_journal_groups_effective: >-
      {{ alloy_native_journal_groups | select("in", ansible_facts.getent_group) | list }}

- name: Alloy native | Grant journal access to package service account
  when:
    - alloy_native_service_account_available
    - alloy_native_journal_groups_effective | length > 0
  ansible.builtin.user:
    name: "{{ alloy_native_user }}"
    groups: "{{ alloy_native_journal_groups_effective }}"
    append: true
  notify: Restart Alloy

- name: Alloy native | Ensure configuration directory exists
  when: alloy_native_service_account_available
  ansible.builtin.file:
    path: "{{ alloy_native_config_dir }}"
    state: directory
    owner: root
    group: "{{ alloy_native_group }}"
    mode: "0750"

- name: Alloy native | Render collector configuration
  when: alloy_native_service_account_available
  ansible.builtin.template:
    src: alloy/config.alloy.j2
    dest: "{{ alloy_native_config_path }}"
    owner: root
    group: "{{ alloy_native_group }}"
    mode: "0640"
  notify: Restart Alloy

- name: Native services | Record adopted alloy configuration
  when:
    - not ansible_check_mode
    - alloy_native_service_account_available
  ansible.builtin.include_tasks: record_files.yml
  vars:
    native_services_adopted_files:
      - "{{ alloy_native_config_path }}"

- name: Alloy native | Enable and start service
  when:
    - not ansible_check_mode
    - alloy_native_service_account_available
  ansible.builtin.systemd_service:
    name: "{{ alloy_native_service_name }}"
    enabled: true
    state: started
