---

- name: Native DNS | Detect Atomic or OSTree deployment
  ansible.builtin.stat:
    path: /run/ostree-booted
  register: native_services_dns_ostree

- name: Native DNS | Validate supported platform before changes
  ansible.builtin.assert:
    that:
      - ansible_facts.system | default('') == 'Linux'
      - ansible_facts.service_mgr | default('') == 'systemd'
      - not native_services_dns_ostree.stat.exists
      - >-
        (ansible_facts.os_family | default('') == 'Debian' and ansible_facts.pkg_mgr | default('') == 'apt') or
        (ansible_facts.os_family | default('') == 'RedHat' and ansible_facts.pkg_mgr | default('') in ['dnf', 'dnf5']
         and ((ansible_facts.distribution | default('') == 'Fedora'
               and ansible_facts.distribution_major_version | default('') in ['43', '44', '45'])
              or (ansible_facts.distribution | default('') == 'Rocky'
                  and ansible_facts.distribution_major_version | default('') in ['9', '10'])))
    fail_msg: >-
      Native DNS services require conventional Linux with systemd: the existing Debian-family APT path,
      Fedora 43-45 or Rocky 9/10 with DNF4/DNF5. Atomic/OSTree systems and other RPM derivatives are unsupported.

- name: Native DNS | Validate RPM Technitium runtime availability
  when:
    - native_services_application == 'technitium'
    - ansible_facts.pkg_mgr in ['dnf', 'dnf5']
  ansible.builtin.assert:
    that:
      - ansible_facts.architecture | default('') in ['x86_64', 'aarch64']
      - >-
        ansible_facts.distribution != 'Rocky' or
        (ansible_facts.distribution_major_version == '9' and ansible_facts.distribution_version is version('9.7', '>=')) or
        (ansible_facts.distribution_major_version == '10' and ansible_facts.distribution_version is version('10.1', '>='))
    fail_msg: Native RPM Technitium requires AMD64/ARM64 and distribution ASP.NET Core 10 packages (Rocky 9.7+/10.1+ or Fedora 43-45).
