---

- name: Keepalived | Configure native service
  when: native_services_keepalived_host_cfg.mode | default('native') == 'native'
  block:
    - name: Keepalived native | Assert supported OS
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family | default('') == 'Debian'
        fail_msg: "Native keepalived backend currently supports Debian/Ubuntu hosts only."

    - name: Keepalived native | Install packages
      ansible.builtin.apt:
        name:
          - keepalived
          - dnsutils
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Keepalived native | Apply declared update policy to Keepalived only # noqa: package-latest -- explicit operator policy
      when:
        - native_services_action == 'update'
        - native_services_entry.config.native.update_policy == 'latest'
      ansible.builtin.apt:
        name: keepalived
        state: latest

    - name: Keepalived native | Ensure config directory exists
      ansible.builtin.file:
        path: /etc/keepalived
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Keepalived native | Install DNS health check script
      ansible.builtin.template:
        src: keepalived/check-dns.sh.j2
        dest: "{{ keepalived_check_script_path }}"
        owner: root
        group: root
        mode: "0755"
      notify: Restart keepalived

    - name: Native services | Record adopted keepalived configuration
      when:
        - not ansible_check_mode
      ansible.builtin.include_tasks: record_files.yml
      vars:
        native_services_adopted_files:
          - "{{ keepalived_check_script_path }}"

    - name: Keepalived native | Render keepalived config
      ansible.builtin.template:
        src: keepalived/keepalived.conf.j2
        dest: "{{ keepalived_config_path }}"
        owner: root
        group: root
        mode: "0644"
      notify: Restart keepalived

    - name: Native services | Record adopted keepalived configuration
      when:
        - not ansible_check_mode
      ansible.builtin.include_tasks: record_files.yml
      vars:
        native_services_adopted_files:
          - "{{ keepalived_config_path }}"

    - name: Keepalived native | Enable and start keepalived
      when: not ansible_check_mode
      ansible.builtin.systemd_service:
        name: keepalived
        enabled: true
        state: started
