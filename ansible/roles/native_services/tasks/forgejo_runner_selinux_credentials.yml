---
- name: Forgejo Runner | Inspect only the named private credential files
  ansible.builtin.stat:
    path: '{{ native_services_runner_credential_path }}'
    follow: false
  loop: [/etc/forgejo-runner/private/node-key, /etc/forgejo-runner/private/provisioning.json,
         /etc/forgejo-runner/private/guest-key, /etc/forgejo-runner/private/guest-key.pub,
         /etc/forgejo-runner/private/registration.json, /etc/forgejo-runner/config.yml]
  loop_control:
    loop_var: native_services_runner_credential_path
  register: native_services_runner_credential_stats

- name: Forgejo Runner | Reject linked or replaced credential paths before relabeling
  when: native_services_runner_credential_stat.stat.exists
  ansible.builtin.assert:
    that:
      - native_services_runner_credential_stat.stat.isreg
      - not native_services_runner_credential_stat.stat.islnk
  loop: '{{ native_services_runner_credential_stats.results }}'
  loop_control:
    loop_var: native_services_runner_credential_stat

- name: Forgejo Runner | Reconcile exact credential labels without traversing their directory
  when:
    - not ansible_check_mode
    - native_services_runner_credential_stats.results | selectattr('stat.exists') | list | length > 0
  ansible.builtin.command:
    argv: >-
      {{ ['restorecon', '-v'] + (native_services_runner_credential_stats.results | selectattr('stat.exists')
         | map(attribute='native_services_runner_credential_path') | list) }}
  register: native_services_runner_credentials_relabel
  changed_when: native_services_runner_credentials_relabel.stdout | length > 0
