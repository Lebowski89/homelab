---

- name: Native services | Validate selected lifecycle
  ansible.builtin.assert:
    that:
      - native_services_entry.runtime == 'native'
      - native_services_action in ['deploy', 'update', 'recreate', 'remove']
    fail_msg: Native services support deploy, update, recreate and remove; check uses Ansible check mode.

- name: Native services | Resolve current application contract
  ansible.builtin.set_fact:
    native_services_application: "{{ native_services_entry.config.native.application }}"
    native_services_config: "{{ native_services_entry.config.native | native_services_normalize }}"
    native_services_identity: "{{ native_services_entry.name }}{{ ':' ~ native_services_entry.target if native_services_entry.target is defined else '' }}"

- name: Native services | Validate Alloy platform before changing the host
  when: native_services_application == 'alloy'
  ansible.builtin.include_tasks: alloy_validate.yml

- name: Native services | Validate native DNS platform before changing the host
  when: native_services_application in ['keepalived', 'technitium']
  ansible.builtin.include_tasks:
    file: dns_platform.yml
    apply:
      tags: "{{ ansible_run_tags }}"
  tags: "{{ ansible_run_tags }}"

- name: Native services | Inspect Technitium resolver requirements before ownership changes
  when: native_services_application == 'technitium'
  ansible.builtin.include_tasks:
    file: technitium_validate.yml
    apply:
      tags: "{{ ansible_run_tags }}"
  tags: "{{ ansible_run_tags }}"

- name: Native services | Classify firewall requirements before changing the host
  service_firewall_plan:
    entry: "{{ native_services_entry }}"
    action: "{{ native_services_action }}"

- name: Native services | Validate common operational requirements
  ansible.builtin.include_role:
    name: service_common
    tasks_from: operational_requirements
    apply:
      tags: "{{ ansible_run_tags }}"
  vars:
    service_common_service: "{{ native_services_entry.config }}"
    service_common_name: "{{ native_services_identity }}"
    service_common_action: "{{ native_services_action }}"
    service_common_execution_only: false

- name: Native services | Resolve owned installation paths
  ansible.builtin.set_fact:
    native_services_unit: >-
      {{ {'alloy': native_services_config.service_name | default(''),
          'node_exporter': 'node_exporter', 'keepalived': 'keepalived', 'forgejo_runner': 'forgejo-runner',
          'technitium': native_services_config.service_name | default('')}[native_services_application]
         | regex_replace('[.]service$', '') }}
    native_services_files: >-
      {{ {'alloy': [native_services_config.config_path | default('')],
          'node_exporter': ['/etc/systemd/system/node_exporter.service'],
          'forgejo_runner': ['/etc/systemd/system/forgejo-runner.service', '/etc/systemd/system/forgejo-runner-agent.service', '/etc/forgejo-runner/config.yml'],
          'keepalived': [native_services_config.config_path | default(''), native_services_config.check_script_path | default('')],
          'technitium':
            (['/etc/systemd/resolved.conf.d/technitium.conf'] if native_services_technitium_manage_resolved | default(false) else [])
            + (['/etc/systemd/system/' ~
                (native_services_config.service_name | default('') | regex_replace('[.]service$', '')) ~ '.service']
               if ansible_facts.pkg_mgr in ['dnf', 'dnf5'] else [])}[native_services_application] }}
    native_services_state_path: "/var/lib/native_services/{{ native_services_application }}.json"
    native_services_previous: {}

- name: Native services | Read ownership record metadata
  ansible.builtin.stat:
    path: "{{ native_services_state_path }}"
  register: native_services_state_stat

- name: Native services | Read existing ownership record
  when: native_services_state_stat.stat.exists
  ansible.builtin.slurp:
    src: "{{ native_services_state_path }}"
  register: native_services_state_read

- name: Native services | Resolve existing ownership record
  when: native_services_state_stat.stat.exists
  ansible.builtin.set_fact:
    native_services_previous: "{{ native_services_state_read.content | b64decode | from_json }}"

- name: Native services | Reject competing native installations
  ansible.builtin.assert:
    that:
      - native_services_previous.identity | default(native_services_identity) == native_services_identity
      - native_services_previous.unit | default(native_services_unit) == native_services_unit
    fail_msg: Another declaration or service unit owns this native installation; remove it before changing identity.

- name: Native services | Validate dedicated controller and existing runner ownership
  when: native_services_application == 'forgejo_runner'
  ansible.builtin.include_tasks: forgejo_runner_validate.yml

- name: Native services | Validate Keepalived before any installation or restart
  when:
    - native_services_application == 'keepalived'
    - native_services_action in ['deploy', 'update', 'recreate']
  ansible.builtin.include_tasks: keepalived_validate.yml

- name: Native services | Inspect managed file paths without following links
  ansible.builtin.stat:
    path: "{{ native_services_owned_file }}"
    follow: false
  loop: "{{ (native_services_previous.files | default([]) + native_services_files) | unique | list }}"
  loop_control:
    loop_var: native_services_owned_file
  register: native_services_file_stats

- name: Native services | Refuse directory deletion or replacement through file settings
  ansible.builtin.assert:
    that:
      - not (native_services_file_stat.stat.isdir | default(false))
    fail_msg: A managed configuration path is a directory; refusing to adopt or remove it.
  loop: "{{ native_services_file_stats.results }}"
  loop_control:
    loop_var: native_services_file_stat
    label: "{{ native_services_file_stat.native_services_owned_file }}"

- name: Forgejo Runner | Reset per-entry maintenance ownership and registration snapshots
  when: native_services_application == 'forgejo_runner'
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    native_services_runner_registration: {}
    native_services_runner_registration_read: {}
    native_services_runner_maintenance: {}

# checkov:skip=CKV2_ANSIBLE_3:Failure propagates; always clears transient auth while retaining failed maintenance ownership.
- name: Native services | Complete the owned lifecycle with private snapshot cleanup
  block:
    - name: Forgejo Runner | Validate the selected registration before installation changes
      when:
        - native_services_application == 'forgejo_runner'
        - native_services_action in ['deploy', 'update']
        - not ansible_check_mode
      ansible.builtin.include_tasks: forgejo_runner_registration.yml

    - name: Native services | Protect active acceptance before runner lifecycle changes
      when:
        - native_services_application == 'forgejo_runner'
        - not ansible_check_mode
        - native_services_action in ['deploy', 'update'] or native_services_state_stat.stat.exists
      ansible.builtin.include_tasks: forgejo_runner_drain.yml

    - name: Native services | Prepare installation ownership and resolver recovery
      when: native_services_action in ['deploy', 'update']
      ansible.builtin.include_tasks: ownership.yml

    - name: Native services | Apply the selected application
      when:
        - native_services_action in ['deploy', 'update']
        - native_services_application != 'forgejo_runner' or not ansible_check_mode
      ansible.builtin.include_tasks: "{{ native_services_application }}.yml"

    - name: Forgejo Runner | Explain validated check-mode installation plan
      when:
        - native_services_application == 'forgejo_runner'
        - ansible_check_mode
      ansible.builtin.debug:
        msg: >-
          Would manage {{ native_services_config.repository }} as {{ native_services_config.user }}
          using pinned Runner {{ native_services_config.version }} and persistent {{ native_services_config.data_dir }}.
          Tool installation, credential reads, registration, maintenance locks and service changes are deferred.

    - name: Native services | Recreate the selected service without deleting data
      when: native_services_action == 'recreate'
      ansible.builtin.include_tasks: recreate.yml

    - name: Native services | Remove the selected service's managed integrations
      when: native_services_action == 'remove'
      ansible.builtin.include_tasks: remove.yml

    # Flush notifications before another entry can replace this application's facts.
    - name: Native services | Complete selected service notifications
      ansible.builtin.meta: flush_handlers

    - name: Forgejo Runner | Release only this completed operation's maintenance ownership
      when:
        - native_services_application == 'forgejo_runner'
        - not ansible_check_mode
        - native_services_runner_maintenance.token is defined
      forgejo_runner_maintenance:
        state: absent
        token: '{{ native_services_runner_maintenance.token }}'
  always:
    - name: Forgejo Runner | Clear registration authentication from transient facts on every exit
      when: native_services_application == 'forgejo_runner'
      no_log: true
      diff: false
      ansible.builtin.set_fact:
        native_services_runner_registration: {}
        native_services_runner_registration_read: {}
