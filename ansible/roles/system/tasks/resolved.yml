---

- name: System resolver | Validate the direct task entry point
  ansible.builtin.import_tasks: resolved_validate.yml

- name: System resolver | Install APT resolver packages
  when: ansible_facts.pkg_mgr == 'apt' and system_resolved_packages | length > 0
  ansible.builtin.apt:
    name: "{{ system_resolved_packages }}"
    state: present
    update_cache: true
  environment: "{{ system_apt_environment }}"

- name: System resolver | Install RPM resolver packages
  when:
    - not ansible_check_mode
    - ansible_facts.pkg_mgr in ['dnf', 'dnf5']
    - system_resolved_packages | length > 0
  ansible.builtin.dnf:
    name: "{{ system_resolved_packages }}"
    state: present
    use_backend: "{{ 'dnf5' if ansible_facts.pkg_mgr == 'dnf5' else 'dnf4' }}"
    disable_gpg_check: false
    allowerasing: false

- name: System resolver | Preview RPM setup without runtime or file mutations
  when: ansible_check_mode and ansible_facts.pkg_mgr in ['dnf', 'dnf5']
  ansible.builtin.debug:
    msg: >-
      Would install {{ system_resolved_packages }}, configure resolved and use {{ system_resolved_resolv_conf_target }}.
      Package, service, NSS-provider and DNS-output verification are deferred.
      NetworkManager profiles, DNS publisher selection and authselect/NSS files are retained.

- name: System resolver | Configure the selected resolver
  when: not ansible_check_mode or ansible_facts.pkg_mgr == 'apt'
  ansible.builtin.include_tasks:
    file: resolved_configure.yml
    apply:
      tags: [system, system_resolved]
