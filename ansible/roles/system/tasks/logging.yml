---

- name: System | Resolve the Ubuntu cloud-init package split
  when: ansible_facts.distribution == 'Ubuntu'
  ansible.builtin.include_tasks: logging_cloud_init.yml

- name: System | Create log capacity drop-in directories
  ansible.builtin.file:
    path: "{{ system_log_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/systemd/journald.conf.d
    - /etc/systemd/system/logrotate.timer.d
  loop_control:
    loop_var: system_log_dropin_dir

- name: System | Configure persistent journal storage limits
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/60-skynet-storage.conf
    content: |
      [Journal]
      Storage=persistent
      SystemMaxUse=1G
      SystemKeepFree=5G
    owner: root
    group: root
    mode: '0644'
  register: system_journal_limits

- name: System | Compare installed journal settings with the last applied copy
  ansible.builtin.stat:
    path: "{{ system_journal_settings_path }}"
  loop:
    - /etc/systemd/journald.conf.d/60-skynet-storage.conf
    - /var/lib/skynet-journald-storage.applied
  loop_control:
    loop_var: system_journal_settings_path
  register: system_journal_settings

- name: System | Apply persistent journal limits
  when:
    - not ansible_check_mode
    - >-
      system_journal_limits.changed
      or (system_journal_settings.results[1].stat.checksum | default(''))
      != system_journal_settings.results[0].stat.checksum
  ansible.builtin.systemd_service:
    name: systemd-journald.service
    state: restarted

# Flush is idempotent and creates persistent storage when needed.
- name: System | Flush the journal to persistent storage
  when: not ansible_check_mode
  ansible.builtin.command:
    argv: [/usr/bin/journalctl, --flush]
  changed_when: false

- name: System | Record journal configuration only after activation and flush
  when: not ansible_check_mode
  ansible.builtin.copy:
    src: /etc/systemd/journald.conf.d/60-skynet-storage.conf
    dest: /var/lib/skynet-journald-storage.applied
    remote_src: true
    owner: root
    group: root
    mode: '0644'

- name: System | Configure the 15-minute logrotate check
  ansible.builtin.copy:
    dest: /etc/systemd/system/logrotate.timer.d/60-skynet-schedule.conf
    content: |
      [Timer]
      OnCalendar=
      OnCalendar=*:0/15
      RandomizedDelaySec=0
      AccuracySec=1s
      Persistent=true
    owner: root
    group: root
    mode: '0644'

- name: System | Install the independent Traefik rotation units
  ansible.builtin.copy:
    src: "{{ system_logrotate_unit }}"
    dest: "/etc/systemd/system/{{ system_logrotate_unit }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - skynet-traefik-logrotate.service
    - skynet-traefik-logrotate.timer
  loop_control:
    loop_var: system_logrotate_unit

- name: System | Load logging units even when retrying an unchanged deployment
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: System | Enable and start both logrotate schedules
  when: not ansible_check_mode
  ansible.builtin.systemd_service:
    name: "{{ system_logrotate_timer }}"
    enabled: true
    state: started
  loop:
    - logrotate.timer
    - skynet-traefik-logrotate.timer
  loop_control:
    loop_var: system_logrotate_timer
