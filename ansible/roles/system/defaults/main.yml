---
# Ordinary baseline features; maintenance is selected separately with system_updates.
system_packages_enabled: true
system_sysctl_enabled: true
system_limits_enabled: true
system_guest_agent_enabled: true
system_extra_packages: []
system_package_cache_valid_time: 3600

# Retain the old role-owned paths to avoid competing persisted settings.
system_sysctl_file: /etc/sysctl.d/99-ubuntu-tuning.conf
system_limits_file: /etc/security/limits.d/99-ubuntu.conf
system_limits:
  - domain: '*'
    type: '-'
    item: nofile
    value: 100000

# Login-session limits do not configure systemd services or user managers.
# Those limits belong in their owning service/unit configuration.
system_swap_enabled: false
system_swap_path: /swapfile
system_swap_size_mb: 2048

# Explicit per-interface opt-ins. No interface is inferred from a route or PCI scan.
system_nic_interfaces: {}
# Set only when replacing the exact former Ubuntu script/unit after selecting ports.
system_nic_migrate_legacy: false

# No maintenance is performed by system or system_packages.
system_updates_upgrade: true
system_updates_autoremove: false
system_updates_autoclean: false

# Optional Debian/Ubuntu systemd-resolved + NSS integration only.
# DNF hosts retain their existing NetworkManager/cloud-init resolver setup.
system_resolved_enabled: false
system_resolved_disable_stub: false
system_resolved_manage_resolv_conf: "{{ system_resolved_disable_stub }}"
system_resolved_manage_nsswitch: true
system_resolved_nsswitch_path: /etc/nsswitch.conf
system_resolved_nsswitch_backup: true
system_resolved_nsswitch_hosts_line: 'hosts:          files resolve [!UNAVAIL=return] dns'
system_resolved_packages: [libnss-resolve]
system_resolved_service_name: systemd-resolved
system_resolved_config_dir: /etc/systemd/resolved.conf.d
system_resolved_dropin_path: "{{ system_resolved_config_dir }}/99-skynet.conf"
system_resolved_resolv_conf_path: /etc/resolv.conf
system_resolved_resolv_conf_target: /run/systemd/resolve/resolv.conf
system_resolved_fallback_dns: [1.1.1.1, 9.9.9.9]
system_resolved_cleanup_dropins:
  - /etc/systemd/resolved.conf.d/no-stub-listener.conf

system_apt_environment:
  DEBIAN_FRONTEND: noninteractive
  DEBIAN_PRIORITY: critical

system_sysctl_settings:
  fs.inotify.max_user_watches: 524288
  net.core.default_qdisc: fq
  net.core.rmem_max: 67108864
  net.core.somaxconn: 4096
  net.core.wmem_max: 67108864
  net.ipv4.conf.all.accept_redirects: 0
  net.ipv4.conf.all.accept_source_route: 0
  net.ipv4.conf.all.secure_redirects: 0
  net.ipv4.tcp_congestion_control: bbr
  net.ipv4.tcp_fin_timeout: 10
  net.ipv4.tcp_max_syn_backlog: 30000
  net.ipv4.tcp_max_tw_buckets: 2000000
  net.ipv4.tcp_mtu_probing: 1
  net.ipv4.tcp_rfc1337: 1
  net.ipv4.tcp_rmem: 4096 87380 33554432
  net.ipv4.tcp_sack: 1
  net.ipv4.tcp_slow_start_after_idle: 0
  net.ipv4.tcp_tw_reuse: 2
  net.ipv4.tcp_window_scaling: 1
  net.ipv4.tcp_wmem: 4096 87380 33554432
  net.ipv4.udp_rmem_min: 8192
  net.ipv4.udp_wmem_min: 8192
  net.ipv4.neigh.default.gc_thresh1: 1024
  net.ipv4.neigh.default.gc_thresh2: 2048
  net.ipv4.neigh.default.gc_thresh3: 4096
  vm.dirty_background_ratio: 10
  vm.dirty_ratio: 15
  vm.swappiness: 10
