---

- name: Mgt firewall | Gather minimal platform facts
  ansible.builtin.setup:
    gather_subset: ['!all', '!min', distribution, service_mgr, python]

- name: Mgt firewall | Require the current supported platform
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == 'Ubuntu'
      - ansible_facts.distribution_version.split('.')[0:2] | join('.') == '26.04'
      - ansible_facts.service_mgr == 'systemd'
      - ansible_facts.python.version.major == 3
      - ansible_facts.python.version.minor >= 10
      - mgt_firewall_root == '/etc/skynet-mgt-firewall'
    fail_msg: This phase supports the current Ubuntu 26.04 mgt with existing Python 3.10+ only. Rocky support is deferred.

- name: Mgt firewall | Resolve live identities and dry-test both families before persistent writes
  ansible.builtin.command:
    argv: ["{{ ansible_facts.python.executable }}", -c, "{{ mgt_firewall_helper_source }}", validate, --stdin]
    expand_argument_vars: false
    stdin: "{{ mgt_firewall_policy | to_json }}"
  register: mgt_firewall_preflight
  changed_when: false

- name: Mgt firewall | Carry the validated dedicated manager dependencies
  ansible.builtin.set_fact:
    mgt_firewall_policy: "{{ mgt_firewall_policy | combine({'guard_units': (mgt_firewall_preflight.stdout | from_json).guard_units}) }}"

- name: Mgt firewall | Create the owned policy directory
  ansible.builtin.file:
    path: "{{ mgt_firewall_root }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Mgt firewall | Install the self-contained scoped policy helper
  ansible.builtin.copy:
    content: "{{ mgt_firewall_helper_source }}"
    dest: "{{ mgt_firewall_root }}/policy.py"
    owner: root
    group: root
    mode: "0600"

- name: Mgt firewall | Install the owned guard and periodic reconciler units
  ansible.builtin.template:
    src: "{{ mgt_firewall_unit }}.j2"
    dest: "/etc/systemd/system/{{ mgt_firewall_unit }}"
    owner: root
    group: root
    mode: "0644"
  loop: [skynet-mgt-firewall.service, skynet-mgt-firewall-reconcile.service, skynet-mgt-firewall-reconcile.timer]
  loop_control:
    loop_var: mgt_firewall_unit

- name: Mgt firewall | Create only the Docker drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Mgt firewall | Order Docker around the managed guards without restarting it
  ansible.builtin.template:
    src: docker-ordering.conf.j2
    dest: /etc/systemd/system/docker.service.d/45-skynet-mgt-firewall.conf
    owner: root
    group: root
    mode: "0644"

- name: Mgt firewall | Create only the dedicated manager drop-in directories
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ mgt_firewall_guard_unit }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: "{{ mgt_firewall_policy.guard_units }}"
  loop_control:
    loop_var: mgt_firewall_guard_unit

- name: Mgt firewall | Require the guard for dedicated rootless managers and rootful endpoints
  ansible.builtin.template:
    src: caller-ordering.conf.j2
    dest: "/etc/systemd/system/{{ mgt_firewall_guard_unit }}.d/45-skynet-mgt-firewall.conf"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ mgt_firewall_policy.guard_units }}"
  loop_control:
    loop_var: mgt_firewall_guard_unit

- name: Mgt firewall | Resolve only the managed persistence paths
  ansible.builtin.set_fact:
    mgt_firewall_persistence_paths: >-
      {{ ['/etc/systemd/system/skynet-mgt-firewall.service',
          '/etc/systemd/system/skynet-mgt-firewall-reconcile.service',
          '/etc/systemd/system/skynet-mgt-firewall-reconcile.timer',
          '/etc/systemd/system/docker.service.d/45-skynet-mgt-firewall.conf'] +
          mgt_firewall_policy.guard_units | map('regex_replace', '^(.*)$', '/etc/systemd/system/\1.d/45-skynet-mgt-firewall.conf') | list }}

- name: Mgt firewall | Record checksums of only the owned persistence files
  ansible.builtin.stat:
    path: "{{ mgt_firewall_persistence_path }}"
    checksum_algorithm: sha256
  loop: "{{ mgt_firewall_persistence_paths }}"
  loop_control:
    loop_var: mgt_firewall_persistence_path
  register: mgt_firewall_persistence_files

- name: Mgt firewall | Store the offline persistence audit manifest
  ansible.builtin.set_fact:
    mgt_firewall_policy: >-
      {{ mgt_firewall_policy | combine({'persistence': dict(
         mgt_firewall_persistence_files.results | map(attribute='mgt_firewall_persistence_path') |
         zip(mgt_firewall_persistence_files.results | map(attribute='stat.checksum')) )}) }}

- name: Mgt firewall | Persist the completed offline audit manifest
  ansible.builtin.copy:
    content: "{{ mgt_firewall_policy | to_nice_json }}\n"
    dest: "{{ mgt_firewall_root }}/policy.json"
    owner: root
    group: root
    mode: "0600"

- name: Mgt firewall | Apply the active policy before enabling persistence
  ansible.builtin.command:
    argv: ["{{ ansible_facts.python.executable }}", "{{ mgt_firewall_root }}/policy.py", apply]
  register: mgt_firewall_apply
  changed_when: (mgt_firewall_apply.stdout | from_json).changed

- name: Mgt firewall | Enable boot guards without restarting application services
  ansible.builtin.systemd_service:
    name: skynet-mgt-firewall.service
    enabled: true
    daemon_reload: true

- name: Mgt firewall | Enable and start only the managed reconciler timer
  ansible.builtin.systemd_service:
    name: skynet-mgt-firewall-reconcile.timer
    enabled: true
    state: started
