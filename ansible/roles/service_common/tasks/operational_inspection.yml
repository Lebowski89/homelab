---

- name: Service common | Use the standalone runtime host connection
  when:
    - not ansible_check_mode and not service_common_execution_only
    - service_common_service.runtime | default("docker") == 'docker'
    - (service_common_service.deploy | default({})).type | default('swarm') == 'container'
  ansible.builtin.set_fact:
    ansible_connection: "{{ hostvars[service_common_runtime_host].ansible_connection | default('ssh') }}"
  delegate_to: "{{ service_common_runtime_host }}"
  delegate_facts: true
  vars:
    service_common_runtime_host: >-
      {{ service_common_service.deploy.hosts[0] if service_common_service.runtime | default("docker") == "docker" and (service_common_service.deploy | default({})).type | default("swarm") == "container" else inventory_hostname }}
  tags: [deploy, update, recreate, bootstrap]

- name: Service common | Inspect the managed service before making changes
  when:
    - not ansible_check_mode
    - not service_common_execution_only
    - service_common_action in ['deploy', 'update', 'recreate', 'bootstrap']
    - >-
      not (service_common_service | service_common_requirements_proof(
        service_common_name, service_common_preflight_proof | default({})))
    - >-
      (service_common_service.operational_requirements | default({}) | service_common_requirements_normalize).acl | length > 0
      or (service_common_service.operational_requirements | default({}) | service_common_requirements_normalize).ownership_transition
  delegate_to: >-
    {{ service_common_service.deploy.hosts[0] if service_common_service.runtime | default("docker") == "docker" and (service_common_service.deploy | default({})).type | default("swarm") == "container" else inventory_hostname }}
  service_operational_check:
    phase: runtime
    metadata: "{{ service_common_service | service_common_requirements_metadata(service_common_name) }}"
  register: service_common_managed_runtime

# The controller can use a local connection. Set the delegated host connection
# explicitly so endpoint audits use that host's inventory transport instead.
- name: Service common | Use the endpoint host's configured connection
  when:
    - service_common_managed_runtime.managed | default(false)
    - (service_common_service.operational_requirements | default({}) | service_common_requirements_normalize).acl | length > 0
  ansible.builtin.set_fact:
    ansible_connection: "{{ hostvars[service_common_protection_host].ansible_connection | default('ssh') }}"
  delegate_to: "{{ service_common_protection_host }}"
  delegate_facts: true
  loop: >-
    {{ [(service_common_service.deploy | default({})).host]
       if (service_common_service.deploy | default({})).host | default([]) is string
       else (service_common_service.deploy | default({})).host | default([]) }}
  loop_control:
    loop_var: service_common_protection_host

- name: Service common | Audit installed protection on each endpoint host
  when:
    - service_common_managed_runtime.managed | default(false)
    - (service_common_service.operational_requirements | default({}) | service_common_requirements_normalize).acl | length > 0
  delegate_to: "{{ service_common_protection_host }}"
  service_operational_check:
    phase: protection
    metadata: "{{ service_common_service | service_common_requirements_metadata(service_common_name) }}"
    inventory_host: "{{ service_common_protection_host }}"
  loop: >-
    {{ [(service_common_service.deploy | default({})).host]
       if (service_common_service.deploy | default({})).host | default([]) is string
       else (service_common_service.deploy | default({})).host | default([]) }}
  loop_control:
    loop_var: service_common_protection_host
  register: service_common_protection_audits

- name: Service common | Save verified prerequisites for this service operation
  when: service_common_managed_runtime.managed | default(false)
  ansible.builtin.set_fact:
    service_common_prerequisite_proof:
      metadata: "{{ service_common_service | service_common_requirements_metadata(service_common_name) }}"
      acl: "{{ (service_common_service.operational_requirements | default({}) | service_common_requirements_normalize).acl }}"
      ownership_transition: "{{ service_common_managed_runtime.ownership_transition | default(false) }}"
