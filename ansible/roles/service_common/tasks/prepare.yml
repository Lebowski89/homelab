---

- name: Service common prepare | Validate and reconcile prerequisites
  ansible.builtin.include_tasks:
    file: preflight.yml
    apply:
      tags: [deploy, update, recreate, bootstrap]
  tags: [deploy, update, recreate, bootstrap]

- name: Service common prepare | Apply filesystem configuration
  ansible.builtin.include_tasks:
    file: files.yml
    apply:
      tags: [deploy, update, recreate, bootstrap]
  tags: [deploy, update, recreate, bootstrap]
