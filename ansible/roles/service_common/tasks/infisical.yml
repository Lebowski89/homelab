---

- name: Service common Infisical | Reset all per-service outputs
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    service_common_infisical_config: {}
    service_common_infisical_lookup_request: {}
    service_common_infisical_values: {}
    service_common_secret_declarations: []
    service_common_environment_normalized: {}
    service_common_resolved_environment: {}
  tags: [deploy, update, recreate, bootstrap, drift]

- name: Service common Infisical | Validate and normalize declarations
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    service_common_infisical_normalized: >-
      {{
        service_common_infisical_secrets_map
        | service_common_infisical_normalize(service_common_infisical_fail_on_empty)
      }}
  tags: [deploy, update, recreate, bootstrap, drift]

- name: Service common Infisical | Publish lookup config and value-free secret declarations
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    service_common_infisical_config:
      secrets_map: "{{ service_common_infisical_normalized.secrets_map }}"
      fail_on_empty: "{{ service_common_infisical_normalized.fail_on_empty }}"
    service_common_secret_declarations: "{{ service_common_infisical_normalized.secret_declarations }}"
  tags: [deploy, update, recreate, bootstrap, drift]

- name: Service common environment | Validate and normalize canonical environment
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    service_common_environment_normalized: >-
      {{
        service_common_environment
        | service_common_environment_normalize(service_common_infisical_config)
      }}
  tags: [deploy, update, recreate, bootstrap, drift]

- name: Service common Infisical | Validate lookup parameters
  when:
    - not ansible_check_mode
    - service_common_infisical_config.secrets_map | length > 0
  no_log: true
  diff: false
  ansible.builtin.assert:
    that:
      - service_common_infisical_lookup_params is mapping
    fail_msg: "service_common_infisical_lookup_params must be a mapping."
  tags: [deploy, update, recreate, bootstrap, drift]

- name: Service common Infisical | Publish current-service lookup request
  when:
    - not ansible_check_mode
    - service_common_infisical_config.secrets_map | length > 0
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    service_common_infisical_lookup_request:
      controller_host: >-
        {{ service_common_controller_host | default(inventory_hostname, true) }}
      params: "{{ service_common_infisical_lookup_params }}"
      secrets_map: "{{ service_common_infisical_config.secrets_map }}"
  tags: [deploy, update, recreate, bootstrap, drift]

- name: Service common Infisical | Fetch requested values
  when:
    - not ansible_check_mode
    - service_common_infisical_config.secrets_map | length > 0
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    service_common_infisical_values: >-
      {{
        service_common_infisical_values
        | combine({
            service_common_infisical_item.var: lookup(
              "infisical.vault.read_secrets",
              **(service_common_infisical_lookup_request.params | combine({
                "path": service_common_infisical_item.path,
                "secret_name": service_common_infisical_item.name
              }))
            ).value
          })
      }}
  loop: >-
    {{ service_common_infisical_lookup_request.secrets_map | default([]) }}
  loop_control:
    loop_var: service_common_infisical_item
    label: "{{ service_common_infisical_item.var }}"
  delegate_to: >-
    {{
      service_common_infisical_lookup_request.controller_host
      | default(inventory_hostname, true)
    }}
  tags: [deploy, update, recreate, bootstrap, drift]

- name: Service common Infisical | Enforce empty-value policy
  when: not ansible_check_mode
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    service_common_infisical_values: >-
      {{ service_common_infisical_values | service_common_infisical_finalize(service_common_infisical_config) }}
  tags: [deploy, update, recreate, bootstrap, drift]

- name: Service common Infisical | Build deterministic check-mode values
  when: ansible_check_mode
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    service_common_infisical_values: >-
      {{ service_common_infisical_config | service_common_infisical_check_values }}
  tags: [deploy, update, recreate, bootstrap, drift]

- name: Service common environment | Resolve canonical environment
  no_log: true
  diff: false
  ansible.builtin.set_fact:
    service_common_resolved_environment: >-
      {{
        service_common_environment_normalized
        | service_common_environment_resolve(
            service_common_infisical_values,
            service_common_infisical_config
          )
      }}
  tags: [deploy, update, recreate, bootstrap, drift]
