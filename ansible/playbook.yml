---

################################
# WORKSTATION (NO APPLICATION DEPENDENCIES)
################################

- name: Provision operator workstation
  hosts: "{{ workstation_hosts | default('tags_workstation') }}"
  become: true
  gather_facts: false

  tasks:
    - name: Gather workstation system and invoking user facts
      become: false
      ansible.builtin.setup:
      tags: &workstation_tags
        - workstation
        - workstation_apt
        - workstation_dev
        - workstation_vscode
        - workstation_shell
        - workstation_desktop
        - workstation_tools
        - workstation_credentials
        - workstation_repository
        - workstation_ansible
        - workstation_collections
        - workstation_skynet
        - workstation_opentofu

    - name: Include Workstation role
      ansible.builtin.include_role:
        name: workstation
        apply:
          tags: [workstation]
      tags: *workstation_tags

################################
# SHARED OS BASELINE (NO APPLICATION DEPENDENCIES)
################################

- name: Configure shared operating system baseline
  hosts: "{{ system_hosts | default('tags_skynet') }}"
  become: true
  gather_facts: false

  pre_tasks:
    - name: Keep unrelated selections outside system provisioning
      when:
        - "'all' not in ansible_run_tags"
        - ansible_run_tags | select('match', '^system(_|$)') | list | length == 0
      ansible.builtin.meta: end_play
      tags: always

  tasks:
    - name: Gather system platform facts
      ansible.builtin.setup:
      tags: &system_tags
        - system
        - system_packages
        - system_updates
        - system_sysctl
        - system_limits
        - system_swap
        - system_resolved
        - system_cleanup
        - system_nic

    - name: Include shared system role
      # Preserve full-run Ubuntu scope; other platforms explicitly opt in.
      when: system_enabled | default(ansible_facts.distribution == 'Ubuntu' or 'all' not in ansible_run_tags)
      ansible.builtin.include_role:
        name: system
      tags: *system_tags

################################
# BOOTSTRAP
################################

- name: Deploy NetBox
  hosts: >-
    {{ services_controller_inventory_group | default('tags_service_controller') }}
  become: true
  gather_facts: false

  vars:
    recovery_application_host: "{{ ansible_play_hosts_all | first }}"

  pre_tasks:
    - name: Validate explicit remote application target
      ansible.builtin.import_tasks: tasks/recovery_target.yml
      tags: [never, netbox_bootstrap, netbox_deploy, netbox_recreate, netbox_remove]

  tasks:
    - name: Include NetBox bootstrap role
      ansible.builtin.include_role:
        name: netbox
        apply:
          tags:
            - never
            - netbox_bootstrap
            - netbox_deploy
            - netbox_recreate
            - netbox_remove
      tags:
        - never
        - netbox_bootstrap
        - netbox_deploy
        - netbox_recreate
        - netbox_remove

################################
# DEPLOY HOMELAB
################################

- name: Deploy homelab services
  hosts: tags_skynet
  become: true
  gather_facts: false
  any_errors_fatal: true
  strategy: linear

  pre_tasks:
    # Infrastructure-only selections must not enter application host contracts.
    - name: Keep workstation and system runs outside homelab operations
      when: ansible_run_tags | reject('match', '^(workstation|system)(_|$)') | list | length == 0
      ansible.builtin.meta: end_play
      tags: always

    - name: Load all service definitions from group_vars/all/services/*.yml
      ansible.builtin.include_vars:
        dir: "{{ playbook_dir }}/group_vars/all/services"
        files_matching: ".*\\.ya?ml$"
        ignore_unknown_extensions: true
        extensions: [yml, yaml]
        name: svcfiles
      tags: [deploy, update, remove, recreate, bootstrap, drift, alloy_native, node_exporter, keepalived, technitium_native]

    - name: Assert svcfiles loaded
      ansible.builtin.assert:
        that:
          - svcfiles is defined
          - (svcfiles | type_debug) == "dict"
          - (svcfiles | length) > 0
        fail_msg: "svcfiles is empty or not a dict. include_vars did not load your service files."
      tags: [deploy, update, remove, recreate, bootstrap, drift, alloy_native, node_exporter, keepalived, technitium_native]

    - name: Resolve requested service lifecycle before selection
      ansible.builtin.set_fact:
        service_catalog_action: >-
          {{
            'remove' if 'remove' in (ansible_run_tags | default([])) else
            ('recreate' if 'recreate' in (ansible_run_tags | default([])) else
            ('update' if 'update' in (ansible_run_tags | default([])) else
            ('drift' if 'drift' in (ansible_run_tags | default([])) else
            ('bootstrap' if 'bootstrap' in (ansible_run_tags | default([])) else 'deploy'))))
          }}
      tags: [deploy, update, remove, recreate, bootstrap, drift, alloy_native, node_exporter, keepalived, technitium_native]

    - name: Select catalogue identities before resolving runtime prerequisites
      ansible.builtin.set_fact:
        service_catalog_requested: >-
          {{ svcfiles | service_catalog_effective('', {}, false)
             | service_catalog_select(ansible_run_tags | default([]),
                                      docker_services_run_all | default(false),
                                      'remove' in (ansible_run_tags | default([])),
                                      service_catalog_action) }}
      tags: [deploy, update, remove, recreate, bootstrap, drift, alloy_native, node_exporter, keepalived, technitium_native]

    - name: Identify a native-only operation without container prerequisites
      # A genuinely disabled native-only selection still needs no container
      # controller merely to report its check-mode skip.
      ansible.builtin.set_fact:
        service_catalog_native_only: >-
          {{ (service_catalog_requested.selected or service_catalog_requested.matched)
             | map(attribute='runtime') | unique | list == ['native'] }}
      tags: [deploy, update, remove, recreate, bootstrap, drift, alloy_native, node_exporter, keepalived, technitium_native]

    - name: Include runtime-neutral service host contract validation
      when: not (service_catalog_native_only | default(false))
      ansible.builtin.include_tasks:
        file: tasks/services_host_contract.yml
        apply:
          tags: always
      tags: always

    - name: Include runtime-neutral container host default normalization
      when: not (service_catalog_native_only | default(false))
      ansible.builtin.include_tasks:
        file: tasks/container_host_defaults.yml
        apply:
          tags: always
      tags: always

    - name: Gather service controller facts
      when:
        - not (service_catalog_native_only | default(false))
        - inventory_hostname == services_controller_host
      ansible.builtin.setup:
      tags:
        - infisical_deploy
        - infisical_recreate
        - infisical_podman_deploy
        - infisical_podman_recreate
        - deploy
        - update
        - remove
        - recreate
        - bootstrap
        - drift
        - reconcile

    - name: Resolve host timezone variable
      when: not (service_catalog_native_only | default(false))
      tags:
        - infisical_deploy
        - infisical_recreate
        - infisical_podman_deploy
        - infisical_podman_recreate
        - deploy
        - update
        - remove
        - recreate
        - bootstrap
        - drift
        - reconcile
      block:
        - name: Set timezone variable on manager
          when: inventory_hostname == services_controller_host
          ansible.builtin.set_fact:
            timezone: "{{ ansible_facts.timezone | default('Australia/Melbourne') }}"

        - name: Timezone output
          when: inventory_hostname == services_controller_host
          ansible.builtin.debug:
            msg: "{{ timezone }}"

        - name: Share timezone to all hosts
          when: inventory_hostname != services_controller_host
          ansible.builtin.set_fact:
            timezone: "{{ hostvars[services_controller_host].timezone }}"

  tasks:

    ################################
    # TAILSCALE BOOTSTRAP (QEMU AGENT)
    ################################

    - name: Include Tailscale bootstrap role
      when: inventory_hostname == tailscale_bootstrap_proxmox_host
      ansible.builtin.include_role:
        name: tailscale_bootstrap
        apply:
          tags:
            - never
            - tailscale_bootstrap
      tags:
        - never
        - tailscale_bootstrap

    ################################
    # DOCKER
    ################################

    - name: Gather facts for Docker role
      when: "'tags_docker' in group_names"
      ansible.builtin.setup:
      tags:
        - docker
        - docker_install
        - docker_prune_timer
        - docker_prune_unraid_user_script

    - name: Include Docker role
      when: "'tags_docker' in group_names"
      ansible.builtin.include_role:
        name: docker
      tags:
        - docker
        - docker_install
        - docker_prune
        - docker_prune_dangling
        - docker_prune_unused
        - docker_prune_volumes
        - docker_prune_timer
        - docker_prune_unraid_user_script
        - docker_swarm
        - docker_swarm_init
        - docker_swarm_join
        - docker_swarm_network
        - docker_swarm_labels

    ################################
    # PODMAN
    ################################

    - name: Gather facts for Podman role
      when: "'tags_podman' in group_names or 'tags_podman_install' in group_names"
      ansible.builtin.setup:
      tags:
        - podman
        - podman_install

    - name: Include Podman role
      when: "'tags_podman' in group_names or 'tags_podman_install' in group_names"
      ansible.builtin.include_role:
        name: podman
      tags:
        - podman
        - podman_install

    ################################
    # HUGO (INIT/THEME)
    ################################

    - name: Include Hugo role
      when: inventory_hostname == services_controller_host
      ansible.builtin.include_role:
        name: hugo
      tags:
        - hugo_bootstrap
        - hugo_submodule

    ################################
    # INFISICAL (STACK)
    ################################

    - name: Include central Podman bridge owner
      when: inventory_hostname == services_controller_host
      ansible.builtin.include_role:
        name: podman
        tasks_from: shared_network
        apply:
          tags: [podman_network]
      tags: [never, podman_network]

    - name: Include Infisical role
      when: inventory_hostname == services_controller_host
      ansible.builtin.include_role:
        name: infisical
      tags:
        - infisical_bootstrap
        - infisical_deploy
        - infisical_recreate
        - infisical_remove

    ################################
    # TERRAFORM
    ################################

    - name: Include OpenTofu role
      when: "'tags_opentofu' in group_names"
      ansible.builtin.include_role:
        name: opentofu
      tags:
        - opentofu
        - opentofu_pve_user

    ################################
    # POSTGRES (CLUSTER)
    ################################

    - name: Gather facts for PostgreSQL host management
      when: "'tags_postgres' in group_names"
      ansible.builtin.setup:
      tags:
        - postgres
        - postgres_apt
        - postgres_backup
        - postgres_backup_setup
        - postgres_backup_run
        - postgres_backup_remote_setup
        - postgres_backup_remote_init
        - postgres_backup_remote_run
        - postgres_backup_remote_maintenance
        - postgres_backup_restore_validation_setup
        - postgres_backup_restore_validation_run

    - name: Include Postgres role
      ansible.builtin.include_role:
        name: postgres
      tags:
        - postgres
        - postgres_apt
        - postgres_etcd
        - postgres_etcd_reset
        - postgres_patroni
        - postgres_patroni_reset
        - postgres_backup
        - postgres_backup_setup
        - postgres_backup_run
        - postgres_backup_remote_setup
        - postgres_backup_remote_init
        - postgres_backup_remote_run
        - postgres_backup_remote_maintenance
        - postgres_backup_restore_validation_setup
        - postgres_backup_restore_validation_run
        - postgres_restore
        - postgres_admin
        - postgres_admin_monitor
        - postgres_admin_nuke_node
        - postgres_admin_fix_owner
        - postgres_admin_update_pg_hba
        - postgres_admin_update_replication_safety

    ################################
    # POSTGRES EXPORTER (MONITORING)
    ################################

    - name: Include PostgreSQL Exporter role
      when: "'tags_postgres' in group_names"
      ansible.builtin.include_role:
        name: postgres_exporter
        apply:
          tags: [postgres_exporter]
      tags: [postgres_exporter]

    ################################
    # SERVICE CATALOG (DOCKER + PODMAN + NATIVE)
    ################################

    - name: Resolve runtime-neutral service controller host
      ansible.builtin.set_fact:
        service_catalog_controller_host: "{{ (ansible_play_hosts_all | first) if service_catalog_native_only else services_controller_host }}"
      tags: [deploy, update, remove, recreate, bootstrap, drift, alloy_native, node_exporter, keepalived, technitium_native]

    - name: Validate runtime-neutral service controller host
      ansible.builtin.assert:
        that:
          - service_catalog_controller_host | length > 0
          - service_catalog_controller_host in hostvars
        fail_msg: >-
          The runtime-neutral service controller host must name a host in the current inventory.
      tags: [deploy, update, remove, recreate, bootstrap, drift, alloy_native, node_exporter, keepalived, technitium_native]

    - name: Build service catalog processing list from service definitions
      when: inventory_hostname == service_catalog_controller_host
      ansible.builtin.set_fact:
        service_catalog_effective: >-
          {{ svcfiles | service_catalog_effective(service_catalog_controller_host, groups, true,
                 ['native'] if service_catalog_native_only else ['docker', 'podman', 'native']) }}
      tags: [deploy, update, remove, recreate, bootstrap, drift, alloy_native, node_exporter, keepalived, technitium_native]

    - name: Assert service catalog processing list was built
      when: inventory_hostname == service_catalog_controller_host
      ansible.builtin.assert:
        that:
          - service_catalog_effective is defined
          - service_catalog_effective is sequence
          - service_catalog_effective | length > 0
        fail_msg: "service_catalog_effective is empty. No service definitions were discovered."
      tags: [deploy, update, remove, recreate, bootstrap, drift, alloy_native, node_exporter, keepalived, technitium_native]

    - name: Drift | Initialise image drift summary
      when: inventory_hostname == service_catalog_controller_host
      ansible.builtin.set_fact:
        docker_services_image_drift: []
      tags: [drift]

    - name: Build selected service catalog processing list
      when: inventory_hostname == service_catalog_controller_host
      ansible.builtin.set_fact:
        service_catalog_selection: >-
          {{
            service_catalog_effective
            | service_catalog_select(
                ansible_run_tags | default([]),
                docker_services_run_all | default(false),
                'remove' in (ansible_run_tags | default([])),
                service_catalog_action
              )
          }}
      tags: [deploy, update, remove, recreate, bootstrap, drift, alloy_native, node_exporter, keepalived, technitium_native]

    - name: Extract service catalog selection facts
      when: inventory_hostname == service_catalog_controller_host
      ansible.builtin.set_fact:
        service_catalog_matched: "{{ service_catalog_selection.matched }}"
        service_catalog_selected: "{{ service_catalog_selection.selected }}"
        service_catalog_disabled_only_selection: "{{ service_catalog_selection.disabled_only }}"
      tags: [deploy, update, remove, recreate, bootstrap, drift, alloy_native, node_exporter, keepalived, technitium_native]

    - name: Order selected Podman services by shared-network dependencies
      when: inventory_hostname == service_catalog_controller_host
      ansible.builtin.set_fact:
        service_catalog_selected: >-
          {{
            (
              service_catalog_effective
              | service_catalog_podman_lifecycle_plan(
                  service_catalog_selected,
                  service_catalog_action
                )
            ).selected
          }}
      tags: [deploy, update, remove, recreate, bootstrap, drift, alloy_native, node_exporter, keepalived, technitium_native]

    - name: Validate selected service dispatch hosts
      when: inventory_hostname == service_catalog_controller_host
      ansible.builtin.assert:
        that:
          - >-
            service_catalog_dispatch_item.resolved_hosts | difference(groups['tags_skynet']) | length == 0
            if service_catalog_dispatch_item.runtime == 'native' else true
          - >-
            (service_catalog_dispatch_item.resolved_hosts | intersect(ansible_play_hosts_all) | length > 0)
            if service_catalog_dispatch_item.runtime == 'native'
            else service_catalog_dispatch_item.dispatch_host in ansible_play_hosts_all
        fail_msg: >-
          Selected service {{ service_catalog_dispatch_item.name }}{{
            ':' ~ service_catalog_dispatch_item.target
            if service_catalog_dispatch_item.target is defined
            else ''
          }} dispatches to {{ service_catalog_dispatch_item.dispatch_host }},
          which is not present in the current play.
      loop: "{{ service_catalog_selected }}"
      loop_control:
        loop_var: service_catalog_dispatch_item
        label: >-
          {{ service_catalog_dispatch_item.name }}{{
            ':' ~ service_catalog_dispatch_item.target
            if service_catalog_dispatch_item.target is defined
            else ''
          }}
      tags: [deploy, update, remove, recreate, bootstrap, drift, alloy_native, node_exporter, keepalived, technitium_native]

    - name: Share lightweight service catalog selection with play hosts
      ansible.builtin.set_fact:
        service_catalog_action: "{{ hostvars[service_catalog_controller_host].service_catalog_action }}"
        service_catalog_matched: "{{ hostvars[service_catalog_controller_host].service_catalog_matched }}"
        service_catalog_selected: "{{ hostvars[service_catalog_controller_host].service_catalog_selected }}"
        service_catalog_disabled_only_selection: >-
          {{ hostvars[service_catalog_controller_host].service_catalog_disabled_only_selection }}
      tags: [deploy, update, remove, recreate, bootstrap, drift, alloy_native, node_exporter, keepalived, technitium_native]

    - name: Report disabled service selection in check mode
      when:
        - ansible_check_mode
        - service_catalog_disabled_only_selection | bool
        - inventory_hostname == service_catalog_controller_host
      ansible.builtin.debug:
        msg: >-
          Requested service/tag matched only disabled service definitions:
          {{
            service_catalog_matched
            | map(attribute='name')
            | list
            | unique
            | join(', ')
          }}.
          Skipping in check mode.
      tags: [deploy, update, remove, recreate, bootstrap, drift, alloy_native, node_exporter, keepalived, technitium_native]

    - name: End play for disabled service selection in check mode
      when:
        - ansible_check_mode
        - service_catalog_disabled_only_selection | bool
      ansible.builtin.meta: end_play
      tags: [deploy, update, remove, recreate, bootstrap, drift, alloy_native, node_exporter, keepalived, technitium_native]

    - name: Assert selected service processing list was built
      ansible.builtin.assert:
        that:
          - service_catalog_selected is defined
          - service_catalog_selected is sequence
          - service_catalog_selected | length > 0
        fail_msg: >-
          No enabled service definitions matched the requested tag(s):
          {{ ansible_run_tags | default([]) | join(', ') }}.
          {{
            'Matching service definitions exist, but they are disabled.'
            if (service_catalog_matched | default([]) | length > 0)
            else
            'No matching service or target definitions were found.'
          }}
      tags: [deploy, update, remove, recreate, bootstrap, drift, alloy_native, node_exporter, keepalived, technitium_native]

    - name: Gather facts on selected service dispatch hosts
      when:
        - >-
          inventory_hostname in
          ((service_catalog_selected | map(attribute='dispatch_host') | list) +
           (service_catalog_selected | selectattr('runtime', 'equalto', 'native')
            | map(attribute='resolved_hosts') | flatten | list))
      ansible.builtin.setup:
      tags: [deploy, update, remove, recreate, bootstrap, drift, alloy_native, node_exporter, keepalived, technitium_native]

    - name: Process globally ordered service catalog
      ansible.builtin.include_tasks:
        file: tasks/service_catalog_dispatch.yml
        apply:
          tags: [deploy, update, remove, recreate, bootstrap, drift, alloy_native, node_exporter, keepalived, technitium_native]
      loop: "{{ service_catalog_selected }}"
      loop_control:
        loop_var: service_catalog_dispatch_entry
        label: >-
          {{ service_catalog_dispatch_entry.name }}{{
            ':' ~ service_catalog_dispatch_entry.target
            if service_catalog_dispatch_entry.target is defined
            else ''
          }}
      tags: [deploy, update, remove, recreate, bootstrap, drift, alloy_native, node_exporter, keepalived, technitium_native]

    - name: Drift | Report image drift summary
      when:
        - inventory_hostname == service_catalog_controller_host
        - hostvars[services_controller_host].docker_services_image_drift is defined
        - (hostvars[services_controller_host].docker_services_image_drift | length) > 0
      ansible.builtin.debug:
        msg: |
          Docker image drift detected:
          {% for drift_item in hostvars[services_controller_host].docker_services_image_drift | sort(attribute='label') %}
          - {{ drift_item.label }}
            stack:   {{ drift_item.stack }}
            service: {{ drift_item.service }}
            desired: {{ drift_item.desired }}
            current: {{ drift_item.current }}

          {% endfor %}
      tags: [drift]

    - name: Drift | Resolve notification credentials through common preflight
      ansible.builtin.include_tasks:
        file: tasks/drift_notification_preflight.yml
        apply:
          tags: [drift]
      tags: [drift]

    - name: Drift | Include email notification tasks
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/roles/docker_services/tasks/sub_tasks/drift/notify_email.yml"
        apply:
          tags: [drift]
      tags: [drift]

    - name: Drift | Report no image drift found
      when:
        - inventory_hostname == service_catalog_controller_host
        - hostvars[services_controller_host].docker_services_image_drift is not defined
          or (hostvars[services_controller_host].docker_services_image_drift | length) == 0
      ansible.builtin.debug:
        msg: "No Docker service image drift detected."
      tags: [drift]

    - name: Deploy all Docker stacks
      no_log: true
      when:
        - inventory_hostname == service_catalog_controller_host
        - not ansible_check_mode
        - >-
          (
            service_catalog_selected
            | service_catalog_by_runtime('docker')
            | length
          ) > 0
        - not (ci_mode | default(false) | bool)
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/roles/docker_services/tasks/sub_tasks/deploy/all.yml"
        apply:
          tags: [deploy, update, recreate]
          no_log: true
          diff: false
      tags: [deploy, update, recreate]
