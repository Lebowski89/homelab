---

################################
# BOOTSTRAP
################################

- name: Deploy NetBox
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  vars:
    ansible_python_interpreter: /opt/ansible/ansible-venv/bin/python

    timezone: Australia/Melbourne
    docker_host_puid: "1000"
    docker_host_pgid: "1000"
    docker_host_appdata_root: /opt

    # Docker Swarm node name, not Ansible inventory name.
    netbox_swarm_node_hostname: mgt

  tasks:
    - name: Include NetBox bootstrap role
      ansible.builtin.include_role:
        name: netbox
        apply:
          tags:
            - never
            - netbox_bootstrap
            - netbox_deploy
            - netbox_recreate
            - netbox_remove
      tags:
        - never
        - netbox_bootstrap
        - netbox_deploy
        - netbox_recreate
        - netbox_remove

################################
# DEPLOY HOMELAB
################################

- name: Deploy homelab services
  hosts: tags_skynet
  become: true

  pre_tasks:
    - name: Gather packages
      when: inventory_hostname == docker_services_primary_manager
      ansible.builtin.package_facts:
        manager: auto
      tags: always

    - name: Resolve host timezone variable
      tags:
        - infisical_deploy
        - infisical_recreate
        - infisical_podman_deploy
        - infisical_podman_recreate
        - deploy
        - update
        - remove
        - recreate
        - bootstrap
      block:
        - name: Set timezone variable on manager
          when: inventory_hostname == docker_services_primary_manager
          ansible.builtin.set_fact:
            timezone: "{{ ansible_facts.timezone | default('Australia/Melbourne') }}"

        - name: Timezone output
          when: inventory_hostname == docker_services_primary_manager
          ansible.builtin.debug:
            msg: "{{ timezone }}"

        - name: Share timezone to all hosts
          when: inventory_hostname != docker_services_primary_manager
          ansible.builtin.set_fact:
            timezone: "{{ hostvars[docker_services_primary_manager].timezone }}"

  tasks:

    ################################
    # OS (CONFIG/SETTINGS)
    ################################

    - name: Include Ubuntu role
      when:
        - ansible_os_family == "Debian"
        - ansible_distribution == "Ubuntu"
      ansible.builtin.include_role:
        name: ubuntu
      tags:
        - ubuntu
        - ubuntu_apt
        - ubuntu_repo
        - ubuntu_venv
        - ubuntu_requirements
        - ubuntu_skynet
        - ubuntu_sysctl
        - ubuntu_pam
        - ubuntu_network
        - ubuntu_netplan

    ################################
    # DOCKER
    ################################

    - name: Include Docker role
      when: "'tags_docker' in group_names"
      ansible.builtin.include_role:
        name: docker
      tags:
        - docker
        - docker_install
        - docker_prune
        - docker_prune_dangling
        - docker_prune_unused
        - docker_prune_volumes
        - docker_prune_timer
        - docker_prune_unraid_user_script
        - docker_swarm
        - docker_swarm_init
        - docker_swarm_join
        - docker_swarm_network

    ################################
    # HUGO (INIT/THEME)
    ################################

    - name: Include Hugo role
      when: inventory_hostname == docker_services_primary_manager
      ansible.builtin.include_role:
        name: hugo
      tags:
        - hugo_bootstrap
        - hugo_submodule

    ################################
    # INFISICAL (STACK)
    ################################

    - name: Include Infisical role
      when: inventory_hostname == docker_services_primary_manager
      ansible.builtin.include_role:
        name: infisical
      tags:
        - infisical_bootstrap
        - infisical_deploy
        - infisical_recreate
        - infisical_remove

    ################################
    # TERRAFORM
    ################################

    - name: Include OpenTofu role
      when: "'tags_opentofu' in group_names"
      ansible.builtin.include_role:
        name: opentofu
      tags:
        - opentofu
        - opentofu_install
        - opentofu_pve_user

    ################################
    # POSTGRES (CLUSTER)
    ################################

    - name: Include Postgres role
      ansible.builtin.include_role:
        name: postgres
      tags:
        - postgres
        - postgres_apt
        - postgres_etcd
        - postgres_etcd_reset
        - postgres_patroni
        - postgres_patroni_reset
        - postgres_backup
        - postgres_restore
        - postgres_admin
        - postgres_admin_uptime_kuma
        - postgres_admin_nuke_node
        - postgres_admin_fix_owner
        - postgres_admin_update_pg_hba

    ################################
    # DOCKER_SERVICES
    ################################

    - name: Load all service definitions from group_vars/all/services/*.yml
      ansible.builtin.include_vars:
        dir: "{{ playbook_dir }}/group_vars/all/services"
        files_matching: ".*\\.ya?ml$"
        ignore_unknown_extensions: true
        extensions: [yml, yaml]
        name: svcfiles
      tags: [deploy, update, remove, recreate, bootstrap]

    - name: Assert svcfiles loaded
      ansible.builtin.assert:
        that:
          - svcfiles is defined
          - (svcfiles | type_debug) == "dict"
          - (svcfiles | length) > 0
        fail_msg: "svcfiles is empty or not a dict. include_vars did not load your service files."
      tags: [deploy, update, remove, recreate, bootstrap]

    - name: Use svcfiles as the services mapping
      ansible.builtin.set_fact:
        services: "{{ svcfiles }}"
      tags: [deploy, update, remove, recreate, bootstrap]

    - name: Process each docker service
      ansible.builtin.include_role:
        name: docker_services
      vars:
        docker_services_service_cfg: "{{ services[item.name] | default({}) }}"
        docker_services_service_target: "{{ item.target | default(omit) }}"
        docker_services_role_prefix: "{{ item.name }}"
        docker_services_service_cfg_found: "{{ (services[item.name] is defined) | bool }}"
      loop: "{{ docker_services }}"
      loop_control:
        label: "{{ item.name }}{{ ':' ~ item.target if item.target is defined else '' }}"
      when:
        - docker_services_service_cfg_found | bool
        - ('all' in (ansible_run_tags | default([])))
          or (ansible_run_tags | length == 0)
          or (item.name in (ansible_run_tags | default([])))
          or ((item.tags | default([])) | intersect(ansible_run_tags | default([])) | length > 0)
      tags: [deploy, update, remove, recreate, bootstrap]

    - name: Deploy all stacks
      when:
        - inventory_hostname == docker_services_primary_manager
        - not (ci_mode | default(false) | bool)
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/roles/docker_services/tasks/deploy/sub_tasks/deploy_all.yml"
        apply:
          tags: [deploy, update, recreate]
      run_once: true
      tags: [deploy, update, recreate]

    ################################
    # TESTING
    ################################

    - name: Test | Include Podman role
      when: inventory_hostname == docker_services_primary_manager
      ansible.builtin.include_role:
        name: podman
      tags:
        - podman
        - podman_install

    - name: Test | Include Infisical Podman role
      when: inventory_hostname == docker_services_primary_manager
      ansible.builtin.include_role:
        name: infisical_podman
      tags:
        - infisical_podman_bootstrap
        - infisical_podman_deploy
        - infisical_podman_recreate
        - infisical_podman_remove
