---

################################
# BOOTSTRAP
################################

- name: Deploy NetBox
  hosts: localhost
  connection: local
  become: true
  gather_facts: false

  vars:
    ansible_python_interpreter: /opt/ansible/ansible-venv/bin/python

    timezone: Australia/Melbourne
    container_host_puid: "1000"
    container_host_pgid: "1000"
    container_host_appdata_root: /opt

    # Docker Swarm node name, not Ansible inventory name.
    netbox_swarm_node_hostname: mgt

  tasks:
    - name: Include NetBox bootstrap role
      ansible.builtin.include_role:
        name: netbox
        apply:
          tags:
            - never
      tags:
        - never
        - netbox_bootstrap
        - netbox_deploy
        - netbox_recreate
        - netbox_remove

################################
# DEPLOY HOMELAB
################################

- name: Deploy homelab services
  hosts: tags_skynet
  become: true
  any_errors_fatal: true
  strategy: linear

  pre_tasks:
    - name: Include runtime-neutral service host contract validation
      ansible.builtin.include_tasks:
        file: tasks/services_host_contract.yml
        apply:
          tags: always
      tags: always

    - name: Include runtime-neutral container host default normalization
      ansible.builtin.include_tasks:
        file: tasks/container_host_defaults.yml
        apply:
          tags: always
      tags: always

    - name: Gather packages
      when: inventory_hostname == services_controller_host
      ansible.builtin.package_facts:
        manager: auto
      tags: always

    - name: Resolve host timezone variable
      tags:
        - infisical_deploy
        - infisical_recreate
        - infisical_podman_deploy
        - infisical_podman_recreate
        - deploy
        - update
        - remove
        - recreate
        - bootstrap
        - drift
        - reconcile
      block:
        - name: Set timezone variable on manager
          when: inventory_hostname == services_controller_host
          ansible.builtin.set_fact:
            timezone: "{{ ansible_facts.timezone | default('Australia/Melbourne') }}"

        - name: Timezone output
          when: inventory_hostname == services_controller_host
          ansible.builtin.debug:
            msg: "{{ timezone }}"

        - name: Share timezone to all hosts
          when: inventory_hostname != services_controller_host
          ansible.builtin.set_fact:
            timezone: "{{ hostvars[services_controller_host].timezone }}"

  tasks:

    ################################
    # TAILSCALE BOOTSTRAP (QEMU AGENT)
    ################################

    - name: Include Tailscale bootstrap role
      when: inventory_hostname == tailscale_bootstrap_proxmox_host
      ansible.builtin.include_role:
        name: tailscale_bootstrap
        apply:
          tags:
            - never
            - tailscale_bootstrap
      tags:
        - never
        - tailscale_bootstrap

    ################################
    # OS (CONFIG/SETTINGS)
    ################################

    - name: Include Ubuntu role
      when:
        - ansible_facts.os_family | default("") == "Debian"
        - ansible_facts.distribution | default("") == "Ubuntu"
      ansible.builtin.include_role:
        name: ubuntu
      tags:
        - ubuntu
        - ubuntu_apt
        - ubuntu_repo
        - ubuntu_venv
        - ubuntu_requirements
        - ubuntu_skynet
        - ubuntu_sysctl
        - ubuntu_pam
        - ubuntu_network
        - ubuntu_netplan

    ################################
    # SYSTEMD-RESOLVED / NSS
    ################################

    - name: Include systemd-resolved role
      when:
        - ansible_facts.os_family | default("") == "Debian"
        - ansible_facts.distribution | default("") == "Ubuntu"
      ansible.builtin.include_role:
        name: resolved
        apply:
          tags: [resolved]
      tags: [resolved]

    ################################
    # DOCKER
    ################################

    - name: Include Docker role
      when: "'tags_docker' in group_names"
      ansible.builtin.include_role:
        name: docker
      tags:
        - docker
        - docker_install
        - docker_prune
        - docker_prune_dangling
        - docker_prune_unused
        - docker_prune_volumes
        - docker_prune_timer
        - docker_prune_unraid_user_script
        - docker_swarm
        - docker_swarm_init
        - docker_swarm_join
        - docker_swarm_network
        - docker_swarm_labels

    ################################
    # PODMAN
    ################################

    - name: Include Podman role
      when: "'tags_podman' in group_names or 'tags_podman_install' in group_names"
      ansible.builtin.include_role:
        name: podman
      tags:
        - podman
        - podman_install

    ################################
    # HUGO (INIT/THEME)
    ################################

    - name: Include Hugo role
      when: inventory_hostname == services_controller_host
      ansible.builtin.include_role:
        name: hugo
      tags:
        - hugo_bootstrap
        - hugo_submodule

    ################################
    # INFISICAL (STACK)
    ################################

    - name: Include Infisical role
      when: inventory_hostname == services_controller_host
      ansible.builtin.include_role:
        name: infisical
      tags:
        - infisical_bootstrap
        - infisical_deploy
        - infisical_recreate
        - infisical_remove

    ################################
    # TERRAFORM
    ################################

    - name: Include OpenTofu role
      when: "'tags_opentofu' in group_names"
      ansible.builtin.include_role:
        name: opentofu
      tags:
        - opentofu
        - opentofu_install
        - opentofu_pve_user

    ################################
    # POSTGRES (CLUSTER)
    ################################

    - name: Include Postgres role
      ansible.builtin.include_role:
        name: postgres
      tags:
        - postgres
        - postgres_apt
        - postgres_etcd
        - postgres_etcd_reset
        - postgres_patroni
        - postgres_patroni_reset
        - postgres_backup
        - postgres_backup_setup
        - postgres_backup_run
        - postgres_restore
        - postgres_admin
        - postgres_admin_uptime_kuma
        - postgres_admin_nuke_node
        - postgres_admin_fix_owner
        - postgres_admin_update_pg_hba

    ################################
    # NODE EXPORTER (MONITORING)
    ################################

    - name: Include Node Exporter role
      when: "'tags_node_exporter' in group_names"
      ansible.builtin.include_role:
        name: node_exporter
        apply:
          tags: [node_exporter]
      tags: [node_exporter]

    ################################
    # KEEPALIVED (DNS VIPS)
    ################################

    - name: Include Keepalived role
      when: "'tags_keepalived' in group_names"
      ansible.builtin.include_role:
        name: keepalived
        apply:
          tags: [keepalived]
      tags: [keepalived]

    ################################
    # TECHNITIUM NATIVE (DNS)
    ################################

    - name: Include Technitium native role
      when: "'tags_technitium_native' in group_names"
      ansible.builtin.include_role:
        name: technitium_native
        apply:
          tags: [technitium_native]
      tags: [technitium_native]

    ################################
    # SERVICE CATALOG (DOCKER + PODMAN)
    ################################

    - name: Load all service definitions from group_vars/all/services/*.yml
      ansible.builtin.include_vars:
        dir: "{{ playbook_dir }}/group_vars/all/services"
        files_matching: ".*\\.ya?ml$"
        ignore_unknown_extensions: true
        extensions: [yml, yaml]
        name: svcfiles
      tags: [deploy, update, remove, recreate, bootstrap, drift]

    - name: Assert svcfiles loaded
      ansible.builtin.assert:
        that:
          - svcfiles is defined
          - (svcfiles | type_debug) == "dict"
          - (svcfiles | length) > 0
        fail_msg: "svcfiles is empty or not a dict. include_vars did not load your service files."
      tags: [deploy, update, remove, recreate, bootstrap, drift]

    - name: Resolve runtime-neutral service controller host
      ansible.builtin.set_fact:
        service_catalog_controller_host: "{{ services_controller_host }}"
      tags: [deploy, update, remove, recreate, bootstrap, drift]

    - name: Validate runtime-neutral service controller host
      ansible.builtin.assert:
        that:
          - service_catalog_controller_host | length > 0
          - service_catalog_controller_host in hostvars
        fail_msg: >-
          The runtime-neutral service controller host must name a host in the current inventory.
      tags: [deploy, update, remove, recreate, bootstrap, drift]

    - name: Build service catalog processing list from service definitions
      when: inventory_hostname == services_controller_host
      ansible.builtin.set_fact:
        service_catalog_effective: >-
          {{ svcfiles | service_catalog_effective(services_controller_host) }}
      tags: [deploy, update, remove, recreate, bootstrap, drift]

    - name: Assert service catalog processing list was built
      when: inventory_hostname == services_controller_host
      ansible.builtin.assert:
        that:
          - service_catalog_effective is defined
          - service_catalog_effective is sequence
          - service_catalog_effective | length > 0
        fail_msg: "service_catalog_effective is empty. No service definitions were discovered."
      tags: [deploy, update, remove, recreate, bootstrap, drift]

    - name: Drift | Initialise image drift summary
      when: inventory_hostname == services_controller_host
      ansible.builtin.set_fact:
        docker_services_image_drift: []
      tags: [drift]

    - name: Build selected service catalog processing list
      when: inventory_hostname == services_controller_host
      ansible.builtin.set_fact:
        service_catalog_selection: >-
          {{
            service_catalog_effective
            | service_catalog_select(
                ansible_run_tags | default([]),
                docker_services_run_all | default(false),
                'remove' in (ansible_run_tags | default([]))
              )
          }}
      tags: [deploy, update, remove, recreate, bootstrap, drift]

    - name: Extract service catalog selection facts
      when: inventory_hostname == services_controller_host
      ansible.builtin.set_fact:
        service_catalog_matched: "{{ service_catalog_selection.matched }}"
        service_catalog_selected: "{{ service_catalog_selection.selected }}"
        service_catalog_disabled_only_selection: "{{ service_catalog_selection.disabled_only }}"
      tags: [deploy, update, remove, recreate, bootstrap, drift]

    - name: Validate selected service dispatch hosts
      when: inventory_hostname == services_controller_host
      ansible.builtin.assert:
        that:
          - service_catalog_dispatch_item.dispatch_host in ansible_play_hosts_all
        fail_msg: >-
          Selected service {{ service_catalog_dispatch_item.name }}{{
            ':' ~ service_catalog_dispatch_item.target
            if service_catalog_dispatch_item.target is defined
            else ''
          }} dispatches to {{ service_catalog_dispatch_item.dispatch_host }},
          which is not present in the current play.
      loop: "{{ service_catalog_selected }}"
      loop_control:
        loop_var: service_catalog_dispatch_item
        label: >-
          {{ service_catalog_dispatch_item.name }}{{
            ':' ~ service_catalog_dispatch_item.target
            if service_catalog_dispatch_item.target is defined
            else ''
          }}
      tags: [deploy, update, remove, recreate, bootstrap, drift]

    - name: Share lightweight service catalog selection with play hosts
      ansible.builtin.set_fact:
        service_catalog_matched: "{{ hostvars[services_controller_host].service_catalog_matched }}"
        service_catalog_selected: "{{ hostvars[services_controller_host].service_catalog_selected }}"
        service_catalog_disabled_only_selection: >-
          {{ hostvars[services_controller_host].service_catalog_disabled_only_selection }}
      tags: [deploy, update, remove, recreate, bootstrap, drift]

    - name: Report disabled service selection in check mode
      when:
        - ansible_check_mode
        - service_catalog_disabled_only_selection | bool
        - inventory_hostname == services_controller_host
      ansible.builtin.debug:
        msg: >-
          Requested service/tag matched only disabled service definitions:
          {{
            service_catalog_matched
            | map(attribute='name')
            | list
            | unique
            | join(', ')
          }}.
          Skipping in check mode.
      tags: [deploy, update, remove, recreate, bootstrap, drift]

    - name: End play for disabled service selection in check mode
      when:
        - ansible_check_mode
        - service_catalog_disabled_only_selection | bool
      ansible.builtin.meta: end_play
      tags: [deploy, update, remove, recreate, bootstrap, drift]

    - name: Assert selected service processing list was built
      ansible.builtin.assert:
        that:
          - service_catalog_selected is defined
          - service_catalog_selected is sequence
          - service_catalog_selected | length > 0
        fail_msg: >-
          No enabled service definitions matched the requested tag(s):
          {{ ansible_run_tags | default([]) | join(', ') }}.
          {{
            'Matching service definitions exist, but they are disabled.'
            if (service_catalog_matched | default([]) | length > 0)
            else
            'No matching service or target definitions were found.'
          }}
      tags: [deploy, update, remove, recreate, bootstrap, drift]

    - name: Process globally ordered service catalog
      ansible.builtin.include_tasks:
        file: tasks/service_catalog_dispatch.yml
        apply:
          tags: [deploy, update, remove, recreate, bootstrap, drift]
      loop: "{{ service_catalog_selected }}"
      loop_control:
        loop_var: service_catalog_dispatch_entry
        label: >-
          {{ service_catalog_dispatch_entry.name }}{{
            ':' ~ service_catalog_dispatch_entry.target
            if service_catalog_dispatch_entry.target is defined
            else ''
          }}
      tags: [deploy, update, remove, recreate, bootstrap, drift]

    - name: Drift | Report image drift summary
      when:
        - inventory_hostname == services_controller_host
        - hostvars[services_controller_host].docker_services_image_drift is defined
        - (hostvars[services_controller_host].docker_services_image_drift | length) > 0
      ansible.builtin.debug:
        msg: |
          Docker image drift detected:
          {% for drift_item in hostvars[services_controller_host].docker_services_image_drift | sort(attribute='label') %}
          - {{ drift_item.label }}
            stack:   {{ drift_item.stack }}
            service: {{ drift_item.service }}
            desired: {{ drift_item.desired }}
            current: {{ drift_item.current }}

          {% endfor %}
      tags: [drift]

    - name: Drift | Resolve notification credentials through common preflight
      ansible.builtin.include_tasks:
        file: tasks/drift_notification_preflight.yml
        apply:
          tags: [drift]
      tags: [drift]

    - name: Drift | Import email notification tasks
      ansible.builtin.import_tasks: "{{ playbook_dir }}/roles/docker_services/tasks/sub_tasks/drift/notify_email.yml"
      tags: [drift]

    - name: Drift | Report no image drift found
      when:
        - inventory_hostname == services_controller_host
        - hostvars[services_controller_host].docker_services_image_drift is not defined
          or (hostvars[services_controller_host].docker_services_image_drift | length) == 0
      ansible.builtin.debug:
        msg: "No Docker service image drift detected."
      tags: [drift]

    - name: Deploy all Docker stacks
      no_log: true
      when:
        - inventory_hostname == services_controller_host
        - not ansible_check_mode
        - >-
          (
            service_catalog_selected
            | service_catalog_by_runtime('docker')
            | length
          ) > 0
        - not (ci_mode | default(false) | bool)
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/roles/docker_services/tasks/sub_tasks/deploy/all.yml"
        apply:
          tags: [deploy, update, recreate]
          no_log: true
          diff: false
      tags: [deploy, update, recreate]
