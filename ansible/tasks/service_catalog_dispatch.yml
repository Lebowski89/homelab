---

- name: Service catalog dispatch | Reset host-local materialized result
  ansible.builtin.set_fact:
    service_catalog_host_materialized: []
    service_firewall_access_stage_progress: {}
    service_catalog_firewall_handoff: ""

- name: Service catalog dispatch | Materialize selected entry on dispatch host
  when: inventory_hostname in (service_catalog_dispatch_entry.dispatch_hosts | default([service_catalog_dispatch_entry.dispatch_host]))
  service_catalog_materialize:
    source_var: svcfiles
    selected:
      - "{{ service_catalog_dispatch_entry }}"
  register: service_catalog_materialize_result

- name: Service catalog dispatch | Copy returned materialized entry
  when: inventory_hostname in (service_catalog_dispatch_entry.dispatch_hosts | default([service_catalog_dispatch_entry.dispatch_host]))
  ansible.builtin.set_fact:
    service_catalog_host_materialized: >-
      {{ service_catalog_materialize_result.ansible_facts.service_catalog_host_materialized }}

- name: Service catalog dispatch | Validate single materialized entry
  when: inventory_hostname in (service_catalog_dispatch_entry.dispatch_hosts | default([service_catalog_dispatch_entry.dispatch_host]))
  ansible.builtin.assert:
    that:
      - service_catalog_host_materialized is sequence
      - service_catalog_host_materialized | length == 1
      - service_catalog_host_materialized[0].config is mapping
    fail_msg: >-
      Selective materialization for {{ service_catalog_dispatch_entry.name }}{{
        ':' ~ service_catalog_dispatch_entry.target
        if service_catalog_dispatch_entry.target is defined
        else ''
      }} did not return exactly one concrete configuration.

# Until an adapter accepts this token, dispatch owns preflight cancellation.
# This also covers failures while copying configuration into the adapter.
- name: Service catalog dispatch | Prepare and hand off the selected service
  tags: [deploy, update, remove, recreate, bootstrap, drift]
  block:
    - name: Service catalog dispatch | Run common service preflight
      when:
        - inventory_hostname == service_catalog_dispatch_entry.dispatch_host
        - service_catalog_dispatch_entry.runtime != "native"
      ansible.builtin.include_tasks:
        file: service_catalog_common_preflight.yml
        apply:
          tags: [deploy, update, remove, recreate, bootstrap, drift]
      vars:
        service_catalog_materialized_service: "{{ service_catalog_host_materialized[0] }}"
        service_catalog_execution_only: >-
          {{ (podman_services_prepare_execution_only | default(false))
             if service_catalog_dispatch_entry.runtime == 'podman' else false }}
      tags: [deploy, update, remove, recreate, bootstrap, drift]

    - name: Service catalog dispatch | Process native entry on each selected host
      when:
        - service_catalog_dispatch_entry.runtime == "native"
        - inventory_hostname in service_catalog_dispatch_entry.dispatch_hosts
      ansible.builtin.include_role:
        name: native_services
        defaults_from: "{{ service_catalog_host_materialized[0].config.native.application }}"
        handlers_from: "{{ service_catalog_host_materialized[0].config.native.application }}"
        apply:
          tags: [deploy, update, remove, recreate, alloy_native, node_exporter, keepalived, technitium_native]
      vars:
        native_services_entry: "{{ service_catalog_host_materialized[0] }}"
        native_services_action: "{{ service_catalog_action }}"
      tags: [deploy, update, remove, recreate, alloy_native, node_exporter, keepalived, technitium_native]

    - name: Service catalog dispatch | Process Docker entry
      when:
        - inventory_hostname == service_catalog_dispatch_entry.dispatch_host
        - service_catalog_dispatch_entry.runtime == "docker"
      ansible.builtin.include_tasks:
        file: service_catalog_dispatch_docker.yml
        apply:
          tags: [deploy, update, remove, recreate, bootstrap, drift]
      vars:
        service_catalog_docker_service: "{{ service_catalog_host_materialized[0] }}"
        service_catalog_docker_common_context: "{{ service_catalog_common_context }}"
      tags: [deploy, update, remove, recreate, bootstrap, drift]

    - name: Service catalog dispatch | Process Podman entry
      when:
        - inventory_hostname == service_catalog_dispatch_entry.dispatch_host
        - service_catalog_dispatch_entry.runtime == "podman"
      ansible.builtin.include_tasks:
        file: service_catalog_dispatch_podman.yml
        apply:
          tags: [deploy, update, remove, recreate, bootstrap, drift]
      vars:
        service_catalog_podman_service: "{{ service_catalog_host_materialized[0] }}"
        service_catalog_podman_common_context: "{{ service_catalog_common_context }}"
      tags: [deploy, update, remove, recreate, bootstrap, drift]
  rescue:
    - name: Service catalog dispatch | Save the original failure without sensitive values
      no_log: true
      diff: false
      ansible.builtin.set_fact:
        service_catalog_preflight_failure:
          task: "{{ ansible_failed_task.name }}"
          rc: "{{ ansible_failed_result.rc | default(1) }}"

    - name: Service catalog dispatch | Cancel provider reservations before adapter handoff
      when:
        - service_firewall_access_stage_progress.token | default('') | length > 0
        - service_catalog_firewall_handoff != service_firewall_access_stage_progress.token
      ansible.builtin.include_role:
        name: service_firewall
        tasks_from: access_cancel
        apply:
          tags: [always]
      vars:
        service_firewall_access_cancel_plan: "{{ service_firewall_access_stage_progress.plan }}"
        service_firewall_access_cancel_hosts: "{{ service_firewall_access_stage_progress.attempted_hosts }}"

    - name: Service catalog dispatch | Preserve the original service failure
      ansible.builtin.fail:
        msg: >-
          Service operation failed at {{ service_catalog_preflight_failure.task }}
          (status {{ service_catalog_preflight_failure.rc }}); see the original failure above.
          Any retained provider reservations and their recovery action are reported separately.
