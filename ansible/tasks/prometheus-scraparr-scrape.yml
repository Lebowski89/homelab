---

- name: Prometheus scrape | Require the single inventory controller
  ansible.builtin.assert:
    that:
      - groups[services_controller_inventory_group] | length == 1
      - local_ip is defined
      - container_host_appdata_root is defined
- name: Prometheus scrape | Resolve the inventory controller
  ansible.builtin.set_fact:
    services_controller_host: '{{ groups[services_controller_inventory_group][0] }}'
- name: Prometheus scrape | Load only canonical declarations without secrets
  ansible.builtin.include_vars:
    file: 'group_vars/all/services/{{ docker_services_prometheus_definition }}.yml'
    name: 'docker_services_{{ docker_services_prometheus_definition }}_catalog'
  loop: [prometheus, scraparr]
  loop_control:
    loop_var: docker_services_prometheus_definition
- name: Prometheus scrape | Require the canonical private publication
  ansible.builtin.assert:
    that:
      - docker_services_scraparr_catalog.scraparr.ports.backend.published == 17100
      - docker_services_scraparr_catalog.scraparr.ports.backend.target == 7100
- name: Prometheus scrape | Use the existing guarded reload and scoped rollback
  ansible.builtin.include_role:
    name: docker_services
    tasks_from: sub_tasks/prometheus_alertmanager_routes
  vars:
    docker_services_prometheus_routes_kind: scraparr
