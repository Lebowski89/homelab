---

- name: Loki routes | Require the single inventory controller and current contracts
  ansible.builtin.assert:
    that:
      - groups[services_controller_inventory_group] | length == 1
      - local_ip is defined
      - container_host_appdata_root is defined
      - services_internal_zone is defined
      - services_private_https_port is defined
- name: Loki routes | Resolve only the controller
  ansible.builtin.set_fact:
    services_controller_host: '{{ groups[services_controller_inventory_group][0] }}'
- name: Loki routes | Load the canonical declaration without secret resolution
  ansible.builtin.include_vars:
    file: group_vars/all/services/loki.yml
    name: docker_services_loki_catalog
- name: Loki routes | Configure only the existing named Swarm writer
  ansible.builtin.include_role:
    name: docker_services
    tasks_from: sub_tasks/loki_alertmanager_route
