---
- name: Recovery target | Require one explicitly selected remote application host
  ansible.builtin.assert:
    that:
      - recovery_application_host is defined
      - recovery_application_host is string
      - recovery_application_host | length > 0
      - inventory_hostname == recovery_application_host
      - ansible_play_hosts_all | length == 1
      - inventory_hostname not in ['localhost', '127.0.0.1', '::1']
      - ansible_connection | default('ssh') in ['ssh', 'paramiko']
      - ansible_host | default(inventory_hostname) not in ['localhost', '::1']
      - not (ansible_host | default(inventory_hostname) is match('^127[.]'))
    fail_msg: >-
      Recovery requires one explicit remote SSH application host and its managed-host
      variables. Local transport and loopback targets are forbidden.
  become: false

- name: Recovery target | Require managed-host addressing and placement
  ansible.builtin.assert:
    that:
      - local_ip is defined
      - container_host_appdata_root is defined
      - container_host_puid is defined
      - container_host_pgid is defined
      - services_internal_zone is defined
      - services_private_https_port is defined
    fail_msg: Provide the application's existing managed-host configuration; workstation paths are not deployment defaults.
  become: false
