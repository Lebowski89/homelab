---

- name: Refuse inventory discovery and unowned targets before any connection
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  any_errors_fatal: true
  tags: always
  tasks:
    - name: VM tests | Require the current run and exactly one disposable subject
      ansible.builtin.assert:
        that:
          - molecule_vm_run_id | default('') is match('^[a-f0-9]{32}$')
          - molecule_vm_platform | default('') in molecule_vm_images | default({})
          - groups.get('molecule_guests', []) == ['subject']
          - groups.get('molecule_peers', []) == []
          - groups.get('all', []) | difference(['localhost']) | sort == groups.molecule_guests | sort
          - groups.get('tags_skynet', []) == ['subject']
        fail_msg: Supply only the isolated inventory and current-run variables from the disposable VM controller.

    - name: VM tests | Require explicitly disposable SSH targets
      ansible.builtin.assert:
        that:
          - hostvars[molecule_vm_guest].molecule_vm_disposable | default(false) is sameas true
          - hostvars[molecule_vm_guest].ansible_connection | default('') == 'ssh'
          - hostvars[molecule_vm_guest].ansible_user | default('') | length > 0
          - hostvars[molecule_vm_guest].ansible_host | default('') | length > 0
          - hostvars[molecule_vm_guest].ansible_host not in ['localhost', '127.0.0.1', '::1']
      loop: "{{ groups.molecule_guests }}"
      loop_control:
        loop_var: molecule_vm_guest

- name: Verify exact guest ownership and platform before mutation
  hosts: molecule_guests
  become: true
  gather_facts: false
  any_errors_fatal: true
  tags: always
  tasks:
    - name: VM tests | Gather explicit facts
      ansible.builtin.setup:

    - name: VM tests | Require the selected conventional AMD64 systemd platform
      vars:
        molecule_vm_image: '{{ molecule_vm_images[molecule_vm_platform] }}'
      ansible.builtin.assert:
        that:
          - ansible_facts.system == 'Linux'
          - ansible_facts.architecture == 'x86_64'
          - ansible_facts.distribution == molecule_vm_image.distribution
          - ansible_facts.distribution_version is version(molecule_vm_image.version, '>=')
          - ansible_facts.distribution_version.split('.')[:molecule_vm_image.version.split('.') | length] == molecule_vm_image.version.split('.')
          - ansible_facts.distribution_major_version == molecule_vm_image.version.split('.')[0]
          - ansible_facts.pkg_mgr == molecule_vm_image.package_manager
          - ansible_facts.service_mgr == 'systemd'
          - ansible_facts.virtualization_role == 'guest'
          - ansible_facts.virtualization_type in ['kvm', 'qemu']
          - not molecule_vm_image.selinux or ansible_facts.selinux.mode | default('') == 'enforcing'

    - name: VM tests | Inspect the run marker and reject OSTree
      ansible.builtin.stat:
        path: '{{ molecule_vm_guard_path }}'
        follow: false
      loop: [/var/lib/homelab-molecule-vm, /run/ostree-booted]
      loop_control:
        loop_var: molecule_vm_guard_path
      register: molecule_vm_guard_files

    - name: VM tests | Require a root-owned regular marker
      ansible.builtin.assert:
        that:
          - molecule_vm_guard_files.results[0].stat.isreg | default(false)
          - not (molecule_vm_guard_files.results[0].stat.islnk | default(false))
          - molecule_vm_guard_files.results[0].stat.uid == 0
          - molecule_vm_guard_files.results[0].stat.mode == '0600'
          - not molecule_vm_guard_files.results[1].stat.exists

    - name: VM tests | Read the provisioned run identity
      ansible.builtin.slurp:
        src: /var/lib/homelab-molecule-vm
      register: molecule_vm_marker

    - name: VM tests | Refuse guests from another run
      ansible.builtin.assert:
        that: molecule_vm_marker.content | b64decode == molecule_vm_run_id ~ '\n'
