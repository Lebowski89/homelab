---

prerun: false

dependency:
  name: galaxy
  enabled: false

ansible:
  executor:
    backend: ansible-playbook
    args:
      ansible_playbook:
        # Molecule executes playbooks from this scenario directory.
        - --inventory=${HOMELAB_MOLECULE_INVENTORY:-inventory/hosts.yml}
        - --tags=node_exporter
        - --extra-vars=@${MOLECULE_SCENARIO_DIRECTORY}/vars/main.yml
  env:
    ANSIBLE_INJECT_FACT_VARS: 'false'
  cfg:
    defaults:
      roles_path: ${MOLECULE_PROJECT_DIRECTORY}/ansible/roles
      action_plugins: ${MOLECULE_PROJECT_DIRECTORY}/ansible/action_plugins
      filter_plugins: ${MOLECULE_PROJECT_DIRECTORY}/ansible/filter_plugins
      collections_path: ${MOLECULE_PROJECT_DIRECTORY}/ansible/collections:~/.ansible/collections:~/.local/share/homelab/collections
      host_key_checking: true
      inject_facts_as_vars: false
      # Avoid automatic application group_vars/vault loading on a test target.
      precedence: all_inventory,groups_inventory
    inventory:
      enable_plugins: yaml,ini,host_list
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    side_effect: seed.yml
    verify: verify.yml
    cleanup: cleanup.yml
    # Molecule may invoke destroy automatically after a failed test.
    destroy: destroy.yml

scenario:
  # The operator supplies a disposable VM. No provider create/destroy actions.
  create_sequence: [prepare]
  converge_sequence: [converge]
  check_sequence: [syntax, check]
  syntax_sequence: [syntax]
  destroy_sequence: []
  test_sequence:
    - syntax
    - prepare
    - check
    - verify verify_fresh.yml
    - converge
    - side_effect
    - verify
    - idempotence
    - verify
    - cleanup
