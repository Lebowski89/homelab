---

- name: Validate the isolated inventory and guest
  ansible.builtin.import_playbook: guard.yml

- name: Verify the real Node Exporter service
  hosts: molecule_node_exporter
  become: true
  gather_facts: false
  any_errors_fatal: true
  tags: always
  tasks:
    - name: Molecule | Read the running service identity
      ansible.builtin.command:
        argv: [systemctl, show, node_exporter.service, "--property=MainPID,InvocationID,ActiveState"]
      changed_when: false
      register: molecule_node_exporter_invocation

    - name: Molecule | Require a running service with an invocation identity
      ansible.builtin.assert:
        that:
          - "'ActiveState=active' in molecule_node_exporter_invocation.stdout_lines"
          - molecule_node_exporter_invocation.stdout is search('(?m)^MainPID=[1-9][0-9]*$')
          - molecule_node_exporter_invocation.stdout is search('(?m)^InvocationID=[a-f0-9]{32}$')

    - name: Molecule | Retain the first invocation on the controller
      ansible.builtin.copy:
        dest: '{{ (molecule_vm_evidence_directory | default(molecule_ephemeral_directory)) }}/node-exporter-invocation'
        content: '{{ molecule_node_exporter_invocation.stdout }}'
        force: false
        mode: '0600'
      delegate_to: localhost
      become: false

    - name: Molecule | Read the first invocation snapshot
      ansible.builtin.slurp:
        src: '{{ (molecule_vm_evidence_directory | default(molecule_ephemeral_directory)) }}/node-exporter-invocation'
      delegate_to: localhost
      become: false
      register: molecule_node_exporter_first_invocation

    - name: Molecule | Require idempotence to preserve the service process
      ansible.builtin.assert:
        that: molecule_node_exporter_invocation.stdout == molecule_node_exporter_first_invocation.content | b64decode

    - name: Molecule | Require boot enablement
      ansible.builtin.command:
        argv: [systemctl, is-enabled, node_exporter.service]
      changed_when: false
      register: molecule_node_exporter_enabled
      failed_when: molecule_node_exporter_enabled.stdout != 'enabled'

    - name: Molecule | Inspect actual listening sockets
      community.general.listen_ports_facts:
        command: ss

    - name: Molecule | Require an exclusively loopback metrics listener
      vars:
        molecule_node_exporter_listeners: >-
          {{ ansible_facts.tcp_listen | selectattr('port', 'equalto', 19100) | list }}
      ansible.builtin.assert:
        that:
          - molecule_node_exporter_listeners | length > 0
          - molecule_node_exporter_listeners | map(attribute='address') | unique | list == ['127.0.0.1']

    - name: Molecule | Query metrics through the guest loopback listener
      # checkov:skip=CKV2_ANSIBLE_1:Guest loopback-only metrics listener is explicitly verified as 127.0.0.1; no credentials or remote TLS endpoint.
      ansible.builtin.uri:
        url: 'http://{{ node_exporter_listen_address }}/metrics'
        return_content: true
        use_proxy: false
        status_code: 200
      register: molecule_node_exporter_metrics
      until: molecule_node_exporter_metrics is succeeded
      retries: 10
      delay: 2

    - name: Molecule | Require actual build and host metrics
      ansible.builtin.assert:
        that:
          - molecule_node_exporter_metrics.content is search('(?m)^node_exporter_build_info[{]')
          - molecule_node_exporter_metrics.content is search('(?m)^node_uname_info[{]')
          - molecule_node_exporter_metrics.content is search('(?m)^homelab_molecule_node_exporter 1$')

    - name: Molecule | Read the actual installed release
      ansible.builtin.command:
        argv: [/usr/local/bin/node_exporter, --version]
      changed_when: false
      register: molecule_node_exporter_release

    - name: Molecule | Retain exact guest and runtime version evidence
      ansible.builtin.copy:
        dest: '{{ (molecule_vm_evidence_directory | default(molecule_ephemeral_directory)) }}/versions.json'
        content: >-
          {{ {'distribution': ansible_facts.distribution, 'version': ansible_facts.distribution_version,
              'kernel': ansible_facts.kernel, 'architecture': ansible_facts.architecture,
              'selinux': ansible_facts.selinux.mode | default('disabled'),
              'vcpus': ansible_facts.processor_vcpus, 'memory_mb': ansible_facts.memtotal_mb,
              'node_exporter': molecule_node_exporter_release.stdout ~ molecule_node_exporter_release.stderr} | to_json }}
        mode: '0600'
      delegate_to: localhost
      become: false
