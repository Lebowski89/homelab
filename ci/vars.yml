---

ci_mode: true
ci_service_blocks:
  - services_00_ci
deploy_deferred: true

docker_network: overlay
puid: "1000"
pgid: "1000"
cloudflare_zone: example.com
traefik_dynamic_dir: "{{ playbook_dir }}/.ci_out/traefik_dynamic"

docker_services:
  - name: demo_targets
    target: swarm
  - name: demo_compose
    target: swarm
  - name: demo_traefik
    target: swarm

services_00_ci:
  demo_targets:
    name: demo_targets
    stack: ci
    image: "alpine:3.23"
    deploy:
      type: swarm
      host: localhost
      constraints:
        - "node.labels.ansible_host == localhost"
    targets:
      swarm:
        environment:
          FOO: "from-swarm-target"
      container:
        environment:
          FOO: "from-container-target"
    cleanup:
      enable: false

  demo_compose:
    name: demo_compose
    stack: ci
    image: "nginx:1.29-alpine"
    deploy:
      type: swarm
      host: localhost
      replicas: 1
      constraints:
        - "node.labels.ansible_host == localhost"
    cleanup:
      enable: false
    named_networks:
      overlay: true
    named_volumes:
      demo_data: true
    networks:
      - overlay
    ports:
      web:
        target: 80
        published: 8088
        protocol: tcp
        mode: host
    environment:
      TZ: "Australia/Melbourne"
      DEMO: "true"
    volumes:
      demo_data:
        type: volume
        source: demo_data
        target: /usr/share/nginx/html
        read_only: false
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1"]
      interval: "1m"
      timeout: "15s"
      retries: 3
      start_period: "30s"
    labels:
      com.example.ci: "true"

  demo_traefik:
    name: demo_traefik
    stack: ci
    image: "traefik/whoami:v1.11.0"
    deploy:
      type: swarm
      host: localhost
      replicas: 1
      constraints:
        - "node.labels.ansible_host == localhost"
    cleanup:
      enable: false
    ports:
      web:
        target: 80
    traefik:
      enable: true
      subdomain: demo
      zone: example.com
      port: 80
      sso: ""   # keep off in CI
      internal_api: true
      internal_api_rules:
        - "PathPrefix(`/api`)"
        - "PathRegexp(`/[0-9]+/api`)"