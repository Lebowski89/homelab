---

- name: CI role test
  hosts: all
  gather_facts: false
  vars_files:
    - vars.yml
  tags: [ci]

  tasks:
    - name: CI | Render/validate services using docker_services role
      ansible.builtin.include_role:
        name: docker_services
        apply:
          tags: "{{ [item.name] + (item.tags | default([])) }}"
      vars:
        docker_services_matches: >-
          {{
            (
              ci_service_blocks | default([])
              | map('extract', hostvars[inventory_hostname])
              | map('default', {})
              | select('mapping')
              | map('extract', item.name)
              | select('defined')
              | list
            )
          }}
        docker_services_service_cfg: "{{ docker_services_matches | last | default({}, true) }}"
        docker_services_role_prefix: "{{ item.name }}"
        docker_services_service_target: "{{ item.target | default('swarm') }}"
      when:
        - docker_services_matches | length > 0
        - (ansible_run_tags | length == 0)
          or (item.name in ansible_run_tags)
          or ((item.tags | default([])) | intersect(ansible_run_tags) | length > 0)
      loop: "{{ docker_services }}"
      loop_control:
        label: "{{ item.name }}"
      tags: always

    - name: CI | Assert docker_services_compose_stacks is present
      when: inventory_hostname == "localhost"
      ansible.builtin.assert:
        that:
          - docker_services_compose_stacks is defined
          - docker_services_compose_stacks is mapping
      tags: always
