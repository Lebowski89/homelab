---

- name: Deploy homelab services
  hosts: skynet
  become: true

  vars:
    docker_services:
      ## services (core)
      - name: gitea
        tags: [apps, gitea]
      - name: homepage
        tags: [apps, homepage]
      - name: portainer
        tags: [apps, portainer]
      - name: portainer_agent
        tags: [apps, portainer]
      - name: technitium
        tags: [apps, technitium]
      - name: vaultwarden
        tags: [apps, vaultwarden]

      ## services (proxy)
      - name: authelia
        tags: [proxy, authelia]
      - name: authelia_redis
        tags: [proxy, authelia-redis]
      - name: traefik
        tags: [proxy, traefik]

      ## services (arrs)
      - name: bazarr
        tags: [arrs, bazarr]
      - name: lidarr
        tags: [arrs, lidarr]
      - name: prowlarr
        tags: [arrs, prowlarr]
      - name: radarr
        target: radarr
        tags: [arrs, radarr]
      - name: radarr
        target: radarr_4k
        tags: [arrs, radarr]
      - name: recyclarr
        tags: [arrs, recyclarr]
      - name: sonarr
        target: sonarr
        tags: [arrs, sonarr]
      - name: sonarr
        target: sonarr_4k
        tags: [arrs, sonarr]
      - name: sportarr
        tags: [sportarr]
      - name: whisparr
        tags: [arrs, whisparr]

      ## services (media)
      - name: autobrr
        tags: [media, autobrr]
      - name: jellyseerr
        tags: [media, jellyseerr]
      - name: ombi
        tags: [media, ombi]
      - name: stash
        tags: [media, stash]
      - name: thelounge
        tags: [media, thelounge]
      - name: znc
        tags: [media, znc]

      ## services (plex)
      - name: autopulse
        tags: [plex, autopulse]
      - name: autopulse_ui
        tags: [plex, autopulse]
      - name: imagemaid
        tags: [plex, imagemaid]
      - name: kometa
        tags: [plex, kometa]
      - name: plex
        tags: [plex, plex_server]
      - name: tautulli
        tags: [plex, tautulli]

      ## services (torrents)
      - name: qbittorrent
        target: unraid
        tags: [torrents, qbittorrent]
      - name: qbittorrent
        target: unraid_xs
        tags: [torrents, qbittorrent]
      - name: qbit_manage
        target: swarm
        tags: [torrents, qbit_manage]
      - name: qbit_manage
        target: unraid
        tags: [torrents, qbit_manage]
      - name: qui
        tags: [torrents, qui]
      - name: unpackerr
        tags: [torrents, unpackerr]

      ## services (usenet)
      - name: nzbhydra2
        tags: [usenet, nzbhydra2]
      - name: sabnzbd
        tags: [usenet, sabnzbd]

      ## services (monitoring)
      - name: alloy
        tags: [monitoring, alloy]
      - name: grafana
        tags: [monitoring, grafana]
      - name: prometheus
        tags: [monitoring, prometheus]

      ## services (blog)
      - name: hugo
        tags: [blog, hugo]
      - name: obsidian
        tags: [blog, obsidian]

      ## services (gluetun)
      - name: gluetun
        tags: [gluetun]
      - name: jdownloader2
        tags: [gluetun, jdownloader2]
      - name: librewolf
        tags: [gluetun, librewolf]

      ## services (utilities)
      - name: adminer
        tags: [utilities, adminer]
      - name: czkawka
        tags: [utilities, czkawka]
      - name: themepark
        tags: [utilities, themepark]

      ## services (postgres cluster)
      - name: etcd
        target: pg01
        tags: [pgha, etcd, pg01]
      - name: etcd
        target: pg02
        tags: [pgha, etcd, pg02]
      - name: etcd
        target: pg03
        tags: [pgha, etcd, pg03]
      - name: spilo
        target: pg01
        tags: [pgha, spilo, pg01]
      - name: spilo
        target: pg02
        tags: [pgha, spilo, pg02]
      - name: spilo
        target: pg03
        tags: [pgha, spilo, pg03]
      - name: haproxy
        tags: [pgha, haproxy]

      ## services (unifi)
      - name: unifi_db
        tags: [apps, unifi, unifi_db]
      - name: unifi
        tags: [apps, unifi]

  pre_tasks:
    - name: Gather packages
      when: inventory_hostname == "localhost"
      ansible.builtin.package_facts:
        manager: auto
      tags: always

    - name: Gather IP geolocation data
      when: inventory_hostname == "localhost"
      community.general.ipinfoio_facts:
      tags: always

    - name: Gather public IP data
      when: inventory_hostname == "localhost"
      community.general.ipify_facts:
        api_url: https://api64.ipify.org
        timeout: 20
      register: public_ip
      tags: always

    - name: Public IP output
      when: inventory_hostname == "localhost"
      ansible.builtin.debug:
        msg: '{{ ipify_public_ip }}'
      tags: always

    - name: Set Public IP
      when: inventory_hostname == "localhost"
      ansible.builtin.set_fact:
        public_ip: '{{ ipify_public_ip }}'
      tags: always

    - name: Set timezone variable
      when: inventory_hostname == "localhost"
      ansible.builtin.set_fact:
        timezone: '{{ ansible_facts.timezone }}'
      tags: always

    - name: Timezone output
      when: inventory_hostname == "localhost"
      ansible.builtin.debug:
        msg: '{{ timezone }}'
      tags: always

    - name: Share localhost timezone to all hosts
      when: inventory_hostname != "localhost"
      ansible.builtin.set_fact:
        timezone: "{{ hostvars['localhost'].timezone }}"
      tags: always

  tasks:
    - name: Load all service definitions from group_vars/all/services/*.yml
      ansible.builtin.include_vars:
        dir: "{{ playbook_dir }}/group_vars/all/services"
        files_matching: ".*\\.ya?ml$"
        ignore_unknown_extensions: true
        extensions: [yml, yaml]
        name: svcfiles
      tags: always

    - name: Assert svcfiles loaded
      ansible.builtin.assert:
        that:
          - svcfiles is defined
          - (svcfiles | type_debug) == 'dict'
          - (svcfiles | length) > 0
        fail_msg: "svcfiles is empty or not a dict. include_vars did not load your service files."
      tags: always

    - name: Use svcfiles as the services mapping
      ansible.builtin.set_fact:
        services: "{{ svcfiles }}"
      tags: always

    - name: Process each docker service
      ansible.builtin.include_role:
        name: docker_services
        apply:
          tags: "{{ [item.name] + (item.tags | default([])) }}"
      vars:
        docker_services_deploy_deferred: true
        docker_services_service_cfg_found: "{{ services[item.name] is defined }}"
        docker_services_service_cfg: "{{ services[item.name] }}"
        docker_services_role_prefix: "{{ item.name }}"
        docker_services_service_target: "{{ item.target | default('swarm') }}"
      when:
        - docker_services_service_cfg_found | bool
        - ('all' in (ansible_run_tags | default([])))
          or (ansible_run_tags | length == 0)
          or (item.name in (ansible_run_tags | default([])))
          or ((item.tags | default([])) | intersect(ansible_run_tags | default([])) | length > 0)
      loop: "{{ docker_services }}"
      loop_control:
        label: "{{ item.name }}"
      tags: always

    - name: Deploy all stacks
      when:
        - inventory_hostname == "localhost"
        - not (ci_mode | default(false) | bool)
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/roles/docker_services/helpers/deploy/deploy_all.yml"
        apply:
          tags:
            - always
      run_once: true
      tags: always
