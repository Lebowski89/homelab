---

- name: Deploy homelab services
  hosts: skynet
  become: true

  vars:
    docker_services:
      ## services (core)
      - name: gitea
        tags: [apps, gitea]
      - name: homepage
        tags: [apps, homepage]
      - name: portainer
        tags: [apps, portainer]
      - name: portainer_agent
        tags: [apps, portainer]
      - name: technitium
        tags: [apps, technitium]
      - name: vaultwarden
        tags: [apps, vaultwarden]

      ## services (proxy)
      - name: authelia
        tags: [apps, proxy, authelia]
      - name: authelia_redis
        tags: [apps, proxy, authelia-redis]
      - name: traefik
        tags: [apps, proxy, traefik]

      ## services (arrs)
      - name: bazarr
        tags: [apps, arrs, bazarr]
      - name: lidarr
        tags: [apps, arrs, lidarr]
      - name: prowlarr
        tags: [apps, arrs, prowlarr]
      - name: radarr
        target: radarr
        tags: [apps, arrs, radarr]
      - name: radarr
        target: radarr_4k
        tags: [apps, arrs, radarr]
      - name: recyclarr
        tags: [apps, arrs, recyclarr]
      - name: sonarr
        target: sonarr
        tags: [apps, arrs, sonarr]
      - name: sonarr
        target: sonarr_4k
        tags: [apps, arrs, sonarr]
      - name: sportarr
        tags: [apps, arrs, sportarr]
      - name: whisparr
        tags: [apps, arrs, whisparr]

      ## services (media)
      - name: autobrr
        tags: [apps, media, autobrr]
      - name: jellyseerr
        tags: [apps, media, jellyseerr]
      - name: ombi
        tags: [apps, media, ombi]
      - name: stash
        tags: [apps, media, stash]
      - name: thelounge
        tags: [apps, media, thelounge]
      - name: znc
        tags: [apps, media, znc]

      ## services (plex)
      - name: autopulse
        tags: [apps, plex, autopulse]
      - name: autopulse_ui
        tags: [apps, plex, autopulse]
      - name: imagemaid
        tags: [apps, plex, imagemaid]
      - name: kometa
        tags: [apps, plex, kometa]
      - name: plex
        tags: [apps, plex, plex_server]
      - name: tautulli
        tags: [apps, plex, tautulli]

      ## services (torrents)
      - name: qbittorrent
        target: downloads
        tags: [torrents, qbittorrent]
      - name: qbittorrent
        target: seeds
        tags: [torrents, qbittorrent]
      - name: qbit_manage
        target: downloads
        tags: [torrents, qbit_manage]
      - name: qbit_manage
        target: seeds
        tags: [torrents, qbit_manage]
      - name: qui
        tags: [torrents, qui]
      - name: unpackerr
        tags: [torrents, unpackerr]

      ## services (usenet)
      - name: nzbhydra2
        tags: [apps, usenet, nzbhydra2]
      - name: sabnzbd
        tags: [apps, usenet, sabnzbd]

      ## services (monitoring)
      - name: alloy
        tags: [apps, monitoring, alloy]
      - name: grafana
        tags: [apps, monitoring, grafana]
      - name: prometheus
        tags: [apps, monitoring, prometheus]

      ## services (blog)
      - name: hugo
        tags: [apps, blog, hugo]
      - name: obsidian
        tags: [apps, blog, obsidian]

      ## services (gluetun)
      - name: gluetun
        tags: [apps, gluetun]
      - name: jdownloader2
        tags: [apps, gluetun, jdownloader2]
      - name: librewolf
        tags: [apps, gluetun, librewolf]

      ## services (utilities)
      - name: adminer
        tags: [apps, utilities, adminer]
      - name: czkawka
        tags: [apps, utilities, czkawka]
      - name: themepark
        tags: [apps, utilities, themepark]

      ## services (postgres cluster)
      - name: etcd
        target: pg01
        tags: [pgha, etcd, pg01]
      - name: etcd
        target: pg02
        tags: [pgha, etcd, pg02]
      - name: etcd
        target: pg03
        tags: [pgha, etcd, pg03]
      - name: spilo
        target: pg01
        tags: [pgha, spilo, pg01]
      - name: spilo
        target: pg02
        tags: [pgha, spilo, pg02]
      - name: spilo
        target: pg03
        tags: [pgha, spilo, pg03]
      - name: haproxy
        tags: [pgha, haproxy]

      ## services (unifi)
      - name: unifi_db
        tags: [apps, unifi, unifi-db]
      - name: unifi
        tags: [apps, unifi]

  pre_tasks:
    - name: Gather packages
      when: inventory_hostname == "localhost"
      ansible.builtin.package_facts:
        manager: auto
      tags: always

    - name: Set timezone variable
      when: inventory_hostname == "localhost"
      ansible.builtin.set_fact:
        timezone: "{{ ansible_facts.timezone | default('Australia/Melbourne') }}"
      tags: always

    - name: Timezone output
      when: inventory_hostname == "localhost"
      ansible.builtin.debug:
        msg: '{{ timezone }}'
      tags: always

    - name: Share localhost timezone to all hosts
      when: inventory_hostname != "localhost"
      ansible.builtin.set_fact:
        timezone: "{{ hostvars['localhost'].timezone }}"
      tags: always

    - name: Ensure skynet script is executable
      when: inventory_hostname == "localhost"
      ansible.builtin.file:
        path: "{{ playbook_dir }}/skynet"
        mode: "0755"
        state: file
      tags: always

    - name: Create skynet symlink in /usr/local/bin
      when: inventory_hostname == "localhost"
      become: true
      ansible.builtin.file:
        src: "{{ playbook_dir }}/skynet"
        dest: /usr/local/bin/skynet
        state: link
        force: true
      tags: always

  tasks:
    - name: Load all service definitions from group_vars/all/services/*.yml
      ansible.builtin.include_vars:
        dir: "{{ playbook_dir }}/group_vars/all/services"
        files_matching: ".*\\.ya?ml$"
        ignore_unknown_extensions: true
        extensions: [yml, yaml]
        name: svcfiles
      tags: always

    - name: Assert svcfiles loaded
      ansible.builtin.assert:
        that:
          - svcfiles is defined
          - (svcfiles | type_debug) == 'dict'
          - (svcfiles | length) > 0
        fail_msg: "svcfiles is empty or not a dict. include_vars did not load your service files."
      tags: always

    - name: Use svcfiles as the services mapping
      ansible.builtin.set_fact:
        services: "{{ svcfiles }}"
      tags: always

    - name: Process each docker service
      ansible.builtin.include_role:
        name: docker_services
      vars:
        docker_services_service_cfg: "{{ services[item.name] | default({}) }}"
        docker_services_service_target: "{{ item.target | default(omit) }}"
        docker_services_role_prefix: "{{ item.name }}"
        docker_services_service_cfg_found: "{{ (services[item.name] is defined) | bool }}"
      loop: "{{ docker_services }}"
      loop_control:
        label: "{{ item.name }}{{ ':' ~ item.target if item.target is defined else '' }}"
      when:
        - docker_services_service_cfg_found | bool
        - ('all' in (ansible_run_tags | default([])))
          or (ansible_run_tags | length == 0)
          or (item.name in (ansible_run_tags | default([])))
          or ((item.tags | default([])) | intersect(ansible_run_tags | default([])) | length > 0)
      tags: always

    - name: Deploy all stacks
      when:
        - inventory_hostname == "localhost"
        - not (ci_mode | default(false) | bool)
      ansible.builtin.include_tasks:
        file: "{{ playbook_dir }}/roles/docker_services/helpers/deploy/deploy_all.yml"
        apply:
          tags:
            - always
      run_once: true
      tags: always
