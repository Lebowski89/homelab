---

name: Secret Scan

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forbidden-private-files:
    name: Forbidden private files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Fail if private files are tracked
        shell: bash
        run: |
          set -euo pipefail

          forbidden="$(
            git ls-files \
              | grep -E '(^|/)(vault\.yml|netbox\.yml|hosts\.ini|private\.auto\.tfvars|secrets\.auto\.tfvars|terraform\.tfstate(\..*)?|crash(\..*)?\.log)$' \
              | grep -vE '\.sample$' \
              || true
          )"

          if [ -n "$forbidden" ]; then
            echo "::error::Forbidden private files are tracked by git:"
            echo "$forbidden"
            exit 1
          fi

          echo "No forbidden private files are tracked."

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    needs:
      - forbidden-private-files

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
