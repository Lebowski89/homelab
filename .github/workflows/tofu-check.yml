---

name: OpenTofu Check

on:
  pull_request:
    paths:
      - "terraform/**/*.tf"
      - "terraform/**/*.tfvars"
      - "terraform/**/*.tftest.hcl"
      - ".github/workflows/tofu-check.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**/*.tf"
      - "terraform/**/*.tfvars"
      - "terraform/**/*.tftest.hcl"
      - ".github/workflows/tofu-check.yml"

concurrency:
  group: tofu-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tofu-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform/cloudflare/homelab
          - terraform/cloudflare/hugo
          - terraform/github/hugo
          - terraform/github/homelab
          - terraform/netbox
          - terraform/proxmox/mappings/resources
          - terraform/proxmox/settings/pve1
          - terraform/proxmox/templates/ubuntu-2404
          - terraform/proxmox/vms/postgres-cluster
          - terraform/proxmox/vms/unraid
          - terraform/seerr
          - terraform/technitium/internal-dns
          - terraform/uptime-kuma

    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.root }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2.0.2

      - name: Show version
        run: tofu version

      - name: Check formatting
        run: tofu fmt -check -recursive

      - name: Init
        run: tofu init -backend=false

      - name: Validate
        run: tofu validate
