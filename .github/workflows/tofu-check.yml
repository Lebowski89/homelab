---

name: OpenTofu Check

on:
  pull_request:
    paths:
      - "terraform/**/*.tf"
      - "terraform/**/*.tfvars"
      - "terraform/**/*.tftest.hcl"
      - ".github/workflows/tofu-check.yml"
  push:
    branches:
      - main
    paths:
      - "terraform/**/*.tf"
      - "terraform/**/*.tfvars"
      - "terraform/**/*.tftest.hcl"
      - ".github/workflows/tofu-check.yml"

permissions:
  contents: read

concurrency:
  group: tofu-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tofu-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform/cloudflare/homelab
          - terraform/cloudflare/hugo
          - terraform/github/hugo
          - terraform/netbox
          - terraform/proxmox/mappings/resources
          - terraform/proxmox/settings/pve1
          - terraform/proxmox/templates/ubuntu-2404
          - terraform/proxmox/vms/postgres-cluster
          - terraform/proxmox/vms/unraid
          - terraform/seerr
          - terraform/technitium/internal-dns
          - terraform/uptime-kuma

    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.root }}

    steps:
      - name: Checkout
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@4f92f65dc804f13090f8f642b58c212cd4d0b0a1

      - name: Show version
        run: tofu version

      - name: Check formatting
        run: tofu fmt -check -recursive

      - name: Init
        run: tofu init -backend=false

      - name: Validate
        run: tofu validate
