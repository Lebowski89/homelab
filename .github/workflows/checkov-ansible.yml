---

name: Security (Checkov Ansible)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ansible/**"
      - ".github/workflows/checkov-ansible.yml"
      - ".checkov-ansible.yml"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  checkov-ansible:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14.5"

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          python -m pip install checkov

      - name: Run Checkov Ansible scan
        run: |
          checkov \
            --directory ansible \
            --framework ansible \
            --config-file .checkov-ansible.yml \
            --output cli \
            --output sarif \
            --output-file-path console,checkov-ansible.sarif \
            --soft-fail

      - name: Upload Checkov Ansible SARIF
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: checkov-ansible.sarif
