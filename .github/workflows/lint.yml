---

name: Lint (Ansible + YAML + Python)

on:
  push:
    paths:
      - "ansible/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "ansible/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    env:
      ANSIBLE_CONFIG: ansible/ansible.cfg
      ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}/ansible/collections
      ANSIBLE_LOG_PATH: ${{ github.workspace }}/.ansible/ansible.log

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.6"

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip

          if [ -f ansible/requirements.txt ]; then
            python -m pip install -r ansible/requirements.txt
          fi

          python -m pip install ansible-core ansible-lint yamllint ruff pytest

      - name: Prepare ansible log dir
        run: mkdir -p .ansible

      - name: Install Ansible collections
        run: |
          if [ -f ansible/requirements.yml ]; then
            ansible-galaxy collection install \
              -r ansible/requirements.yml \
              -p ansible/collections \
              --force
          fi

      - name: yamllint (tracked YAML files only)
        run: |
          files=$(git ls-files '*.yml' '*.yaml')
          if [ -z "$files" ]; then
            echo "No YAML files found."
            exit 0
          fi
          yamllint $files

      - name: ruff check
        run: |
          ruff check --output-format=github \
            ansible/action_plugins \
            ansible/filter_plugins \
            ansible/library \
            ansible/roles/docker_services/filter_plugins \
            ansible/roles/podman_services/filter_plugins \
            ansible/roles/service_common/filter_plugins \
            ansible/roles/service_prepare/filter_plugins \
            ansible/roles/service_prepare/library \
            tests/unit

      - name: ruff format check
        run: |
          ruff format --check --diff \
            ansible/action_plugins \
            ansible/filter_plugins \
            ansible/library \
            ansible/roles/docker_services/filter_plugins \
            ansible/roles/podman_services/filter_plugins \
            ansible/roles/service_common/filter_plugins \
            ansible/roles/service_prepare/filter_plugins \
            ansible/roles/service_prepare/library \
            tests/unit

      - name: pytest
        run: |
          python -m pytest tests/unit

      - name: ansible-lint
        run: |
          ansible-lint --format=pep8 ansible
