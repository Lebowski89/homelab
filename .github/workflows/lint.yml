---

name: Lint (Ansible + YAML + Python)

on:
  push:
    paths:
      - "ansible/**"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "ansible/**"
      - "pyproject.toml"
      - ".github/workflows/lint.yml"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.3

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14.5"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint ruff
          if [ -f ansible/requirements.txt ]; then
            pip install -r ansible/requirements.txt
          fi

      - name: Install Galaxy requirements (if present)
        run: |
          if [ -f ansible/requirements.yml ]; then
            ansible-galaxy collection install -r ansible/requirements.yml -p ansible/collections
            ansible-galaxy role install -r ansible/requirements.yml -p ansible/roles || true
          fi

      - name: yamllint (tracked YAML files only)
        run: |
          files=$(git ls-files '*.yml' '*.yaml')
          if [ -z "$files" ]; then
            echo "No YAML files found."
            exit 0
          fi
          yamllint $files

      - name: ruff check
        run: |
          ruff check --output-format=github ansible/roles/docker_services/library

      - name: ruff format check
        run: |
          ruff format --check --diff ansible/roles/docker_services/library

      - name: Prepare ansible log dir
        run: mkdir -p .ansible

      - name: ansible-lint
        env:
          ANSIBLE_LIBRARY: ${{ github.workspace }}/ansible/roles/docker_services/library
          ANSIBLE_CONFIG: ansible/ansible.cfg
          ANSIBLE_LOG_PATH: ${{ github.workspace }}/.ansible/ansible.log
        run: |
          ansible-lint --format=pep8
