---

name: Lint (Ansible + YAML)

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint

      # Install collections/roles if you use requirements.yml
      - name: Install Ansible Galaxy requirements (if present)
        run: |
          if [ -f requirements.yml ]; then
            ansible-galaxy collection install -r requirements.yml -p collections
            ansible-galaxy role install -r requirements.yml -p roles || true
          fi

      - name: yamllint (YAML only)
        run: |
          # Only lint real YAML files, not templates (.j2) etc.
          files=$(git ls-files '*.yml' '*.yaml')
          if [ -z "$files" ]; then
            echo "No YAML files found."
            exit 0
          fi
          yamllint $files

      - name: ansible-lint
        env:
          ANSIBLE_CONFIG: ansible.cfg
        run: |
          ansible-lint -p