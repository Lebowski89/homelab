---

name: OpenTofu Docs

on:
  pull_request:
    paths:
      - "terraform/**/*.tf"
      - ".terraform-docs.yml"
      - ".github/workflows/tofu-docs.yml"
  workflow_dispatch:

concurrency:
  group: generated-docs-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  docs:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.actor != 'renovate[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Render and commit OpenTofu docs
        uses: terraform-docs/gh-actions@v1.4.1
        with:
          find-dir: terraform
          config-file: .terraform-docs.yml
          output-file: README.md
          output-method: inject
          git-push: "true"
          git-commit-message: "docs(tofu): regenerate module docs"
