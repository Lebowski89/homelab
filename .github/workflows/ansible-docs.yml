---

name: Generate Ansible Docs

on:
  push:
    branches:
      - main
    paths:
      - 'ansible/roles/**'
      - 'ansible/test/**'
      - '.github/workflows/ansible-docs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ansible-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate_docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14.5'

      - name: Install Docsible
        run: |
          python -m pip install --upgrade pip
          pip install docsible

      - name: Generate documentation for all supported roles
        run: |
          shopt -s nullglob

          for role in ansible/roles/*; do
            [ -d "$role" ] || continue
            role_name="$(basename "$role")"

            case "$role_name" in
              docker_services)
                echo "Skipping $role_name (hand-written docs)"
                continue
                ;;
            esac

            echo "Generating docs for $role"
            docsible \
              --role "$role" \
              --comments \
              --repository-url detect \
              --output README.md
          done

          README_DATE="$(TZ=Australia/Melbourne date +'%Y/%m/%d')"
          export README_DATE

          echo "Updating README generated date to ${README_DATE}"

          find ansible/roles -type f -name README.md ! -path '*/docker_services/README.md' -print0 |
            xargs -0 perl -0pi -e 's/(\|\s*Readme update\s*\|\s*)\d{4}\/\d{2}\/\d{2}(\s*\|)/$1$ENV{README_DATE}$2/g'

          echo "Removing Docsible backup files"
          find ansible/roles -type f -name 'README_backup_*.md' -delete

          echo "Checking generated docs for Mermaid graphs"
          if grep -R -E '```mermaid|graph TD|flowchart' ansible/roles/*/README.md; then
            echo "Mermaid graphs still found in generated role docs"
            exit 1
          fi

      - name: Commit updated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A ansible/roles

          if git diff --cached --quiet; then
            echo "No documentation changes to commit"
            exit 0
          fi

          git commit -m "docs(ansible): regenerate role docs"

          git pull --rebase origin main
          git push origin HEAD:main
