---

name: Generate Ansible Docs

on:
  pull_request:
    paths:
      - 'ansible/roles/**'
      - 'ansible/test/**'
      - '.github/workflows/ansible-docs.yml'
  workflow_dispatch:

concurrency:
  group: generated-docs-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate_docs:
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.actor != 'renovate[bot]' &&
      !startsWith(github.head_ref || github.ref_name, 'renovate/') &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: '3.14.6'

      - name: Install Docsible
        run: |
          python -m pip install --upgrade pip
          pip install docsible

      - name: Generate documentation for all supported roles
        run: |
          set -euo pipefail
          shopt -s nullglob

          README_DATE="$(TZ=Australia/Melbourne date +'%Y/%m/%d')"
          export README_DATE

          for role in ansible/roles/*; do
            [ -d "$role" ] || continue
            role_name="$(basename "$role")"

            readme="$role/README.md"
            before="$(mktemp)"
            before_without_date="$(mktemp)"
            after_without_date="$(mktemp)"

            if [ -f "$readme" ]; then
              cp "$readme" "$before"
            else
              touch "$before"
            fi

            echo "Generating docs for $role"
            docsible \
              --role "$role" \
              --comments \
              --repository-url detect \
              --output README.md

            # Compare README content while ignoring only the Readme update row.
            sed -E 's/(\|\s*Readme update\s*\|\s*)[0-9]{4}\/[0-9]{2}\/[0-9]{2}(\s*\|)/\1DATE_IGNORED\2/g' "$before" > "$before_without_date"
            sed -E 's/(\|\s*Readme update\s*\|\s*)[0-9]{4}\/[0-9]{2}\/[0-9]{2}(\s*\|)/\1DATE_IGNORED\2/g' "$readme" > "$after_without_date"

            if ! cmp -s "$before_without_date" "$after_without_date"; then
              echo "README content changed for $role_name; updating README date to ${README_DATE}"
              perl -0pi -e 's/(\|\s*Readme update\s*\|\s*)\d{4}\/\d{2}\/\d{2}(\s*\|)/$1$ENV{README_DATE}$2/g' "$readme"
            else
              echo "README content unchanged for $role_name; preserving existing README date"
              cp "$before" "$readme"
            fi

            rm -f "$before" "$before_without_date" "$after_without_date"
          done

          echo "Removing Docsible backup files"
          find ansible/roles -type f -name 'README_backup_*.md' -delete

          echo "Checking generated docs for Mermaid graphs"
          if grep -R -E '```mermaid|graph TD|flowchart' ansible/roles/*/README.md; then
            echo "Mermaid graphs still found in generated role docs"
            exit 1
          fi

      - name: Commit generated docs
        run: |
          set -euo pipefail

          if git diff --quiet; then
            echo "No generated doc changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ansible/roles
          git commit -m "docs(ansible): regenerate role docs"

      - name: Push generated docs
        run: |
          set -euo pipefail

          BRANCH="${{ github.head_ref || github.ref_name }}"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt} to ${BRANCH}"

            if git push origin HEAD:"${BRANCH}"; then
              exit 0
            fi

            echo "Push rejected; rebasing on latest ${BRANCH}..."
            git fetch origin "${BRANCH}"
            git rebase "origin/${BRANCH}"
          done

          echo "Failed to push generated docs after retries."
          exit 1
