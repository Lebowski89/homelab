---

name: Generate Ansible Docs

on:
  push:
    branches:
      - main
    paths:
      - 'ansible/roles/**'
      - 'ansible/test/**'
      - '.github/workflows/ansible-docs.yml'
  workflow_dispatch:

concurrency:
  group: ansible-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate_docs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@42375524fcd1f42e9d11bf7e59e9f4a432f15993
        with:
          python-version: '3.14.5'

      - name: Install Docsible
        run: |
          python -m pip install --upgrade pip
          pip install docsible==0.7.6

      - name: Generate documentation for all supported roles
        run: |
          shopt -s nullglob
          for role in ansible/roles/*; do
            [ -d "$role" ] || continue
            role_name="$(basename "$role")"

            case "$role_name" in
              docker_services)
                echo "Skipping $role_name (hand-written docs)"
                continue
                ;;
            esac

            echo "Generating docs for $role"
            docsible \
              --role "$role" \
              --comments \
              --graph \
              --repository-url detect \
              --output README.md
          done

      - name: Commit updated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add ansible/roles/**/README.md ansible/roles/**/.docsible

          if git diff --cached --quiet; then
            echo "No documentation changes to commit"
            exit 0
          fi

          git commit -m "docs(ansible): regenerate role docs"

          git pull --rebase origin main
          git push origin HEAD:main
