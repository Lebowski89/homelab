---

name: Security (Checkov)

on:
  push:
    paths:
      - ".github/workflows/**"
      - "terraform/**"
      - "opentofu/**"
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/Dockerfile"
      - "**/*.dockerfile"
      - ".checkov.yml"
      - ".github/workflows/checkov.yml"

  pull_request:
    paths:
      - ".github/workflows/**"
      - "terraform/**"
      - "opentofu/**"
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/Dockerfile"
      - "**/*.dockerfile"
      - ".checkov.yml"
      - ".github/workflows/checkov.yml"

  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  checkov:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Set up Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.14.5"

      - name: Install Checkov
        run: |
          python -m pip install --upgrade pip
          python -m pip install checkov

      - name: Run Checkov
        run: |
          checkov \
            --directory . \
            --config-file .checkov.yml \
            --output cli \
            --output sarif \
            --output-file-path console,checkov.sarif \
            --soft-fail

      - name: Upload Checkov SARIF
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@v4.36.2
        with:
          sarif_file: checkov.sarif
