---

name: Security (Checkov)

on:
  push:
    paths:
      - ".github/workflows/**"
      - "ansible/**"
      - "terraform/**"
      - "opentofu/**"
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/Dockerfile"
      - "**/*.dockerfile"
      - ".checkov.yml"
      - ".github/workflows/checkov.yml"

  pull_request:
    paths:
      - ".github/workflows/**"
      - "ansible/**"
      - "terraform/**"
      - "opentofu/**"
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/Dockerfile"
      - "**/*.dockerfile"
      - ".checkov.yml"
      - ".github/workflows/checkov.yml"

  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: checkov-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkov:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Classify Renovate container image tag-only change
        id: classify
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python scripts/ci/classify_renovate_docker_tag_only.py \
            --event-name "$GITHUB_EVENT_NAME" \
            --pr-author "$PR_AUTHOR" \
            --base-sha "$PR_BASE_SHA" \
            --head-sha "$PR_HEAD_SHA" \
            >> "$GITHUB_OUTPUT"

      - name: Renovate container image tag-only fast path
        if: fromJSON(steps.classify.outputs.renovate_docker_tag_only)
        run: echo "Checkov is not required for a proven container image tag-only Renovate change."

      - name: Set up Python
        if: ${{ !fromJSON(steps.classify.outputs.renovate_docker_tag_only) }}
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14.9"

      - name: Install Checkov
        if: ${{ !fromJSON(steps.classify.outputs.renovate_docker_tag_only) }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install checkov

      - name: Run Checkov
        if: ${{ !fromJSON(steps.classify.outputs.renovate_docker_tag_only) }}
        run: |
          checkov \
            --directory . \
            --config-file .checkov.yml \
            --output cli \
            --output sarif \
            --output-file-path console,checkov.sarif \
            --soft-fail

      - name: Prepare Checkov SARIF upload copy
        id: prepare_sarif
        if: (success() || failure()) && !fromJSON(steps.classify.outputs.renovate_docker_tag_only)
        run: |
          python - <<'PY'
          import json
          from pathlib import Path


          def explicitly_suppressed(result):
              suppressions = result.get("suppressions")
              return isinstance(suppressions, list) and bool(suppressions) and all(
                  isinstance(suppression, dict)
                  and suppression.get("kind") in ("inSource", "external")
                  and isinstance(suppression.get("justification"), str)
                  and bool(suppression["justification"].strip())
                  and (
                      suppression.get("status") == "accepted"
                      # Checkov emits this exact form for SKIPPED checks, without status.
                      or set(suppression) == {"kind", "justification"}
                  )
                  for suppression in suppressions
              )


          report = json.loads(Path("checkov.sarif").read_text(encoding="utf-8"))
          if report["version"] != "2.1.0" or not isinstance(report["runs"], list):
              raise ValueError("Expected a SARIF 2.1.0 report with runs")
          for run in report["runs"]:
              if not isinstance(run["tool"]["driver"]["name"], str) or not run["tool"]["driver"]["name"]:
                  raise ValueError("Expected a SARIF tool driver name")
              results = run["results"]
              if not isinstance(results, list) or any(
                  not isinstance(result, dict) or not isinstance(result.get("message"), dict)
                  for result in results
              ):
                  raise ValueError("Expected a SARIF results array with result messages")
              run["results"] = [result for result in results if not explicitly_suppressed(result)]

          # Keep the raw report and all run/rule metadata, even when no results remain.
          Path("checkov-upload.sarif").write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload Checkov SARIF
        if: (success() || failure()) && steps.prepare_sarif.outcome == 'success' && !fromJSON(steps.classify.outputs.renovate_docker_tag_only)
        uses: github/codeql-action/upload-sarif@v4.38.3
        with:
          sarif_file: checkov-upload.sarif
